AutoName: Rixnar
Summary: Block browsers permanently, gate social apps behind a daily credit system

Description: |-
  Rixnar is a focus enforcement app with a C++ native blocking engine.

  All browsers are permanently blocked with no unlock option. Social media,
  games, and streaming apps are credit-gated — 100 credits per day, 30
  minutes of access costs 50 credits.

  Registers as a Device Administrator. Uninstalling requires a 30-character
  master key generated during setup and shown exactly once.

  No analytics. No telemetry. No network requests. All data stays on device.

  Features:

  * 54+ browsers hard-blocked at native level
  * 60+ social and game apps credit-gated
  * Custom app lists — add any package name to either tier
  * Daily credit reset at midnight
  * Statistics calendar with immutable slip tracking
  * Signed backup and restore
  * Works on Android 11.0 and above

