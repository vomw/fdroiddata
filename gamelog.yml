Builds:
  - versionName: '1.0'
    versionCode: 11
    commit: 90394286494dd205f028a70c7b4c9db07abd2e20
    output: build/app/outputs/flutter-apk/app-release.apk
    srclibs:
      - flutter@stable
    rm:
      - ios
      - linux
      - macos
      - web
      - windows
    prebuild:
      - flutterVersion=$(sed -n -E "s/.*flutter-version:\ '(.*)'/\1/p" .github/workflows/release.yml)
      - '[[ $flutterVersion ]]'
      - .flutter/bin/flutter config --no-analytics
      - .flutter/bin/flutter pub get --enforce-lockfile
    scanignore:
      - .flutter/bin/cache
    scandelete:
      - .flutter
      - .pub-cache
    build:
      - .flutter/bin/flutter build apk --release

AutoUpdateMode: Version
UpdateCheckMode: Tags
VercodeOperation:
  - '%c * 10 + 1'
UpdateCheckData: pubspec.yaml|version:\s.+\+(\d+)|pubspec.yaml|version:\s(.+)\+
CurrentVersion: '1.0'
CurrentVersionCode: 11
