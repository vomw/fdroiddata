AutoName: Advanced Root Checker
Summary: Offline root detection, no ads, no tracking
Description: |-
  Advanced Root Checker detects root indicators on your
  Android device. All checks run entirely offline.
  No internet permission, no ads, no tracking, no analytics.

  Detects su binaries, Magisk, KernelSU, APatch, Xposed,
  LSPosed, dangerous apps, root cloaking apps and more.

  Built with pure Java, no external libraries.

