AutoName: Thirukkural Daily Widget

Summary: A beautiful, minimal daily Thirukkural flashcard widget.

Description: |
  A cross-platform daily Thirukkural flashcard widget that cycles through all 1330 Kurals, displaying one perfectly formatted Kural each day with native Tamil typography and Dr. Kalaignar's explanations.

  Features:
  * Daily rotating Thirukkural flashcards
  * Native Tamil typography
  * Dr. Kalaignar's explanations
  * Invisible background-only footprint
  * Zero-battery epoch-based cycle calculations
  * Cross-platform support

RepoType: git
Repo: https://github.com/Abez-B/thirukkural-daily-widget.git

