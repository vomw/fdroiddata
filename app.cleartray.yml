Categories:
  - Time
License: GPL-3.0-only
AuthorName: Liu Feipeng
SourceCode: https://github.com/roman10/trayzero
IssueTracker: https://github.com/roman10/trayzero/issues
Changelog: https://github.com/roman10/trayzero/releases

AutoName: Trayzero
RepoType: git
Repo: https://github.com/roman10/trayzero.git

Builds:
  - versionName: 1.0.2
    versionCode: 34
    commit: v1.0.2
    subdir: .
    submodules: true
    output: build/app/outputs/flutter-apk/app-*-release.apk
    rm:
      - ios
      - linux
      - macos
      - web
      - windows
    prebuild:
      - bash tool/foss/strip.sh
      - export PUB_CACHE=$(pwd)/.pub-cache
      - submodules/flutter/bin/flutter config --no-analytics
      - submodules/flutter/bin/flutter pub get
    scanignore:
      - submodules/flutter/bin/cache
    scandelete:
      - submodules/flutter
      - .pub-cache
    build:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - submodules/flutter/bin/flutter build apk --release --split-per-abi

AutoUpdateMode: Version v%v
UpdateCheckMode: Tags
UpdateCheckData: pubspec.yaml|version:\s.+\+(\d+)|.|version:\s(.+)\+
VercodeOperation:
  - '%c + 1000'
  - '%c + 2000'
  - '%c + 4000'
CurrentVersion: 1.0.2
CurrentVersionCode: 4034
