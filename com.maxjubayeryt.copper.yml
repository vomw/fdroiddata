AutoName: CopperLauncher
Summary: A Minecraft Java Edition launcher for Android
Description: |-
  Copper is a Minecraft: Java Edition launcher for Android based on
  PojavLauncher and Amethyst. It can launch almost all Minecraft versions
  from rd-132211 up to 1.21 snapshots, including Combat Test versions.
  Modding via Forge and Fabric is supported.

  Features:
  * Supports OpenJDK 8, 17, and 21 (ARM32, ARM64, x86, x86_64)
  * Forge and Fabric mod support
  * Sodium and Krypton Wrapper support
  * OpenAL audio support
  * Native controls system
  * Multiple rendering backends (GL4ES, MobileGlues, ANGLE)

