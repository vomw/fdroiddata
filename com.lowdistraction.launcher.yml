MaintainerNotes: |
  Built with Android Gradle Plugin 8.1.4, Gradle 8.2 and JDK 17, compileSdk 34.
  The release build type only creates a signing config when a keystore is passed
  via environment variables; with none present it falls back to the debug key,
  so the build needs no credentials and F-Droid can re-sign it as usual.
  Fastlane metadata lives in fastlane/metadata/android/en-US.
  The app declares no INTERNET permission and has no trackers; the only
  dependencies are androidx.core:core-ktx and androidx.recyclerview:recyclerview.
