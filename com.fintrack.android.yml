AutoName: FinTrack
Summary: Client for the FinTrack personal finance manager (Nextcloud app)
Description: |-
    A native Android client for FinTrack, a personal finance manager that runs
    as a Nextcloud app (https://github.com/cloudsliberty/fintrack). Track
    accounts, income, expenses, transfers, recurring bills, and budgets — all
    stored in your own Nextcloud database, under your own control.

    Features:

    * Four account types: Asset, Expense, Revenue, Liability
    * Income/expense entries with category, tags, notes, and full-text search
    * Cross-currency transfers with stored conversion rates
    * Recurring transactions (daily/weekly/bi-weekly/monthly/quarterly/yearly)
    * Category-based budgets with spend-vs-limit progress
    * Multi-currency support with a configurable base currency
    * Dashboard with net worth, cash flow, budgets vs. spending, and upcoming
      recurring transactions

    Requires a Nextcloud server with the FinTrack app
    (https://github.com/cloudsliberty/fintrack) installed and reachable from
    your device — this client has no functionality on its own and does not
    talk to any third-party service.

