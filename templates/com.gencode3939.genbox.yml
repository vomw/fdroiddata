Summary: Oyunlaştırılmış %100 çevrimdışı finansal hedef ve dijital kasa uygulaması.
Description: |-
  Gen Box, Android platformu için Jetpack Compose Material 3 mimarisiyle 
  geliştirilmiş, %100 çevrimdışı, oyunlaştırılmış bir finansal hedef ve dijital 
  kasa ekosistemidir. Hesap oluşturma zorunluluğu veya harici bulut sunucusu 
  barındırmaz. Cihaz içi yerel asistan, Bluetooth BLE ile internetsiz veri 
  aktarımı ve dinamik arayüz temaları içerir.

