      AutoName: Tideo Auto Brightness
      Summary: A glass-box replacement for Android's adaptive brightness

      Description: |-
        Tideo replaces Android's opaque adaptive brightness with deterministic,
          inspectable math: a tunable lux-to-brightness curve you can see and shape,
            smooth animated transitions, circadian (time-of-day) scaling, per-context
              overrides, and an optional privileged "super dimming" mode below the system
                minimum.

                  The core pipeline works at the BASIC tier using only the user-grantable
                    WRITE_SETTINGS permission. The optional ELEVATED tier (super dimming) requires
                      a one-time WRITE_SECURE_SETTINGS grant the user performs via adb, Shizuku, or
                        root; it is never granted automatically.

                          Requires Android 12 (API 31) or higher.

