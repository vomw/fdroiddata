Summary: Offline block placement puzzle game
Description: |
  Block Fusion is an offline block-placement puzzle game built with Kotlin
  Multiplatform and Compose Multiplatform. Players place blocks on an 8x8
  board, complete rows and columns, and compete for high scores.

  Features:
  • Cross-platform (Android & iOS) with shared Kotlin Multiplatform codebase
  • Offline gameplay with local high score persistence
  • Haptic feedback for game actions
  • Multiple visual skins and high-contrast mode
  • Progressive difficulty and record celebration notifications

