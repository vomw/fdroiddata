  AutoName: Dietzy
  Summary: Simple calorie and weight tracker

  Description: |
    Dietzy is a minimal calorie and weight tracker. No AI, no online databases,
    no bloat — just fast manual entry for users who know their numbers.

    Features include phase management (bulk/cut/maintain), Health Connect
    integration, weight trends, calorie history graphs, and data backup/restore.

    All data is stored locally on your device.

