Categories:
  - Internet
License: AGPL-3.0-or-later
AuthorName: Redder Labs
SourceCode: https://github.com/RedderLabs/spider-privacy-browser
IssueTracker: https://github.com/RedderLabs/spider-privacy-browser/issues

AutoName: SpyderBrowser

RepoType: git
Repo: https://github.com/RedderLabs/spider-privacy-browser.git

Builds:
  - versionName: 0.0.16
    versionCode: 16
    commit: v0.0.16
    subdir: apps/mobile/android/app
    sudo:
      - apt-get update
      - apt-get install -y npm
    init: cd ../../../.. && npm ci
    gradle:
      - standard
    output: build/outputs/apk/standard/release/app-standard-release.apk
    prebuild:
      - sed -i '/maven.mozilla.org/d' ../build.gradle
      - sed -i '/geckoImplementation/d' build.gradle
      - sed -i '/jvmTarget\|JavaVersion/s/17/21/' build.gradle
      - sed -i '/^android {/a\    dependenciesInfo { includeInApk false; includeInBundle
        false }' build.gradle
      - sed -i '/jvmToolchain\|JavaVersion/s/17/21/' ../../../../node_modules/@react-native/gradle-plugin/*/build.gradle.kts
        ../../../../node_modules/@react-native/gradle-plugin/react-native-gradle-plugin/src/main/kotlin/com/facebook/react/utils/JdkConfiguratorUtils.kt
      - cd ../.. && node ../../node_modules/@react-native-community/cli/build/bin.js
        config > android/rn-autolink.json && echo "AUTOLINK_SIZE=$(wc -c < android/rn-autolink.json)"
        && cd android/app
      - sed -i 's#autolinkLibrariesFromCommand()#autolinkLibrariesFromConfigFile(new
        File(ex.settings.rootDir, "rn-autolink.json"))#' ../settings.gradle
      - echo "fdroidUniversal=true" >> ../gradle.properties
    scanignore:
      - node_modules/@react-native-async-storage/async-storage/android/build.gradle
      - node_modules/react-native-safe-area-context/android/build.gradle
      - node_modules/react-native-screens/android/build.gradle
      - node_modules/react-native-view-shot/android/build.gradle
      - node_modules/react-native-webview/android/build.gradle
      - node_modules/react-native/sdks/hermesc/linux64-bin/hermesc
    scandelete:
      - node_modules
    ndk: 27.1.12297006

AutoUpdateMode: Version
UpdateCheckMode: Tags
CurrentVersion: 0.0.16
CurrentVersionCode: 16
