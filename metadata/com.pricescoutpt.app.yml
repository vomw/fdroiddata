MaintainerNotes: |-
  React Native/Expo app built following templates/build-react-native.yml:
  Expo modules are built from source (autolinking buildFromSource) so no local
  Maven repos are needed, the React Native Gradle plugin is patched to use
  JDK 21 (buildserver default) instead of 17, node_modules is scandeleted, and
  the Gradle files referencing local Maven repos are scanignored.

  ABI split: one build block per ABI, controlled with the
  reactNativeArchitectures Gradle property; the versionCode is set per ABI
  with the abiVersionCode Gradle property read by the androidComponents hook
  in app/build.gradle (10 * %c + 1..4, per the F-Droid ABI split guide).

  The app is a client for a self-hosted backend, so no production endpoint is
  baked into the F-Droid build. Since commit db615647 the API base URL is
  resolved at runtime (build-time extra > user setting in AsyncStorage >
  __DEV__ localhost only) and never falls back to the emulator alias
  (10.0.2.2). Without a configured endpoint, a setup screen blocks first use
  until the user provides a self-hosted server URL (settings panel allows
  changing it later), so the app is fully usable from F-Droid.

