WebSite: https://mudlej.com/projects/mj-pdf
SourceCode: https://gitlab.com/mudlej_android/mj_pdf_reader
IssueTracker: https://gitlab.com/mudlej_android/mj_pdf_reader/-/issues

AutoName: MJ PDF

RepoType: git
Repo: https://gitlab.com/mudlej_android/mj_pdf_reader.git

Builds:
  - versionName: 3.1.0
    versionCode: 1058
    commit: V3.1.0
    sudo:
      - apt-get update
      - apt-get install -y python3 python3-requests git curl pkg-config cmake ninja-build
        gcc g++ libc-dev make
    gradle:
      - yes
    output: app/build/outputs/apk/release/app-armeabi-v7a-release-unsigned.apk
    build:
      - export ANDROID_NDK=$$NDK$$
      - export ANDROID_NDK_ROOT=$$NDK$$
      - python3 build_dependencies.py --pdfium from-source --abi armeabi-v7a
    ndk: r28c
    gradleprops:
      - fdroidAbi=armeabi-v7a

