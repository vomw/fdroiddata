Builds:
  - versionName: 3.1.0
    versionCode: 5801
    commit: 4c43fe2ca68abc74a03143e46b999a3558c1cf62
    subdir: app
    sudo:
      - apt-get update
      - apt-get install -y python3 python3-requests git curl pkg-config cmake ninja-build
        gcc g++ libc-dev make
    gradle:
      - yes
    prebuild: sed -i 's/offset \* 1000 + android\.defaultConfig\.versionCode/$$VERCODE$$/'
      build.gradle
    build:
      - export ANDROID_NDK=$$NDK$$
      - export ANDROID_NDK_ROOT=$$NDK$$
      - cd .. && python3 build_dependencies.py --pdfium from-source --abi armeabi-v7a
    ndk: r28c
    gradleprops:
      - fdroidAbi=armeabi-v7a

