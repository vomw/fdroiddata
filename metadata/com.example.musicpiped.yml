AutoName: YMusic
Summary: Your Ultimate YouTube Music Companion
Description: |-
  YMusic is a modern, open-source music streaming application built with Jetpack Compose.
  It brings the vast world of YouTube Music directly to your fingertips without ads or interruptions.

  Features:
  * Lossless-Prioritized Streaming (Opus > M4A > MP3)
  * Uninterrupted Background Play
  * Micro-Second Buffering with 60-second caching
  * Real-time audio visualizers
  * Liquid-Smooth Scrolling optimized for 120Hz displays
  * Dynamic Material You theming
  * Seamless Downloads for offline playback
  * Hybrid Playback (switch between streaming and local files)

