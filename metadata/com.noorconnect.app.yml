Builds:
  - versionName: 1.2.0
    versionCode: 4
    commit: 04e809c1989abd38ef7a9b12d2649f3ce7b39449
    subdir: android/app
    sudo:
      - apt-get update
      - apt-get install -y npm
    gradle:
      - yes
    prebuild:
      - cd ../..
      - npm install
    build:
      - pushd ../..
      - npm run build
      - npx cap sync android
      - popd
    scandelete:
      - node_modules

