AuthorName: Kyle Freed
AuthorEmail: kylefreed19@gmail.com

License: GPL-3.0-or-later
SourceCode: https://gitlab.com/kj7qlv/mahjongscore
IssueTracker: https://gitlab.com/kj7qlv/mahjongscore/issues

AutoName: Mahjong Scoring Compass

RepoType: git
Repo: https://gitlab.com/kj7qlv/mahjongscore.git

Builds:
  - versionName: 1.0.1
    versionCode: 5
    commit: 44a60e98071aa5647c5ebaf5fd7502f96cfff1b2
    output: build/app/outputs/flutter-apk/app-release.apk
    srclibs:
      - flutter@3.41.2
    rm:
      - ios
      - linux
      - macos
      - web
      - windows
    prebuild:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter packages pub get
    scandelete:
      - .pub-cache
    build:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter build apk

AutoUpdateMode: Version
UpdateCheckMode: Tags
UpdateCheckData: pubspec.yaml|version:\s.+\+(\d+)|.|version:\s(.+)\+
CurrentVersion: 1.0.1
CurrentVersionCode: 5
