Categories:
  - Launcher
License: MIT
AuthorName: Robotmind
SourceCode: https://github.com/robotmindbot/luncher
IssueTracker: https://github.com/robotmindbot/luncher/issues
Description: |-
  Luncher is a minimal Android home screen with a searchable list of installed
  apps.

  * Search installed apps by name or alias.
  * Set home screen shortcuts and aliases.
  * Optionally show the next calendar event with configurable title filters.

  App discovery uses QUERY_ALL_PACKAGES so the launcher can list installed
  apps. Calendar access is optional and requested only when its setting is
  enabled. There are no ads, analytics, or crash reporting.
RepoType: git
Repo: https://github.com/robotmindbot/luncher
Builds:
  - versionName: 1.0.0
    versionCode: 11
    commit: 554d66f785862e12af80f3357703151abbe0541b
    sudo:
      - apt-get update
      - apt-get install -y npm openjdk-21-jdk-headless
    init:
      - npm ci --no-audit --no-fund
      - find node_modules -type d -name local-maven-repo -prune -exec rm -rf '{}' +
    output: android/app/build/outputs/apk/release/app-armeabi-v7a-release-unsigned.apk
    prebuild:
      - sed -i '/jvmToolchain\|JavaVersion/s/17/21/' node_modules/@react-native/gradle-plugin/*/build.gradle.kts
        node_modules/@react-native/gradle-plugin/react-native-gradle-plugin/src/main/kotlin/com/facebook/react/utils/JdkConfiguratorUtils.kt
      - npx expo prebuild --platform android --clean --no-install
      - sed -i '/signingConfig /d' android/app/build.gradle
      - sed -i '/^android {/a\    splits {\n        abi {\n            reset()\n            enable true\n            universalApk
        false\n            include \"armeabi-v7a\", \"arm64-v8a\", \"x86\", \"x86_64\"\n        }\n    }'
        android/app/build.gradle
    scanignore:
      - node_modules/@react-native-async-storage/async-storage/android/build.gradle
      - node_modules/react-native/ReactAndroid/publish.gradle
      - node_modules/react-native-safe-area-context/android/build.gradle
      - node_modules/react-native-screens/android/build.gradle
      - node_modules/react-native-edge-to-edge/android/build.gradle
      - node_modules/react-native-localize/android/build.gradle
      - node_modules/react-native-reanimated/android/build.gradle
      - android/build.gradle
      - node_modules/react-native/sdks/hermesc/linux64-bin/hermesc
      - node_modules/expo-modules-autolinking/scripts/android/autolinking_implementation.gradle
      - node_modules/expo-modules-core/android/ExpoModulesCorePlugin.gradle
    scandelete:
      - node_modules
    build: cd android && NODE_ENV=production gradle assembleRelease -PreactNativeArchitectures=armeabi-v7a
    forcevercode: true
