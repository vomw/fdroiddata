Summary: Powerful video and audio downloader with a fluid interface
Description: |-
    Omni is a modern media downloader and player for Android.
    It supports high-quality video/audio extraction from hundreds of sites
    using yt-dlp and FFmpeg.

    Features:
    * Material You "Liquid" interface
    * High-quality downloads (up to 4K)
    * Built-in player with Picture-in-Picture
    * Powerful library and favorites management

