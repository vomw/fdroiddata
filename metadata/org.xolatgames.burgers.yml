Builds:
  - versionName: 1.4.1
    versionCode: 2
    commit: 565d6ad2a9f286a56dce7d4880b0caed0355c650
    sudo:
      - apt-get update
      - apt-get install clang gettext pkg-config scons -y
    srclibs:
      - Godot@4.6.3-stable
    build:
      - export JAVA_HOME=$(dirname $(dirname $(readlink -f $(which javac))))
      - mv $$Godot$$ godot
      - keytool -v -genkey -keystore burgers.keystore -storepass burgers -alias burgers -keypass burgers -keyalg RSA -validity 3650
      - mkdir -p .config/godot/
      - cat << EOF > temp_snippet.txt
[gd_resource type="EditorSettings" format=3]

[resource]
export/android/android_sdk_path = "$$SDK$$"
export/android/java_sdk_path = "$JAVA_HOME"
export/android/debug_keystore = "burgers.keystore"
export/android/debug_keystore_user = "burgers"
export/android/debug_keystore_pass = "burgers"
EOF
      - cat temp_snippet.txt >> .config/godot/editor_settings-4.6.tres
      - rm temp_snippet.txt
      - cd godot/
      - scons -j `nproc` platform=server use_llvm=yes unix_global_settings_path=".."
        profile=fdroid/custom.py
      - scons -j `nproc` use_llvm=yes p=android target=release  unix_global_settings_path=".."
        android_arch=arm64v8 profile=fdroid/custom.py
      - pushd platform/android/java
      - gradle generateGodotTemplates
      - popd
      - cd ../
      - export EXPORT_TEMPLATES=".local/share/godot/export_templates/4.6.3.stable/"
      - mkdir -p "${EXPORT_TEMPLATES}"
      - echo "4.6.3.stable" > "${EXPORT_TEMPLATES}/version.txt"
      - cp godot/bin/android_release.apk "${EXPORT_TEMPLATES}"
      - .godot/bin/godot_server.* -v --path . --export Android Battle-for-Burgers.apk
    ndk: 28.1.13356709

