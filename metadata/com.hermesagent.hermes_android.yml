Binaries: 
  https://github.com/rusty4444/hermes-android/releases/download/v%v/app-arm64-v8a-release.apk

Builds:
  - versionName: 2.1.5
    versionCode: 21451
    commit: bea15ad07762a4a73c4afe3ee95e6a87c6db2d37
    sudo:
      - mkdir -p /home/runner/work/hermes-android
      - rm -rf /home/runner/work/hermes-android/hermes-android
      - chown vagrant -R /home/runner/work
    output: build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
    binary: 
      https://github.com/rusty4444/hermes-android/releases/download/v%v/app-armeabi-v7a-release.apk
    srclibs:
      - flutter@stable
    rm:
      - ios
    prebuild:
      - flutterVersion=$(sed -n -E "s/.*flutter-version:\ '(.*)'/\1/p" .github/workflows/release.yml)
      - '[[ $flutterVersion ]]'
      - git -C $$flutter$$ checkout -f "$flutterVersion"
      - export repo=/home/runner/work/hermes-android/hermes-android
      - cd ..
      - mv com.hermesagent.hermes_android $repo
      - pushd $repo
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get --enforce-lockfile
      - popd
      - mv $repo com.hermesagent.hermes_android
    scandelete:
      - .pub-cache
    build:
      - export repo=/home/runner/work/hermes-android/hermes-android
      - cd ..
      - mv com.hermesagent.hermes_android $repo
      - pushd $repo
      - export PUB_CACHE=$(pwd)/.pub-cache
      - sed -i -e 's/-Wl,/-Wl,--build-id=none,/' .pub-cache/hosted/pub.dev/jni-1.0.0/src/CMakeLists.txt
      - $$flutter$$/bin/flutter build apk --release --split-per-abi --target-platform="android-arm"
        --split-debug-info=symbols
      - popd
      - mv $repo com.hermesagent.hermes_android

