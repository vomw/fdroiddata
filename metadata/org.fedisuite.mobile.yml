License: GPL-3.0-only
AuthorName: Christin Löhner
AuthorWebSite: https://www.fedisuite.com
WebSite: https://www.fedisuite.com
SourceCode: https://github.com/christinloehner/FediSuite-Android-App
IssueTracker: https://github.com/christinloehner/FediSuite-Android-App/issues
Changelog: https://github.com/christinloehner/FediSuite-Android-App/blob/main/CHANGELOG.md

RepoType: git
Repo: https://github.com/christinloehner/FediSuite-Android-App.git

Builds:
  - versionName: 0.9.13
    versionCode: 913
    commit: v0.9.13
    subdir: android/app
    sudo:
      - apt-get update
      - apt-get install -y npm
    gradle:
      - yes
    prebuild:
      - sed -i '/org.gradle.java.home/d' ../gradle.properties
      - cd ../..
      - npm ci
      - sed -i '/jvmToolchain/s/17/21/g' 
        node_modules/@react-native/gradle-plugin/react-native-gradle-plugin/build.gradle.kts
      - sed -i '/jvmToolchain/s/17/21/g' node_modules/@react-native/gradle-plugin/settings-plugin/build.gradle.kts
      - sed -i '/jvmToolchain/s/17/21/g' node_modules/@react-native/gradle-plugin/shared/build.gradle.kts
      - sed -i '/jvmToolchain/s/17/21/g' node_modules/@react-native/gradle-plugin/shared-testutil/build.gradle.kts
      - sed -i '/jvmToolchain/s/17/21/g' node_modules/@react-native/gradle-plugin/build.gradle.kts
      - sed -i 
        's/project.kotlinExtension.jvmToolchain(17)/project.kotlinExtension.jvmToolchain(21)/g'
        node_modules/@react-native/gradle-plugin/react-native-gradle-plugin/src/main/kotlin/com/facebook/react/utils/JdkConfiguratorUtils.kt
      - sed -i -e '/"expo":\ {/a "autolinking":{"android":{"buildFromSource":[".*"]}},'
        package.json
    scanignore:
      - node_modules/hermes-compiler/hermesc/linux64-bin/hermesc
      - node_modules/expo-modules-core/android/ExpoModulesCorePlugin.gradle
      - node_modules/@react-native-async-storage/async-storage/android/build.gradle
      - node_modules/react-native-safe-area-context/android/build.gradle
      - node_modules/react-native-screens/android/build.gradle
      - node_modules/expo-modules-autolinking/scripts/android/autolinking_implementation.gradle
    scandelete:
      - node_modules

AutoUpdateMode: None
UpdateCheckMode: Static
CurrentVersion: 0.9.13
CurrentVersionCode: 913
