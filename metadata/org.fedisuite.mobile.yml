AutoName: FediSuite
Summary: Manage, schedule and analyze your Fediverse accounts with FediSuite
Description: |
  FediSuite is a mobile client for the FediSuite Fediverse management platform.

  It connects to a specific FediSuite instance chosen by the user. This can be
  the official hosted instance at app.fedisuite.com or a self-hosted FediSuite
  instance.

  Features include:

  * secure login with instance-scoped sessions
  * mobile dashboard and account summaries
  * account analytics and insights
  * queue management for scheduled, draft, published and failed posts
  * composer with media support and scheduling
  * connected account management
  * mobile preferences for theme, language, timezone and default account

  The app is designed as a touch-first Android experience with bottom tabs,
  card-based screens and explicit loading, empty and error states.

RepoType: git
Repo: https://github.com/christinloehner/FediSuite-Android-App.git

Builds:
  - versionName: 0.9.10
    versionCode: 1
    commit: v0.9.10
    subdir: android
    sudo:
      - apt-get update
      - apt-get install -y nodejs npm openjdk-21-jdk-headless
    init:
      - cd ..
      - npm ci
      - npm install --no-save @react-native-community/javascriptcore
      - sed -i 's/^hermesEnabled=true$/hermesEnabled=false/' android/gradle.properties
      - grep -q '^useThirdPartyJSC=true$' android/gradle.properties || printf '\nuseThirdPartyJSC=true\n' >> android/gradle.properties
      - >-
        python3 -c 'from pathlib import Path; main_app = Path("android/app/src/main/java/org/fedisuite/mobile/MainApplication.kt"); text = main_app.read_text(); text = text if "io.github.reactnativecommunity.javascriptcore.JSCRuntimeFactory" in text else text.replace("import expo.modules.ApplicationLifecycleDispatcher\n", "import expo.modules.ApplicationLifecycleDispatcher\nimport io.github.reactnativecommunity.javascriptcore.JSCRuntimeFactory\n"); old_host = "    ExpoReactHostFactory.getDefaultReactHost(\n      context = applicationContext,\n      packageList =\n        PackageList(this).packages.apply {\n          // Packages that cannot be autolinked yet can be added manually here, for example:\n          // add(MyReactNativePackage())\n        }\n    )"; new_host = "    ExpoReactHostFactory.getDefaultReactHost(\n      context = applicationContext,\n      packageList =\n        PackageList(this).packages.apply {\n          // Packages that cannot be autolinked yet can be added manually here, for example:\n          // add(MyReactNativePackage())\n        },\n      jsRuntimeFactory = JSCRuntimeFactory()\n    )"; text = text.replace(old_host, new_host); main_app.write_text(text); expo_factory = Path("node_modules/expo/android/src/main/java/expo/modules/ExpoReactHostFactory.kt"); text = expo_factory.read_text(); text = text.replace("    private val hostHandlers: List<ReactNativeHostHandler>\n  ) : ReactHostDelegate {", "    private val hostHandlers: List<ReactNativeHostHandler>,\n    private val concreteJsRuntimeFactory: JSRuntimeFactory? = null\n  ) : ReactHostDelegate {"); text = text.replace("    override val jsRuntimeFactory: JSRuntimeFactory\n      get() = HermesInstance()", "    override val jsRuntimeFactory: JSRuntimeFactory\n      get() = concreteJsRuntimeFactory ?: HermesInstance()"); text = text.replace("        hostHandlers = hostHandlers\n      )", "        hostHandlers = hostHandlers,\n        concreteJsRuntimeFactory = jsRuntimeFactory\n      )"); expo_factory.write_text(text)'
      - sed -i '/ReactAndroid::jsctooling/d' node_modules/react-native-worklets/android/CMakeLists.txt
      - find node_modules/@react-native/gradle-plugin -name '*.gradle.kts' -exec sed -i 's/jvmToolchain(17)/jvmToolchain(21)/g' {} +
      - sed -i 's/project.kotlinExtension.jvmToolchain(17)/project.kotlinExtension.jvmToolchain(21)/g' node_modules/@react-native/gradle-plugin/react-native-gradle-plugin/src/main/kotlin/com/facebook/react/utils/JdkConfiguratorUtils.kt
      - >-
        sed -i "/apply plugin: 'kotlin-android'/a
        tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach
        { kotlinOptions.jvmTarget = '17' }"
        node_modules/react-native-safe-area-context/android/build.gradle
      - npm run sync-version
    prebuild:
      - gradle clean
    output: app/build/outputs/apk/release/org.fedisuite.mobile-$$VERSION$$.apk
    scanignore:
      - node_modules/expo-modules-core/android/ExpoModulesCorePlugin.gradle
      - node_modules/@react-native-async-storage/async-storage/android/build.gradle
      - node_modules/react-native-safe-area-context/android/build.gradle
      - node_modules/react-native-screens/android/build.gradle
      - node_modules/expo-clipboard/local-maven-repo
      - node_modules/expo-image-loader/local-maven-repo
      - node_modules/expo-image-picker/local-maven-repo
      - node_modules/expo-linking/local-maven-repo
      - node_modules/expo-localization/local-maven-repo
      - node_modules/expo-secure-store/local-maven-repo
      - node_modules/expo-system-ui/local-maven-repo
      - node_modules/expo/node_modules/@expo/log-box/node_modules/@expo/dom-webview/local-maven-repo
      - node_modules/expo/node_modules/expo-asset/local-maven-repo
      - node_modules/expo/node_modules/expo-file-system/local-maven-repo
      - node_modules/expo/node_modules/expo-font/local-maven-repo
      - node_modules/expo/node_modules/expo-keep-awake/local-maven-repo
    scandelete:
      - node_modules
    build:
      - gradle assembleRelease

MaintainerNotes: |
  Initial packaging recipe for the Expo/React-Native Android app.

  The Android build needs Node.js/npm in addition to Gradle because the release
  build embeds the JavaScript bundle via Expo/React Native.

  Hermes is disabled in the F-Droid build recipe because the prebuilt
  `node_modules/hermes-compiler/.../hermesc` executable fails to start in the
  build environment. The build uses JSC instead.

  The F-Droid recipe installs `@react-native-community/javascriptcore`,
  enables `useThirdPartyJSC=true`, and patches the Expo ReactHost wiring so the
  Android build uses the third-party JSC runtime consistently.

  Version information is read from the plain-text file `version`.

  The upstream project currently keeps `versionCode` in
  `android/app/build.gradle` at `1`, so future updates will require explicit
  upstream versionCode bumps in addition to versionName/tag updates.

