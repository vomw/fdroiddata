        Name: StedNet Lock
        Description: |-
          StedNet-Lock is a Shizuku-powered network switcher and profile manager
            for Android. It allows users to toggle network modes (such as forcing
              5G, 4G, or Auto-mode) and manage customized profiles securely without
                requiring root.

                  Features:
                    * Toggle between Auto, 5G, and 4G network modes
                      * Create and apply customized network profiles
                        * Quick home screen widgets
                          * Runs securely via Shizuku API

