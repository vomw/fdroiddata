MaintainerNotes: "The FOSS build is the bare assembleRelease (gradle: [yes]); the
  -Pgoogle project property selects a Firebase/Play-Services variant that is not built
  for F-Droid. All non-FOSS coordinates (the google-services + firebase-crashlytics
  plugins, Crashlytics config, and firebase-* deps) live in one file, gradle/google-services.gradle.kts,
  which is applied only under -Pgoogle; the bare build compiles zero Firebase. prebuild
  removes that file (relative to the app subdir) so the scanner never sees it and
  it can't be built; this does not affect the FOSS build, which never applies it."

