AutoName: Kill My Apps
Summary: Kill background processes to save battery & boost performance with Root/Shizuku
Description: |-
  KillMyApps is a lightweight utility designed to terminate background processes, helping extend battery life, improve gaming performance, and free up system resources. It also helps reduce intrusive notifications, unwanted background activity, tracking and telemetry.

  <b>Important:</b>
  The KILL feature requires Root or Shizuku access to operate. Without it, you can still use the app, but you'll need to manually kill running apps by tapping on each one and selecting the Force Stop option. You can change your preferred mode between Root and Shizuku anytime in the app settings.

  <b>Features:</b>
  * ⚡ <b>One-Tap Kill:</b> Terminate all running apps instantly with a single tap.
  * 🔰 <b>Killer Mode:</b> Support Root and Shizuku for an automated app termination process.
  * 🛡️ <b>Source Mode:</b> Categorize apps by User, Launchable, or System processes, backed by customizable critical app protections.
  * 🔎 <b>Selection Mode:</b> Flexible app targeting between Exclude and Include modes.
  * ⏰ <b>Auto Killer:</b> Schedule automatic process termination when your screen turns off (with customizable delay) or at a fixed daily time.
  * 🫧 <b>Quick Settings Tile:</b> Kill running apps directly from your notification panel without even opening the app.
  * 🧩 <b>Home Screen Widgets:</b> Instantly terminate background processes right from your home screen using app widgets.
  * 🔋 <b>Save Battery:</b> Reduce battery usage by stopping unnecessary background activities.
  * 🚀 <b>Boost Performance:</b> Free up RAM and CPU for high-demand tasks like gaming.
  * 🔒 <b>Enhance Privacy:</b> Eliminate unnecessary background activity, tracking and telemetry.
  * 🍃 <b>Clean UI:</b> Simple and intuitive Material Design interface.

