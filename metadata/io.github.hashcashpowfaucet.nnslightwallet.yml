AuthorName: Hashcash-PoW-Faucet
AuthorWebSite: https://github.com/Hashcash-PoW-Faucet

WebSite: https://996coin.com/
SourceCode: https://github.com/Hashcash-PoW-Faucet/996-Coin-Mobile-Client
IssueTracker: https://github.com/Hashcash-PoW-Faucet/996-Coin-Mobile-Client/issues

AutoName: 996-Coin Mobile Wallet

RepoType: git
Repo: https://github.com/Hashcash-PoW-Faucet/996-Coin-Mobile-Client.git

Builds:
  - versionName: 1.1.2
    versionCode: 5
    commit: 0bae19bbb7266b4eda92e79e1a114b0f3a2a0775
    output: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
    srclibs:
      - flutter@stable
    rm:
      - ios
      - linux
      - macos
      - web
      - windows
    prebuild:
      - flutterVersion=$(sed -n -E "s/.*flutter-version:\ '(.*)'/\1/p" .github/workflows/release.yml)
      - '[[ $flutterVersion ]]'
      - git -C $$flutter$$ checkout -f $flutterVersion
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get
    scandelete:
      - .pub-cache
    build:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter build apk --release --split-per-abi --target-platform=android-arm64

AutoUpdateMode: Version
UpdateCheckMode: Tags
UpdateCheckData: pubspec.yaml|version:\s.+\+(\d+)|.|version:\s(.+)\+
CurrentVersion: 1.1.2
CurrentVersionCode: 5
