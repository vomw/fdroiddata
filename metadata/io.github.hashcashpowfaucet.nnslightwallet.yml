IssueTracker: https://github.com/Hashcash-PoW-Faucet/996-Coin-Mobile-Client/issues

AutoName: 996-Coin Mobile Wallet

RepoType: git
Repo: https://github.com/Hashcash-PoW-Faucet/996-Coin-Mobile-Client.git

Builds:
  - versionName: 1.1.0
    versionCode: 3
    commit: dbd7be74511db163e828d71268863df58feee0d5
    output: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
    srclibs:
      - flutter@stable
    rm:
      - ios
      - linux
      - macos
      - web
      - windows
    prebuild:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $flutter$/bin/flutter config --no-analytics
      - $flutter$/bin/flutter pub get
    scanignore:
      - .pub-cache
      - $flutter$/bin/cache
    scandelete:
      - .pub-cache
    build:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $flutter$/bin/flutter build apk --release --split-per-abi --target-platform=android-arm64

AutoUpdateMode: Version
UpdateCheckMode: Tags
UpdateCheckData: pubspec.yaml|version:\s.+\+(\d+)|.|version:\s(.+)\+
CurrentVersion: 1.1.0
CurrentVersionCode: 3
