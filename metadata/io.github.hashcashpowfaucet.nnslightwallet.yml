AutoName: 996-Coin Mobile Wallet
Summary: Light wallet for 996-Coin with local signing
Description: |
  996-Coin Mobile Wallet is a simple light wallet for 996-Coin (NNS), built with Flutter.

  The wallet is designed for everyday community use and keeps private keys on the device.
  Transactions are created and signed locally in the app.

  Features include:

  * Create a new wallet locally
  * Import an existing wallet
  * PIN protection and optional biometric unlock
  * View address, balance, and transaction history
  * Build, sign, test, and broadcast transactions locally
  * Address book support
  * QR scanning on supported mobile devices
  * Encrypted wallet backup export and restore

