Summary: Version minimalista de busqueda y reproduccion de musica compatible con Android Auto
Description: Esta aplicacion es un motor de busqueda de musica en youtube. El funcionamiento es muy facil: creas una o varias listas, buscas canciones y las guardas en la lista que quieras. En funcion de si has seleccionado la descarga de las canciones en las opciones, el programa inicia la descarga de la cancion una vez introducida en una lista. Si no permites la descarga la reproduccion sera online. La idea es que añadas canciones bajo wifi y puedas usar la reproduccion offline para evitar consumo de datos moviles. Las canciones en la lista se pueden ordenar (pinchar y arrastrar) y borrar (pulsacion larga). He hecho esta aplicacion muy simple porque estaba cansado de tener que moverme por menus en otras aplicaciones en la pantalla de Android Auto. Aqui solo veras las listas de reproduccion y sus canciones. A disfrutar de tu musica 
