Summary: Version minimalista de búsqueda y reproducción de música compatible con Android Auto
Description: |
  Esta aplicación es un motor de búsqueda de música en YouTube.
  El funcionamiento es muy sencillo: creas una o varias listas, buscas canciones y las guardas en la lista que quieras.
  Si has activado la descarga en las opciones, la aplicación descargará la canción automáticamente.
  Si no permites la descarga, la reproducción será online.
  La idea es que añadas canciones bajo WiFi y luego puedas reproducirlas offline para evitar consumo de datos móviles.
  Las canciones se pueden ordenar (arrastrar) y borrar (pulsación larga).
  La interfaz es muy simple para facilitar su uso en Android Auto.
