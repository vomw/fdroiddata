AntiFeatures:
  NonFreeNet:
    en-US: Depends on the proprietary Resend email service.
  TetheredNet:
    en-US: Only works with the Resend service and cannot be pointed to an alternative
      server.
Categories:
  - Email
  - Internet
License: MIT
AuthorName: CGH0S7
SourceCode: https://github.com/CGH0S7/remail
IssueTracker: https://github.com/CGH0S7/remail/issues

AutoName: Remail

RepoType: git
Repo: https://github.com/CGH0S7/remail.git

Builds:
  - versionName: 1.0.1
    versionCode: 1001
    commit: v1.0.1
    output: build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
    srclibs:
      - flutter@3.41.4
    rm:
      - ios
      - macos
      - linux
      - windows
      - web
    prebuild:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get
    scandelete:
      - .pub-cache
    build:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter build apk --release --split-per-abi --target-platform=android-arm

  - versionName: 1.0.1
    versionCode: 2001
    commit: v1.0.1
    output: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
    srclibs:
      - flutter@3.41.4
    rm:
      - ios
      - macos
      - linux
      - windows
      - web
    prebuild:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get
    scandelete:
      - .pub-cache
    build:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter build apk --release --split-per-abi --target-platform=android-arm64

  - versionName: 1.0.1
    versionCode: 4001
    commit: v1.0.1
    output: build/app/outputs/flutter-apk/app-x86_64-release.apk
    srclibs:
      - flutter@3.41.4
    rm:
      - ios
      - macos
      - linux
      - windows
      - web
    prebuild:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get
    scandelete:
      - .pub-cache
    build:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter build apk --release --split-per-abi --target-platform=android-x64

AutoUpdateMode: Version
UpdateCheckMode: Tags ^v[\d.]+$
VercodeOperation:
  - 1000 + %c
  - 2000 + %c
  - 4000 + %c
UpdateCheckData: pubspec.yaml|version:\s.+\+(\d+)|.|version:\s(.+)\+
CurrentVersion: 1.0.1
