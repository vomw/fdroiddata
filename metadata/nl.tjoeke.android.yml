AutoName: Tjoeke
Description: |
  Tjoeke shows upcoming train departures for your regular route in the
  Netherlands. Pick two stations and see the next trains in both directions
  at a glance.

  Features:
  * Forward and backward departures on one screen
  * Station search with autocomplete
  * Intercity-only filter
  * Off-peak (daluren) discount indicator
  * Three themes: light, dark, and high-contrast (e-ink friendly)
  * Auto-refresh every 2 minutes
  * Tiny app, minimal permissions (internet only)

  Tjoeke uses the NS (Dutch Railways) API via a lightweight proxy.
  No account needed, no tracking, no ads.

