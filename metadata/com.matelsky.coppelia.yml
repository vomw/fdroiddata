Categories:
  - Multimedia
License: Apache-2.0
AuthorName: Jordan Matelsky
AuthorEmail: coppelia@matelsky.com
AuthorWebSite: https://jordan.matelsky.com
WebSite: https://blog.jordan.matelsky.com/coppelia/
SourceCode: https://github.com/j6k4m8/coppelia
IssueTracker: https://github.com/j6k4m8/coppelia/issues
Changelog: https://github.com/j6k4m8/coppelia/releases

AutoName: Coppelia

RepoType: git
Repo: https://github.com/j6k4m8/coppelia.git

Builds:
  - versionName: 0.0.15
    versionCode: 15
    commit: 8ca8296714e9072bd4eef06fd92600100e30dddd
    output: build/app/outputs/flutter-apk/app-release.apk
    srclibs:
      - flutter@stable
    rm:
      - docs
      - ios
      - linux
      - macos
      - website
    prebuild:
      - flutterVersion=$(sed -n -E "s/.*FLUTTER_VERSION:\ '(.*)'/\1/p" .github/workflows/release.yml)
      - '[[ $flutterVersion ]]'
      - git -C $$flutter$$ checkout -f "$flutterVersion"
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get
    scandelete:
      - .pub-cache
    build:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter build apk --release

AutoUpdateMode: Version
UpdateCheckMode: Tags
UpdateCheckData: pubspec.yaml|version:\s.+\+(\d+)|.|version:\s(.+)\+
CurrentVersion: 0.0.15
CurrentVersionCode: 15
