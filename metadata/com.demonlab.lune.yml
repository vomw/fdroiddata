Summary: Minimalist and elegant music player
Description: |-
    Lune is a minimalist and elegant music player for Android, designed with a focus on aesthetics and a premium user experience.

    Features:
    - Modern UI built with Jetpack Compose.
    - Premium home screen widget with "dark defocus" effect.
    - Integrated live lyrics with synchronized scrolling.
    - Dynamic themes and dark mode support.
    - High-quality audio support.

