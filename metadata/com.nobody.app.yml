- **Website**: https://nobodyapp.net
- **Category**: Internet, Security

### What is it
Nobody is an anonymous, zero-knowledge social network with end-to-end encrypted messaging.

Key privacy features:
- No IP logging (`nginx access_log off`, `X-Forwarded-For` stripped)
- Anonymous signup (Ed25519 key pair, no email/phone)
- E2E encrypted DMs (X25519 + AES-256-GCM with 256-byte padding)
- EXIF stripping + auto face/plate blur on uploaded photos
- UnifiedPush for notifications (no Google services)
- Tor hidden services available (.onion endpoints)
- Biometric + PIN lock, Android FLAG_SECURE

### Anti-features
- `NonFreeNet` — uses Giphy API for GIF search. This is OPT-IN with a consent dialog; the app works fully without it.

