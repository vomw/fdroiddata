Categories:
  - Sports & Health
License: MIT
AuthorName: anrinion
WebSite: https://github.com/anrinion/baseline
SourceCode: https://github.com/anrinion/baseline
IssueTracker: https://github.com/anrinion/baseline/issues

AutoName: Baseline

RepoType: git
Repo: https://github.com/anrinion/baseline.git

Builds:
  - versionName: 1.0.5
    versionCode: 5
    commit: v1.0.5
    submodules: true
    output: build/app/outputs/flutter-apk/app-release.apk
    prebuild:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - .flutter/bin/flutter config --no-analytics
      - .flutter/bin/flutter pub get
    scanignore:
      - .flutter/bin/cache
    scandelete:
      - .flutter
      - .pub-cache
    build:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - .flutter/bin/flutter build apk --release

AutoUpdateMode: Version
UpdateCheckMode: Tags ^v[0-9.]+$
UpdateCheckData: pubspec.yaml|version:\s.+\+(\d+)|.|version:\s(.+)\+
CurrentVersion: 1.0.5
CurrentVersionCode: 5
