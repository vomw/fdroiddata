AutoName: Kasette
Summary: 100% offline, local music player
Description: |
    Kasette plays the music files already on your device. Import them once
    and everything else (tags, cover art, playlists, playback) happens
    locally, with no backend involved.

    Features:

    * Import local audio files (mp3, flac, m4a, ogg, opus, wav, aac)
    * Client-side ID3/FLAC tag and embedded cover art parsing, no dependencies
    * Playlists
    * Light theme by default, with a dark mode and multiple accent colors
    * Export/restore your whole library as a single backup file
    * Background playback with lock screen and notification controls
    * English and Latin American Spanish

    100% local. No accounts, no servers, no analytics, no network requests.

RepoType: git
