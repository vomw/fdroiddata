AutoName: PulseDeck
Summary: Split-screen controller for Android media sessions
Description: |-
    Compact media controller for split-screen navigation use.

    PulseDeck controls the currently active Android media session with previous,
    play/pause, and next buttons. It shows the current track, artist, album art,
    and real playback progress, and reconnects when the active player changes.

    The app does not play or stream music, does not use overlays, and does not
    send user data to a server. Notification access is used only to discover
    and control the active media session.

