Categories:
  - Productivity
License: GPL-3.0-only
SourceCode: https://github.com/askadvaith/Elevate
IssueTracker: https://github.com/askadvaith/Elevate/issues
Changelog: https://github.com/askadvaith/Elevate/releases

AutoName: Elevate
Summary: A lightweight task manager for Android with smart reminders.
Description: |-
  Elevate is a minimalist task management app with the following features:

  - Create, view, and manage tasks with ease
  - Set task due dates and smart reminders
  - Support for recurring tasks
  - Beautiful, responsive UI optimized for mobile
  - Local data storage, no cloud dependency
  - Works fully offline
  - Lightweight and fast

  Built with React and Capacitor for cross-platform compatibility.

Builds:
  - versionName: '1.0'
    versionCode: 1
    commit: v1.0
    subdir: android
    sudo:
      - apt-get update
      - apt-get install -y nodejs npm
    build:
      - cd ..
      - npm install
      - npm run build:mobile
    gradle:
      - yes
