Summary: Ad-free Bhagavad Gita reader with Sanskrit audio and multiple translations

Description: |
  GitaVani is a beautiful, ad-free, offline Bhagavad Gita reader.

  Features:
  * All 18 chapters and 701 verses
  * Sanskrit verse audio for all 701 verses
  * Original Sanskrit text in Devanagari
  * Romanized transliteration
  * Hindi translations from 3 scholars
  * English translations from 9 scholars
  * 11,000+ commentaries from 17 scholars
  * Search across all verses
  * Save favorite verses
  * Share verses as themed image cards
  * 4 visual themes (Sattva, Parchment, Dusk, Lotus)
  * Adjustable font size
  * Fully offline — all data bundled locally

