AntiFeatures:
  NonFreeNet:
    en-US: Optional speech-recognition and summarization models are downloaded on
      the user's request from Hugging Face.
Categories:
  - Multimedia
License: MIT
AuthorName: Jaromír Janisch
SourceCode: https://github.com/jaromiru/diktafon
IssueTracker: https://github.com/jaromiru/diktafon/issues
Changelog: https://github.com/jaromiru/diktafon/releases

AutoName: Diktafon

RepoType: git
Repo: https://github.com/jaromiru/diktafon.git

Builds:
  - versionName: 1.0.3
    versionCode: 2004
    commit: v1.0.3
    output: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
    srclibs:
      - flutter@stable
    rm:
      - ios
      - linux
    prebuild:
      - flutterVersion=$(sed -n -E 's/.*FLUTTER_VERSION.\s*([0-9.]+).*/\1/p' .github/workflows/release.yml)
      - '[[ $flutterVersion ]]'
      - git -C $$flutter$$ checkout -f $flutterVersion
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get --enforce-lockfile
    scanignore:
      - assets/models/ggml-silero-v5.1.2.bin
    scandelete:
      - .pub-cache
    build:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter build apk --release --split-per-abi --target-platform
        android-arm64
    ndk: r28c

  - versionName: 1.0.3
    versionCode: 4004
    commit: v1.0.3
    output: build/app/outputs/flutter-apk/app-x86_64-release.apk
    srclibs:
      - flutter@stable
    rm:
      - ios
      - linux
    prebuild:
      - flutterVersion=$(sed -n -E 's/.*FLUTTER_VERSION.\s*([0-9.]+).*/\1/p' .github/workflows/release.yml)
      - '[[ $flutterVersion ]]'
      - git -C $$flutter$$ checkout -f $flutterVersion
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get --enforce-lockfile
    scanignore:
      - assets/models/ggml-silero-v5.1.2.bin
    scandelete:
      - .pub-cache
    build:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter build apk --release --split-per-abi --target-platform
        android-x64
    ndk: r28c

AutoUpdateMode: Version
UpdateCheckMode: Tags ^v[0-9]+\.[0-9]+\.[0-9]+$
VercodeOperation:
  - '%c + 2000'
  - '%c + 4000'
UpdateCheckData: pubspec.yaml|version:\s.+\+(\d+)|.|version:\s(.+)\+
CurrentVersion: 1.0.3
CurrentVersionCode: 4004
