AutoName: Copypus
Summary: Clipboard manager that saves and organizes everything you copy
Description: |
    Copypus automatically saves everything you copy – links, text snippets,
    code, images.

    Features:
    * Automatic clipboard saving
    * Accessibility Service for capturing copied text (optional)
    * Image clipboard support via Quick Settings tile or Share
    * Favorites, search, date grouping
    * Auto-delete options (1h … 1 month / never)
    * Export & import backup
    * Customizable theme

    '''Note:''' The Accessibility Service is optional and only used to capture
    copied text. It can be disabled at any time in system settings.

