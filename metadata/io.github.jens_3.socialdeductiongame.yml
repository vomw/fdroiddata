Categories:
  - Game Helper
  - Party Game
License: AGPL-3.0-only
AuthorName: Jens Aßmus
SourceCode: https://github.com/Jens-3/SocialDeductionGame
IssueTracker: https://github.com/Jens-3/SocialDeductionGame/issues
Changelog: https://github.com/Jens-3/SocialDeductionGame/releases

RepoType: git
Repo: https://github.com/Jens-3/SocialDeductionGame.git

Builds:
  - versionName: 0.9.0
    versionCode: 1
    commit: aef417cd595433f3d3acfd17c91508f1f971e66a
    subdir: android/app
    sudo:
      - curl -Lo node.tar.gz https://nodejs.org/download/release/v24.19.0/node-v24.19.0-linux-x64.tar.gz
      - echo "f625d97cd707df4ff96254916fbc5ff014f09c09effe5a1e0ca8f6d41a8789d4 node.tar.gz"
        | sha256sum -c -
      - tar xzf node.tar.gz --strip-components=1 -C /usr/local/
      - corepack enable
    init:
      - cd ../.. && pnpm install --frozen-lockfile
      - cd ../.. && pnpm run android:sync
    gradle:
      - yes
    scandelete:
      - node_modules/
    gradleprops:
      - fdroidBuild=true

AutoUpdateMode: Version
UpdateCheckMode: Tags ^v[0-9]+(\.[0-9]+){2}$
UpdateCheckData:
  android/app/build.gradle|versionCode\s+(\d+)|package.json|"version"\s*:\s*"([^"]+)"
CurrentVersion: 0.9.0
CurrentVersionCode: 1
