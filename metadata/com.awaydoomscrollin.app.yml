AutoName: AwayDoomscrollin'
Description: |-
  AwayDoomscrollin' is an open-source, privacy-first Android app that helps
  you break the habit of endless doomscrolling on Instagram Reels, TikTok,
  and YouTube Shorts.

  Unlike screen-time apps that set limits, AwayDoomscrollin' uses an
  event-driven Accessibility Service Shield that intervenes the exact moment
  an unconscious vertical scroll gesture occurs - no timer, no negotiation.

  Features:
  * Instant scroll detection and forced home-screen return
  * Smart Safe Zones: DMs, comments, and long-form YouTube are never blocked
  * 100% offline - zero internet permissions
  * Anti-cheat protection to prevent impulsive deactivation
  * Gamification: XP system and daily streak milestones
  * 24-hour heatmap showing your hourly scroll patterns
  * Weekly progress dashboard with per-app statistics

  Supported: Instagram Reels (stable), TikTok (beta), YouTube Shorts (beta)

