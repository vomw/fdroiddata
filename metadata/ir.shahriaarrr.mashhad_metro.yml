Categories:
  - Navigation
  - Public Transport
License: GPL-3.0-only
AuthorName: shahriaarrr
SourceCode: https://github.com/shahriaarrr/mashhad-metro
IssueTracker: https://github.com/shahriaarrr/mashhad-metro/issues
Changelog: https://github.com/shahriaarrr/mashhad-metro/releases

AutoName: Mashhad Metro

RepoType: git
Repo: https://github.com/shahriaarrr/mashhad-metro.git

Builds:
  - versionName: 0.5.0
    versionCode: 1
    commit: 5f51ab37e1af5f7239cfbfc86aa6bb4b01c560bd
    output: build/app/outputs/flutter-apk/app-release.apk
    srclibs:
      - flutter@stable
    rm:
      - ios
      - linux
      - macos
      - test
      - web
      - windows
    prebuild:
      - flutterVersion=$(sed -n -E "s/.*flutter-version:\ \"(.*)\"/\1/p" .github/workflows/release.yaml)
      - '[[ $flutterVersion ]] || exit 1'
      - git -C $$flutter$$ checkout -f $flutterVersion
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter packages pub get
      - sed -i "s|implementation 'com.google.android.gms:play-services-location:.*'|implementation 'org.microg.gms:play-services-location-api:21.1.0'|g" .pub-cache/hosted/pub.dev/geolocator_android-*/android/build.gradle || true
      - sed -i '/repositories {/a\        maven { url "https://repo.microg.org/" }' .pub-cache/hosted/pub.dev/geolocator_android-*/android/build.gradle || true
      - sed -i 's|android:name="com.google.android.play.core.splitcompat.SplitCompatApplication"|android:name="android.app.Application"|g' android/app/src/main/AndroidManifest.xml || true
      - |
        cat >> android/app/proguard-rules.pro << 'EOF'
        -dontwarn com.google.android.play.core.**
        -dontwarn com.google.android.play.core.splitinstall.**
        -dontwarn com.google.android.play.core.splitcompat.**
        -dontwarn com.google.android.play.core.tasks.**
        -ignorewarnings
        EOF
    scandelete:
      - .pub-cache
    scanignore:
      - android/build.gradle
      - android/app/build.gradle.kts
    build:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter build apk --release
    ndk: r25c

AutoUpdateMode: Version
UpdateCheckMode: Tags
UpdateCheckData: pubspec.yaml|version:\s.+\+(\d+)|.|version:\s(.+)\+
CurrentVersion: 0.5.0
CurrentVersionCode: 1
