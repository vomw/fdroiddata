AutoName: LCDPet
Summary: Tiny offline LCD-style virtual pet
Description: |-
  LCDPet is a tiny offline LCD-style virtual pet for Android.

  Feed your pet, bathe it, let it nap, take it outside, handle random Wants,
  and keep an eye on its care status. The app is designed around a simple
  handheld digital-pet feel with local progress, toy-like interactions, and a
  low-pressure care loop.

  Features include starter pet templates, local save/load, optional local
  notifications for pet care alerts, a Credits / Licenses screen, and an
  offline-first care loop.

