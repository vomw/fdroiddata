AntiFeatures:
  TetheredNet:
    en-US: Optional map downloads use Geofabrik OpenStreetMap extracts, OpenFreeMap
      for online basemap tiles, and Mapterhorn for elevation data. Routing and navigation
      run offline after those files are on the device.
Categories:
  - Navigation
License: GPL-3.0-or-later
AuthorName: Navi contributors
WebSite: https://github.com/Supermagnum/Navi
SourceCode: https://github.com/Supermagnum/Navi
IssueTracker: https://github.com/Supermagnum/Navi/issues
Changelog: https://github.com/Supermagnum/Navi/releases
Donate: https://github.com/Supermagnum/Navi#support-navi

AutoName: Navi

RepoType: git
Repo: https://github.com/Supermagnum/Navi.git

Builds:
  - versionName: 0.1.0
    versionCode: 1
    commit: b54d7e06bfd8d500c6db9576da9df1507d530913
    timeout: 14400
    subdir: app
    sudo:
      - apt-get update
      - apt-get install -y --no-install-recommends build-essential curl ca-certificates
        python3 pkg-config libssl-dev rustup
    gradle:
      - yes
    rm:
      - app/src/main/jniLibs/arm64-v8a/libnavi.so
      - app/src/main/jniLibs/x86_64/libnavi.so
    prebuild:
      - rustup default 1.88.0
      - rustup target add aarch64-linux-android x86_64-linux-android
      - export PATH="$HOME/.cargo/bin:$PATH"
      - NDK="$$NDK$$"
      - test -n "$NDK"
      - test -d "$NDK"
      - CLANG_PRE="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"
      - mkdir -p ../.cargo
      - echo '[target.x86_64-linux-android]' > ../.cargo/config.toml
      - echo "linker = \"$CLANG_PRE/x86_64-linux-android34-clang\"" >> ../.cargo/config.toml
      - echo 'rustflags = ["-C", "link-arg=-lc++_shared"]' >> ../.cargo/config.toml
      - echo '[target.aarch64-linux-android]' >> ../.cargo/config.toml
      - echo "linker = \"$CLANG_PRE/aarch64-linux-android34-clang\"" >> ../.cargo/config.toml
      - echo 'rustflags = ["-C", "link-arg=-lc++_shared"]' >> ../.cargo/config.toml
      - rm -f ../app/src/main/jniLibs/*/libnavi.so
      - printf 'sdk.dir=%s\nndk.dir=%s\n' "$$SDK$$" "$$NDK$$" > ../local.properties
    build:
      - export PATH="$HOME/.cargo/bin:$PATH"
      - command -v cargo
      - export ANDROID_NDK_HOME="$$NDK$$"
      - export ANDROID_HOME="$$SDK$$"
      - if ! [[ "${SOURCE_DATE_EPOCH:-}" =~ ^[0-9]+$ ]]; then export SOURCE_DATE_EPOCH="$(git
        -C .. log -1 --pretty=%ct)"; fi
      - test ! -e ../app/src/main/jniLibs/arm64-v8a/libnavi.so
      - test ! -e ../app/src/main/jniLibs/x86_64/libnavi.so
      - ../scripts/build-android-native.sh aarch64-linux-android release
      - ../scripts/build-android-native.sh x86_64-linux-android release
      - test -f ../app/src/main/jniLibs/arm64-v8a/libnavi.so
      - test -f ../app/src/main/jniLibs/x86_64/libnavi.so
      - sha256sum ../app/src/main/jniLibs/arm64-v8a/libnavi.so ../app/src/main/jniLibs/x86_64/libnavi.so
      - gradle assembleRelease
    ndk: r27c

MaintainerNotes: |
  Rust via Debian rustup package in sudo:; toolchain 1.88.0 + Android targets in
  prebuild: (runs as build user — curl|sh.rustup.rs in sudo: installs to /root and
  is invisible to vagrant). .cargo/config.toml linker paths from $$NDK$$.
  dependenciesInfo.includeInApk/Bundle are false in app/build.gradle.kts.
  libnavi.so: rm and prebuild delete committed jniLibs prebuilts (local/CI Gradle-only);
  build: runs scripts/build-android-native.sh for aarch64 and x86_64 before assembleRelease
  (asserts absence before compile and presence after).
  io.opencensus: AGP Unified Test Platform host tooling only
  (com.google.testing.platform via com.android.tools.utp) — not on
  releaseRuntimeClasspath, not shipped in the APK, not used for app telemetry.
  Do not globally exclude (breaks instrumented-test UTP). False-positive tracker flag.
  build: restores SOURCE_DATE_EPOCH from git when empty (annotated tags); otherwise
  ring/cc-rs fails.

AutoUpdateMode: Version
UpdateCheckMode: Tags ^v[0-9]+\.[0-9]+\.[0-9]+$
UpdateCheckData: app/build.gradle.kts|versionCode\s=\s(\d+)|.|versionName\s=\s"(.*)"
CurrentVersion: 0.1.0
CurrentVersionCode: 1
