Categories:
  - Social Network
License: Apache-2.0
SourceCode: https://github.com/mystifiedmunchkin/echoes-mobile
IssueTracker: https://github.com/mystifiedmunchkin/echoes-mobile/issues

AutoName: ECHOES

RepoType: git
Repo: https://github.com/mystifiedmunchkin/echoes-mobile

Builds:
  - versionName: 0.1.0
    versionCode: 1
    disable: Generated by `fdroid import` - check version fields and commitid
    commit: v0.1.0
    subdir: android/app
    sudo:
      - sysctl fs.inotify.max_user_watches=524288 || true
      - apt-get update
      - apt-get install -y npm
    init: npm install --build-from-source
    gradle:
      - yes
    scanignore:
      - android/build.gradle
    scandelete:
      - node_modules

AutoUpdateMode: Version
UpdateCheckMode: Tags
CurrentVersion: 0.1.0
CurrentVersionCode: 1
