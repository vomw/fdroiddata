Categories:
  - Games
License: AGPL-3.0-only
WebSite: https://github.com/terminator-ger/wrsim
SourceCode: https://github.com/terminator-ger/wrsim/tree/HEAD
IssueTracker: https://github.com/terminator-ger/wrsim/issues

AutoName: wrbattlesim

RepoType: git
Repo: https://github.com/terminator-ger/wrsim.git

Builds:
  - versionName: 0.4.6
    versionCode: 1010
    commit: v0.4.6
    submodules: true
    output: build/app/outputs/apk/release/app-armeabi-v7a-release-unsigned.apk
    srclibs:
      - flutter@stable
    rm:
      - ios
      - macos
      - web
    prebuild:
      - flutterVersion=$(sed -n -E 's/^[[:space:]]*flutter-version:[[:space:]]*(.*)/\1/p'
        .github/workflows/release.yml)
      - '[[ $flutterVersion ]]'
      - git -C $$flutter$$ checkout -f $flutterVersion
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get
    scandelete:
      - .pub-cache
    build:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter build apk --release --split-per-abi --target-platform="android-arm"

  - versionName: 0.4.6
