# Staging copy for the separate fdroiddata merge request.
# Replace the commit value with the full SHA of the final v1.1.0 release commit
# after the branch has been merged to main and the tag has been pushed.

Categories:
  - Inventory
  - Calendar & Agenda
  - Habit Tracker
  - Task
  - Schedule
  - Notification
  - Note
License: AGPL-3.0-only
AuthorName: Domai
AuthorWebSite: https://github.com/domai-tb
WebSite: https://github.com/domai-tb/OpenPlants
SourceCode: https://github.com/domai-tb/OpenPlants
IssueTracker: https://github.com/domai-tb/OpenPlants/issues

RepoType: git
Repo: https://github.com/domai-tb/OpenPlants

Builds:
  - versionName: '1.1.0'
    versionCode: 31
    commit: 391b3688b0e4df09a931ec692443c9ed78bba5bc
    forcevercode: true
    output: build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
    srclibs:
      - flutter@3.41.4
    rm:
      - ios
      - linux
      - macos
      - web
      - windows
    prebuild:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get --enforce-lockfile
    scandelete:
      - .pub-cache
    build:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter build apk --release --split-per-abi --target-platform="android-arm"

  - versionName: '1.1.0'
