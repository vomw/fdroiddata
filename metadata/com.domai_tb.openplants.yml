# Staging copy for the separate fdroiddata merge request.
# F-Droid release tags must be created from commits on main. Development tags
# should use a different prefix so the tag update check ignores them.

Categories:
  - Inventory
  - Calendar & Agenda
  - Habit Tracker
  - Task
  - Schedule
  - Notification
  - Note
License: AGPL-3.0-only
AuthorName: Domai
AuthorWebSite: https://github.com/domai-tb
WebSite: https://github.com/domai-tb/OpenPlants
SourceCode: https://github.com/domai-tb/OpenPlants
IssueTracker: https://github.com/domai-tb/OpenPlants/issues

RepoType: git
Repo: https://github.com/domai-tb/OpenPlants

Builds:
  - versionName: '1.1.0'
    versionCode: 31
    commit: 18cd6807155876802b553aff2df16c790497e6c9
    forcevercode: true
    sudo: apt-get update && apt-get install -y python3-venv
    output: build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
    srclibs:
      - flutter@3.41.4
    rm:
      - ios
    prebuild:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get --enforce-lockfile
    scandelete:
      - .pub-cache
    build:
      - ./scripts/run_export.sh
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter build apk --release --split-per-abi --target-platform="android-arm"

  - versionName: '1.1.0'
    versionCode: 32
    commit: 18cd6807155876802b553aff2df16c790497e6c9
    forcevercode: true
    sudo: apt-get update && apt-get install -y python3-venv
    output: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
