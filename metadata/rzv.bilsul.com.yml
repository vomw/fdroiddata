AutoName: RZV
Description: |-
  Browse and read GitHub, GitLab and Bitbucket repositories by opening their
  .zip archives in a read-only code editor and markdown viewer on your phone.

  Import any repository as a .zip file (GitHub "Download ZIP", GitLab export,
  etc.) or download one with the built-in Zip Manager, then browse the full
  folder/file tree, view code with syntax highlighting and preview README and
  .md files. No cloning or Git setup needed; files are read offline after
  import.

  Features:
  * Import .zip archives of GitHub, GitLab and Bitbucket repositories
  * In-app Zip Manager with branch selection and download cancellation
  * Full folder/file tree browser
  * Read-only code editor with Monaco syntax highlighting (via WebView)
  * Instant Markdown preview for READMEs and .md files
  * Customizable font size, font family, zoom, light/dark theme and accent
    colors
  * Toggleable file explorer and editor options (word wrap, minimap, line
    numbers, zoom) through the Plugins system
  * 14 interface languages
  * The application contains unadvertised AI assistant features (rzv/services/ai_chat_service.dart) that require user-supplied API keys for proprietary services including OpenAI, Anthropic, and Gemini.

  The app uses the INTERNET permission to download repository archives,
  check for new versions on GitHub and Donate button. No tracking or analytics.

  AI chat features are not fully implemented yet and will be added in the later upcoming versions. 

RepoType: git
Repo: https://github.com/bilalsul/rzv.git

Builds:
  - versionName: 0.6.9
    versionCode: 251
    commit: 2724432870267b0e0026eb3de58d846709a4366a
    output: build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
    srclibs:
      - flutter@stable
    rm:
      - ios
      - linux
      - macos
      - web
      - windows
    prebuild:
      - flutterVersion=$(sed -n -E "s/.*flutter-version:\ '(.*)'/\1/p" .github/workflows/release.yml)
      - '[[ $flutterVersion ]]'
      - git -C $$flutter$$ checkout -f $flutterVersion
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get --enforce-lockfile
    scandelete:
      - .pub-cache
    build:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter build apk --release --split-per-abi --target-platform="android-arm"
        --split-debug-info=build/symbols

