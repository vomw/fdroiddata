Repo: https://github.com/bilalsul/rzv.git

Builds:
  - versionName: 0.6.8
    versionCode: 241
    commit: 364616f0653ff66c0f220019d027e29e5f3d1908
    sudo:
      - mkdir -p /home/runner/work/RZV
      - chown -R vagrant /home/runner
    output: build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
    srclibs:
      - flutter@stable
    rm:
      - ios
      - web
    prebuild:
      - export repo=/home/runner/work/RZV/RZV
      - cd ..
      - mv rzv.bilsul.com $repo
      - pushd $repo
      - flutterVersion="3.35.6"
      - git -C $$flutter$$ checkout -f $flutterVersion
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get
      - find $PUB_CACHE -path "*/jni-*/src/CMakeLists.txt" -exec sed -i 's/-Wl,/-Wl,--build-id=none,/'
        {} + 2>/dev/null || true
      - popd
      - mv $repo rzv.bilsul.com
    scandelete:
      - .pub-cache
    build:
      - export repo=/home/runner/work/RZV/RZV
      - cd ..
      - mv rzv.bilsul.com $repo
      - pushd $repo
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter build apk --release --split-per-abi --target-platform="android-arm"
        --split-debug-info=build/symbols
      - popd
      - mv $repo rzv.bilsul.com

