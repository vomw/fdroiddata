Name: Alauncher

Summary: A minimalist Android launcher

Description: >-
  Alauncher is a minimalist Android launcher with futuristic themes.
  It provides gesture navigation, widget support, icon customization,
  music controls, weather display, customizable clock styles, drag and
  drop organization, double tap to sleep, global search, and tablet support.
  It is lightweight, fast, and contains no ads or tracking.

