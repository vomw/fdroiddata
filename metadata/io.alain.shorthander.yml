    versionName: 1.0.10
    commit: v1.0.10
    subdir: android
    gradle:
      - yes
    output: app/build/outputs/apk/release/app-release-unsigned.apk

AutoUpdateMode: Version
UpdateCheckMode: Tags
UpdateCheckData: android/app/build.gradle|versionCode\s+(\d+)|.|versionName\s+"(.*)"
