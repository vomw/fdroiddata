AutoName: FPS Meter
Description: |-
  A high-performance, lightweight FPS monitoring overlay for Android. Inspired
  by the Samsung Perf Z aesthetic, this application provides real-time
  performance telemetry for mobile gaming and development.

  Features:
  * Dual FPS Providers: Choreographer (default vsync signal) and SurfaceFlinger
    (real game frame presentation via Shizuku).
  * Automatic Graphics API Detection: Detects whether games run on Vulkan or
    OpenGL ES.
  * On-Screen Graphics API Badge: Displays [VK] or [GL] indicator on the floating counter.
  * Real-time frame time (MS) and battery temperature (TEMP).
  * Dynamic FPS value color coding based on performance thresholds.
  * Quick Settings Tile for one-tap toggling directly from notification shade.
  * Floating Assistive Bubble for in-game show/hide.
  * Auto Game Detection via Accessibility Service.
  * Preset positioning with drag support.
  * 100% open source with zero tracking or analytics.

