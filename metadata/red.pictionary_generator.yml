Categories:
  - Games
License: GPL-3.0-or-later
AuthorName: Ari Donnenfeld
SourceCode: https://gitlab.com/ari-donnenfeld/pictionary-generator
IssueTracker: https://gitlab.com/ari-donnenfeld/pictionary-generator/-/work_items

AutoName: Pictionary Generator

RepoType: git
Repo: https://gitlab.com/ari-donnenfeld/pictionary-generator.git

Builds:
  - versionName: '1.1.2'
    versionCode: 6
    commit: v1.0
    output: build/app/outputs/flutter-apk/app-release.apk
    srclibs:
      - flutter@stable
    rm:
      - ios
      - linux
      - macos
      - web
      - windows
    prebuild:
      - flutterVersion=$(sed -n -E 's/.*flutter:(.*)/\1/p' .gitlab-ci.yml)
      - '[[ $flutterVersion ]]'
      - git -C $$flutter$$ checkout -f $flutterVersion
      - export PUB_CACHE=$(pwd)/.pub-cache
      - .flutter/bin/flutter config --no-analytics
      - .flutter/bin/flutter pub get
    scanignore:
      - .flutter/bin/cache
    scandelete:
      - .flutter
      - .pub-cache
    build:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - .flutter/bin/flutter build apk --release

AutoUpdateMode: Version
UpdateCheckMode: Tags
UpdateCheckData: pubspec.yaml|version:\s.+\+(\d+)|.|version:\s(.+)\+
CurrentVersion: '1.1.2'
CurrentVersionCode: 6
