IssueTracker: https://gitlab.com/SuperT0f/webiartisan-flutter-app/-/issues

AutoName: WebIArtisan

RepoType: git
Repo: https://gitlab.com/SuperT0f/webiartisan-flutter-app.git

Builds:
  - versionName: 2.0.0
    versionCode: 53
    commit: fbf235d7f43de1423a1c4f8f11e2ba37fb8d9bca
    output: build/app/outputs/flutter-apk/app-release.apk
    sudo:
      - apt-get update || apt-get update
      - apt-get install -y node-semver
    srclibs:
      - flutter-fdroid@master
    prebuild:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter-fdroid$$/flutter-fdroid config --no-analytics
      - $$flutter-fdroid$$/flutter-fdroid packages pub get
    build:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter-fdroid$$/flutter-fdroid build apk --release --dart-define=FDROID_BUILD=true
        --build-number=$$VERCODE$$

AutoUpdateMode: Version
UpdateCheckMode: Tags ^v[0-9].*
UpdateCheckData: pubspec.yaml|version:\s.+\+(\d+)|.|version:\s(.+)\+
CurrentVersion: 2.0.0
