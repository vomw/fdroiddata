Builds:
  - versionName: '2.0.0'
    versionCode: 53
    commit: v2.0.0
    srclibs:
      - flutter@3.41.6
    prebuild:
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get
