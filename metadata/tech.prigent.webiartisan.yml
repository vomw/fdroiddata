Summary: Application mobile pour artisans et PME
Description: |-
  WebIArtisan est une application mobile destinée aux artisans et petites
  entreprises. Elle permet de consulter et gérer vos chantiers, devis,
  factures et clients directement depuis votre smartphone via une interface
  web optimisée.

  Fonctionnalités :

  * Accès sécurisé à votre espace WebIArtisan
  * Gestion des chantiers, devis et factures
  * Notifications et accès hors-ligne partiel
  * Authentification biométrique optionnelle

  Cette version F-Droid est construite sans le module de mise à jour
  automatique (le composant upgrader est désactivé à la compilation via
  --dart-define=FDROID_BUILD=true).

  .

