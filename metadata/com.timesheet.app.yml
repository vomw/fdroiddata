    Summary: Alarm-driven timesheet and job hour tracker
    Description: |
      Time Sheet helps track work hours by turning job schedules into alarms.
        When an alarm fires, enter your hours and they are logged for the day.
          .
            Features:
              * Create jobs or projects with repeating alarm schedules
                * Log hours directly from the full-screen alarm prompt
                  * Review and edit day-by-day hour history
                    * Export timesheets as CSV
                      * Use light, dark, or Material You dynamic themes
                        * Choose tone, vibration, or silent alarm behavior
                          .
                            All data stays on the device. The app requests no network access.

