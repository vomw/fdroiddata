AutoName: Translate Keyboard
Summary: Offline translation keyboard with zero tracking and customizable UI
Description: |-
  Translate Keyboard is a privacy-conscious, customizable, and fast open-source
  Android keyboard featuring a 100% offline neural translation engine.
  It does not request internet permissions, ensuring your keystrokes and
  translations remain strictly local and private.

  Features:
  * Offline Neural Translation between Spanish, English, and Portuguese.
  * Strict Privacy: No internet permission requested.
  * Customizable themes, colors, and dynamic day/night mode.
  * Advanced layouts (split, one-handed, symbols).
  * Local dictionaries for suggestions, spell check, and emoji search.

