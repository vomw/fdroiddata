AutoName: Ethic APK Guard
Summary: Review APK compatibility before installation
Description: |-
  Ethic APK Guard reviews one Android APK before installation. It compares the
  package identifier, version code, signing certificates, declared signing
  history, Android minimum version, native libraries, DEX presence, newly
  requested dangerous permissions, and selected security-relevant manifest
  changes against the matching app installed on the device.

  The app can explicitly hand a single reviewed APK to Android's system
  installer. It never installs or uninstalls silently. A different package
  identifier is reported as a separate application, even when the visible app
  name is the same. APKS and XAPK containers are recognized and declined as
  split packages because this release does not install their component set.

  An optional, user-confirmed lookup reads public F-Droid package, metadata, and
  reproducible-verification records. The lookup sends only the package
  identifier and version code over HTTPS; it never uploads the APK, its hash,
  or an inventory of installed apps. Public registry data is not a malware
  verdict, and absence of a record is not a safety certification.

