Categories:
  - Note
AuthorName: Norm Plum
License: GPL-3.0-or-later
SourceCode: https://github.com/NormPlum/SilentShare
IssueTracker: https://github.com/NormPlum/SilentShare/issues
Summary: Privately share personal information with others visually in-person.
RepoType: git
Repo: https://github.com/NormPlum/SilentShare.git

Builds:
  - versionName: 1.0.2
    versionCode: 10002
    commit: 6fa7890c276adb9f21e2517fa8bb03bb7625db40
    sudo:
      - apt-get update
      - apt-get install -y scons g++
    srclibs:
      - Godot@4.6.1-stable
    build:
      # Environment variables.
      - export JAVA_HOME=$(dirname $(dirname $(readlink -f $(which javac))))
      - export ANDROID_HOME=$$SDK$$
      # Compile Godot editor and Android export template.
      - pushd $$Godot$$
      - scons platform=linuxbsd optimize=speed
      - scons target=template_release profile=.build/scons_profile.py
      - popd
      # Export app using export template and preset.
      - mv $$Godot$$/bin/android_release.apk android-release.apk
      - $$Godot$$/bin/godot.linuxbsd.editor.x86_64 --headless --export-release "Android (fdroid)" silentshare.apk
    ndk: 28.1.13356709
    output: silentshare.apk

AutoUpdateMode: Version
UpdateCheckMode: Tags
UpdateCheckData: export_presets.cfg|version/code=(\d+)|.|version/name="([\d.]+)"
