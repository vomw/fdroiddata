Categories:
  - Money
License: UNKNOWN
AuthorName: bitbybit91
WebSite: https://github.com/bitbybit91/app-builder
SourceCode: https://github.com/bitbybit91/app-builder
IssueTracker: https://github.com/bitbybit91/app-builder/issues

Summary: Peer-to-peer cryptocurrency exchange
Description: |
  CapitalMonero is a peer-to-peer cryptocurrency exchange application.
  Trade cryptocurrencies directly with other users without intermediaries.

RepoType: git
Repo: https://github.com/bitbybit91/app-builder

Builds:
  - versionName: 1.0.0
    versionCode: 1
    commit: v1.0.0
    output: build/app/outputs/flutter-apk/app-fdroid-release.apk
    subdir: .
    submodules: true
    sudo:
      - apt-get update
      - apt-get install -y git unzip
    init:
      - export flutterVer=3.19.6
      - export PUB_CACHE=$(pwd)/.pub-cache
      - git clone -b $flutterVer --depth 1 https://github.com/flutter/flutter.git ../flutter
      - export PATH="$PATH:$(pwd)/../flutter/bin"
      - flutter config --no-analytics
      - flutter pub get
      - flutter pub run build_runner build --delete-conflicting-outputs
    build:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - export PATH="$PATH:$(pwd)/../flutter/bin"
      - flutter build apk --flavor fdroid --release
    ndk: r25b

AntiFeatures:
  NonFreeNet:
    en-US: Connects to third-party exchange services.

AutoUpdateMode: Version
UpdateCheckMode: Tags
CurrentVersion: 1.0.0
CurrentVersionCode: 1