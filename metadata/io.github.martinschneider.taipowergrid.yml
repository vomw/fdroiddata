AutoName: Taiwan Power Coordinates Tool
Description: |-
  Scans coordinate labels on Taiwan Power Company (Taipower) electricity poles
  and converts them to GPS locations.

  Point the camera at a pole sign showing a Taipower grid coordinate (e.g.
  G8152 FC56) and the app will decode it and open the location in your preferred
  map application.

  Text recognition runs entirely on-device; no internet connection or account
  are required.

