Categories:
  - Time
License: MIT
AuthorName: John Hungerford
SourceCode: https://github.com/Jhon-1/dual-view-calendar
IssueTracker: https://github.com/Jhon-1/dual-view-calendar/issues

RepoType: git
Repo: https://github.com/Jhon-1/dual-view-calendar.git

Builds:
  - versionName: '2.0'
    versionCode: 1
    commit: v2.0
    subdir: android/app
    sudo:
      - apt-get update
      - apt-get install -y npm
      - npm install -g n
      - n lts
    init:
      - cd ../..
      - npm install
      - npm run build
      - npx cap sync android
    gradle:
      - yes

AutoUpdateMode: None
UpdateCheckMode: None
CurrentVersion: '2.0'
CurrentVersionCode: 1
