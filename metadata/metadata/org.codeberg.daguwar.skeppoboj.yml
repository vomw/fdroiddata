AutoName: Skeppoboj
Summary: Open-source ship tracking using OpenStreetMap and AIS data
Description: |-
  Skeppoboj is an open-source ship tracking app built with Flutter.
  It displays real-time vessel positions on OpenStreetMap using AIS data received
  over WebSocket from a self-hosted relay server.

  Features:
  * OpenStreetMap view with vessel markers and course headings
  * Color-coded vessel types (cargo, tanker, passenger, fishing, tug, etc.)
  * Tap vessels to inspect details (speed, course, dimensions, destination, flag)
  * Device GPS positioning without Google Play Services
  * Compass indicator to re-orient map north
  * Configurable self-hosted relay endpoint

RepoType: git
