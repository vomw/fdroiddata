Name: NewPipe Material
Summary: Material 3-focused independent fork of NewPipe
Description: |-
  NewPipe Material is an independently maintained fork of NewPipe for Android
  focused on Material 3 design, dynamic and manual theme colors, app identity,
  and careful visual polish while preserving the familiar NewPipe experience.

  It keeps NewPipe's lightweight and privacy-friendly approach. It does not
  require a platform account, does not depend on Google Play Services, and is
  designed for users who want to watch, search, browse, and manage supported
  media services without signing in.

  Main features include video and live stream playback, background playback,
  popup playback, local playlists, subscriptions without platform login, channel
  groups and feeds, search and browsing for supported services, video details,
  related videos and comments where available, downloads for video, audio, and
  captions where available, and import/export for backup and migration.

  Material-focused additions include Material 3-inspired surfaces, dialogs,
  settings, tabs, and navigation, dynamic Material You color support where
  available, manual theme color presets, NewPipe Material app identity, fork
  attribution, signed release builds, and release metadata.

  NewPipe Material is based on NewPipe, but is independently maintained. It is
  not affiliated with, sponsored by, or endorsed by the official NewPipe project,
  TeamNewPipe, or NewPipe e.V.

