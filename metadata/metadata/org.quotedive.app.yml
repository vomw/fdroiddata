Categories:
  - Education
  - Reading
License: MIT
WebSite: https://gitlab.com/Z1TH1Z/quotes-app
SourceCode: https://gitlab.com/Z1TH1Z/quotes-app
IssueTracker: https://gitlab.com/Z1TH1Z/quotes-app/-/issues

Name: QuoteDive
AutoName: QuoteDive
Summary: Daily philosophical quotes, deep dives, and widgets to inspire your day.

RepoType: git
Repo: https://gitlab.com/Z1TH1Z/quotes-app.git

Builds:
  - versionName: '1.0.0'
    versionCode: 1
    commit: v1.0.0
    output: build/app/outputs/flutter-apk/app-release.apk

    srclibs:
      - flutter@3.24.3

    prebuild:
      - export FLUTTER_ROOT=$$flutter$$
      - $FLUTTER_ROOT/bin/flutter config --no-analytics
      - $FLUTTER_ROOT/bin/flutter pub get

    build:
      - $FLUTTER_ROOT/bin/flutter build apk --release

AutoUpdateMode: Version v%v
UpdateCheckMode: Tags

CurrentVersion: '1.0.0'
CurrentVersionCode: 1