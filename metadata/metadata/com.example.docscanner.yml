AutoName: DocScanner
Summary: 100% Offline Document Scanner with On-Device OCR & Searchable PDF Generation
Description: |-
  DocScanner is a privacy-first mobile document scanner that runs entirely offline.
  
  Features:
  - Smart automatic perspective correction & edge detection
  - Searchable PDF generation with invisible selectable OCR text layers
  - Offline Full-Text Search (SQLite FTS4)
  - Biometric App Lock & PIN security with 30s background grace period
  - Multi-language OCR (Latin, Devanagari, Chinese, Japanese, Korean)
  - Wi-Fi & Virtual PDF Printing via native Android PrintManager
  - Document size & paper format diagnostics (A4, US Letter, US Legal, Receipt)

