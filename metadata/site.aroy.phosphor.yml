    subdir: android/app
    sudo:
      - apt-get update
      - apt-get install -y curl unzip
      - curl -fsSL -o /tmp/bun.zip https://github.com/oven-sh/bun/releases/download/bun-v1.4.0/bun-linux-x64.zip
      - echo "2d03fb5fb83ac8b567aca0a281b2ce1a1a19d488f56c2968d88c3f25e92fe452 /tmp/bun.zip"
        | sha256sum -c -
      - unzip -q /tmp/bun.zip -d /opt
      - chmod +x /opt/bun-linux-x64/bun
      - ln -s /opt/bun-linux-x64/bun /usr/local/bin/bun
      - ln -s /opt/bun-linux-x64/bun /usr/local/bin/bunx
    init:
      - cd ../..
      - bun install --frozen-lockfile --ignore-scripts
      - bun run build
      - bunx cap sync android
    gradle:
      - yes
    scandelete:
      - node_modules/

