Categories:
  - Board Game
  - Card Game
License: MIT
AuthorName: Ricardo Sierra
SourceCode: https://github.com/ricardosierra/jogos-de-mesa-offline
IssueTracker: https://github.com/ricardosierra/jogos-de-mesa-offline/issues
Changelog: https://github.com/ricardosierra/jogos-de-mesa-offline/blob/master/CHANGELOG.md

AutoName: PlayTable

RepoType: git
Repo: https://github.com/ricardosierra/jogos-de-mesa-offline.git

Builds:
  - versionName: 0.3.0
    versionCode: 4
    commit: df92aeafbf01f1264bf6e157952c6f19a156f9b5
    timeout: 14400
    sudo:
      - apt-get update
      - apt-get install -y pkgconf scons g++
    output: bin/PlayTable.apk
    srclibs:
      - Godot@4.6-stable
    prebuild: mkdir -p bin
    build:
      - export JAVA_HOME=$(dirname $(dirname $(readlink -f $(which javac))))
      - export ANDROID_SDK_ROOT=$$SDK$$
      - pushd $$Godot$$
      - scons -j `nproc` platform=linuxbsd target=editor
      - scons -j `nproc` platform=android target=template_release arch=arm64
      - scons -j `nproc` platform=android target=template_release arch=arm32 generate_apk=yes
      - popd
      - sed -i -e 's:\(^.*package/signed\)\s*=.*$:\1 = false:' export_presets.cfg
      - sed -i -e '/custom_template\/release/s|=.*|="$$Godot$$/bin/android_release.apk"|'
        export_presets.cfg
      - $$Godot$$/bin/godot.linuxbsd.editor.x86_64 --headless --import
      - export GODOT_CFG=$(ls ~/.config/godot/editor_settings-*.tres)
      - sed -i -e "s:\(^.*java_sdk_path\)\s*=.*$:\1 = \"$JAVA_HOME\":" $GODOT_CFG
      - sed -i -e 's:\(^.*android_sdk_path\)\s*=.*$:\1 = "$$SDK$$":' $GODOT_CFG
      - $$Godot$$/bin/godot.linuxbsd.editor.x86_64 --headless --export-release 'Android'
        bin/PlayTable.apk
    ndk: 28.1.13356709

AutoUpdateMode: Version
UpdateCheckMode: Tags
UpdateCheckData: export_presets.cfg|version/code=(\d+)|.|version/name="([\d.]+)"
CurrentVersion: 0.3.0
CurrentVersionCode: 4
