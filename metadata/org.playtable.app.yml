Categories:
  - Board Game
  - Card Game
License: MIT
AuthorName: Ricardo Sierra
SourceCode: https://github.com/ricasolucoes/PlayTable
IssueTracker: https://github.com/ricasolucoes/PlayTable/issues
Changelog: https://github.com/ricasolucoes/PlayTable/blob/HEAD/CHANGELOG.md

AutoName: PlayTable

RepoType: git
Repo: https://github.com/ricasolucoes/PlayTable.git

Builds:
  - versionName: 0.4.0
    versionCode: 8
    commit: 54ac315b0d87236f69c270c8b9c4621486e96795
    sudo:
      - apt-get update
      - apt-get install -y pkgconf scons clang
    output: bin/PlayTable.apk
    srclibs:
      - Godot@4.6-stable
    prebuild: mkdir -p bin
    build:
      - pushd $$Godot$$
      - export ANDROID_NDK_ROOT=$$NDK$$
      - export ANDROID_HOME=$$SDK$$
      - export JAVA_HOME=$(dirname $(dirname $(readlink -f $(which javac))))
      - export SCONS="scons -j `nproc` verbose=no warnings=no progress=no 
        use_llvm=yes scu_build=yes accesskit=no"
      - $SCONS target=editor platform=linux
      - $SCONS target=template_release platform=android arch=arm64 
        production=yes swappy=no generate_android_binaries=yes generate_apk=yes
      - popd
      - mv $$Godot$$/bin/android_release.apk ./android_release.apk
      - sed -i -e 's:\(^.*package/signed\)\s*=.*$:\1 = false:' 
        export_presets.cfg
      - sed -i -e '/custom_template\/release/s|=.*|="./android_release.apk"|' 
        export_presets.cfg
      - sed -i -e '/architectures\/arm64-v8a/s|=.*|=true|' export_presets.cfg
      - sed -i -e '/version\/code=/s|=.*|=8|' export_presets.cfg
      - $$Godot$$/bin/godot.linuxbsd.editor.x86_64 --headless --export-release 
        "Android" bin/PlayTable.apk
    ndk: r28b

AutoUpdateMode: Version
UpdateCheckMode: Tags
UpdateCheckData: export_presets.cfg|version/code=(\d+)|.|version/name="([\d.]+)"
CurrentVersion: 0.4.0
CurrentVersionCode: 8
