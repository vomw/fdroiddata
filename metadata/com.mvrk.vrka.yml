Builds:
  - versionName: 4.5.3
    versionCode: 40503
    commit: 596d9cd0e9554311cce7b1465bdae36141de0795
    timeout: 36000
    subdir: app
    sudo:
      - echo "deb https://deb.debian.org/debian bookworm main" > /etc/apt/sources.list.d/bookworm.list
      - apt-get update
      - apt-get install -y -t bookworm openjdk-17-jdk-headless
      - update-java-alternatives -s java-1.17.0-openjdk-amd64
      - apt-get install -y cmake make m4 pkg-config python-is-python3 python3-venv
        ninja-build bzip2 libffi-dev libsqlite3-dev binutils-dev clang lld llvm nodejs
        libssl-dev zlib1g-dev rustup nasm
      - rm -f /usr/bin/cbindgen /bin/cbindgen
    patch:
      - 0001-fdroid-build.patch
    gradle:
      - assembleRelease
    output: build/outputs/apk/release/app-release-unsigned.apk
    srclibs:
      - MozFennec@FIREFOX-ANDROID_153_0_4_RELEASE
    prebuild:
      - sed -i 's|maven { url = uri("https://maven.mozilla.org/maven2/") }|mavenLocal()|'
        ../settings.gradle.kts
      - rm -rf $$SDK$$/cmdline-tools/20.0
      - mkdir -p $$SDK$$/cmdline-tools/20.0/bin
      - ln -sf $(which sdkmanager) $$SDK$$/cmdline-tools/20.0/bin/sdkmanager
      - ln -sf $(which sdkmanager) $$SDK$$/cmdline-tools/20.0/bin/avdmanager
      - mkdir -p $$SDK$$/emulator
      - ln -sf $(which true) $$SDK$$/emulator/emulator
      - mkdir -p "$HOME/.mozbuild/jdk"
      - touch "$HOME/.mozbuild/bundletool.jar"
      - ln -sf /usr/lib/jvm/java-17-openjdk-amd64 "$HOME/.mozbuild/jdk/jdk-17.0.18+8"
      - sdkmanager "build-tools;37.0.0" "platforms;android-37.0" 2>/dev/null || true
      - if [ ! -d $$SDK$$/platforms/android-37.0 ]; then latest_platform=$(ls -d $$SDK$$/platforms/android-*
        2>/dev/null | sort -V | tail -n 1); if [ -n "$latest_platform" ]; then ln
        -sf "$latest_platform" $$SDK$$/platforms/android-37.0; fi; fi
      - if [ ! -d $$SDK$$/build-tools/37.0.0 ]; then latest_bt=$(ls -d $$SDK$$/build-tools/*
        2>/dev/null | sort -V | tail -n 1); if [ -n "$latest_bt" ]; then ln -sf "$latest_bt"
        $$SDK$$/build-tools/37.0.0; fi; fi
      - pushd $$MozFennec$$
      - rustup default stable || true
      - rustup target add aarch64-linux-android || true
      - cargo install --version 0.29.4 cbindgen
      - export PATH="$HOME/.cargo/bin:$$NDK$$/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH"
      - export CBINDGEN="$HOME/.cargo/bin/cbindgen"
      - export ANDROID_BUNDLETOOL_PATH="$HOME/.mozbuild/bundletool.jar"
      - echo "INPUT(-lunwind)" > 
        $$NDK$$/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/aarch64-linux-android/libgcc.a
        || true
      - echo "ac_add_options --enable-project=mobile/android" > .mozconfig
      - echo "ac_add_options --target=aarch64-linux-android" >> .mozconfig
      - echo "ac_add_options --host=x86_64-unknown-linux-gnu" >> .mozconfig
      - echo "ac_add_options --with-android-ndk=\"$$NDK$$\"" >> .mozconfig
      - echo "ac_add_options --with-android-sdk=\"$$SDK$$\"" >> .mozconfig
      - echo "ac_add_options --with-java-bin-path=/usr/lib/jvm/java-17-openjdk-amd64/bin"
        >> .mozconfig
      - echo "ac_add_options --without-wasm-sandboxed-libraries" >> .mozconfig
      - echo "ac_add_options --enable-release" >> .mozconfig
      - echo "ac_add_options --enable-update-channel=release" >> .mozconfig
      - echo "ac_add_options --disable-debug" >> .mozconfig
      - echo "ac_add_options --disable-tests" >> .mozconfig
      - echo "ac_add_options --disable-crashreporter" >> .mozconfig
      - echo "ac_add_options --disable-updater" >> .mozconfig
      - echo "mk_add_options MOZ_OBJDIR=@TOPSRCDIR@/obj" >> .mozconfig
      - echo "mk_add_options MOZ_MAKE_FLAGS=\"-j4\"" >> .mozconfig
      - echo "mk_add_options MOZILLA_OFFICIAL=1" >> .mozconfig
      - echo "export MOZILLA_OFFICIAL=1" >> .mozconfig
      - echo "export MOZ_BUILD_DATE=20260810162159" >> .mozconfig
      - ./mach build
      - ./gradlew -x javadocDebug geckoview:publishDebugPublicationToMavenLocal
      - popd
    scanignore:
      - settings.gradle.kts
      - app/src/main/res/raw/ytdlp
      - app/src/main/assets/extensions/ublock.xpi
      - app/src/main/assets/extensions/puemos.xpi
    ndk: 29.0.14206865
    gradleprops:
      - configuration-cache=false

