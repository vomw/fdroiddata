AutoName: Ventoid
Description: |-
  Ventoid turns an Android phone into a practical Ventoy-style USB writer.
  Plug in a drive over USB OTG, pick the target device, and prepare bootable
  media directly from your phone.

  Features:
  * Direct USB mass-storage writing from Android over OTG
  * Choose between MBR and GPT Ventoy-compatible disk layouts
  * Clear stage-based install flow for MBR, Core, Data, and EFI
  * Bundled Secure Boot marker verification for the EFI image
  * Formats data partition as exFAT
  * No ads, no tracking, and no network connection required

