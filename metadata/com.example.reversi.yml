AutoName: Reversi
Description: |-
  A polished, feature-rich Reversi (Othello) game for Android with smooth OpenGL ES rendering and smart AI opponents.

  Features:
  * Multiple Game Modes - Player vs Player and Player vs AI
  * Smart AI Opponent - Easy, Medium, Hard, and Expert difficulty levels
  * Beautiful Graphics - Smooth OpenGL ES 1.0 hardware-accelerated rendering
  * Dual Move Highlighting - Shows valid moves for both players simultaneously
  * Live Game Statistics - Real-time score tracking and turn indicator
  * Full Game Controls - Undo/Redo functionality with full history
  * Multi-language Support - English and Japanese

  The AI uses a sophisticated algorithm combining minimax with alpha-beta pruning, position evaluation, and mobility analysis for challenging gameplay.

