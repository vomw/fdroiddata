Summary: Offline-first S3 explorer for Android
Description: >
  S3 Explorer is a modern Android app for browsing and managing objects in
  S3-compatible storage services such as AWS S3, MinIO, and Cloudflare R2.
  It supports connection profiles, encrypted local credential storage,
  offline caching, thumbnail previews, and media playback.

  The app is built with Jetpack Compose, Room, Hilt, and the AWS Kotlin SDK.
  It is intended for users who want a secure, privacy-conscious way to inspect
  and manage cloud storage buckets from Android devices.

