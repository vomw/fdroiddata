Builds:
  - versionName: 2.1.7
    versionCode: 153
    commit: 2f1589b5e003a7929bee22575da0d7db4e24e622
    subdir: app
    submodules: true
    gradle:
      - izzy
    prebuild:
      - sed -i '/maven.aliyun.com/d' ../settings.gradle.kts ../build.gradle.kts
      - echo 'subprojects{'>>../build.gradle.kts
      - echo 'configurations.all{'>>../build.gradle.kts
      - echo 'resolutionStrategy.dependencySubstitution{'>>../build.gradle.kts
      - echo 'substitute(module("com.github.promeg:tinypinyin"))'>>../build.gradle.kts
      - echo '.using('>>../build.gradle.kts
      - echo 'module("io.github.biezhi:TinyPinyin:2.0.3.RELEASE")'>>../build.gradle.kts
      - echo ')'>>../build.gradle.kts
      - echo '}}}'>>../build.gradle.kts

MaintainerNotes: |-
  The `izzy` product flavor (no GMS/Cast, no self-updater) is the F-Droid
  compliant build, as marked upstream. GMS/Cast dependencies are
  `gmsImplementation`-scoped and excluded from this flavor. The aliyun Maven
  mirror is removed in prebuild because F-Droid only allows known repositories.
  tinypinyin's POMs reference com.github.promeg (lowercase), an artifact that
  only exists on that mirror, so it is substituted with
  io.github.biezhi:TinyPinyin:2.0.3.RELEASE from Maven Central (same classes,
  verified).
  AntiFeatures NonFreeNet: the app requires YouTube Music, a proprietary
  network service.

