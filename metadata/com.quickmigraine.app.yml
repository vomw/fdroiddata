MaintainerNotes: |-
  Two Gradle product flavors share applicationId com.quickmigraine.app:
  "free" (this build, no Play Billing) and "full" (Play Store only, adds
  Play Billing donations). Only build the "free" flavor.

  v0.3.0 and v0.3.1 are not listed as buildable here: both pin the Gradle
  wrapper to 9.0-milestone-1, a pre-release build not suitable for
  F-Droid's build server. That was fixed in the commit tagged v0.3.2,
  which pins a stable Gradle 8.9 instead.

  The opt-in "Help improve MigraineLog" data-sharing feature posts to a
  developer-configured Google Apps Script endpoint (RemoteLinks.kt,
  SHARE_ENDPOINT_URL). It ships blank in the tagged release above, so the
  feature is inert in this build. If a future release ships a non-blank
  endpoint, add `AntiFeatures: NonFreeNet` and update this note.

