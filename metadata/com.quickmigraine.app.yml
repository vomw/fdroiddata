AutoName: MigraineLog
Summary: Track migraine attacks, symptoms, and triggers
Description: |-
  MigraineLog is a fast, privacy-first migraine tracker. Log an attack in two
  taps with a severity slider, then optionally record symptoms, triggers,
  food/drink triggers, medication and dose, relief, pain location and type,
  and duration (including "still ongoing" attacks you end later).

  Weather correlation fetches temperature, conditions, and barometric
  pressure from Open-Meteo for your last known location and compares it
  against past attacks, including an optional local notification if today's
  forecast looks similar to conditions during previous attacks. This is the
  only feature that touches the network by default; the app works fully
  offline otherwise, storing everything locally with Room/SQLite. No
  account, no login, no server.

  Insights aggregates total attacks, average severity and duration,
  medication effectiveness, common triggers, and pain-location breakdown,
  all computed on-device. History supports CSV export via the share sheet
  for handing your log to a doctor. The UI is always-dark, since light
  sensitivity is a core migraine symptom.

  An optional, off-by-default "Help improve MigraineLog" toggle can share
  logged attack data (never notes, never name or date of birth) with the
  developer; see the in-app Privacy screen for details.

