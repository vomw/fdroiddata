Builds:
  - versionName: 2.0.6
    versionCode: 271
    commit: 5624818032df60ed6911c17c115c32a4a1c9da9c
    subdir: workout-logger
    sudo:
      - mkdir -p /home/runner/
      - chown vagrant /home/runner/
    output: build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
    binary: 
      https://github.com/Devasy/Workout-logger/releases/download/v%v/repforge-v%v-armeabi-v7a.apk
    srclibs:
      - flutter@stable
    prebuild:
      - export repo=/home/runner/work/Workout-logger
      - mkdir -p $repo
      - curl -L -o /home/runner/ref.apk 
        https://github.com/Devasy/Workout-logger/releases/download/v$$VERSION$$/repforge-v$$VERSION$$-armeabi-v7a.apk
      - cd ../..
      - mv com.devasy.repforge $repo/Workout-logger
      - pushd $repo/Workout-logger/workout-logger
      - export PUB_CACHE=/home/runner/.pub-cache
      - 'export FLUTTER_VERSION=$(sed -n -E "s/^  flutter: (.+)/\1/p" pubspec.yaml)'
      - '[[ $FLUTTER_VERSION ]]'
      - git -C $$flutter$$ checkout -f $FLUTTER_VERSION
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get --enforce-lockfile
      - popd
      - mv $repo/Workout-logger com.devasy.repforge
      - cd com.devasy.repforge/workout-logger
    build:
      - export repo=/home/runner/work/Workout-logger
      - cd ../..
      - mv com.devasy.repforge $repo/Workout-logger
      - pushd $repo/Workout-logger/workout-logger
      - export PUB_CACHE=/home/runner/.pub-cache
      - $$flutter$$/bin/flutter build apk --release --split-per-abi --target-platform="android-arm"
      - python3 ../scripts/patch_so.py build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
        /home/runner/ref.apk build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
      - popd
      - mv $repo/Workout-logger com.devasy.repforge
      - cd com.devasy.repforge/workout-logger
    ndk: 28.2.13676358

