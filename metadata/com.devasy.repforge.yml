AntiFeatures:
  NonFreeNet:
    en-US: "The optional AI Coach and Routine Optimizer features send data to Google's
      Gemini API. These features are fully disabled unless the user provides their
      own Gemini API key in Settings → AI Settings.
"
Categories:
  - Sports & Health
License: Apache-2.0
AuthorName: Devasy Patel
SourceCode: https://github.com/Devasy/Workout-logger
IssueTracker: https://github.com/Devasy/Workout-logger/issues

AutoName: RepForge
Description: |-
  RepForge is a privacy-first workout logging app that helps you track sets,
  reps, and weights across customisable routines.

  Features:

  * Log workout sessions with sets, reps, and weights
  * Visualise progress with charts (volume, strength curves)
  * AI-powered set recommendations using on-device linear regression
  * Customisable exercise library with 50+ built-in exercises
  * Goal tracking with ML-estimated completion dates
  * Reusable workout routines
  * Health Connect integration for sleep and heart-rate readiness scores
  * Optional AI Coach powered by Google Gemini (requires a user-supplied API key)
  * Full data export/import — no account required

  All workout data is stored locally on-device using Hive. No data is sent to
  any server unless the user explicitly configures the optional AI Coach feature
  with their own API key.

RepoType: git
Repo: https://github.com/Devasy/Workout-logger

Builds:
  - versionName: 2.0.2
    versionCode: 23
    commit: v2.0.2
    subdir: workout-logger
    output: build/app/outputs/flutter-apk/app-release.apk
    srclibs:
      - flutter@3.41.6
    build:
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get
      - $$flutter$$/bin/flutter build apk --release

