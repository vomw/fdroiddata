AntiFeatures:
  NonFreeNet:
    en-US: "The optional AI Coach and Routine Optimizer features send data to Google's
      Gemini API. These features are fully disabled unless the user provides their
      own Gemini API key in Settings → AI Settings."
Categories:
  - Sports & Health
License: Apache-2.0
AuthorName: Devasy Patel
SourceCode: https://github.com/Devasy/Workout-logger
IssueTracker: https://github.com/Devasy/Workout-logger/issues

AutoName: RepForge
RepoType: git
Repo: https://github.com/Devasy/Workout-logger

Builds:
  - versionName: 2.0.3
    versionCode: 24
    commit: v2.0.3
    subdir: workout-logger
    output: build/app/outputs/flutter-apk/app-release.apk
    srclibs:
      - flutter@3.41.6
    build:
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get
      - $$flutter$$/bin/flutter build apk --release

AutoUpdateMode: Version
UpdateCheckMode: Tags ^v[\d.]+$
UpdateCheckData:
  workout-logger/pubspec.yaml|version:\s.*\+(\d+)|workout-logger/pubspec.yaml|version:\s([\d.]+)\+
CurrentVersion: 2.0.3
CurrentVersionCode: 24
