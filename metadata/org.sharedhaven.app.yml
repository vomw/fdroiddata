Builds:
  - versionName: 2.0.6
    versionCode: 2
    commit: 31f4d9f2a5896d0ded6e10199e8bd5e7f6e790fa
    sudo:
      - mkdir -p /home/ciprian/Desktop/flutterProjects
      - chown -R vagrant /home/ciprian
    output: build/app/outputs/bundle/release/app-release.aab
    srclibs:
      - flutter@stable
    rm:
      - ios
      - linux
      - macos
      - web
      - windows
    prebuild:
      - sed -i -e '/googleapis/d' android/build.gradle android/settings.gradle
      - sed -i -e '/java.home/d' android/gradle.properties
      - sed -i -e '/def keystorePropsFile/,/keystoreProps.load/d' -e '/signingConfig
        /d' android/app/build.gradle
      - flutterVersion=$(sed -n -E 's/.*Flutter version:\ (.*)/\1/p' pubspec.yaml)
      - '[[ $flutterVersion ]]'
      - git -C $$flutter$$ checkout -f $flutterVersion
      - export repo=/home/ciprian/Desktop/flutterProjects/flutter_wallet
      - cd ..
      - mv org.sharedhaven.app $repo
      - pushd $repo
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get
      - popd
      - mv $repo org.sharedhaven.app
    scandelete:
      - .pub-cache
      - android/app/.cxx
    build:
      - export repo=/home/ciprian/Desktop/flutterProjects/flutter_wallet
      - cd ..
      - mv org.sharedhaven.app $repo
      - pushd $repo
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter build apk --release
      - popd
      - mv $repo org.sharedhaven.app

