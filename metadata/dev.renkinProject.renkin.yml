Summary: Make your own Android icon pack, on your phone
Description: |-
  Renkin builds a real, installable icon pack from your own choices. 
  Combine icons from packs you already have, redraw or
  recolour them, then build your own icon pack and select it in
  your launcher.

  Fork of Alembicons by kaanelloed (formerly Iconeration), with its own
  direction on top.

