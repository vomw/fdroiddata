AutoName: Jaliscope
Summary: Free and open-source vectorscope audio visualizer centered around performance and customizability
Description: |-
  Jaliscope is a free and open-source (FOSS) vectorscope program centered around performance, accuracy, and customizability.

  It converts audio files into real-time line visualizations, allowing you to manipulate rendering options like rotation, scale, X/Y padding, and splines on the fly!

  Features:
  - Real-time C++ rendering powered by SDL3 and miniaudio
  - Support for FLAC, MP3, and WAV formats
  - Custom themes and interactive controls
  - Resampling speed/pitch controls and instant seeking

