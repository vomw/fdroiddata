Builds:
  - versionName: 0.2.0
    versionCode: 2
    commit: 319c12cafe1162f4b0b1ac60de4c322104367210
    subdir: app/android/app
    sudo:
      - apt-get update
      - apt-get install -y make g++ libc-dev
      - echo "deb https://deb.debian.org/debian forky main" > /etc/apt/sources.list.d/forky.list
      - apt-get update
      - apt-get install -y -t forky npm
    init:
      - cd ../..
      - npm_config_build_from_source=true npm install
    gradle:
      - yes
    prebuild:
      - cd ../..
      - mkdir -p android/app/src/main/assets
      - npx react-native bundle --platform android --dev false --entry-file index.js
        --bundle-output android/app/src/main/assets/index.android.bundle --assets-dest
        android/app/src/main/res/
    scandelete:
      - app/node_modules

