AntiFeatures:
  NonFreeNet:
    en-US: Price data, swap availability and routing, and Wallet Link use functions.vizor.cash;
      wallet synchronization uses the user-selected lightwalletd host.
  TetheredNet:
    en-US: Optional price, swap, and Wallet Link features depend on the fixed functions.vizor.cash
      service.
