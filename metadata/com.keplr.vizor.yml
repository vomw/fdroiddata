Builds:
  - versionName: 0.0.48
    versionCode: 481999
    commit: d20aa05e5eea369a286a8646c3a0902327b6fd17
    sudo:
      - apt-get update
      - apt-get install -y build-essential rustup
    output: build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
    binary: https://github.com/chainapsis/vizor-wallet-mobile-releases/releases/download/v%v/Vizor-android-armeabi-v7a.apk
    srclibs:
      - flutter@stable
    rm:
      - ios
      - linux
      - macos
      - windows
    prebuild:
      - git -C $$flutter$$ checkout -f d3b14c876900e553bc736ca19295fc09e3853e8e
      - export JAVA_HOME=/usr/lib/jvm/java-21-openjdk-amd64
      - export PUB_CACHE=$(pwd)/.pub-cache
      - export CARGO_HOME=/tmp/vizor-android-reproducible/cargo-home
      - install -d -m 700 /tmp/vizor-android-reproducible $PUB_CACHE $CARGO_HOME
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get --enforce-lockfile
      - rustup set profile minimal
      - rustup toolchain install 1.98.0
      - rustup default 1.98.0
      - rustup target add --toolchain 1.98.0 armv7-linux-androideabi aarch64-linux-android
        x86_64-linux-android
      - cargo fetch --locked --manifest-path rust/Cargo.toml
    scandelete:
      - .pub-cache
    build:
      - export JAVA_HOME=/usr/lib/jvm/java-21-openjdk-amd64
      - export PUB_CACHE=$(pwd)/.pub-cache
      - install -d -m 700 /tmp/vizor-android-reproducible/pub-cache
      - cp -a $PUB_CACHE/. /tmp/vizor-android-reproducible/pub-cache/
      - FLUTTER_BIN=$$flutter$$/bin/flutter ./scripts/build-android-fdroid.sh --version
        $$VERSION$$ --expected-abi armeabi-v7a --expected-version-code $$VERCODE$$
    ndk: 28.2.13676358

