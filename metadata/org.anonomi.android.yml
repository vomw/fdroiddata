AutoName: Anonomi Messenger
Description: |-
  Anonomi Messenger is a privacy-first communication tool designed for
  situations where networks are monitored, infrastructure is hostile, and
  trust assumptions fail.

  Unlike traditional messaging apps, Anonomi Messenger doesn't rely on a
  central server - messages are synchronized directly between the users'
  devices.

  If the Internet's down, Anonomi can sync via Bluetooth or Wi-Fi, keeping
  the information flowing in a crisis. If the Internet's up, Anonomi can
  sync via the Tor network, protecting users and their relationships from
  surveillance.

  Features include secure messaging, Tor support with bridge configuration,
  offline operation via Wi-Fi and Bluetooth, private payments via Monero,
  and offline maps with location sharing.

