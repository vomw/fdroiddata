Description: "This is a Text-To-Speech (TTS) engine for the Klingon language\
  \ ({tlhIngan Hol}) which can be used with {boQwI'} and other supported apps.\
  \ It can be used with any web browser which supports the text selection action.\
  \ (Chrome supports this, Firefox does not.) Look for it under your device's\
  \ Text-To-Speech settings.\
