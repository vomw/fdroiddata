AutoName: Munajaat Maqbool

Summary: Daily Munajaat-e-Maqbool supplications in Arabic, Urdu and English, offline
Description: |
    Munajaat Maqbool is a clean, modern, offline reader for Munajaat-e-Maqbool
    (The Accepted Whispers), the well-known collection of Qur'anic supplications
    compiled by Mawlana Ashraf Ali Thanawi, arranged as seven day-by-day sections
    from Sunday to Saturday.

    Each of the 195 numbered supplications is presented in Arabic together with
    its Urdu translation (checked against the printed booklet) and a fresh,
    independent English translation made from the Arabic source, plus 200 source
    and instruction footnotes.

    Features: trilingual text with per-language visibility, full-text search,
    bookmarks, adjustable text sizes, dark mode. The app works entirely offline
    and does not even request the internet permission. Free and open source
    (MIT licence) — no ads, no analytics, no accounts, no tracking.

