Name: AuraOrbit
Summary: Interactive 3D sphere live wallpaper with Fibonacci app distribution.
Description: |-
  AuraOrbit is a next-generation Android Live Wallpaper featuring a fully interactive 3D sphere that orbits your favorite apps right on your home screen. Built on the high-performance libGDX game engine, it leverages a golden angle Fibonacci distribution to plot your apps perfectly in a 3D space.

  Core Features:
  - Seamless 3D Rotation
  - Instant App Launching
  - Smart Dynamic Widgets
  - Deep Personalization
  - FOSS & Privacy First

Categories:
  - Personalization
  - Theming
License: GPL-3.0-only
