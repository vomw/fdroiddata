# Copy to fdroiddata as: metadata/com.appaparilla.manholer.yml
#
# Before opening an MR:
# - Set Repo, SourceCode, IssueTracker, and WebSite to your public HTTPS URLs (no SSH/private hosts).
# - Tag releases like 2026-03-29-de14fd61ad (YYYY-MM-DD-<10-char hex>); set Builds.commit to that tag or SHA.
# - versionCode / versionName must match the release APK. versionCode is git rev-list --count HEAD
#   (deterministic per commit). Bump Builds.versionCode when the commit’s count changes.
# - Run: fdroid readmeta && fdroid lint com.appaparilla.manholer

Categories:
  - Utilities
  - Navigation
License: AGPL-3.0-or-later
AuthorName: Appaparilla
WebSite: https://git.evulid.cc/cyberes/manholer
SourceCode: https://git.evulid.cc/cyberes/manholer
IssueTracker: https://git.evulid.cc/cyberes/manholer/issues
RepoType: git
Repo: https://git.evulid.cc/cyberes/manholer
AutoName: Manholer
Summary: Field notes for manholes, inlets, pipes, and exports
Description: |
  Manholer is a native Android app for utility and field work.

  * Record manholes, inlet boxes, and other structures
  * Document pipe directions and invert details
  * Capture measurements and notes
  * Export to PDF or CSV

  Location and camera are used only on device for your own documentation.

MaintainerNotes: |
  Release builds expect signing credentials. The prebuild generates a throwaway keystore and appends
  Gradle properties so assembleRelease can run in CI.
  versionCode in Builds must match the APK (equals git rev-list --count at that commit).

UpdateCheckMode: Tags ^[0-9]{4}-[0-9]{2}-[0-9]{2}-[0-9a-f]{10}$
AutoUpdateMode: Version

Builds:
  - versionName: 2026-04-01-ef00b31800
    versionCode: 35
    commit: ef00b3180040091dc318ef7ec86f0854c4476c80
    subdir: android
    prebuild: |
      keytool -genkeypair -v -keystore android/app/keystore.jks -alias upload -keyalg RSA -keysize 2048 -validity 10000 -noprompt -storepass android -keypass android -dname "CN=FDroid,O=FDroid,C=US"
      printf '\nRELEASE_STORE_PASSWORD=android\nRELEASE_KEY_PASSWORD=android\n' >> android/gradle.properties
    gradle:
      - yes
