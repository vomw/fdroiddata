MaintainerNotes: |-
  ThothTerm Security is an independent app that runs an Arch Linux ARM AArch64
  environment under PRoot. It is not affiliated with or endorsed by the
  BlackArch, Arch Linux or Arch Linux ARM projects. The product name is neutral
  on purpose: the app can optionally enable the third-party BlackArch
  repository, and "BlackArch" appears only as the factual name of that optional
  feature, never as the app's name, logo or identity (docs/garden/security/DESIGN.md).

  arm64-v8a only. minSdk 26, targetSdk 36. A separate app from ThothTerm
  Resolute (com.thothterm.ubuntu), Trixie (com.thothterm.debian) and Rolling
  (com.thothterm.arch); all are built on the same code, which lives in
  garden-common/.

  The fdroid flavour packages no distribution binaries and no security tool. The
  full flavour's rootfs staging task runs only for preFull*Build, so this build
  makes no network requests of its own. On first run the app downloads the Arch
  Linux ARM userland only after an explicit opt-in, from the project's GitHub
  release arch-rootfs-aarch64-03a4c669ed6f (the same archive ThothTerm Rolling
  uses), and refuses it unless its size and SHA-256 match
  garden-security/src/main/assets/garden/distro.properties (199826020 bytes,
  sha256 03a4c669ed6f89d044a9e83dce54c554f04885fd1bb7d1793f5b95b7cc0f48d1).
  That archive holds only unmodified, signature-checked Arch Linux ARM packages,
  ships no pacman keyring, sync databases or third-party material, and is
  reproducible byte for byte; it was rebuilt twice for this app with identical
  output (docs/garden/security/ROOTFS_PROVENANCE.md). The corresponding source of
  every package is attached to the same release.

  Optional, separate, consent-gated runtime step: the menu entry "Enable
  BlackArch repository" opens a second consent screen. Only if the user agrees,
  the app downloads one small keyring package (blackarch-keyring 20251011-2,
  18445 bytes) and its detached signature from blackarch.org over HTTPS and
  accepts them only if their size and SHA-256 equal values pinned in the app's
  source. It then compares the keyring's trust lists with the pinned ones
  (exactly four trusted fingerprints, one revoked) before importing anything,
  proves the result from the installation's own pacman keyring, checks the
  package signature against the pinned signer, installs the package with pacman
  (LocalFileSigLevel = Required) and adds one marked repository section to
  pacman.conf. Signature checking stays required for every repository; no
  SigLevel is lowered, no script from the network is run, no package is
  installed for the user, and the terminal never waits for any of it. The
  keyring package declares no licence (custom:unknown), which is why it is not
  redistributed: it is not in this APK, the rootfs or the source tree. The
  repository keeps only its latest keyring, so a new upstream release makes the
  download fail closed until the pins are updated in a new release.

  The PRoot runtime is compiled during the build by
  garden-common/tools/build-proot.sh from sources in the repository:
  third_party/proot (termux/proot, tag v5.1.107.92) and
  third_party/libandroid-shmem (termux/libandroid-shmem, tag v0.7) as
  submodules, plus talloc 2.4.3's talloc.c and talloc.h vendored verbatim. The
  script verifies both submodule commits, downloads nothing, and checks 16 KB
  page alignment. submodules: true is therefore required. PRoot is GPL-2.0 and
  talloc LGPL-3.0; the corresponding source is the pinned submodules, the eight
  patches in garden-common/patches and the build script, all in the tagged
  commit.

  LAN Mode is an HTTP/WebSocket server, off by default, that the user turns on
  to use the terminal from a browser on the same Wi-Fi or Ethernet network
  after pairing with a one-time PIN. It binds only a private LAN address, uses
  no external service, and serves only assets packaged in the APK
  (garden-common/src/main/assets/lan). Its xterm.js bundle is built unminified
  from npm packages pinned by sha512 by garden-common/lan-web/build.mjs;
  `npm ci --ignore-scripts && node build.mjs --check` reproduces the committed
  files. The Gradle build does not run Node. Uploads into the terminal's
  current directory use the Storage Access Framework on the phone (no storage
  permission) and four authenticated endpoints in LAN Mode.

  The app exports only its launcher activity (and androidx's profile installer,
  which requires android.permission.DUMP); permanent tests check this on every
  built APK. Release builds are minified with proguard-android-optimize.txt plus
  garden-common/consumer-rules.pro, which holds two keep rules only: the native
  library registers its methods by the literal class names
  com/thothterm/TermIO$Native and com/thothterm/Process$Native.

