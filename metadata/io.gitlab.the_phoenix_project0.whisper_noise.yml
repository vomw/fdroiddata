License: MIT
AuthorName: the-phoenix-project0
WebSite: https://gitlab.com/the-phoenix-project0/whisper-noise
SourceCode: https://gitlab.com/the-phoenix-project0/whisper-noise
IssueTracker: https://gitlab.com/the-phoenix-project0/whisper-noise/-/issues

AutoName: Whisper Noise
Description: |-
  A calming white noise generator for better sleep, focus, and relaxation.
  This app features a beautiful dark neumorphic interface and high-quality noise sounds.

  Features:
  * Multiple Noise Types: Choose from various white noise, brown noise, and other relaxing sounds.
  * Full Volume on Start: All noises start at full volume for immediate immersion.
  * Beautiful UI: A modern, dark neumorphic design that's easy on the eyes, especially at night.
  * Smooth Animations: Upgraded UI transitions for a premium and calm feel.
  * Background Play: Keep the noise playing even when you switch apps.

RepoType: git
Repo: https://gitlab.com/the-phoenix-project0/whisper-noise.git

Builds:
  - versionName: 1.0.0
    versionCode: 1
    commit: v1.0.0
    output: build/app/outputs/flutter-apk/app-release.apk
    srclibs:
      - flutter@stable
    build:
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get
      - $$flutter$$/bin/flutter build apk --release

AutoUpdateMode: Version
UpdateCheckMode: Tags ^v[\d.]+
UpdateCheckData: pubspec.yaml|version:\s.+\+(\d+)|.|version:\s(.+)\+
CurrentVersion: 1.0.0
CurrentVersionCode: 1
