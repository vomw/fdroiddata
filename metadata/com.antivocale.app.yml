Builds:
  - versionName: 1.8.1
    versionCode: 25
    commit: v1.8.1
    subdir: app
    gradle:
      - fdroid
    prebuild: "sed -E -i \"/(crashlytics|com\\.google\\.firebase|com\\.google\\.gms)/d\"\
      \ build.gradle.kts ../build.gradle.kts\nmkdir -p libs\ncurl -L -o libs/sherpa-onnx.aar
      \\\n  https://github.com/k2-fsa/sherpa-onnx/releases/download/v1.13.4/sherpa-onnx-1.13.4.aar\n"
    scanignore:
      - app/libs/sherpa-onnx.aar

  - versionName: 1.8.3
    versionCode: 29
    commit: v1.8.3
    subdir: app
    sudo:
      - apt-get update
      - apt-get install -y wget build-essential cmake g++ zip unzip
    gradle:
      - fdroid
    srclibs:
      - sherpa_onnx@v1.13.4
    prebuild:
      - sed -E -i "/(crashlytics|com\.google\.firebase|com\.google\.gms)/d" build.gradle.kts
        ../build.gradle.kts
      - mkdir -p libs
    build:
      - pushd $$sherpa_onnx$$
      - ./build-android-arm64-v8a.sh
      - ./build-android-armv7-eabi.sh
      - ./build-android-x86-64.sh
      - ./build-android-x86.sh
      - popd
      - J=$$sherpa_onnx$$/android/SherpaOnnxAar/sherpa_onnx/src/main/jniLibs
      - mkdir -p $J/arm64-v8a $J/armeabi-v7a $J/x86_64 $J/x86
      - cp $$sherpa_onnx$$/build-android-arm64-v8a/install/lib/lib*.so $J/arm64-v8a/
      - cp $$sherpa_onnx$$/build-android-armv7-eabi/install/lib/lib*.so $J/armeabi-v7a/
      - cp $$sherpa_onnx$$/build-android-x86-64/install/lib/lib*.so $J/x86_64/
      - cp $$sherpa_onnx$$/build-android-x86/install/lib/lib*.so $J/x86/
      - $$sherpa_onnx$$/android/SherpaOnnxAar/gradlew -p $$sherpa_onnx$$/android/SherpaOnnxAar
        :sherpa_onnx:assembleRelease
      - cp 
        $$sherpa_onnx$$/android/SherpaOnnxAar/sherpa_onnx/build/outputs/aar/sherpa_onnx-release.aar
        libs/sherpa-onnx.aar
    ndk: r27c

AutoUpdateMode: Version
UpdateCheckMode: Tags
CurrentVersion: 1.8.3
CurrentVersionCode: 29
