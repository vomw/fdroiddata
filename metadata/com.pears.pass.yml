Categories:
  - Password & 2FA
License: Apache-2.0
AuthorName: Tether Data S.A. de C.V
WebSite: https://pass.pears.com
SourceCode: https://github.com/tetherto/pearpass-app-mobile
IssueTracker: https://github.com/tetherto/pearpass-app-mobile/issues
Changelog: https://github.com/tetherto/pearpass-app-mobile/releases

Name: PearPass
AutoName: pearpass-app-mobile

RepoType: git
Repo: https://github.com/tetherto/pearpass-app-mobile.git

Builds:
  - versionName: 1.6.1
    versionCode: 11
    commit: 67b198704a9a98bb5f22db4aea9b5cbe75537341
    sudo:
      - echo "deb https://deb.debian.org/debian bookworm main" > /etc/apt/sources.list.d/bookworm.list
      - echo "deb https://deb.debian.org/debian trixie main" > /etc/apt/sources.list.d/trixie.list
      - 'echo "Package: *" > /etc/apt/preferences.d/trixie'
      - 'echo "Pin: release n=trixie" >> /etc/apt/preferences.d/trixie'
      - 'echo "Pin-Priority: 100" >> /etc/apt/preferences.d/trixie'
      - apt-get update
      - apt-get install -y make g++
      - apt-get install -y -t bookworm openjdk-17-jdk-headless
      - apt-get install -y -t trixie nodejs npm
    init:
      - HUSKY=0 npm ci --install-links --legacy-peer-deps --no-audit --no-fund
      - node scripts/fdroid/create-stubs.mjs
      - npm run fdroid:patches:prebuild
      - PEARPASS_DISTRIBUTION=fdroid npx expo prebuild --platform android --clean
        --no-install
      - perl -0777 -i -pe "s/def reactNativeAndroidDir = new File\\([\\s\\S]*?\\n\\)\\n\\n//g"
        android/build.gradle
      - perl -0777 -i -pe "s/\\n\\s*maven \\{\\n\\s*\\/\\/ All of React Native[^\\n]*\\n\\s*url\\(reactNativeAndroidDir\\)\\n\\s*\\}\\n/\\n/g"
        android/build.gradle
      - perl -i -ne "print unless 
        /credentials-play-services-auth|play-services-auth|googleid|play-services-fido|firebase-messaging/"
        android/app/build.gradle
    output: 
      android/app/build/outputs/apk/fdroid/release/app-fdroid-armeabi-v7a-release-unsigned.apk
    prebuild:
      - npm run fdroid:patches:build
      - npm run build
      - bash scripts/fdroid/patch-gradle.sh armeabi-v7a
      - printf 
        '\nreactNativeArchitectures=armeabi-v7a\nandroid.lint.checkReleaseBuilds=false\nandroid.enableDependencyInfoInApks=false\nVisionCamera_enableCodeScanner=false\n'
        >> android/gradle.properties
    scanignore:
      - node_modules/expo-asset/local-maven-repo
      - node_modules/expo-av/local-maven-repo
      - node_modules/expo-blur/local-maven-repo
      - node_modules/expo-clipboard/local-maven-repo
      - node_modules/expo-document-picker/local-maven-repo
      - node_modules/expo-file-system/local-maven-repo
      - node_modules/expo-font/local-maven-repo
      - node_modules/expo-haptics/local-maven-repo
      - node_modules/expo-image-picker/local-maven-repo
      - node_modules/expo-keep-awake/local-maven-repo
      - node_modules/expo-linking/local-maven-repo
      - node_modules/expo-local-authentication/local-maven-repo
      - node_modules/expo-navigation-bar/local-maven-repo
      - node_modules/expo-secure-store/local-maven-repo
      - node_modules/expo-sharing/local-maven-repo
      - node_modules/expo-video/local-maven-repo
      - node_modules/@react-native-async-storage/async-storage/android/build.gradle
      - node_modules/@react-native-community/netinfo/android/build.gradle
      - node_modules/expo-modules-autolinking/scripts/android/autolinking_implementation.gradle
      - node_modules/expo-modules-core/android/ExpoModulesCorePlugin.gradle
      - node_modules/react-native-edge-to-edge/android/build.gradle
      - node_modules/react-native-reanimated/android/build.gradle
      - node_modules/react-native-safe-area-context/android/build.gradle
      - node_modules/react-native-screens/android/build.gradle
      - node_modules/react-native-svg/android/build.gradle
      - node_modules/react-native-vector-icons/android/build.gradle
      - node_modules/react-native/ReactAndroid/publish.gradle
      - node_modules/rive-react-native/android/build.gradle
      - node_modules/react-native/sdks/hermesc/linux64-bin
      - node_modules/esbuild/bin/esbuild
      - node_modules/@esbuild
      - node_modules/source-map/lib/mappings.wasm
    scandelete:
      - plugins/expo-autofill-plugin/android-template/jniLibs/
      - android/app/src/main/jniLibs/
      - node_modules/@tetherto/pearpass-lib-ui-theme-provider/node_modules/react-native
      - node_modules/react-native-bare-kit/ios
      - node_modules/react-native/React/I18n/strings
      - node_modules/react-native/sdks/hermesc/osx-bin
      - node_modules/react-native/sdks/hermesc/win64-bin
      - node_modules/@react-native-community/slider/android/build
      - node_modules/jszip/.jekyll-metadata
    build:
      - cd android
      - gradlew-fdroid assembleFdroidRelease --no-daemon --parallel
    ndk: 27.1.12297006

