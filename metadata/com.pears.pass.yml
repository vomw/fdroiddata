Categories:
  - Password & 2FA
License: Apache-2.0
AuthorName: Tether Data S.A. de C.V
WebSite: https://pass.pears.com
SourceCode: https://github.com/tetherto/pearpass-app-mobile
IssueTracker: https://github.com/tetherto/pearpass-app-mobile/issues
Changelog: https://github.com/tetherto/pearpass-app-mobile/releases

Name: PearPass
AutoName: pearpass-app-mobile

RepoType: git
Repo: https://github.com/tetherto/pearpass-app-mobile.git

Builds:
  - versionName: 1.6.1
    versionCode: 11
    commit: 67b198704a9a98bb5f22db4aea9b5cbe75537341
    sudo:
      - echo "deb https://deb.debian.org/debian bookworm main" > /etc/apt/sources.list.d/bookworm.list
      - apt-get update
      - apt-get install -y make g++
      - apt-get install -y -t bookworm openjdk-17-jdk-headless
      - curl -Lo node.tar.gz https://nodejs.org/dist/v20.20.2/node-v20.20.2-linux-x64.tar.gz
      - echo "19e56f0825510207dd904f087fe52faa0a4eb6b2aab5f0ea7a33830d04888b8b node.tar.gz"
        | sha256sum -c -
      - tar xzf node.tar.gz --strip-components=1 -C /usr/local/
    init:
      - HUSKY=0 npm ci --install-links --legacy-peer-deps --no-audit --no-fund
      - node scripts/fdroid/create-stubs.mjs
      - npm run fdroid:patches:prebuild
      - PEARPASS_DISTRIBUTION=fdroid npx expo prebuild --platform android --clean
        --no-install
      - perl -0777 -i -pe "s/def reactNativeAndroidDir = new File\\([\\s\\S]*?\\n\\)\\n\\n//g"
        android/build.gradle
      - perl -0777 -i -pe "s/\\n\\s*maven \\{\\n\\s*\\/\\/ All of React Native[^\\n]*\\n\\s*url\\(reactNativeAndroidDir\\)\\n\\s*\\}\\n/\\n/g"
        android/build.gradle
      - perl -i -ne "print unless 
        /credentials-play-services-auth|play-services-auth|googleid|play-services-fido|firebase-messaging/"
        android/app/build.gradle
    output: 
      android/app/build/outputs/apk/fdroid/release/app-fdroid-armeabi-v7a-release-unsigned.apk
    prebuild:
      - npm run fdroid:patches:build
      - npm run build
      - bash scripts/fdroid/patch-gradle.sh armeabi-v7a
      - printf 
        '\nreactNativeArchitectures=armeabi-v7a\nandroid.lint.checkReleaseBuilds=false\nandroid.enableDependencyInfoInApks=false\nVisionCamera_enableCodeScanner=false\n'
        >> android/gradle.properties
    scanignore:
      - node_modules
    scandelete:
      - plugins/expo-autofill-plugin/android-template/jniLibs/
      - android/app/src/main/jniLibs/
    build:
      - cd android
      - gradlew-fdroid assembleFdroidRelease --no-daemon --parallel
    ndk: 27.1.12297006

