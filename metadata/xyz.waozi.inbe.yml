  AuthorName: waozi
  AuthorWebSite: https://waozi.xyz/
  SourceCode: https://github.com/waozixyz/inbe
  IssueTracker: https://github.com/waozixyz/inbe/issues
  Name: Inner Breeze
  Summary: Guided breathing meditation based on Wim Hof method
  Description: |
    A free, open-source guided breathing meditation app based on the Wim Hof method.

    Features:
    - Guided breathing sessions with visual and audio cues
    - Configurable breath counts and hold times
    - Session history with local storage
    - 8 color themes (Forest, Ocean, Sky, Sunset, Lavender - each with light/dark variants)
    - Sound effects (breath in/out, bell)
    - Fullscreen mode with proper DPI scaling
    - Touch-optimized UI for mobile devices

    Available platforms: Linux, Windows, Android, WebAssembly.
  Categories: Health
  RepoType: git
  Repo: https://github.com/waozixyz/inbe.git
  Builds:
    - versionName: 1.0.7
      versionCode: 8
      commit: v1.0.7
      subdir: droid
      gradle:
        - yes
      gradleprops:
        - fDroidBuild=true
      output: app/build/outputs/apk/release/app-universal-release-unsigned.apk
      submodules: true
      scanignore:
        - vendor/raylib/examples/


