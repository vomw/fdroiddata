Categories:
  - Writing
License: AGPL-3.0-or-later
AuthorName: Clément Pera
AuthorWebSite: https://clem.nextmiracle.eu
SourceCode: https://github.com/ClemPera/Nooto
IssueTracker: https://github.com/ClemPera/Nooto/issues

AutoName: Nooto

RepoType: git
Repo: https://github.com/ClemPera/Nooto

Builds:
  - versionName: 0.2.1
    versionCode: 2001
    commit: cb76f3b8225368a283222a359815443a5b6e3612
    subdir: client
    sudo:
      - apt-get update
      - apt-get install -y rustup npm make build-essential wget
    init:
      - rustup default 1.98.0
      - rustup target add aarch64-linux-android
    output: src-tauri/gen/android/app/build/outputs/apk/arm64/release/*.apk
    build:
      - export RUSTFLAGS="--remap-path-prefix=$HOME/.cargo=/cargo --remap-path-prefix=$PWD=/build"
      - export TARGET_RANLIB="$$NDK$$/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ranlib"
      - npm install
      - npm run tauri android build -- --apk --split-per-abi --target aarch64
    ndk: 27.0.12077973

AutoUpdateMode: Version
UpdateCheckMode: Tags ^client-v[0-9.]+$
UpdateCheckData: 
  client/src-tauri/gen/android/app/tauri.properties|tauri\.android\.versionCode=(\d+)|.|tauri\.android\.versionName=(.+)
CurrentVersion: 0.2.1
CurrentVersionCode: 2001
