AutoName: Nooto

RepoType: git
Repo: https://github.com/ClemPera/Nooto
Binaries: 
  https://github.com/ClemPera/Nooto/releases/download/client-v%v/app-arm64-release.apk

Builds:
  - versionName: 0.2.0
    versionCode: 2000
    commit: f43aa1927e9397acf5d2adfa4958765f37e716b6
    subdir: client
    sudo:
      - apt-get update
      - apt-get install -y rustup npm make build-essential wget
    init:
      - rustup default 1.98.0
      - rustup target add aarch64-linux-android
    output: src-tauri/gen/android/app/build/outputs/apk/arm64/release/*.apk
    build:
      - export RUSTFLAGS="--remap-path-prefix=$HOME/.cargo=/cargo --remap-path-prefix=$PWD=/build"
      - npm install
      - npm run tauri android build -- --apk --split-per-abi --target aarch64
    ndk: 27.0.12077973

AllowedAPKSigningKeys: 46ce9259dd8eba36470faaf0dcdcd1fc958b6d3c5f84f0303645603a5b86e8b0

AutoUpdateMode: Version
UpdateCheckMode: Tags ^client-v[0-9.]+$
UpdateCheckData: 
  client/src-tauri/gen/android/app/tauri.properties|tauri\.android\.versionCode=(\d+)|.|tauri\.android\.versionName=(.+)
