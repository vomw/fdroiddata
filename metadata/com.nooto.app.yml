License: AGPL-3.0-or-later
AuthorName: Clément Pera
AuthorWebSite: https://clem.nextmiracle.eu
SourceCode: https://github.com/ClemPera/Nooto
IssueTracker: https://github.com/ClemPera/Nooto/issues

RepoType: git
Repo: https://github.com/ClemPera/Nooto

Builds:
  - versionName: 0.2.0
    versionCode: 2000
    commit: d0618b1ddc66a6c74ff30166d9b53933e283c898
    subdir: client/src-tauri/gen/android
    sudo:
      - apt update
      - apt install -y rustup npm make build-essential libwebkit2gtk-4.1-dev wget libxdo-dev libayatana-appindicator3-dev librsvg2-dev
      - sdkmanager --install "ndk;29.0.14206865"
      - rustup default stable
      - rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android i686-linux-android

    init:
      - export ANDROID_NDK_HOME=/opt/android-sdk/ndk/29.0.14206865
      - export NDK_HOME=/opt/android-sdk/ndk/29.0.14206865 
      
      - cd ../../.. 
      - npm install
      - npm run tauri android build -- --apk

      #post
      - cp client/src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release-unsigned.apk client/src-tauri/gen/android/fdroid-release/
      - rm -rf target
      - rm -rf client/src-tauri/gen/android/app/build
    output: fdroid-release/*.apk
    scandelete:
      - client/node_modules/@rolldown/binding-wasm32-wasi
      
