Categories:
  - Internet
License: Apache-2.0
AuthorName: Simon Steindl
WebSite: https://github.com/SimonSteindl/pi-control
SourceCode: https://github.com/SimonSteindl/pi-control
IssueTracker: https://github.com/SimonSteindl/pi-control/issues
Changelog: https://github.com/SimonSteindl/pi-control/releases

AutoUpdateMode: Version
UpdateCheckMode: Tags
UpdateCheckData: pubspec.yaml|version:\s.+\+(\d+)|.|version:\s(.+)\+
CurrentVersion: '2.3.1'
CurrentVersionCode: 13

RepoType: git
Repo: https://github.com/SimonSteindl/pi-control.git
Builds:
  - versionName: '2.3.1'
    versionCode: 13
    commit: ede023e8fa287fa9990285d1d329a1f4d5b45c61
    output: build/app/outputs/flutter-apk/app-release.apk
    srclibs:
      - flutter@stable
    rm:
      - ios
      - linux
      - macos
      - web
      - windows
    prebuild:
      - flutterVersion=$(sed -n -E "s/.*flutter-version: '(.*)'/\1/p" .github/workflows/verify.yml)
      - '[[ $flutterVersion ]]'
      - git -C $$flutter$$ checkout -f $flutterVersion
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get --enforce-lockfile
    scandelete:
      - .pub-cache
    build:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter build apk --release
