    versionCode: 1
    commit: e3fd7f4e6d8a59123d5a402aa3b85aff60f946ac
    subdir: app
    output: build/app/outputs/flutter-apk/app-release.apk
    srclibs:
      - flutter@stable
    rm:
      - backend
    prebuild:
      - flutterVersion=
      - '[[  ]]'
      - git -C flutter checkout -f 
      - export PATH="flutter/bin:flutter/bin/cache/dart-sdk/bin:"
      - flutter config --no-analytics
      - flutter pub get --enforce-lockfile
    build:
      - export PATH="flutter/bin:flutter/bin/cache/dart-sdk/bin:"
      - flutter build apk --release

