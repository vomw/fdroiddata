Categories:
  - Money
License: MIT
SourceCode: https://github.com/Bittu-the-coder/hisab
IssueTracker: https://github.com/Bittu-the-coder/hisab/issues

AutoName: Hisab
Summary: Personal expense tracker with group splitting
Description: |-
  Hisab is a clean, open-source expense tracking app for individuals
  and friend groups. Track daily spending, set budgets, visualize
  spending patterns, and split shared expenses with friends.

RepoType: git
Repo: https://github.com/Bittu-the-coder/hisab

Builds:
  - versionName: '1.1.0'
    versionCode: 1
    commit: v1.1.0
    subdir: app
    sudo:
      - apt-get install -y openjdk-17-jdk
    init:
      - flutter pub get
    scandelete:
      - backend
    build:
      - flutter build apk --release
    output: build/app/outputs/flutter-apk/app-release.apk
    buildjni:
      - yes

AutoUpdateMode: Version
UpdateCheckMode: Tags
CurrentVersion: '1.1.0'
CurrentVersionCode: 1