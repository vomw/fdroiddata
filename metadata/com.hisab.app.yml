Categories:
  - Finance Manager
License: MIT
SourceCode: https://github.com/Bittu-the-coder/hisab
IssueTracker: https://github.com/Bittu-the-coder/hisab/issues

AutoName: Hisab

RepoType: git
Repo: https://github.com/Bittu-the-coder/hisab

Builds:
  - versionName: 1.1.0
    versionCode: 1
    commit: b8109718c8b68ccd06e003b76dca9785e84bafd3
    subdir: app
    sudo:
      - apt-get install -y openjdk-21-jdk-headless
    srclibs:
      - flutter@stable
    rm:
      - backend
    output: build/app/outputs/flutter-apk/app-release.apk
    prebuild:
      - flutterVersion=$(cat .flutter-version)
      - [[ $flutterVersion ]]
      - git -C $$flutter$$ checkout -f $flutterVersion
      - export PATH="$$flutter$$/bin:$$flutter$$/bin/cache/dart-sdk/bin:$PATH"
      - flutter config --no-analytics
      - flutter pub get
    build:
      - export PATH="$$flutter$$/bin:$$flutter$$/bin/cache/dart-sdk/bin:$PATH"
      - flutter build apk --release

AutoUpdateMode: Version
UpdateCheckMode: Tags
UpdateCheckData: pubspec.yaml|version:\s.+\+(\d+)|.|version:\s(.+)\+
CurrentVersion: 1.1.0
CurrentVersionCode: 1