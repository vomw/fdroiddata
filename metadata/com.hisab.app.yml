Categories:
  - Finance Manager
License: MIT
SourceCode: https://github.com/Bittu-the-coder/hisab
IssueTracker: https://github.com/Bittu-the-coder/hisab/issues

AutoName: Hisab
Summary: Personal expense tracker with group splitting
Description: |-
  Hisab is a clean, open-source expense tracking app for individuals
  and friend groups. Track daily spending, set budgets, visualize
  spending patterns, and split shared expenses with friends.

RepoType: git
Repo: https://github.com/Bittu-the-coder/hisab

Builds:
  - versionName: 1.1.0
    versionCode: 1
    commit: v1.1.0
    subdir: app
    sudo: apt-get install -y openjdk-21-jdk-headless
    init: flutter pub get
    output: build/app/outputs/flutter-apk/app-release.apk
    scandelete:
      - backend
    build: flutter build apk --release

AutoUpdateMode: None
UpdateCheckMode: None
UpdateCheckData: app/pubspec.yaml|version:\s.+\+(\d+)|app/pubspec.yaml|version:\s(\d+\.\d+\.\d+)
CurrentVersion: 1.1.0
CurrentVersionCode: 1
