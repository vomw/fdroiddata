AutoName: Hisab

RepoType: git
Repo: https://github.com/Bittu-the-coder/hisab

Builds:
  - versionName: 1.1.0
    versionCode: 11
    commit: df13772012e7572639b1c3db42b8f8fa9b87440c
    subdir: app
    sudo:
      - mkdir -p /home/runner/work/hisab
      - chown -R vagrant /home/runner
    output: build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
    srclibs:
      - flutter@stable
    rm:
      - backend
    prebuild:
      - export repo=/home/runner/work/hisab/hisab
      - cd ../..
      - mv com.hisab.app $repo
      - pushd $repo
      - cd app
      - flutterVersion=$(cat .flutter-version)
      - '[[ $flutterVersion ]]'
      - git -C $$flutter$$ checkout -f $flutterVersion
      - export PATH="$$flutter$$/bin:$$flutter$$/bin/cache/dart-sdk/bin:$PATH"
      - export PUB_CACHE=$(pwd)/.pub-cache
      - flutter config --no-analytics
      - flutter pub get --enforce-lockfile
      - popd
      - mv $repo com.hisab.app
    scandelete:
      - app/.pub-cache
    build:
      - export repo=/home/runner/work/hisab/hisab
      - cd ../..
      - mv com.hisab.app $repo
      - pushd $repo
      - cd app
      - export PATH="$$flutter$$/bin:$$flutter$$/bin/cache/dart-sdk/bin:$PATH"
      - export PUB_CACHE=$(pwd)/.pub-cache
      - flutter build apk --release --split-per-abi --target-platform android-arm
      - popd
      - mv $repo com.hisab.app

