Categories:
  - Finance Manager
License: MIT
SourceCode: https://github.com/Bittu-the-coder/hisab
IssueTracker: https://github.com/Bittu-the-coder/hisab/issues

AutoName: Hisab

RepoType: git
Repo: https://github.com/Bittu-the-coder/hisab

Builds:
  - versionName: 1.1.0
    versionCode: 1
    commit: e3fd7f4e6d8a59123d5a402aa3b85aff60f946ac
    subdir: app
    output: build/app/outputs/flutter-apk/app-release.apk
    srclibs:
      - flutter@stable
    rm:
      - backend
    prebuild:
      - flutterVersion=$(cat .flutter-version)
      - '[[ $flutterVersion ]]'
      - git -C $$flutter$$ checkout -f $flutterVersion
      - export PATH="$$flutter$$/bin:$$flutter$$/bin/cache/dart-sdk/bin:$PATH"
      - flutter config --no-analytics
      - flutter pub get --enforce-lockfile
    build:
      - export PATH="$$flutter$$/bin:$$flutter$$/bin/cache/dart-sdk/bin:$PATH"
      - flutter build apk --release

Binaries: https://github.com/Bittu-the-coder/hisab/releases/download/v%VERSION%/app-release-signed.apk
AllowedAPKSigningKeys: BE:97:57:2E:43:83:BA:23:57:6A:6D:C4:0B:B0:07:7C:12:12:6F:E4:7C:08:5C:D6:C6:D6:03:12:50:72:CE:65

AutoUpdateMode: Version
UpdateCheckMode: Tags
UpdateCheckData: app/pubspec.yaml|version:\s.+\+(\d+)|app/pubspec.yaml|version:\s(.+)\+
