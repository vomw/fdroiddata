AutoName: AutoScroller
Summary: Auto-scroll de videos con bienestar digital
Description: |-
  AutoScroller avanza automáticamente al siguiente video en tus feeds verticales
  cada N segundos sin que tengas que tocar la pantalla.

  Características principales:

  * Activación por gestos: Tap con 3 dedos o swipes hacia arriba dentro de la app configurada
  * Pausa inteligente: Si tocas o haces scroll manual, el auto-scroll se suspende y reanuda solo
  * Bienestar digital: Cronómetro en segundo plano y notificaciones al llegar a tu límite de tiempo
  * Privacidad: 100% local. Usa AccessibilityService, no requiere permisos de internet

Categories:
  - System
  - Multimedia
  - Internet
License: MIT
SourceCode: https://github.com/sebacoden/autoScroll
IssueTracker: https://github.com/sebacoden/autoScroll/issues

RepoType: git
Repo: https://github.com/sebacoden/autoScroll

Builds:
  - versionName: 0.1.0
    versionCode: 1
    commit: 68c5aacf80d73327a5b3b9fdf8a34475de880ec0
    subdir: android/app
    gradle: yes
    prebuild: |-
      printf "sdk.dir=%s\n" "${ANDROID_HOME}" > local.properties
      sed -i '/foojay-resolver/d' ../settings.gradle.kts
      sed -i '/org\.gradle\.jvmargs/d' ../gradle.properties
      sed -i '/org\.gradle\.configuration-cache/d' ../gradle.properties
      echo "org.gradle.jvmargs=-Xmx2048m -XX:-UseContainerSupport -Xlog:disable" >> ../gradle.properties
      echo "org.gradle.configuration-cache=false" >> ../gradle.properties

AutoUpdateMode: Version
UpdateCheckMode: Tags
