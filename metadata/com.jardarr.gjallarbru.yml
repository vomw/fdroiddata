IssueTracker: https://github.com/Jardarr/gjallarbru/issues

AutoName: Gjallarbru

Summary: Offline Old Norse poetry reader with parallel translations

Description: |
  Gjallarbru is an offline mobile application for reading Old Norse poetry with parallel translations.

  The app allows comfortable reading of original Old Norse texts alongside Russian or English translations.

  Features:
  - Parallel text layout (Old Norse + translation)
  - Support for stanza and prose formats
  - Adjustable font size
  - Light and dark themes
  - Full-text search across all languages
  - Completely offline — no network access required

  All texts are bundled with the application and aligned for a consistent reading experience.

RepoType: git
Repo: https://github.com/Jardarr/gjallarbru

Builds:
  - versionName: 1.0.0
    versionCode: 1
    commit: HEAD
    subdir: android
    sudo:
      - apt-get update
      - apt-get install -y nodejs npm
    init:
      - cd ..
      - npm ci
    scanignore:
      - node_modules/expo/template.tgz
      - node_modules/react-native/React/I18n
      - node_modules/react-native/sdks/hermesc
      - node_modules/react-native/ReactAndroid/publish.gradle
      - node_modules/react-native-svg/android/build.gradle
      - node_modules/react-native-screens/android/build.gradle
      - node_modules/expo-splash-screen/local-maven-repo
      - node_modules/expo-localization/local-maven-repo
    gradle:
      - yes

AutoUpdateMode: None
UpdateCheckMode: None