Categories:
  - Inventory

License: Apache-2.0

AuthorName: Aryan Yadav
SourceCode: https://github.com/aryany9/MyLexicon
IssueTracker: https://github.com/aryany9/MyLexicon/issues

AutoName: MyLexicon

RepoType: git
Repo: https://github.com/aryany9/MyLexicon.git

Builds:
  - versionName: 1.2.1
    versionCode: 4
    commit: v1.2.1
    output: build/app/outputs/flutter-apk/app-release.apk

    srclibs:
      - flutter@3.44.6

    prebuild:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - export SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get

    scandelete:
      - .pub-cache

    build:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - export SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)
      - $$flutter$$/bin/flutter build apk --release

AutoUpdateMode: Version
UpdateCheckMode: Tags ^v([\d.]+)$
CurrentVersion: 1.2.1
CurrentVersionCode: 4
