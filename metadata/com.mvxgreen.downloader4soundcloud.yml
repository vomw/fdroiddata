Summary: Soundcloud Downloader
Description:
SoundLoader: Soundcloud Downloader is THE app for saving Soundcloud tracks to your mobile device.

Batch downloads: Supports playlists and albums.

Share-to-Save: Tap “share” and find the SoundLoader icon to quick-start a download.

Tired of worrying about data limits, censorship, interruptions or unreliable internet connections when you just want to listen to music?

Worry no more!

Simply paste a Soundcloud link into SoundLoader, and viola!

Install to save your favorite music from Soundcloud. <3
