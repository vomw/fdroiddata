Description: |-
Open-Source, privacy-first alternative to standard search engines. Instead of querying a remote server every time you look for a website, this project allows you to use a curated, highly structure meta-database of valueable internet domains, communities, and personal web spaces directly on your local device.
It is designed for tech enthusiasts, privacy advocates, and anyone annoyed by the search engine malvertising, SEO spam, and content farms.

