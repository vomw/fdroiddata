Repo: https://codeberg.org/y20k/voxscribe.git

Builds:
  - versionName: 1.0.0
    versionCode: 1
    commit: v1.0.0
    subdir: app
    submodules: true
    gradle:
      - yes
    prebuild:
      - sed -i -e 's/isEnable = true/isEnable = false/' build.gradle.kts
      - sed -i '/versionName = /a\        ndk { abiFilters += listOf("arm64-v8a", "x86_64") }' build.gradle.kts
      - sed -i -e '/foojay/d' ../settings.gradle.kts
    scandelete:
      - external/whisper.cpp/examples
      - external/whisper.cpp/bindings
      - external/whisper.cpp/models

AutoUpdateMode: Version v%v
UpdateCheckMode: Tags
CurrentVersion: 1.0.0
CurrentVersionCode: 1
