AutoName: MejorPlaya
Description: |-
  MejorPlaya es la aplicación de MejorPlaya.es: te ayuda a elegir a qué playa de
  España ir según las condiciones del día (viento, oleaje, orientación de la costa
  y previsión del tiempo).

  La aplicación es una Trusted Web Activity (TWA) que abre el sitio web
  mejorplaya.es como aplicación nativa, sin barra de navegador. No requiere
  registro ni cuenta, no muestra publicidad y no incorpora rastreadores en el APK.

  Requiere conexión a internet para mostrar los datos actualizados.

