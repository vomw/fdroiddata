Categories:
  - Science & Education
License: MIT
WebSite: https://github.com/neweradev17/LocalMeteorology
SourceCode: https://github.com/neweradev17/LocalMeteorology
IssueTracker: https://github.com/neweradev17/LocalMeteorology/issues
Changelog: https://github.com/neweradev17/LocalMeteorology/releases

Autoname: LocalMeteorology

RepoType: git
Repo: https://github.com/neweradev17/LocalMeteorology.git

Builds:
  - versionName: 1.0.0
    versionCode: 1
    commit: bda5576519bbe9a52122963894f4083dc7bf3897
    subdir: android
    sudo:
      - echo "deb https://deb.debian.org/debian forky main" > /etc/apt/sources.list.d/forky.list
      - apt-get update
      - apt-get install -y -t forky npm openjdk-21-jdk-headless
    init: cd .. && bash fdroid-init.sh
    gradle:
      - yes
    output: app/build/outputs/apk/release/app-release-unsigned.apk
    scanignore:
      - node_modules/react-native-svg/android
      - node_modules/react-native-safe-area-context/android/build.gradle
      - node_modules/react-native-webview/android/build.gradle
      - node_modules/@react-native-async-storage/async-storage/android/build.gradle
      - node_modules/expo-modules-core/prebuilds
      - node_modules/expo-modules-core/android/ExpoModulesCorePlugin.gradle
      - node_modules/expo/template.tgz
      - node_modules/expo/node_modules/expo-file-system/prebuilds
      - node_modules/expo/node_modules/expo-font/prebuilds
      - node_modules/hermes-compiler
    scandelete:
      - node_modules

MaintainerNotes: |
  Expo bare workflow app (SDK 55).
  android/ folder is committed to the repo.
  Init script (fdroid-init.sh) in repo root handles Java 21 patching and
  Gradle wrapper pinning, avoiding YAML quoting issues with rewritemeta.

AutoUpdateMode: Version
UpdateCheckMode: Tags
CurrentVersion: 1.0.0
CurrentVersionCode: 1
