Summary: Privacy-first 7-day weather forecast app
Description: |
  A clean, fast, and privacy-respecting weather app built with Expo (React Native).

  Features:
  * 7-day weather forecast with detailed daily views
  * Interactive map using OpenStreetMap + Leaflet
  * Location search powered by Nominatim
  * No accounts, no tracking, no ads
  * Only language preference is stored locally
  * Supports English and Portuguese

  All data is fetched directly from open services (Open-Meteo and OpenStreetMap).

AutoName: LocalMeteorology

RepoType: git
Repo: https://github.com/neweradev17/LocalMeteorology.git

Builds:
  - versionName: "1.0.0"
    versionCode: 1
    commit: 1.0.0
    subdir: android
    sudo:
      - apt-get update
      - apt-get install -y nodejs npm
    init:
      - npm ci --include=dev
      - npx expo prebuild --platform android --no-install --clean
    gradle:
      - :app
    scanignore:
      - android/app/build.gradle   # sometimes helps with version mismatches

MaintainerNotes: |
  Expo React Native bare workflow app.
  Requires Node.js + npm ci + expo prebuild before Gradle.
  The android/ folder is committed to the repo.

