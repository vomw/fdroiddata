AutoName: Shopping List Calculator
Description: |-
  A simple, offline shopping-list calculator for planning a grocery run and
  tracking the total while shopping. It supports reusable ordered lists,
  quantities and weight-based items, sales tax, a budget, and completed-item
  tracking. It has no account, ads, analytics, or internet permission.

