      - cd android/SherpaOnnxAar
      - gradle :sherpa_onnx:assembleRelease
      - popd
      - mkdir -p libs
      - cp 
        $$sherpa_onnx$$/android/SherpaOnnxAar/sherpa_onnx/build/outputs/aar/sherpa_onnx-release.aar
        libs/sherpa-onnx-1.12.23.aar
