AutoName: Journal Android Multilingual
Summary: 中文优化的药物使用记录工具（PsychonautWiki Journal 分支）
Description: |
  Journal Android Multilingual 是为中文用户深度优化的 PsychonautWiki Journal 开源分支。

  主要特性：
  - 大量中文翻译（物质信息、界面、剂量参考等）
  - 基于 PsychonautWiki 的离线数据（剂量、交互、风险、耐受等）
  - 记录药物使用、分析模式、避免危险组合
  - 本地数据存储，注重隐私
  - 趣味版本命名与社区内容

  原始项目已转向闭源，本 fork 保持完全自由开源（GPLv3）。

  适合需要中文支持的朋友使用。

