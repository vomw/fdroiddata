Categories:
  - Sports & Health
License: GPL-3.0-only
AuthorName: Bruno Loff
SourceCode: https://github.com/bloff/meditation-timer
IssueTracker: https://github.com/bloff/meditation-timer/issues
Changelog: https://github.com/bloff/meditation-timer/releases

AutoName: Meditation Timer

RepoType: git
Repo: https://github.com/bloff/meditation-timer.git

Builds:
  - versionName: 1.0.1
    versionCode: 2
    commit: bb4782e78b7640d0881b588f566c6ceace59862d
    output: build/app/outputs/flutter-apk/app-release.apk
    srclibs:
      - flutter@stable
    rm:
      - ios
      - linux
      - macos
      - web
      - windows
    prebuild:
      - flutterVersion=$(sed -n -E "s/.*flutter-version:\ '(.*)'/\1/p" .github/workflows/release.yml)
      - '[[ $flutterVersion ]]'
      - git -C $$flutter$$ checkout -f $flutterVersion
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get
    scandelete:
      - .pub-cache
    build:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter build apk --release

AutoUpdateMode: Version
UpdateCheckMode: Tags ^v[0-9.]+$
UpdateCheckData: pubspec.yaml|version:\s.+\+(\d+)|.|version:\s(.+)\+
CurrentVersion: 1.0.1
CurrentVersionCode: 2
