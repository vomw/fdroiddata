# These items are the metadata for the app. Please fill as many as possible.
Categories: # Use those which apply in config/categories.yml
  - Schedule
  - Task
License: Apache-2.0
# AuthorName: (text)
# AuthorEmail: (web link)
# AuthorWebSite: (web link)
# WebSite: (web link)
SourceCode: https://github.com/jotheshjolly/Scheduled
IssueTracker: https://github.com/jotheshjolly/Scheduled/issues

# Changelog: (web link)
# Donate: (web link)
# Liberapay: (user name)
# Bitcoin: (bitcoin address)

RepoType: git
Repo: https://github.com/jotheshjolly/Scheduled
# Binaries: (Upstream binary link for reproducible build)

# At least one for new apps
Builds:
  - versionName: '1.0'
    versionCode: 1
    commit: v1.0
    subdir: app
    # submodules: true
    # output: some.apk
    # prebuild: sed -i -e
    # build: make
    gradle:
      - yes

# For a complete list of possible flags, see the docs

# MaintainerNotes: |-
#     Here go the notes to take into account for future updates, builds, etc.

# The following options are described at this location:
# https://f-droid.org/docs/Build_Metadata_Reference/#UpdateCheckMode
AutoUpdateMode: Version
UpdateCheckMode: Tags
CurrentVersion: '1.0'
CurrentVersionCode: 1