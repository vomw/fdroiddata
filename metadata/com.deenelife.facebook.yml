AutoName: PureFacebook

Summary: A distraction-free Facebook experience.

Description: |-
    PureFacebook automatically hides or blocks the Reels and short-video sections to prevent mindless scrolling.
    All images and videos are blurred by default to help maintain focus and guard the gaze.
    It includes session management with countdown alerts and periodic spiritual reminders from the Quran and Sunnah.

