Builds:
  - versionName: 0.9.2
    versionCode: 20
    commit: f908fd5b471730b02e22eadf6a68e3e2a7b9d54f
    subdir: app
    sudo:
      - apt-get update
      - apt-get install -y -t trixie-backports golang-go
    gradle:
      - yes
    srclibs:
      - go@go1.25.1
    build:
      - pushd $$go$$/src
      - ./make.bash
      - popd
      - export GOROOT=$$go$$
      - export PATH="$GOROOT/bin:$PATH"
      - export GOPATH="$HOME/go"
      - export GOTOOLCHAIN=local
      - export ANDROID_NDK_HOME=$$NDK$$
      - bash ../go/build.sh arm64-v8a armeabi-v7a x86_64
    ndk: r27c
    gradleprops:
      - skipGo

