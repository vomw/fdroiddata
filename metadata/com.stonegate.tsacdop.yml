Builds:
  - versionName: 0.5.9
    versionCode: 47
    commit: v0.5.9
    output: build/app/outputs/apk/fdroid/release/app-fdroid-release-unsigned.apk
    srclibs:
      - flutter@1.22.6
    rm:
      - ios
      - test
      - preview
      - tool
    prebuild:
      - touch lib/.env.dart
      - echo "final environment = {'apiKey':''};" >> lib/.env.dart
    build:
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter packages pub get
      - $$flutter$$/bin/flutter build apk --flavor=fdroid
    ndk: r21d

  - versionName: 0.6.0
    versionCode: 48
    commit: v0.6.0
    output: build/app/outputs/apk/fdroid/release/app-fdroid-release-unsigned.apk
    srclibs:
      - flutter@1.22.6
    rm:
      - ios
      - test
      - preview
      - tool
    prebuild:
      - touch lib/.env.dart
      - echo "final environment = {'apiKey':''};" >> lib/.env.dart
    build:
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter packages pub get
      - $$flutter$$/bin/flutter build apk --flavor=fdroid
    ndk: r21d

  - versionName: 1.0.1
    versionCode: 50
    commit: v1.0.1
    output: build/app/outputs/flutter-apk/app-fdroid-release.apk
    srclibs:
      - flutter@stable
    rm:
      - ios
      - test
      - preview
      - tool
    prebuild:
      - flutterVersion=$(sed -n -E 's/^[[:space:]]*flutter:[[:space:]]*">=([0-9.]+)".*/\1/p'
        pubspec.yaml)
      - '[[ $flutterVersion ]]'
      - git -C $$flutter$$ checkout -f $flutterVersion
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get --enforce-lockfile
    scandelete:
      - .pub-cache
    build:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter build apk --release --flavor fdroid
    ndk: r28c

AutoUpdateMode: Version
UpdateCheckMode: Tags ^v[\d.]+$
UpdateCheckData: pubspec.yaml|version:\s.+\+(\d+)|.|version:\s(.+)\+
CurrentVersion: 1.0.1
CurrentVersionCode: 50
