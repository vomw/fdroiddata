    sudo:
      - echo "deb https://deb.debian.org/debian bookworm main" > /etc/apt/sources.list.d/bookworm.list
      - apt-get update
      - apt-get install --no-install-recommends -y binutils build-essential bzip2
        cmake curl meson nasm ninja-build pkg-config unzip xz-utils
      - apt-get install --no-install-recommends -y -t bookworm openjdk-17-jdk-headless
      - update-java-alternatives -s java-1.17.0-openjdk-amd64
    gradle:
      - fdroid
    output: build/outputs/apk/fdroid/release/*-unsigned.apk
    srclibs:
      - dav1d@b546257f770768b2c88258c533da38b91a06f737
      - FFmpegGithub@38b88335f99e76ed89ff3c93f877fdefce736c13
      - libyuv@6afd9becdf58822b1da6770598d8597c583ccfad
    prebuild:
      - git tag -f 3.2.14-1094
      - echo "dashchanDav1dSourceDir=$$dav1d$$" >> gradle.properties
      - echo "dashchanFfmpegSourceDir=$$FFmpegGithub$$" >> gradle.properties
      - echo "dashchanLibyuvSourceDir=$$libyuv$$" >> gradle.properties
    ndk: r29
    gradleprops:
      - nativePlayerFfmpegFlavor=ffmpeg8
      - nativeAbis=arm64-v8a,armeabi-v7a,x86

