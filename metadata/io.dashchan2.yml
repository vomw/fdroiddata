Builds:
  - versionName: 3.2.32
    versionCode: 11121
    commit: 7b572d6424993efd9b4cfc93cc69ff4896d097f4
    sudo:
      - apt-get update
      - apt-get install --no-install-recommends -y binutils build-essential bzip2
        cmake meson nasm ninja-build pkg-config unzip xz-utils
    output: build/outputs/apk/fdroid/release/*-unsigned.apk
    binary: 
      https://github.com/andrewpozdnakov7-jpg/Dashchan_2/releases/download/3.2.32-fdroid-reference/Slooop-3.2.32-11121-fdroid-ffmpeg8-armeabi-v7a-signed.apk
    srclibs:
      - dav1d@b546257f770768b2c88258c533da38b91a06f737
      - FFmpeg@38b88335f99e76ed89ff3c93f877fdefce736c13
      - libyuv@6afd9becdf58822b1da6770598d8597c583ccfad
    prebuild:
      - sed -i "/^[[:space:]]*githubImplementation /d" build.gradle
      - printf '8.1.2\n' > $$FFmpeg$$/VERSION
    scandelete:
      - distribution/github
    build: JAVA_HOME=/usr/lib/jvm/java-21-openjdk-amd64 DASHCHAN_DAV1D_SOURCE_DIR=$$dav1d$$
      DASHCHAN_FFMPEG_SOURCE_DIR=$$FFmpeg$$ DASHCHAN_LIBYUV_SOURCE_DIR=$$libyuv$$
      gradle -PnativePlayerFfmpegFlavor=ffmpeg8 -PnativeAbis=armeabi-v7a -PpackageVersionCode=$$VERCODE$$
      assembleFdroidRelease
    ndk: r29

