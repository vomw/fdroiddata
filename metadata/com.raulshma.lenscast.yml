Builds:
  - versionName: 0.1.1
    versionCode: 1011
    commit: v0.1.1
    sudo:
      - echo "deb https://deb.debian.org/debian forky main" > /etc/apt/sources.list.d/forky.list
      - apt-get update
      - apt-get install -y -t forky npm
    gradle:
      - fdroid
    output: app/build/outputs/apk/fdroid/release/app-fdroid-release.apk
    gradleprops:
      - abiFilter=armeabi-v7a
      - versionCode=1011

