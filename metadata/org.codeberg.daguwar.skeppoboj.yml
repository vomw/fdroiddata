IssueTracker: https://codeberg.org/daguwar/skeppoboj/issues

AutoName: Skeppoboj

RepoType: git
Repo: https://codeberg.org/daguwar/skeppoboj.git

Builds:
  - versionName: 1.0.0
    versionCode: 11
    commit: 82ff90fd8f155d203e28c24134d74291da091b55
    sudo:
      - mkdir -p /upstream/path
      - chown -R vagrant /upstream/path
    output: build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
    binary: 
      https://codeberg.org/daguwar/skeppoboj/releases/download/%v/app-armeabi-v7a-release.apk
    srclibs:
      - flutter@stable
    rm:
      - ios
      - linux
      - macos
      - web
      - windows
    prebuild:
      - flutterVersion=$(cat .flutter-version)
      - '[[ $flutterVersion ]]'
      - git -C $$flutter$$ checkout -f $flutterVersion
      - export repo=/upstream/path/skeppoboj
      - cd ..
      - mv org.codeberg.daguwar.skeppoboj $repo
      - pushd $repo
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get --enforce-lockfile
      - pushd .pub-cache/hosted/pub.dev/geolocator_android-*/android
      - sed -i -e '/gms/d' build.gradle
      - cd src/main/java/com/baseflow/geolocator/location
      - rm FusedLocationClient.java
      - sed -i -e '/if (forceAndroidLocationManager) {/,/^  }/c return new LocationManagerClient(context,
        locationOptions);}' -e '/isGooglePlayServicesAvailable/,/^  }/d' -e '/gms/d'
        GeolocationManager.java
      - popd
      - sed -i -e 's/max-page-size=16384/max-page-size=16384,--build-id=none/' .pub-cache/hosted/pub.dev/jni-*/src/CMakeLists.txt
      - popd
      - mv $repo org.codeberg.daguwar.skeppoboj
    scanignore:
      - .pub-cache
    build:
      - export repo=/upstream/path/skeppoboj
      - cd ..
      - mv org.codeberg.daguwar.skeppoboj $repo
      - pushd $repo
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter build apk --release --split-per-abi --target-platform="android-arm"
      - popd
      - mv $repo org.codeberg.daguwar.skeppoboj

