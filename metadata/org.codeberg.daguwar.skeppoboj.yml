    sudo:
      - mkdir -p /upstream/path
      - chown -R vagrant /upstream/path
    output: build/app/outputs/flutter-apk/app-release.apk
    srclibs:
      - flutter@stable
    rm:
      - ios
      - linux
      - macos
      - web
      - windows
    prebuild:
      - git -C $$flutter$$ checkout -f 3.47.2
      - export repo=/upstream/path/skeppoboj
      - cd ..
      - mv org.codeberg.daguwar.skeppoboj $repo
      - pushd $repo
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get --enforce-lockfile
      - popd
      - mv $repo org.codeberg.daguwar.skeppoboj
    scanignore:
      - .pub-cache
    build:
      - export repo=/upstream/path/skeppoboj
      - cd ..
      - mv org.codeberg.daguwar.skeppoboj $repo
      - pushd $repo
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter build apk --release --split-per-abi --target-platform="android-arm64"
      - popd
      - mv $repo org.codeberg.daguwar.skeppoboj

