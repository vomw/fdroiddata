AutoName: Chess Game Review

RepoType: git
Repo: https://github.com/abibire/ChessAnalysisMultiplatform.git

Builds:
  - versionName: '1.0'
    versionCode: 1
    commit: b0cf1de949707a070747b175300a1641067441ca
    subdir: composeApp
    submodules: true
    sudo:
      - echo "deb https://deb.debian.org/debian trixie main" > /etc/apt/sources.list.d/trixie.list
      - apt-get update
      - apt-get install -y -t trixie openjdk-21-jdk-headless
      - update-alternatives --auto java
    gradle:
      - yes
    rm:
      - iosApp
    prebuild: sed -i -e '/foojay/d' -e '/maven.pkg.jetbrains.space/d' ../settings.gradle.kts
    scandelete:
      - composeApp/src/jvmMain/resources/stockfish
    build:
      - mkdir -p ../composeApp/src/androidMain/jniLibs/arm64-v8a
      - cd ../Stockfish/src
      - curl -L -o nn-2962dca31855.nnue https://tests.stockfishchess.org/api/nn/nn-2962dca31855.nnue
      - curl -L -o nn-37f18f62d772.nnue https://tests.stockfishchess.org/api/nn/nn-37f18f62d772.nnue
      - export CXX=$$NDK$$/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android21-clang++
      - export CXXFLAGS="-std=c++17 -fno-exceptions -fno-rtti -DUSE_PTHREADS -DNDEBUG
        -O3 -DIS_64BIT -DUSE_POPCNT -DUSE_NEON=8 -fPIC"
      - $CXX $CXXFLAGS -c benchmark.cpp bitboard.cpp engine.cpp evaluate.cpp main.cpp
        memory.cpp misc.cpp movegen.cpp movepick.cpp position.cpp score.cpp search.cpp
        thread.cpp timeman.cpp tt.cpp tune.cpp uci.cpp ucioption.cpp
      - $CXX $CXXFLAGS -c nnue/nnue_misc.cpp nnue/nnue_accumulator.cpp nnue/network.cpp
        nnue/features/half_ka_v2_hm.cpp nnue/features/full_threats.cpp syzygy/tbprobe.cpp
      - $CXX -shared -o libstockfish.so *.o -Wl,--gc-sections,-z,max-page-size=16384
        -static-libstdc++
      - mv libstockfish.so ../../composeApp/src/androidMain/jniLibs/arm64-v8a/
    ndk: 27.0.12077973

AutoUpdateMode: Version
UpdateCheckMode: Tags
