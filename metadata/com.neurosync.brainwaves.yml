AuthorName: mk kry
AuthorEmail: mk1104@gmail.com
AuthorWebSite: https://bookiq.com.tr
Name: NeuroSync 40Hz Brain Waves
Summary: 40Hz gamma-frequency audio therapy for focus, sleep and relaxation
Description: |-
  NeuroSync delivers 40Hz gamma-frequency audio sessions based on the MIT
  GENUS protocol, designed to support focus, sleep, meditation and energy.

  Features 5 calibrated presets and a sound mixer for carrier tone, binaural
  beats, rain and ocean sounds. Built-in session timer with reminders.

  No ads, no registration, no personal data collected. Works fully offline.

RepoType: git
Repo: https://github.com/mk1104-svg/neurosync-40hz-brain-waves

Builds:
  - versionName: '1.0.0'
    versionCode: 1
    commit: main
    subdir: android/app
    sudo:
      - apt-get update
      - apt-get install -y nodejs npm
    init:
      - npm install
      - npx vite build
      - npx cap sync android
    gradle:
      - yes

AutoUpdateMode: None
UpdateCheckMode: None
CurrentVersion: '1.0.0'
