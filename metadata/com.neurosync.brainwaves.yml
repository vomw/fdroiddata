Name: NeuroSync 40Hz Brain Waves
Summary: Gamma-frequency audio sessions for focus, sleep and relaxation
Description: |-
  NeuroSync generates precise 40 Hz gamma-frequency audio, based on the GENUS
  protocol (Gamma ENtrainment Using Sensory stimuli) described by researchers
  at MIT in 2016.

  Features:

  * Five presets: Focus, Pre-Sleep, Meditation, Energy and Classic 40 Hz
  * Sound mixer to blend carrier tone, binaural beats, rain and ocean
  * Session timer with optional reminder notifications
  * Optional 40 Hz visual flicker, disabled by default
  * Playback continues with the screen off
  * English and Turkish interface

  The app collects no personal data. There are no analytics libraries, no
  advertising SDKs and no account. All preferences are stored locally on the
  device and work fully offline.

  This is a wellness and focus tool, not a medical device. It does not
  diagnose, treat, cure or prevent any condition. People with photosensitive
  epilepsy should not use the visual flicker feature.

