# Draft RFC only - do not merge as-is.
# Purpose: ask whether F-Droid would accept Ventoid's future x86_64 Secure Boot
# chain when the only non-source-built inputs are the narrowly scoped Rocky Linux
# 9.8 signed BOOTX64.EFI and mmx64.efi files required to preserve firmware-trusted
# Microsoft/Rocky signatures. All remaining Ventoy components would stay source-built.
# See MR description for provenance, verification, and fallback/local-import factors.
