Categories:
  - Sports & Health
License: AGPL-3.0-only
AuthorName: Raúl Morales
AuthorWebSite: https://portfolio.raulmorales.eu

SourceCode: https://github.com/raulmoralesruiz/kefir-control
IssueTracker: https://github.com/raulmoralesruiz/kefir-control/issues

RepoType: git
Repo: https://github.com/raulmoralesruiz/kefir-control.git

AutoName: Kefir Control
Donate: https://paypal.me/raulmoralesruiz

Builds:
  - versionName: 1.0.0
    versionCode: 1
    commit: 9d416d890a8df60edfd35b85b497255415e210e9
    submodules: true
    output: build/app/outputs/flutter-apk/app-release.apk
    srclibs:
      - flutter@stable
    rm:
      - ios
      - linux
      - macos
      - web
      - windows

    prebuild:
      - flutterVersion=$(sed -n -E "s/.*flutter-version:\ '(.*)'/\1/p" .github/workflows/release.yml)
      - '[[ $flutterVersion ]]'
      - git -C $$flutter$$ checkout -f $flutterVersion
      - export PUB_CACHE=$(pwd)/.pub-cache
      - .flutter/bin/flutter config --no-analytics
      - .flutter/bin/flutter pub get
    scanignore:
      - .flutter/bin/cache
    scandelete:
      - .flutter
      - .pub-cache

    build:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - .flutter/bin/flutter build apk --release --split-per-abi --target-platform="android-arm64"

AutoUpdateMode: Version
UpdateCheckMode: Tags
CurrentVersion: '1.0.0'
CurrentVersionCode: 1
