AutoName: Ygg Proxy
Description: |-
  Runs an embedded Yggdrasil node and serves SOCKS5 and HTTP (CONNECT)
  proxies on the device (or on the LAN) instead of a VPN tunnel.
  No TUN interface / VPN slot / root needed.

  • SOCKS5 + HTTP CONNECT proxy on 127.0.0.1 or all interfaces
    (gateway mode for other devices, including old iOS 7/9/12 devices)
  • &lt;publickey&gt;.pk.ygg name resolution, optional in-mesh DNS server
  • Optional proxy authentication (recommended on public networks)
  • Port forwarding both ways (yggstack-style local/remote mappings)
  • LAN multicast peer discovery + manual peer lists
  • Foreground service with a persistent node identity

  Yggdrasil core v0.5.14 (LGPLv3 with linking exception);
  netstack/SOCKS built on yggstack primitives (same license) with gVisor.
  Licensed AGPL-3.0-only.

