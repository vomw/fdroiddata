Builds:
  - versionName: 0.5.14
    versionCode: 514
    commit: v0.5.14
    subdir: android
    gradle:
      - yes
    output: app/build/outputs/apk/release/app-release-unsigned.apk
    build:
      - export GOPATH="$PWD/.go-work"
      - export GOMODCACHE="$GOPATH/pkg/mod"
      - export GOPROXY="https://proxy.golang.org,direct"
      - mkdir -p "$GOPATH/pkg/gomobile" "$GOMODCACHE"
      - wget -O go.tgz https://go.dev/dl/go1.26.7.linux-amd64.tar.gz
      - echo 'ffb5f8de10c62550dfddab66b36b57030721e0a44a3218e9e1181d7b59f121ca  go.tgz'
        | shasum -c -
      - tar xf go.tgz
      - export PATH="$PWD/go/bin:$GOPATH/bin:$PATH"
      - export ANDROID_NDK_HOME="$ANDROID_NDK"
      - cd ../yggproxy
      - go install golang.org/x/mobile/cmd/gomobile@v0.0.0-20260908204917-8b95e45f8d3e
      - go install golang.org/x/mobile/cmd/gobind@v0.0.0-20260908204917-8b95e45f8d3e
      - gomobile bind -v -target android -androidapi 21 -tags mobile -o ../android/app/libs/yggproxy.aar
        -ldflags "-s -w -checklinkname=0" ./mobileproxy
    ndk: r26b

MaintainerNotes: |
  Gradle release signing is intentionally conditional: without
  android/keystore.properties and without a debug keystore, the release
  build naturally stays unsigned (see android/app/build.gradle.kts), so the
  expected output path above holds on the buildserver.

  The build block compiles the native gomobile AAR (yggproxy/mobileproxy)
  BEFORE the gradle build, following the same custom-build pattern as other
  native-code apps on F-Droid (wget toolchain + sha256 check + pinned go
  deps).

  Toolchain pins (mirrors flake.nix):
    - Go 1.26.7 (wget tarball, sha256 verified)
    - NDK r26b via the metadata ndk: field -> $ANDROID_NDK
    - gomobile/gobind @ x/mobile pseudo-version pinned in yggproxy/go.mod
  Modest memory is needed for gomobile across 4 ABIs (~2-4 GB RAM).

  Local hermetic tests for the proxy core exist but are not part of the
  F-Droid build: yggproxy/mobileproxy/proxy_test.go (A<->B mesh loop, no
  network) plus android instrumented tests.

