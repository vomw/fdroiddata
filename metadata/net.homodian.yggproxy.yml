Builds:
  - versionName: 0.5.14.1
    versionCode: 51410
    commit: b52d185a5188334fdcd4969f0559914c46d0ef91
    subdir: android
    gradle:
      - yes
    output: app/build/outputs/apk/release/app-armabi-v7a-release-unsigned.apk
    build:
      - export GOPATH="$PWD/.go-work"
      - export GOMODCACHE="$GOPATH/pkg/mod"
      - export GOPROXY="https://proxy.golang.org,direct"
      - mkdir -p "$GOPATH/pkg/gomobile" "$GOMODCACHE"
      - curl -sfL -o go.tgz https://go.dev/dl/go1.26.7.linux-amd64.tar.gz
      - echo 'ffb5f8de10c62550dfddab66b36b57030721e0a44a3218e9e1181d7b59f121ca  go.tgz'
        | sha256sum -c -
      - tar xf go.tgz
      - export PATH="$PWD/go/bin:$GOPATH/bin:$PATH"
      - export ANDROID_NDK_HOME="$ANDROID_NDK"
      - sdkmanager "platforms;android-21"
      - mkdir -p ../android/app/libs
      - cd ../yggproxy
      - go install golang.org/x/mobile/cmd/gomobile@v0.0.0-20260908204917-8b95e45f8d3e
      - go install golang.org/x/mobile/cmd/gobind@v0.0.0-20260908204917-8b95e45f8d3e
      - gomobile bind -v -target android -androidapi 21 -tags mobile -o ../android/app/libs/yggproxy.aar
        -ldflags "-s -w -checklinkname=0" ./mobileproxy
    ndk: r26b

