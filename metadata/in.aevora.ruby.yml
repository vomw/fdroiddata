Summary: 3D terrain and scene editor for Swordigo with real-time OpenGL ES rendering
Description: |-
  Ruby Touch is a standalone mobile 3D scene studio and terrain editor designed for Swordigo. Engineered natively in C++20 and Qt 6 with OpenGL ES 3.0 hardware acceleration, Ruby Touch delivers desktop-grade level editing and biome inspection directly on Android tablets and smartphones.

  Features:
  * Touch Viewport Navigation: Fluidly navigate 3D scenes using dual floating thumbsticks with hardware-locked refresh rates up to 120Hz.
  * Ground Mesh Studio: Select, inspect, and edit terrain meshes directly inside the 3D viewport with diamond vertex selection handles, real-time ray-plane touch projection, vertex manipulation, and structural mesh updates.
  * Biome Texture Inspector: Inspect and modify terrain surface (cap/grass) and cliff textures with authentic presets (Plains, Forest, Grove, Florennum, Wasteland, Snowy Peaks, Ice Castle, Volcano, Caves, Crypt) or custom modder presets.
  * Scene and Entity Inspection: Inspect spatial components, node hierarchies, dimension bounds, and object properties across binary scene structures.
  * FileRift Bytecode and Scripting: Integrated FileRift schema analyzer and syntax highlighter backed by an embedded Lua engine.
  * Technical Architecture: Runs completely offline with zero network trackers, zero telemetry, and zero advertisements.

