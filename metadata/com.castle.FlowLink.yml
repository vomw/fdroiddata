AutoName: FlowLink
Summary: Ultra-fast peer-to-peer file transfer, clipboard sync, and PC remote control.
Description: |-
  FlowLink seamlessly connects your Android phone and Windows PC over a local Wi-Fi or encrypted Tailscale mesh network.

  Features:
  * Wire-speed file transfer with adaptive buffer (64KB to 4MB chunks).
  * Instant real-time clipboard sync with smart debounce.
  * Remote PC controls: lock workstation, close applications, shutdown, or restart.
  * 100% Free and Open Source, zero ads, zero tracking.

