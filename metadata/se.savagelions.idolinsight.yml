Name: Idol Insight
Summary: Source-transparent, offline overview of Idol 2026
Description: |-
  Idol Insight is an independent, fully offline Swedish overview of public
  information about Idol 2026. It presents source-backed broadcasts,
  participants and performances, labels data gaps and anecdotal material, and
  includes a clearly marked fictional scenario lab.

  The app requires no account or permissions and contains no ads, analytics,
  trackers, network access, proprietary services, or dynamic code loading.

  Idol Insight is not affiliated with or endorsed by TV4, Idol, or the format
  rights holders. Third-party names and trademarks are used only to identify
  the factual subject of the app.

