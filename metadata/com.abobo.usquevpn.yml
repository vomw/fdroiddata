AuthorName: Abobo
SourceCode: https://github.com/Abobo7/usque-android
IssueTracker: https://github.com/Abobo7/usque-android/issues

AutoName: Usque VPN

RepoType: git
Repo: https://github.com/Abobo7/usque-android

Builds:
  - versionName: 1.0.3
    versionCode: 3
    commit: b990c29e745e9d7272958ffb27c865fb73c2d573
    subdir: android/usque-vpn
    sudo:
      - apt-get update
      - apt-get install -y make
      - mkdir -p /home/runner
      - chown vagrant /home/runner
    gradle:
      - yes
    prebuild:
      - GO_VERSION=1.24.0
      - export GO_TAR=go$GO_VERSION.linux-amd64.tar.gz
      - export GO_URL=https://golang.org/dl/$GO_TAR
      - export GOROOT=/home/runner/work/go
      - mkdir -p $GOROOT
      - pushd $GOROOT
      - wget $GO_URL
      - tar -C $GOROOT --strip-components=1 -xzf $GO_TAR
      - rm $GO_TAR
    build:
      - pushd ../
      - make init
      - make android
      - popd
      - mkdir -p app/libs
      - cp ../usque.aar app/libs/

AutoUpdateMode: Version
UpdateCheckMode: Tags
CurrentVersion: 1.0.3
CurrentVersionCode: 3
