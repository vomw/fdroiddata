AutoName: OpenSetList
Description: |-
  Setlists, cifras e transposição de tom para músicos, tudo offline.

  Organize seu repertório com um editor completo de cifras no formato
  ChordPro, monte setlists para gigs (data, local, horário e duração total)
  e pratique com rolagem automática, ocultar acordes e transposição de tom
  com um toque.

  O app é 100% offline, sem contas, sem anúncios e sem coleta de dados.
  Seus dados ficam no seu aparelho.

  Funcionalidades:
  * Editor ChordPro: letra, acordes, tom, BPM, capo, compasso, duração e link
    para o vídeo no YouTube
  * Transposição de tom com um toque
  * Rolagem automática com controle de velocidade
  * Suporte a pedal Bluetooth (próxima/anterior/play-pause)
  * Setlists com reordenação por arrastar
  * Compartilhar/exportar setlists nos formatos OpenSetList (.osl) e
    JustChords (.chopro)
  * Artistas e tags para organizar o repertório
  * Backup completo (.db), exportação/importação em lote (JSON) e nuvem via
    seletor do sistema
  * Importação do SetList Helper (.db) e do JustChords (.chopro e .jcarchive)
  * Modo escuro

  Disponível em Android, iOS e desktop (Windows/macOS/Linux). Código aberto
  sob licença MIT.

