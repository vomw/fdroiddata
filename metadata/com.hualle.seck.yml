License: MIT
AuthorName: Seeeeeck
SourceCode: https://github.com/Seeeeeck/hualle
IssueTracker: https://github.com/Seeeeeck/hualle/issues
Changelog: https://github.com/Seeeeeck/hualle/releases

AutoName: Hualle
RepoType: git
Repo: https://github.com/Seeeeeck/hualle.git

Builds:
  - versionName: '1.0.9'
    versionCode: 20
    commit: v1.0.9
    subdir: android
    sudo:
      - apt-get update
      - apt-get install -y nodejs npm
    init:
      - npm install
    gradle:
      - yes
    scandelete:
      - node_modules
    scanignore:
      # Precompiled native binaries shipped inside official Expo module
      # packages (published from Expo's own FOSS source at npm-publish time).
      # Flagged by the source scanner as prebuilt binaries; whitelisted here
      # so the build isn't blocked. Review/adjust if the F-Droid team objects.
      - node_modules/expo-sqlite/android/vec
      - node_modules/expo-sqlite/android/libsql
      - node_modules/expo-system-ui/local-maven-repo
      - node_modules/expo-asset/local-maven-repo
      - node_modules/expo-localization/local-maven-repo
      - node_modules/expo-file-system/local-maven-repo
      - node_modules/expo-font/local-maven-repo
      - node_modules/expo-web-browser/local-maven-repo
      - node_modules/expo-linking/local-maven-repo
      - node_modules/expo-sqlite/local-maven-repo
      - node_modules/expo-haptics/local-maven-repo
      - node_modules/expo-splash-screen/local-maven-repo
      - node_modules/expo-image/local-maven-repo
      - node_modules/expo-notifications/local-maven-repo
      - node_modules/expo-application/local-maven-repo
      - node_modules/expo-keep-awake/local-maven-repo

AutoUpdateMode: Version %v
UpdateCheckMode: Tags
CurrentVersion: '1.0.9'
