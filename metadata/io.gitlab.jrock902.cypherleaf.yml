Categories:
  - Writing
License: MIT
AuthorName: Zak Faulkner
SourceCode: https://gitlab.com/Jrock-902/smart_notes
IssueTracker: https://gitlab.com/Jrock-902/smart_notes/-/issues

AutoName: CypherLeaf

RepoType: git
Repo: https://gitlab.com/Jrock-902/smart_notes.git

Builds:
  - versionName: 1.0.0
    versionCode: 2
    commit: 1.0.0
    output: build/app/outputs/flutter-apk/app-release.apk
    srclibs:
      - flutter@stable
    rm:
      - ios
      - linux
      - macos
      - web
      - windows
    prebuild:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - git -C $$flutter$$ checkout -f 3.44.3
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get --enforce-lockfile
    scandelete:
      - .pub-cache
    build:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter build apk

AutoUpdateMode: Version
UpdateCheckMode: Tags ^[0-9.]+$
UpdateCheckData: pubspec.yaml|version:\s.+\+(\d+)|.|version:\s(.+)\+
CurrentVersion: 1.0.0
CurrentVersionCode: 2
