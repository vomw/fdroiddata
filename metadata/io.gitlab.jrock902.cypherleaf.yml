Categories:
  - Writing
License: MIT
AuthorName: Zak Faulkner
SourceCode: https://gitlab.com/Jrock-902/smart_notes
IssueTracker: https://gitlab.com/Jrock-902/smart_notes/-/issues

AutoName: CypherLeaf

RepoType: git
Repo: https://gitlab.com/Jrock-902/smart_notes.git

Builds:
  - versionName: 1.0.0
    versionCode: 21
    commit: da47aaed37f27901057a44e649f544ac2a62b410
    output: build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
    srclibs:
      - flutter@stable
    rm:
      - ios
      - linux
      - macos
      - web
      - windows
    prebuild:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - git -C $$flutter$$ checkout -f 3.44.3
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get --enforce-lockfile
    scandelete:
      - .pub-cache
    build:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter build apk --split-per-abi --target-platform android-arm

  - versionName: 1.0.0
    versionCode: 22
    commit: da47aaed37f27901057a44e649f544ac2a62b410
    output: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
    srclibs:
      - flutter@stable
    rm:
      - ios
      - linux
      - macos
      - web
      - windows
    prebuild:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - git -C $$flutter$$ checkout -f 3.44.3
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get --enforce-lockfile
    scandelete:
      - .pub-cache
    build:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter build apk --split-per-abi --target-platform android-arm64

  - versionName: 1.0.0
    versionCode: 23
    commit: da47aaed37f27901057a44e649f544ac2a62b410
    output: build/app/outputs/flutter-apk/app-x86_64-release.apk
    srclibs:
      - flutter@stable
    rm:
      - ios
      - linux
      - macos
      - web
      - windows
    prebuild:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - git -C $$flutter$$ checkout -f 3.44.3
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get --enforce-lockfile
    scandelete:
      - .pub-cache
    build:
      - export PUB_CACHE=$(pwd)/.pub-cache
