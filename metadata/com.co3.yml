Builds:
  - versionName: B0.0.4
    versionCode: 4
    commit: 2ee2198d1550fb018069421f5de3bc7ac630f059
    subdir: android
    sudo:
      - apt-get update
      - apt-get install -y nodejs npm
    init:
      - npm install
    gradle:
      - yes
    output: app/build/outputs/apk/release/app-release-unsigned.apk
    prebuild:
      - sed -i '/jvmToolchain\|JavaVersion/s/17/21/' node_modules/@react-native/gradle-plugin/*/build.gradle.kts node_modules/@react-native/gradle-plugin/react-native-gradle-plugin/src/main/kotlin/com/facebook/react/utils/JdkConfiguratorUtils.kt
      - echo "notifeeDir=../node_modules/@notifee/react-native" >> gradle.properties
      - echo "reactNativeRootDir=../node_modules/react-native" >> gradle.properties
      - echo "reactNativePath=../node_modules/react-native" >> gradle.properties
      - echo "mavenRepo.url=https://repo.maven.apache.org/maven2" >> gradle.properties
      - npx react-native bundle --platform android --dev false --entry-file index.js
        --bundle-output android/app/src/main/assets/index.android.bundle --assets-dest
        android/app/src/main/res/
    scandelete:
      - node_modules

