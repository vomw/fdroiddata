AutoName: GlioGuide
Description: |
GlioGuide is an app designed for patients with glioblastoma.
It provides an overview of treatments, answers common questions,
calculates chemotherapy schedules, and offers practical advice.
It is completely free, anonymous, and does not collect any user data.

