Builds:
  - versionName: 0.9.9
    versionCode: 201
    commit: 26567131d159f88148b4e39e984ab3fcee935a1d
    sudo:
      - mkdir -p /home/runner/work/Pocket2FA/ /home/runner/.pub-cache
      - chown vagrant /home/runner/work/Pocket2FA/ /home/runner/.pub-cache
    output: build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
    binary: 
      https://github.com/gmag11/Pocket2FA/releases/download/%v/app-armeabi-v7a-release.apk
    srclibs:
      - flutter@3.35.1
    prebuild:
      - pushd $$flutter$$
      - git checkout -f 3.35.1
      - popd
      - export repo=/home/runner/work/Pocket2FA
      - export PUB_CACHE=/home/runner/.pub-cache
      - cd ..
      - mv net.gmartin.pocket2fa $repo/Pocket2FA
      - pushd $repo/Pocket2FA
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get
      - echo 'target_compile_options(flutter_zxing PRIVATE -ffile-prefix-map=${CMAKE_SOURCE_DIR}=.)'
        >> $PUB_CACHE/hosted/pub.dev/flutter_zxing-1.9.1/src/CMakeLists.txt
      - popd
      - mv $repo/Pocket2FA net.gmartin.pocket2fa
    build:
      - export repo=/home/runner/work/Pocket2FA
      - export PUB_CACHE=/home/runner/.pub-cache
      - cd ..
      - mv net.gmartin.pocket2fa $repo/Pocket2FA
      - pushd $repo/Pocket2FA
      - $$flutter$$/bin/flutter build apk --release --split-per-abi --target-platform=android-arm
      - popd
      - mv $repo/Pocket2FA net.gmartin.pocket2fa
    ndk: 27.0.12077973

