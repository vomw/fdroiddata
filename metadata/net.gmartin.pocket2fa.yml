  - versionName: 0.9.8
    versionCode: 191
    commit: 0c8b9cd72b9beb3f842e084ead6bd19b87041347
    binary: https://github.com/gmag11/Pocket2FA/releases/download/%v/app-armeabi-v7a-release.apk
    output: build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
    srclibs:
      - flutter@stable
    prebuild:
      - export flutterVersion=$(sed -n -E 's/^\s+flutter:\s+"?([0-9]+\.[0-9]+\.[0-9]+).*/\1/p'
        pubspec.yaml)
      - '[[ $flutterVersion ]]'
      - git -C $$flutter$$ checkout -f $flutterVersion
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get
    scandelete:
      - .pub-cache
    build:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter build apk --release --split-per-abi --target-platform=android-arm
