Categories:
  - Sports & Health
License: Apache-2.0
AuthorName: Private By Design
SourceCode: https://gitlab.com/martynbutty/healthTracker
IssueTracker: https://gitlab.com/martynbutty/healthTracker/-/issues

AutoName: Albi

RepoType: git
Repo: https://gitlab.com/martynbutty/healthTracker.git

Builds:
  - versionName: 1.3.0
    versionCode: 1
    commit: f2031f71cf6c9ca04bbc9a22e7f084453724d8de
    output: build/app/outputs/flutter-apk/app-release.apk
    srclibs:
      - flutter@stable
    rm:
      - ios
      - linux
      - macos
      - web
      - windows
    prebuild:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - export flutterVersion=$(cat .flutter-version)
      - git -C $$flutter$$ checkout -f $flutterVersion
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get
    scandelete:
      - .pub-cache
    build:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter build apk

AutoUpdateMode: Version
UpdateCheckMode: Tags
UpdateCheckData: pubspec.yaml|version:\s.+\+(\d+)|.|version:\s(.+)\+
CurrentVersion: 1.3.0
CurrentVersionCode: 1
