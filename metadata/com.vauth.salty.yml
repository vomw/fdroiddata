Categories:
  - Security
License: MIT
AuthorName: vauth
SourceCode: https://github.com/vauth/salty-app
IssueTracker: https://github.com/vauth/salty-app/issues

RepoType: git
Repo: https://github.com/vauth/salty-app

Builds:
  - versionName: '1.1'
    versionCode: 2
    commit: 7f8d0105a8509ac071c5a6310293f602b63b9396
    subdir: app
    sudo:
      - echo "deb https://deb.debian.org/debian bookworm main" | tee /etc/apt/sources.list.d/bookworm.list
      - apt-get update
      - apt-get install -y -t bookworm openjdk-17-jdk-headless
      - update-java-alternatives -s java-1.17.0-openjdk-amd64
    gradle:
      - yes
    prebuild:
      - echo "APP_SALT=Salty@AES-256" >> ../gradle.properties
      - mkdir -p ../gradle/wrapper
      - echo "distributionUrl=https\://services.gradle.org/distributions/gradle-8.4-bin.zip"
        > ../gradle/wrapper/gradle-wrapper.properties

AutoUpdateMode: Version
UpdateCheckMode: Tags
CurrentVersion: '1.1'
CurrentVersionCode: 2
