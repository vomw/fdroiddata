AntiFeatures:
  NonFreeNet:
    en-US: The optional integration manager defaults to the proprietary scalar.vector.im
      service.
Categories:
  - Messaging
License: AGPL-3.0-only
AuthorName: Voyage Client
SourceCode: https://github.com/VoyageClient/Voyage
IssueTracker: https://github.com/VoyageClient/Voyage/issues
Changelog: https://github.com/VoyageClient/Voyage/releases
Donate: https://github.com/VoyageClient/Voyage#donations

AutoName: Voyage

RepoType: git
Repo: https://github.com/VoyageClient/Voyage.git

Builds:
  - versionName: '20261003'
    versionCode: 402610030
    commit: 2e44dbf54716aa846f914dad77ee6afc3fc70952
    timeout: 10800
    subdir: vector-app
    submodules: true
    sudo:
      - echo "deb https://deb.debian.org/debian bookworm main" > /etc/apt/sources.list.d/bookworm.list
      - apt-get update
      - apt-get install -y -t bookworm openjdk-17-jdk-headless
    gradle:
      - yes
    output: build/outputs/apk/release/voyage-universal-release-unsigned.apk
    scanignore:
      - gradle/jvm-publish.gradle
    ndk: 23.2.8568313
    gradleprops:
      - org.gradle.caching=false

MaintainerNotes: gradle/jvm-publish.gradle only configures publishing JVM SDK modules
  and is unused by the APK build, so the scanner ignores it.

AutoUpdateMode: Version
UpdateCheckMode: Tags ^[0-9]{8}$
VercodeOperation:
  - '%c*10+200000000'
UpdateCheckData: '|([0-9]+)||([0-9]{8})'
CurrentVersion: '20261003'
CurrentVersionCode: 402610030
