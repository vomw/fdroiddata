    srclibs:
      - flutter@3.41.6
    rm:
      - flutter/ios
      - flutter/windows
    prebuild:
      - export PUB_CACHE=$$flutter$$/pub-cache
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get --enforce-lockfile
      - rustup default 1.94.1
      - rustup target add aarch64-linux-android armv7-linux-androideabi i686-linux-android
        x86_64-linux-android
      - cargo install cargo-ndk@4.1.2 --locked
    build:
      - export PUB_CACHE=$$flutter$$/pub-cache
      - $$flutter$$/bin/flutter build apk --release --split-per-abi --target-platform="arm64-v8a"
      - $$flutter$$/bin/flutter build apk --release --split-per-abi --target-platform="armeabi-v7a"
      - $$flutter$$/bin/flutter build apk --release --split-per-abi --target-platform="x86_64"
    ndk: r28c

