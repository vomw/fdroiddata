Builds:
  - versionName: 1.0.13
    versionCode: 111
    commit: 884f2fd2448e3dd79fa17a3b04c2d3bf97a417bd
    output: build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
    binary:
      https://github.com/LEXYGO/QRJukebox/releases/download/v%v/QR_Jukebox_v%v_armv7.apk
    srclibs:
      - flutter@stable
    prebuild:
      - flutterVersion=$(sed -n -E "s/^\s+flutter:\s*([0-9.]+)/\1/p" pubspec.yaml)
      - '[[ $flutterVersion ]]'
      - git -C $$flutter$$ checkout -f $flutterVersion
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get --enforce-lockfile
    scandelete:
      - .pub-cache
    build:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter build apk --release --no-tree-shake-icons --split-per-abi

