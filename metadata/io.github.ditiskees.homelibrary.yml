Builds:
  - versionName: 1.0.3
    versionCode: 4
    commit: 5c8199fe9ff12c003a4a04a57f2d3ba9014a7e4f
    ndk: r27b
    sudo:
      - apt-get update
      - apt-get install -y curl xz-utils
      - curl -fsSL https://nodejs.org/dist/v22.13.1/node-v22.13.1-linux-x64.tar.xz -o /tmp/node-v22.13.1-linux-x64.tar.xz
      - echo '0d2a5af33c7deab5555c8309cd3f373446fe1526c1b95833935ab3f019733b3b  /tmp/node-v22.13.1-linux-x64.tar.xz' | sha256sum -c -
      - tar -xJf /tmp/node-v22.13.1-linux-x64.tar.xz -C /usr/local --strip-components=1
    init:
      - node --version
      - npm --version
    output: android/app/build/outputs/apk/release/app-release-unsigned.apk
    scanignore:
      - node_modules
    build:
      - bash scripts/build-fdroid-android.sh

