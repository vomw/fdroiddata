AuthorName: Kees van 't Slot
SourceCode: https://github.com/DitisKees/homelibrary-app
IssueTracker: https://github.com/DitisKees/homelibrary-app/issues
Changelog: https://github.com/DitisKees/homelibrary-app/tags

RepoType: git
Repo: https://github.com/DitisKees/homelibrary-app.git
Binaries:
  https://github.com/DitisKees/homelibrary-app/releases/download/v%v/HomeLibrary-%v.apk

Builds:
  - versionName: 1.0.6
    versionCode: 7
    commit: b403bcd997cf87e77b6768936f3c5cf24cbd3402
    sudo:
      - echo "deb https://deb.debian.org/debian forky main" > /etc/apt/sources.list.d/forky.list
      - apt-get update
      - apt-get install -y -t forky npm
    init:
      - node --version
      - npm --version
      - npm ci
    output: android/app/build/outputs/apk/release/app-release-unsigned.apk
    prebuild:
      - sed -i -e 's/"node":\ ">=22.13.0 <23"/"node":\ ">=22.13.0"/' package.json
      - find node_modules -type d -name local-maven-repo -prune -exec rm -rf {} +
      - npx expo prebuild -p android --clean
      - echo 'org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8'
        >> android/gradle.properties
      - echo 'org.gradle.workers.max=2' >> android/gradle.properties
      - echo 'kotlin.compiler.execution.strategy=in-process' >> android/gradle.properties
      - sed -i -e '/signingConfig /d' android/app/build.gradle
    scanignore:
      - node_modules/react-native/sdks/hermesc/linux64-bin/hermesc
      - node_modules/expo-modules-core/android/ExpoModulesCorePlugin.gradle
      - node_modules/expo-modules-autolinking/scripts/android/autolinking_implementation.gradle
    scandelete:
      - node_modules
    build:
      - cd android/app
      - gradle assembleRelease
    ndk: r27b
    postbuild:
      - python3 scripts/normalize-fdroid-apk-build-ids.py $$OUT$$

AllowedAPKSigningKeys: 99115557adc7601e8d71adbf8884b0d359ab3f720cbec10c17828c36b7bdd813

MaintainerNotes: |-
  HomeLibrary uses Expo/React Native and does not commit android/. Expo prebuild
  therefore generates the Android project after checkout. Because fdroidserver
  validates subdir before init/prebuild, this build follows existing generated
  Expo recipes in fdroiddata: no subdir is declared, output points to the
  generated APK, and the build command runs Gradle from android/app.

  Node.js/npm are installed from Debian forky as requested by the F-Droid
  maintainer. Forky currently provides a newer Node.js than the source tag's
  conservative <23 engines upper bound, so the recipe removes only that upper
  bound before npm install/prebuild.

  Expo SDK 57 bundles precompiled AARs in local-maven-repo directories. Expo
  autolinking is configured upstream to build all native modules from source and
  bundled local Maven repositories are removed before Android generation.

  Native React Native/Expo builds can embed absolute checkout paths and varying
  GNU build IDs in source-built ELF libraries. The checked-in upstream Expo
  config plugin plugins/with-reproducible-native-builds.js adds the app-level
  externalNativeBuild C/C++ prefix-map flags during Expo prebuild. No generated
  Gradle patch is embedded in this metadata. APK build-id normalization is
  implemented by the checked-in scripts/normalize-fdroid-apk-build-ids.py helper.

  React Native 0.86 is built with the Expo SDK 57 NDK baseline, pinned here as
  Android NDK r27b.

  Upstream v1.0.6 is signed with the permanent developer key and published as a
  reproducible GitHub Release APK. F-Droid should exclusively publish that APK
  after matching it against the unsigned APK produced by this recipe.

