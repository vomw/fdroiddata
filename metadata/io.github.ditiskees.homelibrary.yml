MaintainerNotes: |-
  HomeLibrary uses Expo/React Native and does not commit android/; Expo prebuild
  creates the Android project during the build, so this recipe intentionally has
  no subdir entry.

  Native React Native/Expo builds can embed their absolute source checkout path
  in ELF objects. The build therefore stages all source/build inputs into the
  fixed /tmp/homelibrary-fdroid-source path and performs npm install, validation,
  Expo prebuild and the Gradle release build there. The unsigned APK is copied
  back to the checkout at the output path above. The same build script is used by
  upstream's two-clean-checkout reproducibility workflow, which compares the
  resulting unsigned APKs byte-for-byte.

  The canonical staging step deliberately excludes .git, node_modules, android
  output and Gradle state, so no generated or checkout-specific state is carried
  into the reproducible build root.

  Expo SDK 57 bundles precompiled AARs in local-maven-repo directories. Upstream
  configures Expo autolinking buildFromSource [".*"] and the build script deletes
  every bundled local-maven-repo so native Expo modules are compiled from source.

  node_modules is scanignored rather than scandeleted because the React Native /
  Expo source tree is required to compile the application. Upstream separately
  audits production npm licenses/provenance and removes the bundled Expo AARs
  before Android generation. During build, the generated release dependency graph
  is checked for Google Play Services, Firebase, ML Kit and Play SDK artifacts.

  The parent F-Droid build environment previously supplied Node.js 20.19.2.
  Expo SDK 57 / React Native 0.86 requires Node.js 22.13.x or newer for this
  source tree, so this recipe installs the checksum-pinned official Node.js
  22.13.1 build tool. Node.js itself is not bundled in the APK.

  React Native 0.86 is built with the Expo SDK 57 NDK baseline, pinned here as
  Android NDK r27b instead of relying on the buildserver's ambient NDK.

  Upstream v1.0.3 is signed with the permanent developer key and published as a
  reproducible GitHub Release APK. F-Droid should exclusively publish that APK
  after matching it against the unsigned APK produced by this recipe.

