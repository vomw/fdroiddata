MaintainerNotes: |-
  HomeLibrary uses Expo/React Native and does not commit android/. The recipe
  follows templates/build-react-native.yml: npm dependencies are installed during
  init, Expo prebuild generates the Android project, signingConfig is removed,
  and F-Droid invokes Gradle directly.

  Node.js/npm are installed from Debian forky as requested by the F-Droid
  maintainer. Forky currently provides a newer Node.js than the source tag's
  conservative <23 engines upper bound, so the recipe removes only that upper
  bound before npm install/prebuild. The application source and dependencies are
  otherwise unchanged.

  Expo SDK 57 bundles precompiled AARs in local-maven-repo directories. Expo
  autolinking is configured to build all native modules from source and bundled
  local Maven repositories are removed before Android generation.

  Native React Native/Expo builds can embed absolute checkout paths and varying
  GNU build IDs in source-built ELF libraries. The recipe applies the same
  compiler prefix maps and in-place GNU SHA-1 build-id normalization used by
  upstream reproducibility CI, including refreshing the affected ZIP CRCs.

  React Native 0.86 is built with the Expo SDK 57 NDK baseline, pinned here as
  Android NDK r27b.

  Upstream v1.0.4 is signed with the permanent developer key and published as a
  reproducible GitHub Release APK. F-Droid should exclusively publish that APK
  after matching it against the unsigned APK produced by this recipe.

