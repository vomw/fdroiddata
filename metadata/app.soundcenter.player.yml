Repo: https://github.com/Azare77/sound_center.git

Builds:
  - versionName: 1.0.0-beta.4
    versionCode: 11
    commit: c924efec477ea706c19fcac9812690281e51a72b
    sudo:
      - mkdir -p /home/runner/work
      - mkdir -p /home/runner/.pub-cache
      - chown -R vagrant /home/runner
    output: build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
    binary: https://github.com/Azare77/sound_center/releases/download/v%v/app-armeabi-v7a-release.apk
    srclibs:
      - flutter@stable
    rm:
      - ios
      - linux
      - windows
    prebuild:
      - flutterVersion=$(sed -n -E "s/.*flutter-version:\ '(.*)'/\1/p" .github/workflows/flutter-release.yml)
      - '[[ $flutterVersion ]]'
      - git -C $$flutter$$ checkout -f $flutterVersion
      - export repo=/home/runner/work/sound_center
      - mkdir -p $repo
      - cd ..
      - mv app.soundcenter.player $repo/sound_center
      - pushd $repo/sound_center
      - export PUB_CACHE=/home/runner/.pub-cache
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get
      - popd
      - mv $repo/sound_center app.soundcenter.player
    build:
      - export repo=/home/runner/work/sound_center
      - cd ..
      - mv app.soundcenter.player $repo/sound_center
      - pushd $repo/sound_center
      - export PUB_CACHE=/home/runner/.pub-cache
      - $$flutter$$/bin/flutter build apk --release --split-per-abi --target-platform="android-arm"
      - popd
      - mv $repo/sound_center app.soundcenter.player

