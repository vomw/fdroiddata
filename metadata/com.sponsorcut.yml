SourceCode: https://github.com/Guy-Steiff/SponsorCut
IssueTracker: https://github.com/Guy-Steiff/SponsorCut/issues

Name: SponsorCut
AutoName: SponsorCut

RepoType: git
Repo: https://github.com/Guy-Steiff/SponsorCut

Builds:
  - versionName: '1.0'
    versionCode: 1
    commit: v1.0
    subdir: app
    sudo:
      - apt-get update
      - apt-get install -y autoconf automake libtool pkg-config nasm gcc gperf texinfo
        yasm bison autogen wget autopoint meson ninja-build ragel groff make
    gradle:
      - yes
    prebuild:
      - sdkmanager "cmake;3.22.1"
      - git clone --no-checkout https://github.com/InfinityLoop1308/ffmpeg-kit.git
        ../ffmpeg-kit-src
      - git -C ../ffmpeg-kit-src checkout efd648489598efdc65e2e2f06ae69e065e257077
      - cd ../ffmpeg-kit-src && ANDROID_SDK_ROOT=$$SDK$$ ANDROID_NDK_ROOT=$$NDK$$
        ./android.sh --lts --enable-android-media-codec --enable-android-zlib --disable-arm-v7a
        --disable-arm-v7a-neon --disable-x86 || (find ../ffmpeg-kit-src -name '*.log'
        | xargs cat; exit 1)
      - mkdir -p libs
      - cp ../ffmpeg-kit-src/prebuilt/bundle-android-aar-lts/ffmpeg-kit/ffmpeg-kit.aar
        libs/ffmpeg-kit.aar
    scanignore:
      - app/libs
    ndk: 25.2.9519653

AllowedAPKSigningKeys: 71a5664ef1c0fc06303bbc948400c6daf1fc69ee7a519babdd88a8d8dcfa0ccd

