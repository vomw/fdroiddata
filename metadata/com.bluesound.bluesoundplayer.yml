Categories:
  - Remote Controller
License: MIT
AuthorName: rdOxalis
AuthorWebSite: https://github.com/rdOxalis
SourceCode: https://github.com/rdOxalis/bluesoundplayer
IssueTracker: https://github.com/rdOxalis/bluesoundplayer/issues

AutoName: BlueSound Controller

RepoType: git
Repo: https://github.com/rdOxalis/bluesoundplayer

Builds:
  - versionName: 1.0.0
    versionCode: 1
    commit: 268b2c2a4a1e9d2f7ba5d3a29c2728d603c839e8
    subdir: flutter
    output: build/app/outputs/flutter-apk/app-*-release.apk
    srclibs:
      - flutter@stable
    rm:
      - src
      - release
    prebuild:
      - flutterVersion=$(sed -n -E "s/.*flutter-version:\ '(.*)'/\1/p" ../.github/workflows/release.yml)
      - '[[ $flutterVersion ]]'
      - git -C $$flutter$$ checkout -f $flutterVersion
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get
    scandelete:
      - flutter/.pub-cache
    build:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter build apk --release

AutoUpdateMode: Version
UpdateCheckMode: Tags
UpdateCheckData: flutter/pubspec.yaml|version:\s.+\+(\d+)|.|version:\s(.+)\+
CurrentVersion: 1.0.0
CurrentVersionCode: 1
