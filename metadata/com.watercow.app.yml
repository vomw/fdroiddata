Categories:
  - Sports & Health
License: MIT
AuthorName: Kishor
SourceCode: https://github.com/kishor-23/Water-Cow
IssueTracker: https://github.com/kishor-23/Water-Cow/issues

AutoName: Water Cow

RepoType: git
Repo: https://github.com/kishor-23/Water-Cow.git

Builds:
  - versionName: 1.0.1
    versionCode: 2
    commit: 380fb3b5d5e55f0de2db574a8e14d2a0fcf46416
    subdir: android/app

    sudo:
      - echo "deb https://deb.debian.org/debian bookworm main" > /etc/apt/sources.list.d/bookworm.list
      - apt-get update
      - apt-get install -y -t bookworm openjdk-17-jdk-headless
      - update-java-alternatives -s java-1.17.0-openjdk-amd64
      - apt-get install -y npm

    srclibs:
      - firebase-stub@ce90a956aacda17a85c60577ee443aeb83d876ef

    init:
      - cd ../..
      - npm ci --legacy-peer-deps
      - sed -i -e '/firebase/d' node_modules/expo-notifications/android/build.gradle
      - cp -a $$firebase-stub$$/firebase-messaging/src node_modules/expo-notifications/android

    gradle:
      - yes

    output: build/outputs/apk/release/app-release-unsigned.apk

    scanignore:
      - node_modules

AutoUpdateMode: Version
UpdateCheckMode: Tags ^v[0-9.]+$
CurrentVersion: 1.0.1
CurrentVersionCode: 2