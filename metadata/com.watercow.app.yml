Builds:
  - versionName: 1.0.1
    versionCode: 2
    commit: 3c722d124754ebbe5b2484d221be0c1860b1d4d6
    subdir: android/app
    sudo:
      - echo "deb https://deb.debian.org/debian bookworm main" > /etc/apt/sources.list.d/bookworm.list
      - apt-get update
      - apt-get install -y -t bookworm openjdk-17-jdk-headless
      - update-java-alternatives -s java-1.17.0-openjdk-amd64
      - apt-get install -y npm
    init:
      - cd ../..
      - npm ci --legacy-peer-deps
      - sed -i -e '/firebase/d' node_modules/expo-notifications/android/build.gradle
      - cp -a ../srclib/firebase-stub/firebase-messaging/src node_modules/expo-notifications/android
    gradle:
      - yes
    output: build/outputs/apk/release/app-release-unsigned.apk
    srclibs:
      - firebase-stub@ce90a956aacda17a85c60577ee443aeb83d876ef
    scanignore:
      - node_modules

MaintainerNotes: Binary scanner detects com/google/firebase classes from firebase-stub
  srclib.

AutoUpdateMode: Version
UpdateCheckMode: Tags ^v[0-9.]+$
