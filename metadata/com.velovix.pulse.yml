AntiFeatures:
  NonFreeNet:
    en-US: Loads Cloudflare Turnstile, a proprietary CAPTCHA script, from a remote
      server during login and signup.
Categories:
  - Development
License: GPL-3.0-or-later
AuthorName: Velovix
AuthorEmail: info@velovix.com
SourceCode: https://github.com/TheVelovix/pulse-app
IssueTracker: https://github.com/TheVelovix/pulse-app/issues

AutoName: Pulse

RepoType: git
Repo: https://github.com/TheVelovix/pulse-app.git

Builds:
  - versionName: 1.0.0
    versionCode: 141
    commit: dccb0b336875b1696cd9229baa3dc606d9e6fab1
    subdir: android/app
    sudo:
      - apt-get update
      - apt-get install -y npm ninja-build bzip2 xz-utils
      - npm -g install bun
      - npm install -g corepack
    init:
      - cd ../..
      - sed -i -e '1a "expo":{"autolinking":{"android":{"buildFromSource":[".*"]}}},'
        -e '/"expo-dev-client":/d' package.json
      - bun install
    gradle:
      - yes
    srclibs:
      - react-native-skia@v2.6.2
    rm:
      - node_modules/@shopify/react-native-skia/libs/android
    prebuild:
      - cd ../..
      - sed -i '/jvmToolchain\|JavaVersion\|fromTarget/s/17/21/' node_modules/@react-native/gradle-plugin/*/build.gradle.kts
        node_modules/@react-native/gradle-plugin/react-native-gradle-plugin/src/main/kotlin/com/facebook/react/utils/JdkConfiguratorUtils.kt
        node_modules/{react-native-reanimated,react-native-worklets}/android/build.gradle.kts
        node_modules/expo-modules-core/android/ExpoModulesCorePlugin.gradle
      - EXPO_PUBLIC_BACKEND=https://api.pulse.velovix.com bunx expo prebuild -p android
        --no-install
      - sed -i "s/versionCode [0-9]\+/versionCode $$VERCODE$$/" android/app/build.gradle
      - sed -i 's/versionName "[^"]*"/versionName "$$VERSION$$"/' android/app/build.gradle
      - echo -e "\norg.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g" >> android/gradle.properties
      - sed -i -e '/signingConfig /d' android/app/build.gradle
      - export skiaVersion=$(sed -n -E 's|.*"@shopify/react-native-skia":\s*"(.*)".*|\1|p'
        package.json)
      - '[[ $skiaVersion ]]'
      - git -C $$react-native-skia$$ checkout -f "v$skiaVersion"
      - sed -i -e 's/mapKeys(configuration.targets) as string\[\]/["arm"]/' -e 's/import
        { \$, mapKeys, runAsync }/import { \$, runAsync }/' $$react-native-skia$$/packages/skia/scripts/build-skia.ts
      - sed -i 's/ndk_api.*, *26/ndk_api", 24/' $$react-native-skia$$/packages/skia/scripts/skia-configuration.ts
    androidupdate:
      - no
    scanignore:
      - node_modules/hermes-compiler/hermesc/linux64-bin/hermesc
      - node_modules/expo-modules-core/android/ExpoModulesCorePlugin.gradle
      - node_modules/react-native-safe-area-context/android/build.gradle
      - node_modules/react-native-screens/android/build.gradle
      - node_modules/react-native-svg/android/build.gradle
      - node_modules/react-native-webview/android/build.gradle
      - node_modules/@react-native-masked-view/masked-view/android/build.gradle
    scandelete:
      - node_modules
    build:
      - mkdir -p $ANDROID_NDK/sources/android/cpufeatures
      - cp ../../vendor/ndk-cpufeatures/cpu-features.c $ANDROID_NDK/sources/android/cpufeatures/cpu-features.c
      - cp ../../vendor/ndk-cpufeatures/cpu-features.h $ANDROID_NDK/sources/android/cpufeatures/cpu-features.h
      - export PATH=$$react-native-skia$$/externals/depot_tools:$PATH
      - ensure_bootstrap
      - pushd $$react-native-skia$$/packages/skia
      - corepack enable
      - yarn
      - yarn build-skia android-arm
      - popd
      - mkdir -p ../../node_modules/@shopify/react-native-skia/libs/android
      - cp -r $$react-native-skia$$/packages/skia/libs/android/* ../../node_modules/@shopify/react-native-skia/libs/android/
    ndk: r27b
    gradleprops:
      - reactNativeArchitectures=armeabi-v7a
      - expo.useLegacyPackaging=true
      - org.gradle.daemon=true
      - org.gradle.parallel=true
      - org.gradle.caching=true

