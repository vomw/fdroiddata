AntiFeatures:
  NonFreeNet:
    en-US: Loads Cloudflare Turnstile, a proprietary CAPTCHA script, from a remote
      server during login and signup.
Categories:
  - Development
License: GPL-3.0-or-later
AuthorName: Melos Shabi
AuthorEmail: melosshabi@protonmail.com
SourceCode: https://github.com/TheVelovix/pulse-app

RepoType: git
Repo: https://github.com/TheVelovix/pulse-app.git

Builds:
  - versionName: '1.0.0'
    versionCode: 1
    commit: 007694c5bbe0aedc34233f6a0c78c585ccb4c694
    subdir: android/app
    sudo:
      - sysctl fs.inotify.max_user_watches=524288 || true
      - apt-get update
      - apt-get install -y npm ninja-build bzip2 xz-utils
      - npm -g install bun
      - npm install -g corepack
    gradle:
      - yes
    srclibs:
      - react-native-skia@v2.6.2
    init:
      - cd ../..
      - sed -i -e '1a "expo":{"autolinking":{"android":{"buildFromSource":[".*"]}}},'
        -e '/"react-native-purchases":/d' -e '/"expo-dev-client":/d' package.json
      - bun install
    rm:
      - node_modules/@shopify/react-native-skia/libs/android
    prebuild:
      - cd ../..
      - sed -i '/jvmToolchain/s/17/21/' node_modules/@react-native/gradle-plugin/*/build.gradle.kts
      - sed -i -e 's/JavaVersion.VERSION_17/JavaVersion.VERSION_21/g' -e 's/jvmToolchain(17)/jvmToolchain(21)/g'
        node_modules/@react-native/gradle-plugin/react-native-gradle-plugin/src/main/kotlin/com/facebook/react/utils/JdkConfiguratorUtils.kt
      - sed -i -e 's/JavaVersion.VERSION_17/JavaVersion.VERSION_21/g' -e 's/fromTarget("17")/fromTarget("21")/g'
        node_modules/react-native-worklets/android/build.gradle.kts
      - EXPO_PUBLIC_STORE=f-droid EXPO_PUBLIC_BACKEND=https://api.pulse.velovix.com
        bunx expo prebuild -p android --clean --no-install
      - sed -i -e 's/-Xmx[0-9]*[mg]/-Xmx4g/g' -e 's/-XX:MaxMetaspaceSize=[0-9]*[mg]/-XX:MaxMetaspaceSize=1g/g'
        android/gradle.properties
      - sed -i -e '/signingConfig /d' android/app/build.gradle
      - export skiaVersion=$(sed -n -E 's|.*"@shopify/react-native-skia":\s"(.*)".*|\1|p'
        package.json)
      - '[[ $skiaVersion ]] || exit 1'
      - git -C $$react-native-skia$$ checkout -f "v$skiaVersion"
      - sed -i -e 's/mapKeys(configuration.targets) as string\[\]/["arm", "arm64", "x86", "x64"]/'
        -e 's/import { \$, mapKeys, runAsync }/import { $, runAsync }/'
        $$react-native-skia$$/packages/skia/scripts/build-skia.ts
    build:
      - export ANDROID_NDK=$ANDROID_HOME/ndk/27.1.12297006
      - export PATH=$$react-native-skia$$/externals/depot_tools:$PATH
      - ensure_bootstrap
      - pushd $$react-native-skia$$/packages/skia
      - corepack enable
      - yarn
      - build="yarn build-skia android"
      - $build || $build || $build
      - popd
      - mkdir -p ../../node_modules/@shopify/react-native-skia/libs/android
      - cp -r $$react-native-skia$$/packages/skia/libs/android/* ../../node_modules/@shopify/react-native-skia/libs/android/
    scanignore:
      - node_modules/hermes-compiler/hermesc/linux64-bin/hermesc
      - node_modules/expo-modules-core/android/ExpoModulesCorePlugin.gradle
      - node_modules/react-native-safe-area-context/android/build.gradle
      - node_modules/react-native-screens/android/build.gradle
      - node_modules/react-native-svg/android/build.gradle
      - node_modules/react-native-webview/android/build.gradle
    scandelete:
      - node_modules

AutoUpdateMode: Version
UpdateCheckMode: Tags
CurrentVersion: '1.0.0'
CurrentVersionCode: 1
