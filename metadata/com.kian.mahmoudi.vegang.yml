AutoName: VegaNG
Summary: Fast and lightweight V2Ray VPN client
Description: |-
  VegaNG is a modern, high-performance VPN application that leverages the V2Ray core to deliver fast and reliable connections.

  Features:
  * Material 3 UI with Jetpack Compose
  * Single and batch latency testing
  * Auto-sort configs by lowest ping
  * One-tap cleanup of non-working configs
  * English and Farsi (RTL) support

