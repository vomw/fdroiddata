Categories:
  - Bookmark
  - Internet
  - Note
License: MIT
SourceCode: https://github.com/jydv402/memno
IssueTracker: https://github.com/jydv402/memno/issues

AutoName: memno

RepoType: git
Repo: https://github.com/jydv402/memno

Builds:
  - versionName: 1.3.2
    versionCode: 11
    commit: 1.3.2+11
    output: build/app/outputs/flutter-apk/app-withoutota-release.apk
    srclibs:
      - flutter@stable
    rm:
      - ios
      - linux
      - macos
      - web
      - windows
    prebuild:
      - git -C $$flutter$$ checkout -f 3.41.9
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter pub remove ota_update
      - cp lib/home_wo_ota.dart lib/home.dart
      - cp lib/components/settings_page_wo_ota.dart lib/components/settings_page.dart
      - rm lib/functionality/check_update.dart
      - rm lib/components/update_bottom_sheet.dart
      - rm lib/home_wo_ota.dart
      - rm lib/components/settings_page_wo_ota.dart
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get
    scanignore:
      - android
    scandelete:
      - .vs
      - .pub-cache
    build:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter build apk --release --flavor withoutOTA --dart-define=UPDATE_LOGIC=withoutOTA

AutoUpdateMode: Version
UpdateCheckMode: Tags
UpdateCheckData: pubspec.yaml|version:\s.+\+(\d+)|.|version:\s(.+)\+
CurrentVersion: 1.3.2
CurrentVersionCode: 11
