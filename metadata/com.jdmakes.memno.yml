Categories:
  - Bookmark
  - Internet
  - Note
License: MIT
SourceCode: https://github.com/jydv402/memno
IssueTracker: https://github.com/jydv402/memno/issues

AutoName: memno

RepoType: git
Repo: https://github.com/jydv402/memno

Builds:
  - versionName: 1.3.2
    versionCode: 11
    commit: 1.3.2+11
    output: build/app/outputs/flutter-apk/app-withoutota-release.apk
    srclibs:
      - flutter@stable
    rm:
      - ios
      - linux
      - macos
      - web
      - windows
    prebuild:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get
    scandelete:
      - .pub-cache
    build:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter build apk --release --flavor withoutOTA --dart-define=UPDATE_LOGIC=withoutOTA

AutoUpdateMode: Version
UpdateCheckMode: Tags
UpdateCheckData: pubspec.yaml|version:\s.+\+(\d+)|.|version:\s(.+)\+
CurrentVersion: 1.3.2
CurrentVersionCode: 11
