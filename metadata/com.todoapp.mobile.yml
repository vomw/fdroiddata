Categories:
  - Task
License: GPL-3.0-only
SourceCode: https://github.com/askadvaith/Elevate
IssueTracker: https://github.com/askadvaith/Elevate/issues
Changelog: https://github.com/askadvaith/Elevate/releases

AutoName: Elevate
Description: |-
  Elevate is a minimalist task management app with the following features:

  - Create, view, and manage tasks with ease
  - Set task due dates and smart reminders
  - Support for recurring tasks
  - Beautiful, responsive UI optimized for mobile
  - Local data storage, no cloud dependency
  - Works fully offline
  - Lightweight and fast

  Built with React and Capacitor for cross-platform compatibility.

RepoType: git
Repo: https://github.com/askadvaith/Elevate

Builds:
  - versionName: '1.0'
    versionCode: 1
    commit: v1.0
    subdir: android/app
    sudo:
      - apt-get update
      - apt-get install -y curl
      - curl -Lo node.tar.gz https://nodejs.org/dist/v22.14.0/node-v22.14.0-linux-x64.tar.gz
      - echo "9d942932535988091034dc94cc5f42b6dc8784d6366df3a36c4c9ccb3996f0c2 node.tar.gz"
        | sha256sum -c -
      - tar xzf node.tar.gz --strip-components=1 -C /usr/local/
    gradle:
      - yes
    output: build/outputs/apk/release/*.apk
    prebuild:
      - cd ../..
      - npm install
      - npm run build:mobile
      - grep -q '^android.useAndroidX=true$' android/gradle.properties || echo 'android.useAndroidX=true'
        >> android/gradle.properties
      - grep -q '^android.enableJetifier=true$' android/gradle.properties || echo
        'android.enableJetifier=true' >> android/gradle.properties

AutoUpdateMode: Version
UpdateCheckMode: Tags
CurrentVersion: '1.0'
CurrentVersionCode: 1
