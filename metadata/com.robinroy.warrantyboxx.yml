Builds:
  - versionName: 1.0.1
    versionCode: 11001
    commit: 91283da0c3f7f2f82b6f2e06f476a3f8839a1308
    sudo:
      - mkdir -p /home/runner/work/WarrantyBoxx-
      - chown -R vagrant /home/runner
    output: build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
    binary: https://github.com/BloodBlinker/WarrantyBoxx-/releases/download/v%v/WarrantyBoxx-%v-armeabi-v7a.apk
    srclibs:
      - flutter@stable
    prebuild:
      - flutterVersion=$(sed -n -E "s/.*FLUTTER_VERSION:\ '(.*)'/\1/p" .github/workflows/ci.yml)
      - '[[ $flutterVersion ]]'
      - git -C $$flutter$$ checkout -f $flutterVersion
      - export repo=/home/runner/work/WarrantyBoxx-/WarrantyBoxx-
      - cd ..
      - mv com.robinroy.warrantyboxx $repo
      - pushd $repo
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get --enforce-lockfile
      - $$flutter$$/bin/dart run build_runner build --delete-conflicting-outputs
      - $$flutter$$/bin/flutter gen-l10n
      - popd
      - mv $repo com.robinroy.warrantyboxx
    scandelete:
      - .pub-cache
    build:
      - export repo=/home/runner/work/WarrantyBoxx-/WarrantyBoxx-
      - cd ..
      - mv com.robinroy.warrantyboxx $repo
      - pushd $repo
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter build apk --release --split-per-abi --target-platform=android-arm
      - popd
      - mv $repo com.robinroy.warrantyboxx

