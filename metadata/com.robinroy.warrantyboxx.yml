  - Finance
License: GPL-3.0-only
AuthorName: Robin Roy
AuthorWebSite: https://github.com/BloodBlinker
SourceCode: https://github.com/BloodBlinker/WarrantyBoxx-
IssueTracker: https://github.com/BloodBlinker/WarrantyBoxx-/issues
AutoName: WarrantyBoxx
RepoType: git
Repo: https://github.com/BloodBlinker/WarrantyBoxx-.git

Builds:
  - versionName: '1.0.0'
    versionCode: 100001
    commit: v1.0.0
    srclibs:
      - flutter@stable
    rm:
      - ios
      - linux
      - macos
      - web
      - windows
    prebuild:
      - flutterVersion=$(sed -n -E "s/.*FLUTTER_VERSION:\ '(.*)'/\1/p" .github/workflows/ci.yml)
      - '[[ $flutterVersion ]]'
      - git -C $$flutter$$ checkout -f $flutterVersion
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get
    scanignore:
      - .flutter/bin/cache
    scandelete:
      - .flutter
      - .pub-cache
    output: build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
    build:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter build apk --release --split-per-abi --target-platform=android-arm

  - versionName: '1.0.0'
    versionCode: 100002
    commit: v1.0.0
    srclibs:
      - flutter@stable
    rm:
