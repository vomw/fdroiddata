AutoName: Archivio
Summary: Private tracker-free Android file manager
Description: |-
  Archivio is a GPL-3.0-or-later Android file manager built with Kotlin and a local WebView UI.

  It has no ads, analytics, trackers, Google Play Services, or INTERNET permission.

  Current features include one main file panel, a left side panel for recent files and diagnostics,
  local search, file operations, and built-in rendered preview plus text-edit modes.

