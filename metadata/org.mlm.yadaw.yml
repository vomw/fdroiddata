Builds:
  - versionName: 0.8.7
    versionCode: 16779271
    commit: eb0402b5959a196565dbe93743cf5ae9a80860d5
    sudo:
      - apt-get update
      - apt-get install -y gcc libc-dev
    output: target/release/apk/yadaw.apk
    srclibs:
      - rustup@1.28.2
      - reproducible-apk-tools@v0.3.0
    prebuild:
      - export ANDROID_API=$(sed -E -n 's/.*ANDROID_API.*"(.*)".*/\1/p' .github/workflows/release.yml)
      - export BUILD_TOOLS=$(sed -E -n 's/.*ANDROID_BUILD_TOOLS.*"(.*)".*/\1/p' .github/workflows/release.yml)
      - sdkmanager "platforms;android-$ANDROID_API" "build-tools;$BUILD_TOOLS"
      - export RUST_VERSION=$(sed -n -E 's/channel = "(.*)"/\1/p' rust-toolchain.toml)
      - $$rustup$$/rustup-init.sh -y --default-toolchain $RUST_VERSION --target aarch64-linux-android
      - source "$HOME/.cargo/env"
      - export CARGO_RAPK_TAG=$(sed -E -n 's/.*CARGO_RAPK_VERSION.*"([^"]+)".*/\1/p'
        .github/workflows/release.yml)
      - cargo install --git https://github.com/mlm-games/cargo-rapk.git --tag v$CARGO_RAPK_TAG
        cargo-rapk --locked
      - rm -rf third_party/android/termux/
    build:
      - source "$HOME/.cargo/env"
      - cargo rapk build --release --deterministic --unsigned --target aarch64-linux-android
        --no-default-features --features android,clap-host --lib
    ndk: 28.2.13676358
    postbuild:
      - mv $$OUT$$ unaligned.apk
      - export PAGE_SIZE=$(sed -E -n 's/.*CARGO_RAPK_PAGE_SIZE_KB\s*:\s*"([0-9]+)".*/\1/p'
        .github/workflows/release.yml)
      - $$reproducible-apk-tools$$/zipalign.py --page-size $PAGE_SIZE --pad-like-apksigner
        --replace unaligned.apk $$OUT$$

AllowedAPKSigningKeys: 4aed2f691df64a7b0fea25a6b8c80183c6dc520e049dac0178defa1d6472228f

AutoUpdateMode: Version
UpdateCheckMode: Tags
UpdateCheckData: Cargo.toml|version_code\s*=\s*([0-9]+)|Cargo.toml|version\s*=\s*"([^"]+)"
