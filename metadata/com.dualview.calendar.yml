AutoName: Dual View Calendar
Description: |
  Dual View Calendar is a clean, intuitive calendar app with an analog-inspired
  design. It displays two months side by side so you can always see what's ahead
  without swiping back and forth.

  Features:
  * Side-by-side dual-month layout for easy planning
  * Monthly and yearly calendar views
  * Dark and light mode
  * Landscape rotation support for tablets and foldables
  * Add simple notes to any day, stored only on your device
  * Fully offline — no accounts, no sign-ups

