AutoName: LoanPro
Description: |-
 LoanPro is a simple local-only loan calculator.

 It can calculate loan payments and solve for payment, price, term, or interest
 for common mortgage, vehicle, personal loan, and credit scenarios.

 The app has no ads, no tracking, no accounts, and does not use network access.

