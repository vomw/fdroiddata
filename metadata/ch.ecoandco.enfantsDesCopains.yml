License: GPL-3.0-only
WebSite: https://enfantsdescopains.ecoandco.ch
SourceCode: https://github.com/Genentes/Genentes-GtB
IssueTracker: https://github.com/Genentes/Genentes-GtB/issues

AutoName: Enfants des copains

Summary: Rappel des prénoms et anniversaires des enfants d'amis
Description: |
  Une application simple et légère pour ne plus oublier les anniversaires des enfants de vos amis.
  Fonctionne hors ligne, pas de collecte de données, code source libre.
  Développé avec Android Studio (Kotlin).

Builds:
  - versionName: v1.3
    versionCode: 3
    commit: v1.3
    subdir: app
    gradle:
      - yes

MaintainerNotes: |
  Première soumission. Application simple sans dépendances propriétaires.
  Le tag v1.3 contient la licence GPLv3 à la racine et la structure fastlane.

CurrentVersion: v1.3

RepoType: git
Repo: https://github.com/Genentes/Genentes-GtB.git

UpdateCheckData: 
  - path: app/build.gradle.kts
    regex: versionCode\s*=\s*(\d+)
    versionNameRegex: versionName\s*=\s*"([^"]+)"
