Categories:
  - Action Game
License: CC0-1.0
AuthorName: DerpBiscuit
WebSite: https://gitlab.com/DerpBiscuit/astro-strike
SourceCode: https://gitlab.com/DerpBiscuit/astro-strike
IssueTracker: https://gitlab.com/DerpBiscuit/astro-strike/-/issues

AutoName: Astro Strike

RepoType: git
Repo: https://gitlab.com/DerpBiscuit/astro-strike.git

Builds:
  - versionName: '1.0'
    versionCode: 1
    commit: 77cd3c78fb8cea26a1fcff63493a984af6dd7593
    sudo:
      - apt-get update
      - apt-get install -y pkgconf clang scons python3-pip python-is-python3
    output: build/AstroStrike-fdroid.apk
    srclibs:
      - Godot@4.6.3-stable
    prebuild:
      - mkdir -p build
      - sed -i -e 's|keystore/release=.*|keystore/release=""|' -e 's|keystore/release_user=.*|keystore/release_user=""|'
        -e 's|keystore/release_password=.*|keystore/release_password=""|' export_presets.cfg
        || true
    build:
      - export PATH=~/.local/bin:$PATH
      - export PYTHONPATH=$(python3 -c "import site; print(':'.join(site.getsitepackages()+([site.getusersitepackages()]
        if site.getusersitepackages() else [])))")
      - python3 -c "import SCons" || pip3 install --user --break-system-packages scons
      - export PYTHONPATH=$(python3 -c "import site,SCons,os; print(os.path.dirname(os.path.dirname(SCons.__file__))+':'+':'.join(site.getsitepackages()))")
      - export JAVA_HOME=$(dirname $(dirname $(readlink -f $(which javac))))
      - export ANDROID_SDK_ROOT=$$SDK$$
      - export ANDROID_NDK_ROOT=$$NDK$$
      - export HOME=$PWD
      - mkdir -p $HOME/.android-sdk/ndk
      - for d in build-tools platforms platform-tools cmdline-tools licenses cmake;
        do [ -e $$SDK$$/$d ] && ln -sfn $$SDK$$/$d $HOME/.android-sdk/$d; done
      - ln -sfn $$NDK$$ $HOME/.android-sdk/ndk/29.0.14206865
      - export ANDROID_HOME=$HOME/.android-sdk
      - export ANDROID_SDK_ROOT=$HOME/.android-sdk
      - pushd $$Godot$$
      - python3 -m SCons -j `nproc` platform=linuxbsd target=editor
      - python3 -m SCons -j `nproc` platform=android target=template_release arch=arm64
        generate_apk=yes
      - python3 -m SCons -j `nproc` platform=android target=template_release arch=arm32
      - cd platform/android/java
      - ./gradlew generateGodotTemplates
      - popd
      - sed -i -e 's:\(^.*package/signed\)\s*=.*$:\1=false:' export_presets.cfg
      - sed -i -e '/architectures\/x86=/s|=.*|=false|' -e '/architectures\/x86_64=/s|=.*|=false|'
        -e '/architectures\/armeabi-v7a=/s|=.*|=true|' -e '/architectures\/arm64-v8a=/s|=.*|=true|'
        export_presets.cfg
      - export GODOT_BIN=$(ls $$Godot$$/bin/godot.linuxbsd.editor.* | head -1)
      - test -x "$GODOT_BIN"
      - test -f $$Godot$$/bin/android_source.zip
      - test -f $$Godot$$/bin/android_release.apk
      - mkdir -p $HOME/.local/share/godot/export_templates/4.6.3.stable
      - cp -f $$Godot$$/bin/android_release.apk $HOME/.local/share/godot/export_templates/4.6.3.stable/
      - cp -f $$Godot$$/bin/android_source.zip $HOME/.local/share/godot/export_templates/4.6.3.stable/
      - echo 4.6.3.stable > $HOME/.local/share/godot/export_templates/4.6.3.stable/version.txt
      - rm -rf android/build
      - mkdir -p android/build
      - unzip -qo $$Godot$$/bin/android_source.zip -d android/build
      - echo 4.6.3.stable > android/.build_version
      - touch android/build/.gdignore
      - mkdir -p android/build/libs/release
      - cp -f $$Godot$$/bin/godot-lib.template_release.aar android/build/libs/release/
      - sed -i -e "s|custom_template/release=.*|custom_template/release=\"$$Godot$$/bin/android_release.apk\"|"
        export_presets.cfg
      - $GODOT_BIN --headless --path . --import || true
      - export GODOT_CFG=$(ls ~/.config/godot/editor_settings-*.tres 2>/dev/null |
        head -1)
      - if [ -n "$GODOT_CFG" ]; then sed -i -e "s|export/android/java_sdk_path.*|export/android/java_sdk_path
        = \"$JAVA_HOME\"|" -e "s|export/android/android_sdk_path.*|export/android/android_sdk_path
        = \"$$SDK$$\"|" "$GODOT_CFG"; fi
      - if [ -n "$GODOT_CFG" ] && ! grep -q android_sdk_path "$GODOT_CFG"; then echo
        "export/android/java_sdk_path = \"$JAVA_HOME\"" >> "$GODOT_CFG"; echo "export/android/android_sdk_path
        = \"$$SDK$$\"" >> "$GODOT_CFG"; fi
      - $GODOT_BIN --headless --path . --export-release Android build/AstroStrike-fdroid.apk
      - test -f build/AstroStrike-fdroid.apk
      - ls -lh build/AstroStrike-fdroid.apk
    ndk: r23c

MaintainerNotes: Godot 4.6 GDScript game. Fastlane metadata is in the app repo under
  metadata/en-US/.

AutoUpdateMode: None
UpdateCheckMode: None
CurrentVersion: '1.0'
CurrentVersionCode: 1
