Auto Name: true
Name: Rechenzettell

Summary: Rechen-Aufgaben fuer Kinder - Auswertung und Maskottchen
Description: |
  Rechenzettell macht Uebungssessions mit 10, 50 oder 100 Aufgaben.
  Einmaleins, Plus und Minus, Zahlenraum bis 100 und bis 1000.

  Individuelles Maskottchen, das die Kinder bauen und das motiviert.

  Bei Fehlern: Nochmal versuchen oder Loesung zeigen - die erste Antwort
  wird nie verraten.

  Auswertung mit Jubel und Konfetti nach jeder Session. Keine Werbung,
  kein Tracking, keine Berechtigungen.




