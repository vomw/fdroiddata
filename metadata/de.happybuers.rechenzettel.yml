License: GPL-3.0-or-later
AuthorName: Daniel Waschke
AuthorEmail: daniel.waschke@gmail.com
WebSite: https://rechenzettel.vercel.app
SourceCode: https://gitlab.com/DaWasch/rechenzettel-app
IssueTracker: https://gitlab.com/DaWasch/rechenzettel-app/-/issues

AutoName: Rechenzwerge

RepoType: git
Repo: https://gitlab.com/DaWasch/rechenzettel-app.git

Builds:
  - versionName: 0.1.36
    versionCode: 36
    commit: be1cdeeb3d179bd99cc94bfde204b4ef87e55297
    sudo:
      - mkdir -p /builds/DaWasch
      - chown -R vagrant /builds
    output: build/app/outputs/flutter-apk/app-release.apk
    srclibs:
      - flutter@stable
    rm:
      - ios
    prebuild:
      - flutterVersion=$(sed -n -E "s/^[[:space:]]*FLUTTER_VERSION:[[:space:]]*(.*)$/\1/p"
        .gitlab-ci.yml)
      - '[[ $flutterVersion ]]'
      - git -C $$flutter$$ checkout -f $flutterVersion
      - export repo=/builds/DaWasch/rechenzettel-app
      - cd ..
      - mv de.happybuers.rechenzettel $repo
      - pushd $repo
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get --enforce-lockfile
      - popd
      - mv $repo de.happybuers.rechenzettel
    scandelete:
      - .pub-cache
    build:
      - export repo=/builds/DaWasch/rechenzettel-app
      - cd ..
      - mv de.happybuers.rechenzettel $repo
      - pushd $repo
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter build apk --release
      - popd
      - mv $repo de.happybuers.rechenzettel

AutoUpdateMode: Version
UpdateCheckMode: Tags ^v[0-9.]+$
UpdateCheckData: pubspec.yaml|version:\s.+\+(\d+)|.|version:\s(.+)\+
CurrentVersion: 0.1.36
CurrentVersionCode: 36
