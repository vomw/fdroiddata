Categories:
  - Educational Game
License: GPL-3.0-or-later
AuthorName: Daniel Waschke
AuthorEmail: daniel.waschke@gmail.com
WebSite: https://rechenzettel.vercel.app
SourceCode: https://gitlab.com/DaWasch/rechenzettel-app
IssueTracker: https://gitlab.com/DaWasch/rechenzettel-app/-/issues

AutoName: Rechenzwerge

RepoType: git
Repo: https://gitlab.com/DaWasch/rechenzettel-app.git

Builds:
  - versionName: 0.1.45
    versionCode: 2045
    commit: 9690c6dcc2cbd02e13566ccb5e8b2b52ea5ccb2e
    sudo:
      - mkdir -p /builds/DaWasch
      - chown -R vagrant /builds
    output: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
    srclibs:
      - flutter@stable
    rm:
      - ios
    prebuild:
      - flutterVersion=$(sed -n -E "s/^[[:space:]]*FLUTTER_VERSION:[[:space:]]*(.*)$/\1/p"
        .gitlab-ci.yml)
      - '[[ $flutterVersion ]]'
      - git -C $$flutter$$ checkout -f $flutterVersion
      - export repo=/builds/DaWasch/rechenzettel-app
      - cd ..
      - mv de.happybuers.rechenzettel $repo
      - pushd $repo
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get --enforce-lockfile
      - popd
      - mv $repo de.happybuers.rechenzettel
    scandelete:
      - .pub-cache
    build:
      - export repo=/builds/DaWasch/rechenzettel-app
      - cd ..
      - mv de.happybuers.rechenzettel $repo
      - pushd $repo
      - export PUB_CACHE=$(pwd)/.pub-cache
      - export ORG_GRADLE_PROJECT_rechenzettelLegacyPackaging=true
      - $$flutter$$/bin/flutter build apk --release --split-per-abi --target-platform="android-arm64"
      - popd
      - mv $repo de.happybuers.rechenzettel

AutoUpdateMode: Version
UpdateCheckMode: Tags ^v[0-9.]+$
VercodeOperation:
  - '%c + 2000'
UpdateCheckData: pubspec.yaml|version:\s.+\+(\d+)|.|version:\s(.+)\+
CurrentVersion: 0.1.45
CurrentVersionCode: 2045
