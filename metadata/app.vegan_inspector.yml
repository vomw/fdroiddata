Builds:
  - versionName: 1.0.1
    versionCode: 21
    commit: 8908a9ed57f7e837b1b5ffd1f3c144c46ce25ff9
    sudo:
      - mkdir -p /workspace/Vegan-Inspector/
      - chown vagrant /workspace/Vegan-Inspector/
    output: build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
    binary: 
      https://codeberg.org/Vegan-Inspector/app/releases/download/v%v/vegan-inspector-%v-armeabi-v7a.apk
    srclibs:
      - flutter@stable
    prebuild:
      - flutterVersion=$(sed -n -E "s/^\s+flutter:\s*'?([0-9.]+)'?/\1/p" pubspec.yaml)
      - '[[ $flutterVersion ]]'
      - git -C $$flutter$$ checkout -f $flutterVersion
      - export repo=/workspace/Vegan-Inspector/app/work/vegan-inspector
      - mkdir -p $repo
      - cd ..
      - mv app.vegan_inspector $repo/vegan-inspector
      - pushd $repo/vegan-inspector
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter packages pub get
      - sed -i -e 's/-Wl,/-Wl,--build-id=none,/' $PUB_CACHE/hosted/pub.dev/jni-*/src/CMakeLists.txt
      - popd
      - mv $repo/vegan-inspector app.vegan_inspector
    scandelete:
      - .pub-cache
    build:
      - export repo=/workspace/Vegan-Inspector/app/work/vegan-inspector
      - cd ..
      - mv app.vegan_inspector $repo/vegan-inspector
      - pushd $repo/vegan-inspector
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter build apk --split-per-abi
      - popd
      - mv $repo/vegan-inspector app.vegan_inspector

