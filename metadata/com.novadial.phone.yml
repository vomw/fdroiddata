AutoName: NovaDial
Description: |
  NovaDial is a modern Android dialer focused on speed, privacy,
  AMOLED-friendly design, and a clean calling experience.

  NovaDial is a community-driven fork of Fossify Phone with additional
  UI improvements, performance optimizations, customization options,
  and dialer enhancements.

  Features:

  * Fast call history loading
  * Optimized recent calls view
  * AMOLED Black theme support
  * Multiple Recents UI styles
  * Dual SIM support
  * Contact management and favorites
  * No advertisements
  * Privacy-focused, offline-first

