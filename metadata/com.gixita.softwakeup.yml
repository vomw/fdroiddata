Builds:
  - versionName: 1.0.3
    versionCode: 4
    commit: ac99042dec91f26e8a974a758507193a2f6d783b
    output: build/app/outputs/flutter-apk/app-release.apk
    srclibs:
      - flutter@stable
    rm:
      - ios
      - linux
      - macos
      - web
      - windows
    prebuild:
      - cd ..
      - mv com.gixita.softwakeup /tmp/build
      - pushd /tmp/build
      - export PUB_CACHE=$(pwd)/.pub-cache
      - git -C $$flutter$$ checkout -f 3.44.8
      - sed -i '/FlutterFire Configuration/,/FlutterFire Configuration/d' android/settings.gradle.kts
      - sed -i 's/signingConfigs.getByName("debug")/null/' android/app/build.gradle.kts
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get --enforce-lockfile
      - popd
      - mv /tmp/build com.gixita.softwakeup
    scandelete:
      - .pub-cache
    build:
      - cd ..
      - mv com.gixita.softwakeup /tmp/build
      - pushd /tmp/build
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter build apk --release
      - popd
      - mv /tmp/build com.gixita.softwakeup

