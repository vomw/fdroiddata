Builds:
  - versionName: 0.15.4-beta
    versionCode: 33
    commit: 353c9e3d8223bfbe3a3cb40b12bf0716c508149e
    subdir: app
    sudo:
      - apt-get update
      - apt-get install -y 7zip autoconf autoconf-archive autogen automake autopoint
        bison build-essential clang docbook-xml docbook-xsl doxygen flex gawk gettext
        gperf groff-base gtk-doc-tools help2man intltool jq libbz2-dev
        liblzma-dev libncurses-dev libreadline-dev libsqlite3-dev libssl-dev libxml2-utils libzstd-dev
        libtool-bin lld llvm lz4 lzip lrzip lzop pandoc perl
        pkg-config po4a python-is-python3
        tcl texinfo tk-dev triehash unzip uuid-dev xsltproc xz-utils zip zlib1g-dev zstd
      - install -d -m 0777 /data/data/com.autopi
    gradle:
      - yes
    prebuild:
      - export TERMUX_REF=401bbe54b8f4e68302b1ff70678015a24628fb1d
      - git config --global user.email fdroid@localhost
      - git config --global user.name F-Droid
      - bash ../build_from_source.sh > /tmp/build_from_source.log 2>&1
      - tail -n 900 /tmp/build_from_source.log || true
    scanignore:
      - app/src/main/assets/bootstrap-aarch64.zip

AutoUpdateMode: Version
UpdateCheckMode: Tags ^v[0-9]+(\.[0-9]+)*-beta$
