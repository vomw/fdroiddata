IssueTracker: https://github.com/cryptrr/AutoPie/issues

AutoName: AutoPie

RepoType: git
Repo: https://github.com/cryptrr/AutoPie.git

Builds:
  - versionName: 0.15.4-beta
    versionCode: 33
    commit: 476e44ba32815352f947cef7f81483938fe19942
    subdir: app
    sudo:
      - apt-get update
      - apt-get install -y autoconf autoconf-archive autogen automake autopoint
        bison build-essential clang flex gawk gettext gperf intltool jq libbz2-dev
        liblzma-dev libncurses-dev libreadline-dev libsqlite3-dev libssl-dev
        libtool-bin lld llvm lz4 lzip lrzip lzop perl pkg-config python-is-python3
        tcl tk-dev unzip uuid-dev xz-utils zip zlib1g-dev zstd
      - install -d -m 0777 /data/data/com.autopi
    gradle:
      - yes
    prebuild:
      - export TERMUX_REF=401bbe54b8f4e68302b1ff70678015a24628fb1d
      - git config --global user.email fdroid@localhost
      - git config --global user.name F-Droid
      - |
        set +e
        bash ../build_from_source.sh > /tmp/build_from_source.log 2>&1
        status=$?
        echo "==== build_from_source.sh last 600 lines ===="
        tail -n 600 /tmp/build_from_source.log || true
        echo "==== end build_from_source.sh log ===="
        exit "$status"
    scanignore:
      - app/src/main/assets/bootstrap-aarch64.zip

AutoUpdateMode: Version
UpdateCheckMode: Tags ^v[0-9]+(\.[0-9]+)*-beta$
CurrentVersion: 0.15.4-beta
CurrentVersionCode: 33
