Builds:
  - versionName: 0.76.4
    versionCode: 7604
    commit: 07132cdf905de528681e897641225f185ca5ce5e
    subdir: front/android/app
    sudo:
      - apt-get update
      - apt-get install -y openjdk-21-jdk-headless
      - update-alternatives --auto java
      - curl -Lo node.tar.gz https://nodejs.org/dist/v22.23.2/node-v22.23.2-linux-x64.tar.gz
      - echo "b294a556e639d64338823920e5866c21c02741742d2e1529ee1a225c1ec9252a  node.tar.gz"
        | sha256sum -c -
      - tar xzf node.tar.gz --strip-components=1 -C /usr/local/
      - npm install --global pnpm@latest-10
    init:
      - cd ../..
      - export VITE_APP_NAME=OneSpend
      - export VITE_API_URL=https://onespend-back.dowar.xyz
      - export VITE_SSO_URL=https://auth.dowar.xyz/api
      - export VITE_SSO_FRONTEND_URL=https://auth-panel.dowar.xyz
      - export SSO_CLIENT_ID_NATIVE=onespend-android
      - pnpm install --frozen-lockfile
      - pnpm run build:native
      - npx cap sync android
    gradle:
      - yes
    scandelete:
      - front/node_modules

AllowedAPKSigningKeys: c6d2961a958ea23a36925ea818e0605b28c9f8e60f84f0432c7e68ee595fccce

