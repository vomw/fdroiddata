AutoName: Vetro
Summary: Minimal local-first media manager
Description: |
  Vetro is a minimal, privacy-focused media manager for tracking movies, TV shows, anime, and other content.

  The app follows a local-first approach and works fully offline without requiring an account.
  All user data is stored locally and remains under full user control.

  Originally created as an anime tracker, Vetro evolved into a flexible tool for managing different types of media libraries.

  Features:
  * Fully offline support
  * No mandatory accounts or tracking
  * Optional cloud sync
  * Clean architecture (MVI)
  * Reactive data layer (Flow + SQLDelight)
  * Advanced search (API-based and image recognition)

