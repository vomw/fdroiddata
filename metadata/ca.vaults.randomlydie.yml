Categories:
  - Dice
License: GPL-3.0-or-later
AuthorName: Tim Middleton
SourceCode: https://github.com/timtoo/randomlydie
IssueTracker: https://github.com/timtoo/randomlydie/issues
Changelog: https://github.com/timtoo/randomlydie/blob/main/CHANGELOG.md

RepoType: git
Repo: https://github.com/timtoo/randomlydie.git

Builds:
  - versionName: 6.1.0
    versionCode: 60100
    commit: v6.1.0
    subdir: android
    sudo:
      - apt-get update
      - apt-get install -y curl
      - "curl -fsSL https://nodejs.org/dist/v22.13.0/node-v22.13.0-linux-x64.tar.gz \
        -o /tmp/node.tar.gz"
      - tar -xzf /tmp/node.tar.gz -C /usr/local
      - ln -sf /usr/local/node-v22.13.0-linux-x64/bin/node /usr/local/bin/node
      - ln -sf /usr/local/node-v22.13.0-linux-x64/bin/npm /usr/local/bin/npm
      - npm install -g pnpm@11
      - ln -sf /usr/local/node-v22.13.0-linux-x64/bin/pnpm /usr/local/bin/pnpm
    init:
      - cd ..
      - pnpm install --frozen-lockfile
    gradle:
      - yes
    prebuild:
      - cd ..
      - CAPACITOR_BUILD=1 pnpm quasar build
      - pnpm exec cap sync android
