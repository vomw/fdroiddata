Builds:
  - versionName: 6.1.0
    versionCode: 60100
    commit: v6.1.0
    subdir: android
    sudo:
      - apt-get update
      - apt-get install -y nodejs npm
    init:
      - cd ..
      - npm install -g pnpm@11
      - pnpm install --frozen-lockfile
    gradle:
      - yes
    prebuild:
      - cd ..
      - CAPACITOR_BUILD=1 pnpm quasar build
      - pnpm exec cap sync android

