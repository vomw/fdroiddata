IssueTracker: https://github.com/timtoo/randomlydie/issues
Changelog: https://github.com/timtoo/randomlydie/blob/main/CHANGELOG.md

AutoName: Randomly/Die

RepoType: git
Repo: https://github.com/timtoo/randomlydie.git
Binaries: https://github.com/timtoo/randomlydie/releases/download/v%v/randomlydie-%v.apk

Builds:
  - versionName: 6.1.0
    versionCode: 60100
    commit: v6.1.0
    subdir: android
    sudo:
      - apt-get update
      - apt-get install -y curl
      - curl -fsSL https://nodejs.org/dist/v24.18.0/node-v24.18.0-linux-x64.tar.gz
        -o /tmp/node.tar.gz
      - tar -xzf /tmp/node.tar.gz -C /usr/local
      - ln -sf /usr/local/node-v24.18.0-linux-x64/bin/node /usr/local/bin/node
      - ln -sf /usr/local/node-v24.18.0-linux-x64/bin/npm /usr/local/bin/npm
      - npm install -g pnpm@11
      - ln -sf /usr/local/node-v24.18.0-linux-x64/bin/pnpm /usr/local/bin/pnpm
    init:
      - cd ..
      - pnpm install --frozen-lockfile
      - rm -rf node_modules/sass-embedded node_modules/.pnpm/sass-embedded*
      - rm -f node_modules/.pnpm/source-map@*/node_modules/source-map/lib/mappings.wasm
    gradle:
      - yes
    output: app/build/outputs/apk/release/app-release-unsigned.apk
    prebuild:
      - cd ..
      - CAPACITOR_BUILD=1 pnpm quasar build
      - pnpm exec cap sync android
      - rm -f node_modules/.pnpm/@capacitor+cli@*/node_modules/@capacitor/cli/assets/*.tar.gz

