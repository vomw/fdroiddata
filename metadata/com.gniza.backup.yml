AutoName: Gniza
Description: |-
  Gniza automatically backs up folders from your Android device to a remote
  server via SSH (rsync/SFTP) or Nextcloud (WebDAV). No root or Termux required.

  Features include incremental snapshot backups with hardlinks, file restore,
  scheduled backups, SSH key management, QR code server setup, and Material 3 UI.

