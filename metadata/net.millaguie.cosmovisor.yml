AutoName: Cosmovisor
Summary: Spot satellites overhead in augmented reality
Description: |-
    Point your phone at the sky and Cosmovisor overlays the satellites passing over
    you right now on the camera image, plus pass predictions, ham-radio tools and a
    star map.

    Features:

    * Augmented-reality overlay of the satellites currently above you.
    * Satellite list with filters: category, object type, country, orbit regime, radio band and above the horizon now.
    * 24-hour pass predictions grouped by day, with optional alerts.
    * Sky and astronomy: Sun, Moon and planets, Moon calendar, eclipses, a pannable planetarium, a Starlink-train finder and bright comets and asteroids.
    * Ham radio: live full-duplex Doppler, Maidenhead grid and mutual-visibility windows, rig and rotor control over TCP, ISS SSTV and APRS decoded from the microphone, RTL-SDR reception (NBFM, SSTV and NOAA APT weather imagery) and a QSO log with ADIF export.
    * Night mode (red theme) to preserve dark adaptation.

    Privacy-first: no accounts, no ads, no tracking. Your location is used only on the
    device and never leaves your phone. All orbital maths (SGP4/SDP4, Doppler, passes)
    runs on-device, so it works fully offline once the data is downloaded.

