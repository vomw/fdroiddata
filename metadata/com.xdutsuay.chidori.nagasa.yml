Builds:
  - versionName: 2.3.0
    versionCode: 20300000
    commit: bc3963a1bea9accc8dbc0c12f3cf0f8560b12e3a
    subdir: app
    submodules: true
    sudo:
      - apt-get update
      - apt-get install -y ninja-build
      - sdkmanager 'ndk;27.2.12479018' 'cmake;3.31.6'
    gradle:
      - yes
    rm:
      - gradle/gradle-daemon-jvm.properties
    prebuild:
      - echo 'ggmlVulkan=off' >> ../gradle.properties
      - sed -i -e 's/isEnable = true/isEnable = false/' build.gradle.kts
    scandelete:
      - app/src/main/cpp/llama.cpp/examples/gguf-hash/deps
    ndk: 27.2.12479018

AutoUpdateMode: Version
UpdateCheckMode: Tags ^v[0-9.]+$
UpdateCheckData: version.properties|versionCode=(\d+)|.|versionName=([\d.]+)
