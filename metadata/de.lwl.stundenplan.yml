AutoName: Barrierefreies WebUntis
Summary: Accessible school timetable for WebUntis - optimized for visually impaired students
Description: |-
  Barrierefreies WebUntis provides students and teachers with fast, accessible
  access to school schedules, substitution plans, and announcements via WebUntis.
  Developed at LWL-Berufskolleg Soest.

  Features:
  - Full TalkBack screen reader support with intuitive navigation
  - Quick overview of periods, subjects, rooms, and teacher substitutions
  - Clear indications of cancellations and timetable changes
  - Offline caching for quick access even with unstable internet connectivity
  - High-contrast visual modes

