Categories:
  - Science & Education
License: MIT
AuthorName: Mohit Vaidya
SourceCode: https://github.com/v-mv/qt-lab-flutter
IssueTracker: https://github.com/v-mv/qt-lab-flutter/issues

AutoName: QT Lab

RepoType: git
Repo: https://github.com/v-mv/qt-lab-flutter.git

Builds:
  - versionName: 1.0.1
    versionCode: 2
    commit: a8b0041b1a2ebb995cc36d97cbef60e9c68dc9ca
    output: build/app/outputs/flutter-apk/app-release.apk
    srclibs:
      - flutter@stable
    prebuild:
      - export flutterVersion=$(sed -n -E "s/.*revision:\ \"(.*)\"/\1/p" .metadata)
      - '[[ $flutterVersion ]]'
      - git -C $$flutter$$ checkout -f $flutterVersion
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get --enforce-lockfile
    scandelete:
      - .pub-cache
    build:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter build apk --release

AutoUpdateMode: Version
UpdateCheckMode: Tags
UpdateCheckData: pubspec.yaml|version:\s.+\+(\d+)|.|version:\s(.+)\+
CurrentVersion: 1.0.1
CurrentVersionCode: 2
