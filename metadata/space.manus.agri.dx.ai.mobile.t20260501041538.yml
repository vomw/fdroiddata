Name: 農業DX管理
AutoName: 農業DX管理
Summary: 圃場記録、作業指示、資材確認をスマートフォンで支援する農業DX管理ツール
Description: |-
  農業DX管理は、圃場作業、作物、農薬、肥料、納品書、天候、スタッフ稼働の記録をスマートフォンで扱うための農業DX支援アプリです。

  現場での作業記録、写真・位置情報を用いた圃場実測、関係者限定レポート、ntfyを想定した通知遅延監視、Google Play Servicesに依存しないローカル通知方針を重視しています。

  F-Droid版では、Firebase、Google Play Services、Crashlytics、FCMを必須機能として使わず、Android端末単体で使えるローカル記録とHTTPベースの通知確認を中心にします。クラウド同期や外部AI連携を使う場合も、利用者が明示的に設定したオープンな接続先を利用する設計にします。

RepoType: git
Repo: https://github.com/saratna/agri-dx-ai-mobile.git

Builds:
  - versionName: 1.0.0
    versionCode: 1
    commit: v1.0.0
    subdir: .
    sudo:
      - apt-get update
      - apt-get install -y --no-install-recommends nodejs npm openjdk-17-jdk
      - npm install -g corepack
    init:
      - corepack enable
      - corepack prepare pnpm@9.12.0 --activate
      - pnpm install --frozen-lockfile
    build:
      - bash scripts/prepare-fdroid-android.sh --skip-install
      - cd android
      - ./gradlew assembleRelease
    output: android/app/build/outputs/apk/release/app-release-unsigned.apk
    gradle:
      - yes

AutoUpdateMode: Version
UpdateCheckMode: Tags
CurrentVersion: 1.0.0
CurrentVersionCode: 1
