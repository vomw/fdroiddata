MaintainerNotes: |-
  WireGuard is built entirely from source (git submodules of wireguard-android,
  wireguard-tools and termux-elf-cleaner; wireguard-go via Go modules). During
  the native build, upstream's tunnel/tools/libwg-go/Makefile downloads a
  pinned Go toolchain from go.dev and verifies its SHA-256 before use.

  Builds are byte-for-byte reproducible (enforced by the upstream repo's CI on
  every tag); Binaries + AllowedAPKSigningKeys enable reproducible publishing
  of the developer-signed APK. App descriptions, icon, changelogs and
  screenshots come from fastlane metadata in the source repository.

  versionName and versionCode are intentionally the same single integer;
  release tags are v<versionCode>.

