    output: build/outputs/apk/release/XrayFA-universal-release-unsigned.apk
    srclibs:
      - go@go1.26.2
    prebuild:
      - sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - echo "1.26.2" > $$go$$/VERSION
      - curl -Lf https://go.dev/dl/go1.26.2.linux-amd64.tar.gz -o /tmp/go.tar.gz
      - rm -rf /tmp/go
      - mkdir -p /tmp/go
      - tar -C /tmp/go --strip-components=1 -xzf /tmp/go.tar.gz
    build:
      - export GOROOT="/tmp/go"
      - export GOPATH="$HOME/go"
      - export PATH="$GOROOT/bin:$GOPATH/bin:$PATH"
      - export GOFLAGS="-modcacherw -buildvcs=false -trimpath -ldflags=-buildid="
      - sudo ln -sf $GOROOT/bin/go /usr/bin/go
      - sudo ln -sf $GOROOT/bin/gofmt /usr/bin/gofmt
      - go install golang.org/x/mobile/cmd/gobind@latest
      - go install golang.org/x/mobile/cmd/gomobile@latest
      - sudo cp $GOPATH/bin/gomobile /usr/bin/
      - sudo cp $GOPATH/bin/gobind /usr/bin/
