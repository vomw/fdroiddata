Builds:
  - versionName: 1.4.6
    versionCode: 18
    commit: c2dd33500860a0c123dca2406cb64037ea2bfee3
    subdir: app
    submodules: true
    sudo:
      - apt-get update
      - apt-get install -y golang-go gcc libc-dev make
    gradle:
      - yes
    srclibs:
      - go@go1.24.4
    prebuild:
      - sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - export GO_VERSION=$(awk '/^go /{print $2}' ../AndroidLibXrayLite/go.mod)
      - git -C $$go$$ checkout -f go$GO_VERSION
      - sed -i -e '/dependsOn("copyXrayLib")/d' -e '/isEnable/d' build.gradle.kts
    build:
      - pushd $$go$$/src
      - ./make.bash
      - popd
      - export GOROOT="$$go$$"
      - export GOPATH="$HOME/gopath"
      - export PATH="$GOROOT/bin:$GOPATH/bin:$PATH"
      - export GOFLAGS="-modcacherw -buildvcs=false"
      - go install golang.org/x/mobile/cmd/gomobile@latest
      - go install golang.org/x/mobile/cmd/gobind@latest
      - gradle copyXrayLib
    ndk: 27.0.12077973

AllowedAPKSigningKeys: f62d348b1ea01b9b286326a6db58807df2315b3a04fc71291a3b97c9cc907381

AutoUpdateMode: Version
