Categories:
  - Internet
  - Navigation
License: Apache-2.0
AuthorName: Aditya Halder
WebSite: https://github.com/Fenirok/Earthquake_app
SourceCode: https://github.com/Fenirok/Earthquake_app
IssueTracker: https://github.com/Fenirok/Earthquake_app/issues

AutoName: QuakeTrace

RepoType: git
Repo: https://github.com/Fenirok/Earthquake_app.git

Builds:
  - versionName: 1.0.0
    versionCode: 1
    commit: 1.0.0
    subdir: android
    output: build/app/outputs/flutter-apk/app-release.apk
    srclibs:
      - flutter@stable
    rm:
      - ios
      - linux
      - macos
      - web
      - windows
      - test
    prebuild:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get
    scanignore:
      - android/.pub-cache/hosted/pub.dev/**/test/**
      - android/.pub-cache/hosted/pub.dev/**/example/**
      - android/.pub-cache/hosted/pub.dev/**/extension/**
      - android/.pub-cache/hosted/pub.dev/**/web/**
    build:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter build apk --release --split-per-abi --target-platform=android-arm64

AutoUpdateMode: Version
UpdateCheckMode: Tags
UpdateCheckData: pubspec.yaml|version:\s.+\+(\d+)|.|version:\s(.+)\+
CurrentVersion: 1.0.0
CurrentVersionCode: 1
