AntiFeatures:
  NonFreeNet:
    en-US: Uses the PLLABS backend, which is not included in the released client
      source, and may load organizer-selected SoundCloud content.
    es: Usa el backend de PLLABS, no incluido en las fuentes publicadas del 
      cliente, y puede cargar contenido de SoundCloud elegido por el 
      organizador.
  TetheredNet:
    en-US: The production client is tied to the PLLABS server; selecting another
      server requires changing the source.
    es: El cliente de producción depende del servidor de PLLABS; elegir otro 
      servidor requiere cambiar el código.
