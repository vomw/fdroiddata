  https://codeberg.org/gameoftrees/gotweb_authenticator/releases/download/%v/app-release.apk

Builds:
  - versionName: 0.2.0
    versionCode: 2
    commit: 871d94c3cdc0b0edd78e8c835c0e7032f20cdef4
    sudo:
      - mkdir -p /home/jtt/
      - chown -R vagrant /home/jtt
    output: build/app/outputs/flutter-apk/app-release.apk
    srclibs:
      - flutter@stable
    rm:
      - ios
      - linux
      - macos
      - web
      - windows
    prebuild:
      - flutterVersion=$(sed -n -E 's/^\s+flutter:\s*([0-9.]+)/\1/p' pubspec.yaml)
      - '[[ $flutterVersion ]]'
      - git -C $$flutter$$ checkout -f $flutterVersion
      - export repo=/home/jtt/gotweb_authenticator
      - cd ..
      - mv org.gameoftrees.gotweb_authenticator $repo
      - pushd $repo
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get --enforce-lockfile
      - popd
      - mv $repo org.gameoftrees.gotweb_authenticator
    scandelete:
      - .pub-cache
    build:
      - export repo=/home/jtt/gotweb_authenticator
      - cd ..
      - mv org.gameoftrees.gotweb_authenticator $repo
      - pushd $repo
      - export PUB_CACHE=$(pwd)/.pub-cache
      - sed -i -e 's/-Wl,/-Wl,--build-id=none,/' $PUB_CACHE/hosted/*/jni-*/src/CMakeLists.txt
      - $$flutter$$/bin/flutter build apk --release
      - popd
      - mv $repo org.gameoftrees.gotweb_authenticator

