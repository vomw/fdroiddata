Builds:
  - versionName: 2.0.2.0
    versionCode: 17
    commit: ff7c277920cc7e1bc61fbbbc489db4f4fdb88438
    subdir: app
    gradle:
      - yes
    srclibs:
      - NewPipeExtractor@v0.26.0
    prebuild:
      - sed -i 's|maven { url = uri("https://maven-central.storage-download.googleapis.com/maven2/")
        }|mavenCentral()|g' ../settings.gradle.kts
      - sed -i '/^dependencyResolutionManagement/i\includeBuild("$$NewPipeExtractor$$")
        { dependencySubstitution { 
        substitute(module("com.github.TeamNewPipe:NewPipeExtractor")).using(project(":extractor"))
        } }' ../settings.gradle.kts
      - find $$NewPipeExtractor$$ -name '*.gradle' -o -name '*.gradle.kts' | xargs
        sed -i 
        's/languageVersion.set(JavaLanguageVersion.of(11))/languageVersion.set(JavaLanguageVersion.of(21))/g;s/JavaLanguageVersion.of(11)/JavaLanguageVersion.of(21)/g'

