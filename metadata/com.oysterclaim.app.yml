AntiFeatures:
  - NonFreeNet
Categories:
  - Money
License: GPL-3.0-only
AuthorName: Oysterclaim
WebSite: https://oysterclaim.com
SourceCode: https://github.com/Oysterclaim/oysterclaim
IssueTracker: https://github.com/Oysterclaim/oysterclaim/issues
Changelog: https://github.com/Oysterclaim/oysterclaim/releases
Donate: https://oysterclaim.com/support

AutoName: OysterClaim
Summary: Class action settlements � browse, file, track payouts
Description: |
  OysterClaim helps you browse open class action settlements (U.S. and Canada),
  queue claims, and open official administrator filing pages with your details
  pre-filled where supported.

  This build is GPL-3.0-only, without proprietary analytics SDKs, without Expo
  OTA updates, and without bundled cloud telemetry. Network use (settlement
  sites, optional oysterclaim.com links) is documented in upstream
  ANTI-FEATURES.md.

RepoType: git
Repo: https://github.com/Oysterclaim/oysterclaim

Builds:
  - versionName: 1.0.7
    versionCode: 96
    commit: v1.0.7
    timeout: 10800
    subdir: apps/mobile/android
    sudo:
      - sysctl fs.inotify.max_user_watches=524288 || true
      - apt-get update
      - apt-get install -y curl ca-certificates openjdk-21-jdk-headless
      - update-alternatives --auto java
      - curl -fsSL -o node.tar.gz
        https://nodejs.org/dist/v20.19.4/node-v20.19.4-linux-x64.tar.gz
      - echo "d80a33707605ced9a31b8f543cea9ab512bc3d2fef2c148f31a50e939ff07560
        node.tar.gz" | sha256sum -c -
      - tar xzf node.tar.gz --strip-components=1 -C /usr/local/
    gradle:
      - fdroid
    output: app/build/outputs/apk/fdroid/release/app-fdroid-release-unsigned.apk
    prebuild:
      - cd ../../..
      - export EXPO_PUBLIC_BUILD_CHANNEL=fdroid
      - export OYSTER_POSTINSTALL_MODE=fdroid
      - export NODE_OPTIONS=--max-old-space-size=4096
      - npm ci
      - find node_modules/@react-native/gradle-plugin -name 'build.gradle.kts'
        -exec sed -i 's/jvmToolchain(17)/jvmToolchain(21)/' {} +
      - sed -i -e 's/VERSION_17/VERSION_21/g' -e
        's/jvmToolchain(17)/jvmToolchain(21)/g'
        node_modules/@react-native/gradle-plugin/react-native-gradle-plugin/src/main/kotlin/com/facebook/react/utils/JdkConfiguratorUtils.kt
      - sed -i
        's/reactNativeArchitectures=.*/reactNativeArchitectures=armeabi-v7a,arm64-v8a/'
        apps/mobile/android/gradle.properties
      - sed -i 's/org.gradle.jvmargs=.*/org.gradle.jvmargs=-Xmx4g
        -XX:MaxMetaspaceSize=1024m/' apps/mobile/android/gradle.properties
      - sed -i 's/org.gradle.parallel=true/org.gradle.parallel=false/'
        apps/mobile/android/gradle.properties
      - sed -i 's/applicationId "com.oysterclaim.app.fdroid"/applicationId
        "com.oysterclaim.app"/' apps/mobile/android/app/build.gradle
      - cd apps/mobile/android
    scanignore:
      - node_modules/react-native/sdks/hermesc/linux64-bin/hermesc
      - node_modules/expo-asset/local-maven-repo
      - node_modules/expo-crypto/local-maven-repo
      - node_modules/expo-secure-store/local-maven-repo
      - node_modules/expo-file-system/local-maven-repo
      - node_modules/expo/node_modules/expo-font/local-maven-repo
      - node_modules/expo/node_modules/expo-keep-awake/local-maven-repo
      - node_modules/expo-modules-core/android/ExpoModulesCorePlugin.gradle
      - node_modules/expo-modules-autolinking/scripts/android/autolinking_implementation.gradle
      - node_modules/@react-native-async-storage/async-storage/android/build.gradle
      - node_modules/react-native-get-random-values/android/build.gradle
      - node_modules/react-native-safe-area-context/android/build.gradle
      - node_modules/react-native-screens/android/build.gradle
      - node_modules/react-native-svg/android/build.gradle
      - node_modules/react-native-webview/android/build.gradle
      - node_modules/react-native/ReactAndroid/publish.gradle
      - .tmp
      - .expo-web-test
      - scripts/android/runtime-jar-patches
    scandelete:
      - node_modules
    build: export EXPO_PUBLIC_BUILD_CHANNEL=fdroid
    gradleprops:
      - claimlyUnsignedRelease=true
      - reactNativeArchitectures=armeabi-v7a,arm64-v8a
      - org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1024m
        -Dfile.encoding=UTF-8
      - org.gradle.caching=false

MaintainerNotes: |-
  React Native / Expo SDK 54. Committed apps/mobile/android/ (no expo prebuild on builders).
  prebuild rewrites fdroid applicationId to com.oysterclaim.app to match this metadata id.
  Play Store uses com.anonymous.claimlynative (play flavor). Kotlin namespace remains
  com.anonymous.claimlynative. Reproducible builds: npm ci + pinned Node 20.19.4,
  pinned ABIs, dependenciesInfo disabled, org.gradle.caching=false. Store text:
  fastlane/metadata/android/en-US/; screenshots in fdroid/store-assets/en-US/ via
  scripts/prepare-fdroiddata-mr.py.

AutoUpdateMode: Version
UpdateCheckMode: Tags ^v[\d.]+$
UpdateCheckData: apps/mobile/android/app/build.gradle|versionCode\s+(\d+)|.|versionName\s+"([^"]+)"
CurrentVersion: 1.0.7
CurrentVersionCode: 96
