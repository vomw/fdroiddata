AntiFeatures:
  - NonFreeNet
Categories:
  - Finance Manager
License: GPL-3.0-only
AuthorName: Oysterclaim
WebSite: https://oysterclaim.com
SourceCode: https://github.com/Oysterclaim/oysterclaim
IssueTracker: https://github.com/Oysterclaim/oysterclaim/issues
Changelog: https://github.com/Oysterclaim/oysterclaim/releases
Donate: https://oysterclaim.com/support

AutoName: OysterClaim

RepoType: git
Repo: https://github.com/Oysterclaim/oysterclaim

Builds:
  - versionName: 1.0.7
    versionCode: 96
    commit: 4434b0943f9a55e3f52794e9332769811bc49e9d
    timeout: 10800
    subdir: apps/mobile/android
    sudo:
      - sysctl fs.inotify.max_user_watches=524288 || true
      - apt-get update
      - apt-get install -y curl ca-certificates openjdk-21-jdk-headless
      - update-alternatives --auto java
      - curl -fsSL -o node.tar.gz https://nodejs.org/dist/v20.19.4/node-v20.19.4-linux-x64.tar.gz
      - echo "d80a33707605ced9a31b8f543cea9ab512bc3d2fef2c148f31a50e939ff07560 node.tar.gz"
        | sha256sum -c -
      - tar xzf node.tar.gz --strip-components=1 -C /usr/local/
    init:
      - cd ../../..
      - export HUSKY=0 OYSTER_POSTINSTALL_MODE=fdroid EXPO_PUBLIC_BUILD_CHANNEL=fdroid
      - npm ci
    gradle:
      - fdroid
    prebuild:
      - cd ../../..
      - export EXPO_PUBLIC_BUILD_CHANNEL=fdroid
      - chmod +x scripts/fdroid-reproducible-prebuild.sh
      - ./scripts/fdroid-reproducible-prebuild.sh
      - cd apps/mobile/android
    scanignore:
      - node_modules/react-native/sdks/hermesc/linux64-bin/hermesc
      - node_modules/expo-asset/local-maven-repo
      - node_modules/expo-crypto/local-maven-repo
      - node_modules/expo-secure-store/local-maven-repo
      - node_modules/expo-file-system/local-maven-repo
      - node_modules/expo/node_modules/expo-font/local-maven-repo
      - node_modules/expo/node_modules/expo-keep-awake/local-maven-repo
      - node_modules/expo-modules-core/android/ExpoModulesCorePlugin.gradle
      - node_modules/expo-modules-autolinking/scripts/android/autolinking_implementation.gradle
      - node_modules/@react-native-async-storage/async-storage/android/build.gradle
      - node_modules/react-native-get-random-values/android/build.gradle
      - node_modules/react-native-safe-area-context/android/build.gradle
      - node_modules/react-native-screens/android/build.gradle
      - node_modules/react-native-svg/android/build.gradle
      - node_modules/react-native-webview/android/build.gradle
      - node_modules/react-native/ReactAndroid/publish.gradle
      - .tmp
      - .expo-web-test
      - scripts/android/runtime-jar-patches
    scandelete:
      - node_modules
    build: export EXPO_PUBLIC_BUILD_CHANNEL=fdroid
    gradleprops:
      - claimlyUnsignedRelease=true
      - reactNativeArchitectures=armeabi-v7a,arm64-v8a
      - org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8
      - org.gradle.caching=false

MaintainerNotes: |-
  React Native / Expo SDK 54. Follows fdroiddata templates/build-react-native.yml:
  init runs npm ci; prebuild runs scripts/fdroid-reproducible-prebuild.sh (JDK 21 sed,
  ABI pin, applicationId rewrite). Committed apps/mobile/android/ (no expo prebuild).
  Play Store uses com.anonymous.claimlynative (play flavor). See fdroid/REPRODUCIBLE_BUILDS.md.

AutoUpdateMode: Version
UpdateCheckMode: Tags ^v[\d.]+$
UpdateCheckData: 
  apps/mobile/android/app/build.gradle|versionCode\s+(\d+)|.|versionName\s+"([^"]+)"
CurrentVersion: 1.0.7
CurrentVersionCode: 96
