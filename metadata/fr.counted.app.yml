WebSite: https://counted.fr
SourceCode: https://github.com/counted-labs/counted
IssueTracker: https://github.com/counted-labs/counted/issues

AutoName: Counted

RepoType: git
Repo: https://github.com/counted-labs/counted.git
Binaries: 
  https://github.com/counted-labs/counted/releases/download/mobile-v%v/Counted-%c.apk

Builds:
  - versionName: 3.2.3
    versionCode: 3002003
    commit: cd2e5f197a3b2fd09cf2bbef30b5cbf0c8ca3ed3
    sudo:
      - apt-get update
      - apt-get install -y make gcc g++ libc-dev pkg-config libssl-dev openjdk-21-jdk-headless
    output: Counted-unsigned.apk
    srclibs:
      - rustup@1.29.1
    prebuild:
      - $$rustup$$/rustup-init.sh -y --profile minimal --default-toolchain 1.98.1
        --target aarch64-linux-android
      - source $HOME/.cargo/env
      - cargo install dioxus-cli --version 0.7.10 --locked
    build:
      - export JAVA_HOME=/usr/lib/jvm/java-21-openjdk-amd64 ANDROID_NDK_HOME=$$NDK$$
      - source $HOME/.cargo/env
      - cargo fetch --locked
      - make -f packages/mobile/android.mk android-fdroid-apk
    ndk: 25.2.9519653

AllowedAPKSigningKeys: d8d4026f496f3c2154f138e81710332ea5288aaab8567a2f8d0e713de1d593e8

AutoUpdateMode: Version
UpdateCheckMode: Tags ^mobile-v
UpdateCheckData: packages/mobile/Cargo.toml|version_code = (\d+)|.|version = "(\d+\.\d+\.\d+)"
