  - Time

License: GPL-3.0-or-later

WebSite: https://github.com/RealNoitasinagro/epoch
SourceCode: https://github.com/RealNoitasinagro/epoch
IssueTracker: https://github.com/RealNoitasinagro/epoch/issues

AutoName: Epoch

Summary: Time display for nerds — Unix, sidereal, binary clocks & more

Description: |-
  Epoch displays the current moment across a wide range of time
  systems — updating every second, all in one place.

  Time systems included:
  * Civil: date, time, day second, day percent — for any timezone
  * Technical: Unix time, TAI, GPS time
  * Astronomical: GMST, Julian Date, Modified Julian Date
  * Curiosities: Swatch Internet Time, binary clocks, Doomsday Clock

  Fully configurable Watchlist tab — combine any values in any order.
  Night mode with red-on-black display for stargazing.
  No ads, no tracking, no network requests, no permissions required.
  Available in English and German.

RepoType: git
Repo: https://github.com/RealNoitasinagro/epoch

Builds:
  - versionName: 1.0.0
    versionCode: 1
    commit: v1.0.0
    submodules: false
    output: build/app/outputs/flutter-apk/app-release.apk
    srclibs:
      - flutter@stable
    rm:
      - ios
      - linux
      - macos
      - web
      - windows
    prebuild:
      - flutterVersion=$(sed -n -E "s/.*flutter-version:\ '(.*)'/\1/p" .github/workflows/release.yml)
      - '[[ $flutterVersion ]]'
      - git -C $$flutter$$ checkout -f $flutterVersion
      - export PUB_CACHE=$(pwd)/.pub-cache
      - .flutter/bin/flutter config --no-analytics
      - .flutter/bin/flutter pub get
    scanignore:
      - .flutter/bin/cache
    scandelete:
      - .flutter
      - .pub-cache
    build:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - .flutter/bin/flutter build apk --release --split-per-abi --target-platform="android-arm64"

AutoUpdateMode: None
UpdateCheckMode: None
