Categories:
  - Multimedia
License: GPL-3.0-or-later
AuthorName: Danilo Migliarino
SourceCode: https://github.com/danmigdev/bosun-midi-captain
IssueTracker: https://github.com/danmigdev/bosun-midi-captain/issues

AutoName: Bosun
Description: |
  Bosun is an editor and live Stage display for the 10-switch PaintAudio MIDI
  Captain running Bosun firmware. Configure footswitches, banks and rigs,
  and view Kemper Player rig names, effects and tuner feedback on Android.
  Connect directly over USB-OTG, or through a Raspberry Pi over the local
  network or its Wi-Fi hotspot. Native profiles support Kemper Player and
  generic MIDI devices.

RepoType: git
Repo: https://github.com/danmigdev/bosun-midi-captain
Binaries: https://github.com/danmigdev/bosun-midi-captain/releases/download/v%v/bosun.apk

Builds:
  - versionName: 0.6.5
    versionCode: 33
    commit: v0.6.5
    subdir: editor/src-tauri/gen/android
    sudo:
      - apt-get update
      - apt-get install -y build-essential gcc-13 g++-13 xz-utils
      - curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | HOME=/home/vagrant
        sh -s -- -y --profile minimal --default-toolchain 1.97.1
      - curl -fL -o /tmp/node.tar.xz https://nodejs.org/dist/v22.23.2/node-v22.23.2-linux-x64.tar.xz
        && mkdir -p /home/vagrant/node-v22.23.2-linux-x64 && tar -xJf /tmp/node.tar.xz
        -C /home/vagrant/node-v22.23.2-linux-x64 --strip-components=1 && rm /tmp/node.tar.xz
      - chown -R vagrant:vagrant /home/vagrant/.cargo /home/vagrant/.rustup /home/vagrant/node-v22.23.2-linux-x64
      - HOME=/home/vagrant /home/vagrant/.cargo/bin/rustup target add aarch64-linux-android
        armv7-linux-androideabi i686-linux-android x86_64-linux-android
    init:
      - export PATH="/home/vagrant/node-v22.23.2-linux-x64/bin:$HOME/.cargo/bin:$PATH"
      - export CC=gcc-13
      - export CXX=g++-13
      - export RUSTFLAGS="--remap-path-prefix=$HOME=/build"
      - export 
        CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$$NDK$$/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android29-clang
      - export 
        CARGO_TARGET_ARMV7_LINUX_ANDROIDEABI_LINKER=$$NDK$$/toolchains/llvm/prebuilt/linux-x86_64/bin/armv7a-linux-androideabi29-clang
      - export 
        CARGO_TARGET_I686_LINUX_ANDROID_LINKER=$$NDK$$/toolchains/llvm/prebuilt/linux-x86_64/bin/i686-linux-android29-clang
      - export 
        CARGO_TARGET_X86_64_LINUX_ANDROID_LINKER=$$NDK$$/toolchains/llvm/prebuilt/linux-x86_64/bin/x86_64-linux-android29-clang
      - export TAURI_ANDROID_PROJECT_PATH="$(pwd)"
      - export TAURI_ANDROID_PACKAGE_UNESCAPED="com.bosun.app"
      - mkdir -p app/src/main/java/com/bosun/app/generated
      - export 
        WRY_ANDROID_KOTLIN_FILES_OUT_DIR="$(pwd)/app/src/main/java/com/bosun/app/generated"
      - export WRY_ANDROID_PACKAGE="com.bosun.app"
      - export WRY_ANDROID_LIBRARY="bosun_editor_lib"
      - export CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_LINKER=gcc-13
      - cd ../../../.. && mkdir -p editor/src-tauri/resources/lib editor/src-tauri/resources/update
      - curl -fL -o editor/src-tauri/resources/circuitpython.uf2 
        https://downloads.circuitpython.org/bin/raspberry_pi_pico/en_US/adafruit-circuitpython-raspberry_pi_pico-en_US-9.2.7.uf2
      - python3 tools/provision_adafruit_bundle.py --destination editor/src-tauri/resources/lib
      - python3 tools/sync_firmware_resources.py --repo-root .
      - python3 -c 'import json,pathlib; p=pathlib.Path("editor/src-tauri/tauri.conf.json");
        c=json.loads(p.read_text()); c["bundle"]["android"]["versionCode"]=33; p.write_text(json.dumps(c,indent=2)+"\n")'
      - cd editor && npm ci --no-audit --no-fund && npm run build
      - cd src-tauri && cargo build --locked --release --target aarch64-linux-android
        --lib && cargo build --locked --release --target armv7-linux-androideabi --lib
        && cargo build --locked --release --target i686-linux-android --lib && cargo
        build --locked --release --target x86_64-linux-android --lib && cd ..
      - mkdir -p src-tauri/gen/android/app/src/main/jniLibs/arm64-v8a src-tauri/gen/android/app/src/main/jniLibs/armeabi-v7a
        src-tauri/gen/android/app/src/main/jniLibs/x86 src-tauri/gen/android/app/src/main/jniLibs/x86_64
      - cp src-tauri/target/aarch64-linux-android/release/libbosun_editor_lib.so src-tauri/gen/android/app/src/main/jniLibs/arm64-v8a/
      - cp src-tauri/target/armv7-linux-androideabi/release/libbosun_editor_lib.so
        src-tauri/gen/android/app/src/main/jniLibs/armeabi-v7a/
      - cp src-tauri/target/i686-linux-android/release/libbosun_editor_lib.so src-tauri/gen/android/app/src/main/jniLibs/x86/
      - cp src-tauri/target/x86_64-linux-android/release/libbosun_editor_lib.so src-tauri/gen/android/app/src/main/jniLibs/x86_64/
      - mkdir -p src-tauri/gen/android/app/src/main/assets
      - "printf '%s' '{\"$schema\":\"https://schema.tauri.app/config/2\",\"productName\"\
        :\"Bosun\",\"version\":\"0.6.5\",\"identifier\":\"com.bosun.app\",\"app\"\
        :{\"windows\":[{\"label\":\"main\",\"create\":true,\"url\":\"index.html\"\
        ,\"dragDropEnabled\":true,\"center\":false,\"width\":1100.0,\"height\":720.0,\"\
        minWidth\":800.0,\"minHeight\":600.0,\"resizable\":true,\"maximizable\":true,\"\
        minimizable\":true,\"closable\":true,\"title\":\"Bosun\",\"fullscreen\":false,\"\
        focus\":true,\"focusable\":true,\"transparent\":false,\"maximized\":false,\"\
        visible\":true,\"decorations\":true,\"alwaysOnBottom\":false,\"alwaysOnTop\"\
        :false,\"visibleOnAllWorkspaces\":false,\"contentProtected\":false,\"skipTaskbar\"\
        :false,\"titleBarStyle\":\"Visible\",\"hiddenTitle\":false,\"acceptFirstMouse\"\
        :false,\"shadow\":true,\"incognito\":false,\"zoomHotkeysEnabled\":false,\"\
        browserExtensionsEnabled\":false,\"useHttpsScheme\":false,\"javascriptDisabled\"\
        :false,\"allowLinkPreview\":true,\"disableInputAccessoryView\":false,\"scrollBarStyle\"\
        :\"default\",\"generalAutofillEnabled\":true}],\"security\":{\"csp\":\"default-src
        '\"'\"'self'\"'\"'; connect-src '\"'\"'self'\"'\"' ipc: http://ipc.localhost
        http://localhost:1420 ws://localhost:1420 https://api.github.com; img-src
        '\"'\"'self'\"'\"' asset: http://asset.localhost data:; style-src '\"'\"'self'\"\
        '\"' '\"'\"'unsafe-inline'\"'\"'; script-src '\"'\"'self'\"'\"'\",\"freezePrototype\"\
        :false,\"dangerousDisableAssetCspModification\":false,\"assetProtocol\":{\"\
        scope\":[],\"enable\":false},\"pattern\":{\"use\":\"brownfield\"},\"capabilities\"\
        :[]},\"macOSPrivateApi\":false,\"withGlobalTauri\":false,\"enableGTKAppId\"\
        :false},\"build\":{\"devUrl\":\"http://localhost:1420/\",\"frontendDist\"\
        :\"../dist\",\"beforeDevCommand\":\"npm run dev\",\"beforeBuildCommand\":\"\
        npm run build\",\"removeUnusedCommands\":false,\"additionalWatchFolders\"\
        :[]},\"bundle\":{\"active\":true,\"targets\":[],\"createUpdaterArtifacts\"\
        :false,\"icon\":[\"icons/32x32.png\",\"icons/128x128.png\",\"icons/icon.icns\"\
        ,\"icons/icon.ico\"],\"resources\":{\"vendor/picotool/LICENSE.TXT\":\"licenses/picotool.txt\"\
        ,\"resources/firmware\":\"firmware\",\"resources/lib\":\"lib\",\"resources/circuitpython.uf2\"\
        :\"circuitpython.uf2\",\"resources/update\":\"update\"},\"shortDescription\"\
        :\"Editor for PaintAudio MIDI Captain controllers running Bosun firmware.\"\
        ,\"longDescription\":\"Desktop editor for PaintAudio MIDI Captain controllers
        running Bosun firmware, with a plugin system for any MIDI target device (Kemper
        Player, Hotone Ampero II Stage, Line 6 Helix, generic MIDI, and more).\",\"\
        useLocalToolsDir\":false,\"windows\":{\"digestAlgorithm\":null,\"certificateThumbprint\"\
        :null,\"timestampUrl\":null,\"tsp\":false,\"webviewInstallMode\":{\"type\"\
        :\"downloadBootstrapper\",\"silent\":true},\"allowDowngrades\":true,\"minimumWebview2Version\"\
        :null,\"wix\":null,\"nsis\":null,\"signCommand\":null},\"linux\":{\"appimage\"\
        :{\"bundleMediaFramework\":false,\"files\":{}},\"deb\":{\"files\":{}},\"rpm\"\
        :{\"release\":\"1\",\"epoch\":0,\"files\":{}}},\"macOS\":{\"files\":{},\"\
        minimumSystemVersion\":\"10.13\",\"hardenedRuntime\":true,\"dmg\":{\"windowSize\"\
        :{\"width\":660,\"height\":400},\"appPosition\":{\"x\":180,\"y\":170},\"applicationFolderPosition\"\
        :{\"x\":480,\"y\":170}}},\"iOS\":{\"minimumSystemVersion\":\"14.0\"},\"android\"\
        :{\"minSdkVersion\":29,\"versionCode\":33,\"autoIncrementVersionCode\":false}},\"\
        plugins\":{}}' > src-tauri/gen/android/app/src/main/assets/tauri.conf.json"
      - cp src-tauri/resources/circuitpython.uf2 src-tauri/gen/android/app/src/main/assets/circuitpython.uf2
      - cp -r src-tauri/resources/firmware src-tauri/gen/android/app/src/main/assets/firmware
      - cp -r src-tauri/resources/lib src-tauri/resources/update src-tauri/gen/android/app/src/main/assets/
      - mkdir -p src-tauri/gen/android/app/src/main/assets/licenses && cp src-tauri/vendor/picotool/LICENSE.TXT
        src-tauri/gen/android/app/src/main/assets/licenses/picotool.txt
      - printf '// THIS IS AN AUTOGENERATED FILE. DO NOT EDIT THIS FILE DIRECTLY.\ntauri.android.versionName=0.6.5\ntauri.android.versionCode=%s\n'
        "$(cat src-tauri/android-version-code.txt)" > src-tauri/gen/android/app/tauri.properties
      - printf '\ntasks.matching { it.name.startsWith("rustBuild") }.configureEach
        { enabled = false }\n' >> src-tauri/gen/android/app/build.gradle.kts
    gradle:
      - yes
    output: app/build/outputs/apk/universal/release/app-universal-release-unsigned.apk
    scanignore:
      - editor/src-tauri/gen/android/app/src/main/jniLibs/arm64-v8a/libbosun_editor_lib.so
      - editor/src-tauri/gen/android/app/src/main/jniLibs/armeabi-v7a/libbosun_editor_lib.so
