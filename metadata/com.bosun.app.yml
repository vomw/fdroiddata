AutoName: Bosun
Summary: Editor and Stage view for PaintAudio MIDI Captain foot controllers
Description: |
  Bosun is an editor and live "Stage" companion for the PaintAudio MIDI
  Captain foot controller running Bosun firmware. Configure switches,
  bindings and screen layout, and mirror the pedal's live state on a
  phone or tablet at a gig - connects directly over USB-OTG, no computer
  needed. Plugin system supports Kemper Player, Hotone Ampero II Stage,
  Line 6 Helix, and generic MIDI devices.

RepoType: git
Repo: https://github.com/danmigdev/bosun-midi-captain
Binaries: https://github.com/danmigdev/bosun-midi-captain/releases/download/v%v/bosun.apk

Builds:
  - versionName: 0.6.0
    versionCode: 29
    commit: v0.6.0
    subdir: editor/src-tauri/gen/android
    sudo:
      - apt-get update
      - apt-get install -y nodejs npm build-essential
      - curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | HOME=/home/vagrant
        sh -s -- -y
      - chown -R vagrant:vagrant /home/vagrant/.cargo /home/vagrant/.rustup
      - HOME=/home/vagrant /home/vagrant/.cargo/bin/rustup target add aarch64-linux-android
    init:
      - export PATH="$HOME/.cargo/bin:$PATH"
      - export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$$NDK$$/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android21-clang
      - cd ../../../.. && mkdir -p editor/src-tauri/resources/firmware editor/src-tauri/resources/lib
        && cp -r firmware editor/src-tauri/resources/firmware && find editor/src-tauri/resources/firmware
        -name __pycache__ -type d -prune -exec rm -rf {} + 2>/dev/null; curl -fL -o
        editor/src-tauri/resources/circuitpython.uf2 https://downloads.circuitpython.org/bin/raspberry_pi_pico/en_US/adafruit-circuitpython-raspberry_pi_pico-en_US-9.2.7.uf2
      - cd editor && npm ci && npm run build
      - cd src-tauri && cargo build --release --target aarch64-linux-android && cd
        ..
      - mkdir -p src-tauri/gen/android/app/src/main/jniLibs/arm64-v8a
      - cp src-tauri/target/aarch64-linux-android/release/libbosun_editor_lib.so src-tauri/gen/android/app/src/main/jniLibs/arm64-v8a/
    gradle:
      - yes
    output: app/build/outputs/apk/arm64/release/app-arm64-release-unsigned.apk
    scanignore:
      - editor/src-tauri/gen/android/app/src/main/jniLibs/arm64-v8a/libbosun_editor_lib.so
    scandelete:
      - editor/src-tauri/target
      - editor/node_modules
    ndk: 30.0.14904198

