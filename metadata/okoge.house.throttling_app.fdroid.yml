Builds:
  - versionName: 1.0.0
    versionCode: 21
    commit: bb0da2e3b4733f89e3e58e9abef382487cdcf531
    subdir: app
    sudo:
      - apt-get update
      - apt-get install -y golang-go gcc libc-dev
    gradle:
      - fdroid
    output: build/outputs/apk/fdroid/release/*-x86-*.apk
    srclibs:
      - go@go1.25.9
    build:
      - export GOROOT_BOOTSTRAP=$(go env GOROOT)
      - pushd $$go$$/src
      - ./make.bash
      - popd
      - export PATH="$$go$$/bin:$PATH"
      - export GOPATH="$PWD/.gopath"
      - export PATH="$GOPATH/bin:$PATH"
      - export GOFLAGS="-buildvcs=false"
      - sdkmanager 'platforms;android-26'
      - go install golang.org/x/mobile/cmd/gomobile@latest
      - gomobile init
      - mkdir -p libs
      - cd ../go/tun2sockslib
      - go mod download all
      - gomobile bind -target=android -androidapi 26 -o ../../app/libs/tun2socks.aar
        .
    ndk: 29.0.14206865

