Categories:
  - Casual Game
License: GPL-3.0-only
SourceCode: https://github.com/tristan-reig/Peace-Break
IssueTracker: https://github.com/tristan-reig/Peace-Break/issues

AutoName: Peace Break

RepoType: git
Repo: https://github.com/tristan-reig/Peace-Break.git

Builds:
  - versionName: 1.0.0
    versionCode: 1
    commit: v1.0.0
    output: build/app/outputs/flutter-apk/app-release.apk
    srclibs:
      - flutter@stable
    prebuild:
      - flutterVersion=$(sed -n -E "s/^\s+flutter:\s*([0-9.]+)/\1/p" pubspec.yaml)
      - '[[ $flutterVersion ]] || exit 1'
      - git -C $$flutter$$ checkout -f $flutterVersion
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get
    scandelete:
      - .pub-cache
    build:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter build apk --release

AutoUpdateMode: Version
UpdateCheckMode: Tags
VercodeOperation:
  - '%c'
CurrentVersion: 1.0.0
CurrentVersionCode: 1
