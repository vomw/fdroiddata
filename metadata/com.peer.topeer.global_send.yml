Builds:
  - versionName: 0.2.0
    versionCode: 11000
    commit: ee0e09d5b029909bfa4f370f3aea9197ee35da2e
    submodules: true
    sudo:
      - apt-get update
      - apt-get install -y gcc libc-dev rustup
    output: build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
    rm:
      - ios
      - macos
      - linux
      - windows
    prebuild:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - .flutter/bin/flutter config --no-analytics
      - .flutter/bin/flutter pub get
    scanignore:
      - .flutter/bin/cache
    scandelete:
      - .pub-cache
      - .flutter
    build:
      - rustup default 1.95.0
      - cargo run -p rinf_cli gen
      - export PUB_CACHE=$(pwd)/.pub-cache
      - .flutter/bin/flutter build apk --split-per-abi --target-platform="android-arm"
        --build-number $(($$VERCODE$$/10000*10000)) --build-name=$$VERSION$$

