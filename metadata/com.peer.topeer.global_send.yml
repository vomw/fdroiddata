Builds:
  - versionName: 0.2.0
    versionCode: 11000
    commit: 12eee5de73d193c8d75ce3541105a6a3de60c482
    submodules: true
    sudo:
      - mkdir -p /home/quan
      - chown -R vagrant /home/quan
      - apt-get update
      - apt-get install -y gcc libc-dev
    output: build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
    rm:
      - ios
      - macos
      - linux
      - windows
    prebuild:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - .flutter/bin/flutter config --no-analytics
      - .flutter/bin/flutter pub get
    scanignore:
      - .flutter/bin/cache
    scandelete:
      - .pub-cache
      - .flutter
    build:
      - .rustup/rustup-init.sh -y --default-toolchain stable
      - $HOME/.cargo/bin/cargo run -p rinf_cli gen
      - export PUB_CACHE=$(pwd)/.pub-cache
      - .flutter/bin/flutter build apk --split-per-abi --target-platform="android-arm" --build-number $(($$VERCODE$$/10000*10000)) --build-name=$$VERSION$$

