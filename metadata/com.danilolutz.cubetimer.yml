License: GPL-3.0-or-later
AuthorName: Danilo Lutz
SourceCode: https://github.com/danilolutz/cubetimer
IssueTracker: https://github.com/danilolutz/cubetimer/issues
Changelog: https://github.com/danilolutz/cubetimer/releases

AutoName: CubeTimer

RepoType: git
Repo: https://github.com/danilolutz/cubetimer.git

Builds:
  - versionName: '1.0'
    versionCode: 1
    commit: 2c9414e422f2f6c0fd27eb3da54d7bd010127f78
    subdir: app
    gradle:
      - yes
    gradleprops:
      - enableAbiSplits=false

MaintainerNotes: |
  The source project keeps its F-Droid-compatible Fastlane metadata, icon,
  screenshots, and changelog under fastlane/metadata/android/en-US/.
  This build intentionally selects the universal APK so it covers every
  supported ABI.

AutoUpdateMode: Version
UpdateCheckMode: Tags ^v[0-9]+\.[0-9]+(?:\.[0-9]+)?$
UpdateCheckData: app/build.gradle.kts|versionCode\s*=\s*(\d+)|.|versionName\s*=\s*"([^"]+)"
CurrentVersion: '1.0'
CurrentVersionCode: 1
