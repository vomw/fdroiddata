AutoName: PS4 OWES
Summary: Offline HTTP server to host PS4 exploits locally.
Description: |-
  PS4 OWES (Offline Webkit Exploiter Server) is a lightweight application
  that turns your Android device into a local HTTP server. It is specifically
  designed to host PS4 exploits locally, eliminating the need for an
  internet connection.

  Features:
  * Local HTTP Server using NanoHTTPD.
  * Completely offline: works via Hotspot or local Wi-Fi.
  * Supports custom payload.bin selection.
  * Real-time IP and status monitoring.
  * No trackers, no ads, no analytics.

