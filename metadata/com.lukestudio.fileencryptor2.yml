Name: S File Encryptor

Summary: Encrypt and decrypt files locally with a password

Description: |
  S File Encryptor is an Android application for encrypting and
  decrypting files locally with a password.

  Features:
  * AES-256-CBC encryption
  * HMAC-SHA256 authentication
  * PBKDF2-HMAC-SHA256 key derivation
  * Local file processing
  * No network access, analytics, advertising, or Google Play Services

  During decryption, the authentication code is verified before the
  decrypted result is committed to the destination.

