    subdir: clients/android/StellarChat/app
    sudo:
      - apt-get update
      - apt-get install -y rustup gcc libc-dev
    init:
      - rustup default 1.94.1
      - rustup target add aarch64-linux-android
    gradle:
      - fdroid
    rm:
      - clients/ios
    scanignore:
      - clients/android/StellarChat/app/src/main/assets/keyset-v1/
