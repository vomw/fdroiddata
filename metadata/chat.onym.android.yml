Builds:
  - versionName: 1.0.0
    versionCode: 1
    commit: b2741e40a206233765038b29199b213f8cdfb77a
    subdir: clients/android/StellarChat/app
    sudo:
      - apt-get update
      - apt-get install -y rustup build-essential
    init:
      - rustup default stable
      - rustup target add aarch64-linux-android x86_64-linux-android
    gradle:
      - fdroid
    prebuild: rm -f google-services.json
    scandelete:
      - clients/android/StellarChat/app/src/main/jniLibs/
      - kotlin-mls/src/main/jniLibs/
    build: export PATH="$HOME/.cargo/bin:$PATH" && pushd ../../../../ && ANDROID_NDK_HOME=$$NDK$$
      bash scripts/build-android.sh --out-dir kotlin-mls/src/main && popd
    ndk: r27c

