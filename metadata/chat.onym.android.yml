    subdir: clients/android/StellarChat/app
    sudo:
      - apt-get update
      - apt-get install -y rustup build-essential
    init:
      - rustup default 1.94.1
      - rustup target add aarch64-linux-android x86_64-linux-android
    gradle:
      - fdroid
    prebuild: rm -f google-services.json
    scanignore:
      - clients/android/StellarChat/app/src/main/assets/keyset-v1/
