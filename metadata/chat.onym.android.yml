Builds:
  - versionName: 1.3.1
    versionCode: 32
    commit: edd4687e280c3f84c6f0bf28b77fee27c9135088
    subdir: clients/android/StellarChat/app
    sudo:
      - apt-get update
      - apt-get install -y rustup gcc libc-dev
    init:
      - rustup default 1.94.1
      - rustup target add aarch64-linux-android
    gradle:
      - fdroid
    srclibs:
      - reproducible-apk-tools@v0.3.0
    rm:
      - clients/ios
    scanignore:
      - clients/android/StellarChat/app/src/main/assets/keyset-v2/
      - keyset-v1/
      - keyset-v2/
    scandelete:
      - clients/android/StellarChat/app/src/main/jniLibs/
      - kotlin-mls/src/main/jniLibs/
    build:
      - export PATH="$HOME/.cargo/bin:$PATH"
      - pushd ../../../../
      - ANDROID_NDK_HOME=$$NDK$$ bash scripts/build-android.sh --out-dir kotlin-mls/src/main
        --abis arm64-v8a
      - popd
    ndk: r27c
    postbuild:
      - mv $$OUT$$ unaligned.apk
      - $$reproducible-apk-tools$$/zipalign.py --page-size 16 --pad-like-apksigner
        --replace unaligned.apk $$OUT$$

