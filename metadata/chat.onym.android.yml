      - clients/android/StellarChat/app/src/main/jniLibs/
      - kotlin-mls/src/main/jniLibs/
    build:
      - export PATH="$HOME/.cargo/bin:$PATH"
      - pushd ../../../../
      - |
        ANDROID_NDK_HOME=$$NDK$$ bash scripts/build-android.sh \
          --out-dir kotlin-mls/src/main \
          --abis arm64-v8a
      - popd
    ndk: r27c

