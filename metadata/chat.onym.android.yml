    versionCode: 1
    commit: f25de24fe078f2a308d671f39b2bc96704fb67bb
    subdir: clients/android/StellarChat/app
    sudo:
      - apt-get update
      - apt-get install -y rustup build-essential
    init:
      - rustup default stable
      - rustup target add aarch64-linux-android x86_64-linux-android
    gradle:
      - fdroid
    prebuild:
      - rm -f google-services.json
      - rm -rf src/main/jniLibs/
      - rm -rf ../../../../kotlin-mls/src/main/jniLibs/
    build: export PATH="$HOME/.cargo/bin:$PATH" && pushd ../../../../ && ANDROID_NDK_HOME=$$NDK$$
      bash scripts/build-android.sh --out-dir kotlin-mls/src/main && popd
    ndk: r27c
    antifeatures:
      NonFreeNet:
        en-US: Push notifications use a self-hostable Nostr relay and PN relay for
          message transport. Both are open source and can be self-hosted.

