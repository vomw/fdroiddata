Builds:
  - versionName: 1.0.2
    versionCode: 3
    commit: 399208676b899df32b6944122df547fe515abde4
    subdir: clients/android/StellarChat/app
    sudo:
      - apt-get update
      - apt-get install -y rustup build-essential
    init:
      - rustup default 1.94.1
      - rustup target add aarch64-linux-android x86_64-linux-android
    gradle:
      - fdroid
    prebuild: rm -f google-services.json
    scanignore:
      - clients/android/StellarChat/app/src/main/assets/keyset-v1/
      - clients/ios/StellarChat/StellarChat/Resources/keyset-v1/
      - keyset-v1/
    scandelete:
      - clients/android/StellarChat/app/src/main/jniLibs/
      - kotlin-mls/src/main/jniLibs/
    build:
      - export PATH="$HOME/.cargo/bin:$PATH"
      - pushd ../../../../
      - ANDROID_NDK_HOME=$$NDK$$ bash scripts/build-android.sh --out-dir kotlin-mls/src/main
      - popd
    ndk: r27c

