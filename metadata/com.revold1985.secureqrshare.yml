Categories:
  - Security
License: MIT
AuthorName: Jonathan Drolet
SourceCode: https://github.com/Revold1985/secureqrshare
IssueTracker: https://github.com/Revold1985/secureqrshare/issues

AutoName: Secure QR Share

RepoType: git
Repo: https://github.com/Revold1985/secureqrshare

Builds:
  - versionName: 1.0.0
    versionCode: 4
    commit: b6814af142cfee3dfdfee2b908b8c0d5a81147b4
    output: build/app/outputs/flutter-apk/app-release.apk
    srclibs:
      - flutter@stable
    rm:
      - ios
      - linux
      - macos
      - web
      - windows
    prebuild:
      - flutterVersion=$(sed -n -E "s/.*flutter-version:\ '(.*)'/\1/p" .github/workflows/release.yml)
      - '[[ $flutterVersion ]]'
      - git -C $$flutter$$ checkout -f $flutterVersion
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get
    scandelete:
      - .pub-cache
    build:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter build apk --release

AutoUpdateMode: Version
UpdateCheckMode: Tags
UpdateCheckData: pubspec.yaml|version:\s.+\+(\d+)|.|version:\s(.+)\+
CurrentVersion: 1.0.0
CurrentVersionCode: 4
