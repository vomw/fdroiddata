Name: Ohrwaschl
Summary: Minimalistische Radio-App für österreichische Sender
Description: |-
  Ohrwaschl spielt österreichische Radiosender ab – ORF (Ö1, Ö3, FM4 und die
  9 Landesstudios) sowie große Privatsender kuratiert, ergänzt um weitere
  Sender von radio-browser.info. Wiedergabe läuft im Hintergrund mit
  Notification-Steuerung. Favoriten werden lokal gespeichert, ohne Konto.

  Keine Google Play Services, kein Tracking, keine Werbung.

