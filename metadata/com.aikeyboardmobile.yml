Categories:
  - Writing
License: MIT
AuthorName: Aryan Kumar
SourceCode: https://github.com/aryankumarx/replyfy
IssueTracker: https://github.com/aryankumarx/replyfy/issues

AutoName: Replyfy

RepoType: git
Repo: https://github.com/aryankumarx/replyfy.git

Builds:
  - versionName: 1.4.1
    versionCode: 5
    commit: v1.4.1
    subdir: AIKeyboardMobile/android/app
    sudo:
      - apt-get update
      - apt-get install -y npm
    init:
      - cd ../..
      - npm install --legacy-peer-deps
    gradle:
      - yes
    prebuild:
      - cd ../..
      - sed -i '/jvmToolchain\|JavaVersion/s/17/21/' node_modules/@react-native/gradle-plugin/*/build.gradle.kts
        node_modules/@react-native/gradle-plugin/react-native-gradle-plugin/src/main/kotlin/com/facebook/react/utils/JdkConfiguratorUtils.kt
    scanignore:
      - AIKeyboardMobile/node_modules/react-native/ReactAndroid/publish.gradle
      - AIKeyboardMobile/node_modules/react-native-safe-area-context/android/build.gradle
      - AIKeyboardMobile/node_modules/hermes-compiler/hermesc/linux64-bin/hermesc
    scandelete:
      - AIKeyboardMobile/node_modules

AntiFeatures:
  - NonFreeNet

AutoUpdateMode: Version
UpdateCheckMode: Tags
CurrentVersion: 1.4.1
CurrentVersionCode: 5
