Name: FlashlightMine
Summary: Toggle device flashlight using a button or by shaking
Description: |-
  FlashlightMine is an Android application that allows users to toggle their device
  flashlight using a button or by shaking the device. The app provides a simple and
  interactive UI for this purpose.

  Features include:
  • Flashlight control via button or shake
  • Pull-cord switch interaction with realistic spring animations
  • Interactive tutorials
  • Dynamic UI updates
