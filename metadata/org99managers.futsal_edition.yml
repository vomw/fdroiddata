Builds:
  - versionName: v0.7.3
    versionCode: 2
    commit: 57633a5cc9254d79c1360251294b57bfea763bf1
    sudo:
      - apt-get update
      - apt-get install -y pkgconf scons g++
    output: game/99managers-futsal-edition.apk
    srclibs:
      - Godot@4.6-stable
    prebuild: mv fdroid/export_presets.cfg game/export_presets.cfg
    build:
      - pushd $$Godot$$
      - export ANDROID_NDK_ROOT=$$NDK$$
      - export ANDROID_HOME=$$SDK$$
      - export JAVA_HOME=/usr/lib/jvm/java-21-openjdk-amd64
      - scons -j `nproc` platform=linuxbsd target=editor
      - scons -j `nproc` platform=android target=template_release arch=arm64 generate_apk=yes
      - popd
      - mv $$Godot$$/bin/android_release.apk android-release.apk
      - $$Godot$$/bin/godot.linuxbsd.editor.x86_64 --headless --path game --export-release
        "Android APK" 99managers-futsal-edition.apk
    ndk: r28b

