Name: OptiCast Video Player
AutoName: OptiCast Video Player
Summary: Local video player, offline-first
Description: |-
  OptiCast — Your videos, beautifully organized.

  Beautiful, offline-first local video player. Your own movies and TV shows,
  organized beautifully, playing perfectly offline. No ads, no tracking.

  Library: Finds your videos automatically, adaptive poster grid, Continue
  Watching, Movies and TV Shows, Favorites, Recently Added, Collections, search.

  Movie Info: Recognizes movies and TV shows from filenames, posters cached
  offline for instant loading.

  Subtitles: OpenSubtitles and SubDL support, always saved offline during scan,
  custom fonts and dual subtitles.

  Player: Based on mpv and Media3, plays all common formats including mkv, mp4
  and avi, with gestures, picture-in-picture and audio and subtitle selection.

  Updates: Checks once when internet is detected, in-app updates with progress
  and full changelog visible.

  Offline: Works fully offline after posters and subtitles are cached.

  Private: No ads, no tracking, open source GPL-3.0, media stays on device,
  no accounts required.

