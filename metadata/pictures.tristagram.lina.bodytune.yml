Summary: Daily weight and body measurements tracker with trend charts
Description: |-
    A simple Android app for daily weight monitoring based on your chosen target weight. 
    
    Features:
    * Displays results on a color-coded trend chart (green for on-track, red for off-target).
    * Track chest, waist, hip, and bicep measurements with visual graphs.
    * Edit entries for any past date.
    * Export and import history in CSV format for easy backup or transfer.
    * Privacy-focused: Requires no Android permissions.
    * Supports Russian and English (follows system language).

