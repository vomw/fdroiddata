Summary: A simple Android app for daily weight monitoring based on your chosen target weight.
Description: A simple Android app for daily weight monitoring based on your chosen target weight: It displays your results on a color-coded trend chart: green means you're on track, red means you're off target. You can also track your chest, waist, hip, and bicep measurements (with measurement graphs).

