AuthorName: Łukasz Kasprzak
AuthorEmail: lukas@labunix.xyz
SourceCode: https://codeberg.org/labunix/dlectio
IssueTracker: https://codeberg.org/labunix/dlectio/issues

RepoType: git
Repo: https://codeberg.org/labunix/dlectio.git

Builds:
  - versionName: 0.2.1
    versionCode: 31
    commit: v0.2.1
    submodules: true
    sudo:
      - apt-get update
      - apt-get install -y gcc libc-dev
    gradle:
      - yes
    output: app/build/outputs/apk/release/app-arm64-v8a-release-unsigned.apk
    srclibs:
      - go@go1.25.0
    build:
      - pushd $$go$$/src
      - ./make.bash
      - popd
      - export GOROOT=$$go$$
      - export GOPATH=$$go$$
      - export PATH="$GOROOT/bin:$GOPATH/bin:$PATH"
      - mkdir -p app/libs
      - pushd engine/lectio
      - go install golang.org/x/mobile/cmd/gomobile@v0.0.0-20260730202154-c700fe717e6e
      - go mod download
      - gomobile init
      - gomobile bind -target=android/arm64 -androidapi 26 -javapkg=xyz.labunix.dlectio.engine
        -tags fullbible -ldflags="-buildid=" -trimpath -o ../../app/libs/dlectio-engine.aar
        github.com/lukaszkasprzak/lectio/mobile
      - popd
    ndk: 26.1.10909125
    gradleprops:
      - abiTarget=arm64-v8a

AutoUpdateMode: None
UpdateCheckMode: None
