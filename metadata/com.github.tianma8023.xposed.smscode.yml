AutoName: XposedSmsCode
Description: |-
  XposedSmsCode is an Xposed/LSPosed module for Android focused on SMS verification code handling.

  Core capabilities:
  - Extract verification codes from incoming SMS.
  - Copy extracted codes to clipboard.
  - Auto-fill codes in supported apps.
  - Show notifications and optional Toast prompts.
  - Keep records with export/retention controls.

  Forwarding and automation:
  - Multi-channel forwarding with templates.
  - App notification forwarding support.
  - Built-in WebUI and rule import/export.

  Requirements:
  - Android 7.0+.
  - Root and Xposed/LSPosed activation are required.

RequiresRoot: true

RepoType: git
Repo: https://github.com/magisk317/XposedSmsCode.git

