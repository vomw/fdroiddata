AutoName: SoundTree Recorder
Description: |-
  SoundTree is a personal audio recorder and organiser with an emphasis on bookmarks.

  Everything stays on your device - no accounts, no cloud, no tracking, and
  no network permission at all.

  Record high-quality M4A audio with a live scrolling waveform, pause and
  resume without starting a new file, and save from the notification while
  your screen is locked. Drop marks during recording or playback to flag
  moments worth revisiting. Sort recordings into a hierarchical topic tree,
  nested as deeply as you like. Back up automatically to an external drive
  or USB device.

