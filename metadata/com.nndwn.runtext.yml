AutoName: Temo
Description: |-
  Temo turns your text into motion on screen. Create running and blinking text, style it with
  custom fonts, colors, gradients, outlines, and shadows, then share the animation to social
  media as an MP4 video. Morse code is included as a bonus feature: type any text and Temo
  transmits it as light, sound, and vibration.

