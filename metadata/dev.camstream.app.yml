AutoName: CamStream
Description: |
  CamStream streams your Android phone's camera to your computer as a webcam,
  over the same TCP protocol used by the official DroidCam app. It is a
  from-scratch, ad-free, open-source replacement for that app's phone side,
  and works unmodified with the existing open-source droidcam-linux-client
  and v4l2loopback-dc pipeline already available on the desktop.
  .
  No DroidCam code is included; the wire protocol was independently
  recovered by reading droidcam-linux-client's own GPL-2.0 source, published
  specifically so people can build interoperable clients. See PROTOCOL.md in
  the source repository for the full writeup.

