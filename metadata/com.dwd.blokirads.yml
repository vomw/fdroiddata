Categories:
  - Security
  - System
License: MIT
WebSite: https://github.com/dwdprojects/blokir-ads
SourceCode: https://github.com/dwdprojects/blokir-ads
IssueTracker: https://github.com/dwdprojects/blokir-ads/issues
AutoName: Blokir Ads
Summary: Aplikasi pemblokir iklan tingkat dewa berbasis DNS VPN.
Description: |-
  Blokir Ads adalah aplikasi open-source yang memblokir iklan di aplikasi lain tanpa memerlukan akses root. 
  
  Fitur Utama:
  * Per-App Targeting
  * Local Processing (Privacy First)
  * Comprehensive Blocklist (Hagezi Multi Pro & Regional)
  * Live DNS Terminal
  * Tap-to-Block Custom Domains

Builds:
  - versionName: 1.0.0
    versionCode: 1
    commit: v1.0.0
    subdir: app
    gradle:
      - yes
    scandelete:
      - ios
      - macos
      - windows
      - linux
    build:
      - flutter pub get
      - flutter build apk --release

AutoUpdateMode: Version
UpdateCheckMode: Tags
