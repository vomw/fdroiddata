AutoName: Blokir Ads

RepoType: git
Repo: https://github.com/dwdprojects/blokir-ads

Builds:
  - versionName: 1.0.0
    versionCode: 1
    commit: 6abffdfc14b4956ea19cb07e0b2569caabd9ea20
    output: build/app/outputs/flutter-apk/app-release.apk
    srclibs:
      - flutter@stable
    rm:
      - ios
      - linux
      - macos
      - web
      - windows
    prebuild:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get
    scandelete:
      - .pub-cache
    build:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter build apk --release

AutoUpdateMode: None
UpdateCheckMode: None
