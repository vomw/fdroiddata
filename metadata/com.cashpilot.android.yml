Summary: Monitor passive income apps and track earnings from your phone
Description: |-
  CashPilot Android is a monitoring agent for CashPilot, the self-hosted
  passive income orchestrator. It tracks earnings from bandwidth sharing,
  DePIN, storage, and GPU compute services running on your phone — without
  root access.

  Features:

  * Monitors passive income apps (Honeygain, EarnApp, Grass, etc.) via NotificationListenerService
  * Reports earnings and app status to your self-hosted CashPilot server
  * Lightweight foreground service with minimal battery impact
  * Usage statistics and network bandwidth tracking
  * Material Design 3 UI with Jetpack Compose
  * No accounts required — connects to your own CashPilot instance

  Requires a self-hosted CashPilot server to function. CashPilot is free
  and open-source software licensed under GPL-3.0.

