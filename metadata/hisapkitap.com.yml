License: MIT
AuthorName: Manisana Meetei
WebSite: https://github.com/manisanameetei7-ux/myhisapkitap
SourceCode: https://github.com/manisanameetei7-ux/myhisapkitap
IssueTracker: https://github.com/manisanameetei7-ux/myhisapkitap/issues

AutoName: Hisap Kitap
Summary: Shop ledger and billing app for small businesses.
Description: |-
    Hisap Kitap helps small shop owners track stock, sales, investments,
    customer dues, payments, invoices, and reports.

RepoType: git
Repo: https://github.com/manisanameetei7-ux/myhisapkitap.git

Builds:
  - versionName: 1.0.0
    versionCode: 1
    commit: v1.0.0
    output: build/app/outputs/flutter-apk/app-release.apk
    srclibs:
      - flutter@stable
    rm:
      - ios
      - linux
      - macos
      - web
      - windows
    prebuild:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get
    scandelete:
      - .pub-cache
    build:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter build apk --release

AutoUpdateMode: Version
UpdateCheckMode: Tags
CurrentVersion: 1.0.0
CurrentVersionCode: 1