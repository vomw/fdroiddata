Categories:
  - Money
License: MIT
AuthorName: Manisana Meetei
WebSite: https://github.com/manisanameetei7-ux/myhisapkitap
SourceCode: https://github.com/manisanameetei7-ux/myhisapkitap
IssueTracker: https://github.com/manisanameetei7-ux/myhisapkitap/issues

AutoName: hisapkitap

RepoType: git
Repo: https://github.com/manisanameetei7-ux/myhisapkitap.git

Builds:
  - versionName: 1.0.2
    versionCode: 3
    commit: 3e03a164dce6a638158c5686e50c4e958c350ec6
    output: build/app/outputs/flutter-apk/app-release.apk
    srclibs:
      - flutter@stable
    rm:
      - ios
      - linux
      - macos
      - web
      - windows
    prebuild:
      - flutterVersion=$(sed -n -E "s/.*flutter-version:\ '(.*)'/\1/p" .github/workflows/release.yml)
      - '[[ $flutterVersion ]]'
      - git -C $$flutter$$ checkout -f $flutterVersion
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get --enforce-lockfile
    scandelete:
      - .pub-cache
    build:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter build apk --release

AutoUpdateMode: Version
UpdateCheckMode: Tags
UpdateCheckData: pubspec.yaml|version:\s.+\+(\d+)|.|version:\s(.+)\+
CurrentVersion: 1.0.2
CurrentVersionCode: 3
