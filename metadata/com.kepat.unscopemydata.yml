AutoName: UnscopeMyData
Description: |-
  UnscopeMyData is a utility that helps users regain full-disk access to their files by opting out of Android's scoped storage sandbox. By utilizing the MANAGE_EXTERNAL_STORAGE permission and Shizuku, it enables access to folders that are otherwise restricted. The app is designed with privacy in mind: it operates entirely offline, does not request the INTERNET permission, and ensures that your data never leaves your device.

