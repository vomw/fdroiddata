Description: |-
  MiniCode is an SSH terminal and code editor for Android, designed for
  developers who manage remote servers from mobile devices.

  Features:
  * Split-panel layout on foldable devices and tablets
  * SFTP file browser with rename, delete, create operations
  * Syntax highlighting for 30+ programming languages
  * Multi-session SSH with tabbed interface

