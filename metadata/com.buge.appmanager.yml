AutoName: Buge App Manager
Description: |-
  Buge App Manager is a modern, lightweight and privacy‑friendly app manager
  that helps you inspect, manage and control applications installed on your device.

  You can use Buge App Manager without root access, and optionally enable
  advanced features through Shizuku (https://shizuku.rikka.app/download/).

  Features:
    - View detailed app information — package name, version, permissions,
      install source and more
    - Export installed apps as APK files for backup or sharing
    - Manage app permissions to improve privacy and security
    - Clear cache and view storage usage
    - Uninstall apps easily (system app removal requires Shizuku)
    - Modern, clean and minimal UI
    - No ads, no analytics, fully open source

  Notes:
    - No root required
    - Some advanced operations require Shizuku
    - Removing essential system apps may cause issues after reboot

