AutoName: Nighthawk (Testnet)
Summary: DarkFi testnet wallet — DRK, UnifOMR, Tor, DarkIRC (ngrok LWD)
Description: |-
    <b>Testnet edition</b> of Nighthawk (DarkFi). This release targets the DarkFi
    <b>testnet</b> only — not mainnet. It is intended for development and alpha
    testing against the Studio testnet lightwalletd endpoint (ngrok TLS).

    Nighthawk is a self-custodial, privacy-first wallet for the DarkFi network.
    It syncs via lightwalletd / UnifOMR, supports send/receive testnet DRK,
    optional Strict UnifOMR sync, DAO browsing, and in-process DarkIRC chat.

    Tor (embedded Arti) is on by default; users can disable it on the splash
    screen or in Settings and use their regular network.

    Package id is <code>com.nighthawkwallet.android.testnet</code> (Gradle flavor
    <code>darkfitestnet</code>), distinct from any future mainnet listing and from
    the legacy Zcash app (<code>com.nighthawkapps.wallet.android</code>).

    As a light wallet, accuracy of chain data depends on the configured
    lightwalletd endpoint. Prefer Tor for remote servers when available.

RepoType: git
Repo: https://github.com/nighthawk-apps/nighthawk-android-wallet.git

Builds:
  - versionName: 3.00.00
    versionCode: 30000800
    # Tip of branch nighthawk-dark at MR time (push tags for AutoUpdate).
    commit: 569f636090c539d9cb666636fd9596b73aaca958
    subdir: app
    sudo:
      - apt-get update
      - apt-get install -y openjdk-17-jdk-headless curl build-essential protobuf-compiler
        libssl-dev pkg-config git
      - update-alternatives --auto java
      # Rust toolchain for UniFFI cdylib (libdarkfi_mobile_ffi.so is gitignored).
      - curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs
        | bash -s -- -y --default-toolchain stable
      - bash -lc 'source "$HOME/.cargo/env" && rustup target add
        aarch64-linux-android armv7-linux-androideabi x86_64-linux-android
        i686-linux-android && cargo install cargo-ndk --locked'
    prebuild:
      - bash -lc 'source "$HOME/.cargo/env" && cd .. &&
        ./scripts/vendor-darkfi.sh &&
        ANDROID_NDK_HOME="$$ANDROID_NDK_ROOT" ./scripts/build-darkfi-mobile-ffi-android.sh'
    gradle:
      - darkfitestnet
    ndk: r26b
    timeout: 14400
    scandelete:
      - rust/target
      - third_party/darkfi/target
      - .cargo-home
      - build-conventions-stealth/build

AutoUpdateMode: Version
UpdateCheckMode: Tags
UpdateCheckData: gradle.properties|WALLET_VERSION_CODE\s*=\s*(\d+)|.|WALLET_VERSION_NAME\s*=\s*([\d.]+)
CurrentVersion: 3.00.00
CurrentVersionCode: 30000800
