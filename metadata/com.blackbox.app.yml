    subdir: android
    sudo:
      - apt-get update
      - apt-get install -y nodejs npm
    init: cd .. && npm install && npx cap sync android && rm -rf ../node_modules/clipboardy/fallbacks
      ../node_modules/@capacitor/cli/assets
    prebuild: ln -sf app/src/main/AndroidManifest.xml AndroidManifest.xml && sed -i
      's/com.android.tools.build:gradle:8.1.4/com.android.tools.build:gradle:8.5.2/' build.gradle
    build: gradle assembleRelease

