Summary: Minimalist web radio and ambient sound mixer

Description: |
  Loomi is a simple open-source Android app for listening to lofi radio
  and ambient sounds for focus, study, or relaxation.

  Features:
  - Radio streaming
  - Ambient sound mixer
  - Equalizer
  - Sleep timer

