    subdir: android/app
    sudo:
      - echo "deb https://deb.debian.org/debian bookworm main" > /etc/apt/sources.list.d/bookworm.list
      - apt-get update
      - apt-get install -y -t bookworm openjdk-17-jdk-headless
      - apt-get install -y nodejs npm
      - update-java-alternatives -s java-1.17.0-openjdk-amd64
    init: npm ci
    prebuild:
      - sed -i -e '1a "expo":{"autolinking":{"android":{"buildFromSource":[".*"]}}},'
        package.json
    gradle:
      - yes
    scandelete:
      - node_modules
    antifeatures:
      NonFreeNet:
        en-US: Uses proprietary public-safety and mapping network services for optional
          emergency features.
      TetheredNet:
        en-US: Some emergency integrations depend on fixed third-party service endpoints.

