Name: MediaRescue
Summary: Offline-first file and media manager
Description: |
  MediaRescue is a lightweight, privacy-first file and media manager built
  with Flutter. It helps you find, preview, and manage large and duplicate
  media and files on Android devices — entirely offline.

  Features

  - Full storage scanning of shared storage and removable SD cards
  - Intelligent gallery view grouped by folder, image, video, audio, PDF
  - Built-in previews: pinch-to-zoom images, in-app video playback, native-style PDF rendering, and audio playback
  - Batch operations: copy, move, delete, and rename multiple files at once
  - Large Files finder to identify storage hogs and reclaim space
  - Fast search across scanned file names and paths
  - Folder picker and directory browser with detailed file metadata
  - Save and load scan results to avoid re-scanning repeatedly
  - Light & dark themes with Material 3 design
  - 100% offline — no network calls, no analytics, no cloud uploads

  Permissions

  - MANAGE_EXTERNAL_STORAGE` (Android 11+) — "All files access" required for full storage scanning and file management
  - READ_EXTERNAL_STORAGE` (Android 5–10, maxSdk 32) — read public media
  - WRITE_EXTERNAL_STORAGE` (Android ≤ 9, maxSdk 29) — copy/move/delete

  All scanning and processing happens locally on your device. Your files
  never leave your device.

RepoType: git
Repo: https://github.com/everythingfreee/MediaRescue.git

Builds:
  - versionName: 1.0.0
    versionCode: 1
    commit: v1.0.0
    output: build/app/outputs/flutter-apk/app-release.apk

    srclibs:
      - flutter@3.38.3


    prebuild:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get

    scandelete:
      - .pub-cache    

    build:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter build apk --release

AutoUpdateMode: Version
UpdateCheckMode: Tags
