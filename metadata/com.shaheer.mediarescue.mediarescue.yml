Categories:
  - System
  - Multimedia
License: MIT
SourceCode: https://github.com/everythingfreee/MediaRescue
Changelog: https://github.com/everythingfreee/MediaRescue/releases
AutoName: MediaRescue

RepoType: git
Repo: https://github.com/everythingfreee/MediaRescue.git

Builds:
  - versionName: '1.0.0'
    versionCode: 1
    commit: v1.0.0
    output: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk

    srclibs:
      - flutter@3.38.3

    prebuild:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get --enforce-lockfile

    scanignore:
      - .flutter/bin/cache

    scandelete:
      - .flutter
      - .pub-cache

    build:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter build apk --release --split-per-abi --target-platform="android-arm64"

AutoUpdateMode: Version
UpdateCheckMode: Tags

VercodeOperation:
  - '%c * 10 + 1'

UpdateCheckData: pubspec.yaml|version:\s.+\+(\d+)|.|version:\s(.+)\+

CurrentVersion: '1.0.0'
CurrentVersionCode: 11
