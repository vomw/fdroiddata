Summary: Lightweight FOSS kiosk browser for dashboards

Description: |
  kiFOSSk is a minimal, privacy-focused Android kiosk browser designed for
  displaying remote dashboards (ADS-B flight trackers, Home Assistant, Grafana)
  on dedicated hardware. Built with zero Google Play Services dependencies.

