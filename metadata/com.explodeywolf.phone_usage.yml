Categories:
  - Habit Tracker
License: GPL-3.0-or-later
SourceCode: https://gitlab.com/peanutplays61/phone-usage

AutoName: Phone Usage
Description: A Flutter application to track when the user turns on and off their phone.
  It records the timestamps of these events and provides a history of phone usage.

RepoType: git
Repo: https://peanutplays61@gitlab.com/peanutplays61/phone-usage.git

Builds:
  - versionName: 1.0.37
    versionCode: 51
    commit: 9bfe04b3c53bfb64befa7da5000006d41e76ab3e
    submodules: true
    sudo:
      - export repo=/builds/peanutplays61/
      - mkdir -p $repo
      - apt install ca-certificates curl gnupg
      - install -m 0755 -d /etc/apt/keyrings
      - curl -fsSL https://packages.adoptium.net/artifactory/api/gpg/key/public | sudo tee /etc/apt/keyrings/adoptium.asc > /dev/null
      - echo "deb [signed-by=/etc/apt/keyrings/adoptium.asc] https://packages.adoptium.net/artifactory/deb $(awk -F= '/^VERSION_CODENAME/{print$2}' /etc/os-release) main" | sudo tee /etc/apt/sources.list.d/adoptium.list
      - apt-get update
      - apt-get install -y temurin-17-jdk
    output: build/app/outputs/flutter-apk/app-x86_64-release.apk
    binary: https://gitlab.com/peanutplays61/phone-usage/-/releases/v%v/downloads/app-x86_64-release.apk
    scandelete:
      - .flutter/dev
      - .flutter/engine
      - .flutter/packages
      - .flutter/dev

    build:
      - export repo=/builds/peanutplays61/phone-usage
      - mkdir .pub-cache
      - export PUB_CACHE=$(pwd)/.pub-cache
      - cd ..
      - mv com.explodeywolf.phone_usage $repo
      - pushd $repo
      - echo "$ANDROID_HOME"
      - export PUB_CACHE=$(pwd)/.pub-cache
      - ./build.sh android-x64
      - popd
      - mv $repo com.explodeywolf.phone_usage

