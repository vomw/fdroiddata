Builds:
  - versionName: 1.3.3
    versionCode: 14001
    commit: d5d7ed58dd42783864995dfd9bcdc2db9d691099
    submodules: true
    sudo:
      - export repo=/builds/peanutplays61/
      - mkdir -p $repo
    output: build/app/outputs/flutter-apk/app-x86_64-release.apk
    binary: 
      https://gitlab.com/peanutplays61/phone-usage/-/releases/v%v/downloads/app-x86_64-release.apk
    scandelete:
      - .flutter/dev
      - .flutter/engine
      - .flutter/packages
    build:
      - export repo=/builds/peanutplays61/phone-usage
      - mkdir .pub-cache
      - cd ..
      - mv com.explodeywolf.phone_usage $repo
      - pushd $repo
      - export PUB_CACHE=$(pwd)/.pub-cache
      - ./build.sh android-x64
      - popd
      - mv $repo com.explodeywolf.phone_usage

  - versionName: 1.3.3
    versionCode: 14002
    commit: d5d7ed58dd42783864995dfd9bcdc2db9d691099
