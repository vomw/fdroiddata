      https://gitlab.com/peanutplays61/phone-usage/-/releases/v%v/downloads/app-armeabi-v7a-release.apk
    scandelete:
      - .flutter/dev
      - .flutter/engine
      - .flutter/packages
    build:
      - export repo=/builds/peanutplays61/phone-usage
      - mkdir .pub-cache
      - cd ..
      - mv com.explodeywolf.phone_usage $repo
      - pushd $repo
      - echo "$ANDROID_HOME"
      - export PUB_CACHE=$(pwd)/.pub-cache
      - ./build.sh android-arm
