AutoName: Orbit
Description: |-
  Orbit is a self-hosted, invite-only social app: a feed, direct messages,
  group chat, audio and video posts. You connect it to your own Orbit server.

  Push notifications are delivered through UnifiedPush, so a distributor app
  (such as ntfy) must be installed to receive them.

