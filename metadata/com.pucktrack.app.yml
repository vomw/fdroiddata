Builds:
  - versionName: 1.0.0
    versionCode: 1
    commit: e77085e4d25beb8bdc1a1a9988df2ab21e1b5153
    subdir: android
    sudo:
      - apt-get update
      - apt-get install -y npm
      - apt-get install -y openjdk-21-jdk-headless
    gradle:
      - yes
    prebuild: cd .. && npm install --ignore-scripts && find . -type f \( -name "*.gradle"
      -o -name "*.gradle.kts" -o -name gradle.properties \) -exec sed -i -e 's/jvmToolchain(17)/jvmToolchain(21)/g'
      -e 's/JavaLanguageVersion.of(17)/JavaLanguageVersion.of(21)/g' -e 's/JavaVersion.VERSION_17/JavaVersion.VERSION_21/g'
      -e 's/VERSION_17/VERSION_21/g' -e 
      's/languageVersion.set(JavaLanguageVersion.of(17))/languageVersion.set(JavaLanguageVersion.of(21))/g'
      -e 's/languageVersion = JavaLanguageVersion.of(17)/languageVersion = JavaLanguageVersion.of(21)/g'
      -e 
      's/jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17)/jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_21)/g'
      -e 's/JvmTarget.JVM_17/JvmTarget.JVM_21/g' -e 's/jvmTarget = "17"/jvmTarget
      = "21"/g' -e 's/sourceCompatibility = JavaVersion.VERSION_17/sourceCompatibility
      = JavaVersion.VERSION_21/g' -e 's/targetCompatibility = JavaVersion.VERSION_17/targetCompatibility
      = JavaVersion.VERSION_21/g' -e 's/languageVersion=17/languageVersion=21/g' {}
      +
    scanignore:
      - node_modules/react-native/sdks/hermesc/linux64-bin
      - node_modules/expo-linear-gradient/local-maven-repo
      - node_modules/expo-image/local-maven-repo
      - node_modules/expo-linking/local-maven-repo
      - node_modules/expo/node_modules/expo-font/local-maven-repo
      - node_modules/expo/node_modules/expo-asset/local-maven-repo
      - node_modules/expo/node_modules/expo-keep-awake/local-maven-repo
      - node_modules/expo/node_modules/expo-file-system/local-maven-repo
      - node_modules/expo/template.tgz
      - node_modules/expo-modules-core/android/ExpoModulesCorePlugin.gradle
      - node_modules/@react-native-async-storage/async-storage/android/build.gradle
      - node_modules/expo-modules-autolinking/scripts/android/autolinking_implementation.gradle
      - node_modules/react-native-safe-area-context/android/build.gradle
      - node_modules/react-native/ReactAndroid/publish.gradle
      - node_modules/react-native-screens/android/build.gradle
    scandelete:
      - node_modules/react-native/sdks/hermesc/osx-bin
      - node_modules/react-native/sdks/hermesc/win64-bin
      - node_modules/react-native/React/I18n/strings

