  https://github.com/HotshotJacko1/Open-Keep/releases/download/v%v/OpenKeep-%v-fdroid.apk

Builds:
  - versionName: 5.0.5
    versionCode: 51
    commit: fb5748658a0b9821121afb4f9da1d57b03021e69
    subdir: android
    sudo:
      - apt-get update
      - apt-get install -y curl xz-utils
      - curl -Lo /tmp/node.tar.xz https://nodejs.org/dist/v22.22.2/node-v22.22.2-linux-x64.tar.xz
      - echo "88fd1ce767091fd8d4a99fdb2356e98c819f93f3b1f8663853a2dee9b438068a  /tmp/node.tar.xz"
        | sha256sum -c -
      - tar xJf /tmp/node.tar.xz -C /opt
      - ln -s /opt/node-v22.22.2-linux-x64/bin/* /usr/local/bin/
    gradle:
      - fdroid
    output: app/build/outputs/apk/fdroid/release/app-fdroid-release-unsigned.apk
    rm:
      - SQLCipher_Framework
      - SQLCipher.xcframework.zip
    prebuild:
      - cd ..
      - export VITE_APP_FLAVOR=fdroid
      - corepack pnpm install --frozen-lockfile
      - corepack pnpm run build
      - corepack pnpm exec cap sync android
    scandelete:
      - node_modules/.pnpm/@capgo+capacitor-social-login@*
      - node_modules/.pnpm/@sentry+cli-linux-x64@*
      - node_modules/.pnpm/@capacitor+cli@*/node_modules/@capacitor/cli/assets
      - node_modules/.pnpm/jszip@*/node_modules/jszip/.jekyll-metadata

