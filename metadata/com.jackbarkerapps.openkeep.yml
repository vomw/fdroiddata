Builds:
  - versionName: 5.0.4
    versionCode: 50
    commit: 3fc78828bc65d9c08459ac81e25f73417fb95359
    subdir: android
    sudo:
      - apt-get update
      - apt-get install -y curl xz-utils
      - curl -Lo /tmp/node.tar.xz https://nodejs.org/dist/v22.23.2/node-v22.23.2-linux-x64.tar.xz
      - echo "d60acfe00a2932254bb0ad20e01b0d74397a0875595de719654b214f4b03f307  /tmp/node.tar.xz"
        | sha256sum -c -
      - tar xJf /tmp/node.tar.xz -C /opt
      - ln -s /opt/node-v22.23.2-linux-x64/bin/* /usr/local/bin/
    gradle:
      - fdroid
    output: app/build/outputs/apk/fdroid/release/app-fdroid-release-unsigned.apk
    prebuild:
      - cd ..
      - corepack pnpm install --frozen-lockfile
      - VITE_APP_FLAVOR=fdroid corepack pnpm run build
      - corepack pnpm exec cap sync android

AutoUpdateMode: Version
UpdateCheckMode: Tags ^v[0-9.]+$
CurrentVersion: 5.0.4
CurrentVersionCode: 50
