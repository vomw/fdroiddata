AutoName: Haushaltsbuch Barrierefrei
Summary: Accessible personal finance tracker with TalkBack support and secure offline vault
Description: |-
  Haushaltsbuch Barrierefrei is an intuitive and privacy-focused personal finance
  manager designed for blind, visually impaired, and accessibility-conscious users.

  Features:
  - Optimized for screen readers (TalkBack, NVDA/JAWS navigation)
  - High-contrast themes, scalable typography, and OLED dark mode
  - Flexible budget periods: Monthly, weekly, or custom intervals
  - Savings pots, recurring transactions, categories, and wishlists
  - Local encrypted vault for 100% offline data privacy (zero tracking)
  - Optional PIN and biometric security

