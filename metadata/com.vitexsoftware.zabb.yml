Summary: Mobile client for Zabbix monitoring

Description: |-
  Zabb is a Flutter-based mobile client for the Zabbix monitoring system,
  designed to bring enterprise IT infrastructure monitoring to your mobile device.

  Features:

  * Real-time problem monitoring with auto-refresh
  * Advanced filtering by severity and hostname
  * Search functionality across all problems
  * Problem acknowledgment and closure
  * Trigger disable functionality
  * Pull-to-refresh for instant updates
  * Audio notifications with customizable sounds per severity
  * Recovery sound notifications when problems are resolved
  * SSL support for self-signed certificates

  Mobile platform features:

  * Background monitoring via foreground service
  * System notifications
  * Custom sound file uploads
  * Battery optimization management

RepoType: git
Repo: https://github.com/VitexSoftware/Zabb.git

Builds:
  - versionName: '0.6.2'
    versionCode: 2
    commit: v0.6.2
    sudo:
      - apt-get update
      - apt-get install -y openjdk-17-jdk-headless
      - update-java-alternatives -a
    output: build/app/outputs/flutter-apk/app-release.apk
    srclibs:
      - flutter@stable
    rm:
      - debian-package
      - linux
      - web
    prebuild:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get
    scandelete:
      - .pub-cache
    build:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter build apk

AutoUpdateMode: Version
UpdateCheckMode: Tags
UpdateCheckData: pubspec.yaml|version:\s(.+)\+(\d+)|.|version:\s(.+)\+
CurrentVersion: '0.6.2'
CurrentVersionCode: 2
