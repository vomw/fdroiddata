Builds:
  - versionName: 0.6.7
    versionCode: 71
    commit: 342f23063a3a63b08d5bb9c71445b2d9885f8f05
    output: build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
    srclibs:
      - flutter@stable
    prebuild:
      - flutterVersion=$(sed -n -E "s/.*flutter-version:\ '(.*)'/\1/p" .github/workflows/build.yml)
      - '[[ $flutterVersion ]]'
      - git -C $$flutter$$ checkout -f $flutterVersion
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get --enforce-lockfile
    scandelete:
      - .pub-cache
    build:
      - export ORIGDIR=$(pwd)
      - export FIXEDDIR=/home/vagrant/build/com.vitexsoftware.zabb
      - if [ "$ORIGDIR" != "$FIXEDDIR" ]; then rm -rf $FIXEDDIR; mkdir -p $(dirname
        $FIXEDDIR); cd ..; mv $ORIGDIR $FIXEDDIR; fi
      - cd $FIXEDDIR
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter build apk --release --split-per-abi --target-platform="android-arm"
      - if [ "$ORIGDIR" != "$FIXEDDIR" ]; then cd ..; mv $FIXEDDIR $ORIGDIR; fi

