AutoName: Zabb

RepoType: git
Repo: https://github.com/VitexSoftware/Zabb.git

Builds:
  - versionName: 0.6.2
    versionCode: 2
    commit: 766e6d4422aa4be9ba161128d22016ab08d7d2de
    output: build/app/outputs/flutter-apk/app-release.apk
    srclibs:
      - flutter@stable
    rm:
      - debian-package
      - linux
      - web
    prebuild:
      - flutterVersion=$(sed -n -E "s/.*flutter-version:\ '(.*)'/\1/p" .github/workflows/build.yml)
      - '[[ $flutterVersion ]]'
      - git -C $$flutter$$ checkout -f $flutterVersion
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get --enforce-lockfile
    scandelete:
      - .pub-cache
    build:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter build apk

  - versionName: 0.6.3
    versionCode: 3
    commit: 616de637f1f52a4cbb2c7cbbc53076e0641fedf3
    output: build/app/outputs/flutter-apk/app-release.apk
    srclibs:
      - flutter@stable
    rm:
