Categories:
  - Internet
  - System
License: MIT
AutoName: Zabb
AuthorName: Vítězslav Dvořák
AuthorEmail: info@vitexsoftware.com
WebSite: https://github.com/VitexSoftware/Zabb
SourceCode: https://github.com/VitexSoftware/Zabb
IssueTracker: https://github.com/VitexSoftware/Zabb/issues
Changelog: https://github.com/VitexSoftware/Zabb/releases

RepoType: git
Repo: https://github.com/VitexSoftware/Zabb.git

Builds:
  - versionName: '0.6.2'
    versionCode: 2
    commit: 49f8781584da0090416497160bce579f6c9029cc
    output: build/app/outputs/flutter-apk/app-release.apk
    srclibs:
      - flutter@stable
    rm:
      - debian-package
      - linux
      - web
    prebuild:
      - flutterVersion=$(sed -n -E "s/.*flutter-version:\ '(.*)'/\1/p" .github/workflows/build.yml)
      - '[[ $flutterVersion ]]'
      - git -C $$flutter$$ checkout -f $flutterVersion
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get --enforce-lockfile
    scandelete:
      - .pub-cache
    build:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter build apk

AutoUpdateMode: Version
UpdateCheckMode: Tags
UpdateCheckData: pubspec.yaml|version:\s(.+)\+(\d+)|.|version:\s(.+)\+
CurrentVersion: '0.6.2'
CurrentVersionCode: 2
