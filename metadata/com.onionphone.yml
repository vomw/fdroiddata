AutoName: OnionPhone

Description: |
  Encrypted voice calls over Tor onion services.

  OnionPhone provides end-to-end encrypted push-to-talk voice communication
  routed through the Tor network using .onion hidden service addresses.
  No phone numbers, no accounts, no metadata — just direct peer-to-peer
  encrypted voice over Tor.

  Features:
  * Push-to-talk encrypted voice calls over Tor
  * AES-256-CBC / ChaCha20 encryption with HMAC authentication
  * Opus audio codec with configurable bitrate
  * In-call text messaging
  * QR code scanning for .onion addresses
  * Voice effects (deep, high, echo, custom)
  * Listen for incoming calls in the background
  * Pluggable transport support (obfs4, meek, snowflake)
  * No accounts, phone numbers, or central servers required

