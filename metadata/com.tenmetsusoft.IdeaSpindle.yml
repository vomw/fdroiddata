Categories:
  - Graphics

License: MIT
SourceCode: https://github.com/WDTPk62BeZ/IdeaSpindle
IssueTracker: https://github.com/WDTPk62BeZ/IdeaSpindle/issues

AutoName: IdeaSpindle

RepoType: git
Repo: https://github.com/WDTPk62BeZ/IdeaSpindle

Builds:
  - versionName: 1.0.0
    versionCode: 1
    commit: V1.0.0        # タグ名 or コミットハッシュ
    subdir: android
    sudo:
      - apt-get install -y nodejs npm
    init:
      - cd ../.. 
      - npm ci
      - npx expo prebuild --platform android --non-interactive
      - cd android/app
    build:
      - ./gradlew assembleRelease

AutoUpdateMode: None
UpdateCheckMode: None
