AntiFeatures:
  NonFreeNet:
    en-US: >-
      Optional discovery and download features fetch works from Archive of Our
      Own, Royal Road and Scribble Hub, and book metadata from Goodreads. Royal
      Road, Scribble Hub and Goodreads run proprietary server software. The
      library, reader and file import work fully offline without any of them.
