WebSite: https://itsmaxyd.github.io/fillup/
SourceCode: https://github.com/itsmaxyd/fillup
IssueTracker: https://github.com/itsmaxyd/fillup/issues
Donate: https://buymeacoffee.com/maxdemon

RepoType: git
Repo: https://github.com/itsmaxyd/fillup.git

AutoName: FillUp


Builds:
  - versionName: '1.0.8'
    versionCode: 9
    commit: v1.0.8
    output: build/app/outputs/flutter-apk/app-release.apk
    srclibs:
      - flutter@3.35.0
    prebuild:
      - sed -i -e '/java.home/d' android/gradle.properties
      - echo "configurations.all { exclude group: 'com.google.android.play', module: 'core'; exclude group: 'com.google.android.play', module: 'feature-delivery' }" >> android/app/build.gradle
      - export PUB_CACHE=$(pwd)/.pub-cache
      - export PATH="$$flutter$$/bin:$PATH"
      - flutter config --no-analytics
      - flutter pub get
    scandelete:
      - .pub-cache
    build:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - export PATH="$$flutter$$/bin:$PATH"
      - flutter build apk --release --target-platform="android-arm64"

AutoUpdateMode: Version
UpdateCheckMode: Tags
VercodeOperation:
  - '%c * 10 + 1'
  - '%c * 10 + 2'
  - '%c * 10 + 3'
UpdateCheckData: pubspec.yaml|version:\s.+\+(\d+)|.|version:\s(.+)\+
CurrentVersion: '1.0.8'
CurrentVersionCode: 9
