Categories:
  - Money

License: GPL-3.0-or-later

WebSite: https://itsmaxyd.github.io/fillup/
SourceCode: https://github.com/itsmaxyd/fillup
IssueTracker: https://github.com/itsmaxyd/fillup/issues
Donate: https://buymeacoffee.com/maxdemon

Repo: https://github.com/itsmaxyd/fillup.git

AutoName: FillUp
Summary: Fuel expense and mileage tracking app
Description: A fuel tracking app for monitoring fuel spends and efficiency

AuthorName: Max Demon
AuthorEmail: maxdemon@outlook.com

Builds:
  - versionName: '1.0.8'
    versionCode: 9
    commit: v1.0.9
    output: build/app/outputs/flutter-apk/app-release.apk
    srclibs:
      - flutter@3.35.0
    rm:
      - ios
      - linux
      - macos
      - web
      - windows
    prebuild:
      - flutterVersion=$(sed -n -E "s/.*flutter-version:\ '(.*)'/\1/p" .github/workflows/release.yml)
      - '[[ $flutterVersion ]]'
      - git -C $$flutter$$ checkout -f $flutterVersion
      - export PUB_CACHE=$(pwd)/.pub-cache
      - .flutter/bin/flutter config --no-analytics
      - .flutter/bin/flutter pub get
    scanignore:
      - .flutter/bin/cache
    scandelete:
      - .flutter
      - .pub-cache
    build:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - .flutter/bin/flutter build apk --release --split-per-abi --target-platform="android-arm64"

AutoUpdateMode: Version
UpdateCheckMode: Tags
VercodeOperation:
  - '%c * 10 + 1'
  - '%c * 10 + 2'
  - '%c * 10 + 3'
UpdateCheckData: pubspec.yaml|version:\s.+\+(\d+)|.|version:\s(.+)\+
CurrentVersion: '1.0.8'
CurrentVersionCode: 9
