Builds:
  - versionName: 0.8.42
    versionCode: 800420
    commit: 72cd8d067297cf8ba59da997f03f9b5979aa3dd1
    subdir: warpdroid/app
    sudo:
      - apt-get update
      - apt-get install -y gcc libc-dev make golang-go
    gradle:
      - yes
    srclibs:
      - go@go1.26.3
    prebuild: sdkmanager "platforms;android-21"
    scandelete:
      - vendor
    build:
      - pushd $$go$$/src
      - GOROOT_BOOTSTRAP="$(go env GOROOT)" ./make.bash && popd
      - export GOROOT="$$go$$"
      - export PATH="$$go$$/bin:$PATH"
      - cd ../..
      - go mod download
      - cd warpdroid/node
      - bash build-native.sh
    ndk: r27c

