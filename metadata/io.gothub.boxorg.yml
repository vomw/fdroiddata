Categories:
  - Inventory
License: MIT
AuthorName: Vincenz Koop
AuthorEmail: info@gothub.io
WebSite: https://boxorg.app
SourceCode: https://codeberg.org/anderslum/boxorg
IssueTracker: https://codeberg.org/anderslum/boxorg/issues
Changelog: https://codeberg.org/anderslum/boxorg/releases

AutoName: boxorg

RepoType: git
Repo: https://codeberg.org/anderslum/boxorg.git

Builds:
  - versionName: 1.0.1
    versionCode: 5
    commit: fda2877def8cfee494f6c93f1ead976c04dd315a
    sudo:
      - echo "deb https://deb.debian.org/debian forky main" > /etc/apt/sources.list.d/forky.list
      - apt-get update
      - apt-get install -y -t forky nodejs npm
      - npm install -g pnpm@11
    init:
      - pnpm install --frozen-lockfile
      - IZZY_BUILD=1 npx expo prebuild --platform android --no-install
    output: android/app/build/outputs/apk/release/*.apk
    scanignore:
      - node_modules/.pnpm/react-native@*/node_modules/react-native/sdks/hermesc
      - node_modules/.pnpm/react-native@*/node_modules/react-native/ReactAndroid/publish.gradle
      - node_modules/.pnpm/expo-modules-core@*/node_modules/expo-modules-core/android/ExpoModulesCorePlugin.gradle
      - node_modules/.pnpm/expo-modules-autolinking@*/node_modules/expo-modules-autolinking/scripts/android/autolinking_implementation.gradle
      - node_modules/.pnpm/react-native-screens@*/node_modules/react-native-screens/android/build.gradle
      - node_modules/.pnpm/react-native-svg@*/node_modules/react-native-svg/android/build.gradle
      - node_modules/.pnpm/react-native-safe-area-context@*/node_modules/react-native-safe-area-context/android/build.gradle
      - node_modules/.pnpm/react-native-webview@*/node_modules/react-native-webview/android/build.gradle
      - node_modules/.pnpm/react-native-keyboard-controller@*/node_modules/react-native-keyboard-controller/android/build.gradle
      - node_modules/.pnpm/@react-native-masked-view+masked-view@*/node_modules/@react-native-masked-view/masked-view/android/build.gradle
    scandelete:
      - node_modules
    build:
      - cd android/app
      - gradle assembleRelease
    ndk: r27b

AutoUpdateMode: Version
UpdateCheckMode: Tags ^v
UpdateCheckData: app.config.js|versionCode:\s*(\d+)|.|version:\s*'([\d.]+)'
CurrentVersion: 1.0.1
CurrentVersionCode: 5
