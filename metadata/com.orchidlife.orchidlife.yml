Categories:
  -Science & Education
License: GPL-3.0-or-later
AuthorName: AllStarPlumberBob
SourceCode: https://github.com/AllStarPlumberBob/OrchidLife-public
IssueTracker: https://github.com/AllStarPlumberBob/OrchidLife-public/issues

AutoName: OrchidLife

RepoType: git
Repo: https://github.com/AllStarPlumberBob/OrchidLife-public.git

Builds:
- versionName: 1.0.0
  versionCode: 1
  commit: 48b4c085e23de8c934d8f90b9d2db4daa4c16fb2
  output: build/app/outputs/flutter-apk/app-release.apk
  srclibs:
    - flutter@stable
  rm:
    - ios
    - linux
    - macos
    - web
    - windows
  prebuild:
    - flutterVersion=$(cat .flutter-version)
    - '[[ $flutterVersion ]]'
    - git -C $$flutter$$ checkout -f $flutterVersion
    - export PUB_CACHE=$(pwd)/.pub-cache
    - $$flutter$$/bin/flutter config --no-analytics
    - $$flutter$$/bin/flutter pub get
  scandelete: 
    - .pub-cache
  build:
    - export PUB_CACHE=$(pwd)/.pub-cache
    - $$flutter$$/bin/flutter build apk

AutoUpdateMode: Version
UpdateCheckMode: Tags
UpdateCheckData: pubspec.yaml|version:\s.+\+(\d+)|.|version:\s(.+)\+
CurrentVersion: 1.0.0
CurrentVersionCode: 1