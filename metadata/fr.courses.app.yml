Summary: Simple private shopping list
Description: |-
    Courses is a free and open-source Android app for everyday grocery lists.

    Features:
    * Quickly add items
    * Check items off as you shop
    * Delete individual items
    * Clear checked items
    * Local on-device storage

    No account is required and no proprietary services are used.

