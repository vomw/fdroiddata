Builds:
  - versionName: 0.4.3
    versionCode: 5
    commit: b7b3f2fc273768b473f9aae1013995737663df84
    subdir: android
    sudo:
      - apt-get update
      - apt-get install -y nodejs npm
    init: npm install --legacy-peer-deps
    prebuild:
      - sed -i '/apply from.*sentry.gradle/d' app/build.gradle
      - find ../node_modules/@react-native/gradle-plugin -name '*.kts' -exec sed -i 's/jvmToolchain(17)/jvmToolchain(21)/g' {} +
      - sed -i 's/kotlin.jvmToolchain(17)/kotlin.jvmToolchain(21)/g' ../node_modules/expo-modules-core/android/ExpoModulesCorePlugin.gradle
      - sed -i 's/jvmToolchain(17)/jvmToolchain(21)/g;s/VERSION_17/VERSION_21/g' ../node_modules/@react-native/gradle-plugin/react-native-gradle-plugin/src/main/kotlin/com/facebook/react/utils/JdkConfiguratorUtils.kt
      - printf '\nkotlin.jvm.target.validation.mode=warning\n' >> gradle.properties
    scandelete:
      - node_modules/expo-application/local-maven-repo
      - node_modules/expo-clipboard/local-maven-repo
      - node_modules/expo-crypto/local-maven-repo
      - node_modules/expo-device/local-maven-repo
      - node_modules/expo-image-loader/local-maven-repo
      - node_modules/expo-image-manipulator/local-maven-repo
      - node_modules/expo-image-picker/local-maven-repo
      - node_modules/expo-linking/local-maven-repo
      - node_modules/expo-local-authentication/local-maven-repo
      - node_modules/expo-notifications/local-maven-repo
      - node_modules/expo-secure-store/local-maven-repo
      - node_modules/expo/node_modules/expo-asset/local-maven-repo
      - node_modules/expo/node_modules/expo-file-system/local-maven-repo
      - node_modules/expo/node_modules/expo-font/local-maven-repo
      - node_modules/expo/node_modules/expo-keep-awake/local-maven-repo
      - node_modules/@sentry/cli-linux-x64
      - node_modules/expo/template.tgz
      - node_modules/react-native/React/I18n/strings
      - node_modules/react-native/sdks/hermesc/osx-bin
      - node_modules/react-native/sdks/hermesc/win64-bin
    scanignore:
      - node_modules/expo-modules-autolinking/scripts/android/autolinking_implementation.gradle
      - node_modules/expo-modules-core/android/ExpoModulesCorePlugin.gradle
      - node_modules/react-native-safe-area-context/android/build.gradle
      - node_modules/react-native-svg/android/build.gradle
      - node_modules/react-native-screens/android/build.gradle
      - node_modules/react-native/ReactAndroid/publish.gradle
      - node_modules/expo-notifications/android/build.gradle
      - node_modules/expo-application/android/build.gradle
      - node_modules/react-native/sdks/hermesc/linux64-bin
    gradle:
      - yes
    output: app/build/outputs/apk/release/*.apk
    ndk: 27.1.12297006

