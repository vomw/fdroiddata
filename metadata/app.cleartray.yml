AutoName: Trayzero

RepoType: git
Repo: https://github.com/roman10/trayzero.git

Builds:
  - versionName: 1.0.2
    versionCode: 1034
    commit: ac48e83ce52233a8aedb5f225fd8090b8a27bdc5
    submodules: true
    output: build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
    rm:
      - ios
    prebuild:
      - bash tool/foss/strip.sh
      - export PUB_CACHE=$(pwd)/.pub-cache
      - submodules/flutter/bin/flutter config --no-analytics
      - submodules/flutter/bin/flutter pub get
    scanignore:
      - submodules/flutter/bin/cache
    scandelete:
      - submodules/flutter
      - .pub-cache
    build:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - submodules/flutter/bin/flutter build apk --release --split-per-abi 
        --target-platform=android-arm

