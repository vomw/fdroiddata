AuthorName: Liu Feipeng
SourceCode: https://github.com/roman10/trayzero
IssueTracker: https://github.com/roman10/trayzero/issues
Changelog: https://github.com/roman10/trayzero/releases

AutoName: Trayzero

RepoType: git
Repo: https://github.com/roman10/trayzero.git

Builds:
  - versionName: 1.0.2
    versionCode: 34
    commit: ac48e83ce52233a8aedb5f225fd8090b8a27bdc5
    submodules: true
    output: build/app/outputs/flutter-apk/app-release.apk
    rm:
      - ios
    prebuild:
      - bash tool/foss/strip.sh
      - sed -i 's/includeInApk = !project.hasProperty("fdroid")/includeInApk = false/'
        android/app/build.gradle.kts
      - export PUB_CACHE=$(pwd)/.pub-cache
      - submodules/flutter/bin/flutter config --no-analytics
      - submodules/flutter/bin/flutter pub get
    scanignore:
      - submodules/flutter/bin/cache
    scandelete:
      - submodules/flutter
      - .pub-cache
    build:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - submodules/flutter/bin/flutter build apk --release

AutoUpdateMode: Version
UpdateCheckMode: Tags
UpdateCheckData: pubspec.yaml|version:\s.+\+(\d+)|.|version:\s(.+)\+
CurrentVersion: 1.0.2
CurrentVersionCode: 34
