AutoName: DroidOS Trackpad
Summary: Keyboard and trackpad overlay for DroidOS workflows
Description: |-
    DroidOS Trackpad is a FOSS input companion for DroidOS Launcher.

    It provides a floating keyboard and precision touchpad overlay intended for
    multitasking workflows like external displays, AR displays, and cover screens.

    Features include:
    - Trackpad-style pointer control
    - Keyboard overlay input (with modifier keys)
    - Profiles/presets for different setups

    Documentation and source:
    https://github.com/Katsuyamaki/DroidOS

