AutoName: Lumine

RepoType: git
Repo: https://github.com/UjuiUjuMandan/lumine-for-android

Builds:
  - versionName: 0.1.3
    versionCode: 131
    commit: 011d4654da092e8fd31f35bc51f0d4623f00c5b1
    subdir: android/app
    sudo:
      - apt-get update
      - apt-get install -y golang-go
    gradle:
      - yes
    binary: 
      https://github.com/SniShaper/lumine-for-android/releases/download/v%v/lumine-v%v-app-arm64-v8a-release.apk
    srclibs:
      - go@go1.24.3
    prebuild:
      - export ANDROID_API_LEVEL=$(sed -E -n "s/.*ANDROID_API_LEVEL.*'(.*)'.*/\1/p"
        ../../.github/workflows/android-release.yml)
      - export ANDROID_BUILD_TOOLS=$(sed -E -n "s/.*ANDROID_BUILD_TOOLS.*'(.*)'.*/\1/p"
        ../../.github/workflows/android-release.yml)
      - export ANDROID_NDK_VERSION=$(sed -E -n "s/.*ANDROID_NDK_VERSION.*'(.*)'.*/\1/p"
        ../../.github/workflows/android-release.yml)
      - sdkmanager "platform-tools" "platforms;android-${ANDROID_API_LEVEL}" "build-tools;${ANDROID_BUILD_TOOLS}"
        "ndk;${ANDROID_NDK_VERSION}"
      - git -C $$go$$ checkout -f go$(sed -n -E 's/^go (.*)/\1/p' ../../go.mod)
    build:
      - pushd $$go$$/src
      - ./make.bash
      - popd
      - export GOPATH=$$go$$
      - export PATH="$GOPATH/bin:$PATH"
      - pushd ../../
      - export GOFLAGS=-mod=mod
      - go install golang.org/x/mobile/cmd/gomobile@latest
      - gomobile init
      - go mod download
      - mkdir -p android/app/libs
      - export GOMOBILE_ANDROID_API=$(sed -E -n "s/.*GOMOBILE_ANDROID_API.*'(.*)'.*/\1/p"
        .github/workflows/android-release.yml)
      - gomobile bind -target "android/arm64" -androidapi $GOMOBILE_ANDROID_API -o
        android/app/libs/LumineCore.aar -ldflags="-buildid=" -trimpath -buildvcs=false
        ./mobile
      - popd
    gradleprops:
      - ABI_FILTER=arm64-v8a

