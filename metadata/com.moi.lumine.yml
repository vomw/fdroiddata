AutoName: Lumine

RepoType: git
Repo: https://github.com/SniShaper/lumine-for-android

Builds:
  - versionName: '1.0'
    versionCode: 1
    commit: 8266d67cfd11be73df4b3131524e954a4b7b6382
    subdir: android/app
    sudo:
      - apt-get update
      - apt-get install -y golang-go
    gradle:
      - yes
    srclibs:
      - go@go1.24.3
    prebuild: git -C $$go$$ checkout -f go$(sed -n -E 's/^go (.*)/\1/p' ../../go.mod)
    build:
      - pushd $$go$$/src
      - ./make.bash
      - popd
      - export GOPATH=$$go$$
      - export PATH="$GOPATH/bin:$PATH"
      - go install golang.org/x/mobile/cmd/gomobile@latest
      - gomobile init
      - export GOFLAGS=-mod=mod
      - go mod download
      - mkdir -p android/app/libs
      - export GOMOBILE_ANDROID_API=$(sed -E -n "s/.*GOMOBILE_ANDROID_API.*'(.*)'.*/\1/p"
        .github/workflows/android-release.yml)
      - gomobile bind -target=android -androidapi $GOMOBILE_ANDROID_API -o android/app/libs/LumineCore.aar
        ./mobile
    ndk: 30.0.14904198

AutoUpdateMode: Version
UpdateCheckMode: Tags
CurrentVersionCode: 1
