AntiFeatures:
  - NonFreeNet
  - NSFW
Categories:
  - Multimedia
  - Reading
License: Apache-2.0
AuthorEmail: jiangtian616@qq.com
SourceCode: https://github.com/jiangtian616/JHenTai
IssueTracker: https://github.com/jiangtian616/JHenTai/issues

AutoName: JHenTai
Description: A flutter app for E-Hentai/EXHentai

RepoType: git
Repo: https://github.com/jiangtian616/JHenTai

Builds:
  - versionName: 8.0.8
    versionCode: 295
    commit: 1da32e3075fced5db868bbf1eac7c51fb6751957
    output: build/app/outputs/flutter-apk/app-release.apk
    srclibs:
      - flutter@3.24.4
    rm:
      - ios
      - linux
      - macos
      - windows
    prebuild:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter config --no-analytics
      - git config --global core.longpaths true
      - $$flutter$$/bin/flutter packages pub get
    scandelete:
      - .pub-cache
    build:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter build apk -t lib/src/main.dart --release --split-per-abi

AutoUpdateMode: Version
UpdateCheckMode: Tags
UpdateCheckData: pubspec.yaml|version:\s.+\+(\d+)|.|version:\s(.+)\+
CurrentVersion: 8.0.8
CurrentVersionCode: 295
