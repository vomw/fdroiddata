Builds:
  - versionName: 8.0.8
    versionCode: 1295
    commit: 1da32e3075fced5db868bbf1eac7c51fb6751957
    output: build/app/outputs/apk/release/app-armeabi-v7a-release.apk
    srclibs:
      - flutter@3.24.4
    rm:
      - ios
      - linux
      - macos
      - windows
    prebuild:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter config --no-analytics
      - git config --global core.longpaths true
    scandelete:
      - .pub-cache
    build:
      - $$flutter$$/bin/flutter pub get
      - cat pubspec.lock
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter build apk -t lib/src/main.dart --release --target-platform="android-arm"

