AutoName: Keep

RepoType: git
Repo: https://github.com/privkeyio/keep-android
Binaries: 
  https://github.com/privkeyio/keep-android/releases/download/v%v/keep-android-v%v.apk

Builds:
  - versionName: 1.1.4
    versionCode: 22
    commit: fbaebe7c88c34eddf37960f5a49f0b4ae331a2d0
    sudo:
      - apt-get update
      - apt-get install -y --no-install-recommends pkg-config cmake make ninja-build
        gcc g++ libc6-dev ca-certificates rustup
      - env CARGO_HOME=/opt/cargo RUSTUP_HOME=/opt/rustup rustup toolchain install
        1.89.0 --profile minimal
      - env CARGO_HOME=/opt/cargo RUSTUP_HOME=/opt/rustup rustup default 1.89.0
      - env CARGO_HOME=/opt/cargo RUSTUP_HOME=/opt/rustup rustup target add aarch64-linux-android
        x86_64-linux-android
      - env CARGO_HOME=/opt/cargo RUSTUP_HOME=/opt/rustup cargo install --locked --version
        4.1.2 cargo-ndk
      - chmod -R a+rwX /opt/cargo
      - chmod -R a+rwX /opt/rustup
    output: app/build/outputs/apk/release/app-release.apk
    prebuild:
      - KEEP_SHA="$(tr -d '[:space:]' < keep.version)"
      - rm -rf keep
      - git clone https://github.com/privkeyio/keep.git keep
      - git -C keep checkout "$KEEP_SHA"
      - env CARGO_HOME=/opt/cargo RUSTUP_HOME=/opt/rustup cargo fetch --locked --manifest-path
        keep/Cargo.toml
    build:
      - export CARGO_HOME=/opt/cargo
      - export RUSTUP_HOME=/opt/rustup
      - export JAVA_HOME=/usr/lib/jvm/java-21-openjdk-amd64
      - export PATH=/opt/cargo/bin:$JAVA_HOME/bin:$PATH
      - export AWS_LC_SYS_CMAKE_BUILDER=1
      - export SOURCE_DATE_EPOCH="$(./scripts/derive-sde.sh)"
      - gradle assembleRelease
    ndk: r29

AllowedAPKSigningKeys: 3eb0e6f6f4e0962ebd717f84eea47428b73087b686c956633d6a9fcc4c854f50

