UpdateCheckMode: Tags ^v\d+\.\d+\.\d+\.\d+$
# Mirror app/build.gradle.kts -> buildSrc/Version.kt formula:
#   versionName "yyyy.MM.dd.run" -> vercode (yy*10000 + MM*100 + dd) * 100 + run%100.
# Needed because gradle derives vercode at runtime via git describe.
VercodeOperation:
  - \'(int(%v.split(".")[0]) % 100 * 10000 + int(%v.split(".")[1]) * 100 + int(%v.split(".")[2])) * 100 + int(%v.split(".")[3]) % 100\'
