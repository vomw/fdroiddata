Name: Sudoku

RepoType: git
Repo: https://github.com/likhithpraveenk/sudoku

Builds:
  - versionName: 1.0.1
    versionCode: 21
    commit: 59c87ec636244dcfee50324946d372de9f108c1b
    sudo:
      - mkdir -p /home/runner/work/sudoku
      - chown -R vagrant /home/runner/work
    output: build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
    binary: 
      https://github.com/likhithpraveenk/sudoku/releases/download/v%v/sudoku-v%v-android-armeabi.apk
    srclibs:
      - flutter@stable
    rm:
      - ios
      - windows
      - linux
      - web
      - macos
    prebuild:
      - flutterVersion=$(sed -n -E 's/^[[:space:]]*flutter:[[:space:]]+([0-9]+\.[0-9]+\.[0-9]+)/\1/p'
        pubspec.yaml)
      - '[[ $flutterVersion ]]'
      - git -C $$flutter$$ checkout -f $flutterVersion
      - export repo=/home/runner/work/sudoku/sudoku
      - cd ..
      - mv com.likhithpraveenk.sudoku $repo
      - pushd $repo
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get --enforce-lockfile
      - sed -i -e 's/-Wl,/-Wl,--build-id=none,/' ${PUB_CACHE}/hosted/*/jni-*/src/CMakeLists.txt
      - popd
      - mv $repo com.likhithpraveenk.sudoku
    scandelete:
      - .pub-cache
    build:
      - export repo=/home/runner/work/sudoku/sudoku
      - cd ..
      - mv com.likhithpraveenk.sudoku $repo
      - pushd $repo
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter build apk --release --split-per-abi --target-platform=android-arm
      - popd
      - mv $repo com.likhithpraveenk.sudoku

