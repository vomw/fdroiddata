AutoName: StudyDesk
Summary: Know what to study next — a decision-eliminating study tracker

Description: |-
  StudyDesk is a study execution app for students. Enter your courses and
  deadlines; the Next Up engine ranks what to do right now. Organise courses
  by school year and period (jakso), review a read-only Period History with
  per-period GPA, grade on IB and GPA scales, focus with a built-in Pomodoro,
  and get an optional AI study debrief after a session.

  Warm paper aesthetic. Local-first; optional account-gated cloud sync. No
  Google Play Services — Google sign-in is a plain web OAuth flow.

  Part of the Limecore Nexus suite.

