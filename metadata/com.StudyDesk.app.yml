# F-Droid metadata for StudyDesk — READY FOR SUBMISSION (2026-06-27).
# FD-1 Fastlane metadata present (6 locales). FD-2 gradle wrapper SHA present.
# FD-3 FOSS audit PASS (no GMS). LICENSE MIT in repo root.
Categories:
  - Science & Education
License: MIT
AuthorName: Emil Hongisto (Limekana)
SourceCode: https://github.com/Limekana/StudyDesk
IssueTracker: https://github.com/Limekana/StudyDesk/issues

AutoName: StudyDesk

RepoType: git
Repo: https://github.com/Limekana/StudyDesk.git

Builds:
  - versionName: 1.5.1
    versionCode: 10
    commit: 7b11dad449844e3bb202fd909a265bf39424c13c
    subdir: android/app
    sudo:
      # Capacitor 8 CLI requires Node >=22; the buildserver ships Node 20.
      # Install pinned official Node 22 LTS (verified by SHA256) into /usr/local.
      - apt-get update
      - apt-get install -y curl xz-utils
      - curl -Lo /tmp/node.tar.xz https://nodejs.org/dist/v22.23.1/node-v22.23.1-linux-x64.tar.xz
      - echo "9749e988f437343b7fa832c69ded82a312e41a03116d766797ac14f6f9eee578  /tmp/node.tar.xz" | sha256sum -c -
      - tar -xJf /tmp/node.tar.xz -C /usr/local --strip-components=1
      - node --version
    # subdir is the app module (where the APK lands), but npm + the Capacitor
    # sync must run from the repo root. init/prebuild each start in subdir, so
    # cd up two levels; keep each list's cd in one entry (entries are joined
    # into a single shell, so a repeated cd would over-climb).
    init:
      - cd ../.. && npm ci
    prebuild:
      - cd ../.. && npm run build && npx cap sync android
    # Delete build-time node tooling before the source scanner runs — these
    # ship prebuilt binaries (esbuild, template tarballs, jars) that the scanner
    # rejects. None are needed by the Gradle build, which only references
    # @capacitor/android + the plugin packages.
    scandelete:
      - node_modules/@capacitor/cli
      - node_modules/@capacitor/assets
      - node_modules/@trapezedev
      - node_modules/@esbuild
      - node_modules/esbuild
      - node_modules/@img
      - node_modules/sharp
    gradle:
      - yes

AntiFeatures:
  - NonFreeNet   # Supabase sync, Google OAuth, AI Edge Function (user-initiated HTTPS)

AutoUpdateMode: Version
UpdateCheckMode: Tags
CurrentVersion: 1.5.1
