Builds:
  - versionName: 1.5.1
    versionCode: 10
    commit: 7b11dad449844e3bb202fd909a265bf39424c13c
    subdir: android/app
    sudo:
      - echo 'deb https://deb.debian.org/debian forky main' > /etc/apt/sources.list.d/forky.list
      - apt-get update
      - apt-get install -y -t forky nodejs npm
    init:
      - cd ../..
      - npm ci
    gradle:
      - yes
    prebuild:
      - cd ../..
      - npm run build
      - npx cap sync android
      - rm -rf node_modules/@capacitor/cli node_modules/@capacitor/assets node_modules/@trapezedev
        node_modules/@esbuild node_modules/esbuild node_modules/@img node_modules/sharp

