    versionCode: 21
    commit: 2.3.8
    subdir: android
    sudo:
      - apt-get update
      - apt-get install -y curl
      - curl -fsSL https://deb.nodesource.com/setup_22.x | bash -
      - apt-get install -y nodejs
    init:
      - cd ..
      - npm install
      - npm run build
      - npx cap sync android
    gradle:
      - yes
    output: app/build/outputs/apk/release/app-release-unsigned.apk
    prebuild: sed -i "s/com.android.tools.build:gradle:9.0.1/com.android.tools.build:gradle:8.9.3/"
      build.gradle
    scandelete:
      - stitch-skills.zip
      - node_modules

