Builds:
  - versionName: 2.1.0
    versionCode: 21
    commit: 3c27948e36f14ec7470b8b401940a7cc563285a7
    sudo:
      - apt-get update
      - apt-get install -y nix-setup-systemd nix
      - chown -R vagrant /nix
    output: wormhole-william-unsigned-aligned.apk
    prebuild:
      - mkdir -p ~/.config/nix
      - echo "experimental-features = nix-command flakes" >> ~/.config/nix/nix.conf
      - sed -i '/--ks/,+3d' Makefile
    build:
      - nix develop -c make init
      - nix develop -c make release

