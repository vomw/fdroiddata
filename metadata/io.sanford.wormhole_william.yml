Builds:
  - versionName: 2.1.0
    versionCode: 21
    commit: 3c27948e36f14ec7470b8b401940a7cc563285a7
    sudo:
      - apt-get update
      - apt-get install -y nix-setup-systemd nix
      - chown -R vagrant /nix
      - mkdir -p /home/psanford
      - chown -R vagrant /home/psanford
    output: wormhole-william-unsigned-aligned.apk
    prebuild:
      - mkdir -p ~/.config/nix
      - echo "experimental-features = nix-command flakes" >> ~/.config/nix/nix.conf
      - sed -i -e '/--ks/,+3d' Makefile
      - sed -i -e 's/\.\/gradlew/gradle/' Makefile
      - sed -i -e "s/-ldflags='/-ldflags='-buildid= /" Makefile
      - sed -i -e "s/bind -v/bind -v -trimpath/" Makefile
    build:
      - export repo=/home/psanford/projects
      - mkdir -p $repo
      - cd ..
      - mv io.sanford.wormhole_william $repo/wormhole-william-mobile
      - pushd $repo/wormhole-william-mobile
      - nix develop -c make init
      - nix develop -c make release
      - popd
      - mv $repo/wormhole-william-mobile io.sanford.wormhole_william

