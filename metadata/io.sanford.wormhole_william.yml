AutoName: Wormhole William

RepoType: git
Repo: https://github.com/psanford/wormhole-william-mobile

Builds:
  - versionName: 2.1.0
    versionCode: 21
    commit: 3c27948e36f14ec7470b8b401940a7cc563285a7
    subdir: android
    sudo:
      - apt-get update
      - apt-get install -y -t trixie nix-setup-systemd nix
      - chown -R vagrant /nix
    gradle:
      - yes
    prebuild:
      - mkdir -p ~/.config/nix
      - echo "experimental-features = nix-command flakes" >> ~/.config/nix/nix.conf
    build:
      - pushd ..
      - nix develop
      - go install golang.org/x/mobile/cmd/gomobile
      - export PATH=$PATH:~/go/bin
      - gomobile init
      - mkdir android/app/libs
      - gomobile bind -v -target=android -androidapi 24 -ldflags='-extldflags=-Wl,-z,max-page-size=16384
        -buildid=' -o android/app/libs/wormhole.aar ./wormhole
      - popd

AutoUpdateMode: Version
UpdateCheckMode: Tags
UpdateCheckData: android/app/build.gradle.kts|versionCode\s=\s(\d+)||v([\d.]+)
CurrentVersion: 2.1.0
CurrentVersionCode: 21
