Builds:
  - versionName: 0.3.4
    versionCode: 7
    commit: b4e4831b3e9ee28e7dec9db999ec9b282c1c65c5
    subdir: app
    submodules: true
    sudo:
      - echo "deb http://deb.debian.org/debian unstable main" > /etc/apt/sources.list.d/unstable.list
      - apt-get update
      - apt-get install -y -t unstable golang-go
      - apt-get install -y gcc libc-dev
      - GO_VER=$(tr -d '\r\n' < build/io.github.hddq.restoid/.go-version)
      - GO_VER=${GO_VER#go}
      - rm -rf /tmp/go-src
      - git clone --depth 1 --branch "go${GO_VER}" https://github.com/golang/go.git /tmp/go-src
      - cd /tmp/go-src/src && GOROOT_BOOTSTRAP=$(go env GOROOT) ./make.bash
      - ln -sf /tmp/go-src/bin/go /usr/bin/go
      - ln -sf /tmp/go-src/bin/gofmt /usr/bin/gofmt
    gradle:
      - Bundled
    output: build/outputs/apk/bundled/release/app-bundled-universal-release-unsigned.apk
    binary: 
      https://github.com/hddq/restoid/releases/download/v%v/app-bundled-universal-release.apk
    prebuild: go version
    scanignore:
      - restic/internal/repository/testdata/test-repo.tar.gz
      - restic/internal/backend/testdata/repo-layout-default.tar.gz
      - restic/internal/checker/testdata/duplicate-packs-in-index-test-repo.tar.gz
      - restic/internal/checker/testdata/checker-test-repo.tar.gz
      - restic/cmd/restic/testdata

