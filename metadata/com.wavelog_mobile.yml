AutoName: Wavelog Mobile

RepoType: git
Repo: https://github.com/MaviKulubeliAdam/Wavelog-Mobile.git

Builds:
  - versionName: 3.2.3
    versionCode: 841
    commit: 4af7503c9091d398a907c0172c5d7c2495eff1c2
    sudo:
      - mkdir -p /build
      - chown -R vagrant /build
    output: build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
    binary: 
      https://github.com/MaviKulubeliAdam/Wavelog-Mobile/releases/download/v%v/app-armeabi-v7a-release.apk
    srclibs:
      - flutter@stable
    prebuild:
      - export repo=/build/com.wavelog_mobile
      - flutterVersion=$(sed -n -E "s/.*flutter-version:\ '(.*)'/\1/p" .github/workflows/release.yml)
      - '[[ $flutterVersion ]]'
      - git -C $$flutter$$ checkout -f $flutterVersion
      - cd ..
      - mv com.wavelog_mobile $repo
      - pushd $repo
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get --enforce-lockfile
      - popd
      - mv $repo com.wavelog_mobile
    scandelete:
      - .pub-cache
    build:
      - export repo=/build/com.wavelog_mobile
      - cd ..
      - mv com.wavelog_mobile $repo
      - pushd $repo
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter build apk --release --split-per-abi --target-platform="android-arm"
      - popd
      - mv $repo com.wavelog_mobile

