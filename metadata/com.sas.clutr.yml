AutoName: Clutr
Summary: Swipe to clean up your phone storage
Description: |-
  Clutr deeply scans your local storage to find large media folders, old videos,
  and duplicated files eating up your space.

  Instead of a boring file manager, Clutr uses a fun gesture-based swiping
  interface. Swipe left to trash an unwanted photo or video, swipe right to keep
  it.

  Features include a detailed storage breakdown, visual charts of your heaviest
  folders, and automatic duplicate detection. Files are processed completely
  offline with no data leaving your device.

