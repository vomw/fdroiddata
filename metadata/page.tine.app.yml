Builds:
  - versionName: 0.5.10
    versionCode: 5010
    commit: 4f49d32bc5f70a0694b3cd06f59ebe97ccda3acd
    sudo:
      - apt-get update
      - apt-get install -y nodejs npm binaryen gcc make libc-dev rustup
    output:
      src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release-unsigned.apk
    prebuild: sed -i 's/"identifier": "page.tine.Tine"/"identifier": "page.tine.app"/' src-tauri/tauri.conf.json
    build:
      - rustup default 1.96.0
      - export PATH="$HOME/.cargo/bin:$PATH"
      - cargo install wasm-pack --version 0.15.0 --locked
      - rustup target add aarch64-linux-android wasm32-unknown-unknown
      - npm ci
      - npm run build:wasm
      - ./node_modules/.bin/tauri android build --target aarch64 --apk
    ndk: 26.3.11579264

