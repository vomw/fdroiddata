RepoType: git
Repo: https://github.com/GnosiWorks/Kryfo.git

Builds:
  - versionName: 0.1.0-alpha
    versionCode: 1
    commit: 160f96812a21f6f09498a73ee524aa83e83c8860
    subdir: mobile
    sudo:
      - apt-get update
      - apt-get install -y --no-install-recommends ca-certificates curl golang-go
      - curl -fsSL https://go.dev/dl/go1.25.0.src.tar.gz -o /tmp/go-src.tgz
      - echo "4bd01e91297207bfa450ea40d4d5a93b1b531a5e438473b2a06e18e077227225  /tmp/go-src.tgz"
        | sha256sum -c -
      - tar -C /opt -xzf /tmp/go-src.tgz
      - rm /tmp/go-src.tgz
      - bash -c 'cd /opt/go/src && GOROOT_BOOTSTRAP=$(go env GOROOT) ./make.bash'
      - chown -R vagrant /opt/go
    output: build/app/outputs/flutter-apk/app-release.apk
    srclibs:
      - flutter@3.41.7
    rm:
      - mobile/ios
      - mobile/linux
      - mobile/macos
      - mobile/web
      - mobile/windows
    prebuild:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get --enforce-lockfile
    scanignore:
      - $$flutter$$/bin/cache
    scandelete:
      - .pub-cache
    build:
      - export PATH=/opt/go/bin:$PATH
      - export PUB_CACHE=$(pwd)/.pub-cache
      - export ANDROID_NDK_HOME=$$NDK$$
      - export CGO_ENABLED=1
      - export GOFLAGS=-trimpath
      - export SOURCE_DATE_EPOCH=1700000000
      - export CGO_LDFLAGS="-Wl,--build-id=none"
      - cd ../engine && bash build.sh
      - cd ../mobile
      - $$flutter$$/bin/flutter build apk --release --target-platform android-arm64
    ndk: r28b

AutoUpdateMode: Version v%v
UpdateCheckMode: Tags
CurrentVersion: 0.1.0-alpha
CurrentVersionCode: 1
