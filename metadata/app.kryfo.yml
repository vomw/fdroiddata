AutoName: Kryfo

RepoType: git
Repo: https://github.com/GnosiWorks/Kryfo.git

Builds:
  - versionName: 0.2.0
    versionCode: 22
    commit: bac1a7b268331333682a5f89fea199060023d2ed
    subdir: mobile
    sudo:
      - echo 'deb http://deb.debian.org/debian trixie-backports main' > /etc/apt/sources.list.d/backports.list
      - apt-get update
      - apt-get install -y --no-install-recommends -t trixie-backports golang-go
    output: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
    srclibs:
      - flutter@3.41.7
      - go@go1.25.0
    rm:
      - mobile/ios
      - mobile/linux
      - mobile/macos
      - mobile/web
      - mobile/windows
    prebuild:
      - git -C $$go$$ checkout -f go1.25.0
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get --enforce-lockfile
    scanignore:
      - mobile/.pub-cache
      - engine/vendor/gitlab.com/yawning/edwards25519-extra/h2c/testdata
      - engine/vendor/github.com/bytedance/sonic/testdata
      - engine/vendor/github.com/alexballas/go-libtor/linux/tor/src/ext/equix/Cargo.toml
    build:
      - pushd $$go$$/src
      - ./make.bash
      - popd
      - export GOROOT=$$go$$
      - export PATH=$GOROOT/bin:$PATH
      - export ANDROID_NDK_HOME=$$NDK$$
      - export PUB_CACHE=$(pwd)/.pub-cache
      - export CGO_ENABLED=1
      - export GOFLAGS=-trimpath
      - export SOURCE_DATE_EPOCH=1700000000
      - export CGO_LDFLAGS="-Wl,--build-id=none"
      - cd ../engine && bash build.sh
      - cd ../mobile
      - $$flutter$$/bin/flutter build apk --release --split-per-abi --target-platform=android-arm64
    ndk: r28c

