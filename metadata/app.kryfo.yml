Builds:
  - versionName: 0.1.0-alpha
    versionCode: 1
    commit: 160f96812a21f6f09498a73ee524aa83e83c8860
    subdir: mobile
    sudo:
      - apt-get update
      - apt-get install -y --no-install-recommends ca-certificates curl unzip
      - curl -fsSL https://go.dev/dl/go1.25.0.linux-amd64.tar.gz -o /tmp/go.tgz
      - echo "2852af0cb20a13139b3448992e69b868e50ed0f8a1e5940ee1de9e19a123b613  /tmp/go.tgz"
        | sha256sum -c -
      - rm -rf /usr/local/go
      - tar -C /usr/local -xzf /tmp/go.tgz
      - rm /tmp/go.tgz
      - curl -fsSL https://dl.google.com/android/repository/android-ndk-r28b-linux.zip
        -o /tmp/ndk.zip
      - echo "e9f2759862cecfd48c20bbb7d8cfedbb020f4d91b5f78d9a2fc106f7db3c27ed  /tmp/ndk.zip"
        | sha256sum -c -
      - unzip -q /tmp/ndk.zip -d /opt
      - rm /tmp/ndk.zip
    output: build/app/outputs/flutter-apk/app-release.apk
    srclibs:
      - flutter@3.41.7
    prebuild:
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get
    build: "set -e\nexport PATH=/usr/local/go/bin:$PATH\nexport ANDROID_NDK_HOME=/opt/android-ndk-r28b\n\
      # deterministic engine build - flags mirror repro/build-repro.sh\nexport CGO_ENABLED=1\n\
      export GOFLAGS=-trimpath\nexport SOURCE_DATE_EPOCH=1700000000\nexport CGO_LDFLAGS=\"\
      -Wl,--build-id=none\"\ncd ../engine && bash build.sh\ncd ../mobile\n$$flutter$$/bin/flutter\
      \ build apk --release \\\n  --target-platform android-arm64,android-x64\n"

AutoUpdateMode: Version v%v
UpdateCheckMode: Tags
