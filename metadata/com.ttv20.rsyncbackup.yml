AntiFeatures:
  NonFreeNet:
    en-US: Optional Tailscale use connects to Tailscale coordination services. LAN-only
      backup does not require Tailscale.
Categories:
  - Connectivity
  - System
License: GPL-3.0-or-later
AuthorName: ttv20
SourceCode: https://codeberg.org/ttv20/PocketBackup
IssueTracker: https://codeberg.org/ttv20/PocketBackup/issues
Changelog: https://codeberg.org/ttv20/PocketBackup/releases

Name: Pocket Backup
AutoName: Pocket Backup

RepoType: git
Repo: https://codeberg.org/ttv20/PocketBackup.git

Builds:
  - versionName: 1.0.0-beta.2
    versionCode: 11
    commit: v1.0.0-beta.2
    timeout: 7200
    subdir: app
    sudo:
      - echo "deb http://deb.debian.org/debian forky main" > /etc/apt/sources.list.d/forky.list
      - apt-get update
      - apt-get install -y --no-install-recommends autoconf automake bison build-essential
        cmake file flex gawk gettext git jq libtool lzip meson ninja-build patch perl
        pkg-config python3-pip ruby rsync texinfo unzip wget xz-utils zstd
      - apt-get install -y -t forky --no-install-recommends golang-go
      - mkdir -p /data
      - chown vagrant:vagrant /data
    gradle:
      - fdroid
    srclibs:
      - go@go1.26.4
    prebuild: ../scripts/fdroid-scan-source.sh
    scandelete:
      - app/src/sideload
    build:
      - pushd $$go$$/src
      - GOROOT_BOOTSTRAP=/usr/lib/go ./make.bash
      - popd
      - export GOROOT=$$go$$
      - export GOPATH="$HOME/go"
      - export PATH="$GOROOT/bin:$GOPATH/bin:$PATH"
      - export ANDROID_NDK_ROOT=$$NDK$$
      - export FDROID_NATIVE_TOOLCHAIN_MODE=copy
      - ../scripts/build-fdroid-native-termux.sh --termux-mode host
    ndk: 29.0.14206865
    gradleprops:
      - pocketbackup.officialDiagnosticsEnabled=true
      - pocketbackup.diagnosticsUserOptInRequired=true

MaintainerNotes: |-
  No prebuilt native binaries are shipped. The fdroidRelease build compiles
  rsync, OpenSSH and zstd from upstream source via the pinned Termux package
  recipes in native/fdroid-native-sources.lock (each recipe carries the source
  URL and SHA-256 checksum), then builds Go 1.26.4 from fdroiddata srclib and
  uses it to build the Android tsnet helper from source in native/tsnet-helper
  (pinned by go.mod / go.sum) using the srclib Go toolchain on PATH.
  prebuild runs scripts/fdroid-scan-source.sh, which fails the build if any ELF
  binary or native library remains in the source sets. scandelete removes the
  upstream app/src/sideload prebuilts before scanning.

  The native stack is built with --termux-mode host (no Docker/FUSE inside the
  build VM); this needs network during build to git-clone termux-packages at the
  pinned commit. The sudo apt packages are the Termux host-build dependencies
  plus the bootstrap Go toolchain, kept to what the buildserver base image does
  not already provide.

AutoUpdateMode: Version
UpdateCheckMode: Tags
UpdateCheckData: 
  gradle.properties|pocketbackup\.versionCode=(\d+)|.|pocketbackup\.versionName=(.+)
CurrentVersion: 1.0.0-beta.2
CurrentVersionCode: 11
