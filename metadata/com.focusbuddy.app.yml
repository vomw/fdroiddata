Summary: Privacy-first Pomodoro companion

Description: |
  FocusBuddy is a privacy-first, open-source Pomodoro timer for Android.

  Features:
  - Pomodoro timer with customizable focus and break durations
  - Cute animal companions that cheer you on
  - XP and level progression system
  - Daily streak tracking
  - Productivity heatmap visualization
  - Multiple themes including Warm Pastel, Dark, and Paper
  - Optional notifications for completed sessions
  - Fully offline
  - No ads
  - No trackers
  - No subscriptions
  - English and Turkish localization

RepoType: git
Repo: https://github.com/toprakpt1/Focusbudy

Builds:
  - versionName: 1.0.0
    versionCode: 1
    commit: v1.0.0

    sudo:
      - apt-get update
      - apt-get install -y npm

    init:
      - npm ci

    prebuild:
      - npx expo prebuild --platform android

    gradle:
      - yes

    scandelete:
      - node_modules
      - .expo
      - android/.gradle

AutoUpdateMode: Version
UpdateCheckMode: Tags
