RepoType: git
Repo: https://github.com/toprakpt1/focusbuddy

Builds:
  - versionName: 1.0.0
    versionCode: 1
    commit: efcbe8c8cb7849e842225b26de4f1bd1a5f07294
    
    sudo:
      - apt-get update
      - apt-get install -y npm

    init:
      - npm ci

   
    gradle:
      - yes

   
    output: android/app/build/outputs/apk/release/app-release-unsigned.apk

    srclibs:
      - firebase-stub@ce90a956aacda17a85c60577ee443aeb83d876ef

    prebuild:
      - sed -i -e '1a "expo":{"autolinking":{"android":{"buildFromSource":[".*"]}}},' package.json
      - sed -i '/jvmToolchain\|JavaVersion/s/17/21/' node_modules/@react-native/gradle-plugin/*/build.gradle.kts node_modules/@react-native/gradle-plugin/react-native-gradle-plugin/src/main/kotlin/com/facebook/react/utils/JdkConfiguratorUtils.kt
      - sed -i -e '/firebase/d' node_modules/expo-notifications/android/build.gradle
      - cp -a $$firebase-stub$$/firebase-messaging/src node_modules/expo-notifications/android
      - npx expo prebuild -p android --clean
      - sed -i -e '/signingConfig /d' android/app/build.gradle
      - echo "task assembleRelease {}" > build.gradle
      - touch settings.gradle
      - echo 'allprojects { tasks.configureEach { t -> if (t.class.name.contains("KotlinCompile")) { try { t.kotlinOptions.freeCompilerArgs += "-Xskip-metadata-version-check" } catch (Exception e) { try { t.compilerOptions.freeCompilerArgs.add("-Xskip-metadata-version-check") } catch (Exception ex) {} } } } }' > init.gradle
      - find node_modules -type f -name "build.gradle" -exec cp {} {}.bak \;
      - find node_modules -type f -name "build.gradle.kts" -exec cp {} {}.bak \;

    build:
      - find node_modules -type f -name "build.gradle.bak" -exec sh -c 'mv "$0" "${0%.bak}"' {} \;
      - find node_modules -type f -name "build.gradle.kts.bak" -exec sh -c 'mv "$0" "${0%.bak}"' {} \;
      - cd android && gradle assembleRelease --init-script ../init.gradle

    scanignore:
      - node_modules/react-native/sdks/hermesc/linux64-bin/hermesc
      - node_modules/expo-modules-core/android/ExpoModulesCorePlugin.gradle
      - node_modules/expo-modules-autolinking/scripts/android/autolinking_implementation.gradle

    scandelete:
      - node_modules

AutoUpdateMode: Version
UpdateCheckMode: Tags

CurrentVersion: 1.0.0
CurrentVersionCode: 1