Builds:
  - versionName: 2.19.6
    versionCode: 15932
    commit: ce4fe33068a7388996300c19b41b378c22869aa2
    subdir: app
    sudo:
      - apt-get update
      - apt-get install -y gcc libc-dev make golang-go file xz-utils
    output: build/app/outputs/flutter-apk/app-release.apk
    srclibs:
      - flutter@stable
      - go@release-branch.go1.25
      - sing-box-lx@lx
    rm:
      - app/ios
      - app/linux
      - app/macos
      - app/web
      - app/windows
    prebuild:
      - export FLUTTER_VERSION=$(tr -d '[:space:]' < android/flutter.version)
      - '[[ $FLUTTER_VERSION ]]'
      - git -C $$flutter$$ checkout -q $FLUTTER_VERSION
      - export GO_VERSION=$(tr -d '[:space:]' < android/go.version)
      - '[[ $GO_VERSION ]]'
      - git -C $$go$$ checkout -q $GO_VERSION
      - export NDK_VERSION=$(grep ndkVersion $$flutter$$/packages/flutter_tools/gradle/src/main/kotlin/FlutterExtension.kt
        | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1)
      - '[[ $NDK_VERSION ]]'
      - sdkmanager "ndk;$NDK_VERSION" "platforms;android-24"
      - "sed -i -e 's/^version: .*/version: $$VERSION$$+$$VERCODE$$/' pubspec.yaml"
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get --enforce-lockfile
    scandelete:
      - app/.pub-cache
    build:
      - export NDK_VERSION=$(grep ndkVersion $$flutter$$/packages/flutter_tools/gradle/src/main/kotlin/FlutterExtension.kt
        | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1)
      - export ANDROID_NDK_HOME=$$SDK$$/ndk/$NDK_VERSION
      - export CORE_VERSION=$(tr -d '[:space:]' < android/libbox.version)
      - '[[ $CORE_VERSION ]]'
      - git -C $$sing-box-lx$$ checkout -q $CORE_VERSION
      - git -C $$sing-box-lx$$ submodule update --init submodules/sing-tun submodules/wireguard-go
      - pushd $$sing-box-lx$$
      - sed -i -e 's/"with_utls", "with_naive_outbound",/"with_utls",/' -e 's/^\tcheckJavaVersion()$//'
        -e '/\/\/ Build legacy variant/,/}, bindTarget)/d' cmd/internal/build_libbox/main.go
      - export GOROOT_BOOTSTRAP=$(go env GOROOT)
      - pushd $$go$$/src
      - ./make.bash
      - popd
      - export GOROOT=$$go$$
      - export GOPATH=$(pwd)/.gopath
      - export PATH="$GOROOT/bin:$GOPATH/bin:$PATH"
      - export GOMODCACHE=$(pwd)/.gomodcache
      - export GOFLAGS=-mod=mod
      - make lib_install
      - make lib_android
      - popd
      - mkdir -p android/app/libs
      - mv $$sing-box-lx$$/libbox.aar android/app/libs/libbox.aar
      - export PUB_CACHE=$(pwd)/.pub-cache
      - export LXBOX_ABI_FILTER=arm64-v8a
      - $$flutter$$/bin/flutter build apk --release --target-platform=android-arm64

MaintainerNotes: |-
  UpdateCheckMode and AutoUpdateMode are None because the version cannot be
  read from the repository. pubspec.yaml holds a frozen placeholder that is
  deliberately never bumped: both CI and the local build script rewrite it
  from the git tag right before `flutter build`, and the app reads its
  version back from the APK manifest at runtime. checkupdates fails on this
  with "Couldn't find any version information". versionCode is
  `git rev-list --count HEAD` on the release commit, which no regex over the
  tag name can produce either.

  The version code carries an ABI digit last, as `rev-list * 10 + ABI`, so
  that sorting by version code keeps releases in order and groups the ABIs of
  one release together. 2.19.6 is rev-list 1593, and 2 is arm64, hence 15932.
  Note this is not what the Flutter Gradle plugin does on its own: with
  --split-per-abi it emits `ABI * 1000 + versionCode`, putting the ABI first.
  This build does not use --split-per-abi, so the value above is taken as is.

  Making the version readable from source is on my roadmap; I will enable
  autoupdate once the scheme changes. Until then a small MR per release adds
  the build entry by hand.

  Reproducible builds are not possible here: this build intentionally differs
  from the APKs published on GitHub — the naive outbound is dropped (see
  below) and only arm64 is built — so the two can never match byte for byte.
  Signing with the F-Droid key is expected.

  The core (libbox.aar) is built from source in `build:`, so the scanner sees
  the tree it is compiled from and no binary survives into the APK. Upstream
  sing-box ships the same library the same way (see io.nekohasekai.sfa).
  Three edits are applied to its build script first:

  - the naive outbound is dropped from the build tags, because it pulls in
    cronet-go, which ships a prebuilt libcronet.a; the other protocols are
    unaffected;
  - the openjdk 17 check is removed, because the buildserver runs Debian
    trixie, which ships JDK 21 and has no openjdk-17 package — the check is
    an upstream gate, not a gomobile requirement;
  - the legacy AAR variant is dropped, since only the API 24 one is used.

  The srclibs track branches and the exact versions come from the app commit,
  so they cannot drift: android/flutter.version, android/go.version and
  android/libbox.version are read in the build and checked out. An older app
  commit therefore builds with the toolchain and core it was written for. Each
  is asserted non-empty first, so a missing or renamed file fails the build
  rather than silently building against a branch tip.

