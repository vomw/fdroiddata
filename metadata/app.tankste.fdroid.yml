Builds:
  - versionName: 2.2.1
    versionCode: 1041
    commit: e7e24e1d043b63f26ccb5d2647890a2aa0375889
    subdir: app
    sudo:
      - mkdir -p /home/runner/work/tankste-app-fdroid
      - chown -R vagrant /home/runner
    output: build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
    binary: 
      https://github.com/tankste/tankste-app-fdroid/releases/download/%v/tankste-fdroid-%v-arm.apk
    srclibs:
      - flutter@stable
    rm:
      - app/ios
      - app/android/station
      - app/android/car
      - app/android/navigation
    prebuild:
      - flutterVersion=$(sed -n -E 's/flutter:\ (.+)/\1/p' pubspec.yaml)
      - '[[ $flutterVersion ]]'
      - git -C $$flutter$$ checkout -f $flutterVersion
      - export repo=/home/runner/work/tankste-app-fdroid/tankste-app-fdroid
      - cd ../..
      - mv app.tankste.fdroid $repo
      - pushd $repo
      - export PUB_CACHE=$(pwd)/.pub-cache
      - cd app
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get --enforce-lockfile
      - popd
      - mv $repo app.tankste.fdroid
    scandelete:
      - .pub-cache
    build:
      - export repo=/home/runner/work/tankste-app-fdroid/tankste-app-fdroid
      - cd ../..
      - mv app.tankste.fdroid $repo
      - pushd $repo
      - export PUB_CACHE=$(pwd)/.pub-cache
      - cd app
      - $$flutter$$/bin/flutter build apk --release --no-tree-shake-icons --split-per-abi
        --target-platform=android-arm
      - popd
      - mv $repo app.tankste.fdroid
    ndk: 28.1.13356709

