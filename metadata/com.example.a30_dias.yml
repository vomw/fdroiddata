AutoName: Controla Tu Dinero
Summary: App de finanzas personales 100% offline
Description: |-
  Controla tus ingresos y gastos de forma sencilla y totalmente sin conexión a internet.
  Tu información se guarda en tu propio dispositivo.

  Funciones principales:
  * Registro de gastos e ingresos por categoría
  * Balance mensual y presupuesto personalizado
  * Gráficas y estadísticas de tendencia
  * Metas de ahorro con anillo de progreso
  * Exportación de datos a CSV
  * Sin anuncios, sin publicidad y sin cuentas

  La app funciona sin conexión: todos los datos se almacenan de forma local en tu dispositivo.

