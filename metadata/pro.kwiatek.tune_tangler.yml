Categories:
  - Multimedia
License: MIT
AuthorName: Bartłomiej Jakub Kwiatek
WebSite: https://github.com/Flower7C3/tune-tangler
SourceCode: https://github.com/Flower7C3/tune-tangler
IssueTracker: https://github.com/Flower7C3/tune-tangler/issues

RepoType: git
Repo: https://github.com/Flower7C3/tune-tangler.git

Builds:
  - versionName: 1.7.1
    versionCode: 3
    commit: a02ee37a654f391c4c40c090cb3b06bbd429d3e6
    output: build/app/outputs/flutter-apk/app-release.apk
    srclibs:
      - flutter@3.27.2
    rm:
      - ios
      - linux
      - macos
      - web
      - windows
    prebuild:
      - echo "flutter.sdk=$$flutter$$" >> android/local.properties
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter precache --android
      - $$flutter$$/bin/flutter pub get
    scandelete:
      - .pub-cache
    build:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter build apk --release
MaintainerNotes: |
  MIT. Sonic (Apache 2.0) in android/app/src/main/java/sonic/.

  Build: Flutter srclib (version from .metadata at the release commit).

  Listings (Summary/Description/screenshots): Fastlane layout in the app repo
  (fastlane/metadata/android/) — do not duplicate those keys in this YAML.

ArchivePolicy: 6
AutoUpdateMode: None
UpdateCheckMode: None
CurrentVersion: 1.7.1
CurrentVersionCode: 3
