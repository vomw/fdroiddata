AutoName: CableSnap
Summary: Workout tracker for cable machine workouts
Description: |
  CableSnap is a local-first fitness app optimized for cable machine workouts,
  with support for barbell, dumbbell, bodyweight, and machine exercises.
  Track workouts, nutrition, and body measurements. Data is stored locally.

  Features:
  - Workout logging with sets, reps, weight, and RPE
  - Exercise library with 100+ built-in exercises
  - Workout templates and multi-day programs
  - Nutrition tracking with macro targets
  - Progress charts and 1RM tracking
  - Body weight and measurements logging
  - Workout history with calendar view
  - Plate and 1RM calculators
  - Tabata, EMOM, and AMRAP interval timers
  - CSV export and sharing
  - Dark mode support

RepoType: git
Repo: https://github.com/alankyshum/cablesnap.git

Builds:
  - versionName: 0.26.88
    versionCode: 156
    commit: v0.26.88
    sudo:
      - apt-get update
      - apt-get install -y ca-certificates curl
      - curl -fsSL https://deb.nodesource.com/setup_22.x | bash -
      - apt-get install -y nodejs
      - echo 'deb http://deb.debian.org/debian bookworm main' > /etc/apt/sources.list.d/bookworm.list
      - apt-get update
      - apt-get install -y openjdk-17-jdk-headless
      - update-java-alternatives -a
    init: npm ci --ignore-scripts && npx --no-install patch-package && npx --no-install
      install-skia
    output: android/app/build/outputs/apk/releaseFdroid/app-releaseFdroid.apk
    prebuild: CABLESNAP_FDROID=1 npx expo prebuild --platform android --no-install
      && sed -i '/com.google.firebase/d;/com.google.android.gms/d;/com.google.mlkit/d;/com.android.installreferrer/d'
      node_modules/expo-notifications/android/build.gradle node_modules/expo-application/android/build.gradle
      node_modules/expo-camera/android/build.gradle node_modules/expo-dev-launcher/android/build.gradle
      android/app/build.gradle android/build.gradle
    scanignore:
      - node_modules
      - android/wear/build.gradle.kts
      - modules/expo-wearos-bridge/wear-template/build.gradle.kts
      - modules/expo-wearos-bridge/android/build.gradle
    build: "printf '\\n%s\\n' 'expo.camera.barcode-scanner-enabled=false' >> android/gradle.properties\
      \ && printf '%s\\n' 'android { dependenciesInfo { includeInApk = false; includeInBundle\
      \ = false } }' >> android/app/build.gradle && printf '%s\\n' 'allprojects {\
      \ configurations.configureEach { exclude group: \"com.google.android.gms\";\
      \ exclude group: \"com.google.firebase\"; exclude group: \"com.google.mlkit\"\
      ; exclude group: \"com.android.installreferrer\"; exclude module: \"camera-mlkit-vision\"\
      \ } }' >> android/build.gradle && export JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64\
      \ SENTRY_DISABLE_AUTO_UPLOAD=true && cd android && gradle assembleReleaseFdroid"

AutoUpdateMode: Version
UpdateCheckMode: Tags ^v[0-9.]+$
UpdateCheckData: app.config.ts|versionCode:\s*(\d+)|app.config.ts|version:\s*["']([^"']+)["']
