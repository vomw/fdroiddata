AntiFeatures:
  - NonFreeNet
Categories:
  - Sports & Health
  - Workout
License: AGPL-3.0-or-later
AuthorName: alankyshum
WebSite: https://github.com/alankyshum/cablesnap
SourceCode: https://github.com/alankyshum/cablesnap
IssueTracker: https://github.com/alankyshum/cablesnap/issues
Changelog: https://github.com/alankyshum/cablesnap/blob/HEAD/CHANGELOG.md

AutoName: CableSnap

RepoType: git
Repo: https://github.com/alankyshum/cablesnap.git

Builds:
  - versionName: 0.26.91
    versionCode: 159
    commit: v0.26.91
    sudo:
      - apt-get update
      - apt-get install npm
    init:
      - npm pkg delete dependencies.expo-dev-client
      - npm install
    output: android/app/build/outputs/apk/release/app-release.apk
    prebuild:
      - sed -i -e '1a "expo":{"autolinking":{"android":{"buildFromSource":[".*"]}}},'
        package.json
      - sed -i '/jvmToolchain\|JavaVersion/s/17/21/' node_modules/@react-native/gradle-plugin/*/build.gradle.kts
        node_modules/@react-native/gradle-plugin/react-native-gradle-plugin/src/main/kotlin/com/facebook/react/utils/JdkConfiguratorUtils.kt
      - CABLESNAP_FDROID=1 CABLESNAP_FDROID_BUILD_TYPE=0 CI=true npx expo prebuild
        -p android --clean
      - CABLESNAP_FDROID=1 node -e 'const m=require("./plugins/with-wearos-module");
        m.patchFdroidExpoDependencies(process.cwd()); m.patchFdroidLibrarySources(process.cwd(),
        {removeGeneratedArtifacts:false, rewriteSources:false}); m.patchFdroidAndroidGradleTree("android");
        const fs=require("fs"); const a="android/app/build.gradle"; const p="android/build.gradle";
        process.env.CABLESNAP_FDROID_BUILD_TYPE="0"; fs.writeFileSync(a,m.patchAppBuildGradle(fs.readFileSync(a,"utf8")));'
      - sed -i -e '/signingConfig /d' android/app/build.gradle
    scanignore:
      - android/wear/build.gradle.kts
      - modules/expo-wearos-bridge/wear-template/build.gradle.kts
      - modules/expo-wearos-bridge/android/build.gradle
      - public/canvaskit.wasm
    scandelete:
      - node_modules
    build:
      - cd android
      - gradle assembleRelease

AutoUpdateMode: Version
UpdateCheckMode: Tags ^v[0-9.]+$
UpdateCheckData: app.config.ts|versionCode:\s*(\d+)|app.config.ts|version:\s*["']([^"']+)["']
CurrentVersion: 0.26.91
CurrentVersionCode: 159
