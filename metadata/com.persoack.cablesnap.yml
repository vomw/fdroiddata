Builds:
  - versionName: 0.26.88
    versionCode: 156
    commit: v0.26.88
    subdir: android/app
    sudo:
      - apt-get update
      - apt-get install npm
    init:
      - cd ../..
      - npm install
    gradle:
      - yes
    srclibs:
      - firebase-stub@ce90a956aacda17a85c60577ee443aeb83d876ef
    prebuild:
      - cd ../..
      - sed -i -e '1a "expo":{"autolinking":{"android":{"buildFromSource":[".*"]}}},'
        package.json
      - sed -i '/jvmToolchain\|JavaVersion/s/17/21/' node_modules/@react-native/gradle-plugin/*/build.gradle.kts
        node_modules/@react-native/gradle-plugin/react-native-gradle-plugin/src/main/kotlin/com/facebook/react/utils/JdkConfiguratorUtils.kt
      - sed -i -e '/installReferrerVersion/,+12d' node_modules/react-native-device-info/android/build.gradle
      - sed -i -e '/installreferrer/d' node_modules/expo-application/android/build.gradle
      - sed -i -e '/com.android.installreferrer.api/d' -e '/StringBuilder()/,/^      })/d'
        -e '/getInstallReferrerAsync/apromise.resolve("")' node_modules/expo-application/android/src/main/java/expo/modules/application/ApplicationModule.kt
      - sed -i -e '/firebase/d' node_modules/expo-notifications/android/build.gradle
      - cp -a $$firebase-stub$$/firebase-messaging/src node_modules/expo-notifications/android
      - sed -i -e '/gms/d' -e '/mlkit/d' node_modules/expo-camera/android/build.gradle
      - rm node_modules/expo-camera/android/src/main/java/expo/modules/camera/analyzers/{BarcodeScannerResultSerializer,MLKitBarcodeAnalyzer}.kt
      - sed -i -e '/@OptIn/,/^}/d' -e '/mlkit/d' node_modules/expo-camera/android/src/main/java/expo/modules/camera/analyzers/BarcodeAnalyzer.kt
      - sed -i -e '/barcode\./Id' -e '/mapToBarcode/,/^  }/d' node_modules/expo-camera/android/src/main/java/expo/modules/camera/records/CameraRecords.kt
      - sed -i -e '/mlkit/d' -e '/analyzers/d' -e '/onSuccess/,/^\s\{10\}}/s/^\s\{12\}.*//'
        -e '/launchScanner/,/^    }/s/^      .*//' node_modules/expo-camera/android/src/main/java/expo/modules/camera/CameraViewModule.kt
      - sed -i -e '/analyzer.setAnalyzer/,/^\s\{10\})/d' -e '/BarcodeAnalyzer/d' node_modules/expo-camera/android/src/main/java/expo/modules/camera/ExpoCameraView.kt
      - npx expo prebuild -p android --clean
      - sed -i -e '/signingConfig /d' android/app/build.gradle
    scanignore:
      - node_modules/react-native/sdks/hermesc/linux64-bin/hermesc
      - node_modules/expo-modules-core/android/ExpoModulesCorePlugin.gradle
      - node_modules/expo-modules-autolinking/scripts/android/autolinking_implementation.gradle
    scandelete:
      - node_modules

AutoUpdateMode: Version
UpdateCheckMode: Tags ^v[0-9.]+$
UpdateCheckData: app.config.ts|versionCode:\s*(\d+)|app.config.ts|version:\s*["']([^"']+)["']
CurrentVersion: 0.26.88
CurrentVersionCode: 156
