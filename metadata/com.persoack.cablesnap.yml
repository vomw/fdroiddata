AntiFeatures:
  NonFreeNet:
    en-US: Optional Strava integration — Strava OAuth + api/v3 via Cloudflare Worker
      proxy at strava-proxy.alankyshum.workers.dev. Core workout/nutrition tracking
      is local-first and works fully offline.
Categories:
  - Sports & Health
  - Workout
License: AGPL-3.0-or-later
AuthorName: alankyshum
WebSite: https://github.com/alankyshum/cablesnap
SourceCode: https://github.com/alankyshum/cablesnap
IssueTracker: https://github.com/alankyshum/cablesnap/issues
Changelog: https://github.com/alankyshum/cablesnap/blob/HEAD/CHANGELOG.md

AutoName: CableSnap

RepoType: git
Repo: https://github.com/alankyshum/cablesnap.git

Builds:
  - versionName: 0.26.91
    versionCode: 159001
    commit: 84361b3a646f1684b676b8466a571d687bec6db2
    sudo:
      - apt-get update
      - apt-get install npm
    init:
      - npm pkg delete dependencies.expo-dev-client
      - npm install
      - node -e 'const fs=require("fs"); const p="modules/expo-wearos-bridge/expo-module.config.json";
        const c=JSON.parse(fs.readFileSync(p,"utf8")); c.platforms=[]; fs.writeFileSync(p,JSON.stringify(c)+"\n");'
    output: android/app/build/outputs/apk/releaseFdroid/*.apk
    prebuild:
      - sed -i -e '1a "expo":{"autolinking":{"android":{"buildFromSource":[".*"]}}},'
        package.json
      - sed -i '/jvmToolchain\|JavaVersion/s/17/21/' node_modules/@react-native/gradle-plugin/*/build.gradle.kts
        node_modules/@react-native/gradle-plugin/react-native-gradle-plugin/src/main/kotlin/com/facebook/react/utils/JdkConfiguratorUtils.kt
      - CABLESNAP_FDROID=1 CI=true npx expo prebuild -p android --clean
      - CABLESNAP_FDROID=1 node -e 'const m=require("./plugins/with-wearos-module");
        m.patchFdroidExpoDependencies(process.cwd()); 
        m.patchFdroidLibrarySources(process.cwd(),{removeGeneratedArtifacts:false,rewriteSources:false});
        m.patchFdroidAndroidGradleTree("android"); const fs=require("fs"); const p="android/app/build.gradle";
        fs.writeFileSync(p,m.patchAppBuildGradle(fs.readFileSync(p,"utf8")));'
      - sed -i 's/versionCode 159/versionCode 159001/' android/app/build.gradle
      - sed -i -e 's/def enableSeparateBuildPerCPUArchitecture = false/def enableSeparateBuildPerCPUArchitecture
        = true/' android/app/build.gradle
      - sed -i '/reactNativeArchitectures=/d' android/gradle.properties
      - printf '\n' >> android/gradle.properties
      - echo 'reactNativeArchitectures=armeabi-v7a' >> android/gradle.properties
      - sed -i -e '/jvmToolchain\|JavaVersion/s/17/21/' -e '/jvmTarget/s/17/21/' android/wear/build.gradle.kts
        modules/expo-wearos-bridge/wear-template/build.gradle.kts
      - sed -i -e '/signingConfig /d' android/app/build.gradle
    scanignore:
      - node_modules
      - android/wear/build.gradle.kts
      - modules/expo-wearos-bridge/wear-template/build.gradle.kts
      - modules/expo-wearos-bridge/android/build.gradle
      - public/canvaskit.wasm
    build:
      - cd android
      - CI=true NODE_ENV=production SENTRY_DISABLE_AUTO_UPLOAD=true gradle --no-daemon
        assembleReleaseFdroid -x lintVitalAnalyzeRelease

