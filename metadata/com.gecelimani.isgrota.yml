AutoName: ISG ROTA

Description: |-
  DSP (Diger Saglik Personeli) exam preparation app for Turkey.
  Community-driven question pool, no tracking, no personal data collected.

  Features:
  * Practice exams and question pool
  * Community added and voted questions
  * Add questions via PDF or camera
  * Auto update with offline cache
  * Fully anonymous, zero data collection
  * Dark/Light theme support
  * Daily study reminder

