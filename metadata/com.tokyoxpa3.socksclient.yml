Name: 5G Proxy Client
AutoName: 5G Proxy Client
Summary: SOCKS5 TUN tunnel client
Description: |-
  Routes the device's entire network traffic through a remote SOCKS5
  server using a TUN virtual interface. No root required.

  * User-space TCP state machine forwarded via SOCKS5 CONNECT
  * UDP / DNS / QUIC relay via SOCKS5 UDP ASSOCIATE (UDP-in-UDP or UDP-in-TCP)
  * Remote DNS (fakedns) with fake IPv4 / IPv6
  * IPv4 + IPv6 dual-stack
  * Per-app routing (global, allowlist, exclusion)
  * Auto-reconnect, live traffic statistics, Quick Settings tile

