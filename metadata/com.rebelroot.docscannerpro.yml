AutoName: Doc Scanner Pro
Summary: Offline document scanner and PDF toolkit
Description: |
  Doc Scanner Pro turns an Android device into a private local document
  workstation. Capture and process paper documents, books, receipts,
  identity cards and business cards entirely on the device.

  Features include automatic document detection, perspective correction,
  multi-page capture, book scanning, OCR (English + Hindi), searchable
  PDFs, annotations, signatures, redaction, barcode scanning and PDF
  utilities (merge, split, compress, images-to-PDF, password-protect).

  The application does not request Internet access. Document contents
  remain on the device unless the user explicitly exports or shares
  them through Android.

