AutoName: Melodia
Summary: Offline music player with Material You design
Description: |-
    Melodia is a modern, offline music player for Android built with Kotlin,
    Jetpack Compose and Android Media3.

    It scans your device via MediaStore and lets you browse and play local
    music with a clean Material You interface.

    * Local music library, auto-categorized by folder
    * Playback powered by Media3 (ExoPlayer + MediaSession), shuffle, repeat
      and audio focus
    * Playlists, favorites and folder-based auto playlists
    * Relevance-ranked search across the whole device or selected folders
    * Scrolling LRC lyrics with adjustable font size
    * Song details: title, artist, album, duration, format, bitrate, folder
      and play count
    * Mini player with previous / play-pause / next controls
    * Dynamic color (Material You) and dark mode

