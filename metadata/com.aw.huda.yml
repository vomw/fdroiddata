AntiFeatures:
  NonFreeNet:
    en-US: Uses Gemini and Google Maps via Supabase proxies.
  Tracking:
    en-US: Sends crash reports and device details to a Supabase service.
Categories:
  - Religion
License: MIT
AuthorName: Abdulwahed Rifaat
AuthorWebSite: https://awrs.me
SourceCode: https://github.com/abdulwahed-s/huda
IssueTracker: https://github.com/abdulwahed-s/huda/issues
Changelog: https://github.com/abdulwahed-s/huda/releases

AutoName: Huda

RepoType: git
Repo: https://github.com/abdulwahed-s/huda.git

Builds:
  - versionName: 4.1.0
    versionCode: 47
    commit: 2972181f5fbbc47f0db7fbead65d986432977e3d
    output: build/app/outputs/flutter-apk/app-foss-release.apk
    srclibs:
      - flutter@stable
    rm:
      - distribution
      - ios
      - linux
      - macos
      - supabase
      - web
      - windows
    prebuild:
      - flutterVersion=$(cat .fvmrc)
      - '[[ $flutterVersion ]]'
      - git -C $$flutter$$ checkout -f $flutterVersion
      - sed -i.bak '/^signingConfigs {/,/^   }$/d' android/app/build.gradle
      - sed -i.bak '/signingConfig/d' android/app/build.gradle
      - sed -i.bak '/play-services-location/d' android/app/build.gradle
      - rm android/app/build.gradle.bak
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get --enforce-lockfile
    scandelete:
      - .pub-cache
    build:
      - export ORG_GRADLE_PROJECT_hudaUseLegacyPackaging=true
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter build apk --flavor foss --release

AutoUpdateMode: Version
UpdateCheckMode: Tags
UpdateCheckData: pubspec.yaml|version:\s.+\+(\d+)|.|version:\s(.+)\+
CurrentVersion: 4.1.0
CurrentVersionCode: 47
