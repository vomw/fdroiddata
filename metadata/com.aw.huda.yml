AntiFeatures:
  NonFreeNet:
    en-US: Uses Google Gemini and Google Maps through developer-operated Supabase
      proxies.
  Tracking:
    en-US: Sends crash reports, including device model, Android version, app version,
      and error details, to a developer-operated Supabase service.
Categories:
  - Religion
License: MIT
AuthorName: Abdulwahed Rifaat
AuthorWebSite: https://awrs.me
SourceCode: https://github.com/abdulwahed-s/huda
IssueTracker: https://github.com/abdulwahed-s/huda/issues
Changelog: https://github.com/abdulwahed-s/huda/releases

AutoName: Huda

RepoType: git
Repo: https://github.com/abdulwahed-s/huda.git

Builds:
  - versionName: 4.1.0
    versionCode: 47
    commit: v4.1.0
    output: build/app/outputs/flutter-apk/app-foss-release.apk
    srclibs:
      - flutter@3.44.2
    rm:
      - .github
      - distribution
      - ios
      - linux
      - macos
      - supabase
      - web
      - windows
    prebuild:
      - sed -i.bak -e '/^signingConfigs {/,/^   }$/d' -e '/signingConfig signingConfigs.release/d'
        -e '/gplayImplementation("com.google.android.gms:play-services-location:21.2.0")/d'
        android/app/build.gradle
      - rm android/app/build.gradle.bak
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get --enforce-lockfile
    scandelete:
      - .pub-cache
    build:
      - export ORG_GRADLE_PROJECT_hudaUseLegacyPackaging=true
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter build apk --flavor foss --release

AutoUpdateMode: Version
UpdateCheckMode: Tags
UpdateCheckData: pubspec.yaml|version:\s.+\+(\d+)|.|version:\s(.+)\+
CurrentVersion: 4.1.0
CurrentVersionCode: 47
