MaintainerNotes: |-
  Split-ABI release (one full APK per ABI) with per-ABI version codes following
  the F-Droid convention: 601/602/603 = base (60) * 10 + ABI digit, ordered
  armeabi-v7a (1) < arm64-v8a (2) < x86_64 (3), so clients pick the best
  installable APK. See VercodeOperation below; the base literal lives in
  app/build.gradle.kts (defaultConfig.versionCode = 60).
  Reproducible builds enabled: every build entry carries a `binary:` URL to
  the upstream GitHub release APK; the app is signed with the same key as the
  upstream releases (AllowedAPKSigningKeys below) and F-Droid should publish
  the developer-signed APKs after verification succeeds.

AutoUpdateMode: Version
UpdateCheckMode: Tags v[\d.]+
VercodeOperation:
  - '%c * 10 + 1'
  - '%c * 10 + 2'
  - '%c * 10 + 3'
