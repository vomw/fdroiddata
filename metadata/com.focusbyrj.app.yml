Name: Focus by Rj
Summary: Offline App Locker & Focus Tracker
Description: |-
  Focus by Rj is a strictly offline, privacy-first Android application designed to help you stay focused and manage screen time without compromising your personal data.

  Features:
  * Block distracting apps using powerful App Restrictions
  * Schedule Deep Work sessions with timers
  * Schedule automatic locking routines
  * Detailed usage statistics
  * Secure fallback mechanisms and biometric lock

  This application is fully open source, contains zero analytics or proprietary tracking software, and operates 100% offline. All data is stored locally on your device.

