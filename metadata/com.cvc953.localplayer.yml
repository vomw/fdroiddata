Summary: Reproductor de música local con letras sincronizadas.
Description: |-
    Local Player es un reproductor moderno construido con Jetpack Compose y Material 3.
    Ofrece una experiencia inmersiva con soporte avanzado de letras.

    Características:
    * Letras sincronizadas palabra por palabra (TTML) y línea por línea (LRC).
    * Basado en Media3/ExoPlayer para máxima compatibilidad.
    * Interfaz dinámica que se adapta al arte del álbum.
    * Totalmente privado y de código abierto.

