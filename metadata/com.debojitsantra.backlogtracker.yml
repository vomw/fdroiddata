RepoType: git
Repo: https://github.com/debojitsantra/BacklogTracker-Android.git

Builds:
  - versionName: 1.0.2
    versionCode: 1
    commit: v1.0.2
    subdir: src-tauri/gen/android
    sudo:
      - apt-get update
      - apt-get install -y nodejs npm
    init: cd ../../.. && npm install && npm run build
    gradle:
      - yes
    srclibs:
      - rustup@1.27.1
    scandelete:
      - node_modules/tsx/node_modules/esbuild/bin
      - node_modules/tsx/node_modules/@esbuild/linux-x64/bin
      - node_modules/esbuild/bin
      - node_modules/@esbuild/linux-x64/bin
    build:
      - $$rustup$$/rustup-init.sh -y --default-toolchain stable --target armv7-linux-androideabi
        aarch64-linux-android
      - source $HOME/.cargo/env
      - export NDK_HOME=$$NDK$$
      - cd ../../.. && npx tauri android build --apk
    ndk: r26b

AutoUpdateMode: Version
UpdateCheckMode: Tags
CurrentVersion: 1.0.2
CurrentVersionCode: 1
