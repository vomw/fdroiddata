Repo: https://github.com/debojitsantra/BacklogTracker-Android.git

Builds:
  - versionName: 1.0.2
    versionCode: 1
    commit: v1.0.2
    subdir: src-tauri/gen/android
    sudo:
      - apt-get update
      - apt-get install -y nodejs npm build-essential
    srclibs:
      - rustup@1.27.1
    scandelete:
      - node_modules/tsx/node_modules/esbuild/bin
      - node_modules/tsx/node_modules/@esbuild/linux-x64/bin
      - node_modules/esbuild/bin
      - node_modules/@esbuild/linux-x64/bin
    prebuild:
      - cd ../../.. && npm install && npm run build && sed -i 's/"beforeBuildCommand":.*/"beforeBuildCommand": ""/' src-tauri/tauri.conf.json
    build:
      - $$rustup$$/rustup-init.sh -y --default-toolchain stable --target armv7-linux-androideabi
        aarch64-linux-android i686-linux-android x86_64-linux-android
      - . $HOME/.cargo/env && export NDK_HOME=$$NDK$$ && cargo install tauri-cli@2.11.2
        --locked && cd ../../.. && cargo tauri android build --apk
    output: app/build/outputs/apk/universal/release/app-universal-release-unsigned.apk
    ndk: r26b

AutoUpdateMode: Version
UpdateCheckMode: Tags
CurrentVersion: 1.0.2
CurrentVersionCode: 1
