Builds:
  - versionName: 1.0.0
    versionCode: 1
    commit: v1.0.0
    sudo:
      - apt-get update
      - echo "deb http://deb.debian.org/debian forky main" > /etc/apt/sources.list.d/forky.list
      - apt-get update
      - apt-get install -y -t forky nodejs npm
    init:
      - npm ci
      - npm run build
      - npx cap sync android
    subdir: android
    gradle:
      - yes
    scandelete:
      - node_modules

