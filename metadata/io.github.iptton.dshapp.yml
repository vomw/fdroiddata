License: GPL-3.0-only
AuthorName: iptton
SourceCode: https://github.com/iptton-ai/DeepseekHarnessApp
IssueTracker: https://github.com/iptton-ai/DeepseekHarnessApp/issues

AutoName: DshAPP

RepoType: git
Repo: https://github.com/iptton-ai/DeepseekHarnessApp.git
Binaries: 
  https://github.com/iptton-ai/DeepseekHarnessApp/releases/download/v%v/io.github.iptton.dshapp_%c.apk

Builds:
  - versionName: 1.0.0
    versionCode: 11
    commit: edc1352f70be22af70289d309929e716ceb4f0ab
    output: build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
    binary: 
      https://github.com/iptton-ai/DeepseekHarnessApp/releases/download/v1.0.0/io.github.iptton.dshapp_11.apk
    srclibs:
      - flutter@3.35.7
    prebuild:
      - flutterVersion=$(cat .flutter-version)
      - '[[ $flutterVersion ]]'
      - git -C $$flutter$$ checkout -f $flutterVersion
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter config --no-analytics
      - export PATH=$$flutter$$/bin:$PATH
      - ./tool/fdroid_prepare.sh
    scanignore:
      - .pub-cache
    scandelete:
      - .pub-cache
    build:
      - $$flutter$$/bin/flutter build apk --release --target-platform android-armeabi-v7a --split-per-abi

  - versionName: 1.0.0
