AntiFeatures:
  - NonFreeNet
  - Tracking
Categories:
  - Multimedia
License: GPL-3.0-only
AuthorName: mixd.tv
AuthorWebSite: https://radiozeit.de
WebSite: https://freies-radio.radiozeit.de
SourceCode: https://github.com/mixdtv/freies-radio-app
IssueTracker: https://github.com/mixdtv/freies-radio-app/issues

RepoType: git
Repo: https://github.com/mixdtv/freies-radio-app.git

Builds:
  - versionName: 1.0.2
    versionCode: 20
    commit: 7b1b40bd6249d919e9f7f4def90a19788336f96b
    output: build/app/outputs/flutter-apk/app-fdroid-release.apk
    srclibs:
      - flutter@stable
    rm:
      - ios
      - .env.example.json
    prebuild:
      - python3 scripts/prepare-fdroid-pubspec.py
      - cp lib/features/location/location_service_fdroid_stub.dart lib/features/location/location_service.dart
      - flutterVersion=$(sed -n -E "s/.*flutter-version:\ '(.*)'/\1/p" .github/workflows/analyze.yml)
      - '[[ $flutterVersion ]]'
      - git -C $$flutter$$ checkout -f $flutterVersion
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get
    scandelete:
      - .pub-cache
    build:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter build apk --release --flavor fdroid --dart-define=API_KEY=fdroid-public-readonly
        --dart-define=API_URL=https://api.freies-radio.radiozeit.de/ --dart-define=EPG_URL=https://epg.freies-radio.radiozeit.de/radio/epg/
        --dart-define=USE_SOURCE_STREAM=true --dart-define=ENABLE_ARCHIVE_PLAYBACK=true
        --dart-define=FORCE_HLS_STATIONS=alex

AutoUpdateMode: Version
UpdateCheckMode: Tags
UpdateCheckData: pubspec.yaml|version:\s.+\+(\d+)|.|version:\s(.+)\+
CurrentVersion: 1.0.2
CurrentVersionCode: 20
