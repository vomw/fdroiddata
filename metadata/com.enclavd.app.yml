  - versionName: 2.0.1
    versionCode: 2011
    commit: 7f5724ac16157ea7cc003396b94fc993a64b3353
    sudo:
      - mkdir -p /home/runner/work/enclavd-android-source
      - chown -R vagrant /home/runner/work/enclavd-android-source
    output: build/app/outputs/flutter-apk/app-armeabi-v7a-fdroid-release.apk
    binary: 
      https://github.com/Slime-jkl/enclavd-android-source/releases/download/v%v/binary-armeabi-v7a.apk
    srclibs:
      - flutter@3.47.1
    prebuild:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter config --no-analytics
    scandelete:
      - .pub-cache
    build: bash tool/fdroid_build.sh $$flutter$$ android-arm

