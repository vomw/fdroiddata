AutoName: Tine
Summary: Fast local-first Logseq-compatible outliner
Description: |-
    Tine is a fast, local-first outliner that reads and writes a real Logseq
    Markdown (and Org) graph on disk. It aims to feel like — and round-trip with —
    Logseq: the outliner, tasks/priorities, journals, page/block references,
    queries (with a visual builder), PDF and media, and HTML export.

RepoType: git
Repo: https://github.com/martinkoutecky/tine.git

Builds:
  - versionName: 0.4.2
    versionCode: 4002
    commit: v0.4.2
    sudo:
      - apt-get update || true
      - apt-get install -y nodejs npm binaryen
    ndk: 26.3.11579264
    build:
      - cargo install wasm-pack --version 0.15.0 --locked
      - rustup target add aarch64-linux-android wasm32-unknown-unknown
      - npm ci
      - npm run build:wasm
      - ./node_modules/.bin/tauri android build --target aarch64 --apk
    output: src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release-unsigned.apk

