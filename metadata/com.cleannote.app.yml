AutoName: Clean Note
Summary: Minimal, privacy-first offline notes with visual timeline and tags
Description: |-
  Clean Note is a modern, privacy-focused, offline-first notes application
  built with Jetpack Compose and Material Design 3.

  Features:
  * Offline-First: All data stays strictly on your device.
  * Zero Tracking or Ads: No telemetry or proprietary cloud dependencies.
  * Visual Timeline: Chronologically grouped note entries.
  * Tags & Mentions: Organize with @person tags and topics.
  * Local Backup & Restore: Export and import your data anytime.

