Categories:
  - Cloud Storage & File Sync
  - File Encryption & Vault
  - Security
License: AGPL-3.0-only
AuthorName: ente
AuthorEmail: support@ente.io
AuthorWebSite: https://ente.io/locker
WebSite: https://ente.io/locker
SourceCode: https://github.com/ente-io/ente
IssueTracker: https://github.com/ente-io/ente/issues
Translation: https://crowdin.com/project/ente-locker-app
Changelog: https://github.com/ente-io/ente/releases?q=tag%3Alocker-v0

AutoName: Ente Locker

RepoType: git
Repo: https://github.com/ente-io/ente.git

Builds:
  - versionName: 0.1.6
    versionCode: 83
    commit: locker-v0.1.6
    subdir: mobile/apps/locker
    submodules: true
    output: build/app/outputs/flutter-apk/app-fdroid-release.apk
    srclibs:
      - flutter@3.32.8
      - flutter@stable
    rm:
      - mobile/apps/locker/ios
      - mobile/apps/locker/linux
      - mobile/apps/locker/macos
      - mobile/apps/locker/web
      - mobile/apps/locker/windows
    prebuild:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - flutterVersion=$(sed -n -E 's/.*FLUTTER_VERSION:[[:space:]]*"([0-9.]+)".*/\1/p' ../../../.github/workflows/locker-release.yml)
      - '[[ $flutterVersion ]]'
      - git -C $$flutter$$ checkout -f $flutterVersion
      - $$flutter$$/bin/flutter config --no-analytics
      - pushd ../../packages/strings
      - $$flutter$$/bin/flutter pub get
      - $$flutter$$/bin/flutter gen-l10n
      - popd
      - $$flutter$$/bin/flutter pub get
    scandelete:
      - .pub-cache
    build:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter build apk --release --flavor fdroid
    antifeatures:
      NonFreeNet:
        en-US: App uses non-libre sync server.

AutoUpdateMode: Version
UpdateCheckMode: Tags ^locker-v[0-9.]+$
UpdateCheckData: mobile/apps/locker/pubspec.yaml|version:\s.+\+(\d+)|.|version:\s(.+)\+
CurrentVersion: 0.1.6
CurrentVersionCode: 83
