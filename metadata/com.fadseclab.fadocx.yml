AutoName: Fadocx

RepoType: git
Repo: https://github.com/anonfaded/Fadocx.git

MaintainerNotes: |-
  Uses the `prod` flavor and builds only `arm64-v8a`.
  `pdfrx`/`pdfium_flutter` is patched during prebuild so Android uses locally built PDFium
  tarballs from the `pdfium-binaries` srclib instead of downloading them during the build.
  LibreOffice and its dependent native libraries are still bundled from `android/app/src/main/jniLibs/`.
  The source repo contains build documentation in `docs/libreofficekit-build-guide.md`, but that
  native build is not yet automated in this F-Droid recipe.

Builds:
  - versionName: 1.0.0
    versionCode: 3
    commit: e99f8652fdb4274f631a73450a7943d39e3ec0ae
    output: build/app/outputs/flutter-apk/app-arm64-v8a-prod-release.apk
    srclibs:
      - flutter@stable
      - pdfium-binaries@chromium/7520
    rm:
      - ios
      - linux
      - macos
      - web
      - windows
    prebuild:
      - find . -name .DS_Store -delete
      - flutterVersion=$(cat .flutter-version)
      - '[[ $flutterVersion ]]'
      - git -C $$flutter$$ checkout -f $flutterVersion
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get
      - $$flutter$$/bin/dart run pdfrx:remove_wasm_modules
      - grep 'set(PDFIUM_RELEASE chromium%2F7520)' $PUB_CACHE/hosted/pub.dev/pdfium_flutter-*/android/CMakeLists.txt
      - sed -i -e '/file(DOWNLOAD https:\/\/github.com\/bblanchon\/pdfium-binaries\/releases\/download\/${PDFIUM_RELEASE}\/${PDFIUM_ARCHIVE_NAME}.tgz ${PDFIUM_RELEASE_DIR}\/${PDFIUM_ARCHIVE_NAME}.tgz)/c\    file(COPY "$ENV{PDFIUM_LOCAL_DIR}/${PDFIUM_ARCHIVE_NAME}.tgz" DESTINATION ${PDFIUM_RELEASE_DIR})' $PUB_CACHE/hosted/pub.dev/pdfium_flutter-*/android/CMakeLists.txt
    scandelete:
      - .pub-cache
    build:
      - pushd $$pdfium-binaries$$
      - export PDFium_BRANCH="chromium/7520"
      - export PDFium_VERSION="144.0.7520.0"
      - sed -i 's|sudo |echo |g' steps/01-install.sh
      - echo 'sed -i "s|  sys.exit(main())|  sys.exit(0)|g" pdfium/build/install-build-deps.py' >> steps/02-checkout.sh
      - truncate -s 0 steps/09-test.sh
      - ./build.sh -b "$PDFium_BRANCH" android arm64
      - popd
      - export PDFIUM_LOCAL_DIR=$$pdfium-binaries$$
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter build apk --flavor prod --release --split-per-abi --target-platform=android-arm64
    ndk: 27.2.12479018

AutoUpdateMode: Version
UpdateCheckMode: Tags ^v[\d.]+$
UpdateCheckData: android/app/build.gradle.kts|val appVersionCode = (\d+)|.|val appVersionName = "([^"]+)"
CurrentVersion: 1.0.0
CurrentVersionCode: 3
