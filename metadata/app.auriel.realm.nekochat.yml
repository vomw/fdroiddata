Builds:
  - versionName: 0.2.0
    versionCode: 4
    commit: 24563d1b65ed416de644af6d072c2fc754c72c7e
    subdir: app
    sudo:
      - apt-get update
      - apt-get install -y curl make perl pkg-config tar unzip xz-utils
    gradle:
      - yes
    rm:
      - app/src/main/jniLibs
    build:
      - export WORK="$(cd .. && pwd)/.aria2-work"
      - mkdir -p "$WORK"
      - ln -s "$$NDK$$" "$WORK/android-ndk-r28c"
      - NEKO_ARIA2_WORK="$WORK" NEKO_NDK_VERSION=r28c bash ../tools/build-aria2.sh
    ndk: r28c

MaintainerNotes: |-
  The upstream repo commits the aria2c binary it builds, as
  app/src/main/jniLibs/arm64-v8a/libaria2c.so, so that a plain gradle build
  works without an NDK. It is removed by `rm:` and rebuilt from source in
  `build:` with upstream's own tools/build-aria2.sh.

  The script normally downloads the NDK into its work directory; symlinking
  $$NDK$$ into place makes that check a no-op. NEKO_NDK_VERSION must match the
  `ndk:` field, since the symlink is named after it. It does fetch the release
  tarballs of aria2 1.37.0, OpenSSL 3.5.4, zlib 1.3.1, expat 2.7.3, c-ares
  1.34.5 and libssh2 1.11.1, each pinned by SHA-256 in the script.

  Only arm64-v8a is built (abiFilters), and the C++ inference engine under
  app/architecture is built by the gradle CMake integration.

  Models (GPT-2, Qwen3, Granite 4.0-H), the Kokoro-82M voice and the Granite
  Speech models are not in the APK. They are downloaded from Hugging Face only
  when the user asks, or loaded from a folder the user picks. No account, no
  telemetry.

  NonFreeNet: the downloads come from Hugging Face, as for org.woheller69.whisper.
  Nothing is downloaded unless the user starts it, and chat models can be read
  from a local folder instead.

  Voice input offers two speech models with the same architecture: Granite
  Speech 5.0 TurboCTC (Apache-2.0) and its -nc variant (CC BY-NC-SA 4.0,
  personal and non-commercial use). Neither is bundled; the app shows the
  license before downloading either one.

