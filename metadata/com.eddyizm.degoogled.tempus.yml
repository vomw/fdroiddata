Builds:
  - versionName: 4.21.2
    versionCode: 34
    commit: cff9e71f60bff824dba694d3487d41c5671f67fc
    subdir: app
    sudo:
      - apt-get update
      - apt-get install -y make ninja-build cmake nasm
      - update-alternatives --auto java
    gradle:
      - degoogled
    output: build/outputs/apk/degoogled/release/*.apk
    srclibs:
      - media-moneytoo@1.9.2
      - FFmpeg@release/6.0
    prebuild: sed -i -e '/foojay/d' ../settings.gradle
    scandelete:
      - libs/
    build:
      - mkdir -p ../libs
      - export FFMPEG_EXT_PATH="$$media-moneytoo$$/libraries/decoder_ffmpeg/src/main"
      - export HOST_PLATFORM="$(uname -s | tr '[:upper:]' '[:lower:]')-x86_64"
      - export ANDROID_ABI=24
      - export ENABLED_DECODERS=(alac)
      - pushd "${FFMPEG_EXT_PATH}/jni"
      - ln -s "$$FFmpeg$$" ffmpeg
      - cd "${FFMPEG_EXT_PATH}/jni"
      # --- Add deterministic flags (must match container) ---
      - export CFLAGS="-fno-ident -ffile-prefix-map=${PWD}=. -fdebug-prefix-map=${PWD}=."
      - export LDFLAGS="-Wl,--build-id=none"
      - export SOURCE_DATE_EPOCH=0
      - export ARFLAGS="rcsD"
      # -----------------------------------------------------
      - ./build_ffmpeg.sh "${FFMPEG_EXT_PATH}" "$$NDK$$" "${HOST_PLATFORM}" "${ANDROID_ABI}" "${ENABLED_DECODERS[@]}"
      - cd "$$media-moneytoo$$"
      - ./gradlew :lib-decoder-ffmpeg:bundleReleaseAar
      - popd
      - cp $$media-moneytoo$$/libraries/decoder_ffmpeg/buildout/outputs/aar/*.aar ../libs/

