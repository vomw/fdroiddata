Builds:
  - versionName: 4.17.0
    versionCode: 28
    commit: ce440a60d1c1849b8079233ffd94cb272001192d
    subdir: app
    sudo:
      - apt-get update
      - apt-get install -y make ninja-build cmake nasm
      - update-alternatives --auto java
    gradle:
      - degoogled
    output: build/outputs/apk/degoogled/release/*armeabi-v7a*.apk
    srclibs:
      - media-moneytoo@1.9.2
      - FFmpeg@release/6.0
    prebuild: sed -i '/id "org.gradle.toolchains.foojay-resolver"/d' ../settings.gradle
    scandelete:
      - libs/
    build:
      - export FFMPEG_EXT_PATH="$$media-moneytoo$$/libraries/decoder_ffmpeg/src/main"
      - export HOST_PLATFORM="$(uname -s | tr '[:upper:]' '[:lower:]')-x86_64"
      - export ANDROID_ABI=24
      - export ENABLED_DECODERS=(alac)
      - pushd "${FFMPEG_EXT_PATH}/jni"
      - ln -s "$$FFmpeg$$" ffmpeg
      - cd "${FFMPEG_EXT_PATH}/jni"
      - ./build_ffmpeg.sh "${FFMPEG_EXT_PATH}" "$$NDK$$" "${HOST_PLATFORM}" "${ANDROID_ABI}"
        "${ENABLED_DECODERS[@]}"
      - cd "$$media-moneytoo$$"
      - ./gradlew :lib-decoder-ffmpeg:bundleReleaseAar
      - popd
      - cp $$media-moneytoo$$/libraries/decoder_ffmpeg/buildout/outputs/aar/*.aar
        ../libs/
    ndk: 26.1.10909125
    gradleprops:
      - abiFilter=armeabi-v7a

