    sudo:
      - echo "deb https://deb.debian.org/debian trixie main" > /etc/apt/sources.list.d/trixie.list
      - apt-get update
      - apt-get install -y -t trixie golang-go gcc libc6-dev
    gradle:
      - yes
    srclibs:
      - go@go1.25.3
      - reproducible-apk-tools@v0.2.3
