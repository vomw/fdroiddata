# No anti-features

AutoName: TalkinClaw
Summary: Push-to-talk voice client for self-hosted LLMs and AI agents
Description: |
  TalkinClaw is a lightweight, easy-to-use voice client for self-hosted LLMs
  and AI agents such as OpenClaw.

  Key features:
  * Push-to-talk voice interface — no wake words, no always-on mic
  * On-device STT (Whisper via sherpa-onnx) and TTS (Kokoro via sherpa-onnx) — nothing leaves your phone
  * Transcript review before sending — confirm, edit, or redo
  * Works over Tailscale or any private network connection
  * Async polling protocol — survives aggressive connection management on privacy ROMs (iodéOS, CalyxOS, GrapheneOS)
  * Live transcription as you speak
  * Configurable server URL with connection testing
  * Chunked model downloads with automatic resume
  * Security warning for unencrypted connections to public IPs
  * No cloud, no accounts, no data collection
  * 100% open source

  Requires a self-hosted LLM backend (OpenClaw, Ollama, LiteLLM, or any
  backend that accepts the OpenAI chat format) and the included
  voice-gateway.js bridge. Works on Android 8.0+ (API 26).

