Builds:
  - versionName: 2.0.2
    versionCode: 202
    commit: 57af01130e1e89cb4425eb849573ac563884d5ef
    submodules: true
    output: build/app/outputs/flutter-apk/app-release.apk
    rm:
      - ios
    prebuild:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - .flutter/bin/flutter config --no-analytics
    scanignore:
      - .flutter/bin/cache
    scandelete:
      - .flutter
      - .pub-cache
    build:
      - echo -e 
        "CLIENT_ID=1\nSENTRY_DSN=https://c4e904a15f7a47e6ab28ec0ef791add3@o350176.ingest.sentry.io/5364455"
        > .env
      - .flutter/bin/flutter pub get
      - .flutter/bin/dart run intl_utils:generate
      - .flutter/bin/dart run build_runner build
      - .flutter/bin/flutter build apk

AutoUpdateMode: Version
UpdateCheckMode: Tags .*[0-9]$
