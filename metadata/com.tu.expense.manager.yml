Categories:
  - Finance Manager
License: GPL-3.0-only
AuthorName: Jayachandran S
AuthorWebSite: https://www.instagram.com/hardcoree_gamerr/
SourceCode: https://github.com/Jayachandran-jayy/TU-Expense-Manager
IssueTracker: https://github.com/Jayachandran-jayy/TU-Expense-Manager/issues

AutoName: TU Expense Tracker

RepoType: git
Repo: https://github.com/Jayachandran-jayy/TU-Expense-Manager

Builds:
  - versionName: 2.4.3
    versionCode: 25
    commit: 5b1365bd5bd60b6ec6bae4d2f8d44ba1b84f17ff
    output: build/app/outputs/flutter-apk/app-release.apk
    srclibs:
      - flutter@stable
    rm:
      - test
      - web
    prebuild:
      - flutterVersion=$(sed -n -E "s/.*flutter-version:\ (.*)/\1/p" .github/workflows/release.yml)
      - '[[ $flutterVersion ]]'
      - git -C $$flutter$$ checkout -f $flutterVersion
      - export PUB_CACHE=$(pwd)/.pub-cache
      - echo 'android { dependenciesInfo { includeInApk = false; includeInBundle =
        false } }' >> android/app/build.gradle.kts
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get --enforce-lockfile
    scandelete:
      - .pub-cache
    build:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter build apk --release --dart-define=FDROID_BUILD=true

AutoUpdateMode: Version
UpdateCheckMode: Tags
UpdateCheckData: pubspec.yaml|version:\s.+\+(\d+)|.|version:\s(.+)\+
CurrentVersion: 2.4.3
CurrentVersionCode: 25
