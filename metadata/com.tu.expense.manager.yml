AutoName: TU Expense Tracker
Description: |-
  TU Expense Tracker is a modern personal finance app designed for simplicity,
  privacy, and speed. It automatically reads your incoming bank transaction
  SMS alerts directly on your device.

  * 100% Private & Offline First: No data leaves your device.
  * Zero Manual Effort for Routine Purchases: Auto-categorize known merchants.
  * Smart Multi-Category Splitting: Easily split receipts across categories.
  * Beautiful Modern UI: OLED pitch black mode and dynamic themes.
  * Visual Spending Dashboard: Interactive charts and trend analysis.

