Categories:
  - Finance Manager
License: GPL-3.0-only
SourceCode: https://github.com/Jayachandran-jayy/TU-Expense-Manager
IssueTracker: https://github.com/Jayachandran-jayy/TU-Expense-Manager/issues

AutoName: TU Expense Tracker

RepoType: git
Repo: https://github.com/Jayachandran-jayy/TU-Expense-Manager

Builds:
  - versionName: 1.1.0
    versionCode: 23
    commit: v2.3.0
    output: build/app/outputs/flutter-apk/app-release.apk
    srclibs:
      - flutter@3.47.0
    rm:
      - test
      - web
    prebuild:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - echo 'android { dependenciesInfo { includeInApk = false; includeInBundle =
        false } }' >> android/app/build.gradle.kts
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get --enforce-lockfile
    scandelete:
      - .pub-cache
    build:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter build apk --release --dart-define=FDROID_BUILD=true

AutoUpdateMode: Version
UpdateCheckMode: Tags
UpdateCheckData: pubspec.yaml|version:\s.+\+(\d+)|.|version:\s(.+)\+
CurrentVersion: 1.1.0
CurrentVersionCode: 23
