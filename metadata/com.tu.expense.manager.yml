Categories:
  - Finance Manager
License: GPL-3.0-only
SourceCode: https://github.com/Jayachandran-jayy/TU-Expense-Manager
IssueTracker: https://github.com/Jayachandran-jayy/TU-Expense-Manager/issues

AutoName: TU Expense Tracker
Description: |-
  TU Expense Tracker is a modern personal finance app designed for simplicity,
  privacy, and speed. It automatically reads your incoming bank transaction
  SMS alerts directly on your device.

  * 100% Private & Offline First: No data leaves your device.
  * Zero Manual Effort for Routine Purchases: Auto-categorize known merchants.
  * Smart Multi-Category Splitting: Easily split receipts across categories.
  * Beautiful Modern UI: OLED pitch black mode and dynamic themes.
  * Visual Spending Dashboard: Interactive charts and trend analysis.

RepoType: git
Repo: https://github.com/Jayachandran-jayy/TU-Expense-Manager

Builds:
  - versionName: 1.1.0
    versionCode: 23
    commit: v2.3.0
    output: build/app/outputs/flutter-apk/app-release.apk
    srclibs:
      - flutter@3.47.0
    rm:
      - ios
    prebuild:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get
    scandelete:
      - .pub-cache
    build:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter build apk --release 
        --dart-define=FDROID_BUILD=true

AutoUpdateMode: Version
UpdateCheckMode: Tags
UpdateCheckData: pubspec.yaml|version:\s.+\+(\d+)|.|version:\s(.+)\+
CurrentVersion: 1.1.0
CurrentVersionCode: 23
