Repo: https://github.com/Jayachandran-jayy/TU-Expense-Manager

Builds:
  - versionName: 2.4.5
    versionCode: 271
    commit: 10e9999304c346df1215682d8dbc57beb466228f
    output: build/app/outputs/flutter-apk/app-x86_64-release.apk
    srclibs:
      - flutter@stable
    rm:
      - test
      - web
    prebuild:
      - flutterVersion=$(sed -n -E "s/.*flutter-version:\ (.*)/\1/p" .github/workflows/release.yml)
      - '[[ $flutterVersion ]]'
      - git -C $$flutter$$ checkout -f $flutterVersion
      - export PUB_CACHE=$(pwd)/.pub-cache
      - echo 'android { dependenciesInfo { includeInApk = false; includeInBundle =
        false } }' >> android/app/build.gradle.kts
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get --enforce-lockfile
    scandelete:
      - .pub-cache
    build:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter build apk --release --split-per-abi --build-number
        $(( $$VERCODE$$/10 )) --build-name=$$VERSION$$ --target-platform="android-x64"
        --dart-define=FDROID_BUILD=true

