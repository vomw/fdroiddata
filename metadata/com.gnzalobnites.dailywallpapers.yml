Summary: Cambia fondos de pantalla diariamente de forma automática
Description: Una aplicación ligera y de código abierto diseñada para renovar el aspecto de tu dispositivo todos los días. Permite automatizar el cambio de fondos de pantalla utilizando fuentes personalizadas o locales, respetando la privacidad del usuario y sin rastreadores ocultos.

CurrentVersion: '1.0'
CurrentVersionCode: 1

RepoType: git
Repo: https://gitlab.com/gnzalobnites-group/daily-wallpapers.git

Builds:
  - versionName: '1.0'
    versionCode: 1
    commit: v1.0
    subdir: app
    gradle:
      - yes
    prebuild:
      - sed -i '/com.google.android.play:app-update/d' build.gradle
      - sed -i '/kotlinx-coroutines-play-services/d' build.gradle
      - sed -i 's/signingConfig signingConfigs.release/\/\/ signingConfig signingConfigs.release/g' build.gradle

AutoUpdateMode: Version
UpdateCheckMode: Tags
AutoName: Daily Wallpapers
