AutoName: Daily Wallpapers
AutoUpdateMode: Version
Categories:
  - System
  - Graphics

CurrentVersion: '1.0'
CurrentVersionCode: 1

Description: |
  Aplicación ligera y de código abierto para renovar el aspecto del dispositivo automáticamente.

  Permite cambiar el fondo de pantalla diariamente usando imágenes locales o fuentes personalizadas.

  Respeta la privacidad del usuario y no incluye rastreadores ocultos.

IssueTracker: https://gitlab.com/gnzalobnites-group/daily-wallpapers/-/issues
License: GPL-3.0-or-later
Repo: https://gitlab.com/gnzalobnites-group/daily-wallpapers.git
RepoType: git
SourceCode: https://gitlab.com/gnzalobnites-group/daily-wallpapers
Summary: Cambio automático diario de fondos de pantalla
UpdateCheckMode: Tags
WebSite: https://gitlab.com/gnzalobnites-group/daily-wallpapers

Builds:
  - versionName: '1.0'
    versionCode: 1
    commit: v1.0
    subdir: app
    gradle:
      - yes
    prebuild:
      - sed -i '/com.google.android.play:app-update/d' build.gradle
      - sed -i '/kotlinx-coroutines-play-services/d' build.gradle
      - sed -i '/signingConfigs.release/d' build.gradle