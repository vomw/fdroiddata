AutoName: Daily Wallpapers
AutoUpdateMode: Version
Categories:
  - System
  - Graphics
CurrentVersion: '1.0'
CurrentVersionCode: 1
Description: |
  Una aplicación ligera y de código abierto diseñada para renovar el aspecto de tu dispositivo todos los días. Permite automatizar el cambio de fondos de pantalla utilizando fuentes personalizadas o locales, respetando la privacidad del usuario y sin rastreadores ocultos.
IssueTracker: https://gitlab.com/gnzalobnites-group/daily-wallpapers/-/issues
License: GPL-3.0-or-later
Repo: https://gitlab.com/gnzalobnites-group/daily-wallpapers.git
RepoType: git
SourceCode: https://gitlab.com/gnzalobnites-group/daily-wallpapers
Summary: Cambia fondos de pantalla diariamente de forma automática
UpdateCheckMode: Tags
WebSite: https://gitlab.com/gnzalobnites-group/daily-wallpapers

Builds:
  - versionName: '1.0'
    versionCode: 1
    commit: v1.0
    subdir: app
    gradle:
      - yes
    prebuild:
      - sed -i '/com.google.android.play:app-update/d' build.gradle
      - sed -i '/kotlinx-coroutines-play-services/d' build.gradle
      - sed -i 's/signingConfig signingConfigs.release/\/\/ signingConfig signingConfigs.release/g' build.gradle
