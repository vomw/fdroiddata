License: MIT
AuthorName: Emil Hongisto (Limekana)
SourceCode: https://github.com/Limekana/limelog
IssueTracker: https://github.com/Limekana/limelog/issues

AutoName: LimeLog
Summary: Track your lifts and beat your personal records

Description: |-
  LimeLog is a periodized strength-training tracker. Build programs with
  phases, log every set and rep, auto-detect personal records (Epley 1RM),
  see a progressive-overload reference while logging, and track estimated
  1RM trends with a per-exercise PR history. Optional vertical-jump and
  body-metric tracking; Health Connect steps and active calories.

  Local-first; optional account-gated cloud sync. No Google Play Services,
  no Firebase — Google sign-in is a plain web OAuth flow.

  Part of the Limecore Nexus suite.

RepoType: git
Repo: https://github.com/Limekana/limelog.git

