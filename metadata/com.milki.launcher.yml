AutoName: Milki Launcher
Summary: Android launcher with multi-source search
Description: |-
  Milki Launcher is a custom Android home screen replacement built from scratch with Kotlin and Jetpack Compose. It focuses on a clean interface, and powerful search capabilities.

  <b>Multi-Mode Search</b>: Search apps, contacts, files, the web, and YouTube from a single search bar. Use prefixes: no prefix for apps, "s " for web, "c " for contacts.

  <b>Smart Home Screen</b>: Place apps, shortcuts, folders, and widgets anywhere on a customizable grid.

  <b>File Search</b>: Find documents on your device.

  <b>Widget & Folder Support</b>: Full home screen widget management and app folder organization.

  <b>Backup & Restore</b>: Export your home screen layout and settings.

  <b>Privacy</b>: No analytics, no tracking, no network access. All data stays on your device.

