Categories:
  - Science & Education
  - Sports & Health
License: MIT
AuthorName: Claudio Di Maio
AuthorWebSite: https://claudiodimaio.netlify.app/
WebSite: https://github.com/ZiClaud/Iremi-Breathing-App
SourceCode: https://github.com/ZiClaud/Iremi-Breathing-App
IssueTracker: https://github.com/ZiClaud/Iremi-Breathing-App/issues

AutoName: Iremi

RepoType: git
Repo: https://github.com/ZiClaud/Iremi-Breathing-App.git

Builds:
  - versionName: 1.1.9
    versionCode: 1
    commit: a800cdce29a74b4b90fe0933a1c5a61232811ea0
    output: build/app/outputs/flutter-apk/app-release.apk
    srclibs:
      - flutter@stable
    prebuild:
      - flutterVersion=3.38.7
      - '[[ $flutterVersion ]]'
      - git -C $$flutter$$ checkout -f $flutterVersion
      - export PUB_CACHE=$(pwd)/.pub-cache
      - .flutter/bin/flutter config --no-analytics
      - .flutter/bin/flutter pub get
    scanignore:
      - .flutter/packages/flutter_tools/gradle/flutter.gradle
      - .flutter/bin/cache
    scandelete:
      - .flutter
      - .pub-cache
    build:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - .flutter/bin/flutter build apk --release --split-per-abi --target-platform="android-arm64"

AutoUpdateMode: Version
UpdateCheckMode: Tags
UpdateCheckData: pubspec.yaml|version:\s.+\+(\d+)|.|version:\s(.+)\+
CurrentVersion: 1.1.9
CurrentVersionCode: 1
