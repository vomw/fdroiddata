Categories:
  - Science & Education
  - Sports & Health
License: MIT
AuthorName: Claudio Di Maio
AuthorWebSite: https://claudiodimaio.netlify.app/
WebSite: https://github.com/ZiClaud/Iremi-Breathing-App
SourceCode: https://github.com/ZiClaud/Iremi-Breathing-App
IssueTracker: https://github.com/ZiClaud/Iremi-Breathing-App/issues

Summary: Breathing exercises app for anxiety
Description: Iremi Breathing App provides breathing exercises designed to help manage
  anxiety and promote relaxation.

RepoType: git
Repo: https://github.com/ZiClaud/Iremi-Breathing-App.git

Builds:
  - versionName: 1.1.5
    versionCode: 1
    commit: v1.1.5
    output: build/app/outputs/flutter-apk/app-release.apk
    srclibs:
      - flutter@stable
    prebuild:
      - git -C $$flutter$$ checkout -f stable
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get
    scandelete:
      - .pub-cache
    build:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter build apk --release

AutoUpdateMode: Version
UpdateCheckMode: Tags
UpdateCheckData: pubspec.yaml|version:\s.+\+(\d+)|.|version:\s(.+)\+
CurrentVersion: 1.1.5
CurrentVersionCode: 1
