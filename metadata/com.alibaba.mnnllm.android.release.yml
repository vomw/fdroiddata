        -DMNN_SEP_BUILD=OFF -DCMAKE_SHARED_LINKER_FLAGS='-Wl,-z,max-page-size=16384'
        -DCMAKE_INSTALL_PREFIX=."
      - make install
      - popd
      - pushd ../../../frameworks/sherpa-mnn
      - export MNN_LIB_DIR=../../../project/android/build_64/
      - sed -i -e 's/BUILD_SHARED_LIBS=ON/BUILD_SHARED_LIBS=OFF/' build-android-arm64-v8a.sh
      - bash build-android-arm64-v8a.sh
      - mkdir -p ../../Android/MnnLlmChat/app/src/main/jniLibs/arm64-v8a
      - cp build-android-arm64-v8a-static/lib/libsherpa-mnn-jni.so ../../Android/MnnLlmChat/app/src/main/jniLibs/arm64-v8a
      - popd
