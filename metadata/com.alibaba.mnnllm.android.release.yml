    prebuild:
      - sed -i -e '/com.google.firebase/d' build.gradle ../build.gradle
      - sed -i -e '/FirebaseAnalytics/d' src/main/java/com/alibaba/mnnllm/android/utils/AnalyticsTracker.kt
      - sed -i -e '/Crashlytics/d' src/main/java/com/alibaba/mnnllm/android/MnnLlmApplication.kt
      - echo 'package com.alibaba.mnnllm.android.utils object CrashReportContext {fun
        setCurrentActivity(activityName:String?) {} fun setAppInForeground(inForeground:Boolean)
        {} fun setCurrentModel(modelId:String?, sessionId:String?) {} fun setBenchmarkState(state:String?)
        {} fun 
        setBenchmarkContext(modelId:String?,backend:String?,nPrompt:Int,nGenerate:Int,nRepeat:Int,kvCache:String?)
        {}}' > src/main/java/com/alibaba/mnnllm/android/utils/CrashReportContext.kt
      - echo 'package com.alibaba.mnnllm.android.debug import androidx.appcompat.app.AppCompatActivity
        class DebugActivity:AppCompatActivity() {}' > src/main/java/com/alibaba/mnnllm/android/debug/DebugActivity.kt
    scandelete:
      - 3rd_party/flatbuffers
      - tools/cv/imgs/cat__
    build:
      - pushd ../../../../project/android
      - mkdir build_64
      - cd build_64
      - bash ../build_64.sh "-DMNN_LOW_MEMORY=true -DMNN_CPU_WEIGHT_DEQUANT_GEMM=true
        -DMNN_BUILD_LLM=true -DMNN_SUPPORT_TRANSFORMER_FUSE=true -DMNN_ARM82=true
