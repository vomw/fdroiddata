Name: Mindful Breathe
AutoName: Mindful Breathe

Summary: A mindful breathing coach app
Description: |-
  A calm, offline breathing coach for guided breathwork sessions.
  Choose from built-in presets (Box Breathing, 4-7-8, Wim Hof, etc.)
  or create your own custom pattern. Tracks inhale, hold, and exhale
  phases with audio cues and haptic feedback. Fully offline — no
  accounts, no tracking, no network access.

  Features:
  * Multiple breathing presets with guides
  * Custom preset builder
  * Phase sounds and vibration
  * Dark mode
  * Multilingual

RepoType: git
