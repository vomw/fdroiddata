Summary: Open-source anonymous X/Twitter client
Description: |-
  Squawkkers is an open-source client for reading X/Twitter content
  without requiring a first-party app account session.

  Features include:
  * Chronological feed from subscriptions
  * Profile browsing (Tweets, Tweets & Replies, Media, Saved)
  * Search and trends
  * Local saved tweets
  * Light and dark themes

  This app depends on network APIs operated by a proprietary service.
