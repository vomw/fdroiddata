  https://github.com/foxhole-team/foxhole-guard/releases/download/v%v/FoxHole-v%v-arm64-v8a-release.apk

Builds:
  - versionName: 0.1.0
    versionCode: 117
    commit: 597a3603afa9be92cf2d1bede2882ba27a4f08cd
    submodules: true
    sudo:
      - apt-get update
      - apt-get install -y --no-install-recommends build-essential 
        ca-certificates cmake ninja-build perl pkg-config rustup
    output: app/build/outputs/apk/release/app-arm64-v8a-release-unsigned.apk
    srclibs:
      - FoxHoleCore@cd8bf71e950247d7bcebc8cd62142adef5c970fc
    prebuild:
      - test "$(tr -d '[:space:]' < config/foxcore-revision.txt)" = "$(git -C 
        $$FoxHoleCore$$ rev-parse HEAD)"
      - rustup set profile minimal
      - rustup default 1.97.1
      - export RUSTUP_TOOLCHAIN=1.97.1
      - rustup target add --toolchain 1.97.1 aarch64-linux-android
      - cargo install cargo-ndk --version 4.1.2 --locked
      - cargo fetch --locked --manifest-path $$FoxHoleCore$$/Cargo.toml
      - scripts/fetch-native-deps.sh
    build:
      - export RUSTUP_TOOLCHAIN=1.97.1
      - export ANDROID_NDK_HOME=$$NDK$$
      - export FOXCORE_SOURCE_ROOT=$$FoxHoleCore$$
      - export FOXHOLE_NATIVE_OFFLINE=1
      - export I2PD_ABIS=arm64-v8a
      - export TOR_TRANSPORT_ABIS=arm64-v8a
      - gradle --no-daemon --console=plain -Pfoxhole.splitApks=true 
        -Pfoxhole.updateChannel=github -Pfoxhole.nativeOffline=true 
        :app:assembleRelease
    ndk: 29.0.14206865
    gradleprops:
      - foxhole.splitApks=true
      - foxhole.updateChannel=github
      - foxhole.nativeOffline=true

