Builds:
  - versionName: 0.0.2
    versionCode: 90
    commit: 96e963fc020ef9615c1301d7f252352c3ab84cdd
    submodules: true
    sudo:
      - apt-get update
      - apt-get install -y --no-install-recommends build-essential ca-certificates
        cmake curl git ninja-build perl pkg-config rustup
      - mkdir -p /home/runner/work/foxhole-guard
      - chown -R vagrant /home/runner
    output: app/build/outputs/apk/release/app-release-unsigned.apk
    srclibs:
      - FoxHoleCore@83c9f4b95080c254a4f88d2f2cb7fd48ad849c05
    prebuild:
      - test "$(tr -d '[:space:]' < config/foxcore-revision.txt)" = "$(git -C $$FoxHoleCore$$
        rev-parse HEAD)"
      - export CARGO_HOME=/home/runner/.cargo
      - export RUSTUP_HOME=/home/runner/.rustup
      - rustup set profile minimal
      - rustup default 1.97.1
      - rustup component add clippy rustfmt
      - rustup target add aarch64-linux-android
      - cargo install cargo-ndk --version 4.1.2 --locked
      - cargo fetch --locked --manifest-path $$FoxHoleCore$$/Cargo.toml
      - export FOXHOLE_NATIVE_DEPS_DIR=/home/runner/work/foxhole-guard/foxhole-native-deps
      - scripts/fetch-native-deps.sh
    build:
      - mkdir -p /home/runner/work/foxhole-guard
      - cd ..
      - mv com.foxhole.guard /home/runner/work/foxhole-guard/foxhole-guard
      - pushd /home/runner/work/foxhole-guard/foxhole-guard
      - export CARGO_HOME=/home/runner/.cargo
      - export RUSTUP_HOME=/home/runner/.rustup
      - export PATH="$CARGO_HOME/bin:$PATH"
      - export ANDROID_NDK_HOME=$$NDK$$
      - export FOXCORE_SOURCE_ROOT=$$FoxHoleCore$$
      - export FOXHOLE_NATIVE_DEPS_DIR=/home/runner/work/foxhole-guard/foxhole-native-deps
      - export FOXHOLE_NATIVE_OFFLINE=1
      - export I2PD_ABIS=arm64-v8a
      - SOURCE_DATE_EPOCH=1787044986 scripts/build-i2pd.sh
      - perl -0777 -pi -e 'use bytes; my $prefix = pack("V3a4", 4, 20, 3, "GNU\0");
        my $new = pack("H*", "1e327f87ac68eff0b0c549402952a1c230fe4b22"); my $count
        = s/\Q$prefix\E.{20}/$prefix$new/s; die "unexpected-build-id-$count" unless
        $count == 1;' app/src/main/jniLibs/arm64-v8a/libi2pd.so
      - gradle --no-daemon --console=plain -Pfoxhole.updateChannel=github -Pfoxhole.nativeOffline=true
        :app:assembleRelease
      - popd
      - mv /home/runner/work/foxhole-guard/foxhole-guard com.foxhole.guard
    ndk: 29.0.14206865
    gradleprops:
      - foxhole.updateChannel=github
      - foxhole.nativeOffline=true

AllowedAPKSigningKeys: e59de2486084c38f3c77e9df0eb5eff9a4559f3c68024f1208e0e9c04b0df665

MaintainerNotes: |-
  FoxHole Core is a separate pinned source workspace. For every new app release,
  update the FoxHoleCore srclib revision to match config/foxcore-revision.txt.
  The F-Droid build is arm64-v8a only, matching the public upstream release.
  The signed 0.0.2 APK was promoted unchanged from dev candidate 96e963f;
  release commit 798e58b has the identical Git tree d8461ad. Building the
  candidate commit preserves AGP's embedded VCS revision for verification.
  Rust and i2pd embed absolute paths, so the recipe reproduces the upstream
  runner's /home/runner layout and uses the pinned NDK 29. Network inputs for
  FoxHole Core, i2pd, lyrebird, and conjure are fetched before the Gradle phase;
  the actual build is offline and aborts if any pinned input is missing.
  OpenSSL embeds its configure time, so SOURCE_DATE_EPOCH is pinned to the
  signed candidate's exact UTC build instant.
  The linker-generated i2pd build-id is normalized to the verified candidate's
  value; every other byte still has to match for F-Droid verification to pass.

