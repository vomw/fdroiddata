AutoName: laughing_dollop
Description: |-
  Laughing Dollop is a usefull application for share native resources like the microphone
  through <b>wifi</b>.

  You will need install the Laughing Dollop on both device,
    * where you want share
    * where you want receive

    see the <a href="https://github.com/NoachDev/laughing-dollop/releases">releases page </a>

  On server page you can streming your native resources to multiply devices

  On client page you can, with an <b>ip</b> and <b>port</b>, connect to a single server.

  Considerations :

  This app have limitations:
    * platforms availables:
      * linux, client only
      * android, server only

  And, both librarys used on developement Srt and native/* are in a unstable version, so is expected to have errors like a lantecy of 4s .

  New versions are incoming, to fix bugs and enchance the user experience.

RepoType: git
Repo: https://github.com/NoachDev/laughing-dollop.git

Builds:
  - versionName: 1.0.0
    versionCode: 1
    commit: 1bc5b742c3007eb358d456f1694ef96096d5e020
    output: build/app/outputs/apk/fdroid/release/fdroid-release.apk
    srclibs:
      - flutter@stable
    rm:
      - ios
      - linux
      - macos
      - web
      - windows
    build:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - export PATH=$$flutter$$/bin:$PATH
      - flutter config --no-analytics
      - flutter build apk --release --flavor fdroid --split-per-abi --target-platform="android-arm64"

