AutoName: TravelMate
Description: |-
  TravelMate is a multimodal public transit route planner for Hyderabad, India. It plans journeys across all three Hyderabad Metro lines, MMTS suburban rail, and over 1,000 TSRTC bus routes entirely on-device with no backend server required.

  Features:

  * Multimodal routing: Metro (Red, Blue, Green lines), MMTS suburban rail, TSRTC city buses, and auto-rickshaw last-mile segments in a single journey.

  * Real GTFS data: Over 1,099 RTC bus routes from official Hyderabad feeds.

  * Six commuter strategies: Fastest Arrival, Least Waiting, Metro Preferred, MMTS Preferred, Bus Preferred, and Local Commuter.

  * Live conditions: Traffic, weather, and AQI data alongside route options.

  * Safety analysis: Risk zone alerts displayed on the route map and route cards.

  * Community RidePool: Browse and offer shared rides with a points and wallet system.

  * Bilingual: English and Telugu. Over 180 station names translated.

  * Offline-capable: All routing computation runs entirely on-device. No account or login required. No personal data collected or transmitted.

  * Accessibility: ARIA landmarks, screen reader labels, full keyboard navigation.

  This is a public beta release.

