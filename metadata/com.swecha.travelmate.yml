    subdir: frontend/android
    sudo:
      - apt-get update
      - apt-get install -y nodejs npm
    output: app/build/outputs/apk/release/app-release-unsigned.apk
    prebuild:
      - cd ../../
      - npm install
      - npm run build
      - npx cap sync android
    build:
      - cd frontend/android
      - gradle assembleRelease
    scanignore:
      - node_modules
    scandelete:
      - node_modules

MaintainerNotes: Capacitor hybrid app (React/Vite wrapped in Android).
  All routing runs on-device using bundled GTFS data.

