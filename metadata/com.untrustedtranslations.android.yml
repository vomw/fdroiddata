AutoName: Untrusted Translations
Summary: Translate and re-letter manga and comics on-device
Description: |-
    Translate manga, manhwa, manhua, and comics entirely on your phone.
    Import a page, archive, PDF, or a folder; a comic dialogue detector finds
    speech-bubble text while skipping sound effects; local OCR reads it,
    a local model translates it, and the app letters the translation back
    onto the artwork. Every block stays editable: fix the recognized text,
    fix the translation, then move, resize, or rotate the replacement.

    This build uses only free and open-source components. OCR is handled by
    Manga-OCR, RapidOCR/PP-OCRv5, or a local Qwen2-VL vision model;
    translation by local Qwen3 models via llama.cpp. Optional model packs
    are downloaded on demand over HTTPS and verified against pinned SHA-256
    hashes. Online providers (Gemini, OpenAI, Claude) are optional and only
    work with a key you supply.

    You are responsible for everything you translate

