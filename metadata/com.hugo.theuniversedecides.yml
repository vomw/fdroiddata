AntiFeatures:
  NonFreeNet:
    en-US: Random.org is used when available; local randomness remains available as
      a fallback.
Categories:
  - Dice
License: MIT
AuthorName: Vitor Hugo
AuthorWebSite: https://hugodotnet.dev
SourceCode: https://github.com/vitorhugo-dotnet/the_universe_decides
IssueTracker: https://github.com/vitorhugo-dotnet/the_universe_decides/issues

AutoName: The Universe Decides

RepoType: git
Repo: https://github.com/vitorhugo-dotnet/the_universe_decides.git

Builds:
  - versionName: 2.5.0
    versionCode: 100126
    commit: 92a240e412d5c2be58cfc2c15ea129cd0316e1b5
    output: build/app/outputs/flutter-apk/app-fdroid-release.apk
    srclibs:
      - flutter@stable
    rm:
      - android/app/src/play
      - ios
    prebuild:
      - sed -i '/playImplementation/d' android/app/build.gradle.kts
      - flutterVersion=$(awk -F'"' '/FLUTTER_VERSION:/ { print $2; exit }' .github/workflows/build-signed-apk.yml)
      - '[[ $flutterVersion ]]'
      - git -C $$flutter$$ checkout -f "$flutterVersion"
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get --enforce-lockfile
    scandelete:
      - .pub-cache
    build:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter build apk --release --flavor fdroid --build-number
        $$VERCODE$$

AutoUpdateMode: Version
UpdateCheckMode: Tags ^v[0-9]+\.[0-9]+\.[0-9]+\+[0-9]+$
UpdateCheckData: '|\+(\d+)$||^v([^+]+)\+\d+$'
CurrentVersion: 2.5.0
CurrentVersionCode: 100126
