License: MIT
AuthorName: rw-account
SourceCode: https://github.com/rw-account/baly_groceries_tracker
IssueTracker: https://github.com/rw-account/baly_groceries_tracker/issues
Changelog: https://github.com/rw-account/baly_groceries_tracker/releases

AutoName: Baly Groceries Tracker

RepoType: git
Repo: https://github.com/rw-account/baly_groceries_tracker.git

Builds:
  - versionName: 1.1.2
    versionCode: 2031
    commit: 3b85fee06b90ad9a22cb7be61e36e723bbb2b736
    target: android-37
    output: build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
    srclibs:
      - flutter@stable
    prebuild:
      - test -d /opt/android-sdk/platforms/android-37.0 && ln -s /opt/android-sdk/platforms/android-37.0 /opt/android-sdk/platforms/android-37 || true
      - flutterVersion=$(cat .fvmrc)
      - '[[ $flutterVersion ]]'
      - git -C $$flutter$$ checkout -f $flutterVersion
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get --enforce-lockfile
    scandelete:
      - .pub-cache
    build:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter build apk --release --split-per-abi --target-platform=android-arm

