License: GPL-3.0-only
WebSite: https://solve-sudoku.netlify.app
SourceCode: https://github.com/AshutoshSajan/sudoku
IssueTracker: https://github.com/AshutoshSajan/sudoku/issues
Changelog: https://github.com/AshutoshSajan/sudoku/blob/main/CHANGELOG.md
AutoName: Sudoku
RepoType: git
Repo: https://github.com/AshutoshSajan/sudoku.git
Builds:
  - versionName: 1.1.0
    versionCode: 2
    commit: v1.1.0
    output: build/app/outputs/flutter-apk/app-release.apk
    srclibs:
      - flutter@3.47.2
    rm:
      - ios
      - macos
      - windows
      - linux
      - web
      - extension
    build:
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter packages pub get
      - $$flutter$$/bin/flutter build apk
AutoUpdateMode: Version v%v
UpdateCheckMode: Tags
UpdateCheckData: pubspec.yaml|version:\s.++(\d+)|.|version:\s(.+)+
CurrentVersion: 1.1.0
CurrentVersionCode: 2
