Categories:
  - Multimedia
License: MPL-2.0
AuthorName: TheZupZup
SourceCode: https://github.com/TheZupZup/Linthra
IssueTracker: https://github.com/TheZupZup/Linthra/issues
Changelog: https://github.com/TheZupZup/Linthra/releases

Name: Linthra

RepoType: git
Repo: https://github.com/TheZupZup/Linthra.git

Builds:
  - versionName: 0.1.0-alpha.31
    versionCode: 100031
    commit: v0.1.0-alpha.31
    output: build/app/outputs/flutter-apk/app-release.apk
    srclibs:
      - flutter@stable
    prebuild:
      - flutterVersion=$(cat .flutter-version)
      - '[[ $flutterVersion ]]'
      - git -C $$flutter$$ checkout -f $flutterVersion
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get
    scandelete:
      - .pub-cache
    build:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter build apk --release --build-name=0.1.0-alpha.31 --build-number=100031
        --dart-define=LINTHRA_VERSION_NAME=0.1.0-alpha.31

AutoUpdateMode: Version
UpdateCheckMode: Tags
UpdateCheckData: pubspec.yaml|version:\s*[^+]+\+(\d+)|.|version:\s*([^\+]+)\+
CurrentVersion: 0.1.0-alpha.31
CurrentVersionCode: 100031
