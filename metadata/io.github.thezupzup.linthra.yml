Categories:
  - Multimedia
License: MPL-2.0
AuthorName: TheZupZup
SourceCode: https://github.com/TheZupZup/Linthra
IssueTracker: https://github.com/TheZupZup/Linthra/issues
Changelog: https://github.com/TheZupZup/Linthra/releases

Name: Linthra
AutoName: Linthra

RepoType: git
Repo: https://github.com/TheZupZup/Linthra.git

Builds:
  - versionName: 0.1.0-alpha.38
    versionCode: 100038
    commit: v0.1.0-alpha.38
    output: build/app/outputs/flutter-apk/app-release.apk
    srclibs:
      - flutter@stable
    prebuild:
      - flutterVersion=$(cat .flutter-version)
      - '[[ $flutterVersion ]]'
      - git -C $$flutter$$ checkout -f $flutterVersion
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get
    scandelete:
      - .pub-cache
    build:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter build apk --release

AutoUpdateMode: Version
UpdateCheckMode: Tags
UpdateCheckData: 'pubspec.yaml|version:\s*[^+]+\+(\d+)|.|version:\s*([^\+]+)\+'
CurrentVersion: 0.1.0-alpha.38
CurrentVersionCode: 100038
