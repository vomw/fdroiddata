AutoName: Acho Chat
Summary: Lightweight native client for the Acho self-hosted social platform
Description: |-
  Acho Chat is a native client application for Acho, a self-hosted
  social network and community platform.
  The application is designed to provide a native experience while
  maintaining a minimal footprint. The APK size is under 100 KB.
  Native features:
  * Foreground Service for background message notification delivery
  * AppWidget integration displaying real-time community activity on the home screen
  * Native share sheet support for text, images, video, audio, and PDF files
  * Hardware-accelerated rendering via WebView
  * RECEIVE_BOOT_COMPLETED support to restore services after device restart
  Compatibility:
  * API 25 through API 36
  * ARM 32-bit and ARM 64-bit architectures
