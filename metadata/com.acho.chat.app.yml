AutoName: Acho Chat

Summary: Cliente Android nativo y ligero para la plataforma social Acho.

Description: |-
  Acho Chat es una aplicación Android nativa que proporciona acceso a Acho,
  una red social y plataforma comunitaria auto-hospedada.

  La aplicación incluye las siguientes funciones nativas:

  * Servicio de notificaciones en segundo plano mediante Android Foreground Service API
  * Widget de pantalla de inicio que muestra la actividad de la comunidad
  * Compatible con Android 7.1 hasta Android 16
  * Compatible con arquitecturas de 32 y 64 bits

