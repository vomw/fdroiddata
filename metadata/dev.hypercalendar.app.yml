Builds:
  - versionName: 2.1.1
    versionCode: 7
    commit: 28671a13e0bab7bb1174995bee8bdbcc1811a4a9
    subdir: android/app
    sudo:
      - echo "deb https://deb.debian.org/debian forky main" > /etc/apt/sources.list.d/forky.list
      - 'printf "Package: *\nPin: release n=forky\nPin-Priority: 100\n" > /etc/apt/preferences.d/forky'
      - apt-get update
      - apt-get install -y -t forky nodejs npm libc6-dev
      - apt-get install -y curl unzip build-essential emscripten binaryen wabt
    gradle:
      - yes
    prebuild:
      - cd ../..
      - npm ci
    scanignore:
      - node_modules/@capacitor/cli/assets/capacitor-cordova-android-plugins.tar.gz
      - node_modules/@esbuild/linux-x64/bin/esbuild
      - node_modules/workbox-build/node_modules/source-map/lib/mappings.wasm
    scandelete:
      - node_modules
    build:
      - cd ../..
      - HYPERCAL_SQLITE_WORKDIR="$HOME/sqlite-wasm-build" npm run build:sqlite-wasm
      - HYPERCAL_SQLITE_FROM_SOURCE=1 npm run build:android

