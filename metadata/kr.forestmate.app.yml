Description: |-
  ForestMate is a hiking safety companion for Korean mountain routes. It
  combines trail/course information, risk briefings, route guidance, SOS
  context, and AI-style safety advice.

  The ForestMate web client and FastAPI server source are available in the
  upstream repository and can be self-hosted.

  The native Android interface and hiking content are currently Korean only.

