SourceCode: https://github.com/NeaBouli/pnyx
IssueTracker: https://github.com/NeaBouli/pnyx/issues

AutoName: ekklesia

RepoType: git
Repo: https://github.com/NeaBouli/pnyx

Builds:
  - versionName: 1.0.22
    versionCode: 51
    commit: 49b9aea7c506728d6e6f8ca15392d45725b4a181
    subdir: apps/mobile/android/app
    sudo:
      - apt-get update
      - apt-get install -y npm
    gradle:
      - yes
    prebuild:
      - cd ../..
      - npm ci
      - sed -i -e '1a "expo":{"autolinking":{"android":{"buildFromSource":[".*"],
        "exclude":["expo-notifications"]}}},' package.json
      - rm -rf modules/semaphore-react-native/android/src/main/jniLibs
      - rm -rf node_modules/semaphore-react-native/android/src/main/jniLibs
      - sed -i -e "/^[[:space:]]*\\[$/{N;/expo-notifications/{N;N;N;N;d}}" app.json
      - sed -i -e 's/"expo-secure-store",/"expo-secure-store"/' app.json
      - sed -i -e '/buildFlavor/s/direct/fdroid/' -e '/distributionChannel/s/direct/fdroid/'
        -e '/zkSemaphoreEnabled/s/true/false/' app.json
      - sed -i '/jvmToolchain\|JavaVersion/s/17/21/' node_modules/@react-native/gradle-plugin/*/build.gradle.kts
        node_modules/@react-native/gradle-plugin/react-native-gradle-plugin/src/main/kotlin/com/facebook/react/utils/JdkConfiguratorUtils.kt
      - npx expo prebuild --clean --platform android
      - sed -i -e '/newArchEnabled/s/true/false/' android/gradle.properties
      - sed -i -e '/signingConfig /d' android/app/build.gradle
    scanignore:
      - apps/mobile/node_modules/react-native/sdks/hermesc/linux64-bin/hermesc
      - apps/mobile/node_modules/expo-modules-core/android/ExpoModulesCorePlugin.gradle
      - apps/mobile/node_modules/expo-modules-autolinking/scripts/android/autolinking_implementation.gradle
      - apps/mobile/node_modules/@react-native-picker/picker/android/build.gradle
      - apps/mobile/node_modules/react-native-safe-area-context/android/build.gradle
      - apps/mobile/node_modules/react-native-screens/android/build.gradle
      - apps/mobile/node_modules/react-native/ReactAndroid/publish.gradle
    scandelete:
      - apps/mobile/node_modules

AutoUpdateMode: Version
UpdateCheckMode: Tags
