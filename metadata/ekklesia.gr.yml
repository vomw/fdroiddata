AntiFeatures:
  NonFreeNet:
    en-US: HLR phone verification uses a commercial API.
Categories:
  - Connectivity
License: MIT
WebSite: https://ekklesia.gr
SourceCode: https://github.com/NeaBouli/pnyx
IssueTracker: https://github.com/NeaBouli/pnyx/issues

AutoName: ekklesia

RepoType: git
Repo: https://github.com/NeaBouli/pnyx

Builds:
  - versionName: 1.0.21
    versionCode: 50
    commit: e38f5e009b84a455db535c790980515fa9d08a78
    subdir: apps/mobile/android/app
    sudo:
      - apt-get update
      - apt-get install -y npm
    gradle:
      - yes
    prebuild:
      - cd ../..
      - npm ci
      - sed -i -e '1a 
        "expo":{"autolinking":{"android":{"buildFromSource":[".*"],"exclude":["expo-notifications"]}}},'
        package.json
      - python3 -c 'import json,pathlib; p=pathlib.Path("app.json"); d=json.loads(p.read_text());
        e=d["expo"]; e["plugins"]=[x for x in e.get("plugins", []) if not (x=="expo-notifications"
        or (isinstance(x, list) and x and x[0]=="expo-notifications"))]; e.setdefault("extra",
        {})["buildFlavor"]="fdroid"; e["extra"]["distributionChannel"]="fdroid"; p.write_text(json.dumps(d,
        ensure_ascii=False, indent=2)+"\n")'
      - sed -i '/jvmToolchain\|JavaVersion/s/17/21/' node_modules/@react-native/gradle-plugin/*/build.gradle.kts
        node_modules/@react-native/gradle-plugin/react-native-gradle-plugin/src/main/kotlin/com/facebook/react/utils/JdkConfiguratorUtils.kt
      - python3 -c 'import json,pathlib; p=pathlib.Path("app.json"); d=json.loads(p.read_text());
        d["expo"].setdefault("android", {})["jsEngine"]="jsc"; p.write_text(json.dumps(d,
        ensure_ascii=False, indent=2)+"\n")'
      - npx expo prebuild --clean --platform android
      - sed -i 's/^newArchEnabled=true/newArchEnabled=false/' android/gradle.properties
      - sed -i 's/^hermesEnabled=true/hermesEnabled=false/' android/gradle.properties
    scanignore:
      - apps/mobile/node_modules/expo-modules-core/android/ExpoModulesCorePlugin.gradle
      - apps/mobile/node_modules/expo-modules-autolinking/scripts/android/autolinking_implementation.gradle
      - apps/mobile/node_modules/@react-native-picker/picker/android/build.gradle
      - apps/mobile/node_modules/react-native-safe-area-context/android/build.gradle
      - apps/mobile/node_modules/react-native-screens/android/build.gradle
      - apps/mobile/node_modules/react-native/ReactAndroid/publish.gradle
    scandelete:
      - apps/mobile/node_modules

AutoUpdateMode: Version
UpdateCheckMode: Tags
CurrentVersion: 1.0.21
CurrentVersionCode: 50
