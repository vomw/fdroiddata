License: MIT
WebSite: https://ekklesia.gr
SourceCode: https://github.com/NeaBouli/pnyx
IssueTracker: https://github.com/NeaBouli/pnyx/issues

AutoName: ekklesia

RepoType: git
Repo: https://github.com/NeaBouli/pnyx

Builds:
  - versionName: 1.0.21
    versionCode: 50
    commit: e38f5e009b84a455db535c790980515fa9d08a78
    subdir: apps/mobile/android/app
    sudo:
      - apt-get update
      - apt-get install -y npm
    gradle:
      - yes
    prebuild:
      - cd ../..
      - npm ci
      - python3 -c 'import json,pathlib; p=pathlib.Path("package.json"); d=json.loads(p.read_text());
        d["expo"]={"autolinking":{"android":{"buildFromSource":[".*"],"exclude":["expo-notifications"]}}};
        p.write_text(json.dumps(d, ensure_ascii=False, indent=2)+"\n")'
      - rm -rf modules/semaphore-react-native/android/src/main/jniLibs node_modules/semaphore-react-native/android/src/main/jniLibs
      - python3 -c 'import json,pathlib; p=pathlib.Path("app.json"); d=json.loads(p.read_text());
        e=d["expo"]; e["plugins"]=[x for x in e.get("plugins", []) if not (x=="expo-notifications"
        or (isinstance(x, list) and x and x[0]=="expo-notifications"))]; e.setdefault("extra",
        {})["buildFlavor"]="fdroid"; e["extra"]["distributionChannel"]="fdroid"; e["extra"]["zkSemaphoreEnabled"]=False;
        p.write_text(json.dumps(d, ensure_ascii=False, indent=2)+"\n")'
      - python3 -c 'import pathlib; 
        paths=list(pathlib.Path("node_modules/@react-native/gradle-plugin").glob("*/build.gradle.kts"))+[pathlib.Path("node_modules/@react-native/gradle-plugin/react-native-gradle-plugin/src/main/kotlin/com/facebook/react/utils/JdkConfiguratorUtils.kt")];
        [p.write_text("\n".join((line.replace("17","21") if ("jvmToolchain" in line
        or "JavaVersion" in line) else line) for line in p.read_text().splitlines())+"\n")
        for p in paths if p.exists()]'
      - python3 -c 'import json,pathlib; p=pathlib.Path("app.json"); d=json.loads(p.read_text());
        d["expo"].setdefault("android", {})["jsEngine"]="jsc"; p.write_text(json.dumps(d,
        ensure_ascii=False, indent=2)+"\n")'
      - npx expo prebuild --clean --platform android
      - python3 -c 'import pathlib; p=pathlib.Path("android/gradle.properties"); 
        p.write_text("\n".join(line.replace("newArchEnabled=true","newArchEnabled=false").replace("hermesEnabled=true","hermesEnabled=false")
        for line in p.read_text().splitlines())+"\n")'
    scanignore:
      - apps/mobile/node_modules/expo-modules-core/android/ExpoModulesCorePlugin.gradle
      - apps/mobile/node_modules/expo-modules-autolinking/scripts/android/autolinking_implementation.gradle
      - apps/mobile/node_modules/@react-native-picker/picker/android/build.gradle
      - apps/mobile/node_modules/react-native-safe-area-context/android/build.gradle
      - apps/mobile/node_modules/react-native-screens/android/build.gradle
      - apps/mobile/node_modules/react-native/ReactAndroid/publish.gradle
    scandelete:
      - apps/mobile/node_modules

AutoUpdateMode: Version
UpdateCheckMode: Tags
CurrentVersion: 1.0.21
CurrentVersionCode: 50
