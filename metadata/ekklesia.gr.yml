AntiFeatures:
  NonFreeNet:
    en-US: HLR phone verification uses a commercial API.
Categories:
  - Connectivity
License: MIT
WebSite: https://ekklesia.gr
SourceCode: https://github.com/NeaBouli/pnyx
IssueTracker: https://github.com/NeaBouli/pnyx/issues

AutoName: ekklesia

RepoType: git
Repo: https://github.com/NeaBouli/pnyx

Builds:
  - versionName: 1.0.21
    versionCode: 50
    commit: e38f5e009b84a455db535c790980515fa9d08a78
    subdir: apps/mobile/android/app
    sudo:
      - apt-get update
      - apt-get install -y npm
    gradle:
      - yes
    prebuild:
      - cd ../..
      - npm ci
      - sed -i '/"private":\ true/i\\  "expo":{"autolinking":{"android":{"buildFromSource":[".*"],
        "exclude":["expo-notifications"]}}},' package.json
      - rm -rf modules/semaphore-react-native/android/src/main/jniLibs
      - rm -rf node_modules/semaphore-react-native/android/src/main/jniLibs
      - sed -i "/^[[:space:]]*\\[$/{N;/expo-notifications/{N;N;N;N;d}}" app.json
      - sed -i "s/\"expo-secure-store\",/\"expo-secure-store\"/" app.json
      - 'sed -i -e "s/\"buildFlavor\": \"direct\"/\"buildFlavor\": \"fdroid\"/" -e
        "s/\"distributionChannel\": \"direct\"/\"distributionChannel\": \"fdroid\"/"
        -e "s/\"zkSemaphoreEnabled\": true/\"zkSemaphoreEnabled\": false/" app.json'
      - 'sed -i "s/\"jsEngine\": \"hermes\"/\"jsEngine\": \"jsc\"/g" app.json'
      - cd node_modules/@react-native/gradle-plugin
      - printf "/jvmToolchain\\|JavaVersion/s/17/21/g\n" > j
      - find . -name build.gradle.kts -exec sed -i -f j {} +
      - find . -name JdkConfiguratorUtils.kt -exec sed -i -f j {} +
      - rm j
      - cd ../../..
      - npx expo prebuild --clean --platform android
      - cd android
      - sed -i s/newArchEnabled=true/newArchEnabled=false/ gradle.properties
      - sed -i s/hermesEnabled=true/hermesEnabled=false/ gradle.properties
      - cd ..
    scanignore:
      - apps/mobile/node_modules/expo-modules-core/android/ExpoModulesCorePlugin.gradle
      - apps/mobile/node_modules/expo-modules-autolinking/scripts/android/autolinking_implementation.gradle
      - apps/mobile/node_modules/@react-native-picker/picker/android/build.gradle
      - apps/mobile/node_modules/react-native-safe-area-context/android/build.gradle
      - apps/mobile/node_modules/react-native-screens/android/build.gradle
      - apps/mobile/node_modules/react-native/ReactAndroid/publish.gradle
    scandelete:
      - apps/mobile/node_modules

AutoUpdateMode: Version
UpdateCheckMode: Tags
CurrentVersion: 1.0.21
CurrentVersionCode: 50
