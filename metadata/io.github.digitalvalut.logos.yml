AutoName: DigitalValut Logos
Description: |-
    Peer-to-peer encrypted chat, voice and video calls, and file sharing —
    directly between two browsers, with no account, no phone number, and no
    server that ever sees a message. Two devices negotiate a private WebRTC
    connection; a small relay only ever helps them find each other and, when
    an unusually strict network requires it, forwards already-encrypted
    traffic it has no key to read.

    A permanent address is the hash of an on-device key pair, so it verifies
    itself: whoever dials it checks the key they receive actually produces
    that address before trusting it. The first connection to someone shows
    both sides the same three-word security code, generated from the real
    cryptographic handshake — read aloud once, it confirms nobody is in the
    middle.

    Conversation history lives only in the browser's local storage; there is
    no database anywhere holding it. The whole application is also available
    as a single self-contained HTML file for offline use or archival.

    This package is a Trusted Web Activity: an installable wrapper around
    the web application at the WebSite link above. It adds nothing beyond
    an icon and full-screen display — no push notifications, no additional
    permissions, no service that isn't already part of the web app.

