Builds:
  - versionName: 1.1.1
    versionCode: 4
    commit: ae38a8b3d5a09eacc6c5136a5bbbf6f3be3ad285
    sudo:
      - echo "deb https://deb.debian.org/debian trixie main" > /etc/apt/sources.list.d/trixie.list
      - apt-get update
      - apt-get install -y ca-certificates curl gnupg
      - apt-get install -y -t trixie openjdk-21-jdk-headless
      - update-alternatives --auto java
      - curl -fsSL https://packages.adoptium.net/artifactory/api/gpg/key/public |
        gpg --dearmor -o /etc/apt/keyrings/adoptium.gpg
      - echo "deb [signed-by=/etc/apt/keyrings/adoptium.gpg] https://packages.adoptium.net/artifactory/deb
        trixie main" > /etc/apt/sources.list.d/adoptium.list
      - apt-get update
      - apt-get install -y temurin-17-jdk
      - install -d -m 0755 /etc/apt/keyrings
      - curl -fsSL https://deb.nodesource.com/gpgkey/nodesource-repo.gpg.key | gpg
        --dearmor -o /etc/apt/keyrings/nodesource.gpg
      - echo "deb [signed-by=/etc/apt/keyrings/nodesource.gpg] https://deb.nodesource.com/node_22.x
        nodistro main" > /etc/apt/sources.list.d/nodesource.list
      - apt-get update
      - apt-get install -y --allow-downgrades nodejs
    output: android/app/build/outputs/apk/release/app-release.apk
    build:
      - npm ci
      - APEX_SKIP_SIGNING=1 npx expo prebuild -p android --clean
      - sed -i "s/\['expo-notifications'\]/['expo-notifications', 'expo-application']/"
        android/settings.gradle
      - echo "android { dependenciesInfo { includeInApk = false; includeInBundle =
        false } }" >> android/app/build.gradle
      - cd android && APEX_SKIP_SIGNING=1 NODE_ENV=production sh gradlew assembleRelease
        -PapexFdroid=true
    ndk: 27.1.12297006

AutoUpdateMode: Version
UpdateCheckMode: Tags ^v\d+\.\d+\.\d+$
UpdateCheckData: app.json|"versionCode":\s*(\d+)|app.json|"version":\s*"([^"]+)"
CurrentVersion: 1.1.1
CurrentVersionCode: 4
