Builds:
  - versionName: 1.0.1
    versionCode: 2
    commit: 7eaa4f4dcfd6037684c3beb4128eb722326a7cb3
    submodules: true
    output: build/app/outputs/flutter-apk/app-release.apk
    prebuild:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - .flutter/bin/flutter config --no-analytics
      - .flutter/bin/flutter pub get
      - sed -i 's/compileSdk flutter.compileSdkVersion/compileSdk 36/' .pub-cache/hosted/pub.dev/*/android/build.gradle
      - sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 28/' .pub-cache/hosted/pub.dev/*/android/build.gradle
    scanignore:
      - .flutter/bin/cache
    scandelete:
      - .flutter
      - .pub-cache
    build:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - .flutter/bin/flutter build apk --release

AutoUpdateMode: None
UpdateCheckMode: None
