  - Religion
License: MIT
AuthorName: Mehmet Ali B.
AuthorWebSite: https://github.com/AllLiveSupport
SourceCode: https://github.com/AllLiveSupport/ezan-vakti
IssueTracker: https://github.com/AllLiveSupport/ezan-vakti/issues

AntiFeatures:
  NonFreeDep:
    en-US: Uses Google Play Services via geolocator for location access
    tr-TR: Konum erişimi için geolocator üzerinden Google Play Services kullanır

AutoName: Ezan Vakti

RepoType: git
Repo: https://github.com/AllLiveSupport/ezan-vakti.git

Builds:
  - versionName: 1.0.1
    versionCode: 2
    commit: 322e48cf727b03f8347390408927690963c8fadf
    output: build/app/outputs/flutter-apk/app-release.apk
    srclibs:
      - flutter@stable
    rm:
      - ios
      - linux
      - macos
      - web
      - windows
    prebuild:
      - flutterVersion=$(sed -n -E "s/.*flutter-version:\ '(.*)'/\1/p" .github/workflows/build.yml)
      - '[[ $flutterVersion ]]'
      - git -C $$flutter$$ checkout -f $flutterVersion
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get
    scandelete:
      - .pub-cache
    build:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter build apk --release

AutoUpdateMode: None
UpdateCheckMode: None
CurrentVersion: 1.0.1
CurrentVersionCode: 2