Builds:
  - versionName: 1.0.1
    versionCode: 2
    commit: 7eaa4f4dcfd6037684c3beb4128eb722326a7cb3
    output: build/app/outputs/flutter-apk/app-release.apk
    srclibs:
      - flutter@stable
    prebuild:
      - flutterVersion=$(sed -n -E "s/.*flutter-version:.?'(.*)'/\1/p" .github/workflows/build.yml)
      - '[[ $flutterVersion ]]'
      - git -C $$flutter$$ checkout -f $flutterVersion
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get
      - sed -i -E 's/(com\.android\.tools\.build:gradle:)[0-9.]+/\18.11.1/g' .pub-cache/hosted/pub.dev/*/android/build.gradle
      - sed -i -E 's/(com\.android\.tools\.build:gradle:)[0-9.]+/\18.11.1/g' .pub-cache/hosted/pub.dev/*/android/build.gradle.kts
      - sed -i 's/flutter\.compileSdkVersion/36/g' .pub-cache/hosted/pub.dev/*/android/build.gradle
      - sed -i 's/flutter\.compileSdkVersion/36/g' .pub-cache/hosted/pub.dev/*/android/build.gradle.kts
      - sed -i 's/flutter\.minSdkVersion/24/g' .pub-cache/hosted/pub.dev/*/android/build.gradle
      - sed -i 's/flutter\.minSdkVersion/24/g' .pub-cache/hosted/pub.dev/*/android/build.gradle.kts
      - sed -i 's/flutter\.targetSdkVersion/36/g' .pub-cache/hosted/pub.dev/*/android/build.gradle
      - sed -i 's/flutter\.targetSdkVersion/36/g' .pub-cache/hosted/pub.dev/*/android/build.gradle.kts
    scandelete:
      - .pub-cache
    build:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter build apk --release
    ndk: r28c

AutoUpdateMode: None
UpdateCheckMode: None
