# F-Droid Build Recipe — Vorlage für fdroid/fdroiddata
#
# So einreichen:
#   1. Fork von https://gitlab.com/fdroid/fdroiddata
#   2. Diese Datei als metadata/app.nischenlicht.de.yml einfügen
#   3. Merge Request stellen
#
# Voraussetzung: GitLab-Repo muss PUBLIC sein.

Categories:
  - Religion
License: MIT
AuthorName: Robert Bartha
SourceCode: https://gitlab.com/papewas/nischenlicht-app
IssueTracker: https://gitlab.com/papewas/nischenlicht-app/-/issues

AutoName: NischenLicht
Description: |-
  Stille Begleitung durch die Weisheit der Bahá'í-Schriften. Über 2.100 Texte
  aus elf Sammlungen auf Deutsch und Englisch, tägliche Morgen- und
  Abendlesung nach Bahá'í-Kalender. Fokus-Modus, 13 Schriftarten, Hell/Dunkel.
  Kein Tracking, keine Werbung. Alle Texte sind offline verfügbar; nur die
  optionale Vertonung wird beim Abspielen von nischenlicht.de geladen.

  English: NicheLight offers 2,100+ texts from eleven Bahá'í collections in
  German and English (Hidden Words, Prayers, Gleanings, Sacred Writings, Some
  Answered Questions, and more). Daily readings, focus mode,
  13 typefaces. No tracking, no ads. All texts work offline; only the optional
  narration is streamed from nischenlicht.de when you press play.

RepoType: git
Repo: https://gitlab.com/papewas/nischenlicht-app.git

Builds:
  - versionName: '4.0'
    versionCode: 40001
    commit: v4.0.1
    subdir: android
    sudo:
      - apt-get update
      - apt-get install -y nodejs
    init:
      - cd ..
      - npm ci
      - npm run build
      - npx cap sync android
    gradle:
      - yes
    scandelete:
      - node_modules/

