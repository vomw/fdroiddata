AutoName: Hero Counter
Name: Hero Counter
Summary: A private, offline habit and activity counter
Description: |-
  Hero Counter is a simple, private, and fully offline habit and activity tracker.
  Count anything that matters — push-ups, medication doses, glasses of water,
  daily prayers, or any repeating task — and track your progress over time.

  <b>Features:</b>

  * Tap-to-count interface with add and subtract modes
  * Track unlimited named activities simultaneously
  * Set daily, weekly, monthly, and yearly goals per count
  * Goal celebration animation when you hit your daily target
  * Statistics screen with bar charts broken down by day, week, month, and year
  * Projected totals showing where you are headed based on current pace
  * Midnight auto-reset — counter display resets each day automatically
  * Edit history — add or correct entries for any past date
  * Drag to reorder your counts in Settings
  * Reminders — configurable push notifications with time and days of week
  * CSV export and import — back up and restore all data including goals and reminders
  * Share Hero Counter with others via a link

  <b>Privacy:</b>

  * No internet connection required
  * No ads, no trackers, no analytics
  * No third-party SDKs
  * All data stored locally on device
  * Works on de-Googled devices (CalyxOS, GrapheneOS, DivestOS, etc.)

