AutoName: TAPO Launcher

Description: |
  A smart, lightweight, high-performance launcher designed with clean architecture,
  visual elegance, and privacy at its core. It includes smart offline
  auto-categorization, premium developer themes (Dracula, Tokyo Night, Vercel,
  Nord, Catppuccin, etc.), work profile support, hidden apps system, and highly
  optimized startup metrics. Unlike other launchers, TAPO functions entirely
  offline for ultimate privacy.

