Builds:
  - versionName: 1.3.0
    versionCode: 2018
    commit: ff0190067891611a27b802ba31d9f5f5ad1f59a7
    subdir: ErmisClient/Mobile/ermis_client
    sudo:
      - echo "deb https://deb.debian.org/debian trixie main" > /etc/apt/sources.list.d/trixie.list
      - apt-get update
      - apt-get install -y -t trixie openjdk-21-jdk-headless
      - update-alternatives --auto java
      - mkdir -p /home/ilias/Downloads/Ermis-master/ErmisClient/Mobile
      - chown -R vagrant /home/ilias
    output: build/app/outputs/apk/release/app-arm64-v8a-release-unsigned.apk
    binary: https://github.com/Koukobin/Ermis/releases/download/client-mobile-v%v/android-app-arm64-v8a-release.apk
    srclibs:
      - flutter@stable
    rm:
      - ErmisClient/Desktop/
      - ErmisServer
      - ErmisClient/Mobile/ermis_client/ios
      - ErmisClient/Mobile/ermis_client/linux
      - ErmisClient/Mobile/ermis_client/macos
      - ErmisClient/Mobile/ermis_client/web
      - ErmisClient/Mobile/ermis_client/windows
    prebuild:
      - flutterVersion=$(sed -n -E "s/.*flutter-version:\s'(.*)'/\1/p" ../../../.github/workflows/build.yml)
      - '[[ $flutterVersion ]]'
      - git -C $$flutter$$ checkout -f $flutterVersion
      - export repo=/home/ilias/Downloads/Ermis-master/ErmisClient/Mobile/ermis_client
      - cd ..
      - mv ermis_client $repo
      - pushd $repo
      - export PUB_CACHE=$(pwd)/.pub-cache
      - find $$flutter$$ -type f -not -path "*/.git/*" -print0 | xargs -0 sed -i $'s/\r$//'
      - find . -type f -regex ".*\.\(ttf\|zip\|so\|bin\)$" -delete
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get
      - popd
      - mv $repo ermis_client
    scandelete:
      - ErmisClient/Mobile/ermis_client/.pub-cache
    build:
      - export repo=/home/ilias/Downloads/Ermis-master/ErmisClient/Mobile/ermis_client
      - cd ..
      - mv ermis_client $repo
      - pushd $repo
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/dart run flutter_launcher_icons
      - $$flutter$$/bin/dart run intl_utils:generate
      - $$flutter$$/bin/flutter build apk --release --split-per-abi --target-platform="android-arm64"
      # Strip nondeterministic metadata from generated APKs
      - zip -X -o build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
      - zip -X -o build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
      - zip -X -o build/app/outputs/flutter-apk/app-x86_64-release.apk
      - zip -X -o build/app/outputs/flutter-apk/app-release.apk
      - popd
      - mv $repo ermis_client

