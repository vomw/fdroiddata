Categories:
  - Games
License: GPL-3.0-or-later
AuthorName: Jens Pfahl
AuthorWebSite: https://jepfa.de
WebSite: https://hylex.jepfa.de
SourceCode: https://github.com/jenspfahl/hylex
IssueTracker: https://github.com/jenspfahl/hylex/issues
Changelog: https://github.com/jenspfahl/hylex/releases

AutoName: HyleX

RepoType: git
Repo: https://github.com/jenspfahl/hylex

Builds:
  - versionName: '1.0.0'
    versionCode: 100000
    commit: v1.0.0
    submodules: false
    sudo:
      - echo "deb https://deb.debian.org/debian trixie main" > /etc/apt/sources.list.d/trixie.list
      - apt-get update
      - apt-get install -y -t trixie openjdk-21-jdk-headless
      - update-alternatives --auto java
    output: build/app/outputs/flutter-apk/app-release.apk
    srclibs:
      - flutter@3.35.7
    prebuild:
      - sed -i -e 's/Xmx1536M/Xmx4G/' android/gradle.properties
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter packages pub get
    scandelete:
      - .pub-cache
    build:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter packages pub run build_runner build --delete-conflicting-outputs
      - $$flutter$$/bin/flutter clean
      - $$flutter$$/bin/flutter build apk      
      

AutoUpdateMode: Version
UpdateCheckMode: Tags
UpdateCheckData: pubspec.yaml|version:\s.+\+(\d+)|.|version:\s(.+)\+
CurrentVersion: 1.0.0
CurrentVersionCode: 100000
