Categories:
  - Games
License: GPL-3.0-or-later
AuthorName: Jens Pfahl
AuthorWebSite: https://jepfa.de
WebSite: https://hylex.jepfa.de
SourceCode: https://github.com/jenspfahl/hylex
IssueTracker: https://github.com/jenspfahl/hylex/issues
Changelog: https://github.com/jenspfahl/hylex/releases

AutoName: HyleX

RepoType: git
Repo: https://github.com/jenspfahl/hylex

Builds:
  - versionName: 1.0.0
    versionCode: 100000
    commit: 6836075443c32884a05a1661f1aa1d1618499a33
    output: build/app/outputs/flutter-apk/app-release.apk
    srclibs:
      - flutter@stable
    prebuild:
      - flutterVersion=$(sed -n -E "s/\ \ flutter:\ ([0-9\.]*)/\1/p" pubspec.yaml)
      - '[[ $flutterVersion ]]'
      - git -C $$flutter$$ checkout -f $flutterVersion
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter packages pub get
    scandelete:
      - .pub-cache
    build:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter packages pub run build_runner build --delete-conflicting-outputs
      - $$flutter$$/bin/flutter clean
      - $$flutter$$/bin/flutter build apk

AutoUpdateMode: Version
UpdateCheckMode: Tags
UpdateCheckData: pubspec.yaml|version:\s.+\+(\d+)|.|version:\s(.+)\+
CurrentVersion: 1.0.0
CurrentVersionCode: 100000
