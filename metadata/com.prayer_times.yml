Builds:
  - versionName: 1.5.21
    versionCode: 44
    commit: v1.5.21
    subdir: android
    sudo:
      - apt-get update
      - apt-get install -y npm curl ca-certificates
      - curl -Lo /tmp/jdk17.tar.gz 
        'https://github.com/adoptium/temurin17-binaries/releases/download/jdk-17.0.18%2B8/OpenJDK17U-jdk_x64_linux_hotspot_17.0.18_8.tar.gz'
      - echo "0c94cbb54325c40dcf026143eb621562017db5525727f2d9131a11250f72c450 
        /tmp/jdk17.tar.gz" | sha256sum -c -
      - tar xzf /tmp/jdk17.tar.gz -C /usr/local
      - ln -sfn /usr/local/jdk-17.0.18+8 /usr/local/jdk-17
      - rm -f /tmp/jdk17.tar.gz
      - update-alternatives --install /usr/bin/java java 
        /usr/local/jdk-17/bin/java 1
      - update-alternatives --set java /usr/local/jdk-17/bin/java
      - update-alternatives --install /usr/bin/javac javac 
        /usr/local/jdk-17/bin/javac 1
      - update-alternatives --set javac /usr/local/jdk-17/bin/javac
    gradle:
      - fdroid
    output: app/build/outputs/apk/fdroid/release/*.apk
    prebuild:
      - export JAVA_HOME=/usr/local/jdk-17
      - printf '\norg.gradle.java.home=/usr/local/jdk-17\n' >> gradle.properties
      - cd ..
      - npm ci --no-audit --build-from-source
    scanignore:
      - android/build.gradle
      - node_modules
    ndk: 27.1.12297006

