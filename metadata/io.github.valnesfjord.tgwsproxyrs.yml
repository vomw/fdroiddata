Builds:
  - versionName: 2.3.0
    versionCode: 203001
    commit: 5a1da26c6bd3d5deb727bae24ce1e0ca9f296c6c
    subdir: android/app
    sudo:
      - apt-get update
      - apt-get install -y rustup build-essential
    gradle:
      - yes
    prebuild:
      - NDK_VERSION=$(sed -n -E 's/.*ndk="ndk;([0-9.]+)".*/\1/p' ../../.github/workflows/ci.yml
        | head -n1)
      - sdkmanager --install "ndk;$NDK_VERSION"
    gradleprops:
      - TG_ANDROID_ABIS=armeabi-v7a

  - versionName: 2.3.0
