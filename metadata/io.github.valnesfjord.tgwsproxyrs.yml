Builds:
  - versionName: 2.3.0
    versionCode: 203001
    commit: 08c3ff652684facf6772756d2bde34aa39299d76
    subdir: android/app
    sudo:
      - mkdir -p /home/runner
      - chown vagrant /home/runner
      - apt-get update
      - apt-get install -y rustup
    gradle:
      - yes
    prebuild:
      - NDK_VERSION=$(sed -n -E 's/.*ndk="ndk;([0-9.]+)".*/\1/p' ../../.github/workflows/ci.yml
        | head -n1)
      - sdkmanager --install "ndk;$NDK_VERSION"
    build:
      - export CARGO_HOME=/home/runner/.cargo
      - export RUST_VERSION=$(sed -n -E 's/channel = "(.*)"/\1/p' ../../rust-toolchain.toml)
      - rustup default $RUST_VERSION
      - rustup target add armv7-linux-androideabi
    gradleprops:
      - TG_ANDROID_ABIS=armeabi-v7a

