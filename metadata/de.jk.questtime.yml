Repo: https://codeberg.org/BenniJanson/QuestTime.git

Builds:
  - versionName: 1.0.3
    versionCode: 51
    commit: 0620322baa664fb478ef46f03eeb266773b45197
    sudo:
      - mkdir -p /tmp/build
      - chown -R vagrant /tmp/build
    output: build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
    binary: 
      https://codeberg.org/BenniJanson/QuestTime/releases/download/v1.0.3/app-armeabi-v7a-release.apk
    srclibs:
      - flutter@stable
    rm:
      - linux
    prebuild:
      - flutterVersion=$(sed -n -E "s/.*flutter-version:\ '(.*)'/\1/p" .github/workflows/release.yml)
      - '[[ $flutterVersion ]]'
      - git -C $$flutter$$ checkout -f $flutterVersion
      - export repo=/tmp/build/de.jk.questtime
      - cd ..
      - mv de.jk.questtime $repo
      - pushd $repo
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get --enforce-lockfile
      - popd
      - mv $repo de.jk.questtime
    scandelete:
      - .pub-cache
    build:
      - export repo=/tmp/build/de.jk.questtime
      - cd ..
      - mv de.jk.questtime $repo
      - pushd $repo
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter build apk --release --split-per-abi --target-platform=android-arm
      - popd
      - mv $repo de.jk.questtime

