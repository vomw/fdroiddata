  - Habit Tracker
  - Time Tracker
  - Finance Manager
  - Money
License: GPL-3.0-or-later
AuthorName: Jan Kraft
SourceCode: https://codeberg.org/BenniJanson/QuestTime
IssueTracker: https://codeberg.org/BenniJanson/QuestTime/issues
Changelog: https://codeberg.org/BenniJanson/QuestTime/releases

AutoName: QuestTime

RepoType: git
Repo: https://codeberg.org/BenniJanson/QuestTime.git

Builds:
  - versionName: 1.0.1
    versionCode: 2
    commit: v1.0.1
    srclibs:
      - flutter@3.29.0
    rm:
      - ios
      - linux
      - macos
      - web
      - windows
    prebuild:
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get
    build:
      - $$flutter$$/bin/flutter build apk --release --split-per-abi --target-platform="android-arm64"
    output: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk

AutoUpdateMode: Version
UpdateCheckMode: Tags
UpdateCheckData: pubspec.yaml|version:\s.+\+(\d+)|.|version:\s(.+)\+
