Categories:
  - Finance Manager
  - Habit Tracker
  - Task
  - Time Tracker
License: GPL-3.0-or-later
AuthorName: Jan Kraft
SourceCode: https://codeberg.org/BenniJanson/QuestTime
IssueTracker: https://codeberg.org/BenniJanson/QuestTime/issues
Changelog: https://codeberg.org/BenniJanson/QuestTime/releases

AutoName: QuestTime

RepoType: git
Repo: https://codeberg.org/BenniJanson/QuestTime.git

Builds:
  - versionName: 1.0.2
    versionCode: 4
    commit: 53aaac68d94943290f951b3edfc01cae287c4c0e
    sudo:
      - mkdir -p /upstream/path/questtime
      - chown -R vagrant /upstream/path
    output: build/app/outputs/flutter-apk/app-release.apk
    srclibs:
      - flutter@3.29.0
    rm:
      - linux
    prebuild:
      - export repo=/upstream/path/questtime
      - cd ..
      - mv example.app $repo
      - pushd $repo
      - export PUB_CACHE=$(pwd)/.pub-cache
      - .flutter/bin/flutter config --no-analytics
      - .flutter/bin/flutter pub get --enforce-lockfile
      - mv $repo questtime.app
    scanignore:
      - .flutter/bin/cache
    scandelete:
      - .flutter
      - .pub-cache
    build: 
      - export repo=/upstream/path/example/example
      - cd ..
      - mv example.app $repo
      - pushd $repo
      - export PUB_CACHE=$(pwd)/.pub-cache
      - .flutter/bin/flutter build apk --release
      - mv $repo example.app

AutoUpdateMode: Version
UpdateCheckMode: Tags
UpdateCheckData: pubspec.yaml|version:\s.+\+(\d+)|.|version:\s(.+)\+
CurrentVersion: 1.0.2
CurrentVersionCode: 4
