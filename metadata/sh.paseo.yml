AuthorName: Mohamed Boudra
AuthorWebSite: https://moboudra.com
WebSite: https://paseo.sh
SourceCode: https://github.com/getpaseo/paseo
IssueTracker: https://github.com/getpaseo/paseo/issues
Changelog: https://paseo.sh/changelog
Donate: https://paseo.sh/sponsor
OpenCollective: paseo-ai

AutoName: Paseo

RepoType: git
Repo: https://github.com/getpaseo/paseo.git

Builds:
  - versionName: 0.7.2
    versionCode: 70021
    commit: 9400a49af670fdb5db4af58e73f8df98588dbea9
    sudo:
      - echo "deb https://deb.debian.org/debian forky main" > /etc/apt/sources.list.d/forky.list
      - apt-get update
      - apt-get install -y xz-utils lbzip2 ninja-build
      - apt-get install -y -t forky npm
      - npm --global install yarn
    init:
      - npm install
      - sed -i '/jvmToolchain\|JavaVersion/s/17/21/' node_modules/@react-native/gradle-plugin/*/build.gradle.kts
        node_modules/@react-native/gradle-plugin/react-native-gradle-plugin/src/main/kotlin/com/facebook/react/utils/JdkConfiguratorUtils.kt
      - npm run build:app-deps
    output: packages/app/android/app/build/outputs/apk/release/app-release.apk
    srclibs:
      - react-native-skia@v2.2.12
    rm:
      - node_modules/@shopify/react-native-skia/libs/android
    prebuild:
      - cd packages/app
      - PASEO_FDROID_BUILD=1 npx expo prebuild -p android --clean
      - cd $$react-native-skia$$
      - yarn install
      - pushd externals/skia
      - python3 tools/git-sync-deps
      - popd
      - pushd externals/depot_tools
      - ./update_depot_tools
    scanignore:
      - node_modules/expo-modules-autolinking/scripts/android/autolinking_implementation.gradle
      - node_modules/expo-modules-core/android/ExpoModulesCorePlugin.gradle
      - node_modules/@mattermost/react-native-paste-input/android/build.gradle
      - node_modules/@react-native-async-storage/async-storage/android/build.gradle
      - node_modules/react-native-edge-to-edge/android/build.gradle
      - node_modules/@react-native-masked-view/masked-view/android/build.gradle
      - node_modules/react-native/ReactAndroid/publish.gradle
      - node_modules/react-native-safe-area-context/android/build.gradle
      - node_modules/react-native-screens/android/build.gradle
      - node_modules/react-native/sdks/hermesc/linux64-bin/hermesc
      - node_modules/react-native-svg/android/build.gradle
      - node_modules/react-native-webview/android/build.gradle
      - packages/app/node_modules/react-native-keyboard-controller/android/build.gradle
      - packages/expo-two-way-audio/node_modules/expo-modules-core/android/ExpoModulesCorePlugin.gradle
    scandelete:
      - node_modules
      - packages/app/node_modules
      - packages/server/node_modules
      - packages/website/node_modules
    build:
      - pushd $$react-native-skia$$
      - cd packages/skia
      - export ANDROID_NDK=$$NDK$$
      - yarn build-skia android-arm
      - popd
      - mv $$react-native-skia$$/packages/skia/libs/android node_modules/@shopify/react-native-skia/libs/android
      - cd packages/app/android
      - PASEO_FDROID_BUILD=1 gradle assembleRelease -PreactNativeArchitectures=armeabi-v7a
        -Dorg.gradle.parallel=false
    ndk: 27.1.12297006

