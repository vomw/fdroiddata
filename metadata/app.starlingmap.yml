Builds:
  - versionName: 0.2.0
    versionCode: 200
    commit: v0.2.0
    subdir: android/app
    sudo:
      - apt-get update
      - apt-get install -y --no-install-recommends npm openjdk-21-jdk-headless
      - update-alternatives --auto java
    init:
      - cd ../.. && npm ci && bash tools/sync-vendor.sh
    gradle:
      - yes
    scandelete:
      - node_modules

