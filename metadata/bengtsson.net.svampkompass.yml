Builds:
  - versionName: 1.0.1
    versionCode: 2
    commit: bd5d7704275f96cc22e974225b0324c49b2bdeed
    output: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
    srclibs:
      - flutter@stable
    prebuild:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter packages pub get
      - find .pub-cache/ -name "*.wasm" -delete
      - find .pub-cache/ -name "*.zip" -delete
      - find .pub-cache/ -name "*.bin" -delete
      - find .pub-cache/ -name "*.gz" -delete
      - find .pub-cache/ -name "*.tgz" -delete
      - find .pub-cache/ -type d -name "example" -exec rm -rf {} +
      - find .pub-cache/ -type d -name "devtools" -exec rm -rf {} +
      - find .pub-cache/ -type d -name "test" -exec rm -rf {} +
      - find .pub-cache/ -type d -name "_out" -exec rm -rf {} +
      - sed -i -e '/com.google.android.gms/d' .pub-cache/hosted/pub.dev/geolocator_android-*/android/build.gradle
    build:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter build apk --no-pub --split-per-abi

