  - Navigation
License: MIT
SourceCode: https://github.com/duelago/svampkompass
IssueTracker: https://github.com/duelago/svampkompass/issues

AutoName: Svampkompassen
Description: En kompass som visar vägen hem och till sparade svampställen.

RepoType: git
Repo: https://github.com/duelago/svampkompass

Builds:
  - versionName: 1.0.1
    versionCode: 2
    commit: v1.0.1
    output: build/app/outputs/flutter-apk/app-release.apk
    srclibs:
      - flutter@stable
    prebuild:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter packages pub get
      # 1. Rensa binärer, arkiv och testfiler från pub-cache
      - find .pub-cache/ -name "*.wasm" -delete
      - find .pub-cache/ -name "*.zip" -delete
      - find .pub-cache/ -name "*.bin" -delete
      - find .pub-cache/ -name "*.gz" -delete
      - find .pub-cache/ -name "*.tgz" -delete
      - find .pub-cache/ -type d -name "example" -exec rm -rf {} +
      - find .pub-cache/ -type d -name "devtools" -exec rm -rf {} +
      - find .pub-cache/ -type d -name "test" -exec rm -rf {} +
      - find .pub-cache/ -type d -name "_out" -exec rm -rf {} +
      # 2. Ta bort beroendet av Google Play Services (GMS) från geolocator_android
      - sed -i -e '/com.google.android.gms/d' .pub-cache/hosted/pub.dev/geolocator_android-*/android/build.gradle
    build:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter build apk

AutoUpdateMode: Version
UpdateCheckMode: Tags
UpdateCheckData: pubspec.yaml|version:\s.+\+(\d+)|.|version:\s(.+)\+
CurrentVersion: 1.0.1
CurrentVersionCode: 2