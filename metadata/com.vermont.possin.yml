Name: Lucky Cat Terminal (LCTerm)
AutoName: LCTerm
Summary: Point-of-sale terminal for accepting cryptocurrency payments
Description: |
  LCTerm is a free and open-source Android Point-of-Sale (POS) application
  designed for merchants who want to accept cryptocurrency payments. It
  supports multiple assets, QR code generation, transaction monitoring, and
  integrates with DogPay / Vericeive infrastructure. This version removes all
  proprietary dependencies to meet F-Droid inclusion requirements.

RepoType: git
Repo: https://github.com/Vermont-Secure-Computing/lucky-cat-terminal.git

