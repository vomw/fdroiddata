Name: Lucky Cat Terminal (LCTerm)
AutoName: LCTerm
Summary: Point-of-sale terminal for accepting cryptocurrency payments
Description: |
  LCTerm is a free and open-source Android point-of-sale (POS) application
  designed for merchants who want to accept cryptocurrency payments.

  Supported coins include:
    - Bitcoin (BTC)
    - Litecoin (LTC)
    - Dogecoin (DOGE)
    - Dash (DASH)
    - Bitcoin Cash (BCH)
    - Ethereum (ETH)
    - Tether (USDT)
    - Monero (XMR)
    - Zcash (ZEC)

  Features:
    - QR code payment requests
    - Real-time price conversion
    - Transaction verification
    - Receipt printing (ESC/POS, Sunmi printers)
    - PIN protection for sensitive actions
    - Fully offline-capable for most operations

  The entire app is built using only open-source libraries such as bitcoinj,
  web3j, ZXing, BouncyCastle, Room, OkHttp, and Retrofit. No proprietary Google
  Play services, trackers, analytics, or ad libraries are used.

