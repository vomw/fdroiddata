Name: Lucky Cat Terminal (LCTerm)
AutoName: LCTerm
Summary: Crypto point-of-sale terminal

Description: |
  LCTerm is a free and open-source Android Point-of-Sale (POS)
  application designed for merchants who accept cryptocurrency
  payments. It supports multiple assets, QR code generation,
  transaction monitoring, and is fully open source for F-Droid.

