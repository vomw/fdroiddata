    build:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter build apk --split-per-abi --target-platform=android-arm64
        --release --dart-define=FDROID_BUILD=true

  - versionName: 0.2.1
    versionCode: 43
    commit: v0.2.1
    output: build/app/outputs/flutter-apk/app-x86_64-release.apk
    srclibs:
      - flutter@stable
    rm:
      - ios
      - linux
      - macos
      - web
      - windows
    prebuild:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - export flutterVersion=$(cat .flutter-version)
      - git -C $$flutter$$ checkout -f $flutterVersion
      - $$flutter$$/bin/flutter config --no-analytics --no-cli-animations
      - $$flutter$$/bin/flutter pub get
    scandelete:
      - .pub-cache
    build:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter build apk --split-per-abi --target-platform=android-x64
        --release --dart-define=FDROID_BUILD=true

MaintainerNotes: |-
  Flutter app. Built with the F-Droid flutter srclib on the stable channel,
  checked out to the exact version pinned in the repo's .flutter-version file
  (extracted in prebuild).

  ABI split: the app ships one APK per ABI (flutter build apk --split-per-abi).
  android/app/build.gradle assigns each split a distinct versionCode using the
  scheme base * 10 + abiCode (armeabi-v7a +1, arm64-v8a +2, x86_64 +3), which
  matches the VercodeOperation below. The base versionCode is kept in sync with
  pubspec.yaml.

  The --dart-define=FDROID_BUILD=true flag compiles out the app's self-update
  machinery (see lib/util/build_flags.dart): no GitHub release polling, no
  in-app APK download/install path, and no "Check for updates" UI. The
  GitHub-release variant keeps it; the F-Droid variant does not, so there is
  no UpdateCheck anti-feature and no APK side-loading.

  Signing: android/app/build.gradle falls back to debug signing when
  android/key.properties is absent (it is not committed), so the build
  produces an APK that F-Droid signs with its own key.

AutoUpdateMode: Version
UpdateCheckMode: Tags ^v[0-9.]+$
VercodeOperation:
  - 10 * %c + 1
  - 10 * %c + 2
  - 10 * %c + 3
UpdateCheckData: pubspec.yaml|version:\s.+\+(\d+)|.|version:\s(.+)\+
CurrentVersion: 0.2.1
CurrentVersionCode: 43
