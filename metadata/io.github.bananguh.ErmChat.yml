    versionCode: 11
    commit: 75c8787d2635a2c02e62b3398f96f9f7e9af4aeb
    output: build/app/outputs/flutter-apk/app-release.apk
    srclibs:
      - flutter@3.44.9
    rm:
      - ios
    prebuild:
      - export repo=/home/runner/work/ermchat/ermchat
      - cd ..
      - mkdir -p $(dirname $repo)
      - mv io.github.bananguh.ErmChat $repo
      - pushd $repo
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter config --no-analytics
