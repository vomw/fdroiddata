Repo: https://github.com/banan-guh/ermchat.git

Builds:
  - versionName: 0.9.3
    versionCode: 1078
    commit: 70b52a0188a0b228d810efdac0a5c3259ae8e0a0
    sudo:
      - mkdir -p /home/runner/work/ErmChat
      - chown -R vagrant /home/runner
    output: build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
    binary: 
      https://github.com/banan-guh/ermchat/releases/download/v%v/ErmChat-v%v-armeabi-v7a.apk
    srclibs:
      - flutter@stable
    rm:
      - ios
    prebuild:
      - export repo=/home/runner/work/ErmChat/ErmChat
      - cd ..
      - mv io.github.bananguh.ErmChat $repo
      - pushd $repo
      - flutterVersion=$(sed -n -E "s/.*flutter-version:\ '(.*)'/\1/p" .github/workflows/main.yml
        | head -1)
      - '[[ $flutterVersion ]]'
      - git -C $$flutter$$ checkout -f $flutterVersion
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get --enforce-lockfile
      - popd
      - mv $repo io.github.bananguh.ErmChat
    scandelete:
      - .pub-cache
    build:
      - export repo=/home/runner/work/ErmChat/ErmChat
      - cd ..
      - mv io.github.bananguh.ErmChat $repo
      - pushd $repo
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter build apk --release --split-per-abi --target-platform=android-arm
      - popd
      - mv $repo io.github.bananguh.ErmChat

