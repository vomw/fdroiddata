      - sed -i -e 's/-Wl,/-Wl,--build-id=none,/' $PUB_CACHE/hosted/pub.dev/jni-*/src/CMakeLists.txt || true
      - popd
      - mv $repo io.github.bananguh.ErmChat
    scandelete:
      - .pub-cache
    build:
      - export repo=/home/runner/work/ermchat/ermchat
      - cd ..
      - mkdir -p $(dirname $repo)
      - mv io.github.bananguh.ErmChat $repo
      - pushd $repo
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter build apk --release
      - popd
      - mv $repo io.github.bananguh.ErmChat

