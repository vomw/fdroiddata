AuthorName: Siar
AuthorEmail: support@amphi.site
AuthorWebSite: https://github.com/siar1234
WebSite: https://amphi.site
SourceCode: https://github.com/amphi2024/notes
IssueTracker: https://github.com/amphi2024/notes/issues

AutoName: Notes

RepoType: git
Repo: https://github.com/amphi2024/notes.git

Builds:
  - versionName: 2.0.0
    versionCode: 4
    commit: 4300ee31d810f1e213ab21d3643ba83b1dcc00b1
    output: build/app/outputs/flutter-apk/app-release.apk
    srclibs:
      - flutter@3.35.3
    rm:
      - ios
      - macos
      - linux
      - windows
      - web
      - test
      - snap
      - scripts
    prebuild:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - export PATH=$PUB_CACHE/bin/:$$flutter$$/bin/:$PATH
      - flutter config --no-analytics
      - flutter doctor --verbose
      - flutter clean
      - flutter pub get
      - flutter precache
    scandelete:
      - .pub-cache
    build:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - export PATH=$PUB_CACHE/bin/:$$flutter$$/bin/:$PATH
      - flutter build apk --verbose

AutoUpdateMode: Version
UpdateCheckMode: Tags v[\d.]+
UpdateCheckData: pubspec.yaml|version:\s.+\+(\d+)|.|version:\s(.+)\+
CurrentVersion: 2.0.0
CurrentVersionCode: 4
