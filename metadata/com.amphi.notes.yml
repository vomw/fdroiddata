AutoName: Notes

RepoType: git
Repo: https://github.com/amphi2024/notes.git
Binaries: https://github.com/amphi2024/notes/releases/download/v%v/Notes-%v-Android.apk

Builds:
  - versionName: 2.1.0
    versionCode: 5
    commit: 552594201eca210738135fa81d0e9d626bfeff25
    sudo:
      - mkdir -p /tmp/build
      - chown vagrant /tmp/build
    output: build/app/outputs/flutter-apk/app-release.apk
    srclibs:
      - flutter@stable
    rm:
      - ios
      - macos
      - linux
      - windows
      - web
      - test
      - snap
      - scripts
    prebuild:
      - flutterVersion=$(sed -n -E "s/^\s+flutter:\s*([0-9.]+)/\1/p" pubspec.yaml)
      - '[[ $flutterVersion ]]'
      - git -C $$flutter$$ checkout -f $flutterVersion
      - mkdir -p /tmp/build
      - cd ..
      - mv com.amphi.notes /tmp/build/amphi-notes
      - pushd /tmp/build/amphi-notes/
      - export PUB_CACHE=$(pwd)/.pub-cache
      - export PATH=$PUB_CACHE/bin/:$$flutter$$/bin/:$PATH
      - flutter config --no-analytics
      - flutter pub get
      - flutter precache
      - popd
      - mv /tmp/build/amphi-notes com.amphi.notes
    scandelete:
      - .pub-cache
    build:
      - mkdir -p /tmp/build
      - cd ..
      - mv com.amphi.notes /tmp/build/amphi-notes
      - pushd /tmp/build/amphi-notes/
      - export PUB_CACHE=$(pwd)/.pub-cache
      - export PATH=$PUB_CACHE/bin/:$$flutter$$/bin/:$PATH
      - flutter build apk
      - popd
      - mv /tmp/build/amphi-notes com.amphi.notes

