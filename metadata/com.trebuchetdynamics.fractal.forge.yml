WebSite: https://fractal.trebuchetdynamics.com
SourceCode: https://github.com/TrebuchetDynamics/flutter-fractal-forge
IssueTracker: https://github.com/TrebuchetDynamics/flutter-fractal-forge/issues
Changelog: https://github.com/TrebuchetDynamics/flutter-fractal-forge/blob/main/CHANGELOG.md

RepoType: git
Repo: https://github.com/TrebuchetDynamics/flutter-fractal-forge.git

MaintainerNotes: |-
  FDROID_BUILD disables upstream signing so F-Droid can verify the three
  ABI-specific APKs against the developer-signed reference binaries. Flutter's
  official Android embedding retains unused Play Store deferred-component type
  references even though this app declares no deferred components and its
  releaseRuntimeClasspath contains no Play Core dependency.

Builds:
  - versionName: 1.1.96
    versionCode: 961
    commit: 9523410090399dad2a79f2afbb42c89e3d74ecf3
    output: build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
    binary: https://github.com/TrebuchetDynamics/flutter-fractal-forge/releases/download/v%v/fractal-forge-android-armeabi-v7a-v%v.apk
    timeout: 3600
    ndk: r28c
    srclibs:
      - flutter@stable
    rm:
      - docs/qa/fractal-audits
      - integration_test
      - ios
      - linux
      - macos
      - test
      - web
      - windows
      - research
    prebuild:
      - flutterVersion=$(sed -n -E "s/.*flutter-version:\ '(.*)'/\1/p" .github/workflows/fdroid-source-build.yml)
      - '[[ $flutterVersion ]]'
      - git -C $$flutter$$ checkout -f $flutterVersion
      - export repo=/tmp/fractal-forge-reproducible
      - rm -rf $repo
      - cd ..
      - mv com.trebuchetdynamics.fractal.forge $repo
      - pushd $repo
      - export PUB_CACHE="$(pwd)/.pub-cache"
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get --enforce-lockfile
      - popd
      - mv $repo com.trebuchetdynamics.fractal.forge
    scandelete:
      - .pub-cache
    build:
      - export repo=/tmp/fractal-forge-reproducible
      - rm -rf $repo
      - cd ..
      - mv com.trebuchetdynamics.fractal.forge $repo
      - pushd $repo
      - export PUB_CACHE="$(pwd)/.pub-cache"
      - export FDROID_BUILD=1
      - export SOURCE_DATE_EPOCH=$(git show -s --format=%ct HEAD)
      - version_name=$(sed -n 's/^versionName=//p' fdroid/version.properties)
      - version_code=$(sed -n 's/^versionCode=//p' fdroid/version.properties)
      - $$flutter$$/bin/flutter build apk --release --split-per-abi --target-platform="android-arm" --build-name="$version_name" --build-number="$version_code"
      - popd
      - mv $repo com.trebuchetdynamics.fractal.forge

