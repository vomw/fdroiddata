Builds:
  - versionName: 1.1.104
    versionCode: 1041
    commit: 987eb6764b51520df74566068132fb29971ccb99
    output: build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
    binary: 
      https://github.com/TrebuchetDynamics/flutter-fractal-forge/releases/download/v%v/fractal-forge-android-armeabi-v7a-v%v.apk
    srclibs:
      - flutter@stable
    rm:
      - docs/qa/fractal-audits
      - integration_test
      - ios
      - linux
      - macos
      - test
      - web
      - windows
      - research
    prebuild:
      - flutterVersion=$(sed -n -E "s/.*flutter-version:\ '(.*)'/\1/p" .github/workflows/fdroid-source-build.yml)
      - '[[ $flutterVersion ]]'
      - git -C $$flutter$$ checkout -f $flutterVersion
      - export repo=/tmp/fractal-forge-reproducible
      - rm -rf $repo
      - cd ..
      - mv com.trebuchetdynamics.fractal.forge $repo
      - pushd $repo
      - export PUB_CACHE="$(pwd)/.pub-cache"
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get --enforce-lockfile
      - popd
      - mv $repo com.trebuchetdynamics.fractal.forge
    scandelete:
      - .pub-cache
    build:
      - export repo=/tmp/fractal-forge-reproducible
      - rm -rf $repo
      - cd ..
      - mv com.trebuchetdynamics.fractal.forge $repo
      - pushd $repo
      - export PUB_CACHE="$(pwd)/.pub-cache"
      - export FDROID_BUILD=1
      - $$flutter$$/bin/flutter build apk --release --split-per-abi --target-platform="android-arm"
        --build-name=$$VERSION$$ --build-number=$(( $$VERCODE$$ / 10 ))
      - popd
      - mv $repo com.trebuchetdynamics.fractal.forge
    ndk: r28c

