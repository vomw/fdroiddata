AutoName: SmokingYou
Summary: Minimalist, data-oriented smoking tracker
Description: |-
  SmokingYou is designed to help you track and manage your smoking habits. By offering clear statistics, dynamic charts, home screen widgets, and motivational achievements, the app provides the insights needed to cut down or quit entirely.

  Features:
  * Habit Tracking: Log entries with a single tap. A real-time timer displays the duration elapsed since your last cigarette.
  * Home Screen Widgets: Quick Add Widget (1x1) and Timer & Counter Widget (3x1).
  * Mindful Craving Pause: Take a mindful pause with breathing guidance to resist cravings.
  * Tapering Reduction Plan: Set gradual reduction goals, track daily limits, and complete check-ins.
  * Historical Baseline Generator: Analyze past smoking habits and track projected savings.
  * Detailed Analytics & History: Interactive charts and craving trigger distributions.
  * Data Portability: Local backup and restore (JSON export/import).

