Categories:
  - Sports & Health
License: GPL-3.0-or-later
AuthorName: GSurrel
AuthorWebSite: https://gregoire.surrel.org
SourceCode: https://github.com/gsurrel/coAIRence

AutoName: coAIRence

RepoType: git
Repo: https://github.com/gsurrel/coAIRence.git

Builds:
  - versionName: 0.2.0
    versionCode: 11
    commit: 33e1f3236bb037cedbe0cbcf770ba55a246f2e7c
    sudo:
      - mkdir -p /upstream/
      - chown -R vagrant /upstream/
    output: build/app/outputs/flutter-apk/app-prod-release.apk
    srclibs:
      - flutter@stable
    prebuild:
      - export repo=/upstream/org.surrel.coairence
      - cd ..
      - mv org.surrel.coairence $repo
      - pushd $repo
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get --enforce-lockfile
      - popd
      - mv $repo org.surrel.coairence
    scandelete:
      - .pub-cache
    build:
      - export repo=/upstream/org.surrel.coairence
      - cd ..
      - mv org.surrel.coairence $repo
      - pushd $repo
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter build apk --flavor=prod --release --split-per-abi
        --target-platform="android-arm64"
      - popd
      - mv $repo org.surrel.coairence

AutoUpdateMode: Version
UpdateCheckMode: Tags
VercodeOperation:
  - '%c * 10 + 1'
  - '%c * 10 + 2'
  - '%c * 10 + 3'
UpdateCheckData: pubspec.yaml|version:\s.+\+(\d+)|.|version:\s(\S+)\+
CurrentVersion: 0.2.0
CurrentVersionCode: 13
