Builds:
  - versionName: 0.2.0
    versionCode: 11
    commit: 7f7e99d3ca04082aeb2ed0614f794ce343086ce6
    sudo:
      - mkdir -p /upstream/
      - chown -R vagrant /upstream/
    output: build/app/outputs/flutter-apk/app-armeabi-v7a-prod-release.apk
    srclibs:
      - flutter@stable
    prebuild:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get --enforce-lockfile
    scandelete:
      - .pub-cache
    build:
      - export SKIP_KEYSTORE=true
      - export NO_XIPH_LIBS=1
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter build apk --flavor=prod --release --split-per-abi

