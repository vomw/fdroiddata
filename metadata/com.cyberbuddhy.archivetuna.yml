Summary: Spotify-style streaming for Archive.org live music
Description: |
  ArchiveTuna streams the Archive.org audio collection: live concert taper
  recordings, 78 RPM shellac transfers, netlabels, and general audio.

  Local-first: vault library, playlists, tier lists, listen history, and
  offline pins live on-device. No account, no advertising, no tracking.

  Features: archive-wide search with filters, curated discovery shelves,
  track radio, offline pinning, sleep timer, 10-band EQ, background
  playback with notification controls, and share links.

