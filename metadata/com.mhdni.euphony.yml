License: GPL-3.0-or-later
WebSite: https://github.com/MohammedNihadv/Euphony
SourceCode: https://github.com/MohammedNihadv/Euphony
IssueTracker: https://github.com/MohammedNihadv/Euphony/issues

AutoName: Euphony
Summary: A beautiful, ad-free music streaming client for Android.
Description: |-
  Euphony is a premium, beautifully designed music streaming application built for speed and aesthetics.

  Features:
  * Ad-free music streaming
  * Background playback & media controls
  * Offline downloads and local library support
  * Synchronized lyrics
  * Customizable UI themes and dynamic island
  * Curated regional home feeds
  * Battery and bandwidth efficient

RepoType: git
Repo: https://github.com/MohammedNihadv/Euphony

Builds:
  - versionName: 1.0.0
    versionCode: 1
    commit: 835213c1cafdbb1d9110d128467d8b3cb500a37f
    sudo:
      - apt-get update
      - apt-get install -y openjdk-17-jdk
    output: build/app/outputs/flutter-apk/app-release.apk
    srclibs:
      - flutter@stable
    prebuild:
      - export PATH=$PATH:$$flutter$$/bin
      - flutter config --no-analytics
      - flutter packages get
    build:
      - flutter build apk --release

AutoUpdateMode: Version
UpdateCheckMode: Tags
CurrentVersion: 1.0.0
CurrentVersionCode: 1
