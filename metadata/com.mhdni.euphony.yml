AutoName: Euphony

RepoType: git
Repo: https://github.com/MohammedNihadv/Euphony

Builds:
  - versionName: 1.0.0
    versionCode: 100001
    commit: 6e9b39e1daab0e293c009194f929cbbbf3fa7aa4
    sudo:
      - mkdir -p /home/runner/work/Euphony
      - chown -R vagrant /home/runner
    output: build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
    binary: 
      https://github.com/MohammedNihadv/Euphony/releases/download/v%v/app-armeabi-v7a-release.apk
    srclibs:
      - flutter@stable
    rm:
      - ios
      - linux
      - macos
      - web
      - windows
    prebuild:
      - cd ..
      - export repo=/home/runner/work/Euphony/Euphony
      - export HOME=/home/runner
      - mv com.mhdni.euphony $repo
      - pushd $repo
      - export PUB_CACHE=$(pwd)/.pub-cache
      - export flutterVersion=$(sed -n -E "s/.*FLUTTER_VERSION:\ '(.*)'/\1/p" .github/workflows/ci.yml)
      - '[[ $flutterVersion ]]'
      - git -C $$flutter$$ checkout -f $flutterVersion
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get --enforce-lockfile
      - sed -i -e 's/-Wl,/-Wl,--build-id=none,/' $PUB_CACHE/hosted/pub.dev/jni-*/src/CMakeLists.txt
      - popd
      - mv $repo com.mhdni.euphony
    scandelete:
      - .pub-cache
    build:
      - cd ..
      - export repo=/home/runner/work/Euphony/Euphony
      - export HOME=/home/runner
      - mv com.mhdni.euphony $repo
      - pushd $repo
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter build apk --release --split-per-abi
      - popd
      - mv $repo com.mhdni.euphony

