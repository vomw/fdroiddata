Categories:
  - Time
License: MIT
AuthorName: Mrflex225
SourceCode: https://github.com/Mrflex-225/focus-libre
IssueTracker: https://github.com/Mrflex-225/focus-libre/issues

AutoName: Focus Libre
Summary: Minuteur Pomodoro libre et hors ligne
Description: |-
  Focus Libre est un minuteur de concentration simple fonctionnant
  entièrement hors ligne.

  Fonctionnalités :
  * Session de concentration de 25 minutes
  * Pause de 5 minutes
  * Démarrage, pause et réinitialisation
  * Compteur de sessions terminées
  * Aucune publicité
  * Aucun suivi analytique
  * Aucun compte requis

RepoType: git
Repo: https://github.com/Mrflex-225/focus-libre.git

Builds:
  - versionName: 1.0.0
    versionCode: 1
    commit: v1.0.0
    subdir: android
    output: ../build/app/outputs/flutter-apk/app-release.apk
    srclibs:
      - flutter@stable
    build:
      - $$flutter$$/bin/flutter config --no-analytics
      - cd .. && $$flutter$$/bin/flutter pub get
      - cd .. && $$flutter$$/bin/flutter build apk --release

AutoUpdateMode: Version
UpdateCheckMode: Tags
