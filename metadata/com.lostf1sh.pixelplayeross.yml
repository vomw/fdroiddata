Categories:
  - Multimedia
License: MIT
AuthorName: lostf1sh
SourceCode: https://github.com/lostf1sh/PixelPlayerOSS
IssueTracker: https://github.com/lostf1sh/PixelPlayerOSS/issues
Changelog: https://github.com/lostf1sh/PixelPlayerOSS/blob/HEAD/CHANGELOG.md

AutoName: PixelPlayerOSS

RepoType: git
Repo: https://github.com/lostf1sh/PixelPlayerOSS.git

Builds:
  - versionName: 0.7.0-foss
    versionCode: 8
    commit: v0.7.0-foss
    sudo:
      - apt-get update
      - apt-get install -y -t trixie openjdk-21-jdk-headless
      - update-java-alternatives --set java-1.21.0-openjdk-amd64
    output: app/build/outputs/apk/release/app-release-unsigned.apk
    prebuild:
      - foojay=org.gradle.toolchains.foojay-resolver-convention
      - sed -i "/$foojay/d" settings.gradle.kts
      - sed -i "s/ -XX:+ParallelRefParsingEnabled//" gradle.properties
    gradle:
      - yes
    gradleprops:
      - pixelplayer.enableAbiSplits=false
      - pixelplayer.disableReleaseSigning=true

AutoUpdateMode: Version
UpdateCheckMode: Tags
UpdateCheckData: gradle.properties|CODE=(\d+)|.|NAME=(.+)
CurrentVersion: 0.7.0-foss
CurrentVersionCode: 8
