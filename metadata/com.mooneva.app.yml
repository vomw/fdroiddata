AutoName: Mooneva Cycle
Summary: A private, open-source menstrual cycle tracker

RepoType: git
Repo: https://github.com/aradar46/Mooneva-Cycle-Private-Period-Tracker

Builds:
  - versionName: '1.5'
    versionCode: 3
    commit: v0.1.6
    subdir: android/app
    sudo:
      - apt-get install -y curl
      - curl -fsSL https://deb.nodesource.com/setup_22.x | bash -
      - apt-get install -y nodejs
    gradle:
      - yes
    prebuild:
      - cd ../../.. && npm ci
      - cd ../../.. && npm run build
      - cd ../../.. && npx cap sync android
    scanignore:
      - node_modules

