AutoName: Mooneva Cycle
Summary: A private, open-source menstrual cycle tracker.

RepoType: git
Repo: https://github.com/aradar46/Mooneva-Cycle-Private-Period-Tracker

Builds:
  - versionName: '1.5'
    versionCode: 3
    commit: v1.5.0
    subdir: android/app
    sudo:
      - apt-get install -y curl
      - curl -fsSL https://deb.nodesource.com/setup_20.x | bash -
      - apt-get install -y nodejs
    prebuild:
      - npm ci
      - npm run build
      - npx cap sync android
    gradle:
      - yes
    scanignore:
      - node_modules

