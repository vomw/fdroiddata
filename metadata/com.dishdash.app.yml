AutoName: DishDash
Summary: Your Intelligent AI Sous-Chef with Gemini & Llama 3
Description: |
  DishDash is a modern, feature-rich Flutter application designed to revolutionize the way you cook. 
  It combines the power of Google Gemini AI and Groq Llama 3 to provide a seamless cooking experience, 
  from scanning your pantry to step-by-step voice-guided instructions. 
  Features include AI Pantry Scanning, AI Chef Chat, and Hands-free voice navigation.

