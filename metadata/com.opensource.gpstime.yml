AutoName: RealTime
Summary: GPS time sync app with millisecond precision
Description: |-
  RealTime is a lightweight, privacy-respecting Android application and library
  that provides accurate wall clock time derived directly from GPS satellites.
  It displays time as an ISO 8601 timestamp with millisecond precision at your
  display's native refresh rate (60 Hz, 90 Hz, 120 Hz, or higher).

  * Gets time exclusively from GPS satellites - zero reliance on NTP servers
  * Compensates for GPS transport delay using Android location elapsed realtime APIs
  * Caches GPS time and maintains it even if the system clock changes
  * Automatically re-synchronizes after device reboot
  * Supports digital, analog, and combined clock views
  * Fully offline and private (no internet permission required)
  * Free and open source under GPL-3.0

