AutoName: GAMA
Summary: Switch between Vulkan and OpenGL renderers without root, via Shizuku.
Description: |-
  GAMA lets you switch your Android device's GPU rendering API between Vulkan
  and OpenGL without root access. It uses Shizuku to execute the necessary
  shell commands securely in the background.

  Switch to Vulkan for better performance, or fall back to OpenGL for broader
  compatibility — all in one tap.

  Features:

  * Switch between Vulkan and OpenGL renderers instantly
  * Quick Settings tiles for Vulkan, OpenGL, and Force Doze
  * Home screen widget for one-tap renderer switching
  * Tasker integration via broadcast intents for automated switching
  * Force Doze mode to put the device into deep idle immediately
  * Per-app exclusions when switching renderers
  * Aggressive mode for a more thorough renderer switch
  * Backup and restore all settings to a JSON file
  * Fully themeable — light, dark, and OLED modes with custom accent colors

  Requires Shizuku to be installed and running. No root required.

