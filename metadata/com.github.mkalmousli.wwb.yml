Builds:
  - versionName: 1.0.0
    versionCode: 1
    commit: 5df43db459ef31ac16fb60bb5bd4af2c8d123ead
    output: build/app/outputs/flutter-apk/app-release.apk
    srclibs:
      - flutter@stable
    prebuild:
      - export version=$(grep flutter .fvmrc | cut -d ":" -f2 | cut -d '"' -f2)
      - '[[ $version ]] || exit 1'
      - git -C $$flutter$$ checkout -f $version
      - export repo=/tmp/app
      - rm -rf $repo
      - cd ..
      - mv com.github.mkalmousli.wwb $repo
      - pushd $repo
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get --enforce-lockfile
      - $$flutter$$/bin/dart run build_runner build --delete-conflicting-outputs
      - popd
      - mv $repo com.github.mkalmousli.wwb
    scandelete:
      - .pub-cache
    build:
      - export repo=/tmp/app
      - cd ..
      - mv com.github.mkalmousli.wwb $repo
      - pushd $repo
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter build apk --release
      - popd
      - mv $repo com.github.mkalmousli.wwb

