Categories:
  - Games
License: MIT
SourceCode: https://github.com/Sigrhofundr/podrida
IssueTracker: https://github.com/Sigrhofundr/podrida/issues
Changelog: https://github.com/Sigrhofundr/podrida/releases

AutoName: Podrida Segnapunti
Description: |
  Podrida Scorekeeper replaces paper and pencil!
  
  Features:
  * Automatic Scoring (10 + 3 per trick)
  * Player & Dealer Management (2-40 players)
  * Multi-language (IT, EN, ES)
  * Native Sharing
  
  This app is built with Capacitor and Vanilla JS.

RepoType: git
Repo: https://github.com/Sigrhofundr/podrida.git

UpdateCheckMode: Tags        
CurrentVersion: 1.0.0      
CurrentVersionCode: 1      
Builds:
  - versionName: 1.0.0
    versionCode: 1
    commit: v1.0.0
    subdir: podrida-android
    sudo:
      - apt-get update || apt-get update
      - apt-get install -y nodejs npm
    prebuild:
      - npm install
      - npx cap sync
    gradle:
      - yes
    scandelete:
      - node_modules