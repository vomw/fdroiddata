License: MIT
SourceCode: https://github.com/Sigrhofundr/podrida
IssueTracker: https://github.com/Sigrhofundr/podrida/issues
Changelog: https://github.com/Sigrhofundr/podrida/releases

RepoType: git
Repo: https://github.com/Sigrhofundr/podrida.git

Builds:
  - versionName: 1.0.0
    versionCode: 1
    commit: v1.0.0
    subdir: podrida-android/android
    sudo:
      - curl -fsSL https://deb.nodesource.com/setup_22.x | bash -
      - apt-get install -y nodejs
    gradle:
      - ./gradlew assembleRelease
      - cd .. && rm -rf node_modules
    prebuild:
      - cd .. && npm install
      - npx cap sync

AutoUpdateMode: None
UpdateCheckMode: Tags
CurrentVersion: 1.0.0
CurrentVersionCode: 1
