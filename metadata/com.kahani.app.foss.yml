AutoName: Kahani
Summary: Offline-first audiobook client for Audiobookshelf
Description: |-
    Kahani (meaning "story" in Hindi) is an offline-first Android audiobook player for Audiobookshelf servers.

    Features:
    * Material Design 3 with dynamic color theming
    * Stream from server or download for offline playback
    * Automated listening progress synchronization
    * Variable speed and skip silence controls
    * Chapter navigation and browse functionality
    * Full support for both audiobooks and podcasts
    * Sleep timer and home screen widget

