Name: Kahani
AutoName: Kahani

RepoType: git
Repo: https://github.com/SurjitSahoo/kahani-android

Builds:
  - versionName: 1.1.0
    versionCode: 10100
    commit: 85536329972b61b9d22dd9936af7226570c17d03
    subdir: app
    sudo:
      - echo "deb https://deb.debian.org/debian trixie main" > /etc/apt/sources.list.d/trixie.list
      - apt-get update
      - apt-get install -y -t trixie openjdk-21-jdk-headless
      - update-alternatives --auto java
    gradle:
      - Foss
    prebuild:
      - find . -name "google-services.json" -delete
      - find . -name "*.gradle.kts" -exec sed -i '/FOSS_REMOVE_START/,/FOSS_REMOVE_END/d'
        {} +
      - sed -i 's/firebase/removed/g' ../gradle/libs.versions.toml
      - sed -i 's/crashlytics/removed/g' ../gradle/libs.versions.toml
      - sed -i 's/clarity/removed/g' ../gradle/libs.versions.toml

AutoUpdateMode: Version
UpdateCheckMode: Tags
UpdateCheckData: gradle.properties|appVersionCode=(\d+)|gradle.properties|appVersionName=([\d.]+)
CurrentVersion: 1.1.0
CurrentVersionCode: 10100
