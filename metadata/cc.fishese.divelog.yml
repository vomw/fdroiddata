Builds:
  - versionName: 1.0.21
    versionCode: 22
    commit: 994a9571e8013672e8e6a91e10b361733a59251b
    subdir: android
    sudo:
      - echo "deb https://deb.debian.org/debian forky main" > /etc/apt/sources.list.d/forky.list
      - apt-get update
      - apt-get install -y -t forky npm
    gradle:
      - yes
    srclibs:
      - libdivecomputer@8e564eb5cf9fb4318af3d540895abb916e1809b0
    prebuild:
      - rm -rf app/src/main/cpp/vendor/libdivecomputer
      - mkdir -p app/src/main/cpp/vendor/libdivecomputer
      - cp -R $$libdivecomputer$$/. app/src/main/cpp/vendor/libdivecomputer/
      - sed -e 's/@DC_VERSION@/0.10.0-devel/' -e 's/@DC_VERSION_MAJOR@/0/' -e 's/@DC_VERSION_MINOR@/10/'
        -e 's/@DC_VERSION_MICRO@/0/' app/src/main/cpp/vendor/libdivecomputer/include/libdivecomputer/version.h.in
        > app/src/main/cpp/vendor/libdivecomputer/include/libdivecomputer/version.h
      - printf '#define DC_VERSION_REVISION "8e564eb5cf9fb4318af3d540895abb916e1809b0"'
        > app/src/main/cpp/vendor/libdivecomputer/src/revision.h
      - cd ..
      - npm ci
      - npm run native:sync
    scanignore:
      - node_modules/@capacitor/cli/assets/capacitor-cordova-android-plugins.tar.gz
    scandelete:
      - node_modules/
      - dist/
      - public/sql-wasm.wasm
      - android/app/src/main/assets/public/sql-wasm.wasm
    build:
      - cd ..
      - npm ci --offline
      - npm run native:sync
    ndk: 27.0.12077973

