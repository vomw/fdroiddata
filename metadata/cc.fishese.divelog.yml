Builds:
  - versionName: 1.0.29
    versionCode: 30
    commit: a196becb4ff1c014c99b908e9611607c6757e309
    subdir: android/app
    submodules: true
    sudo:
      - echo "deb https://deb.debian.org/debian forky main" > /etc/apt/sources.list.d/forky.list
      - apt-get update
      - apt-get install -y -t forky npm
    gradle:
      - yes
    prebuild:
      - cd ../..
      - sh scripts/fetch-libdivecomputer.sh
      - npm ci
      - npm run native:sync
    scanignore:
      - node_modules/@capacitor/cli/assets/capacitor-cordova-android-plugins.tar.gz
    scandelete:
      - node_modules/
      - dist/
      - public/sql-wasm.wasm
      - android/app/src/main/assets/public/sql-wasm.wasm
    build:
      - cd ../..
      - npm ci --offline
      - npm run native:sync
    ndk: 27.0.12077973

