Categories:
  - Sports & Health
License: GPL-3.0-only
SourceCode: https://github.com/dobval/ProteinValue
IssueTracker: https://github.com/dobval/ProteinValue/issues

AutoName: proteinvalue

RepoType: git
Repo: https://github.com/dobval/ProteinValue.git

Builds:
  - versionName: 1.0.0
    versionCode: 13
    commit: f04d7e6d0ce7ba05432c35016ceff9a319e340ac
    submodules: true
    rm:
      - linux
    prebuild:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - .flutter/bin/flutter config --no-analytics
      - .flutter/bin/flutter pub get
    scanignore:
      - .flutter/bin/cache
    scandelete:
      - .flutter
      - .pub-cache
    build:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - .flutter/bin/flutter build apk --release --split-per-abi

AutoUpdateMode: Version
UpdateCheckMode: Tags
VercodeOperation:
  - '%c * 10 + 1'
  - '%c * 10 + 2'
  - '%c * 10 + 3'
UpdateCheckData: pubspec.yaml|version:\s.+\+(\d+)|.|version:\s(.+)\+
CurrentVersion: 1.0.0
