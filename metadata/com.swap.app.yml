Summary: Share files on LAN from Android to browser
Description: |
  Swap runs a local HTTP server on Android so devices on the same Wi-Fi
  can browse, upload, and download files in a web browser.
  It supports search and sorting in the web UI, ZIP downloads, queue
  downloads, Unicode filenames, and optional password-protected files.
