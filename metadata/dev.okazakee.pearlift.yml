Categories:
  - Sports & Health
License: MIT
AuthorName: Okazakee
WebSite: https://pearlift.okazakee.dev/
SourceCode: https://github.com/Okazakee/PearLift
IssueTracker: https://github.com/Okazakee/PearLift/issues

Description: |-
  PearLift is a local-first workout tracker built for lifters who want fast logging without accounts or cloud lock-in.

  Key points:

  - Create and organize multi-day workout programs
  - Track sets, reps, load, and progressive overload
  - Run resilient rest timers that continue working on Android in the background
  - Export or restore your data with local backup files
  - Transfer backups between devices with QR-based sharing
  - Use the app without creating an account

  Privacy posture:

  - All workout data stays on your device by default
  - No ads
  - No analytics or tracking SDKs
  - No Firebase or Google Play Services dependency

RepoType: git
Repo: https://github.com/Okazakee/PearLift

Builds:
  - versionName: 1.0.0
    versionCode: 1
    commit: v1.0.0
    sudo:
      - apt-get update
      - apt-get install -y nodejs npm
    output: android/app/build/outputs/apk/fdroid/app-fdroid.apk
    prebuild:
      - npm install
      - npx --yes expo prebuild --clean --platform android
    scanignore:
      - node_modules/expo-modules-core/android/ExpoModulesCorePlugin.gradle
      - node_modules/@react-native-async-storage/async-storage/android/build.gradle
      - node_modules/react-native-safe-area-context/android/build.gradle
      - node_modules/react-native-svg/android/build.gradle
      - node_modules/react-native/ReactAndroid/publish.gradle
      - node_modules/expo-notifications/android/build.gradle
      - node_modules/expo-application/android/build.gradle
      - node_modules/react-native/React/I18n/strings/
      - node_modules/expo-sqlite/android/vec/
      - node_modules/expo-sqlite/android/libsql/
      - node_modules/expo-sqlite/web/wa-sqlite/
      - node_modules/expo-sqlite/ios/
    scandelete:
      - node_modules/@biomejs/cli-linux-x64/
      - node_modules/hermes-compiler/hermesc/osx-bin/
      - node_modules/hermes-compiler/hermesc/win64-bin/
      - node_modules/hermes-compiler/hermesc/linux64-bin/
      - node_modules/fb-dotslash/bin/
      - node_modules/expo/template.tgz
      - node_modules/**/prebuilds/
      - node_modules/**/local-maven-repo/
      - node_modules/zxing-wasm/dist/
      - node_modules/expo/node_modules/@expo/log-box/node_modules/@expo/dom-webview/local-maven-repo/
      - node_modules/expo/node_modules/expo-asset/local-maven-repo/
    # Use the buildserver-provided gradle wrapper (pulled/updated in CI as
    # $HOME/gradlew-fdroid).  The executable is named "gradlew-fdroid".
    build: cd android && $HOME/gradlew-fdroid/gradlew-fdroid :app:assembleFdroid

AutoUpdateMode: Version
UpdateCheckMode: Tags
UpdateCheckData: fdroid-version.txt|versionCode=([0-9]+)|.|versionName=([0-9.]+)
CurrentVersion: 1.0.0
CurrentVersionCode: 1
