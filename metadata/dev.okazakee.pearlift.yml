Categories:
  - Sports & Health
License: MIT
AuthorName: Okazakee
WebSite: https://pearlift.okazakee.dev/
SourceCode: https://github.com/Okazakee/PearLift
IssueTracker: https://github.com/Okazakee/PearLift/issues

RepoType: git
Repo: https://github.com/Okazakee/PearLift

Builds:
  - versionName: 1.0.5
    versionCode: 6
    commit: df0dda931b3eda13f0fd49de65dd9c821934bb39
    subdir: android/app
    sudo:
      - echo "deb https://deb.debian.org/debian forky main" > /etc/apt/sources.list.d/forky.list
      - apt-get update
      - apt-get install -y -t forky npm
      - npm -g install bun@1.3.12
    gradle:
      - yes
    output: build/outputs/apk/release/app-release.apk
    prebuild:
      - cd ../..
      - bun install --frozen-lockfile
      - rm -rf node_modules/pearlift-rest-timer-fgs/node_modules
      - sed -i -e '/JavaVersion\|jvmToolchain/s/17/21/' node_modules/@react-native/gradle-plugin/*/build.gradle.kts
        node_modules/@react-native/gradle-plugin/react-native-gradle-plugin/src/main/kotlin/com/facebook/react/utils/JdkConfiguratorUtils.kt
      - bunx expo prebuild -p android --clean
    scanignore:
      - node_modules/expo-modules-core/android/ExpoModulesCorePlugin.gradle
      - node_modules/@react-native-async-storage/async-storage/android/build.gradle
      - node_modules/react-native-safe-area-context/android/build.gradle
      - node_modules/react-native-svg/android/build.gradle
      - node_modules/hermes-compiler/hermesc/linux64-bin/hermesc
    scandelete:
      - node_modules

AutoUpdateMode: Version
UpdateCheckMode: Tags
UpdateCheckData: fdroid-version.txt|versionCode=([0-9]+)|.|versionName=([0-9.]+)
CurrentVersion: 1.0.5
CurrentVersionCode: 6
