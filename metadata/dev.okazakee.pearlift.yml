Summary: Privacy-focused local workout tracker with timers and backups

Description: |-
  PearLift is a local-first workout tracker built for lifters who want fast logging without accounts or cloud lock-in.

  Key points:

  - Create and organize multi-day workout programs
  - Track sets, reps, load, and progressive overload
  - Run resilient rest timers that continue working on Android in the background
  - Export or restore your data with local backup files
  - Transfer backups between devices with QR-based sharing
  - Use the app without creating an account

  Privacy posture:

  - All workout data stays on your device by default
  - No ads
  - No analytics or tracking SDKs
  - No Firebase or Google Play Services dependency

Builds:
  - versionName: 1.0.0
    versionCode: 1
    commit: v1.0.0
    # Expo/React Native project, Android Gradle project lives here.
    subdir: android
    # Install JS deps + generate android/ deterministically.
    prebuild:
      - cd ..
      - npm install
      - npx --yes expo prebuild --clean --platform android
      - cd android
    # Build an unsigned APK variant that does not require the upstream release keystore.
    build: ./gradlew :app:assembleFdroid
    output: app/build/outputs/apk/fdroid/app-fdroid.apk

AutoUpdateMode: Version
UpdateCheckMode: Tags
CurrentVersion: 1.0.0
CurrentVersionCode: 1
