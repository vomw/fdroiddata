License: MIT
AuthorName: Okazakee
WebSite: https://pearlift.okazakee.dev/
SourceCode: https://github.com/Okazakee/PearLift
IssueTracker: https://github.com/Okazakee/PearLift/issues

RepoType: git
Repo: https://github.com/Okazakee/PearLift

Builds:
  - versionName: 1.0.6
    versionCode: 702
    commit: 28cc464eeb55997073da1cf127b5c148e90b78f2
    sudo:
      - echo "deb https://deb.debian.org/debian forky main" > /etc/apt/sources.list.d/forky.list
      - apt-get update
      - apt-get install -y -t forky npm
      - npm -g install bun@1.3.12
    output: android/app/build/outputs/apk/release/app-arm64-v8a-release.apk
    prebuild:
      - bun install --frozen-lockfile
      - rm -rf node_modules/pearlift-rest-timer-fgs/node_modules
      - sed -i -e '/JavaVersion\|jvmToolchain/s/17/21/' node_modules/@react-native/gradle-plugin/*/build.gradle.kts
        node_modules/@react-native/gradle-plugin/react-native-gradle-plugin/src/main/kotlin/com/facebook/react/utils/JdkConfiguratorUtils.kt
      - sed -i -e '/jvmTarget/s/17/21/' node_modules/react-native-notify-kit/android/build.gradle
      - '[ -f node_modules/react-native-bare-kit/android/libs/bare-kit/jni/arm64-v8a/libbare-kit.so
        ] || (npm pack react-native-bare-kit@0.13.3 --pack-destination /tmp && tar
        -xzf /tmp/react-native-bare-kit-0.13.3.tgz -C /tmp && cp /tmp/package/android/libs/bare-kit/jni/arm64-v8a/libbare-kit.so
        node_modules/react-native-bare-kit/android/libs/bare-kit/jni/arm64-v8a/)'
      - bunx expo prebuild -p android --clean
    scanignore:
      - node_modules/expo-modules-core/android/ExpoModulesCorePlugin.gradle
      - node_modules/@react-native-async-storage/async-storage/android/build.gradle
      - node_modules/react-native-safe-area-context/android/build.gradle
      - node_modules/react-native-svg/android/build.gradle
      - node_modules/hermes-compiler/hermesc/linux64-bin/hermesc
      - node_modules/expo-*/local-maven-repo
      - node_modules/expo-*/prebuilds
      - node_modules/expo/template.tgz
      - node_modules/expo-sqlite/android
      - node_modules/expo-sqlite/web
      - node_modules/expo-sqlite/ios
      - node_modules/@expo/*/local-maven-repo
      - node_modules/@expo/expo-modules-macros-plugin
      - node_modules/@biomejs
      - node_modules/@msgpackr-extract
      - node_modules/fb-dotslash
      - node_modules/hermes-compiler/hermesc/osx-bin
      - node_modules/hermes-compiler/hermesc/win64-bin
      - node_modules/react-native/React/I18n
      - node_modules/react-native/ReactAndroid/publish.gradle
      - node_modules/react-native-bare-kit/android
      - node_modules/react-native-bare-kit/ios
    build:
      - cd android
      - gradle assembleRelease -PpearliftAbiSplits=true -PpearliftFdroidAbi=arm64-v8a
        -PreactNativeArchitectures=arm64-v8a -Pandroid.enableMinifyInReleaseBuilds=false
        -Pandroid.enableShrinkResourcesInReleaseBuilds=false

AutoUpdateMode: Version
UpdateCheckMode: Tags
VercodeOperation:
  - 100 * %c + 2
UpdateCheckData: fdroid-version.txt|versionCode=([0-9]+)|.|versionName=([0-9.]+)
CurrentVersion: 1.0.6
CurrentVersionCode: 702
