WebSite: https://pearlift.okazakee.dev/
SourceCode: https://github.com/Okazakee/PearLift
IssueTracker: https://github.com/Okazakee/PearLift/issues

RepoType: git
Repo: https://github.com/Okazakee/PearLift

Builds:
  - versionName: 1.0.5
    versionCode: 6
    commit: df0dda931b3eda13f0fd49de65dd9c821934bb39
    sudo:
      - sysctl fs.inotify.max_user_watches=524288 || true
      - curl -Lo node.tar.gz https://nodejs.org/dist/v22.14.0/node-v22.14.0-linux-x64.tar.gz
      - echo "9d942932535988091034dc94cc5f42b6dc8784d6366df3a36c4c9ccb3996f0c2 node.tar.gz"
        | sha256sum -c -
      - tar xzf node.tar.gz --strip-components=1 -C /usr/local/
      - npm -g install bun@1.3.12
    output: android/app/build/outputs/apk/release/app-release.apk
    prebuild:
      - bun install --frozen-lockfile
      - rm -rf node_modules/pearlift-rest-timer-fgs/node_modules
      - bunx expo prebuild -p android --clean
    scanignore:
      - node_modules/expo-modules-core/android/ExpoModulesCorePlugin.gradle
      - node_modules/@react-native-async-storage/async-storage/android/build.gradle
      - node_modules/react-native-safe-area-context/android/build.gradle
      - node_modules/react-native-svg/android/build.gradle
      - node_modules/react-native/ReactAndroid/publish.gradle
      - node_modules/hermes-compiler/hermesc/linux64-bin/hermesc
      - node_modules/react-native/React/I18n/strings/
      - node_modules/expo-sqlite/android/vec/
      - node_modules/expo-sqlite/android/libsql/
      - node_modules/expo-sqlite/web/wa-sqlite/
      - node_modules/expo-sqlite/ios/
    scandelete:
      - node_modules/@biomejs/cli-linux-x64/
      - node_modules/hermes-compiler/hermesc/osx-bin/
      - node_modules/hermes-compiler/hermesc/win64-bin/
      - node_modules/fb-dotslash/bin/
      - node_modules/expo/template.tgz
      - node_modules/**/prebuilds/
      - node_modules/**/local-maven-repo/
      - node_modules/@expo/dom-webview/local-maven-repo/
    build:
      - cd android
      - set -euo pipefail
      - export NODE_ENV=production
      - mkdir -p "$HOME/jdk-17" "$HOME/.gradle"
      - test -x "$HOME/jdk-17/bin/java" || 
        JDK17_URL="https://api.adoptium.net/v3/binary/latest/17/ga/linux/x64/jdk/hotspot/normal/"
      - test -x "$HOME/jdk-17/bin/java" || JDK17_URL="${JDK17_URL}eclipse"
      - test -x "$HOME/jdk-17/bin/java" || (curl -fsSL --retry 3 -o "$HOME/jdk17.tgz"
        "$JDK17_URL" && tar -xzf "$HOME/jdk17.tgz" -C "$HOME/jdk-17" --strip-components=1)
      - echo "org.gradle.java.installations.auto-detect=true" >> "$HOME/.gradle/gradle.properties"
      - echo "org.gradle.java.installations.auto-download=false" >> "$HOME/.gradle/gradle.properties"
      - echo "org.gradle.java.installations.paths=$HOME/jdk-17" >> "$HOME/.gradle/gradle.properties"
      - echo "react.internal.disableJavaVersionAlignment=true" >> gradle.properties
      - $HOME/gradlew-fdroid/gradlew-fdroid :app:assembleRelease -PreactNativeArchitectures=armeabi-v7a,arm64-v8a

AutoUpdateMode: Version
UpdateCheckMode: Tags
UpdateCheckData: fdroid-version.txt|versionCode=([0-9]+)|.|versionName=([0-9.]+)
CurrentVersion: 1.0.5
CurrentVersionCode: 6
