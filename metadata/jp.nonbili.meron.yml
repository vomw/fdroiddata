Categories:
  - Email
License: AGPL-3.0-only
SourceCode: https://github.com/nonbili/meron
IssueTracker: https://github.com/nonbili/meron/issues
Donate: https://github.com/sponsors/nonbili
Liberapay: rnons

RepoType: git
Repo: https://github.com/nonbili/meron

Builds:
  - versionName: 0.1.13
    versionCode: 15
    commit: c5147fba15c2e647f40e151ea9afe957a1052a51
    subdir: mobile
    sudo:
      - sysctl fs.inotify.max_user_watches=524288 || true
      - echo "deb https://deb.debian.org/debian forky main" > /etc/apt/sources.list.d/forky.list
      - apt-get update
      - apt-get install -y build-essential rustup
      - apt-get install -y -t forky npm
      - npm -g install --allow-scripts=bun bun
      - mkdir -p /usr/local/lib/android
      - ln -sfn /opt/android-sdk /usr/local/lib/android/sdk
      - mkdir -p /home/runner/work/meron
      - chown -R vagrant:vagrant /home/runner
    gradle:
      - yes
    output: android/build/outputs/apk/release/android-universal-release-unsigned.apk
    binary: https://github.com/nonbili/meron/releases/download/android/v%v/meron-%v.apk
    prebuild:
      - sed -i '/foojay-resolver/d' settings.gradle
      - sed -i '/dependsOn tasks.named("packageRustCoreAndroid")/d' android/build.gradle
      - export ANDROID_NDK_HOME=/usr/local/lib/android/sdk/ndk/27.3.13750724
      - rustup default 1.96.1
      - rustup target add aarch64-linux-android armv7-linux-androideabi
      - export PATH="/home/vagrant/.cargo/bin:$PATH"
      - cd ..
      - bun scripts/i18n/catalog.ts generate
      - rm -f package.json
      - rm -rf /home/runner/work/meron/meron
      - cp -a "$(pwd)" /home/runner/work/meron/meron
      - (cd /home/runner/work/meron/meron && PROFILE=release mobile/scripts/package-rust-core-android.sh)
      - rm -rf mobile/android/src/main/jniLibs
      - cp -a /home/runner/work/meron/meron/mobile/android/src/main/jniLibs mobile/android/src/main/
    scanignore:
      - mobile/android/src/main/jniLibs
    ndk: 27.3.13750724

AllowedAPKSigningKeys: d377b8ae9a31768658107674ebdbf6bf2d5859277a0a952ab44de0837613d204

AutoUpdateMode: Version
UpdateCheckMode: Tags ^android/v[0-9.]+$
UpdateCheckData: 
  mobile/android/build.gradle|releaseVersionCode\s*=\s*(\d+)|.|releaseVersionName\s*=\s*"([^"]+)"
CurrentVersion: 0.1.13
CurrentVersionCode: 15
