Categories:
  - Email
License: AGPL-3.0-only
SourceCode: https://github.com/nonbili/meron
IssueTracker: https://github.com/nonbili/meron/issues
Donate: https://github.com/sponsors/nonbili
Liberapay: rnons

RepoType: git
Repo: https://github.com/nonbili/meron

Builds:
  - versionName: 0.1.5
    versionCode: 6
    commit: 82f89928ab0147ab862f24a8f30f2d4c2ebfad42
    subdir: mobile
    sudo:
      - sysctl fs.inotify.max_user_watches=524288 || true
      - echo "deb https://deb.debian.org/debian forky main" > /etc/apt/sources.list.d/forky.list
      - apt-get update
      - apt-get install -y build-essential rustup
      - apt-get install -y -t forky npm
      - npm -g install --allow-scripts=bun bun
    gradle:
      - yes
    output: android/build/outputs/apk/release/android-release-unsigned.apk
    prebuild:
      - sed -i '/foojay-resolver/d' settings.gradle
      - export ANDROID_NDK_HOME=$$NDK$$
      - rustup default 1.96.1
      - rustup target add aarch64-linux-android
      - export PATH="$HOME/.cargo/bin:$PATH"
      - cd ..
      - bun scripts/i18n/catalog.ts generate
      - rm -f package.json
      - PROFILE=release mobile/scripts/package-rust-core-android.sh
    scanignore:
      - mobile/android/src/main/jniLibs
    ndk: 27.3.13750724

AutoUpdateMode: Version
UpdateCheckMode: Tags ^android/v[0-9.]+$
UpdateCheckData: mobile/android/build.gradle|releaseVersionCode\s*=\s*(\d+)|.|releaseVersionName\s*=\s*"([^"]+)"
CurrentVersion: 0.1.5
CurrentVersionCode: 6
