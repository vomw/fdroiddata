Categories:
  - Internet
License: AGPL-3.0-only
AuthorName: afterdamage
WebSite: https://github.com/afterdamage/gloomchat
SourceCode: https://github.com/afterdamage/gloomchat
IssueTracker: https://github.com/afterdamage/gloomchat/issues
Changelog: https://github.com/afterdamage/gloomchat/releases

AutoName: GloomChat
Summary: Secure Matrix messenger
Description: |-
    GloomChat is a secure, open-source Matrix messenger.

RepoType: git
Repo: https://github.com/afterdamage/gloomchat.git

Builds:
  - versionName: 1.0.1
    versionCode: 11
    commit: v1.0.1
    srclibs:
      - flutter@stable
    sudo:
      - mkdir -p /home/afterdamage
      - chown vagrant /home/afterdamage
    output: build/app/outputs/flutter-apk/app-x86_64-release.apk
    rm:
      - ios
      - linux
      - macos
      - web
      - windows
    prebuild:
      - export repo=/home/afterdamage/gloomchat
      - mkdir -p $repo
      - cd ..
      - mv im.gloomchat.android $repo/gloomchat
      - pushd $repo/gloomchat
      - flutterVersion=$(sed -n -E "s/^\s*flutter:\ (.*)/\1/p" pubspec.yaml)
      - '[[ $flutterVersion ]] || exit 1'
      - git -C $$flutter$$ checkout -f $flutterVersion
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get
      - popd
      - mv $repo/gloomchat im.gloomchat.android
    scandelete:
      - .pub-cache
    build:
      - export repo=/home/afterdamage/gloomchat
      - cd ..
      - mv im.gloomchat.android $repo/gloomchat
      - pushd $repo/gloomchat
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter build apk --release --split-per-abi --target-platform="android-x64"
      - popd
      - mv $repo/gloomchat im.gloomchat.android

