AutoName: Nawoliy

RepoType: git
Repo: https://gitlab.com/drbea/nawoliy.git

Builds:
  - versionName: 1.0.0
    versionCode: 11
    commit: 43a4daef93279a68239b2dba289add223a36f1de
    submodules: true
    output: build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
    rm:
      - ios
      - linux
      - macos
      - web
      - windows
    prebuild:
      - sed -i 's/signingConfigs.getByName("debug")/null/' android/app/build.gradle.kts
      - export PUB_CACHE=$(pwd)/.pub-cache
      - flutter/bin/flutter config --no-analytics
      - flutter/bin/flutter pub get
    scanignore:
      - flutter/bin/cache
      - flutter/engine
      - flutter/packages/flutter_tools/gradle
      - flutter/packages/flutter_tools/test
      - flutter/dev
    scandelete:
      - .pub-cache
    build:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - export NAWOLIY_ABI_CODE=1
      - flutter/bin/flutter build apk --release --split-per-abi --target-platform=android-arm

  - versionName: 1.0.0
    versionCode: 12
    commit: 43a4daef93279a68239b2dba289add223a36f1de
    submodules: true
    output: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
