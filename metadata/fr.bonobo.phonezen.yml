AutoName: PhoneZen
Summary: Open-source anti-spam phone app
Description: |-
  PhoneZen replaces the native phone app with a smarter, privacy-friendly
  experience. It includes an anti-spam engine based on ARCEP rules, a
  community blocklist, a driving mode with automated responses, and an
  enriched call log.

  Main permissions:
  • Call log access
  • Contacts access
  • Make phone calls
  • Incoming call management
  • Notifications (Android 13+)

  No proprietary dependencies: no Firebase, no Google Play Services.

