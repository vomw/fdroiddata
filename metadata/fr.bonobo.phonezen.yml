AutoName: PhoneZen
Description: |-
  PhoneZen remplace l'application téléphone native par une expérience
  plus intelligente et respectueuse de la vie privée. Il intègre un
  moteur anti-spam basé sur les règles ARCEP (Loi Naegelen), une liste
  participative communautaire hébergée sur Supabase, un mode conduite
  avec réponse automatique, et un journal d'appels enrichi.

  Aucune dépendance à des services propriétaires : pas de Firebase,
  pas de Google Play Services.

