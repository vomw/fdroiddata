AutoName: Anagram

RepoType: git
Repo: https://github.com/lnbits/anagram.git
Binaries: 
  https://github.com/lnbits/anagram/releases/download/v%v/anagram-android-release.apk

Builds:
  - versionName: 0.8.1
    versionCode: 14
    commit: 00b0350b03b9d125ed42259ca1a475da52ac5aa8
    subdir: src-capacitor/android/app
    sudo:
      - echo "deb https://deb.debian.org/debian forky main" > /etc/apt/sources.list.d/forky.list
      - apt-get update
      - apt-get install -y build-essential cmake golang-go rustup
      - apt-get install -y -t forky nodejs npm
    gradle:
      - yes
    srclibs:
      - esbuild@v0.27.7
      - rolldown@v1.0.1
    prebuild:
      - rustup set profile minimal
      - rustup default 1.95.0
      - cd ../../..
      - npm ci --ignore-scripts --no-audit --no-fund
      - npm --prefix src-capacitor ci --ignore-scripts --no-audit --no-fund
      - rm -f node_modules/@rollup/rollup-linux-x64-gnu/rollup.linux-x64-gnu.node
      - rm -f node_modules/@rolldown/binding-linux-x64-gnu/rolldown-binding.linux-x64-gnu.node
    scanignore:
      - src-capacitor/node_modules/@capacitor/cli/assets/capacitor-cordova-android-plugins.tar.gz
    scandelete:
      - node_modules
      - src-capacitor/node_modules
    build:
      - pushd $$esbuild$$
      - go build ./cmd/esbuild
      - popd
      - mkdir -p $$rolldown$$/fdroid-napi
      - pushd $$rolldown$$/fdroid-napi
      - npm init -y
      - npm install --no-save --no-audit --no-fund @napi-rs/cli@3.6.1
      - ./node_modules/.bin/napi build --cwd ../packages/rolldown/src --manifest-path
        ../../../crates/rolldown_binding/Cargo.toml --package-json-path ../package.json
        --package rolldown_binding --platform --release --no-js --dts binding.d.cts
        --output-dir .
      - popd
      - cp -f $$rolldown$$/packages/rolldown/src/rolldown-binding.linux-x64-gnu.node
        ../../../node_modules/@rolldown/binding-linux-x64-gnu/rolldown-binding.linux-x64-gnu.node
      - cd ../../..
      - export ESBUILD_BINARY_PATH="$$esbuild$$/esbuild"
      - node scripts/quasar.cjs build -m capacitor -T android --skip-pkg

AllowedAPKSigningKeys: 57abb6ddad40377e69907d80e7d01a59a005c7f18776fa94a1ecf88beb6c383c

MaintainerNotes: |-
  npm lifecycle scripts are disabled during dependency installation.
  esbuild and Rolldown native executables are rebuilt from the declared
  source libraries. The application contains no Firebase, GMS, advertising,
  analytics, or tracking SDKs.

AutoUpdateMode: Version
UpdateCheckMode: Tags ^v[0-9.]+$
UpdateCheckData: 
  src-capacitor/package.json|"androidVersionCode":\s*(\d+)|.|"version":\s*"([\d.]+)"
CurrentVersion: 0.8.1
CurrentVersionCode: 14
