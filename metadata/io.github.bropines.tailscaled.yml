Builds:
  - versionName: 4.5.3
    versionCode: 4050301
    commit: 60dfe8baf2b639fd69975adb1261b485b4406ce4
    subdir: app
    submodules: true
    sudo:
      - apt-get update
      - apt-get install -y make patch curl
      - apt-get install -y -t trixie-backports golang-go
      - echo "deb https://deb.debian.org/debian bookworm main" > /etc/apt/sources.list.d/bookworm.list
      - apt-get update
      - apt-get install -y -t bookworm openjdk-17-jdk-headless
      - update-java-alternatives -s java-1.17.0-openjdk-amd64
    gradle:
      - yes
    output: build/outputs/apk/release/app-armeabi-v7a-release-unsigned.apk
    binary: 
      https://github.com/bropines/tailsocks/releases/download/v%v/TailSocks-v%v-armeabi-v7a-release.apk
    srclibs:
      - go@go1.26.6
    prebuild: sdkmanager 'platforms;android-37.0' 'platforms;android-36' 'build-tools;35.0.0'
    scanignore:
      - app/src/main/jni/hev-socks5-tunnel/third-part/wintun
    build:
      - pushd $$go$$/src
      - ./make.bash
      - popd
      - export PATH=$$go$$/bin:$HOME/go/bin:$PATH
      - export GOTOOLCHAIN=local
      - export ANDROID_HOME=$$SDK$$
      - export ANDROID_NDK_HOME=$$NDK$$
      - go install golang.org/x/mobile/cmd/gomobile@v0.0.0-20251126181937-5c265dc024c4
      - go install golang.org/x/mobile/cmd/gobind@v0.0.0-20251126181937-5c265dc024c4
      - cd ../appctr
      - TS_ABIS=armeabi-v7a bash build.sh
    ndk: 28.2.13676358
    gradleprops:
      - allowUnsignedRelease
      - targetAbi=armeabi-v7a

