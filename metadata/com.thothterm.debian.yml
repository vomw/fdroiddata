MaintainerNotes: |-
  ThothTerm Trixie is an independent app that runs a Debian GNU/Linux 13
  (trixie) environment under PRoot. It is not affiliated with or endorsed by
  the Debian Project; "Debian" appears only as a factual description of the
  guest. The package id com.thothterm.debian names the guest distribution.

  arm64-v8a only. minSdk 26, targetSdk 36. A separate app from ThothTerm
  Ubuntu (com.thothterm.ubuntu); both are built on the same code, which lives
  in garden-common/.

  The fdroid flavour packages no distribution binaries. The full flavour's
  rootfs staging task runs only for preFull*Build, so this build makes no
  network requests of its own. On first run the app downloads the Debian
  userland only after an explicit opt-in, from the project's GitHub release
  debian-rootfs-trixie-arm64-f6520ff1c6ee, and refuses it unless its size and
  SHA-256 match garden-debian/src/main/assets/garden/distro.properties
  (62445701 bytes, sha256
  f6520ff1c6eeb28ead2d175e6733da4c970459a291b1bd60f992f1655c5d0677).

  That archive is not a Debian-published file: Debian publishes no minimal
  rootfs tarball. It is built by garden-debian/rootfs/build-rootfs.sh with
  debuerreotype from snapshot.debian.org (packages verified against
  debian-archive-keyring), unmodified Debian packages only, and is
  reproducible byte for byte: four runs gave the same SHA-256. Provenance,
  package list and build manifest: docs/garden/debian/ROOTFS_PROVENANCE.md and
  the release assets. The same model as UserLAnd (tech.ula).

  The PRoot runtime is compiled during the build by
  garden-common/tools/build-proot.sh from sources in the repository:
  third_party/proot (termux/proot, tag v5.1.107.92) and
  third_party/libandroid-shmem (termux/libandroid-shmem, tag v0.7) as
  submodules, plus talloc 2.4.3's talloc.c and talloc.h vendored verbatim. The
  script verifies both submodule commits, downloads nothing, and checks 16 KB
  page alignment. submodules: true is therefore required. PRoot is GPL-2.0 and
  talloc LGPL-3.0; the corresponding source is the pinned submodules, the five
  patches in garden-common/patches and the build script, all in the tagged
  commit.

  LAN Mode is an HTTP/WebSocket server, off by default, that the user turns on
  to use the terminal from a browser on the same Wi-Fi or Ethernet network
  after pairing with a one-time PIN. It binds only a private LAN address, uses
  no external service, and serves only assets packaged in the APK
  (garden-common/src/main/assets/lan). Its xterm.js bundle is built unminified
  from npm packages pinned by sha512 by garden-common/lan-web/build.mjs;
  `npm ci --ignore-scripts && node build.mjs --check` reproduces the committed
  files. The Gradle build does not run Node.

  0.2.0 adds uploads into the terminal's current directory: on the phone
  through the Storage Access Framework (no storage permission), and in LAN
  Mode through four authenticated endpoints on the same local server
  (/api/upload/begin, file, finish, cancel), behind the same PIN pairing,
  token, Host and Origin checks. The browser side uses only native file
  inputs and XMLHttpRequest; no JavaScript dependency was added. PRoot patch
  0005 lets the kernel follow the guest's working directory so the app can
  read it from /proc. The downloadable Debian environment is unchanged.

  Release builds are minified with proguard-android-optimize.txt plus
  garden-common/consumer-rules.pro, which holds two keep rules only: the native
  library registers its methods by the literal class names
  com/thothterm/TermIO$Native and com/thothterm/Process$Native.

