Categories:
  - Science & Education
License: MIT
SourceCode: https://github.com/mtendekuyokwa19/katholic
IssueTracker: https://github.com/mtendekuyokwa19/katholic/issues

AutoName: Katholic

RepoType: git
Repo: https://github.com/mtendekuyokwa19/katholic

Builds:
  - versionName: 1.0.0
    versionCode: 1
    commit: 4e7a8bd8
    output: build/app/outputs/flutter-apk/app-release.apk
    srclibs:
      - flutter@stable
    rm:
      - ios
      - linux
      - macos
      - web
      - windows
    prebuild:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get
    scandelete:
      - .pub-cache
    build:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter build apk --release

AutoUpdateMode: Version
UpdateCheckMode: Tags
UpdateCheckData: pubspec.yaml|version:\s.+\+(\d+)|.|version:\s(.+)\+
CurrentVersion: 1.0.0
CurrentVersionCode: 1
