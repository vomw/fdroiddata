Categories:
  - Science & Education
License: MIT
WebSite: https://github.com/mtendekuyokwa19/katholic
SourceCode: https://github.com/mtendekuyokwa19/katholic
IssueTracker: https://github.com/mtendekuyokwa19/katholic/issues

AutoName: Katholic
Description: |-
  A Flutter application providing Catholic daily readings and the Way of the Cross,
  designed to help users engage with their faith through accessible digital tools.

  Features:
  - Daily Catholic Readings: Access liturgical readings for each day
  - Way of the Cross: Interactive stations with prayers and reflections
  - Liturgical Calendar: View liturgical days and special feast days
  - Offline Support: Local database storage for readings
  - Multi-language: Supports English and Chichewa (Malawi)

RepoType: git
Repo: https://github.com/mtendekuyokwa19/katholic

Builds:
  - versionName: '1.0.0'
    versionCode: 1
    commit: 1.0.0
    srclibs:
      - flutter@stable
    output: build/app/outputs/flutter-apk/app-release.apk
    rm:
      - ios
      - linux
      - macos
      - web
      - windows
    prebuild:
      - flutterVersion=$(sed -n -E "s/.*flutter-version:\ '(.*)'/\1/p" .github/workflows/release.yml 2>/dev/null || echo "3.10.1")
      - '[[ $flutterVersion ]]'
      - git -C ../srclib/flutter checkout -f $flutterVersion
      - export PUB_CACHE=$(pwd)/.pub-cache
      - ../srclib/flutter/bin/flutter config --no-analytics
      - ../srclib/flutter/bin/flutter pub get
    scanignore:
      - ../srclib/flutter/bin/cache
    scandelete:
      - ../srclib/flutter
      - .pub-cache
    build:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - ../srclib/flutter/bin/flutter build apk --release

AutoUpdateMode: Version
UpdateCheckMode: Tags
VersionCodePattern: buildNumber
CurrentVersion: '1.0.0'
CurrentVersionCode: 1
