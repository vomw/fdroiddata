id: com.openadhan.app
name: OpenAdhan
summary: Privacy-focused, offline Islamic prayer times app with adhan notifications
description: |
  OpenAdhan is a fully offline Islamic prayer times app designed for privacy. 
  Features include:
  - Offline prayer time calculations
  - Manual location selection
  - Adhan audio playback
  - Prayer notifications
  - All data stored locally using SQLite
  - Fully open-source and F-Droid compatible
license: "OpenAdhan Non-Commercial License v1.0"
license_url: https://github.com/defaltastra/OpenAdhan/blob/main/LICENSE
source: https://github.com/defaltastra/OpenAdhan
issue_tracker: https://github.com/defaltastra/OpenAdhan/issues
categories:
  - Religion
  - System
build:
