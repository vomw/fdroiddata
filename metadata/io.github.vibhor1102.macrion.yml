Builds:
  - versionName: 0.4.4
    versionCode: 90001
    commit: e4b7cc89d10c9ab0e3457948b49ec39c4cfd6898
    sudo:
      - echo "deb https://deb.debian.org/debian trixie main" > /etc/apt/sources.list.d/trixie.list
      - apt-get update
      - apt-get install -y -t trixie openjdk-21-jdk-headless
      - update-alternatives --auto java
    ndk: r28c
    prebuild:
      - sdkmanager 'cmake;3.22.1'
    gradle:
      - fDroid
    gradleprops:
      - macrionAbi=armeabi-v7a
    output: smartautoclicker/build/outputs/apk/fDroid/release/smartautoclicker-fDroid-armeabi-v7a-release-unsigned.apk
    binary: https://github.com/vibhor1102/Macrion/releases/download/v%v/macrion-%v-armeabi-v7a.apk
    scanignore:
      - core/smart/detection-models/src/main/assets/models/text/detect/det.ncnn.bin
      - core/smart/detection-models/src/main/assets/models/text/recognize/latin/rec.ncnn.bin
    scandelete:
      - core/smart/detection/src/debug
      - core/smart/detection/src/androidTest/assets/models/text

