Categories:
  - Pass Wallet
License: AGPL-3.0-or-later
WebSite: https://github.com/phillip9933/Kura
SourceCode: https://github.com/phillip9933/Kura
IssueTracker: https://github.com/phillip9933/Kura/issues

RepoType: git
Repo: https://github.com/phillip9933/Kura.git

AutoName: Kura
UpdateCheckMode: Tags

Builds:
  - versionName: 1.0.0
    versionCode: 44
    commit: v1.0.0
    output: build/app/outputs/flutter-apk/app-release.apk
    srclibs:
      - flutter@3.44.8
    prebuild:
      - sed -i -e 's/compileSdk = 37/compileSdk { version = release(37) { minorApiLevel = 0 } }/' android/app/build.gradle.kts
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get
      - sed -i -e 's/compileSdk 37/compileSdk { version = release(37) { minorApiLevel = 0 } }/' $PUB_CACHE/hosted/pub.dev/receive_sharing_intent-*/android/build.gradle
    scandelete:
      - .pub-cache
    build:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter build apk --release