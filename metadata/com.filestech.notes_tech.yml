MaintainerNotes: |-
  gitubpatrice: THE APK CONTAINS A PRETRAINED BINARY, said here rather than left for you to
  find: packages/whisper_ggml_plus/assets/models/ggml-silero-v6.2.0.bin, 864 kB, a Silero
  voice-activity model. It is not this app's. It is a declared asset of whisper_ggml_plus
  1.5.2, a transitive dependency reached through files_tech_voice, and Flutter bundles a
  package's declared assets whether the app uses them or not; this app's own code never
  references VAD or Silero. The package is MIT, the file is committed in the open at
  github.com/DDULDDUCK/whisper_ggml_plus, and Silero VAD is MIT. Removing it would mean
  forking a third-party package over 864 kB of a 27 MB APK, so scanignore covers that one
  path instead. It surfaced only because pub get moved into prebuild, which is what puts
  .pub-cache in front of the scanner; running pub get inside build would hide it again, which
  is not a fix. Say the word and I will raise it with the package upstream.
  .
  gitubpatrice: the build directory is moved to the upstream path because Flutter bakes
  absolute paths into the native libraries. Measured on the published APKs by grepping the
  zip: libapp.so carries <repo>/.dart_tool/..., and libwhisper.so carries
  <repo>/.pub-cache/.../whisper_ggml_plus-1.5.2/..., since that package compiles its C sources
  from the pub cache. Until 2.0.7 the second path was /home/runner/.pub-cache, the default
  cache, which no recipe could reproduce while this template also wants PUB_CACHE inside the
  build directory for the scanner. 2.0.7 sets PUB_CACHE to the repo-relative path in the
  release workflow, so both now share one root and one move suffices here.
  .
  gitubpatrice: the Flutter version is read from pubspec.yaml as the template does, and
  --enforce-lockfile needs it. srclibs/flutter.yml pins nothing, so flutter@stable is the
  branch tip at build time and a newer stable resolves different SDK-pinned packages than the
  lockfile came from; an attempt without the pin failed on "Unable to satisfy pubspec.yaml
  using pubspec.lock", seven packages apart. The pubspec constraint, the workflows'
  flutter-version, the lockfile and this recipe all name 3.47.2. The NDK follows from it,
  ndkVersion = flutter.ndkVersion, hence the explicit 28.2.13676358 here. JDK 17 upstream.
  .
  gitubpatrice: the ABI versionCodes are Flutter's own, ABI_VERSION[abi] * 1000 + versionCode,
  mapping armeabi-v7a to 1, arm64-v8a to 2 and x86_64 to 4 -- 3 was retired with x86 support
  in flutter#170191. Measured with androguard on the published binaries. Each build line
  carries --target-platform because F-Droid builds every entry independently and a bare
  --split-per-abi makes all three APKs each time to keep one: 12 Gradle runs and 57 minutes
  here, against 23 once each entry compiled only its own ABI. Only the current version is
  declared, for the same reason.

