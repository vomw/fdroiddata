MaintainerNotes: |-
  gitubpatrice: builds up to 2.0.2 (50) tripped check apk with six
  com.google.android.play.core classes. The cause was this app's own R8 rule,
  -keep class io.flutter.** { *; }, which retained
  io.flutter.embedding.engine.deferredcomponents.PlayStoreDeferredComponentManager and
  io.flutter.embedding.android.FlutterPlayStoreSplitApplication. A field and a method
  signature on those classes name Play Core types, so R8 had to write those descriptors
  into the dex even though no Play Core code was ever present.
  .
  It was not an excludable artifact: Play Core has never been a dependency of this app, and
  exclude(group = "com.google.android.play") left the descriptors byte for byte identical.
  Fixed in 2.0.3 (51) by excluding those two classes from the keep rule. Verified with the
  same extraction scan_binary performs, dexdump piped through its regex: 6 matches before,
  0 after, on the same build.
  .
  A -checkdiscard on both classes now fails the build if they ever reappear, so a Flutter
  upgrade or a new plugin cannot silently reintroduce them. History in fdroiddata!37885.
  .
  gitubpatrice: the three ABI versionCodes are Flutter's own, not the scheme in the F-Droid
  quick-start guide. flutter build apk --split-per-abi applies versionCodeOverride =
  ABI_VERSION[abi] * 1000 + versionCode, and FlutterPluginConstants.ABI_VERSION maps
  armeabi-v7a to 1, arm64-v8a to 2 and x86_64 to 4 -- 3 was retired with x86 support. So for
  the pubspec versionCode 51 the APKs carry 1051, 2051 and 4051. Measured on the published
  v2.0.3 binaries with androguard rather than derived: arm64-v8a=2051, armeabi-v7a=1051,
  x86_64=4051. The guide's snippet, which maps x86_64 to 3, would have declared 3051 and the
  build would not have matched. The Builds entries are kept in ascending versionCode order
  because checkupdates pairs zip(builds[-3:], sorted(vercodes)), so any other order would
  attach the wrong output: to the wrong versionCode on the next auto-update.

