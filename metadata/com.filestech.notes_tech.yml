Categories:
  - Writing
  - Security
License: Apache-2.0
AuthorName: Patrice Haltaya
AuthorEmail: contact@files-tech.com
WebSite: https://www.files-tech.com/notes-tech.php
SourceCode: https://github.com/gitubpatrice/notes_tech
IssueTracker: https://github.com/gitubpatrice/notes_tech/issues
Changelog: https://github.com/gitubpatrice/notes_tech/releases

AutoName: Notes Tech

RepoType: git
Repo: https://github.com/gitubpatrice/notes_tech.git

Builds:
  - versionName: 1.0.6
    versionCode: 36
    commit: v1.0.6
    output: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
    srclibs:
      - flutter@stable
    rm:
      - ios
      - linux
      - macos
      - web
      - windows
    prebuild:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get
    scanignore:
      - $$flutter$$/bin/cache
    scandelete:
      - .pub-cache
    build:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter build apk --release --split-per-abi --target-platform="android-arm64"

AutoUpdateMode: Version
UpdateCheckMode: Tags
VercodeOperation:
  - '%c * 10 + 1'
  - '%c * 10 + 2'
  - '%c * 10 + 3'
UpdateCheckData: pubspec.yaml|version:\s.+\+(\d+)|.|version:\s(.+)\+
CurrentVersion: 1.0.6
CurrentVersionCode: 36
