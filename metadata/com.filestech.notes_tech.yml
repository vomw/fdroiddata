MaintainerNotes: |-
  gitubpatrice: builds up to 2.0.2 (50) tripped check apk with six
  com.google.android.play.core classes. The cause was this app's own R8 rule,
  -keep class io.flutter.** { *; }, which retained
  io.flutter.embedding.engine.deferredcomponents.PlayStoreDeferredComponentManager and
  io.flutter.embedding.android.FlutterPlayStoreSplitApplication. A field and a method
  signature on those classes name Play Core types, so R8 had to write those descriptors
  into the dex even though no Play Core code was ever present. Fixed in 2.0.3 (51) by
  excluding those two classes from the keep rule, and a -checkdiscard now fails the build if
  they reappear. Measured the way scan_binary does it, dexdump through its own regex: 6
  matches before, 0 after.
  .
  gitubpatrice: the ABI versionCodes are Flutter's own, ABI_VERSION[abi] * 1000 + versionCode,
  and FlutterPluginConstants maps armeabi-v7a to 1, arm64-v8a to 2 and x86_64 to 4 -- 3 was
  retired with x86 support in flutter#170191. Measured with androguard on the published 2.0.5
  binaries rather than derived: 1053, 2053, 4053. A scheme mapping x86_64 to 3 would declare
  4053 as 3053 and the build would not match.
  .
  gitubpatrice: the Flutter srclib is pinned to 3.44.9 because --enforce-lockfile needs it.
  srclibs/flutter.yml pins nothing, so flutter@stable is the branch tip at build time, and a
  newer stable resolves different SDK-pinned packages than the committed pubspec.lock was
  generated with -- the first attempt failed on exactly that, "Unable to satisfy pubspec.yaml
  using pubspec.lock", with test_core and vector_math among seven changed. 3.44.9 is the tag
  the lockfile corresponds to. The two settings are a pair: dropping the pin means dropping
  --enforce-lockfile with it. This is pinned by hand rather than read from pubspec.yaml as the
  template does, because this app declares no flutter: constraint yet; once it does, the
  extraction can replace the literal.
  .
  Each build line carries --target-platform, as templates/build-flutter.yml prescribes.
  F-Droid builds every entry independently and a bare --split-per-abi produces all three APKs
  each time to keep one: measured here, that was 12 Gradle runs and a 57-minute job, against
  23 minutes once each entry compiled only its own ABI. Only the current version is declared,
  for the same reason -- on a New App merge request the CI diffs against upstream master, so
  every entry is rebuilt on every push.
  .
  gitubpatrice: one caveat on this scheme, offered rather than acted on. fdroid rewritemeta
  sorts Builds by versionCode, and abi*1000+versionCode makes consecutive versions interleave
  once sorted: a 2.0.6 here would give 1053, 1055, 2053, 2055, 4053, 4055. checkupdates pairs
  zip(builds[-3:], sorted(vercodes)), so builds[-3:] would span two versions and two ABIs, and
  a simulation puts 1055 on the arm64-v8a output while armeabi-v7a stops being built. Keeping
  a single version in Builds avoids it today. Adjacent schemes such as %c * 10 + n do not have
  the property, but here they would push arm64-v8a from 2053 down to 532 and break updates for
  installs already published.

