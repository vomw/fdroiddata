RepoType: git
Repo: https://github.com/gitubpatrice/notes_tech.git

Binaries: https://github.com/gitubpatrice/notes_tech/releases/download/v%v/app-%a-release.apk

Builds:
  - versionName: 1.1.0
    versionCode: 41
    commit: 9b4f441eef8e063a5f270d5c82c43c558377a059
    output: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
    srclibs:
      - flutter@stable
    rm:
      - ios
      - linux
      - macos
      - web
      - windows
    prebuild:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get
    scanignore:
      - $$flutter$$/bin/cache
    scandelete:
      - .pub-cache
    build:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter build apk --release --split-per-abi --target-platform="android-arm64"

AllowedAPKSigningKeys: ddb385dee3a416aad9fe5a46173e3684e0762dc433c7e8de6db48f64ede642e9

AutoUpdateMode: Version
UpdateCheckMode: Tags
VercodeOperation:
  - '%c * 10 + 1'
  - '%c * 10 + 2'
  - '%c * 10 + 3'
UpdateCheckData: pubspec.yaml|version:\s.+\+(\d+)|.|version:\s(.+)\+
