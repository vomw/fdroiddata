MaintainerNotes: |-
  gitubpatrice: THE APK CONTAINS A PRETRAINED BINARY, and it is easier to say so than to have
  you find it: packages/whisper_ggml_plus/assets/models/ggml-silero-v6.2.0.bin, 864 kB, a
  Silero voice-activity model. It is not this app's. It is a declared asset of
  whisper_ggml_plus 1.5.2, a transitive dependency reached through files_tech_voice, and
  Flutter bundles a package's declared assets whether the app uses them or not -- this app's
  own code never references VAD or Silero. The package is MIT, the file is committed in the
  open at github.com/DDULDDUCK/whisper_ggml_plus, and Silero VAD is MIT. Dropping it would
  mean forking a third-party package over 864 kB of a 27 MB APK, so it is declared instead and
  scanignore covers that one path. It surfaced only because pub get moved into prebuild, which
  is what puts .pub-cache in front of the scanner; running pub get inside build would hide it
  again, which is not a fix. Say the word and I will take it up with the package upstream.
  .
  gitubpatrice: the Flutter version is read from pubspec.yaml as the template does.
  --enforce-lockfile needs it. srclibs/flutter.yml pins nothing, so flutter@stable is the
  branch tip at build time and a newer stable resolves different SDK-pinned packages than the
  lockfile was generated with: an attempt without the pin failed on exactly that, "Unable to
  satisfy pubspec.yaml using pubspec.lock", seven packages apart. 2.0.6 exists to fix the cause
  rather than the symptom -- the release workflow used to build on whatever stable happened to
  be, 3.47.2 for 2.0.5, while the committed lockfile came from 3.44.9 and pub get ran without
  --enforce-lockfile, so the lockfile described nothing that shipped. environment: flutter:,
  the workflows' flutter-version:, the lockfile and this recipe now all name 3.47.2, and the
  workflows enforce the lockfile so drift fails instead of passing quietly.
  .
  gitubpatrice: the ABI versionCodes are Flutter's own, ABI_VERSION[abi] * 1000 + versionCode,
  and FlutterPluginConstants maps armeabi-v7a to 1, arm64-v8a to 2 and x86_64 to 4 -- 3 was
  retired with x86 support in flutter#170191. Measured with androguard on published binaries
  rather than derived. Each build line carries --target-platform: F-Droid builds every entry
  independently and a bare --split-per-abi produces all three APKs each time to keep one, which
  measured 12 Gradle runs and a 57-minute job against 23 minutes once each entry compiled only
  its own ABI. Only the current version is declared, for the same reason.
  .
  gitubpatrice: one caveat on the scheme, offered rather than acted on. fdroid rewritemeta
  sorts Builds by versionCode, and abi*1000+versionCode makes consecutive versions interleave
  once sorted. checkupdates pairs zip(builds[-3:], sorted(vercodes)), so with two versions
  present builds[-3:] would span two of them and only two ABIs; a simulation puts the next
  armeabi-v7a code on the arm64-v8a output. Keeping one version in Builds avoids it. An
  adjacent scheme such as %c * 10 + n does not have the property, but here it would push
  arm64-v8a from 2054 down to 542 and break updates for installs already published.
  .
  gitubpatrice: builds up to 2.0.2 (50) tripped check apk with six com.google.android.play.core
  classes, from this app's own -keep class io.flutter.** { *; } retaining
  PlayStoreDeferredComponentManager and FlutterPlayStoreSplitApplication, whose field and method
  signatures name Play Core types. Fixed in 2.0.3 by excluding those two classes; a
  -checkdiscard now fails the build if they reappear. Measured the way scan_binary does it:
  6 matches before, 0 after.
