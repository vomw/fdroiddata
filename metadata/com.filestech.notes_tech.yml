    sudo:
      - mkdir -p /home/runner/work/notes_tech/notes_tech
      - chown -R vagrant /home/runner
    output: build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
    binary: 
      https://github.com/gitubpatrice/notes_tech/releases/download/v%v/notes-tech-armeabi-v7a-%v.apk
    srclibs:
      - flutter@stable
    prebuild:
      - flutterVersion=$(sed -n -E 's/flutter:\ (.+)/\1/p' pubspec.yaml)
      - '[[ $flutterVersion ]]'
      - git -C $$flutter$$ checkout -f $flutterVersion
      - export repo=/home/runner/work/notes_tech/notes_tech/notes_tech
      - cd ..
      - mv com.filestech.notes_tech $repo
      - pushd $repo
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get --enforce-lockfile
      - popd
      - mv $repo com.filestech.notes_tech
    scanignore:
      - .pub-cache/hosted/pub.dev/whisper_ggml_plus-1.5.2/assets/models/ggml-silero-v6.2.0.bin
    scandelete:
      - .pub-cache
    build:
      - export repo=/home/runner/work/notes_tech/notes_tech/notes_tech
      - cd ..
      - mv com.filestech.notes_tech $repo
      - pushd $repo
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter build apk --release --split-per-abi --target-platform=android-arm
        --obfuscate --split-debug-info=build/symbols
      - popd
      - mv $repo com.filestech.notes_tech
