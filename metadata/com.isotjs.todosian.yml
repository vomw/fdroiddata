AutoName: Todosian
Summary: Manage Obsidian Markdown todo files
Description: |-
  Todosian is an Android todo app for Obsidian users.
  It manages todo lists stored as Markdown files in a local folder.

  The app reads and writes existing `.md` files directly, without importing data
  into a database.

  Features:
  * Pick a folder with Android's Storage Access Framework (SAF)
  * Each Markdown file is treated as a category
  * Add, edit, toggle, and delete todos
  * Optional support for Obsidian Tasks metadata (dates, priority, recurrence)
  * Offline-first with no account, no analytics, and no built-in sync

  Note: Todosian edits Markdown files directly. Keep regular backups.

