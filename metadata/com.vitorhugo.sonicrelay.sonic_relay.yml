AutoUpdateMode: Version
UpdateCheckMode: Tags ^v[0-9]+\.[0-9]+\.[0-9]+\+[0-9]+$
VercodeOperation:
  - 10 * %c + 1
  - 10 * %c + 2
  - 10 * %c + 3
UpdateCheckData: '|\+(\d+)$||^v([^+]+)\+\d+$'
CurrentVersion: 1.1.0
