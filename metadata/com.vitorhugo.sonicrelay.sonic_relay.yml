Categories:
  - Multimedia
License: MIT
AuthorName: Vitor Hugo
AuthorWebSite: https://hugodotnet.dev
SourceCode: https://github.com/vitorhugo-dotnet/flutter_mobile-web_SonicRelay
IssueTracker: https://github.com/vitorhugo-dotnet/dotnet_SonicRelay/issues

AutoName: SonicRelay

RepoType: git
Repo: https://github.com/vitorhugo-dotnet/flutter_mobile-web_SonicRelay.git

Builds:
  - versionName: 1.1.0
    versionCode: 891
    commit: PLACEHOLDER_RELEASE_COMMIT
    output: build/app/outputs/flutter-apk/app-armeabi-v7a-fdroid-release.apk
    srclibs:
      - flutter@stable
    rm:
      - ios
    prebuild:
      - flutterVersion=$(sed -n -E 's/^[[:space:]]*FLUTTER_VERSION:[[:space:]]*"([^"]+)".*$/\1/p'
        .github/workflows/flutter-ci.yml | head -n 1)
      - '[[ $flutterVersion ]]'
      - git -C $$flutter$$ checkout -f "$flutterVersion"
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get --enforce-lockfile
    scandelete:
      - .pub-cache
    build:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter build apk --release --flavor fdroid --split-per-abi
        --target-platform=android-arm --build-number=$(( $$VERCODE$$ / 10 ))

  - versionName: 1.1.0
    versionCode: 892
    commit: PLACEHOLDER_RELEASE_COMMIT
