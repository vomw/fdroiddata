Builds:
  - versionName: 1.7.4
    versionCode: 1001541
    commit: 3b53d903858a4e155fd7f3eda314f09896b47a6a
    sudo:
      - mkdir -p /home/runner/work/flutter_mobile-web_SonicRelay
      - chown -R vagrant /home/runner
    output: build/app/outputs/flutter-apk/app-armeabi-v7a-fdroid-release.apk
    binary: 
      https://github.com/vitorhugo-dotnet/flutter_mobile-web_SonicRelay/releases/download/v1.7.4+100154/sonic-relay-armeabi-v7a-fdroid-v1.7.4+100154.apk
    srclibs:
      - flutter@stable
    rm:
      - ios
    prebuild:
      - flutterVersion=$(sed -n -E 's/^[[:space:]]*FLUTTER_VERSION:[[:space:]]*"([^"]+)".*$/\1/p'
        .github/workflows/flutter-ci.yml | head -n 1)
      - '[[ $flutterVersion ]]'
      - git -C $$flutter$$ checkout -f "$flutterVersion"
      - export repo=/home/runner/work/flutter_mobile-web_SonicRelay
      - mkdir -p $repo
      - cd ..
      - mv com.vitorhugo.sonicrelay.sonic_relay $repo/flutter_mobile-web_SonicRelay
      - pushd $repo/flutter_mobile-web_SonicRelay
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get --enforce-lockfile
      - sed -i -e '1a add_link_options("LINKER:--build-id=none")' $PUB_CACHE/hosted/pub.dev/flutter_zxing-*/*/CMakeLists.txt
      - sed -i -e '/^project(/a add_link_options("LINKER:--build-id=none")' $PUB_CACHE/hosted/pub.dev/jni-*/src/CMakeLists.txt
      - popd
      - mv $repo/flutter_mobile-web_SonicRelay com.vitorhugo.sonicrelay.sonic_relay
    scandelete:
      - .pub-cache
    build:
      - export repo=/home/runner/work/flutter_mobile-web_SonicRelay
      - cd ..
      - mv com.vitorhugo.sonicrelay.sonic_relay $repo/flutter_mobile-web_SonicRelay
      - pushd $repo/flutter_mobile-web_SonicRelay
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter build apk --release --flavor fdroid --split-per-abi
        --target-platform=android-arm --build-number=$(( $$VERCODE$$ / 10 ))
      - popd
      - mv $repo/flutter_mobile-web_SonicRelay com.vitorhugo.sonicrelay.sonic_relay
    ndk: 28.2.13676358

