  https://github.com/sunging/MangoSSH/releases/download/v%v/MangoSSH-v%v-fdroid.apk

Builds:
  - versionName: 0.5.1
    versionCode: 5001
    commit: 2eee2315625d1733e22ab48e50df114a81dfe754
    timeout: 14400
    submodules: true
    sudo:
      - echo "deb https://deb.debian.org/debian bookworm main" > /etc/apt/sources.list.d/bookworm.list
      - apt-get update
      - apt-get install -y autoconf automake binutils bison build-essential cmake
        curl gettext git gperf libtool ninja-build pkg-config rsync texinfo unzip
        zip
      - apt-get install -y -t bookworm openjdk-17-jdk-headless
      - curl -fLo /tmp/go1.26.7.linux-amd64.tar.gz https://go.dev/dl/go1.26.7.linux-amd64.tar.gz
      - echo "ffb5f8de10c62550dfddab66b36b57030721e0a44a3218e9e1181d7b59f121ca  /tmp/go1.26.7.linux-amd64.tar.gz"
        | sha256sum -c -
      - mkdir -p /opt/go
      - tar -xzf /tmp/go1.26.7.linux-amd64.tar.gz --strip-components=1 -C /opt/go
    gradle:
      - fdroid
    output: app/build/outputs/apk/fdroid/release/app-fdroid-release-unsigned.apk
    srclibs:
      - zlib@51b7f2abdade71cd9bb0e7a373ef2610ec6f9daf
      - abseil-cpp@4a2c63365eff8823a5221db86ef490e828306f9d
      - protobuf@796e49f6ca82f763d1087d2ff7355d2f0d7b71b1
      - ncurses@79b9071f2be20a24c7be031655a5638f6032f29f
      - nettle@b8c841dc3278dec0812365f02370b41ea9d4ddee
    prebuild:
      - sed -i '/MANGOSSH_GO_SOURCE/d; /build-fdroid-go.sh/d' tools/prepare-fdroid-native.sh
        tools/verify-fdroid-sources.sh
      - sed -i '/^go|/d; /^go-bootstrap-/d' tools/fdroid-sources.lock
      - sed -i '/org.gradle.toolchains.foojay-resolver-convention/d' settings.gradle.kts
      - echo 'org.gradle.java.home=/usr/lib/jvm/java-17-openjdk-amd64' >> gradle.properties
      - sed -i '/compileSdk = 37/a\    ndkVersion = "27.3.13750724"' app/build.gradle.kts
      - sed -i '/environment("ANDROID_SDK_ROOT", androidSdkPath)/a\        environment("JAVA_HOME",
        "/usr/lib/jvm/java-17-openjdk-amd64")' app/build.gradle.kts
    scanignore:
      - native/tsnetbridge/vendor/github.com/tailscale/web-client-prebuilt/build/assets/index-BbZBz4S-.js.gz
      - native/tsnetbridge/vendor/github.com/tailscale/web-client-prebuilt/build/assets/index-DVk8gqX9.css.gz
      - native/tsnetbridge/vendor/tailscale.com/util/eventbus/assets/htmx-websocket.min.js.gz
      - native/tsnetbridge/vendor/tailscale.com/util/eventbus/assets/htmx.min.js.gz
    scandelete:
      - app/src/main/jniLibs
      - app/src/main/assets/mosh/terminfo.zip
      - third_party/mosh4android/src/fuzz/terminal_corpus
      - third_party/mosh4android/src/fuzz/terminal_parser_corpus
    build:
      - mkdir -p .fdroid/mosh-deps
      - ln -s $$zlib$$ .fdroid/mosh-deps/zlib
      - rm -rf $$protobuf$$/third_party/abseil-cpp
      - ln -s $$abseil-cpp$$ $$protobuf$$/third_party/abseil-cpp
      - ln -s $$protobuf$$ .fdroid/mosh-deps/protobuf
      - ln -s $$ncurses$$ .fdroid/mosh-deps/ncurses
      - ln -s $$nettle$$ .fdroid/mosh-deps/nettle
      - export MANGOSSH_MOSH_DEPS_DIR=$PWD/.fdroid/mosh-deps
      - export MANGOSSH_GO_ROOT=/opt/go
      - mkdir -p .tools/go
      - ln -s /opt/go .tools/go/1.26.7
      - JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64 bash tools/prepare-fdroid-native.sh
    buildjni:
      - no
    ndk: r27d
    gradleprops:
      - mangosshOfflineBuild=true

AllowedAPKSigningKeys: 6ad86ccb0026c60606b016a643fb5f90c090035591c2c734d0fd66004b9373be

MaintainerNotes: |-
  Since 0.5.1, Go 1.26.7 uses the checksum-pinned official Linux amd64
  toolchain. Trixie-backports currently provides Go 1.26.8 instead, which
  does not match the upstream release compiler. The preparation commands
  bypass the tagged Go compiler bootstrap and its source-only requirements;
  tsnet and its vendored dependencies are still compiled from source offline.
  The upstream no-GMP Mosh patch disables Nettle public-key and mini-GMP
  support. The 0.5.1 build therefore no longer needs the GMP srclib.
  The fdroid flavor has no self-update client, package-install permission,
  update FileProvider, or installer handoff. The embedded Tailscale source is
  vendored; its logtail identity and network upload are disabled by the
  upstream-visible patch under tools/patches and the bridge sets no-support
  logging before startup. Generated PTY, Mosh, and terminfo files tracked by
  upstream are deleted by the scanner and rebuilt from the pinned sources.
  The four narrow scanignore entries are source-controlled gzip assets from
  pinned Tailscale sources. They are required by Go embed declarations during
  gomobile binding and must remain byte-identical for reproducible builds. The
  eventbus debug server is excluded from Android by upstream build tags. The
  Mosh fuzz corpora are not part of the client build, so those files are
  deleted instead. The foojay resolver is removed because the build uses the
  buildserver-provided JDK 17 and does not download a Java toolchain.

