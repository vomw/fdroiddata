Builds:
  - versionName: 0.4.1
    versionCode: 4001
    commit: f176cb188c86c6319f4c0713fbe271de082190c8
    timeout: 14400
    submodules: true
    sudo:
      - echo "deb https://deb.debian.org/debian bookworm main" > /etc/apt/sources.list.d/bookworm.list
      - apt-get update
      - apt-get install -y autoconf automake binutils bison build-essential cmake
        gettext git golang-go gperf libtool ninja-build pkg-config rsync texinfo unzip
        zip
      - apt-get install -y -t bookworm openjdk-17-jdk-headless
    gradle:
      - fdroid
    output: app/build/outputs/apk/fdroid/release/app-fdroid-release-unsigned.apk
    srclibs:
      - go124@7f36edc26d4e3becb6d9c9008ff00f260bb19055
      - go@c19862e5f8415b4f24b189d065ed739517c548ba
      - zlib@51b7f2abdade71cd9bb0e7a373ef2610ec6f9daf
      - abseil-cpp@4a2c63365eff8823a5221db86ef490e828306f9d
      - protobuf@796e49f6ca82f763d1087d2ff7355d2f0d7b71b1
      - ncurses@79b9071f2be20a24c7be031655a5638f6032f29f
      - gmp@2bbd52703e5af82509773264bfbd20ff8464804f
      - nettle@b8c841dc3278dec0812365f02370b41ea9d4ddee
    prebuild:
      - sed -i 's/^declare -a BOOTSTRAP_VERSIONS=.*/declare -a BOOTSTRAP_VERSIONS=("1.24.6")/' tools/build-fdroid-go.sh
      - sed -i '/^go-bootstrap-1\.20\.14|/d; /^go-bootstrap-1\.22\.12|/d' tools/fdroid-sources.lock
      - sed -i '/org.gradle.toolchains.foojay-resolver-convention/d' settings.gradle.kts
      - echo 'org.gradle.java.home=/usr/lib/jvm/java-17-openjdk-amd64' >> gradle.properties
      - sed -i '/compileSdk = 37/a\    ndkVersion = "27.3.13750724"' app/build.gradle.kts
      - sed -i '/environment("ANDROID_SDK_ROOT", androidSdkPath)/a\        environment("JAVA_HOME",
        "/usr/lib/jvm/java-17-openjdk-amd64")' app/build.gradle.kts
    scanignore:
      - native/tsnetbridge/vendor/github.com/tailscale/web-client-prebuilt/build/assets/index-BbZBz4S-.js.gz
      - native/tsnetbridge/vendor/github.com/tailscale/web-client-prebuilt/build/assets/index-DVk8gqX9.css.gz
      - native/tsnetbridge/vendor/tailscale.com/util/eventbus/assets/htmx-websocket.min.js.gz
      - native/tsnetbridge/vendor/tailscale.com/util/eventbus/assets/htmx.min.js.gz
    scandelete:
      - app/src/main/jniLibs
      - app/src/main/assets/mosh/terminfo.zip
      - third_party/mosh4android/src/fuzz/terminal_corpus
      - third_party/mosh4android/src/fuzz/terminal_parser_corpus
    build:
      - mkdir -p .fdroid/mosh-deps
      - ln -s $$go124$$ .fdroid/mosh-deps/go-bootstrap-1.24.6
      - ln -s $$zlib$$ .fdroid/mosh-deps/zlib
      - rm -rf $$protobuf$$/third_party/abseil-cpp
      - ln -s $$abseil-cpp$$ $$protobuf$$/third_party/abseil-cpp
      - ln -s $$protobuf$$ .fdroid/mosh-deps/protobuf
      - ln -s $$ncurses$$ .fdroid/mosh-deps/ncurses
      - ln -s $$gmp$$ .fdroid/mosh-deps/gmp
      - ln -s $$nettle$$ .fdroid/mosh-deps/nettle
      - export MANGOSSH_GO_SOURCE=$$go$$
      - export MANGOSSH_MOSH_DEPS_DIR=$PWD/.fdroid/mosh-deps
      - export MANGOSSH_GO_ROOT=$PWD/.tools/go/1.26.5
      - JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64 bash tools/prepare-fdroid-native.sh
    buildjni:
      - no
    ndk: r27d
    gradleprops:
      - mangosshOfflineBuild=true

