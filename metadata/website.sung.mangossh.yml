MaintainerNotes: |-
  The fdroid flavor has no self-update client, package-install permission,
  update FileProvider, or installer handoff. The embedded Tailscale source is
  vendored; its logtail identity and network upload are disabled by the
  upstream-visible patch under tools/patches and the bridge sets no-support
  logging before startup. Generated PTY, Mosh, and terminfo files tracked by
  upstream are deleted by the scanner and rebuilt from the pinned sources.
  The two narrow scanignore entries are BSD-3-Clause assets from the pinned
  github.com/tailscale/web-client-prebuilt module. They are required by its
  Go embed declaration and must remain byte-identical for reproducible builds.
  The eventbus gzip assets are excluded from Android by upstream build tags,
  and the Mosh fuzz corpora are not part of the client build, so those files
  are deleted instead. The foojay resolver is removed because the build uses
  the buildserver-provided JDK 17 and does not download a Java toolchain.

