MaintainerNotes: |-
  Only protobuf, ncurses, nettle, and gmp need new srclib definitions.
  The go, zlib, and abseil-cpp definitions already exist in fdroiddata.
  Protobuf supplies both the host protoc and the Android library; its pinned
  Abseil checkout is required by both builds. Ncurses supplies the Android
  terminal library and the matching host tic for reproducible terminfo.
  Nettle supplies Mosh AES. GMP is not linked directly by Mosh, but the tagged
  native script builds GMP and enables Nettle public-key support by default.
  Removing GMP therefore needs an upstream build change and binary comparison,
  not just deleting its srclib entry from this reproducible-build recipe.
  golang-go from trixie-backports provides the host bootstrap compiler.
  The prebuild commands remove the tagged upstream intermediate bootstrap
  stages and their source-lock entries. Only the final Go 1.26.7 is built
  from its pinned source for Android tsnet; its source verification and
  minimum bootstrap version check remain enabled.
  The fdroid flavor has no self-update client, package-install permission,
  update FileProvider, or installer handoff. The embedded Tailscale source is
  vendored; its logtail identity and network upload are disabled by the
  upstream-visible patch under tools/patches and the bridge sets no-support
  logging before startup. Generated PTY, Mosh, and terminfo files tracked by
  upstream are deleted by the scanner and rebuilt from the pinned sources.
  The four narrow scanignore entries are source-controlled gzip assets from
  pinned Tailscale sources. They are required by Go embed declarations during
  gomobile binding and must remain byte-identical for reproducible builds. The
  eventbus debug server is excluded from Android by upstream build tags. The
  Mosh fuzz corpora are not part of the client build, so those files are
  deleted instead. The foojay resolver is removed because the build uses the
  buildserver-provided JDK 17 and does not download a Java toolchain.

