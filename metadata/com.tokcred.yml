Categories:
  - Education
  - Security
License: MIT
SourceCode: https://github.com/abrar-0020/Tokenized-Academic-Credential-Verification-System
IssueTracker: https://github.com/abrar-0020/Tokenized-Academic-Credential-Verification-System/issues

Name: TokCred
Summary: Tokenized academic credential verification system on the blockchain.
Description: |-
  TokCred is a tokenized academic credential verification system that allows institutions to safely issue and verify academic certificates on the blockchain. Built with React Native.

Builds:
  - versionName: 1.0.0
    versionCode: 1
    commit: v1.0.0
    sudo:
      - apt-get update
      - apt-get install -y nodejs npm
    build:
      - npm install
      - npx expo prebuild
    output: android/app/build/outputs/apk/release/app-release-unsigned.apk

AutoUpdateMode: Version v%v
UpdateCheckMode: Tags
