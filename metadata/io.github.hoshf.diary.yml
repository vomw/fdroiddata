Name: Diary
Summary: Voice-first local diary with user-configured AI summaries
Description: |-
  Diary records short voice notes, transcribes them through a user-configured
  provider, and summarizes the transcript into a structured daily diary entry.

  The app does not include API keys or telemetry. Sensitive diary fields are
  encrypted locally with Tink, and audio is deleted after transcript text is
  saved. JSON import and export provide an off-device recovery path.

