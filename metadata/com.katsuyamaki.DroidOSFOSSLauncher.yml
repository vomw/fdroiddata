AutoName: DroidOS Launcher
Summary: Tiling launcher for external displays and cover screens
Description: |-
    DroidOS Launcher is a FOSS launcher module focused on windowed multitasking
    workflows on Android (external displays, AR displays, and cover screens).

    Features include:
    - Queue-based launching workflows
    - Multi-window tiling layouts (where supported by the device/configuration)
    - Companion integration with DroidOS Trackpad for input workflows

    Documentation and source:
    https://github.com/Katsuyamaki/DroidOS

