Builds:
  - versionName: 1.0.0
    versionCode: 1
    commit: v1.0.0
    subdir: app
    gradle:
      - yes
    prebuild: |
      echo "$FDROID_KEYSTORE_BASE64" | base64 -d > release.keystore
      export KEYSTORE_PATH="release.keystore"
      export KEYSTORE_PASSWORD="$FDROID_KEYSTORE_PASSWORD"
      export KEY_ALIAS="key0"
      export KEY_PASSWORD="$FDROID_KEY_PASSWORD"
    scandelete:
      - app/release.keystore
    rm:
      - release.keystore

