Builds:
  - versionName: 1.0.0
    versionCode: 1
    commit: v1.0.0
    subdir: app
    gradle:
      - yes
    prebuild: |
      mkdir -p $HOME/.android
      echo "$FDROID_KEYSTORE_BASE64" | base64 -d > $HOME/.android/release.keystore
      echo "KEYSTORE_PATH=$HOME/.android/release.keystore" >> gradle.properties
      echo "KEYSTORE_PASSWORD=$FDROID_KEYSTORE_PASSWORD" >> gradle.properties
      echo "KEY_ALIAS=key0" >> gradle.properties
      echo "KEY_PASSWORD=$FDROID_KEY_PASSWORD" >> gradle.properties
    scandelete:
      - $HOME/.android/release.keystore

