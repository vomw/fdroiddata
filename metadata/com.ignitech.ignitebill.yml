Categories:
  - Finance Manager
  - Timer
License: MIT
AutoName: IgniteBill
RepoType: git
Repo: https://github.com/DThrawn/ignitebill
SourceCode: https://github.com/DThrawn/ignitebill
IssueTracker: https://github.com/DThrawn/ignitebill/issues
Changelog: https://github.com/DThrawn/ignitebill/releases

CurrentVersion: 1.0.7
CurrentVersionCode: 1

Builds:
  - versionName: 1.0.7
    versionCode: 1
    commit: v1.0.7
    subdir: android
    srclibs:
      - flutter@3.19.6
    output: build/app/outputs/flutter-apk/app-release.apk
    prebuild:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get
    scandelete:
      - .pub-cache
    build:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter build apk --release

Summary: Suivi de temps et facturation hors-ligne
Description: |-
  IgniteBill est un utilitaire de suivi de temps hors-ligne pour freelances.
  Il permet de gérer des projets, suivre des sessions et générer des rapports.
  L'application fonctionne sans compte et sans connexion obligatoire.