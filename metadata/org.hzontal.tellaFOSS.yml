  - versionName: 2.20.0
    versionCode: 229
    commit: 768ac2fde706ce15994cca5bfb8349dfedd92dda
    subdir: mobile
    gradle:
      - fdroid
    output: build/outputs/apk/fdroid/release/mobile-fdroid-universal-release*.apk
    srclibs:
      - reproducible-apk-tools@v0.3.0
    prebuild:
      - perl -ni -e 'print unless /firebase|crashlytics|com\.google\.gms/' ../build.gradle
      - perl -ni -e 'print unless /firebase|crashlytics|com\.google\.gms/ && !/\.contains\(/
        && !/ENABLE_CRASHLYTICS/' build.gradle
      - if [ -d src/main/assets ]; then find src/main/assets -type f \( -name '*.json'
        -o -name '*.properties' \) -exec perl -0777 -pi -e 's/\r\n/\n/g' {} +; fi
    gradleprops:
      - fdroid
    postbuild:
      - $$reproducible-apk-tools$$/inplace-fix.py --page-size 16 sort-baseline $$OUT$$
        --apk
      - $$reproducible-apk-tools$$/inplace-fix.py --page-size 16 fix-pg-map-id $$OUT$$
        '381d455'
      - $$reproducible-apk-tools$$/inplace-fix.py --page-size 16 fix-newlines $$OUT$$
        --from-crlf 'META-INF/services/*'

