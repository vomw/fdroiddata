Summary: Decentralized privacy-first navigation

Description: |
  Roadstr is an open-source navigation app for privacy-conscious users.

  Features:
  • Turn-by-turn navigation (OpenStreetMap + OSRM)
  • Community road alerts via Nostr protocol
  • Lightning Network tips for contributors
  • On-device AI voice guidance (Kokoro TTS)
  • No tracking, no accounts, no telemetry

  Open-source, decentralized, self-sovereign navigation.

