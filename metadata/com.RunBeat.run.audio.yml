Auto Name: RunBeat
Summary: BPM-based audio player for runners
Description: |
  RunBeat is a BPM-based audio player made for runners. It synchronizes music
  with running cadence by adjusting tempo without changing pitch, using the
  SoundTouch time-stretching engine. It includes automatic BPM detection
  (aubio), tap-to-beat, cadence matching (default 172 BPM), playlists and CSV
  BPM metadata, offline-first storage (Room), and background playback with
  Bluetooth controls. The app is fully open source under the GPL v3.0 or later
  and collects no data.

