Categories:
  - Internet
  - Messaging
  - Phone & SMS
License: AGPL-3.0-only
AuthorName: Airyz
AuthorWebSite: https://airyz.xyz/
WebSite: https://commet.chat/
SourceCode: https://github.com/commetchat/commet
IssueTracker: https://github.com/commetchat/commet/issues
Translation: https://hosted.weblate.org/projects/commetchat/commet/

AutoName: Commet

RepoType: git
Repo: https://github.com/commetchat/commet.git

Builds:
  - versionName: 0.4.0
    versionCode: 749
    commit: v0.4.0
    subdir: ./commet
    submodules: true
    sudo: sudo apt-get install -y ninja-build libgtk-3-dev libmpv-dev mpv ffmpeg libmimalloc-dev
      cmake clang
    output: build/app/outputs/flutter-apk/app-release.apk
    srclibs:
      - flutter@stable
      - rustup@1.27.1
    rm:
      - commet/ios
      - commet/linux
      - commet/macos
      - commet/test_driver
      - commet/unit_test
      - commet/integration_test
      - commet/web
      - commet/windows
    prebuild:
      - flutterVersion=$(grep -m1 "flutter-version:" ../.github/workflows/release.yml
        | sed -E "s/.*'([^']+)'.*/\1/")
      - '[[ $flutterVersion ]]'
      - git -C $$flutter$$ checkout -f $flutterVersion
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get
      - env PATH=$$flutter$$/bin:$PATH $$flutter$$/bin/cache/dart-sdk/bin/dart run
        scripts/codegen.dart
      - sed -i -e '/core-google-shortcuts/d' .pub-cache/hosted/pub.dev/flutter_shortcuts_new-*/android/build.gradle
    scandelete:
      - commet/.pub-cache
    build:
      - $$rustup$$/rustup-init.sh -y --default-toolchain 1.87.0 --target aarch64-linux-android
      - export PUB_CACHE=$(pwd)/.pub-cache
      - export GIT_HASH=$(git rev-parse HEAD)
      - export TAG=$(git describe --tags --exact-match HEAD)
      - export TIME_MILLISECONDS=$(git --no-pager log -1 --format=%at)000
      - $$flutter$$/bin/flutter build apk --release --dart-define BUILD_MODE=release
        --dart-define PLATFORM=android --dart-define BUILD_DETAIL=fdroid --dart-define
        GIT_HASH=$GIT_HASH --dart-define VERSION_TAG=$TAG --dart-define BUILD_DATE=$TIME_MILLISECONDS

AutoUpdateMode: Version
UpdateCheckMode: Tags v\d+\.\d+\.\d+(?:\+hotfix\.\d+)?$
UpdateCheckData: commet/pubspec.yaml|version:\s.+\+(\d+)|.|version:\s(.+)\+
CurrentVersion: 0.4.0
CurrentVersionCode: 749
