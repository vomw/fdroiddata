Categories:
  - Shopping List
License: GPL-3.0-only
AuthorName: Ákos Lovász
AuthorEmail: lovasz.akos.dev@gmail.com
SourceCode: https://github.com/Fasz-kivan/IsShopping
IssueTracker: https://github.com/Fasz-kivan/IsShopping/issues
Changelog: https://github.com/Fasz-kivan/IsShopping/releases

AutoName: IsShopping

RepoType: git
Repo: https://github.com/Fasz-kivan/IsShopping.git

Binaries: https://github.com/Fasz-kivan/IsShopping/releases/download/v%v/isShopping.apk

Builds:
  - versionName: '2.0.2'
    versionCode: 16
    commit: 71012b810bb7eccc16c668bbdc83b9339768eac9
    submodules: true
    sudo:
      - mkdir -p /upstream/path/isShopping
      - chown -R vagrant /upstream/path
    output: build/app/outputs/flutter-apk/app-release.apk
    srclibs:
      - flutter@stable
    rm:
      - ios
      - linux
      - macos
      - web
      - windows
    prebuild:
      - echo "flutter.sdk=$$flutter$$" >> android/local.properties
      - flutterVersion=$(sed -n -E "s/.*flutter-version:\ '(.*)'/\1/p" .github/workflows/release.yml)
      - '[[ $flutterVersion ]]'
      - git -C $$flutter$$ checkout -f $flutterVersion
      - export repo=/upstream/path/isShopping/isShopping
      - cd ..
      - mv isShopping.app $repo
      - pushd $repo
      - export PUB_CACHE=$(pwd)/.pub-cache
      - .flutter/bin/flutter config --no-analytics
      - .flutter/bin/flutter pub get --enforce-lockfile
      - mv $repo isShopping.app
    scanignore:
      - .flutter/bin/cache
    scandelete:
      - .flutter
      - .pub-cache
    build:
      - export repo=/upstream/path/isShopping/isShopping
      - cd ..
      - mv isShopping.app $repo
      - pushd $repo
      - export PUB_CACHE=$(pwd)/.pub-cache
      - .flutter/bin/flutter build apk --release --split-per-abi --target-platform="android-arm64"
      - mv $repo isShopping.app

AutoUpdateMode: Version
UpdateCheckMode: Tags
VercodeOperation:
  - '%c * 10 + 1'
  - '%c * 10 + 2'
  - '%c * 10 + 3'
UpdateCheckData: pubspec.yaml|version:\s.+\+(\d+)|.|version:\s(.+)\+
CurrentVersion: '2.0.2'
CurrentVersionCode: 16