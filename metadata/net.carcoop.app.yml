Builds:
  - versionName: 1.0.3
    versionCode: 51
    commit: f40996631dafaf6dc99f17cb337bd3d1c7f04fe4
    output: build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
    srclibs:
      - flutter@stable
    prebuild: "flutterVersion=$(tr -d '\\n' < .flutter-version)\n[[ $flutterVersion
      ]]\ngit -C $$flutter$$ checkout -f $flutterVersion\nexport PUB_CACHE=$(pwd)/.pub-cache\n\
      $$flutter$$/bin/flutter config --no-analytics\n$$flutter$$/bin/flutter pub get\n\
      $$flutter$$/bin/dart run build_runner build --delete-conflicting-outputs\nsed
      -i '1i import com.android.build.gradle.internal.api.ApkVariantOutputImpl' android/app/build.gradle\n\
      cat >> android/app/build.gradle <<'EOF'\ndef abiCodes = [\"armeabi-v7a\": 1,
      \"arm64-v8a\": 2, \"x86_64\": 3]\n\nandroid.applicationVariants.configureEach
      { variant ->\n    variant.outputs.each { output ->\n        def abiVersionCode
      = abiCodes[output.filters.find { it.filterType == \"ABI\" }?.identifier]\n \
      \       if (abiVersionCode != null) {\n            (output as ApkVariantOutputImpl).versionCodeOverride
      = variant.versionCode * 10 + abiVersionCode\n        }\n    }\n}\nEOF\n"
    scandelete:
      - .pub-cache
    build:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter pub get
      - $$flutter$$/bin/flutter build apk --release --split-per-abi 
        --target-platform="android-arm"
    ndk: 27.0.12077973

