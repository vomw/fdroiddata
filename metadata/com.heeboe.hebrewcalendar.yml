License: GPL-3.0-only
AuthorName: Greg Nwosu
SourceCode: https://github.com/gregnwosu/hebrew_calendar
IssueTracker: https://github.com/gregnwosu/hebrew_calendar/issues

AutoName: Hebrew Calendar
Description: |
  Hebrew Calendar displays a monthly calendar with lunar moon phases,
  biblical feast days, sabbaths, and new moons based on astronomical
  calculations.

  Features:
  * Moon phase emojis for every day
  * Biblical feast days (Passover, Unleavened Bread, Shavuot, Trumpets, Atonement, Tabernacles, Purim, Hanukkah)
  * Sabbath indicators following the lunar 7-day cycle
  * New moon and New Year (Nisan 1) markers
  * Full KJV scripture references with expandable text
  * Dark theme
  * Completely offline - no internet, no ads, no tracking

RepoType: git
Repo: https://github.com/gregnwosu/hebrew_calendar.git

Builds:
  - versionName: 1.1.1
    versionCode: 3
    commit: c3abe678e1c81f6c0c3290a68088f847e0787921
    subdir: flutter
    output: build/app/outputs/flutter-apk/app-release.apk
    srclibs:
      - flutter@stable
    prebuild:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get
    scandelete:
      - flutter/.pub-cache
    build:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter build apk --release

AutoUpdateMode: None
UpdateCheckMode: None
CurrentVersion: 1.1.1
CurrentVersionCode: 3
