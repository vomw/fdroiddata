MaintainerNotes: |-
  - Real-time audio goes through `flutter_soloud`, which bridges Flutter to
    the SoLoud (C++) engine via Dart FFI.
  - `flutter_soloud` ships precompiled Xiph libraries (Ogg/Vorbis/FLAC/Opus).
    To avoid prebuilt binaries, `fdroid/build.sh` (in this app's own repo)
    compiles them from source via NDK/CMake instead, for all four ABIs,
    since `flutter_soloud`'s Gradle module builds native code for all ABIs
    regardless of which one a given build entry targets.
  - `fdroid/build.sh` also handles picking `android-24` vs `android-21` per
    ABI: Bionic doesn't expose `ftello`/`fseeko` (needed by FLAC) below API
    24 on 32-bit targets (`armeabi-v7a`, `x86`).

