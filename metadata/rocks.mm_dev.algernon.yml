MaintainerNotes: |-
- Real-time audio goes through `flutter_soloud`, which bridges Flutter to
  the SoLoud (C++) engine via Dart FFI.
- `flutter_soloud` ships precompiled Xiph libraries (Ogg/Vorbis/FLAC/Opus)
  per ABI. To avoid prebuilt binaries, the `build:` step clones and
  compiles them from source via NDK/CMake instead.
- Each build entry loops over all four ABIs (not just its target one)
  because `flutter_soloud`'s Gradle module compiles native code for all
  ABIs regardless of `--target-platform` — so all four Xiph library sets
  must exist before Gradle runs, even though only one ABI ends up in that
  split APK.
- `armeabi-v7a` and `x86` (32-bit) need `android-24`; the 64-bit ABIs use
  `android-21` — Bionic only exposes `ftello`/`fseeko` (used by FLAC) at
  API 24+ on 32-bit targets.
.

Builds:
  - versionName: 0.0.9
    versionCode: 11
    commit: bbf468e6a9914a16cb15fb266b10a264f9f56843
    output: build/app/outputs/flutter-apk/app-x86_64-release.apk
    srclibs:
      - flutter@stable
    rm:
      - 000-ASSETS
      - linux
      - macos
      - test
      - web
      - windows
    prebuild:
      - flutterVersion=$(sed -n -E 's/^  flutter:\ "(.*)"/\1/p' pubspec.yaml)
      - '[[ $flutterVersion ]]'
      - git -C $$flutter$$ checkout -f $flutterVersion
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get
    scandelete:
      - .pub-cache
    build:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - TOOLCHAIN=$$NDK$$/build/cmake/android.toolchain.cmake
      - sdkmanager 'cmake;3.22.1'
      - CMAKE=/opt/android-sdk/cmake/3.22.1/bin/cmake
      - NINJA=/opt/android-sdk/cmake/3.22.1/bin/ninja
      - SOLOUD_ANDROID_DIR=$(find $PUB_CACHE/hosted/pub.dev -maxdepth 1 -type d -name
        'flutter_soloud-*')/android
      - for ABI in arm64-v8a armeabi-v7a x86_64 x86; do if [ "$ABI" = "armeabi-v7a"
        ] || [ "$ABI" = "x86" ]; then ANDROID_PLATFORM=android-24; else ANDROID_PLATFORM=android-21;
        fi; LIBS_DIR=$SOLOUD_ANDROID_DIR/libs/$ABI; mkdir -p $LIBS_DIR; rm -rf xiph-src-$ABI
        && mkdir xiph-src-$ABI && cd xiph-src-$ABI; git clone --depth 1 --branch v1.3.5
        https://github.com/xiph/ogg.git; git clone --depth 1 --branch v1.3.7 https://github.com/xiph/vorbis.git;
        git clone --depth 1 --branch 1.4.3 https://github.com/xiph/flac.git; git clone
        --depth 1 --branch v1.4 https://github.com/xiph/opus.git; $CMAKE -S ogg -B
        build-ogg -DCMAKE_TOOLCHAIN_FILE=$TOOLCHAIN -DANDROID_ABI=$ABI -DANDROID_PLATFORM=$ANDROID_PLATFORM
        -DBUILD_SHARED_LIBS=ON -DCMAKE_BUILD_TYPE=Release -G Ninja -DCMAKE_MAKE_PROGRAM=$NINJA
        -DCMAKE_POLICY_DEFAULT_CMP0057=NEW; $CMAKE --build build-ogg -j$(nproc); cp
        build-ogg/libogg.so $LIBS_DIR/; cp build-ogg/include/ogg/config_types.h ogg/include/ogg/config_types.h;
        $CMAKE -S vorbis -B build-vorbis -DCMAKE_TOOLCHAIN_FILE=$TOOLCHAIN -DANDROID_ABI=$ABI
        -DANDROID_PLATFORM=$ANDROID_PLATFORM -DBUILD_SHARED_LIBS=ON -DCMAKE_BUILD_TYPE=Release
        -DOGG_INCLUDE_DIR=$(pwd)/ogg/include -DOGG_LIBRARY=$(pwd)/build-ogg/libogg.so
        -G Ninja -DCMAKE_MAKE_PROGRAM=$NINJA -DCMAKE_POLICY_DEFAULT_CMP0057=NEW; $CMAKE
        --build build-vorbis -j$(nproc); cp build-vorbis/lib/libvorbis.so build-vorbis/lib/libvorbisfile.so
        build-vorbis/lib/libvorbisenc.so $LIBS_DIR/; $CMAKE -S flac -B build-flac
        -DCMAKE_TOOLCHAIN_FILE=$TOOLCHAIN -DANDROID_ABI=$ABI -DANDROID_PLATFORM=$ANDROID_PLATFORM
        -DBUILD_SHARED_LIBS=ON -DCMAKE_BUILD_TYPE=Release -DBUILD_CXXLIBS=OFF -DBUILD_TESTING=OFF
        -DBUILD_PROGRAMS=OFF -DBUILD_EXAMPLES=OFF -DBUILD_DOCS=OFF -DINSTALL_MANPAGES=OFF
        -DOGG_INCLUDE_DIR=$(pwd)/ogg/include -DOGG_LIBRARY=$(pwd)/build-ogg/libogg.so
        -G Ninja -DCMAKE_MAKE_PROGRAM=$NINJA -DCMAKE_POLICY_DEFAULT_CMP0057=NEW; $CMAKE
        --build build-flac --target FLAC -j$(nproc); cp build-flac/src/libFLAC/libFLAC.so
        $LIBS_DIR/; $CMAKE -S opus -B build-opus -DCMAKE_TOOLCHAIN_FILE=$TOOLCHAIN
        -DANDROID_ABI=$ABI -DANDROID_PLATFORM=$ANDROID_PLATFORM -DBUILD_SHARED_LIBS=ON
        -DCMAKE_BUILD_TYPE=Release -G Ninja -DCMAKE_MAKE_PROGRAM=$NINJA -DCMAKE_POLICY_DEFAULT_CMP0057=NEW;
        $CMAKE --build build-opus -j$(nproc); cp build-opus/libopus.so $LIBS_DIR/;
        cd ..; done
      - $$flutter$$/bin/flutter build apk --release --split-per-abi --target-platform="android-x64"
    ndk: 27.0.12077973

