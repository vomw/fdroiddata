Categories:
  - Multimedia
License: GPL-3.0-only
WebSite: https://github.com/AFcoder10/Simple-Lyrics
SourceCode: https://github.com/AFcoder10/Simple-Lyrics
IssueTracker: https://github.com/AFcoder10/Simple-Lyrics/issues

Summary: A minimalist and high-performance lyrics viewer
Description: |-
    Simple Lyrics is a minimalist and high-performance lyrics viewer that 
    integrates seamlessly with your Android media playback.

    Features:
    - Real-time synced lyrics for your currently playing music
    - Immersive UI with dynamic blur backgrounds
    - High-fidelity haptic feedback and 3D Parallax effects
    - Efficient caching for offline lyrics and artwork

RepoType: git
Repo: https://github.com/AFcoder10/Simple-Lyrics

Builds:
  - versionName: 1.0.0
    versionCode: 1
    commit: v1.0.0
    srclibs:
      - flutter@3.19.0
    prebuild:
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get
    gradle:
      - yes

AutoUpdateMode: Version v%v
UpdateCheckMode: Tags
UpdateCheckData: v?[1-9]\d*\.\d+\.\d+
CurrentVersion: 1.0.0
CurrentVersionCode: 1
