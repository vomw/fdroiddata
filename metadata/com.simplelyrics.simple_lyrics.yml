Categories:
  - Multimedia
License: GPL-3.0-only
SourceCode: https://github.com/AFcoder10/Simple-Lyrics
IssueTracker: https://github.com/AFcoder10/Simple-Lyrics/issues

AutoName: Simple Lyrics

RepoType: git
Repo: https://github.com/AFcoder10/Simple-Lyrics.git

Builds:
  - versionName: 1.0.8
    versionCode: 9
    commit: 4e96fefe23c70c91f27e84c214b257e7fe0798d0
    subdir: android/app
    output: build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
    srclibs:
      - flutter@stable
    prebuild:
      - flutterVersion=$(sed -n -E "s/.*f-droid-flutter:\s*(.*)/\1/p" pubspec.yaml)
      - '[[ $flutterVersion ]]'
      - git -C $$flutter$$ checkout -f $flutterVersion
      - D=$$flutter$$/packages/flutter_tools/gradle/src/main
      - P="google\.android\.play"
      - sed -i -e "/$P/d" $D/groovy/flutter.groovy || true
      - sed -i -e "/$P/d" $D/kotlin/flutter.gradle.kts || true
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get
    scandelete:
      - .pub-cache
    build:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter build apk --release --split-per-abi
    gradle:
      - yes
    vclibs:
      - armeabi-v7a
    vercodeOperation: "%c * 10 + 1"

