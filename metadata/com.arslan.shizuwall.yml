Categories:
  - Internet
  - Security
License: GPL-3.0-only
SourceCode: https://github.com/AhmetCanArslan/ShizuWall
IssueTracker: https://github.com/AhmetCanArslan/ShizuWall/issues
Summary: No Root/VPN Firewall Solution
Description: |
  Lightweight no root, no vpn firewall solution powered by Shizuku.

RepoType: git
Repo: https://github.com/AhmetCanArslan/ShizuWall.git

AutoUpdateMode: Version
UpdateCheckMode: Tags

Builds:
  - versionName: "4.0"
    versionCode: 22
    commit: v4.0
    subdir: app
    gradle: yes

    prebuild: |
      # make script executable
      chmod +x scripts/compile_daemon.sh

      # change SDK_PATH to use ANDROID_HOME environment variable
      sed -i "s|^SDK_PATH=.*|SDK_PATH=\$ANDROID_HOME|g" scripts/compile_daemon.sh
      # find latest build tools version and write to script
      LATEST_BT=$(ls -1 $ANDROID_HOME/build-tools/ | sort -V | tail -n 1)
      sed -i "s|^BUILD_TOOLS_VER=.*|BUILD_TOOLS_VER=\"$LATEST_BT\"|g" scripts/compile_daemon.sh
      # find latest platform version and write to script
      LATEST_PLAT=$(ls -1 $ANDROID_HOME/platforms/ | sort -V | tail -n 1 | sed 's/android-//')
      sed -i "s|^PLATFORM_VER=.*|PLATFORM_VER=\"$LATEST_PLAT\"|g" scripts/compile_daemon.sh
      # Call the script from the root directory (because the script contains 'app/src' paths)
      ./scripts/compile_daemon.sh
