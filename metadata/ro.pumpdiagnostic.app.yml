AutoName: Pump Diagnostic

Description: |-
  Pump Diagnostic is a tool for analyzing the efficiency of centrifugal
  pumps used in water and wastewater systems.

  Features:
  * Variable speed (VFD) pump diagnostics with efficiency curves
  * Constant speed pump diagnostics
  * NPSH (Net Positive Suction Head) analysis
  * Head, flow, power and efficiency calculations
  * QR code scanning for pump data input
  * Bilingual interface (Romanian / English)
  * Dark and light theme support
  * Works fully offline after first load

  The app reads standard pump test data files (config.dat, Qh.dat, Qe.dat,
  Qp.dat, QNPSHr.dat) and generates diagnostic reports with interactive
  charts comparing measured operating points against manufacturer curves.

  Developed at Universitatea Politehnica Timișoara (UPT).

