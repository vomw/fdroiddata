Categories:
  - Security
  - System
License: MIT
AuthorName: Priyanshu
SourceCode: https://github.com/Priyanshu-5257/keepme-away
IssueTracker: https://github.com/Priyanshu-5257/keepme-away/issues

AutoName: KeepMe Away

RepoType: git
Repo: https://github.com/Priyanshu-5257/keepme-away.git

Builds:
  - versionName: 1.0.0
    versionCode: 1
    commit: v1.0.0
    subdir: .
    output: build/app/outputs/flutter-apk/app-release.apk
    srclibs:
      - flutter@3.27.4
    rm:
      - ios
      - test
    prebuild: sed -i -e '/signingConfigs/,/}/d' -e '/signingConfig/d' android/app/build.gradle.kts
    build:
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get
      - $$flutter$$/bin/flutter build apk --release --no-tree-shake-icons

AutoUpdateMode: None
UpdateCheckMode: None
CurrentVersion: 1.0.0
CurrentVersionCode: 1
