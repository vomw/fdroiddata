License: MIT
AuthorName: Priyanshu
SourceCode: https://github.com/Priyanshu-5257/keepme-away
IssueTracker: https://github.com/Priyanshu-5257/keepme-away/issues

AutoName: KeepMe Away

RepoType: git
Repo: https://github.com/Priyanshu-5257/keepme-away.git

Builds:
  - versionName: 1.0.0
    versionCode: 1
    commit: v1.0.0
    output: build/app/outputs/flutter-apk/app-release.apk
    srclibs:
      - flutter@stable
    rm:
      - ios
    build:
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get
      - $$flutter$$/bin/flutter build apk --release

AutoUpdateMode: None
UpdateCheckMode: None
CurrentVersion: 1.0.0
CurrentVersionCode: 1
