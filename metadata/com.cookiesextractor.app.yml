AutoName: Cookie Extractor

Summary: Extract your own session cookies after a manual login

Description: |
  A developer tool for inspecting and verifying session information.

  Headless automation is increasingly blocked by 2FA QR codes, interactive
  challenges, and anti-bot flows. This app takes the other road: you log in
  by hand, exactly like in a normal browser, then one tap pulls the session
  cookies for the loaded domain and hands them to the Android share sheet,
  ready for curl, wget, or any script that needs an authenticated session.

  Non-http OAuth redirects are caught before an error page appears and
  shared as one line, so relays cannot corrupt the authorization code. A
  share template with live preview shapes the shared text with placeholders
  for payload, URL, title, host, and date. Bookmarks keep the entry URL you
  typed, not where the redirect landed. A session monitor raises a native
  notification when your own gateway reports a dead login. An opt-in,
  token-gated debug channel exposes a versioned agent API (/api/v1) to
  drive the app programmatically; off by default.

  It reads only the cookies of its own WebView through the public
  CookieManager API: no root, no cross-app access, no automation of other
  apps. Extracted cookies are session credentials; share them only over
  channels you trust.

