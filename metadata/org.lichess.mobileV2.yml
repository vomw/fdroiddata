Builds:
  - versionName: 0.22.3
    versionCode: 2203
    commit: 88afd11ae58474e2e079979bc56d62ce358b3bb1
    output: build/app/outputs/flutter-apk/app-release.apk
    srclibs:
      - flutter@stable
    rm:
      - ios
      - linux
    prebuild:
      - flutterVersion=$(grep 'flutter:' flutter-version.yaml | sed 's/^\s*flutter:\s//')
      - git -C $$flutter$$ switch --detach $flutterVersion
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get
      - $$flutter$$/bin/dart run build_runner build
    scandelete:
      - .dart_tool
    build: $$flutter$$/bin/flutter build apk --dart-define=cronetHttpNoPlay=true --dart-define=LICHESS_HOST=lichess.org
      --dart-define=LICHESS_WS_HOST=socket.lichess.org --dart-define=LICHESS_WS_SECRET=wG1OLhUR3CSXdDybqrtIW227QGrtiM3d
    ndk: 28.2.13676358

AutoUpdateMode: Version
UpdateCheckMode: Tags .*fdroid
UpdateCheckData: pubspec.yaml|version:\s.+\+(\d+)|.|version:\s(.+)\+
