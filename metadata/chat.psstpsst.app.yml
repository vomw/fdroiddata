Builds:
  - versionName: 26.9.1
    versionCode: 7
    commit: 474d471a3106c593e7cfbd26465415864a0c6dba
    sudo:
      - echo 'deb https://deb.debian.org/debian bookworm main' > /etc/apt/sources.list.d/psstpsst-bookworm.list
      - echo 'deb https://security.debian.org/debian-security bookworm-security main'
        >> /etc/apt/sources.list.d/psstpsst-bookworm.list
      - apt-get update
      - apt-get install -y openjdk-17-jdk-headless ca-certificates
      - test "$(dpkg-query -W -f='${Version}' openjdk-17-jdk-headless)" = '17.0.20.1+1-1~deb12u1'
      - echo 'deb https://deb.debian.org/debian forky main' > /etc/apt/sources.list.d/psstpsst-forky.list
      - apt-get update
      - apt-get install -y -t forky nodejs npm
    init:
      - export JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64
      - export PATH=$JAVA_HOME/bin:$PATH
      - sdkmanager --sdk_root="$$SDK$$" 'platforms;android-36' 'build-tools;35.0.0'
        'build-tools;36.0.0' 'cmake;3.22.1' 'ndk;27.0.12077973'
      - CI=1 NODE_ENV=production ELECTRON_SKIP_BINARY_DOWNLOAD=1 npm ci --include=dev
        --ignore-scripts
      - CI=1 NODE_ENV=production npm run postinstall
      - node -e 'const fs=require("fs");const p=require("./package.json");p.expo.autolinking.android.buildFromSource=[".*"];fs.writeFileSync("package.json",JSON.stringify(p,null,2)+"\n")'
      - find node_modules -type d -name local-maven-repo -prune -exec rm -rf {} +
      - echo 'b5796fa7a2de78499e81ec2b2b7aa2ad25f3702d61daaed2ddb7c23757e98b49  node_modules/expo/template.tgz'
        | sha256sum -c -
      - CI=1 NODE_ENV=production npm run android:prebuild -- --template ./node_modules/expo/template.tgz
      - sed -i '/signingConfig signingConfigs.debug/d' android/app/build.gradle
      - rm android/app/debug.keystore
    output: android/app/build/outputs/apk/release/app-release-unsigned.apk
    scanignore:
      - node_modules/hermes-compiler/hermesc/linux64-bin/hermesc
      - node_modules/react-native/ReactAndroid/publish.gradle
      - node_modules/expo-modules-core/android/ExpoModulesCorePlugin.gradle
      - node_modules/@react-native-masked-view/masked-view/android/build.gradle
      - node_modules/react-native-get-random-values/android/build.gradle
      - node_modules/react-native-keyboard-controller/android/build.gradle
      - node_modules/react-native-safe-area-context/android/build.gradle
      - node_modules/react-native-screens/android/build.gradle
      - node_modules/react-native-svg/android/build.gradle
      - node_modules/react-native-view-shot/android/build.gradle
    scandelete:
      - node_modules
    build:
      - export JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64
      - export PATH=$JAVA_HOME/bin:$PATH
      - (cd android && EXPO_PUBLIC_APP_ENV=production gradle :app:dependencies --configuration
        releaseRuntimeClasspath --console=plain -PreactNativeDevServerIp=127.0.0.1)
        > android-dependencies.txt
      - node scripts/check-android-dependencies.mjs android-dependencies.txt
      - (cd android && CI=1 NODE_ENV=production EXPO_PUBLIC_APP_ENV=production gradle
        :app:assembleRelease --no-daemon --max-workers=2 -PreactNativeDevServerIp=127.0.0.1)
      - python3 scripts/check-android-apk.py android/app/build/outputs/apk/release/app-release-unsigned.apk
    ndk: 27.1.12297006

AllowedAPKSigningKeys: 7c527f9acbcc7aee588c9c44acbe9880dc698460e8e974a646c67e8fb8342cc0

