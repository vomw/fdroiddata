IssueTracker: https://codeberg.org/janfkennedy/FediPress/issues

RepoType: git
Repo: https://codeberg.org/janfkennedy/FediPress

Builds:
  - versionName: '1.0'
    versionCode: 1
    commit: v1.0
    sudo:
      - apt-get update
      - apt-get install -y nodejs npm
    prebuild:
      - cd ..
      - npm install
      - npm run build
      - npx cap sync android
      - rm -rf node_modules/@capacitor/cli/assets
      - cd android
    subdir: android/app/build/outputs/apk/release
    gradle:
      - yes

AutoUpdateMode: Version
UpdateCheckMode: Tags
