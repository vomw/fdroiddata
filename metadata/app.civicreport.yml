Name: Civic Report
Summary: Anonymous civic-issue reporting with on-device photo scrubbing
Description: |-
  Civic Report is an anonymous reporting app for everyday civic issues: potholes, uncollected garbage, mismanagement.

  Privacy by design: photos are analyzed on your device — faces, license plates and text are blurred before anything leaves the phone. No raw photo ever reaches the server. No account, no e-mail, no phone number; your identity is a mnemonic generated and stored only on your device. Every submission is Ed25519-signed and protected by proof-of-work against spam.

  Community review: volunteer reviewers (open enrollment) vote on submissions with a weighted consensus before anything is published. Published reports live on an OpenStreetMap-based map and feed, and automatically expire after one year.

  This app talks to the official Civic Report server. The server is free software (AGPL-3.0-only); you can run your own instance and rebuild the app against it.

RepoType: git
Repo: https://gitlab.com/civic-report/civic-report.git

Builds:
  - versionName: '1.0.0'
    versionCode: 1
    commit: v1.0.0
    subdir: app
    srclibs:
      - flutter@3.44.2
    prebuild:
      - echo "flutter.sdk=$$flutter$$" >> android/local.properties
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get
    build:
      - $$flutter$$/bin/flutter build apk --release --dart-define=API_BASE=https://api.civicreport.app
    output: build/app/outputs/flutter-apk/app-release.apk

AutoUpdateMode: Version v%v
UpdateCheckMode: Tags ^v[\d.]+$
CurrentVersion: '1.0.0'
CurrentVersionCode: 1
