Repo: https://github.com/geograms/geogram.git

Builds:
  - versionName: 1.6.99
    versionCode: 2
    commit: v1.6.99
    output: build/app/outputs/flutter-apk/app-release.apk
    srclibs:
      - flutter@3.38.5
    rm:
      - ios
      - macos
      - windows
      - linux
      - web
      - geogram-cli
      - bin
      - android/tinyemu
      - android/app/src/main/jniLibs
      - third_party/flutter_webrtc/third_party/libwebrtc/lib
    prebuild:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - sed -i -e '/tinyemu/d' -e '/flutter_map_tile_caching/d' pubspec.yaml
      - sed -i -e "/import 'package:flutter_map_tile_caching/d" -e 's/fmtc\.FMTCStore?/Object?/g'
        -e '/FMTCObjectBoxBackend/,/);/d' -e '/_tileStore = fmtc\./d' -e '/_tileStore!\.manage/d'
        lib/services/map_tile_service.dart
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get
      - cd $PUB_CACHE/hosted/pub.dev/geolocator_android-*/android
      - sed -i -e '/gms/d' build.gradle
      - cd src/main/java/com/baseflow/geolocator/location
      - rm FusedLocationClient.java
      - sed -i -e '/if (forceAndroidLocationManager) {/,/^  }/c return new LocationManagerClient(context,
        locationOptions);}' -e '/isGooglePlayServicesAvailable/,/^  }/d' -e '/gms/d'
        GeolocationManager.java
    scandelete:
      - .pub-cache
    build:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter build apk --release
      - cd build/app/outputs/flutter-apk && python3 -c "import zipfile,shutil;
        z=zipfile.ZipFile('app-release.apk','r');
        items=[(i,z.read(i.filename)) for i in z.infolist() if not i.filename.startswith('com/google/android/play/core/')];
        z.close();
        z=zipfile.ZipFile('clean.apk','w',zipfile.ZIP_DEFLATED);
        [z.writestr(i,d) for i,d in items];
        z.close();
        shutil.move('clean.apk','app-release.apk')"

AutoUpdateMode: None
UpdateCheckMode: None
CurrentVersion: 1.6.99
CurrentVersionCode: 2
