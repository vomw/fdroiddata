AuthorWebSite: https://geogram.radio
SourceCode: https://github.com/geograms/geogram
IssueTracker: https://github.com/geograms/geogram/issues
Changelog: https://github.com/geograms/geogram/releases

AutoName: Geogram

RepoType: git
Repo: https://github.com/geograms/geogram.git

Builds:
  - versionName: 1.6.91
    versionCode: 1
    commit: v1.6.91
    output: build/app/outputs/flutter-apk/app-release.apk
    srclibs:
      - flutter@3.38.5
    rm:
      - ios
      - macos
      - windows
      - linux
      - web
      - geogram-cli
      - bin
      - android/tinyemu
      - android/app/src/main/jniLibs
      - third_party/flutter_webrtc/third_party/libwebrtc/lib
    prebuild:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - sed -i -e '/tinyemu/d' pubspec.yaml
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get
      - cd $PUB_CACHE/hosted/pub.dev/geolocator_android-*/android
      - sed -i -e '/gms/d' build.gradle
      - cd src/main/java/com/baseflow/geolocator/location
      - rm FusedLocationClient.java
      - sed -i -e '/if (forceAndroidLocationManager) {/,/^  }/c return new LocationManagerClient(context,
        locationOptions);}' -e '/isGooglePlayServicesAvailable/,/^  }/d' -e '/gms/d'
        GeolocationManager.java
    scandelete:
      - .pub-cache
    build:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter build apk --release

AutoUpdateMode: None
UpdateCheckMode: None
CurrentVersion: 1.6.91
CurrentVersionCode: 1
