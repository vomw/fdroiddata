Categories:
  - Connectivity
  - Internet
License: Apache-2.0
AuthorName: Geogram
AuthorEmail: brito_pt@pm.me
AuthorWebSite: https://geogram.radio
SourceCode: https://github.com/geograms/geogram
IssueTracker: https://github.com/geograms/geogram/issues
Changelog: https://github.com/geograms/geogram/releases

AutoName: Geogram

RepoType: git
Repo: https://github.com/geograms/geogram.git

Builds:
  - versionName: 1.6.95
    versionCode: 1
    commit: v1.6.95
    output: build/app/outputs/flutter-apk/app-release.apk
    srclibs:
      - flutter@3.38.5
    rm:
      - ios
      - macos
      - windows
      - linux
      - web
      - geogram-cli
      - bin
      - android/tinyemu
      - android/app/src/main/jniLibs
      - third_party/flutter_webrtc/third_party/libwebrtc/lib
    prebuild:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get
    scandelete:
      - .pub-cache
    build:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter build apk --release

AutoUpdateMode: Version
UpdateCheckMode: Tags ^v.*$
UpdateCheckData: pubspec.yaml|version:\s.+\+(\d+)|.|version:\s(.+)\+
CurrentVersion: 1.6.95
CurrentVersionCode: 1
