# No AntiFeatures. This app's default button mappings launch a few
# specific third-party apps by package name for convenience (jumping
# straight to a launcher, a video app, etc.) -- as of this version, all
# of them are themselves FOSS (MX3 Launcher, the F-Droid build of
# SmartTube specifically -- package name app.smarttube.fdroid, distinct
# from its separate non-free Play Store build -- and TV Bro). None are
# bundled or a build dependency either way; if a mapped target isn't
# installed, the mapping is simply a no-op. See README.md's button
# mapping table for the full, current list.
