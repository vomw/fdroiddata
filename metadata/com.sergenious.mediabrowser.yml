Summary: Directory-based photo and video browser
Description: |-
    Media Browser allows listing and viewing images and videos through 
    physical directories (folders). Unlike standard gallery apps that 
    force a flat date-sorted view, this app respects your folder 
    hierarchy and file naming, making it ideal for organized travelers 
    and power users.

