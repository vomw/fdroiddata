AutoName: PromptPaste
Summary: Correct, rewrite, and transform selected text with your preferred AI provider
Description: |-
  PromptPaste helps you correct, rewrite, transform, and run custom actions on
  selected text from Android apps.

  Features:
  * Correct spelling, grammar, punctuation, and clarity
  * Create reusable custom actions with prompts and variables
  * Select a provider, model, and token limits for individual actions
  * Review and edit generated text before replacing the selection
  * Use Android text-selection actions or the optional PromptPaste keyboard
  * Use a self-hosted Ollama server or supported cloud providers

  PromptPaste has no analytics, telemetry, accessibility service, or background
  clipboard monitoring. API keys are stored locally using Android Keystore. Text
  is sent only after the user explicitly runs an action.

  Cloud AI providers are proprietary third-party network services. Users can
  instead connect PromptPaste to a self-hosted Ollama server.

