AntiFeatures:
  NonFreeNet:
    en-US: Fetches default-enabled ad-blocking filter lists from easylist.to, pgl.yoyo.org,
      and filters.adtidy.org on cold start and uses Google as default search engine.
Categories:
  - Browser
  - Download
License: GPL-3.0-only
AuthorName: Ahjie521
AuthorEmail: xianspired@gmail.com
SourceCode: https://github.com/52191314/Aurora_Download_Manager
IssueTracker: https://github.com/52191314/Aurora_Download_Manager/issues
Donate: https://ahjie521.store/donation

AutoName: Aurora Download Manager
Description: |-
  Aurora Download Manager (Optimus) is an open-source download manager for Android featuring multi-threaded downloads, native ad-blocking, and media sniffing.

  Note: Aurora Download Manager is an independent open-source project and is not affiliated with Aurora OSS, Aurora Store, or Aurora Droid.

RepoType: git
Repo: https://github.com/52191314/Aurora_Download_Manager.git

Builds:
  - versionName: 1.3.2
    versionCode: 811
    commit: v1.3.2
    sudo:
      - mkdir -p /upstream/path
      - chown -R vagrant /upstream/path
    output: build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
    binary: 
      https://github.com/52191314/Aurora_Download_Manager/releases/download/v%v/aurora-downloader-v%v-armeabi-v7a.apk
    srclibs:
      - reproducible-apk-tools@v0.3.0
      - flutter@stable
    rm:
      - ios
    prebuild:
      - flutterVersion=$(sed -n -E "s/.*flutter-version:\ '(.*)'/\1/p" .github/workflows/release.yml)
      - '[[ $flutterVersion ]]'
      - git -C $$flutter$$ checkout -f $flutterVersion
      - export repo=/upstream/path/aurora-downloader
      - cd ..
      - mv com.personal.aurora_downloader $repo
      - pushd $repo
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get --enforce-lockfile
      - bash tooling/strip_engine_playcore.sh $$flutter$$
      - popd
      - mv $repo com.personal.aurora_downloader
    scandelete:
      - .pub-cache
    build:
      - export repo=/upstream/path/aurora-downloader
      - cd ..
      - mv com.personal.aurora_downloader $repo
      - pushd $repo
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter build apk --release --split-per-abi --target-platform="android-arm"
        --dart-define=AURORA_BUILD_CHANNEL=fdroid
      - popd
      - mv $repo com.personal.aurora_downloader
    ndk: r28c
    postbuild:
      - mv $$OUT$$ unaligned.apk
      - $$reproducible-apk-tools$$/zipalign.py --page-size 16 --pad-like-apksigner
        --replace unaligned.apk $$OUT$$

