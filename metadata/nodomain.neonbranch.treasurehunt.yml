Name: TreasureHunt
AutoName: false
Summary: Treasure hunting in your surroundings
Description: |
  This is an outdoor app that will let you or somebody you like experience a treasure hunt.
  Define waypoints in your area, then explore those waypoints and solve riddles, until you reach the final stage.

Categories:
  - Games
  - Sports & Health

