AuthorWebSite: https://codeberg.org/neonbranch
WebSite: https://codeberg.org/neonbranch/treasurehunt
SourceCode: https://codeberg.org/neonbranch/treasurehunt
IssueTracker: https://codeberg.org/neonbranch/treasurehunt/issues
Changelog: https://codeberg.org/neonbranch/treasurehunt/releases

Name: TreasureHunt
AutoName: Treasure Hunt

RepoType: git
Repo: https://codeberg.org/neonbranch/treasurehunt.git

Builds:
  - versionName: 0.6.3
    versionCode: 2080
    commit: 313b4e2012b8a9c69563c3f8da94907b1edac23d
    output: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
    srclibs:
      - flutter@stable
    rm:
      - web
    prebuild:
      - flutterVersion=$(sed -n -E "s/^\s+flutter:\s*([0-9.]+)/\1/p" pubspec.yaml)
      - '[[ $flutterVersion ]]'
      - git -C $$flutter$$ checkout -f $flutterVersion
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get --enforce-lockfile
    scandelete:
      - .pub-cache
    build:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter build apk --release --split-per-abi --target-platform=android-arm64

AutoUpdateMode: Version
UpdateCheckMode: Tags ^v[\d.]+$
VercodeOperation:
  - '%c + 2000'
UpdateCheckData: pubspec.yaml|version:\s.+\+(\d+)|.|version:\s(.+)\+
CurrentVersion: 0.6.3
CurrentVersionCode: 2080
