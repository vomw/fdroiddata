  - versionName: 0.0.0
    versionCode: 0
    commit: HEAD
    subdir: .
    gradle:
      - yes

AutoUpdateMode: Version
UpdateCheckMode: Tags
UpdateCheckData: ^v(\d+\.\d+\.\d+)$