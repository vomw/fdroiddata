Builds:
  - versionName: 0.1.1
    versionCode: 21
    commit: 3e19c96bd62d2c1de6e0b18966f83802f6fb68cf
    subdir: apps/flutter
    output: build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
    binary: 
      https://github.com/by-architect/KarakeepMobile/releases/download/v%v/linkstow-%v-armeabi-v7a.apk
    srclibs:
      - flutter@stable
    rm:
      - apps/flutter/ios
    prebuild:
      - flutterVersion=$(sed -n -E 's/.*"flutter"[[:space:]]*:[[:space:]]*"([^"]+)".*/\1/p'
        .fvmrc)
      - '[[ $flutterVersion ]]'
      - git -C $$flutter$$ checkout -f $flutterVersion
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get --enforce-lockfile
    scandelete:
      - apps/flutter/.pub-cache
    build:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter build apk --release --split-per-abi --target-platform=android-arm

