# Metadata for MyRepertoirApp
Categories:
  - Multimedia
License: 'Apache-2.0'
WebSite: https://github.com/Adithya-Jayan/MyRepertoirApp
SourceCode: https://github.com/Adithya-Jayan/MyRepertoirApp
IssueTracker: https://github.com/Adithya-Jayan/MyRepertoirApp/issues

AutoName: Repertoire
Description: |
  An open-source app to help musicians keep track of their repertoire.

  Features:
  * Add and categorize songs
  * Track practice sessions
  * Easy-to-use interface for managing your music list

RepoType: git
Repo: https://github.com/Adithya-Jayan/MyRepertoirApp.git

# This section tells F-Droid how to check for new versions automatically
AutoUpdateMode: Version %v
UpdateCheckMode: Tags
CurrentVersion: 3.1.0       # The version name from your pubspec.yaml
CurrentVersionCode: 1       # The version code from your pubspec.yaml

# This is the build recipe itself
Builds:
  - Version: 3.1.0           # The version name from your pubspec.yaml
    VersionCode: 1           # The version code from your pubspec.yaml
    Commit: v3.1.0           # The git tag you created in Step 1
    Subdirectory: .           # Your flutter project is in the root
    Flavor: fdroid

    # Specify the SDK and Flutter version needed to build your app
    # Find your exact Flutter version by running 'flutter --version'
    BuildSystem: flutter
    Flutter: 3.32.5 # <-- IMPORTANT: Use your exact Flutter version!

    BuildCommand: flutter build apk --flavor fdroid --release --split-per-abi

    # Path to the generated APK files
    # The V=1 tells F-Droid there is one APK for each architecture
    AppOutput: build/app/outputs/apk/fdroid/release/app-fdroid-*.apk