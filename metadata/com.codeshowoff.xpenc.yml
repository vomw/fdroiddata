Categories:
  - Finance Manager
License: MIT
WebSite: https://github.com/CodeShowOff/XPENC
SourceCode: https://github.com/CodeShowOff/XPENC
IssueTracker: https://github.com/CodeShowOff/XPENC/issues
AuthorName: CodeShowOff

AutoName: XPENC
RepoType: git
Repo: https://github.com/CodeShowOff/XPENC.git

AutoUpdateMode: Version
UpdateCheckMode: Tags

Builds:
  - versionName: 1.0.1
    versionCode: 11
    commit: v1.0.1
    output: build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
    srclibs:
      - flutter@stable
    prebuild:
      - export flutterVersion=$(sed -n -E "s/.*revision:\ \"(.*)\"/\1/p" .metadata)
      - '[[ $flutterVersion ]]'
      - git -C flutter checkout -f $flutterVersion
      - export PUB_CACHE=$(pwd)/.pub-cache
      - flutter/bin/flutter config --no-analytics
      - flutter/bin/flutter pub get --enforce-lockfile
    build:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - flutter/bin/flutter build apk --release --split-per-abi --target-platform=android-arm
    scandelete:
      - .pub-cache

  - versionName: 1.0.1
    versionCode: 12
