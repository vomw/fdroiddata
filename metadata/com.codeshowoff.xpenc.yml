AutoName: XPENC

RepoType: git
Repo: https://github.com/CodeShowOff/XPENC.git

Builds:
  - versionName: 1.0.1
    versionCode: 131
    commit: 351f585316258769660941297b16693f05e231da
    output: build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
    srclibs:
      - flutter@stable
    prebuild:
      - flutterVersion=$(sed -n -E "s/.*flutter-version:\ '([0-9][^']*)'/\1/p" .github/workflows/release.yml)
      - '[[ $flutterVersion ]]'
      - git -C $$flutter$$ checkout -f $flutterVersion
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get --enforce-lockfile
      - curl -L "https://raw.githubusercontent.com/QuisApp/flutter_contacts/v2.3.1/android/build.gradle" -o .pub-cache/hosted/pub.dev/flutter_contacts-2.1.0/android/build.gradle
    scandelete:
      - .pub-cache
    build:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter build apk --release --split-per-abi --target-platform=android-arm

