License: MIT
AuthorName: CodeShowOff
WebSite: https://github.com/CodeShowOff/XPENC
SourceCode: https://github.com/CodeShowOff/XPENC
IssueTracker: https://github.com/CodeShowOff/XPENC/issues

AutoName: XPENC

RepoType: git
Repo: https://github.com/CodeShowOff/XPENC.git

Builds:
  - versionName: 1.0.2
    versionCode: 141
    commit: v1.0.2
    output: build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
    srclibs:
      - flutter@stable
    prebuild:
      - flutterVersion=$(sed -n -E "s/.*flutter-version:\ '([0-9][^']*)'/\1/p" .github/workflows/release.yml)
      - '[[ $flutterVersion ]]'
      - git -C $$flutter$$ checkout -f $flutterVersion
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get --enforce-lockfile
    scandelete:
      - .pub-cache
    build:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter build apk --release --split-per-abi --target-platform=android-arm

  - versionName: 1.0.2
    versionCode: 142
    commit: v1.0.2
    output: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
    srclibs:
      - flutter@stable
    prebuild:
      - flutterVersion=$(sed -n -E "s/.*flutter-version:\ '([0-9][^']*)'/\1/p" .github/workflows/release.yml)
