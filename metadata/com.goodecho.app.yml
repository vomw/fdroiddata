AutoName: good-echo
Description: |-
  Continuously record audio for retrieval at a later time.
  Unless saved, recordings are deleted on a rolling basis.

  * record harassment and bullying (even when you didn't anticipated them)
  * save important pieces of information (phone numbers, passwords, instructions)
  * record cute/funny moments
  * prove that someone said (or didn't say) something

  This is a fork of Echo by Marek Rogalski (mafik), with Opus encoding,
  compressed in-memory history, and UI refinements.

