AutoName: Marlin
Description: |-
    Marlin is a marine species identification and life-list app for fish and
    marine life. Spot something while diving or beachcombing, look it up against
    iNaturalist's observation data, and log it to your personal life list with a
    photo, notes, and a pinned location. No account, no tracking, no ads —
    everything stays on your device with optional Android Auto Backup.

RepoType: git
Repo: https://github.com/fwille/marlin.git

Builds:
  - versionName: 1.0.0
    versionCode: 1
    commit: v1.0.0
    # Modeled on org.jitsi.meet (a React Native app already built by F-Droid's
    # infra), which proves `fdroid build --on-server` *does* have network access
    # for `curl`/`npm install` during `init` — not the hermetic no-network build
    # I'd assumed going in. Their pattern: fetch a pinned Node.js binary with a
    # checksum, then `npm install`.
    #
    # UNLIKE Jitsi (whose `android/` is checked into their bare-RN repo), this is
    # an Expo CNG project — `android/` doesn't exist in the source tree and is
    # generated on demand by `npx expo prebuild`. A first attempt using the usual
    # declarative `subdir: android` + `gradle: yes` failed immediately with
    # "Missing subdir build/com.marlinid.marlin/android" — fdroidserver resolves
    # (chdirs into) `subdir` *before* running `init`, so it can never see a
    # directory that `init` itself is supposed to create.
    #
    # Fix: skip `subdir`/`gradle` declaration entirely and run a fully manual
    # build instead — `init` generates `android/`, `build` compiles it, `output`
    # tells fdroidserver where the resulting APK glob lands (evaluated from the
    # project root since no `subdir` is set).
    #
    # Node 22.22.3 (current v22 "Jod" LTS as of this writing) — matches this
    # project's "Node.js v22+" requirement. Bump the version + checksum here
    # (from nodejs.org/dist/<version>/SHASUMS256.txt) whenever that moves.
    sudo:
      - apt-get update
      - apt-get install -y curl xz-utils
    init:
      - curl -Lo node.tar.xz https://nodejs.org/dist/v22.22.3/node-v22.22.3-linux-x64.tar.xz
      - echo "2e5d13569282d016861fae7c8f935e741693c269101a5bebcf761a5376d1f99f  node.tar.xz" | sha256sum -c -
      - tar xJf node.tar.xz --strip-components=1 -C /usr/local
      - npm ci
      - npx expo prebuild --platform android --no-install
    build:
      - cd android && ./gradlew assembleRelease
    output: android/app/build/outputs/apk/release/app-release-unsigned.apk
    scandelete:
      - node_modules
      - android

AutoUpdateMode: None
