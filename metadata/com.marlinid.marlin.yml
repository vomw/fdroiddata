AutoName: Marlin
Description: |-
    Marlin is a marine species identification and life-list app for fish and
    marine life. Spot something while diving or beachcombing, look it up against
    iNaturalist's observation data, and log it to your personal life list with a
    photo, notes, and a pinned location. No account, no tracking, no ads —
    everything stays on your device with optional Android Auto Backup.

RepoType: git
Repo: https://github.com/fwille/marlin.git

Builds:
  - versionName: 1.0.0
    versionCode: 1
    commit: v1.0.0-fdroid
    subdir: android
    gradle:
      - yes
    # `android/` is normally generated on demand by `npx expo prebuild` (Expo's
    # CNG), so `v1.0.0-fdroid` is a dedicated tag with it committed — the usual
    # declarative subdir/gradle build needs that directory to exist up front.
    #
    # Node must be on PATH system-wide: the RN/Expo Gradle plugin shells out to
    # `node`/`npm` both at Gradle-configuration time (resolving its own plugins)
    # and at build time (bundling the JS), and fdroidserver purges `sudo` before
    # `init` runs — so it's fetched and extracted to /usr/local here, while
    # still root, rather than in `init`.
    sudo:
      - apt-get update
      - apt-get install -y curl xz-utils
      - curl -Lo /tmp/node.tar.xz https://nodejs.org/dist/v22.22.3/node-v22.22.3-linux-x64.tar.xz
      - echo "2e5d13569282d016861fae7c8f935e741693c269101a5bebcf761a5376d1f99f  /tmp/node.tar.xz" | sha256sum -c -
      - tar xJf /tmp/node.tar.xz --strip-components=1 -C /usr/local
      - rm /tmp/node.tar.xz
    init:
      - cd .. && npm ci
    scandelete:
      - node_modules

AutoUpdateMode: None
UpdateCheckMode: Tags
CurrentVersion: 1.0.0
CurrentVersionCode: 1
