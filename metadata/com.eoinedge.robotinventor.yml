AutoName: Mindstorms Robot Creator

Summary: Build and control LEGO MINDSTORMS robots

Description: |-
  Mindstorms Robot Creator is an open-source companion app for LEGO MINDSTORMS
  Robot Inventor (51515), EV3, NXT, and RCX hubs.

  Connect to your robot hub via Bluetooth Low Energy (BLE) or USB, then use the
  built-in code generator to write MicroPython or Pybricks programs for your
  specific robot. A builder session panel lets you step through one safe test at
  a time, record what happened, and get the next suggestion.

  Features:

  * BLE and USB connection to MINDSTORMS hubs
  * Code generator for MicroPython, Pybricks, ev3dev, NXT-Python, and NQC
  * Builder session with live hub status
  * Voice keyword spotting for hands-free control
  * Works alongside the browser PWA and desktop app
  * Zero tracking, no accounts, no cloud required

  Supports all LEGO MINDSTORMS generations: Robot Inventor 51515, EV3, NXT,
  and RCX. Aimed at students and educators who still have the hardware and want
  to continue using it.

  All source code is MIT-licensed and available on GitHub.

