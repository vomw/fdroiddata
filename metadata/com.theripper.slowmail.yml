AuthorName: TheRipper
SourceCode: https://github.com/printpagestopdf/slow_mail
IssueTracker: https://github.com/printpagestopdf/slow_mail/issues

AutoName: Slow Mail
Summary: Privacy-friendly mail client
Description: |
  Slow Mail is an email client for reading and composing emails.

RepoType: git
Repo: https://github.com/printpagestopdf/slow_mail.git

Builds:
  - versionName: 0.9.0
    versionCode: 1
    commit: v0.9.0

    subdir: .

    prebuild:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - git clone https://github.com/flutter/flutter.git -b 3.41.6 --depth 1
      - export PATH="$PWD/flutter/bin:$PATH"
      - flutter config --no-analytics
      - flutter pub get

    build:
      - export SOURCE_DATE_EPOCH=1776113449
      - flutter build apk --release --no-tree-shake-icons

    output: build/app/outputs/flutter-apk/app-release.apk

    rm:
      - ios
      - linux
      - macos
      - windows
      - web


Binaries: https://github.com/printpagestopdf/slow_mail/releases/download/v%v/slowmail.apk

