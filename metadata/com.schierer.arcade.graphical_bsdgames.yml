Categories:
  - Casual Game

License: BSD-3-Clause

AuthorName: Luke Schierer
AuthorEmail: luke.schierer@gmail.com

SourceCode: https://github.com/lschierer/graphical-bsdgames
IssueTracker: https://github.com/lschierer/graphical-bsdgames/issues
Changelog: https://github.com/lschierer/graphical-bsdgames/releases

RepoType: git
Repo: https://github.com/lschierer/graphical-bsdgames

Builds:
  - versionName: 0.8.0
    versionCode: 1
    commit: v0.8.0
    subdir: app
    output: build/app/outputs/flutter-apk/app-release.apk
    srclibs:
      - flutter@stable
    rm:
      - app/ios
      - app/linux
      - app/macos
      - app/web
      - app/windows
    prebuild:
      - git -C $$flutter$$ checkout -f 3.44.0
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get --enforce-lockfile
    scandelete:
      - fortune/tools/do_sort
      - app/.pub-cache
    build:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter build apk --release

AutoUpdateMode: Version
UpdateCheckMode: Tags
UpdateCheckData: app/pubspec.yaml|version:\s.+\+(\d+)|.|version:\s(.+)\+
CurrentVersion: 0.8.0
CurrentVersionCode: 1
