AutoName: OTG Master
Description: |-
    Mount VeraCrypt-encrypted USB mass-storage devices on non-rooted Android.
    Reads raw sectors via the Android USB Host API, unlocks the VeraCrypt
    volume header (AES or Serpent, SHA-512), and exposes the decrypted
    filesystem (FAT32 or exFAT) through a standard Android DocumentsProvider
    so other apps (Files, Gallery, etc.) can browse it directly.

