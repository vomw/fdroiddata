Builds:
  - versionName: 2.1.6
    versionCode: 470010248
    commit: v2.1.6
    sudo:
      - sysctl fs.inotify.max_user_watches=524288 || true
      - curl -Lo node.tar.gz https://nodejs.org/dist/v24.11.1/node-v24.11.1-linux-x64.tar.gz
      - echo "58a5ff5cc8f2200e458bea22e329d5c1994aa1b111d499ca46ec2411d58239ca node.tar.gz"
        | sha256sum -c -
      - tar xzf node.tar.gz --strip-components=1 -C /usr/local/
      - curl -Lo jdk17.tar.gz
        https://github.com/adoptium/temurin17-binaries/releases/download/jdk-17.0.18%2B8/OpenJDK17U-jdk_x64_linux_hotspot_17.0.18_8.tar.gz
      - echo "0c94cbb54325c40dcf026143eb621562017db5525727f2d9131a11250f72c450 jdk17.tar.gz"
        | sha256sum -c -
      - mkdir -p /usr/lib/jvm/java-17-temurin && tar xzf jdk17.tar.gz --strip-components=1
        -C /usr/lib/jvm/java-17-temurin
      - npm install -g pnpm
    gradle:
      - yes
    prebuild:
      - echo "rootProject.name = 'de.volksverpetzer.app'" > settings.gradle && echo
        "task clean {}" > build.gradle
      - pnpm install --frozen-lockfile
      - npx expo prebuild --platform android --no-install
      - chmod -R a+r android/
      - sed -i
        's|distributionUrl=.*|distributionUrl=https\://services.gradle.org/distributions/gradle-8.13-bin.zip|'
        android/gradle/wrapper/gradle-wrapper.properties
    scanignore:
      - android/app/build/
      - android/app/.cxx/
      - node_modules/expo-*/local-maven-repo/
      - node_modules/@expo/dom-webview/local-maven-repo/
      - node_modules/hermes-compiler/hermesc/linux64-bin/hermesc
      - node_modules/react-native/React/I18n/strings/
      - node_modules/rive-react-native/android/build.gradle
      - node_modules/expo-dev-launcher/android/build.gradle
      - node_modules/react-native/ReactAndroid/publish.gradle
      - node_modules/react-native-webview/android/build.gradle
      - node_modules/react-native-safe-area-context/android/build.gradle
      - node_modules/expo-dev-menu/android/build.gradle
      - node_modules/react-native-view-shot/android/build.gradle
      - node_modules/react-native-svg/android/build.gradle
      - node_modules/react-native-screens/android/build.gradle
      - node_modules/@react-native-async-storage/async-storage/android/build.gradle
      - node_modules/expo-modules-core/android/ExpoModulesCorePlugin.gradle
      - node_modules/expo-application/android/build.gradle
      - node_modules/@stripe/stripe-react-native/android/build.gradle
      - node_modules/expo-notifications/android/build.gradle
    scandelete:
      - node_modules/@esbuild/
      - node_modules/fb-dotslash/
      - node_modules/hermes-compiler/hermesc/osx-bin/
      - node_modules/hermes-compiler/hermesc/win64-bin/
      - node_modules/@cspell/
      - node_modules/@trivago/prettier-plugin-sort-imports/.yarn/
      - node_modules/@gerrit0/mini-shiki/
      - node_modules/expo/template.tgz
    build: cd android && gradlew-fdroid :app:assembleRelease

AutoUpdateMode: None
UpdateCheckMode: None
