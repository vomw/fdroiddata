AutoName: Volksverpetzer

RepoType: git
Repo: https://github.com/Volksverpetzer/vvp_app.git

Builds:
  - versionName: 2.1.7
    versionCode: 470010260
    commit: 85fd0f02be7ad0342f2de4a64d25090a54ec7c38
    sudo:
      - sysctl fs.inotify.max_user_watches=524288 || true
      - curl -Lo node.tar.gz https://nodejs.org/dist/v24.11.1/node-v24.11.1-linux-x64.tar.gz
      - echo "58a5ff5cc8f2200e458bea22e329d5c1994aa1b111d499ca46ec2411d58239ca node.tar.gz"
        | sha256sum -c -
      - tar xzf node.tar.gz --strip-components=1 -C /usr/local/
      - curl -Lo jdk17.tar.gz 
        https://github.com/adoptium/temurin17-binaries/releases/download/jdk-17.0.18%2B8/OpenJDK17U-jdk_x64_linux_hotspot_17.0.18_8.tar.gz
      - echo "0c94cbb54325c40dcf026143eb621562017db5525727f2d9131a11250f72c450 jdk17.tar.gz"
        | sha256sum -c -
      - mkdir -p /usr/lib/jvm/java-17-temurin && tar xzf jdk17.tar.gz --strip-components=1
        -C /usr/lib/jvm/java-17-temurin
      - npm install -g pnpm@10.30.3
    gradle:
      - yes
    output: android/app/build/outputs/apk/release/app-release.apk
    prebuild:
      - echo "rootProject.name = 'de.volksverpetzer.app'" > settings.gradle && printf
        'task clean {}\ntask assembleRelease {}\n' > build.gradle
      - pnpm install
      - pnpm prepare:fdroid
      - printf 
        'module.exports={dependencies:{"@stripe/stripe-react-native":{platforms:{android:null}}}};'
        > react-native.config.js
      - python3 -c "import json; f=open('package.json','r+'); d=json.load(f); 
        d.setdefault('expo',{}).setdefault('autolinking',{}).setdefault('android',{})['buildFromSource']=['.*'];
        f.seek(0); json.dump(d,f,indent=2); f.truncate()"
      - sed -i -e '/installreferrer/d' node_modules/expo-application/android/build.gradle
      - sed -i -e '/com.android.installreferrer.api/d' -e '/StringBuilder()/,/^      })/d'
        -e '/getInstallReferrerAsync/apromise.resolve("")' 
        node_modules/expo-application/android/src/main/java/expo/modules/application/ApplicationModule.kt
      - IS_FOSS=true npx expo prebuild --platform android --no-install
      - sed -i 's/enableSeparateBuildPerCPUArchitecture = true/enableSeparateBuildPerCPUArchitecture
        = false/' android/app/build.gradle || true
      - sed -i 's/versionCode [0-9]*/versionCode 470010260/' android/app/build.gradle
      - echo 'android { dependenciesInfo { includeInApk false } }' >> android/app/build.gradle
      - "echo 'allprojects { configurations.all { exclude group: \"com.android.installreferrer\"\
        \ } }' >> android/build.gradle"
      - chmod -R a+r android/
      - sed -i 
        's|distributionUrl=.*|distributionUrl=https\://services.gradle.org/distributions/gradle-8.13-bin.zip|'
        android/gradle/wrapper/gradle-wrapper.properties
    scanignore:
      - node_modules/expo-*/local-maven-repo/
      - node_modules/@expo/dom-webview/local-maven-repo/
      - node_modules/@esbuild/linux-x64/
      - node_modules/hermes-compiler/hermesc/linux64-bin/hermesc
      - node_modules/react-native/React/I18n/strings/
      - node_modules/rive-react-native/android/build.gradle
      - node_modules/expo-dev-launcher/android/build.gradle
      - node_modules/react-native/ReactAndroid/publish.gradle
      - node_modules/react-native-webview/android/build.gradle
      - node_modules/react-native-safe-area-context/android/build.gradle
      - node_modules/expo-dev-menu/android/build.gradle
      - node_modules/react-native-view-shot/android/build.gradle
      - node_modules/react-native-svg/android/build.gradle
      - node_modules/react-native-screens/android/build.gradle
      - node_modules/@react-native-async-storage/async-storage/android/build.gradle
      - node_modules/expo-modules-core/android/ExpoModulesCorePlugin.gradle
      - node_modules/@stripe/stripe-react-native/android/build.gradle
      - node_modules/expo-notifications/android/build.gradle
    scandelete:
      - node_modules
    build: cd android && NODE_ENV=production gradlew-fdroid :app:assembleRelease

AutoUpdateMode: None
UpdateCheckMode: None
