License: GPL-3.0-only
WebSite: https://gitlab.com/blueboysin/RomBackup
SourceCode: https://gitlab.com/blueboysin/RomBackup
IssueTracker: https://gitlab.com/blueboysin/RomBackup/-/issues

AutoName: ROM Backup
Summary: Backup and restore custom ROM settings
Description: |-
  ROM Backup allows rooted users to seamlessly backup and restore system settings, secure settings, SystemUI preferences, and root modules across custom ROM installations. It utilizes native `tar` archiving to ensure Magisk and KernelSU modules retain their critical SELinux contexts and symlinks.

RequiresRoot: yes

RepoType: git
Repo: https://gitlab.com/blueboysin/RomBackup.git

Builds:
  - versionName: '1.0.2'
    versionCode: 3
    commit: 1.0.2
    subdir: app
    sudo:
      - apt-get update || true
      - apt-get install -y tar
    gradle:
      - yes

AutoUpdateMode: Version
UpdateCheckMode: Tags
