AutoName: Hackmas26 Fahrplan
Description: |
  https://hack-mas.at

  Håck ma’s Castle ist ein offenes Schloss für alle Arten von Nerds. 
  Wir wollen das Schloss als inklusiven Ort nutzen, 
  als einen niederschwelligen Einstieg, um Wissen zu vermitteln 
  und Erfahrungen auszutauschen. 
  Håcken steht dabei für den kreativen Umgang mit Technik 
  zum Beispiel bei Computern, Nähmaschinen, der Gesellschaft 
  und Herdplatten (Essen ist wichtig!). 

  <b>Funktionen:</b>
  * Tagesüberblick über alle Programmpunkte (Vorträge, Workshops, Exkursionen)
  * Detaillierte Beschreibung von Veranstaltungen lesen
  * Veranstaltungen in persönlicher Favoritenliste verwalten
  * Alle Veranstaltungen durchsuchen und filtern
  * Favoritenliste exportieren
  * Alarm für Veranstaltungen setzen
  * Veranstaltungen in Kalender eintragen
  * Beschreibung und Link zu Veranstaltungen mit anderen teilen
  * Automatische, regelmäßige Aktualisierung des Programms
  * Programmänderungen einsehen

  🔤 <b>Unterstützte Sprachen</b>
  (Programmtexte ausgenommen)
  * Dänisch
  * Deutsch
  * Deutsch, Österreich
  * Englisch
  * Finnisch
  * Französisch
  * Italienisch
  * Japanisch
  * Litauisch
  * Niederländisch
  * Polnisch
  * Portugiesisch, Brasilien
  * Portugiesisch, Portugal
  * Russisch
  * Spanisch
  * Schwedisch
  * Türkisch

  🤝 Du kannst mithelfen, die App zu übersetzen. Siehe Link hier.

  💡 Inhaltliche Fragen zum Programm kann nur das Hackmas26-Content-Team
  beantworten. Diese App stellt lediglich das Programm zur Verfügung.

  💣 Fehlerberichte sind herzlich willkommen, aber achte darauf,
  dass du erklärst, wie man den Fehler reproduzieren kann. Bitte
  nutze den Issue-Tracker: https://github.com/EventFahrplan/EventFahrplan/issues.

  🏆 Die App basiert auf der <b>EventFahrplan-App</b>
  https://play.google.com/store/apps/details?id=info.metadude.android.congress.schedule
  für den Kongress des Chaos Computer Clubs. Der Quellcode der Anwendung ist auf GitHub
  https://github.com/sophiaschaff/EventFahrplan/tree/hackmas26 zu finden.

