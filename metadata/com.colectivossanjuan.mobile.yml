Summary: Transporte público en San Juan (Comunidad)
Description: |-
  Colectivos San Juan es la aplicación definitiva para moverte en transporte público por la provincia de San Juan, Argentina. Esta versión está construida sobre principios de Software Libre (FOSS), respetando tu privacidad y garantizando un rendimiento óptimo sin rastreadores ni telemetría.

  Características principales:
  - Mapa en tiempo real: Visualizá la posición de los colectivos actualizando cada pocos segundos.
  - Arribos precisos: Conocé exactamente cuánto falta para que llegue tu próximo colectivo a cualquier parada.
  - Buscador inteligente: Encontrá líneas, paradas y recorridos de forma instantánea.
  - Alarma de bajada: Recibí una notificación sonora y visual cuando estés cerca de tu parada de destino (usa geofencing local).
  - Privacidad Garantizada: Sin Google Play Services, sin Firebase, sin telemetría de Expo. 100% independiente.

RepoType: git
Repo: https://gitlab.com/leoalcaraz130/colectivos-sanjuan.git

Builds:
  - versionName: 1.3
    versionCode: 1
    commit: 5de6df205987ec82a29cea1e43c441dfe4e97887
    sudo:
      - apt-get update
      - apt-get install -y nodejs npm
    init:
      - npm install
    prebuild:
      - npx expo prebuild --platform android --no-install
      - rm -rf android/app/google-services.json
    gradle:
      - assembleRelease
    output: android/app/build/outputs/apk/release/app-release.apk

