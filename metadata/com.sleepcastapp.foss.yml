Builds:
  - versionName: 1.0-foss
    versionCode: 1
    commit: 1a15d3cf7cde867e9af7832167e421b2bec848c7
    subdir: android/app
    submodules: true
    sudo:
      - apt-get update
      - apt-get install -y --no-install-recommends nodejs npm
      - u=https://api.adoptium.net/v3/binary/version/jdk-17.0.20+8/linux/x64/jdk/hotspot/normal/eclipse
      - curl -Lo jdk17.tar.gz "$u"
      - test "$(sha256sum jdk17.tar.gz | cut -c1-64)" = be7668bc030d578b83d6d5ef9221d6d6729bbbca8cf94a7d52e16ac68b5a5a35
      - mkdir -p /usr/lib/jvm/temurin-17
      - tar xzf jdk17.tar.gz --strip-components=1 -C /usr/lib/jvm/temurin-17
    init: cd ../.. && npm ci --ignore-scripts
    gradle:
      - foss
    output: build/outputs/apk/foss/release/app-foss-release-unsigned.apk
    rm:
      - node_modules/onnxruntime-react-native
    scanignore:
      - node_modules/react-native/ReactAndroid
      - node_modules/react-native-safe-area-context/android/build.gradle
      - node_modules/react-native-webview/android/build.gradle
    scandelete:
      - node_modules

