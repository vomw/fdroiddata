Builds:
  - versionName: 1.0-foss
    versionCode: 11
    commit: c8268b3fd61bfef85919765c270a587d1818ddc4
    subdir: android/app
    submodules: true
    sudo:
      - apt-get update
      - apt-get install -y npm
    init:
      - cd ../..
      - npm ci --ignore-scripts
    gradle:
      - foss
    output: build/outputs/apk/foss/release/app-foss-armeabi-v7a-release-unsigned.apk
    rm:
      - node_modules/onnxruntime-react-native
    prebuild:
      - cd ../..
      - sed -i '/jvmToolchain\|JavaVersion/s/17/21/' node_modules/@react-native/gradle-plugin/*/build.gradle.kts
        node_modules/@react-native/gradle-plugin/react-native-gradle-plugin/src/main/kotlin/com/facebook/react/utils/JdkConfiguratorUtils.kt
    scanignore:
      - node_modules/react-native/ReactAndroid
      - node_modules/react-native-safe-area-context/android/build.gradle
      - node_modules/react-native-webview/android/build.gradle
    scandelete:
      - node_modules
    gradleprops:
      - enableApkSplits=true
      - targetAbi=armeabi-v7a
      - includeUniversalApk=false

