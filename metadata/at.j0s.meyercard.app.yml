AutoName: Fechtkarte
Description: |-
    Fechtkarte generates warm-up and routine drill cards for Historical European
    Martial Arts (HEMA) practice, using notation credited to the 16th-century
    fencing master Joachim Meyer.

    Each card shows a numbered sequence of cuts to work through, with a dot
    marking a thrust instead of a cut. Card background colour indicates which
    hand leads, so a drill can alternate sides. Edge choice, guard, footwork
    and tempo are left to the practitioner -- the card only fixes the sequence
    of openings.

    Features:

    * A library of more than 100 classic drill cards, browsable by hand and
      filterable by action count, thrust count, and technique
    * Random drill generation with configurable action count, thrust count,
      and five opt-in shaping rules
    * Six palettes to choose from per hand, designed and verified for
      colour-vision-deficiency accessibility
    * Export a generated card as a high-resolution PNG or a true-vector,
      print-ready PDF, or share it directly to another app
    * Works fully offline, with no accounts, no analytics, and no network
      access required

    Fechtkarte is free and open-source software with no proprietary
    dependencies. English, German and French are supported, with the app
    language selectable independently of the device.

