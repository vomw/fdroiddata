Categories:
  - Health Manager
SourceCode: https://github.com/BenediktBurger/cycle-app
IssueTracker: https://github.com/BenediktBurger/cycle-app/issues

RepoType: git
Repo: https://github.com/BenediktBurger/cycle-app.git

Builds:
  - versionName: '0.1.0'
    versionCode: 1
    # add commit message
    commit: 5e08234d0327d54ffc251a1d3a1bcde8aed1d20c
    sudo:
      - mkdir -p /home/benediktb/Repositories/cycle-app
      - chown -R vagrant /home/benediktb/Repositories/cycle-app
    output: build/app/outputs/flutter-apk/app-release.apk
    srclibs:
      - flutter@stable
    rm:
      - ios
      - linux
      - macos
      - web
      - windows
    prebuild:
      - flutterVersion=$(sed -n -E "s/.*flutter-version:\ '(.*)'/\1/p" .github/workflows/release.yml)
      - '[[ $flutterVersion ]]'
      - git -C $$flutter$$ checkout -f $flutterVersion
      - export repo=/home/benediktb/Repositories/cycle-app
      - cd ..
      - mv io.github.benediktburger.cycleapp $repo
      - pushd $repo
      - export PUB_CACHE=$(pwd)/.pub-cache
      - .flutter/bin/flutter config --no-analytics
      - .flutter/bin/flutter pub get --enforce-lockfile
      - mv $repo /home/benediktb/Repositories/cycle-app
    scanignore:
      - .flutter/bin/cache
    scandelete:
      - .flutter
      - .pub-cache
    build:
      - export repo=/home/benediktb/Repositories/cycle-app
      - cd ..
      - mv io.github.benediktburger.cycleapp $repo
      - pushd $repo
      - export PUB_CACHE=$(pwd)/.pub-cache
      - .flutter/bin/flutter build apk --release"
      - mv $repo example.app

AllowedAPKSigningKeys: 0aa5749804b8ed9e3c207f851b5902775d762207d60c2485a26b5d75eff5355b

AutoUpdateMode: Version
UpdateCheckMode: Tags
UpdateCheckData: pubspec.yaml|version:\s.+\+(\d+)|.|version:\s(.+)\+
CurrentVersion: '0.1.0'
CurrentVersionCode: 1
