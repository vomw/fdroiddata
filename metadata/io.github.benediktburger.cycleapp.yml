License: Apache-2.0
SourceCode: https://github.com/BenediktBurger/cycle-app
IssueTracker: https://github.com/BenediktBurger/cycle-app/issues
AuthorName: Benedikt Burger
AutoName: NER Cycle App

RepoType: git
Repo: https://github.com/BenediktBurger/cycle-app.git

Builds:
  - versionName: 0.2.0
    versionCode: 2
    commit: 18324a462616b7292f55d909cceaa1a59cbcd86a
    sudo:
      - mkdir -p /home/benediktb/Repositories
      - chown -R vagrant /home/benediktb/Repositories
    output: build/app/outputs/flutter-apk/app-release.apk
    srclibs:
      - flutter@stable
    rm:
      - ios
      - web
    prebuild:
      - flutterVersion=$(grep -v '^#' tool/flutter-version | tail -n 1)
      - '[[ $flutterVersion ]] || exit 1'
      - git -C $$flutter$$ checkout -f $flutterVersion
      - export repo=/home/benediktb/Repositories/cycle-app
      - export rootdir=$PWD
      - mv $rootdir $repo
      - pushd $repo
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get --enforce-lockfile
      - mv $repo $rootdir
    scandelete:
      - .pub-cache
    build:
      - export repo=/home/benediktb/Repositories/cycle-app
      - export rootdir=$PWD
      - mv $rootdir $repo
      - pushd $repo
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter build apk --release
      - mv $repo $rootdir

AllowedAPKSigningKeys: 0aa5749804b8ed9e3c207f851b5902775d762207d60c2485a26b5d75eff5355b

