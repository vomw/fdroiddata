Summary: AI-powered accessibility assistant for text transformations
Description: |-
  TypeAssist is an AI-powered accessibility assistant that works directly within any
  Android text field. It leverages the Accessibility Service API to detect triggers
  and perform intelligent text transformations without you ever needing to leave
  the app you're in.

  Key Features:
  - AI Capabilities: Query Gemini, Cloudflare, or any OpenAI-compatible API.
  - Global Rewrite: Transform entire text fields instantly.
  - Utility Belt: Offline tools for math, snippets, dates, and passwords.
  - Privacy First: Data is sent directly to your chosen provider.
  - Safety: Global undo and history manager.

