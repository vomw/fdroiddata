Categories:
  - Phone & SMS
License: Apache-2.0
SourceCode: https://github.com/nocallspam/nocallspam
IssueTracker: https://github.com/nocallspam/nocallspam/issues

RepoType: git
Repo: https://github.com/nocallspam/nocallspam.git

Builds:
  - versionName: 1.0.0
    versionCode: 1
    commit: v1.0.0
    subdir: android/app
    sudo:
      - apt-get update
      - apt-get install -y openjdk-17-jdk
      - update-alternatives --auto java
      - curl -Lo node.tar.gz https://nodejs.org/dist/v24.13.0/node-v24.13.0-linux-x64.tar.gz
      - echo "6223aad1a81f9d1e7b682c59d12e2de233f7b4c37475cd40d1c89c42b737ffa8 node.tar.gz"
        | sha256sum -c -
      - tar xzf node.tar.gz --strip-components=1 -C /usr/local/
    gradle:
      - yes
    prebuild: npm ci
    scandelete:
      - node_modules

AutoUpdateMode: Version
UpdateCheckMode: Tags
CurrentVersion: 1.0.0
CurrentVersionCode: 1
