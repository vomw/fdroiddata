Name: NoCallSpam
Summary: Simple and privacy-focused call blocker for Android

Description: |
  NoCallSpam is a simple call blocker for Android focused on privacy and user control.

  It uses Android’s call screening feature to block incoming calls before your phone rings.
  The app works fully offline and does not require an internet connection.

  Features:
  - Block unwanted and unknown calls
  - Contacts-only mode
  - Allow list and block list modes
  - Block hidden and private numbers
  - Block foreign numbers
  - Block known telemarketing prefixes (France only)
  - Prefix and wildcard blocking
  - Import and export number lists (CSV)
  - Optional notifications for blocked calls

  NoCallSpam is not a spam detection service.
  It is a lightweight replacement for Android’s missing advanced call blocking features.

  All data is stored locally.
  No ads, no tracking, no analytics.

RequiresRoot: false

Builds:
  - versionName: 1.0.0
    versionCode: 1
    commit: v1.0.0
    subdir: android
    gradle:
      - yes
    prebuild:
      - npm ci
      - npm run build
    build:
      - cd android
      - ./gradlew assembleRelease

AutoUpdateMode: Version
UpdateCheckMode: Tags
