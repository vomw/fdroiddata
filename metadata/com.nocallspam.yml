Categories:
  - Phone & SMS
License: Apache-2.0
SourceCode: https://github.com/nocallspam/nocallspam
IssueTracker: https://github.com/nocallspam/nocallspam/issues

AutoName: NoCallSpam

RepoType: git
Repo: https://github.com/nocallspam/nocallspam.git

Builds:
  - versionName: 1.0.0
    versionCode: 1
    commit: v1.0.0
    subdir: android/app
    sudo:
      - apt-get update
      - apt-get install -y npm openjdk-17-jdk-headless
    gradle:
      - yes
    prebuild:
      - cd ../..
      - npm ci
      - sed -i 's/version("0.5.0")/version("1.0.0")/' node_modules/@react-native/gradle-plugin/settings.gradle.kts
    scandelete:
      - node_modules

AutoUpdateMode: Version
UpdateCheckMode: Tags
CurrentVersion: 1.0.0
CurrentVersionCode: 1
