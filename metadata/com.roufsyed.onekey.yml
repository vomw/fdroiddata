AutoName: 1Key
Description: |-
  1Key is a local-first password manager for Android. The vault lives on your device, encrypted with a key only you hold, and never moves unless you export it yourself. There is no account to create, no server to breach, and no network connection of any kind - the INTERNET permission is stripped from the manifest, so the operating system itself enforces the offline guarantee.

  Security:

  * Vault key derived from your master password with Argon2id (m=64 MiB, t=3, p=1 by default; configurable up to m=256 MiB, t=16).
  * Every credential field encrypted separately with AES-256-GCM, bound to its row and column via additional authenticated data.
  * Master-password verifier stored in EncryptedSharedPreferences, itself wrapped by an Android Keystore-bound key (TEE or StrongBox where available), so offline brute-force of a leaked device image is not possible.
  * Biometric unlock backed by hardware-secure key; requires master-password confirmation to enable.
  * Tiered attempt limiting: 3, 5, and 10 wrong attempts trigger 30-second, 5-minute, and 1-hour cooldowns respectively; counters survive process kills.

  Features:

  * Password vault with title, username, password, URL, notes, and custom fields; tag-based organisation; full-text search.
  * Built-in TOTP / 2FA codes stored alongside the credentials they protect.
  * Live-preview Markdown in notes.
  * System Autofill Service with URL-only matching to reduce phishing risk.
  * Encrypted .1key backup or plain CSV / JSON export; import from Google Passwords, LastPass, KeePass, 1Password, Dashlane, NordPass, Safari / iCloud Keychain.
  * Recycle bin with configurable soft-delete.

  What 1Key does NOT do: no accounts, no email, no signup; no analytics, crash reporting, or telemetry; no cloud sync; no device identifiers, IP logging, or advertising IDs; no network connection at all.

