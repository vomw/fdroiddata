Binaries: https://github.com/nightcodex7/yala/releases/download/v%v/yala-v%v-arm64-v8a.apk

Builds:
  - versionName: 2.0.0
    versionCode: 2201
    commit: 46f770445bde94126c912dc49b42840b36771242
    output: build/app/outputs/flutter-apk/app-armeabi-v7a-community-release.apk
    binary:
      https://github.com/nightcodex7/yala/releases/download/v%v/yala-v%v-armeabi-v7a.apk
    srclibs:
      - flutter@stable
    rm:
      - ios
    prebuild:
      - flutterVersion=$(sed -n -E "s/.*flutter-version:\ '(.*)'/\1/p" .github/workflows/release.yml)
      - '[[ $flutterVersion ]]'
      - git -C $$flutter$$ checkout -f $flutterVersion
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get --enforce-lockfile
      - sed -i -e 's/-Wl,/-Wl,--build-id=none,/' ${PUB_CACHE}/hosted/*/jni-*/src/CMakeLists.txt
        || true
    scandelete:
      - .pub-cache
    build:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter build apk --release --split-per-abi --target-platform="android-arm"
        --flavor community --dart-define=FLAVOR=community --dart-define=OFFICIAL_BUILD=true

