AutoName: Yet Another LuCI App

RepoType: git
Repo: https://github.com/nightcodex7/yala.git

Builds:
  - versionName: 2.2.5
    versionCode: 2251
    commit: 2bfd928b0ee5c85a53c7f5da5bf10f44b474dcd2
    output: build/app/outputs/flutter-apk/app-armeabi-v7a-community-release.apk
    srclibs:
      - flutter@stable
    rm:
      - ios
    prebuild:
      - flutterVersion=$(sed -n -E "s/.*flutter-version:\ '(.*)'/\1/p" .github/workflows/release.yml)
      - '[[ $flutterVersion ]]'
      - git -C $$flutter$$ checkout -f $flutterVersion
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get --enforce-lockfile
    scandelete:
      - .pub-cache
    build:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter build apk --release --split-per-abi --target-platform="android-arm"
        --flavor community --dart-define=FLAVOR=community --dart-define=OFFICIAL_BUILD=true
        --dart-define=FDROID_BUILD=true

  - versionName: 2.2.5
