Builds:
  - versionName: 0.2.2
    versionCode: 4
    commit: v0.2.2
    sudo:
      - apt-get update || true
      - apt-get install -y --no-install-recommends openjdk-17-jdk-headless wget 
        unzip || true
      - mkdir -p /home/vagrant/.cache/gradlew-fdroid/versions
      - wget -q https://services.gradle.org/distributions/gradle-9.6.1-bin.zip 
        -O /tmp/gradle-9.6.1.zip || true
      - unzip -q -o /tmp/gradle-9.6.1.zip -d 
        /home/vagrant/.cache/gradlew-fdroid/versions || true
      - mv /home/vagrant/.cache/gradlew-fdroid/versions/gradle-9.6.1 
        /home/vagrant/.cache/gradlew-fdroid/versions/9.6.1 || true
      - chown -R vagrant:vagrant /home/vagrant/.cache || true
    gradle:
      - yes
    output: app/build/outputs/apk/release/app-release-unsigned.apk

