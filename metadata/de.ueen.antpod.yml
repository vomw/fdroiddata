Categories:
  - Multimedia
License: GPL-3.0-only
AuthorName: ueen
WebSite: https://antpod.eu
SourceCode: https://github.com/ueen/antpod
IssueTracker: https://github.com/ueen/antpod/issues
Changelog: https://github.com/ueen/antpod/releases

AutoName: AntPod

RepoType: git
Repo: https://github.com/ueen/antpod

Builds:
  - versionName: 0.9.7
    versionCode: 17
    commit: baf4a9c6bdc9054768368f4334a4f57ce9372125
    init: sed -i -e '/signingConfig =/,+2d' android/app/build.gradle.kts
    output: build/app/outputs/flutter-apk/app-release.apk
    srclibs:
      - flutter@stable
    rm:
      - ios
    prebuild:
      - flutterVersion=$(sed -n -E "s/.*flutter-version:\ '(.*)'/\1/p" .github/workflows/build.yml)
      - '[[ $flutterVersion ]]'
      - git -C $$flutter$$ checkout -f $flutterVersion
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get
    scandelete:
      - .pub-cache
    build: $$flutter$$/bin/flutter build apk --release --target-platform=android-arm64
    ndk: 27.0.12077973

AutoUpdateMode: Version
UpdateCheckMode: Tags
UpdateCheckData: pubspec.yaml|version:\s.+\+(\d+)|.|version:\s(.+)\+
CurrentVersion: 0.9.7
CurrentVersionCode: 17
