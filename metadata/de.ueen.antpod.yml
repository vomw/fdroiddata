Builds:
  - versionName: 0.8.7
    versionCode: 5
    commit: 7414b56182c2fa6e831c856c2e4c71dcddea4f3a
    init: sed -i -e '/signingConfig =/,+2d' android/app/build.gradle.kts
    output: build/app/outputs/flutter-apk/app-release.apk
    srclibs:
      - flutter@stable
    rm:
      - ios
    prebuild:
      - git -C $$flutter$$ checkout -f 3.41.8
      - export PUB_CACHE=$(pwd)/.pub-cache
      - echo "flutter.sdk=$$flutter$$" >> android/local.properties
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get
    scandelete:
      - .pub-cache
    build:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter build apk --release --target-platform=android-arm64
    ndk: 27.0.12077973

