AutoName: AntPod

RepoType: git
Repo: https://github.com/ueen/antpod
Binaries: https://github.com/ueen/antpod/releases/download/v%v/antpod-%v-arm64.apk

Builds:
  - versionName: 0.9.7
    versionCode: 17
    commit: 629a5f2c4b18d3527b16e9accd539e4a45be44c6
    sudo:
      - mkdir -p /home/runner/work/antpod
      - chown -R vagrant /home/runner
    init: sed -i -e '/signingConfig =/,+2d' android/app/build.gradle.kts
    output: build/app/outputs/flutter-apk/app-release.apk
    srclibs:
      - flutter@stable
    rm:
      - ios
    prebuild:
      - flutterVersion=$(sed -n -E "s/.*flutter-version:\ '(.*)'/\1/p" .github/workflows/build.yml)
      - '[[ $flutterVersion ]]'
      - git -C $$flutter$$ checkout -f $flutterVersion
      - export repo=/home/runner/work/antpod/antpod
      - cd ..
      - mv de.ueen.antpod $repo
      - pushd $repo
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get
      - sed -i -e 's/-Wl,/-Wl,--build-id=none,/' $PUB_CACHE/hosted/pub.dev/jni-*/src/CMakeLists.txt
      - popd
      - mv $repo de.ueen.antpod
    scandelete:
      - .pub-cache
    build:
      - export repo=/home/runner/work/antpod/antpod
      - cd ..
      - mv de.ueen.antpod $repo
      - pushd $repo
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter build apk --release --target-platform=android-arm64
      - popd
      - mv $repo de.ueen.antpod
    ndk: 27.0.12077973

