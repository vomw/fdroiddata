License: Apache-2.0
AuthorName: rhythmcache
SourceCode: https://github.com/rhythmcache/Dioxamine
IssueTracker: https://github.com/rhythmcache/Dioxamine/issues
Changelog: https://github.com/rhythmcache/Dioxamine/releases

AutoName: Dioxamine

RepoType: git
Repo: https://github.com/rhythmcache/Dioxamine.git

Builds:
  - versionName: 0.0.2-alpha
    versionCode: 10001
    commit: v0.0.2-alpha
    subdir: app
    submodules: true
    ndk: r27b
    sudo:
      - echo "deb https://deb.debian.org/debian trixie main" > /etc/apt/sources.list.d/trixie.list
      - apt-get update
      - apt-get install -y -t trixie openjdk-21-jdk-headless
      - export JAVA_HOME=/usr/lib/jvm/java-21-openjdk-amd64
      - export PATH="$JAVA_HOME/bin:$PATH"
      - update-alternatives --auto java
    gradle:
      - yes

ArchivePolicy: 0
AutoUpdateMode: Version +v%v
UpdateCheckMode: Tags
CurrentVersion: 0.0.2-alpha
CurrentVersionCode: 10001
