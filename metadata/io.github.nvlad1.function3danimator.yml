AutoName: 3D Geometry Animation
Summary: Build and animate user-defined 3D mathematical surfaces

Description: |
  3D Geometry Animation is an Android application for visualizing and animating user-defined 3D mathematical surfaces.

  The app allows plotting multiple surfaces in the same scene and supports
  time-dependent functions for dynamic animations.

  Features:
  * Plot multiple 3D surfaces simultaneously
  * Animate time-dependent mathematical functions
  * Multiple function definition modes
  * Built-in example scenes (waves, pulsating sphere, cylinder, Möbius strip)
  * Custom math keyboard for easier expression input

  The application works fully offline and does not require an internet connection.

