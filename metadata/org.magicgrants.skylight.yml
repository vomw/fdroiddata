License: MIT
AuthorName: MAGIC Grants
AuthorEmail: info@magicgrants.org
WebSite: https://skylight.magicgrants.org
SourceCode: https://github.com/magicgrants/skylight-wallet
IssueTracker: https://github.com/magicgrants/skylight-wallet/issues
Changelog: https://github.com/magicgrants/skylight-wallet/releases

AutoName: Skylight Wallet

RepoType: git
Repo: https://github.com/magicgrants/skylight-wallet

Builds:
  - versionName: 1.0.9
    versionCode: 18
    commit: eea720856d3de6e40058ccca784b8aa1741b6246
    submodules: true
    sudo:
      - apt-get update
      - apt-get install -y make libc-dev g++ rustup pkg-config autoconf automake libtool
        ccache cmake lbzip2 gperf unzip llvm libssl-dev zlib1g-dev libncurses-dev
    output: build/app/outputs/flutter-apk/app-release.apk
    srclibs:
      - flutter@stable
    rm:
      - android/app/src/main/jniLibs
      - ios
      - linux
      - macos
      - web
      - windows
    prebuild:
      - flutterVersion=$(grep -E '^\s+flutter:\s+' pubspec.yaml | head -1 | sed 's/.*flutter:\s*//')
      - '[[ $flutterVersion ]]'
      - git -C $$flutter$$ checkout -f $flutterVersion
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get
      - git config --global --add safe.directory '*'
      - git config --global user.name 'MAGIC Grants'
      - git config --global user.email 'info@magicgrants.org'
      - git clone https://github.com/vtnerd/monero_c.git monero_c
      - cd monero_c
      - git checkout lwsf
      - git submodule update --init --recursive
      - ./apply_patches.sh monero
    scandelete:
      - .pub-cache
      - monero_c/monero/tests
      - monero_c/wownero/tests
      - monero_c/zano/contrib/epee/tests
      - monero_c/zano/utils/test_api_files
      - monero_c/monero/external/rapidjson/package.json
      - monero_c/wownero/external/rapidjson/package.json
      - monero_c/monero/external/trezor-common/defs/ethereum/tokens/build.gradle
      - monero_c/wownero/external/trezor-common/defs/ethereum/tokens/build.gradle
    build:
      - mkdir -p android/app/src/main/jniLibs/arm64-v8a
      - mkdir -p android/app/src/main/jniLibs/armeabi-v7a
      - mkdir -p android/app/src/main/jniLibs/x86_64
      - cd monero_c
      - echo "Building monero_libwallet2_api_c for aarch64-linux-android"
      - ./build_single.sh monero aarch64-linux-android -j1 > aarch64-build.log 2>&1
        || { cat aarch64-build.log; exit 1; }
      - cp monero_libwallet2_api_c/build/aarch64-linux-android/libwallet2_api_c.so
        ../android/app/src/main/jniLibs/arm64-v8a/libmonero_libwallet2_api_c.so
      - echo "Building monero_libwallet2_api_c for armv7a-linux-androideabi"
      - ./build_single.sh monero armv7a-linux-androideabi -j1 > armv7a-build.log 2>&1
        || { cat armv7a-build.log; exit 1; }
      - cp monero_libwallet2_api_c/build/armv7a-linux-androideabi/libwallet2_api_c.so
        ../android/app/src/main/jniLibs/armeabi-v7a/libmonero_libwallet2_api_c.so
      - echo "Building monero_libwallet2_api_c for x86_64-linux-android"
      - ./build_single.sh monero x86_64-linux-android -j1 > x86_64-build.log 2>&1
        || { cat x86_64-build.log; exit 1; }
      - cp monero_libwallet2_api_c/build/x86_64-linux-android/libwallet2_api_c.so
        ../android/app/src/main/jniLibs/x86_64/libmonero_libwallet2_api_c.so
      - cd ..
      - rm -rf monero_c
      - rustup default 1.83.0
      - rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android
      - export PUB_CACHE="$(pwd)/.pub-cache"
      - $$flutter$$/bin/flutter build apk --release
    ndk: 28.1.13356709

MaintainerNotes: |
  monero_c: vendored jniLibs are removed (rm) and rebuilt from vtnerd/monero_c branch lwsf before flutter build;
  using build_single.sh -j1 (-j$(nproc) may trigger invalid --jobserver-auth).
  tor_ffi_plugin: needs Rust; toolchain 1.83.0 matches upstream Dockerfile.builder.

AutoUpdateMode: Version
UpdateCheckMode: Tags
UpdateCheckData: pubspec.yaml|version:\s.+\+(\d+)|.|version:\s(.+)\+
CurrentVersion: 1.0.9
CurrentVersionCode: 18
