AutoName: Skylight Wallet

RepoType: git
Repo: https://github.com/magicgrants/skylight-wallet

Builds:
  - versionName: 1.0.9
    versionCode: 17
    commit: v1.0.9
    sudo:
      - apt-get update
      - apt-get install -y build-essential
    output: build/app/outputs/flutter-apk/app-release.apk
    srclibs:
      - flutter@3.41.7
      - rustup@1.29.0
    rm:
      - ios
      - linux
      - macos
      - web
      - windows
    prebuild:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get
    scanignore:
      - android/app/src/main/jniLibs
      - .pub-cache
    build:
      - $$rustup$$/rustup-init.sh -y --default-toolchain 1.83.0
      - source $HOME/.cargo/env
      - rustup target add aarch64-linux-android
      - rustup target add armv7-linux-androideabi
      - rustup target add x86_64-linux-android
      - export PUB_CACHE=$(pwd)/.pub-cache
      - export ANDROID_NDK_HOME="${ANDROID_NDK_HOME:-${ANDROID_HOME}/ndk/28.1.13356709}"
      - $$flutter$$/bin/flutter build apk --release

MaintainerNotes: |
  jniLibs added to scanignore contains prebuilt libraries, which are verifiably built upstream by GitHub Actions.
  Cargokit (tor_ffi_plugin) needs Rust on PATH: rustup srclib + rustup-init in build; toolchain 1.83.0 matches upstream Dockerfile.builder (adjust if either changes).
  build-essential (gcc as cc): required so cargo can compile build scripts before cross-compiling to Android.

AutoUpdateMode: Version
UpdateCheckMode: Tags
UpdateCheckData: pubspec.yaml|version:\s.+\+(\d+)|.|version:\s(.+)\+
CurrentVersion: 1.0.9
CurrentVersionCode: 17
