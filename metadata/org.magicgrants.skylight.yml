Categories:
  - Wallet
License: MIT
AuthorName: MAGIC Grants
AuthorEmail: info@magicgrants.org
WebSite: https://skylight.magicgrants.org
SourceCode: https://github.com/magicgrants/skylight-wallet
IssueTracker: https://github.com/magicgrants/skylight-wallet/issues
Changelog: https://github.com/magicgrants/skylight-wallet/releases

AutoName: Skylight Wallet

RepoType: git
Repo: https://github.com/magicgrants/skylight-wallet

Builds:
  - versionName: 1.0.11
    versionCode: 4021
    commit: 66ee994771b2b6f4c31e2a3cd9f6e81e959ef56b
    submodules: true
    sudo:
      - apt-get update
      - apt-get install -y make libc-dev g++ rustup pkg-config autoconf automake libtool
        ccache cmake lbzip2 gperf unzip llvm libssl-dev zlib1g-dev libncurses-dev
        xz-utils
    output: build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
    binary: 
      https://github.com/magicgrants/skylight-wallet/releases/download/v%v/skylight-wallet-v%v-armeabi-v7a.apk
    srclibs:
      - flutter@stable
    rm:
      - android/app/src/main/jniLibs
      - ios
      - linux
      - macos
      - web
      - windows
    prebuild:
      - flutterVersion=$(grep -E '^\s+flutter:\s+' pubspec.yaml | head -1 | sed 's/.*flutter:\s*//')
      - '[[ $flutterVersion ]]'
      - git -C $$flutter$$ checkout -f $flutterVersion
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get
      - git config --global user.name 'MAGIC Grants'
      - git config --global user.email 'info@magicgrants.org'
      - REPO=$(pwd)
      - MONEROC_COMMIT=$(awk '/^  monero:/{f=1} f&&/resolved-ref:/{gsub(/"/,"",$2);print
        $2;exit}' pubspec.lock)
      - rm -rf /tmp/monero_c
      - git clone monero_c /tmp/monero_c
      - cd /tmp/monero_c
      - git checkout "$MONEROC_COMMIT"
      - git submodule update --init --recursive --force
      - export SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)
      - export GIT_COMMITTER_DATE="@$SOURCE_DATE_EPOCH"
      - ./apply_patches.sh monero
      - patch -p1 < "$REPO/scripts/reproducible.patch"
    scandelete:
      - .pub-cache
      - monero_c/monero/tests
      - monero_c/monero/external/rapidjson/package.json
      - monero_c/monero/external/trezor-common/defs/ethereum/tokens/build.gradle
      - monero_c/wownero
      - monero_c/zano
    build:
      - REPO=$(pwd)
      - unset MAKEFLAGS
      - export SOURCE_DATE_EPOCH=$(git -C /tmp/monero_c log -1 --format=%ct)
      - cd /tmp/monero_c
      - ./build_single.sh monero armv7a-linux-androideabi -j"$(nproc)" > armv7a-build.log
        2>&1 || { cat armv7a-build.log; exit 1; }
      - rm -rf /tmp/skylight
      - cp -a "$REPO" /tmp/skylight
      - rm -rf /tmp/skylight/build /tmp/skylight/.dart_tool /tmp/skylight/.pub-cache
      - mkdir -p /tmp/skylight/android/app/src/main/jniLibs/armeabi-v7a
      - cp 
        /tmp/monero_c/monero_libwallet2_api_c/build/armv7a-linux-androideabi/libwallet2_api_c.so
        /tmp/skylight/android/app/src/main/jniLibs/armeabi-v7a/libmonero_libwallet2_api_c.so
      - rm -rf /tmp/monero_c
      - cd /tmp/skylight
      - export SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)
      - rustup default 1.83.0
      - rustup target add armv7-linux-androideabi
      - export PUB_CACHE=/tmp/skylight/.pub-cache
      - export CARGO_HOME=/tmp/skylight-cargo
      - '[ -f "$ANDROID_HOME/ndk/28.1.13356709/package.xml" ] || touch "$ANDROID_HOME/ndk/28.1.13356709/package.xml"'
      - $$flutter$$/bin/flutter pub get
      - bash scripts/pin-tor-rust-toolchain.sh
      - $$flutter$$/bin/flutter build apk --dart-define=DEMO_MODE=true --release --split-per-abi
        --target-platform="android-arm"
      - mkdir -p "$REPO/build/app/outputs/flutter-apk"
      - cp /tmp/skylight/build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
        "$REPO/build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk"
    ndk: 28.1.13356709

