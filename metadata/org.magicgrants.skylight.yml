Changelog: https://github.com/magicgrants/skylight-wallet/releases

AutoName: Skylight Wallet

RepoType: git
Repo: https://github.com/magicgrants/skylight-wallet

Builds:
  - versionName: 1.0.9
    versionCode: 17
    commit: cc7031bc7a15320229184a45efc0ab62b7959920
    sudo:
      - apt-get update
      - apt-get install -y build-essential rustup pkg-config autoconf automake libtool
        ccache cmake git curl lbzip2 gperf unzip python3 llvm libssl-dev zlib1g-dev
        libncurses-dev
    output: build/app/outputs/flutter-apk/app-release.apk
    srclibs:
      - flutter@stable
    rm:
      - android/app/src/main/jniLibs
      - ios
      - linux
      - macos
      - web
      - windows
    prebuild:
      - flutterVersion=$(grep -E '^\s+flutter:\s+' pubspec.yaml | head -1 | sed 's/.*flutter:\s*//')
      - '[[ $flutterVersion ]]'
      - git -C $$flutter$$ checkout -f $flutterVersion
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get
      - git config --global --add safe.directory '*'
      - git config --global user.name 'MAGIC Grants'
      - git config --global user.email 'info@magicgrants.org'
      - git clone https://github.com/vtnerd/monero_c.git monero_c
      - cd monero_c
      - git checkout lwsf
      - git submodule update --init --recursive
      - ./apply_patches.sh monero
      - cd ..
      - cp -a monero_c monero_c_aarch64
      - cp -a monero_c monero_c_armv7a
      - cp -a monero_c monero_c_x86_64
      - rm -rf monero_c
    scandelete:
      - .pub-cache
      - monero_c_aarch64/monero/tests
      - monero_c_armv7a/monero/tests
      - monero_c_x86_64/monero/tests
      - monero_c_aarch64/wownero/tests
      - monero_c_armv7a/wownero/tests
      - monero_c_x86_64/wownero/tests
      - monero_c_aarch64/zano/contrib/epee/tests
      - monero_c_armv7a/zano/contrib/epee/tests
      - monero_c_x86_64/zano/contrib/epee/tests
      - monero_c_aarch64/zano/utils/test_api_files
      - monero_c_armv7a/zano/utils/test_api_files
      - monero_c_x86_64/zano/utils/test_api_files
      - monero_c_aarch64/monero/external/rapidjson/package.json
      - monero_c_armv7a/monero/external/rapidjson/package.json
      - monero_c_x86_64/monero/external/rapidjson/package.json
      - monero_c_aarch64/wownero/external/rapidjson/package.json
      - monero_c_armv7a/wownero/external/rapidjson/package.json
      - monero_c_x86_64/wownero/external/rapidjson/package.json
      - monero_c_aarch64/monero/external/trezor-common/defs/ethereum/tokens/build.gradle
      - monero_c_armv7a/monero/external/trezor-common/defs/ethereum/tokens/build.gradle
      - monero_c_x86_64/monero/external/trezor-common/defs/ethereum/tokens/build.gradle
      - monero_c_aarch64/wownero/external/trezor-common/defs/ethereum/tokens/build.gradle
      - monero_c_armv7a/wownero/external/trezor-common/defs/ethereum/tokens/build.gradle
      - monero_c_x86_64/wownero/external/trezor-common/defs/ethereum/tokens/build.gradle
    build:
      - mkdir -p android/app/src/main/jniLibs/arm64-v8a
      - mkdir -p android/app/src/main/jniLibs/armeabi-v7a
      - mkdir -p android/app/src/main/jniLibs/x86_64
      - fail=0; ( cd monero_c_aarch64 && ./build_single.sh monero aarch64-linux-android
        -j1 && cp monero_libwallet2_api_c/build/aarch64-linux-android/libwallet2_api_c.so
        ../android/app/src/main/jniLibs/arm64-v8a/libmonero_libwallet2_api_c.so )
        > aarch64-build.log 2>&1 & p1=$!; ( cd monero_c_armv7a && ./build_single.sh
        monero armv7a-linux-androideabi -j1 && cp monero_libwallet2_api_c/build/armv7a-linux-androideabi/libwallet2_api_c.so
        ../android/app/src/main/jniLibs/armeabi-v7a/libmonero_libwallet2_api_c.so
        ) > armv7a-build.log 2>&1 & p2=$!; ( cd monero_c_x86_64 && ./build_single.sh
        monero x86_64-linux-android -j1 && cp monero_libwallet2_api_c/build/x86_64-linux-android/libwallet2_api_c.so
        ../android/app/src/main/jniLibs/x86_64/libmonero_libwallet2_api_c.so ) > x86_64-build.log
        2>&1 & p3=$!; wait $p1 || fail=1; wait $p2 || fail=1; wait $p3 || fail=1;
        [ "$fail" -eq 0 ] || { cat aarch64-build.log armv7a-build.log x86_64-build.log;
        exit 1; }
      - rm -rf monero_c_aarch64 monero_c_armv7a monero_c_x86_64
      - rustup default 1.83.0
      - rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android
      - export PUB_CACHE="$(pwd)/.pub-cache"
      - $$flutter$$/bin/flutter build apk --release

MaintainerNotes: |
  monero_c: vendored jniLibs are removed (rm) and rebuilt from vtnerd/monero_c branch lwsf before flutter build;
  using build_single.sh -j1 (-j$(nproc) may trigger invalid --jobserver-auth).
  tor_ffi_plugin: needs Rust; toolchain 1.83.0 matches upstream Dockerfile.builder.

AutoUpdateMode: Version
UpdateCheckMode: Tags
UpdateCheckData: pubspec.yaml|version:\s.+\+(\d+)|.|version:\s(.+)\+
CurrentVersion: 1.0.9
CurrentVersionCode: 17
