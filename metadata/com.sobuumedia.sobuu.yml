AutoName: Sobuu
Summary: Cozy reading tracker with optional social features and offline mode.

Description: |
  Sobuu is a cozy, reading tracker designed for people who love books and privacy.

  You can use Sobuu fully offline without creating an account, or connect to interact with others in every page.

  Whether you prefer a private reading space or a social experience, Sobuu adapts to you.
  
  ✨ Features:
  • 📚 Track your books and reading progress
  • 📴 Works fully offline (no account required)
  • 💬 Let public or private comments in any interesting page. Start a conversation where you need it.
  • 🔐 Optional account for social features only

  🔒 Privacy first:
  Sobuu does not require an account to use its core features.
  There are no ads and no tracking by default.
  Any analytics or crash reporting is strictly optional and disabled unless you enable it.

  🌱 Open source:
  Sobuu is fully open source and community-driven. Contributions, translations, and feedback are welcome.

  Start tracking your reading today — privately or together with others.

