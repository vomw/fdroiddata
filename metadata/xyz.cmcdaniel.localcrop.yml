Builds:
  - versionName: 1.0.0
    versionCode: 2
    commit: v1.0.0
    subdir: android/app
    sudo:
      - apt-get update
      - apt-get install -y curl xz-utils
      - curl -fsSL https://nodejs.org/dist/v22.15.0/node-v22.15.0-linux-x64.tar.xz
        | tar -xJ -C /usr/local --strip-components=1
    gradle:
      - yes
    prebuild:
      - cd ../..
      - sed -i '/org.gradle.java.home/d' android/gradle.properties
      - npm install
      - npm run build
      - npx cap sync android
    scandelete:
      - node_modules

AutoUpdateMode: Version
UpdateCheckMode: Tags
