AntiFeatures:
  NonFreeNet:
    en-US: Requires the phoneblock.net server for spam number lookups.
Categories:
  - Phone & SMS
  - Security
License: GPL-3.0-only
AuthorName: Bernhard Haumacher
AuthorWebSite: https://phoneblock.net
SourceCode: https://github.com/haumacher/phoneblock
IssueTracker: https://github.com/haumacher/phoneblock/issues
Changelog: https://github.com/haumacher/phoneblock/releases
Donate: https://phoneblock.net/phoneblock/support

AutoName: PhoneBlock Mobile

RepoType: git
Repo: https://github.com/haumacher/phoneblock.git

Builds:
  - versionName: 1.2.0
    versionCode: 9
    commit: c30c9f750bdd8dd504842bc8a41117b69bb83b03
    subdir: phoneblock_mobile
    output: build/app/outputs/flutter-apk/app-release.apk
    srclibs:
      - flutter@stable
    prebuild:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - flutterVersion=$(sed -n -E "s/.*flutter-version:\ '(.*)'/\1/p" ../.github/workflows/release.yml)
      - git -C $$flutter$$ checkout -f $flutterVersion
      - sed -i '/auto-translate-arb/d' android/build.gradle
      - sed -i '/auto-translate-arb/d' android/settings.gradle
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get
    scanignore:
      - phoneblock_shared/pubspec.yaml
      - phoneblock/fbclient/package.json
    scandelete:
      - phoneblock_mobile/.pub-cache
    build:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter build apk

AutoUpdateMode: Version
UpdateCheckMode: Tags .*pb-mobile-.*
UpdateCheckData: phoneblock_mobile/pubspec.yaml|version:\s.+\+(\d+)|.|version:\s(.+)\+
CurrentVersion: 1.1.2
CurrentVersionCode: 8
