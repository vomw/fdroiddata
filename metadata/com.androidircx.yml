AutoName: AndroidIRCX
Summary: Feature-rich open source IRC client for Android
Description: |
  AndroidIRCX is a modern open source IRC client for Android focused on
  reliable connectivity, deep customization, and advanced IRC workflows.

  It supports multiple IRC networks at the same time, with organized tabs for
  servers, channels, private messages, and DCC sessions. The app includes
  identity profiles with nick, alt nick, ident, and realname settings, plus
  SASL authentication, NickServ identify, and optional Oper login support.

  Messaging tools include grouped message formatting, inline timestamps, raw
  IRC view, WHOIS and WHOWAS lookups, highlights, ignore lists, notifications,
  and quick reactions. Favorite channels can be joined automatically, and the
  app includes strong reconnect behavior for unstable networks.

  AndroidIRCX also includes inline media preview, audio and video playback for
  supported formats, file saving, DCC chat, DCC send and receive, transfer
  progress controls, and customizable port ranges.

  For power users, the app provides themes, layout controls, custom commands,
  aliases, connection tuning, scripting-related automation tools, per-network
  workflow handling, backup and restore support, and chat history export in
  TXT, JSON, or CSV formats.

  This degoogled build targets users who want the AndroidIRCX experience
  without Google analytics, crash reporting, ads, or in-app billing
  dependencies in the release path.

