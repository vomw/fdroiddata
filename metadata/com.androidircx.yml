Builds:
  - versionName: 1.9.61
    versionCode: 109
    commit: v1.9.61
    subdir: android
    sudo:
      - apt-get update
      - apt-get install -y ccache yarnpkg
    gradle:
      - yes
    prebuild:
      - export JAVA_HOME=/usr/lib/jvm/java-21-openjdk-amd64
      - export GRADLE_USER_HOME=$PWD/.gradle
      - export ANDROID_HOME=${ANDROID_HOME:-/opt/android-sdk}
      - export ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-$ANDROID_HOME}
      - export PATH=$JAVA_HOME/bin:$PATH
      - cd ..
      - corepack prepare yarn@1.22.22 --activate
      - corepack yarn install --frozen-lockfile --network-timeout 300000 --non-interactive
        --ignore-engines --silent
      - mkdir -p android/build/generated/autolinking
      - node node_modules/@react-native-community/cli/build/bin.js config > android/build/generated/autolinking/autolinking.json
      - sed -i '/org.gradle.toolchains.foojay-resolver-convention/d' node_modules/@react-native/gradle-plugin/settings.gradle.kts
      - grep -RIl 'jvmToolchain(17)' node_modules/@react-native/gradle-plugin | xargs sed -i 's/jvmToolchain(17)/jvmToolchain(21)/g'
      - sed -i 's#autolinkLibrariesFromCommand(\\[nodeBinary, "node_modules/@react-native-community/cli/build/bin.js", "config"\\])#autolinkLibrariesFromConfigFile(file("build/generated/autolinking/autolinking.json"))#' android/settings.gradle
    scanignore:
      - android/settings.gradle
      - android/build.gradle
    scandelete:
      - node_modules
    build:
      - export JAVA_HOME=/usr/lib/jvm/java-21-openjdk-amd64
      - export GRADLE_USER_HOME=$PWD/.gradle
      - export ANDROID_HOME=${ANDROID_HOME:-/opt/android-sdk}
      - export ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-$ANDROID_HOME}
      - export PATH=$JAVA_HOME/bin:$PATH
      - gradle assembleRelease -PreactNativeArchitectures=arm64-v8a --no-configuration-cache
        --stacktrace

