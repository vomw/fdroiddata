MaintainerNotes: |-
  arm64-v8a only. minSdk 26, targetSdk 36.

  The fdroid flavour packages no distribution binaries: no Ubuntu rootfs
  archive and no .deb payload. tools/prepare-assets.sh, which stages those for
  the separate full flavour, runs only for preFull*Build, so this build makes
  no network requests of its own. The Ubuntu userland is downloaded on first
  run only after an explicit user opt-in, from a URL and SHA-256 pinned in the
  app's source, and is verified before extraction.

  The PRoot runtime is compiled during the build by
  term-ubuntu/tools/build-proot.sh from sources in the repository:
  third_party/proot (termux/proot, tag v5.1.107.92) and
  third_party/libandroid-shmem (termux/libandroid-shmem, tag v0.7) as
  submodules, plus talloc 2.4.3's talloc.c and talloc.h vendored verbatim
  because talloc has no git upstream. The script verifies both submodule
  commits, downloads nothing, and asserts the link contract and 16 KB page
  alignment of everything it produces. submodules: true is therefore required.

  PRoot is GPL-2.0 and talloc is LGPL-3.0; the corresponding source is the
  pinned submodules, the four patches in term-ubuntu/patches and the build
  script, all carried by the tagged commit.

  0.2.0 adds LAN Mode: an HTTP/WebSocket server, off by default, that a user
  turns on to use the terminal from a browser on the same Wi-Fi or Ethernet
  network, after pairing with a one-time PIN. It binds only a private (RFC
  1918) LAN address, uses no external service, relay or tracking, and serves
  only assets packaged in the APK. The browser terminal's JavaScript
  (term-ubuntu/src/main/assets/lan/xterm.js) is xterm.js 6.0.0, its fit
  addon and bidi-js 1.0.3, bundled unminified from their sources by
  term-ubuntu/lan-web/build.mjs from npm packages pinned by sha512 in
  term-ubuntu/lan-web/package-lock.json. `npm ci --ignore-scripts && node
  build.mjs --check` in that directory reproduces the committed files byte
  for byte; the Gradle build does not run Node. The web font is Cascadia
  Mono (SIL OFL 1.1). Provenance is in term-ubuntu/lan-web/README.md.

  Release builds are minified. minifyEnabled is on with
  proguard-android-optimize.txt plus term-ubuntu/proguard-rules.pro, which
  contains two keep rules and nothing else: the native library registers its
  methods with RegisterNatives against the literal class names
  com/thothterm/TermIO$Native and com/thothterm/Process$Native, so those two
  classes and their native methods must keep their names. There is no
  -dontobfuscate, -dontshrink, wildcard keep or blanket -dontwarn, R8 emits no
  warnings, and resource shrinking is off.

