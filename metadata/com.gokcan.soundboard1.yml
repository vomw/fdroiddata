Name: RTE Soundboard
Summary: The ultimate soundboard featuring iconic quotes of Recep Tayyip Erdoğan.
Description: |-
  RTE Soundboard is a free, completely open-source application that brings together the most memorable, legendary, and iconic quotes from President Recep Tayyip Erdoğan's political career in high audio quality!

  Key Features:
  • Massive Audio Archive: Hundreds of popular quotes and legendary speech snippets carefully categorized.
  • Audio Modification: Change the playback speed or pitch of any sound to create your own hilarious versions!
  • Easy Sharing: Instantly share the original or modified sounds with your friends on WhatsApp, Telegram, and other social platforms.
  • Playlists & Favorites: Build custom playlists of your top quotes or add them straight to your favorites.
  • Set as Ringtone/Notification: Use the iconic quotes as your phone's ringtone, alarm, or notification sound.
  • Quick Search: Easily find exactly what you're looking for among hundreds of sounds.
  • Customizable Themes: Light, dark, and vibrant custom color schemes designed to fit your mood.

  Built with the open-source spirit: completely free, ad-free, and tracker-free!

