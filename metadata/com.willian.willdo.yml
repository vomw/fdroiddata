Builds:
  - versionName: 2.3.12
    versionCode: 321
    commit: 518f31e6881e0d1b41b38bf643de344535581b9c
    subdir: android/app
    sudo:
      - echo "deb https://deb.debian.org/debian bookworm main" > /etc/apt/sources.list.d/bookworm.list
      - apt-get update
      - apt-get install -y -t bookworm openjdk-17-jdk-headless
      - update-java-alternatives -s java-1.17.0-openjdk-amd64
      - apt-get install -y npm
    init:
      - cd ../..
      - npm ci
    gradle:
      - yes
    srclibs:
      - firebase-stub@ce90a956aacda17a85c60577ee443aeb83d876ef
    prebuild:
      - cd ../..
      - bash scripts/prepare-fdroid-node-modules.sh $$firebase-stub$$
      - >-
          case "$$VERCODE$$" in
            *1) abi=armeabi-v7a ;;
            *2) abi=arm64-v8a ;;
            *) echo "Unsupported ABI version code: $$VERCODE$$" >&2; exit 1 ;;
          esac &&
          sed -i -E "s/^        versionCode [0-9]+$/        versionCode $$VERCODE$$/"
          android/app/build.gradle &&
          sed -i -E "s/^reactNativeArchitectures=.*/reactNativeArchitectures=${abi}/"
          android/gradle.properties
    scanignore:
      - node_modules/@react-native-async-storage/async-storage/android/build.gradle
      - node_modules/react-native-get-random-values/android/build.gradle
      - node_modules/react-native-safe-area-context/android/build.gradle
      - node_modules/react-native-screens/android/build.gradle
      - node_modules/react-native-webview/android/build.gradle
      - node_modules/react-native/sdks/hermesc/linux64-bin/hermesc
      - android/build.gradle
      - node_modules/expo-modules-core/android/ExpoModulesCorePlugin.gradle
      - node_modules/expo-modules-autolinking/scripts/android/autolinking_implementation.gradle
    scandelete:
      - node_modules/

