Categories:
  - Sports & Health
License: GPL-3.0-only
AuthorName: Ales Drobysh
SourceCode: https://github.com/alesdrobysh/purecal
IssueTracker: https://github.com/alesdrobysh/purecal/issues

AutoName: PureCal

RepoType: git
Repo: https://github.com/alesdrobysh/purecal.git

Builds:
  - versionName: 1.0.1
    versionCode: 7
    commit: 0977bd72a93461bc574ffd22a6ff0ce6f4b0e3d9
    output: build/app/outputs/flutter-apk/app-release.apk
    srclibs:
      - flutter@stable
    rm:
      - ios
      - linux
      - macos
      - web
      - windows
    prebuild:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get
    scandelete:
      - .pub-cache
    build:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter build apk --release

AutoUpdateMode: Version
UpdateCheckMode: Tags ^v.*$
UpdateCheckData: pubspec.yaml|version:\s.+\+(\d+)|.|version:\s(.+)\+
CurrentVersion: 1.0.1
CurrentVersionCode: 7
