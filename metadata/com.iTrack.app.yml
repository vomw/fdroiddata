Summary: Open-source workout tracking application
Description: |
  iTrack is an open-source workout application designed to help users 
  track their workouts, monitor progress, and achieve fitness goals.
  
  Features:
  * Workout Tracking: Log and track workout sessions with detailed statistics
  * Progress Monitoring: Visualize progress over time with charts and graphs
  * Workout Templates: Create and use custom workout templates
  * Recent Workouts: Quickly access and review recent workout sessions
  * Responsive Design: Optimized for both desktop and mobile devices
  
  No ads, no tracking, completely free and open source!

