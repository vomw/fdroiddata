Builds:
  - versionName: '1.0'
    versionCode: 1
    commit: fdroid-prebuild
    subdir: project/android
    gradle:
      - yes
    prebuild: |
      # Fix missing Capacitor dependencies by removing them from build.gradle
      sed -i '/implementation project(":capacitor-android")/d' app/build.gradle
      sed -i '/implementation project(":capacitor-cordova-android-plugins")/d' app/build.gradle
      # Create minimal settings.gradle that only includes the app module
      echo 'include ":app"' > settings.gradle
      # Create empty implementation for Capacitor plugins
      mkdir -p capacitor-cordova-android-plugins
      echo 'ext.cdvMinSdkVersion = 22' > capacitor-cordova-android-plugins/cordova.variables.gradle
      echo 'ext.cdvPluginPostBuildExtras = { }' >> capacitor-cordova-android-plugins/cordova.variables.gradle
      echo 'ext.cdvPluginBuildExtras = { }' >> capacitor-cordova-android-plugins/cordova.variables.gradle

