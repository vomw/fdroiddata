Builds:
  - versionName: '1.0'
    versionCode: 1
    commit: 7d656818e6676e07daeb2aea0b250ad59efbef02
    subdir: project/android
    sudo:
      - apt-get update
      - apt-get install npm
      - sysctl fs.inotify.max_user_watches=524288 || true
    gradle:
      - yes
    prebuild:
      - pushd ../..
      - npm ci
      - npm run build
      - npx cap telemetry off
      - npx cap update
      - popd
    scanignore:
      - node_modules/@capacitor/cli/assets/capacitor-cordova-android-plugins.tar.gz
    scandelete:
      - node_modules/

