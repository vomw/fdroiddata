Changelog: https://github.com/mcanyucel/firefly-shortcuts/releases

AutoName: Firefly Shortcuts

RepoType: git
Repo: https://github.com/mcanyucel/firefly-shortcuts

Builds:
  - versionName: 1.0.0
    versionCode: 1002
    commit: 45e024fa51a0239f68b9d72aef1a964d14d6a18a
    output: build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
    srclibs:
      - flutter@stable
    prebuild:
      - flutterVersion=$(cat .flutter-version)
      - '[[ $flutterVersion ]]'
      - git -C $$flutter$$ checkout -f $flutterVersion
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get --enforce-lockfile
    scandelete:
      - .pub-cache
    build:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - (cd android && ./gradlew -q :app:dependencies --configuration releaseRuntimeClasspath
        > /dev/null) && for jar in $(find "$HOME/.gradle/caches/modules-2/files-2.1/io.flutter/flutter_embedding_release"
        -name '*.jar'); do zip -d "$jar" "io/flutter/embedding/android/FlutterPlayStoreSplitApplication.class"
        "io/flutter/embedding/engine/deferredcomponents/PlayStoreDeferredComponentManager.class"
        "io/flutter/embedding/engine/deferredcomponents/PlayStoreDeferredComponentManager\$FeatureInstallStateUpdatedListener.class"
        "io/flutter/embedding/engine/deferredcomponents/PlayStoreDeferredComponentManager\$1.class"
        || true; done
      - $$flutter$$/bin/flutter build apk --release --split-per-abi --target-platform
        android-arm

