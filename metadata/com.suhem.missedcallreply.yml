AutoName: MissedCall Reply
Summary: Auto-reply SMS to missed calls with time window support
Description: |-
  MissedCall Reply automatically sends an SMS to anyone who missed-calls you.

  Features:

  * Auto SMS reply for all missed calls
  * Time window mode - only reply during set hours (e.g. 10 AM to 3 PM)
  * Custom reply message
  * Runs in background, auto starts after reboot
  * No ads, no account, no internet required
  * Completely free and open source

