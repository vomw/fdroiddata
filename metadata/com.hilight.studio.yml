AutoName: HiLight Studio
Summary: Control the HiLight LED array on supported Pixel 11 Pro devices
Description: |-
  HiLight Studio controls the eight-LED HiLight array on the Pixel 11 Pro,
  Pixel 11 Pro XL, and Pixel 11 Pro Fold running Android 17.

  Features include solid colours, animated patterns, presets, notification and
  foreground-app rules, per-contact rules, and microphone or camera activity
  rules. Runtime limits, quiet hours, Do Not Disturb, Battery Saver, and
  low-battery controls help prevent unwanted output.

  The app automatically uses root access when available. Shizuku and an
  ADB-started helper are supported as alternatives. Privileged access must be
  restored after a reboot.

  There are no advertisements, analytics, accounts, or telemetry. Rules and
  settings stay on the device. Notification contents, audio, and video are never
  recorded or uploaded. The internet is used only when the user manually checks
  for updates.

  This is experimental software for specific hardware. It is not affiliated
  with or endorsed by Google. Review the upstream setup instructions and safety
  notes before use.

