AutoName: Sherpr
Summary: Drive your Herdr AI-agent fleet from your phone, over SSH — no cloud
Description: |-
  Sherpr is the mobile companion for Herdr, the terminal agent
  multiplexer. It connects to one or more Herdr instances on your workstation
  or servers over SSH and gives you a live fleet dashboard (blocked / working /
  done / idle), on-device notifications when an agent needs you, two-tap
  unblock actions, workspace/session creation, and a real interactive terminal
  on tap — all in a dark "black glass + neon" UI.

  There is no vendor cloud: the app talks directly to your own machine over
  your own SSH transport. Optional voice dictation runs on-device (whisper.cpp
  compiled from source); Whisper models are downloaded on first use from a
  pinned URL with SHA-256 verification, never bundled. Notifications are
  generated on-device from the live SSH event stream — no push provider; an
  opt-in foreground service can keep the session alive in the background. No
  Google Play Services are required or referenced.

