AutoName: Sherpr

RepoType: git
Repo: https://codeberg.org/alevui/sherpr.git

Builds:
  - versionName: 0.2.9
    versionCode: 131
    commit: ffc1d556bd68915c33dd295029b13aa76b057027
    output: build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
    srclibs:
      - flutter@stable
    rm:
      - ios
    prebuild:
      - sdkmanager "ndk;27.0.11902837" "platforms;android-36" "platforms;android-35"
        "platforms;android-34" "build-tools;36.0.0" "cmake;3.22.1"
      - export version=$(grep flutter .fvmrc | cut -d ":" -f2 | cut -d "\"" -f2)
      - git -C $$flutter$$ checkout -f $version
      - export PUB_CACHE="$(pwd)/.pub-cache"
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get --enforce-lockfile
    scandelete:
      - .pub-cache
    build:
      - export PUB_CACHE="$(pwd)/.pub-cache"
      - $$flutter$$/bin/flutter build apk --release --split-per-abi --target-platform=android-arm
        --build-number=$(( $$VERCODE$$ / 10 ))
    ndk: r28c

