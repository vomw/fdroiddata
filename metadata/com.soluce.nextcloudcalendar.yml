Categories:
  - Calendar & Agenda
License: GPL-3.0-or-later
AuthorName: Soluce Technologies
SourceCode: https://github.com/SoluceTechnologies/nextcloud-calendar-mobile
IssueTracker: https://github.com/SoluceTechnologies/nextcloud-calendar-mobile/issues
Changelog: https://github.com/SoluceTechnologies/nextcloud-calendar-mobile/releases

RepoType: git
Repo: https://github.com/SoluceTechnologies/nextcloud-calendar-mobile.git

Builds:
  - versionName: 1.4.4
    versionCode: 10404
    commit: 1.4.4
    subdir: android/app
    timeout: 14400
    sudo:
      - sysctl fs.inotify.max_user_watches=524288
      - curl -Lo node.tar.gz https://nodejs.org/download/release/latest-v22.x/node-v22.23.1-linux-x64.tar.gz
      - echo "7a8cb04b4a1df4eaf432125324b81b29a088e73570a23259a8de1c65d07fc129  node.tar.gz"
        | sha256sum -c -
      - tar xzf node.tar.gz --strip-components=1 -C /usr/local/
      - npm -g install yarn
    init:
      - cd ../..
      - yarn install
    output: android/app/build/outputs/apk/release/app-release.apk
    prebuild:
      - cd ../..
      - sdkmanager 'cmake;3.22.1'
      - yarn expo prebuild --platform android --no-install
    scanignore:
      - android/build.gradle
      - node_modules/react-native/sdks/hermesc
      - node_modules/expo/android/build.gradle
      - node_modules/expo-application/android/build.gradle
      - node_modules/expo-asset/node_modules/expo-file-system/android/build.gradle
      - node_modules/expo-constants/android/build.gradle
      - node_modules/expo-font/android/build.gradle
      - node_modules/expo-location/android/build.gradle
      - node_modules/expo-modules-core/android/build.gradle
      - node_modules/expo-secure-store/android/build.gradle
      - node_modules/expo-splash-screen/android/build.gradle
      - node_modules/jsc-android
    scandelete:
      - node_modules/
    build:
      - cd android/app
      - gradle assembleRelease
    ndk: r23b
AutoUpdateMode: None
UpdateCheckMode: Tags
CurrentVersion: 1.4.4
CurrentVersionCode: 10404
