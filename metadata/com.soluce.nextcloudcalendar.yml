Categories:
  - Calendar & Agenda
License: GPL-3.0-or-later
AuthorName: Soluce Technologies
SourceCode: https://github.com/SoluceTechnologies/nextcloud-calendar-mobile
IssueTracker: https://github.com/SoluceTechnologies/nextcloud-calendar-mobile/issues
Changelog: https://github.com/SoluceTechnologies/nextcloud-calendar-mobile/releases

RepoType: git
Repo: https://github.com/SoluceTechnologies/nextcloud-calendar-mobile.git

Builds:
  - versionName: 1.4.4
    versionCode: 10404
    commit: 1.4.4
    subdir: android/app
    timeout: 14400
    sudo:
      - apt-get update
    init:
      - curl -o- https://raw.githubusercontent.com/nvm-sh/nvm/v0.40.3/install.sh | bash
      - export NVM_DIR="$HOME/.nvm"
      - . "$NVM_DIR/nvm.sh"
      - nvm install 22
      - node --version
      - ln -sf "$(command -v node)" /opt/android-sdk/platform-tools/node
      - node --version
      - cd ../..
      - corepack enable
      - yarn install --immutable
      - yarn expo prebuild --platform android --no-install
    gradle:
      - yes
    scandelete:
      - node_modules
      - .yarn/install-state.gz
AutoUpdateMode: None
UpdateCheckMode: Tags
CurrentVersion: 1.4.4
CurrentVersionCode: 10404
