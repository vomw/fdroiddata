MaintainerNotes: |-
  Flutter version is pinned via .fvmrc in the repo root (currently 3.35.7).
  The prebuild step reads this file and checks out the correct Flutter version
  from the srclib before running pub get.

  media_kit packages are git dependencies from
  https://github.com/DonutWare/media-kit.git and are pinned via pubspec.lock to
  commit 34bde583caa800bf2beb06ec6287c943eda24296.

  media_kit_libs_android_video's Gradle task that downloads prebuilt JARs is
  removed in prebuild, and replacement JARs are built locally from source using
  media-kit/libmpv-android-video-build at v1.1.8.

  The libmpv build scripts are seeded with srclib copies of mpv, libplacebo,
  fftools_ffi, media-kit-android-helper, and DonutWare/media-kit to avoid
  relying on non-reproducible floating refs for these components.

  The repo contains a flatpak/shared-modules git submodule which is unrelated
  to the Android build; it is removed via the rm: list and submodules: true is
  intentionally not set.

  The production flavor is required for release builds.

  Upstream release workflows pass --build-number=${{ github.run_number }}. For
  v0.10.3 this value is 630. Split APK outputs use ABI-specific Android
  versionCode overrides, resulting in x86_64=4630, armeabi-v7a=1630,
  arm64-v8a=2630.

  Upstream now publishes split Android APK artifacts. Metadata matches them
  one-to-one with per-ABI binary URLs:
  Fladder-Android-%v-x86_64.apk,
  Fladder-Android-%v-armeabi-v7a.apk,
  Fladder-Android-%v-arm64-v8a.apk.

