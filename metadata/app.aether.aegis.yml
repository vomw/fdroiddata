AutoName: Aegis

Summary: Encrypted messenger with SOS, duress PINs, and remote access for safety

Description: |-
  Aegis is a free, encrypted messaging app designed for people in dangerous
  situations — domestic violence, stalking, surveillance.

  It runs on SimpleX — no phone number, no account, no server stores your
  messages. The Aegis Protocol enforces anonymous handles on every connection.
  No telemetry, no analytics, nothing phones home.

  Features include SOS panic button with GPS/audio/camera broadcast, duress
  PINs with cryptographically indistinguishable decoy profiles, remote
  locate/lock/wipe for family safety, encrypted vault, 24-word recovery
  phrase with hardware-backed encryption, trust tiers, and receipt
  reconciliation for lossy networks.

  16 languages. Free forever. No ads.

