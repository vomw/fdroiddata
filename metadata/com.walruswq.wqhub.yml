AuthorName: Alejandro Lopez del Huerto
AuthorEmail: ale64bit@gmail.com
WebSite: https://walruswq.com/WeiqiHub
SourceCode: https://github.com/ale64bit/WeiqiHub
IssueTracker: https://github.com/ale64bit/WeiqiHub/issues
Donate: https://walruswq.com/donate

AutoName: WeiqiHub

RepoType: git
Repo: https://github.com/ale64bit/WeiqiHub.git

Builds:
  - versionName: 0.1.13
    versionCode: 40
    commit: v0.1.13
    output: build/app/outputs/flutter-apk/app-release.apk
    srclibs:
      - flutter@stable
    rm:
      - ios
      - linux
      - macos
      - windows
      - android/app/.cxx
    prebuild:
      - flutterVersion=$(sed -n -E "s/.*flutter:\ (.*)/\1/p" pubspec.yaml)
      - '[[ $flutterVersion ]]'
      - git -C $$flutter$$ checkout -f $flutterVersion
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get
    scandelete:
      - .pub-cache
    build:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - .flutter/bin/flutter build apk --release

AutoUpdateMode: Version
UpdateCheckMode: Tags v.*[0-9]$
UpdateCheckData: pubspec.yaml|version:\s.+\+(\d+)|.|version:\s(.+)\+
CurrentVersion: 0.1.13
CurrentVersionCode: 40
