    versionCode: 1
    commit: v0.1.0-beta2
    subdir: mobile/android
    sudo:
      - apt-get update
      - apt-get install -y nodejs npm
      - npm install -g pnpm@9.15.9
    gradle:
      - yes
    output: app/build/outputs/apk/release/app-release-unsigned.apk
    prebuild: cd .. && CI=true pnpm install --frozen-lockfile && CI=true pnpm exec
      cap sync android
    scandelete:
      - mobile/node_modules/.pnpm/@capacitor+cli@7.6.8/node_modules/@capacitor/cli/assets

