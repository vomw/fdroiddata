Categories:
  - Connectivity
  - Internet
License: GPL-3.0-or-later
AuthorName: futpib
SourceCode: https://github.com/futpib/iroh-ssh-android
IssueTracker: https://github.com/futpib/iroh-ssh-android/issues

AutoName: Iroh SSH

RepoType: git
Repo: https://github.com/futpib/iroh-ssh-android.git

Builds:
  - versionName: 26.03.14.22.01
    versionCode: 22
    commit: 6508e37dd642dbd2e5202c888fec26d9261e8ebc
    sudo:
      - apt-get update
      - apt-get install -y gcc libc-dev cmake ninja-build pkg-config rustup
    output: build/app/outputs/flutter-apk/app-release.apk
    srclibs:
      - flutter@stable
    rm:
      - ios
      - linux
      - macos
      - web
      - windows
    prebuild:
      - flutterVersion=$(sed -n -E "s/.*flutter-version:\ '(.*)'/\1/p" .github/workflows/build-apk.yml)
      - '[[ $flutterVersion ]]'
      - git -C $$flutter$$ checkout -f $flutterVersion
      - rustup default 1.93.0
      - rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android
        i686-linux-android
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter config --no-analytics
      - sed -i '/mobile_scanner/d' pubspec.yaml
      - $$flutter$$/bin/flutter pub get
    scandelete:
      - .pub-cache
    build:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter build apk --release --build-name=$$VERSION$$ --build-number=$$VERCODE$$

AutoUpdateMode: Version
UpdateCheckMode: Tags
UpdateCheckData: '|.*\+(\d+)||(.+)\+\d+$'
CurrentVersion: 26.03.14.22.01
CurrentVersionCode: 22
