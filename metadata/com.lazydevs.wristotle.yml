AutoName: Wristotle Companion
Description: |-
  Voice control for Pebble watches, running on-device by default.

  Wristotle turns your Pebble watch's dictation button into a voice
  command surface on your phone: calls, texts, reminders, alarms,
  music control, notes, tasks, weather, world clock, calculator, and
  an Ask-Agent path that can hit any MCP server you configure.

  Everything runs on-device by default. Optional cloud Whisper /
  self-hosted speech-to-text endpoint and optional Anthropic or
  OpenAI-compatible LLM if you want them. Baseline doesn't phone
  home; no account, no tracking, AGPLv3-licensed.

  Works with microPebble and Core Devices (rePebble).

  Voice commands:
  * Calls — "call John"
  * Messages — "text Sarah I'll be late" / "whatsapp Mom dinner at 7"
  * Reminders — "remind me to take meds in 20 minutes"
  * Alarms — "set an alarm for 6:30 am" (phone / watch / both)
  * Timers — "set a timer for 10 minutes"
  * Music — "play Spotify" / "pause" / "next"
  * Apps — "open Maps" / "launch Audible"
  * Notes — "make a note buy milk" (text + audio)
  * Tasks — "add task pick up dry cleaning"
  * Weather, world clock, calculator, find phone
  * Ask Agent — "ask agent what's on my calendar tomorrow"

  A first-launch welcome wizard walks new users through the
  optional setup that unlocks the full app — Whisper speech model
  download, on-device intent classifier model, runtime permissions,
  installed-app indexing.

  Also includes: confirm-before-send for destructive actions,
  conversation history with optional audio capture, contact + app
  aliases, custom Ask-Agent triggers, on-device intent classifier
  for paraphrase recognition, MCP client (Streaming-HTTP + SSE
  fallback), Backup & Restore (per-entity JSON ZIP with optional
  AES-256), on-watch speech replies on Pebble Time 2 / Pebble Round 2
  (experimental), and Settings → Stats showing top intents, active
  hours, accuracy, and where Wristotle stumbles (computed on-device).

  The watch app is sold separately on the Rebble appstore
  (microPebble) and the Core Devices appstore.

  Full feature list, install guide, and troubleshooting at
  https://wristotle.codeberg.page/

