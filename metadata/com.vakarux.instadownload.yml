AutoName: InstaDownload
Summary: Download Instagram reels and photos to your device
Description: |-
  InstaDownload lets you save Instagram reels and photos directly to your
  Downloads folder — no account required.

  Paste any public Instagram reel or post URL and tap Download. The file
  saves to your Downloads folder and you get a notification when it's done.

  Features:

  * Download reels as MP4 video files
  * Download photos as JPG image files
  * Paste button for quick URL input
  * Works with instagram.com/reel/, /p/, and /tv/ links
  * No account or login required
  * No ads, no tracking, no analytics

