Categories:
  - Sports & Health

License: GPL-3.0-only

WebSite: https://github.com/resurrectdev1/grove
SourceCode: https://github.com/resurrectdev1/grove
IssueTracker: https://github.com/resurrectdev1/grove/issues

AutoName: Grove
Summary: Minimalist fractal habit tracker
Description: |-
  Grove is a minimalist habit tracker that visualizes your consistency
  as a growing forest. Track habits, maintain streaks, and watch your
  grove grow over time.

  No accounts, no ads, no tracking; all data stays on your device.

RequiresRoot: false

Builds:
  - versionName: '0.5.4'
    versionCode: 2
    commit: v0.5.4
    output: build/app/outputs/flutter-apk/app-release.apk
    sudo:
      - apt-get update
      - apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev
    init: flutter pub get
    build: flutter build apk --release

AutoUpdateMode: Version
UpdateCheckMode: Tags
