Categories:
  - Sports & Health

License: GPL-3.0-only

SourceCode: https://github.com/resurrectdev1/grove
IssueTracker: https://github.com/resurrectdev1/grove/issues

RepoType: git
Repo: https://github.com/resurrectdev1/grove

AutoName: Grove

Builds:
  - versionName: 0.5.4
    versionCode: 2
    commit: v0.5.4
    sudo:
      - apt-get update
      - apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev
    srclibs:
      - flutter@stable
    output: build/app/outputs/flutter-apk/app-release.apk
    prebuild:
      - export HOME=/home/vagrant
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get
    scandelete:
      - .pub-cache
    build:
      - export HOME=/home/vagrant
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter build apk --release

AutoUpdateMode: Version
UpdateCheckMode: Tags
UpdateCheckData: pubspec.yaml|version:\s.+\+(\d+)|.|version:\s(.+)\+
CurrentVersion: 0.5.4
CurrentVersionCode: 2
