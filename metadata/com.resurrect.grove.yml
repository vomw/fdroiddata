Categories:
  - Sports & Health
License: GPL-3.0-only
SourceCode: https://github.com/resurrectdev1/grove
IssueTracker: https://github.com/resurrectdev1/grove/issues

AutoName: Grove

RepoType: git
Repo: https://github.com/resurrectdev1/grove

Builds:
  - versionName: 0.5.4
    versionCode: 2
    commit: a54cfa103d636e5f43ecf8ae4d7c7f261d7b4583
    sudo:
      - apt-get update
      - apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev
    output: build/app/outputs/flutter-apk/app-release.apk
    srclibs:
      - flutter@stable
    prebuild:
      - export FLUTTER_VERSION=$(cat .flutter-version)
      - git -C $$flutter$$ checkout -f $FLUTTER_VERSION
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get
      - find .pub-cache/ -type d \( -name "example" -o -name "test" -o -name "_out" -o -name "extension" \) -exec rm -rf {} +
    build:
      - export FLUTTER_ROOT=$$flutter$$
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter build apk --release

AutoUpdateMode: Version
UpdateCheckMode: Tags
UpdateCheckData: pubspec.yaml|version:\s.+\+(\d+)|.|version:\s(.+)\+
CurrentVersion: 0.5.4
CurrentVersionCode: 2
