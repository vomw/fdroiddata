Builds:
  - versionName: 0.5.4
    versionCode: 21
    commit: e650d8dedf0547edc15e35a7e69d9464586abd35
    sudo:
      - apt-get update
      - apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev
    output: build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
    srclibs:
      - flutter@stable
    prebuild:
      - export FLUTTER_VERSION=$(cat .flutter-version)
      - git -C $$flutter$$ checkout -f $FLUTTER_VERSION
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get
    scandelete:
      - .pub-cache
    build:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter build apk --release
    VercodeOperation: '%c * 10 + 1'

