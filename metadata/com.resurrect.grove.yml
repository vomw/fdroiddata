Categories:
  - Sports & Health
License: GPL-3.0-only
SourceCode: https://github.com/resurrectdev1/grove
IssueTracker: https://github.com/resurrectdev1/grove/issues

AutoName: Grove

RepoType: git
Repo: https://github.com/resurrectdev1/grove

Builds:
  - versionName: 0.5.4
    versionCode: 2
    commit: c0c9c87414bb764713d8cb86700764cc94d05294
    sudo:
      - apt-get update
      - apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev
    output: build/app/outputs/flutter-apk/app-release.apk
    srclibs:
      - flutter@3.24.5
    prebuild:
      - export FLUTTER_VERSION=$(cat .flutter-version)
      - git -C $$flutter$$ checkout $FLUTTER_VERSION
      - export FLUTTER_ROOT=$$flutter$$
      - export HOME=/home/vagrant
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get
    scandelete:
      - .pub-cache
    build:
      - export FLUTTER_ROOT=$$flutter$$
      - export HOME=/home/vagrant
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter build apk --release

AutoUpdateMode: Version
UpdateCheckMode: Tags
UpdateCheckData: pubspec.yaml|version:\s.+\+(\d+)|.|version:\s(.+)\+
CurrentVersion: 0.5.4
CurrentVersionCode: 2
