Builds:
  - versionName: 0.3.6
    versionCode: 306
    commit: 2e022f5093fc48e4fb8410df394f47d40773a2b5
    subdir: android
    sudo:
      - apt-get update
      - apt-get install -y ca-certificates curl
      - curl -Lo /tmp/node.tar.gz 
        https://nodejs.org/download/release/v26.8.2/node-v26.8.2-linux-x64.tar.gz
      - echo "badb3fe6a61b85e1352ca6564dc56b8b7bd5ecd5c474c52acc21dd0cdd586f35 
        /tmp/node.tar.gz" | sha256sum -c -
      - tar xzf /tmp/node.tar.gz --strip-components=1 -C /usr/local/
      - npm install --global pnpm@10.34.5
    gradle:
      - yes
    output: app/build/outputs/apk/release/radioscout-release.apk
    build:
      - cd ..
      - export SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
      - export TZ=UTC
      - pnpm install --frozen-lockfile
      - VITE_DISTRIBUTION=fdroid pnpm build
      - node scripts/normalize-ssr-timestamps.mjs dist/client
      - VITE_DISTRIBUTION=fdroid npx cap sync android
      - cd android
      - sed -i '/capgo-capacitor-updater/d' capacitor.settings.gradle
      - sed -i '/capgo-capacitor-updater/d' app/capacitor.build.gradle
      - node -e "const fs=require('fs');const 
        p='app/src/main/assets/capacitor.plugins.json';const 
        a=JSON.parse(fs.readFileSync(p,'utf8'));fs.writeFileSync(p,JSON.stringify(a.filter((x)=>x.pkg!=='@capgo/capacitor-updater'),null,2));"
    postbuild: rm -rf ../node_modules

AllowedAPKSigningKeys: 
  31a9b5f8ea747d0dd9ad9e8428e27d8a6e4219ecdf5a88d2f28f3f4a56417761

MaintainerNotes: |-
  The web bundle must be built with VITE_DISTRIBUTION=fdroid. That build flag
  disables both the Capgo OTA path and the GitHub APK update prompt so F-Droid
  remains the only update channel for this build.

  The signed F-Droid reference APK is published from the source repository's
  fdroid-reference-0.3.6-306 release and is used for reproducible-build
  verification.

