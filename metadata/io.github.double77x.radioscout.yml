Repo: https://github.com/Double77x/radioscout.git
Binaries: 
  https://github.com/Double77x/radioscout/releases/download/fdroid-reference-0.3.12-312/radioscout-fdroid-0.3.12-312.apk

Builds:
  - versionName: 0.3.12
    versionCode: 312
    commit: 2ea9563f02657b0fc16c20d20f6247c106450a39
    subdir: android/app
    sudo:
      - echo "deb https://deb.debian.org/debian forky main" > 
        /etc/apt/sources.list.d/forky.list
      - apt-get update
      - apt-get install -y -t forky npm
      - npm install --global pnpm@12.8.1
    gradle:
      - yes
    build:
      - cd ../..
      - export SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
      - export TZ=UTC
      - pnpm install --frozen-lockfile
      - VITE_DISTRIBUTION=fdroid pnpm exec vp run build
      - node scripts/normalize-ssr-timestamps.mjs dist/client
      - mv capacitor.config.ts capacitor.config.ts.fdroid
      - node -e "const 
        fs=require('fs');fs.writeFileSync('capacitor.config.json',JSON.stringify({appId:'io.github.double77x.radioscout',appName:'RadioScout',webDir:'dist/client',backgroundColor:'#eef1eb',android:{allowMixedContent:false},server:{androidScheme:'https',cleartext:false},plugins:{SplashScreen:{launchShowDuration:0},Keyboard:{resize:'body',resizeOnFullScreen:true},CapacitorUpdater:{autoUpdate:false,statsUrl:''}}},null,2))"
      - VITE_DISTRIBUTION=fdroid npx cap sync android
      - rm capacitor.config.json
      - mv capacitor.config.ts.fdroid capacitor.config.ts
      - cd android
      - sed -i '/capgo-capacitor-updater/d' capacitor.settings.gradle
      - sed -i '/capgo-capacitor-updater/d' app/capacitor.build.gradle
      - node -e "const fs=require('fs');const 
        p='app/src/main/assets/capacitor.plugins.json';const 
        a=JSON.parse(fs.readFileSync(p,'utf8'));fs.writeFileSync(p,JSON.stringify(a.filter((x)=>x.pkg!=='@capgo/capacitor-updater'),null,2));"

AllowedAPKSigningKeys: 
  31a9b5f8ea747d0dd9ad9e8428e27d8a6e4219ecdf5a88d2f28f3f4a56417761

MaintainerNotes: |-
  The web bundle must be built with VITE_DISTRIBUTION=fdroid. That build flag
  disables both the Capgo OTA path and the GitHub APK update prompt so F-Droid
  remains the only update channel for this build.

  The signed F-Droid reference APK is published from the source repository's
  fdroid-reference-0.3.12-312 release and is used for reproducible-build
  verification.

AutoUpdateMode: None
UpdateCheckMode: Static
