Builds:
  - versionName: 0.4.3
    versionCode: 403
    commit: 99693a59e8f25424d3621f6a915056b9a129f6cf
    subdir: android/app
    sudo:
      - echo "deb https://deb.debian.org/debian forky main" > /etc/apt/sources.list.d/forky.list
      - apt-get update
      - apt-get install -y -t forky npm jq
      - npm install --global pnpm@12.8.1
    gradle:
      - yes
    build:
      - cd ../..
      - export SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
      - export TZ=UTC
      - pnpm install --frozen-lockfile
      - VITE_DISTRIBUTION=fdroid pnpm exec vp run build
      - node scripts/strip-sw.mjs
      - node scripts/normalize-ssr-timestamps.mjs dist/client
      - mv capacitor.config.ts capacitor.config.ts.fdroid
      - cp capacitor.config.fdroid.json capacitor.config.json
      - VITE_DISTRIBUTION=fdroid npx cap sync android
      - rm capacitor.config.json
      - mv capacitor.config.ts.fdroid capacitor.config.ts
      - cd android
      - sed -i '/capgo-capacitor-updater/d' capacitor.settings.gradle app/capacitor.build.gradle
      - registry=app/src/main/assets/capacitor.plugins.json
      - jq -j '[.[] | select(.pkg != "@capgo/capacitor-updater")]' "$registry" > "$registry.tmp"
      - mv "$registry.tmp" "$registry"

AllowedAPKSigningKeys: 31a9b5f8ea747d0dd9ad9e8428e27d8a6e4219ecdf5a88d2f28f3f4a56417761

MaintainerNotes: |-
  The web bundle must be built with VITE_DISTRIBUTION=fdroid. That build flag
  disables both the Capgo OTA path and the GitHub APK update prompt so F-Droid
  remains the only update channel for this build.

  The recipe copies the tracked capacitor.config.fdroid.json over
  capacitor.config.json while cap sync runs, because Capacitor reads
  capacitor.config.ts ahead of the JSON and the buildserver's Node cannot load
  the TypeScript config. The checked-in JSON is the F-Droid flavour of that
  config, and pnpm fdroid:check in the source repository fails if the two drift.

  Updates follow the v* tags. Upstream encodes versionCode as
  major * 10000 + minor * 100 + patch and commits the result in
  android/app/build.gradle, so every tag carries a matching version code and
  fdroid checkupdates can pick the newest one. Note that the v0.3.6 tag predates
  that scheme and still declares versionCode 202; it is older than the current
  version code and is ignored.

  Reproducible-build verification uses the signed reference APK published from
  the source repository's fdroid-reference-<version>-<versionCode> release,
  which the F-Droid reference workflow publishes on every v* tag. A new tag
  therefore has such a release within a few minutes of being pushed; until it
  appears, binary verification of that version will not find a reference to
  compare against.

AutoUpdateMode: Version
UpdateCheckMode: Tags ^v[0-9.]+$
UpdateCheckData: 'android/app/build.gradle|versionCode\s(\d+)||v([\d.]+)'
