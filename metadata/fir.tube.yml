Builds:
  - versionName: '2.0'
    versionCode: 2
    commit: v2.0
    subdir: app
    sudo:
      - apt-get update
      - apt-get install -y rustup gcc libc-dev
    prebuild:
      - rustup default 1.94.0
      - rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android
      - cargo install cargo-ndk
      - pushd app/src/main/rust
      - cargo ndk -t arm64-v8a -t armeabi-v7a -t x86_64 build --release
      - popd
      - mkdir -p app/src/main/jniLibs/arm64-v8a app/src/main/jniLibs/armeabi-v7a app/src/main/jniLibs/x86_64
      - cp app/src/main/rust/target/aarch64-linux-android/release/libargon_security.so app/src/main/jniLibs/arm64-v8a/
      - cp app/src/main/rust/target/armv7-linux-androideabi/release/libargon_security.so app/src/main/jniLibs/armeabi-v7a/
      - cp app/src/main/rust/target/x86_64-linux-android/release/libargon_security.so app/src/main/jniLibs/x86_64/
    gradle:
      - yes



