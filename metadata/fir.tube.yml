Builds:
  - versionName: '2.0'
    versionCode: 2
    commit: v2.0
    subdir: app
    sudo:
      - apt-get update
      - apt-get install -y rustup gcc libc-dev
    prebuild:
      - rustup default 1.94.0
      - rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android
      - pushd src/main/rust
      - export TOOLCHAIN_BIN=$(find /opt/android-sdk -name "aarch64-linux-android29-clang" -exec dirname {} \;)
      - export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$TOOLCHAIN_BIN/aarch64-linux-android29-clang
      - export CARGO_TARGET_ARMV7_LINUX_ANDROIDEABI_LINKER=$TOOLCHAIN_BIN/armv7a-linux-androideabi29-clang
      - export CARGO_TARGET_X86_64_LINUX_ANDROID_LINKER=$TOOLCHAIN_BIN/x86_64-linux-android29-clang
      - cargo build --target aarch64-linux-android --release
      - cargo build --target armv7-linux-androideabi --release
      - cargo build --target x86_64-linux-android --release
      - popd
      - mkdir -p src/main/jniLibs/arm64-v8a src/main/jniLibs/armeabi-v7a src/main/jniLibs/x86_64
      - cp src/main/rust/target/aarch64-linux-android/release/libargon_security.so src/main/jniLibs/arm64-v8a/
      - cp src/main/rust/target/armv7-linux-androideabi/release/libargon_security.so src/main/jniLibs/armeabi-v7a/
      - cp src/main/rust/target/x86_64-linux-android/release/libargon_security.so src/main/jniLibs/x86_64/




