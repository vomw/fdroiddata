Repo: https://github.com/sirdeepsleep/FirTube/
Binaries: https://github.com/sirdeepsleep/FirTube/releases/download/v%v/app-release.apk

Builds:
  - versionName: '3.0'
    versionCode: 3
    commit: v3.0
    subdir: app
    ndk: r27d
    scanignore:
      - app/src/main/jniLibs/arm64-v8a/libargon_security.so
      - app/src/main/jniLibs/armeabi-v7a/libargon_security.so
      - app/src/main/jniLibs/x86_64/libargon_security.so
    sudo:
      - apt-get update
      - apt-get install -y rustup gcc libc-dev
    prebuild:
      - rustup default 1.94.0
      - rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android
      - cargo install cargo-ndk
      - pushd src/main/rust
      - export RUSTFLAGS="-C strip=symbols -C codegen-units=1 --remap-path-prefix=$(pwd)=/build"
      - cargo ndk -t arm64-v8a -t armeabi-v7a -t x86_64 build --release
      - popd
      - mkdir -p src/main/jniLibs/arm64-v8a src/main/jniLibs/armeabi-v7a src/main/jniLibs/x86_64
      - cp src/main/rust/target/aarch64-linux-android/release/libargon_security.so src/main/jniLibs/arm64-v8a/
      - cp src/main/rust/target/armv7-linux-androideabi/release/libargon_security.so src/main/jniLibs/armeabi-v7a/
      - cp src/main/rust/target/x86_64-linux-android/release/libargon_security.so src/main/jniLibs/x86_64/
      - rm -rf src/main/rust/target
    gradle:
      - yes

