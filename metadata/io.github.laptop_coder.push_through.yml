Categories:
  - Sports & Health
License: MIT
AuthorName: Laptop Coder
SourceCode: https://github.com/laptop-coder/push-through
IssueTracker: https://github.com/laptop-coder/push-through/issues

AutoName: Push Through! Workouts

RepoType: git
Repo: https://github.com/laptop-coder/push-through

Builds:
  - versionName: 0.10.0
    versionCode: 1000001
    commit: v0.10.0
    subdir: app
    sudo:
      - apt-get update
      - apt-get install -y ninja-build libgtk-3-dev
    srclibs:
      - flutter@3.44.3
    prebuild:
      - $$flutter$$/bin/flutter pub get
    build:
      - $$flutter$$/bin/flutter build apk --release --target-platform android-arm64
      - mv build/app/outputs/flutter-apk/app-release.apk arm64.apk
    output: arm64.apk
  - versionName: 0.10.0
    versionCode: 1000002
    commit: v0.10.0
    subdir: app
    sudo:
      - apt-get update
      - apt-get install -y ninja-build libgtk-3-dev
    srclibs:
      - flutter@3.44.3
    prebuild:
      - $$flutter$$/bin/flutter pub get
    build:
      - $$flutter$$/bin/flutter build apk --release --target-platform android-arm
      - mv build/app/outputs/flutter-apk/app-release.apk arm.apk
    output: arm.apk
  - versionName: 0.10.0
    versionCode: 1000003
    commit: v0.10.0
    subdir: app
    sudo:
      - apt-get update
      - apt-get install -y ninja-build libgtk-3-dev
    srclibs:
      - flutter@3.44.3
    prebuild:
      - $$flutter$$/bin/flutter pub get
    build:
      - $$flutter$$/bin/flutter build apk --release --target-platform android-x64
      - mv build/app/outputs/flutter-apk/app-release.apk x64.apk
    output: x64.apk

UpdateCheckMode: Tags
AutoUpdateMode: Version v%v
