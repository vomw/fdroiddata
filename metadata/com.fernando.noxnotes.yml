AutoName: NoxNotes
Summary: Aplicación intuitiva para la gestión de notas rápidas
Description: |-
  NoxNotes es una aplicación personal e intuitiva para la gestión y registro de notas rápidas, desarrollada con tecnologías web y empaquetada como aplicación nativa para Android.
  
  Características principales:
  * Gestión de Notas: Creación, edición y almacenamiento rápido y sencillo.
  * Interfaz Limpia: Diseño enfocado en la usabilidad móvil.
  * Almacenamiento Local: Funcionamiento ágil y ligero directamente en el dispositivo, sin necesidad de conexión.

RepoType: git
Repo: https://github.com/fernandonavarro8700-cyber/noxnotes

Builds:
  - versionName: '1.0.0'
    versionCode: 10000
    commit: main
    output: platforms/android/app/build/outputs/apk/release/app-release-unsigned.apk
    build:
      - npm install -g cordova
      - npm install
      - cordova platform add android
      - cordova build android --release
      CurrentVersion: '1.0.0'
