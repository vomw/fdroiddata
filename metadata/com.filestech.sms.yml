WebSite: https://files-tech.com/sms-tech.php
SourceCode: https://github.com/gitubpatrice/SMS-TECH
IssueTracker: https://github.com/gitubpatrice/SMS-TECH/issues
Changelog: https://github.com/gitubpatrice/SMS-TECH/blob/HEAD/CHANGELOG.md

AutoName: SMS Tech

RepoType: git
Repo: https://github.com/gitubpatrice/SMS-TECH.git

AntiFeatures:
  - NonFreeDep
  # SMS Tech depends on com.google.mlkit:text-recognition for the OCR
  # feature on incoming MMS image attachments (e.g. receipts auto-extracted).
  # ML Kit is a Google proprietary library, hence NonFreeDep. Migration to
  # ONNX Runtime + PaddleOCR text-recognition model (Apache 2.0) is planned
  # for SMS Tech v1.7.x — at which point this AntiFeature will be removed.

Builds:
  - versionName: 1.6.2
    versionCode: 55
    commit: 83f2bd002b22cd7205449a7e086d48a283a2545b
    subdir: app
    gradle:
      - yes
    rm:
      - app/lint-baseline.xml
    prebuild:
      - sed -i -e '/keystoreProps = Properties/,/}/d' build.gradle.kts
      - sed -i -e '/signingConfigs/,/}\s*$/d' build.gradle.kts
      - sed -i -e '/if (keystoreProps.isNotEmpty()) signingConfig/d' build.gradle.kts

AutoUpdateMode: Version
UpdateCheckMode: Tags
UpdateCheckData: 'app/build.gradle.kts|versionName\s*=\s*"(.*?)"|.|versionCode\s*=\s*(\d+)'
CurrentVersion: 1.6.2
CurrentVersionCode: 55
