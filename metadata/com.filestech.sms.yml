MaintainerNotes: |-
  gitubpatrice: the UpdateCheckData regexes are anchored with (?m)^ deliberately. checkupdates
  calls re.search with no flags over the whole file, and version.properties carries the literal
  string versionCode=1 inside a comment documenting an old build defect. Unanchored,
  versionCode=(\d+) matches that comment instead of the assignment, so the check would read 1
  where the real value is 286, and report nothing. Measured on v1.27.10: unanchored yields 1 out
  of 2 matches, anchored yields 286 as the single match.
  .
  versionName is captured with (\S+) rather than (.+) because checkupdates strips the version
  code but not the version name, so a CRLF checkout would otherwise carry a trailing carriage
  return into the metadata.

AutoUpdateMode: Version
UpdateCheckMode: Tags ^v\d+\.\d+\.\d+$
UpdateCheckData: version.properties|(?m)^versionCode=(\d+)|.|(?m)^versionName=(\S+)
