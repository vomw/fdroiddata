Summary: Manage your TV show library and stream episodes.
Description: |-
    TV Shows Library is a comprehensive tool for managing your favorite TV series.

    Features:
    - Search for TV shows and get detailed information via TVMaze integration.
    - Maintain a personal list of shows you're watching.
    - View episode lists, summaries, and high-quality posters.
    - Import and edit custom M3U playlists for streaming episodes directly.
    - Advanced episode filtering with support for regex and case sensitivity.
    - Export and share your entire configuration and library data.
    - Built with a modern Jetpack Compose interface.

