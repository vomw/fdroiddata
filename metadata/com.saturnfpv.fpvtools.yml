# ==============================================================================
# AUDITING & COMPLIANCE NOTES:
# 
# 1. Naming Override/Rename Strategy:
#    To comply with F-Droid's requirement for human-readable (unminified) source
#    code, we have packaged the unminified development source files for:
#    - React (react.development.js)
#    - React-DOM (react-dom.development.js)
#    - Babel Standalone (babel.js)
#    - Leaflet (leaflet-src.js)
#    - JSZip (jszip.js)
#    under their original minified names (e.g. react.production.min.js) in the
#    'fdroid' build flavor assets folder: android/app/src/fdroid/assets/js/
#    This keeps HTML link imports static across web and mobile configurations.
#
# 2. Chart.js Scanignore Exception:
#    Chart.js v4.x does not distribute an unminified pre-built UMD bundle.
#    Since UMD is required for script-tag injection in our offline WebView,
#    we continue using the standard minified 'chart.umd.min.js' build.
#    We ignore it from automated audits using the scanignore key below.
# ==============================================================================

AutoUpdateMode: Version %v
UpdateCheckMode: Tags

