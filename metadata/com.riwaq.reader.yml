# Riwaq is a Tauri 2 app — a Rust binary with a web frontend — so this is not
# a plain Gradle build.
#
# Reproducible: upstream CI builds every release with THIS recipe inside
# F-Droid's own build image and compares the result with the published APK
# before the release goes out. v0.6.0 was confirmed byte-identical that way.
#
# Why the unusual steps:
#   * prebuild removes org.gradle.java.home, which the Tauri CLI writes
#     pointing at whichever machine generated the Android project, and nulls
#     the debug signingConfig so the APK comes out unsigned.
#   * the Gradle wrapper jar is not committed, so it is regenerated from the
#     version the wrapper properties name.
#   * RUSTFLAGS comes from scripts/android-rustflags.sh in the source tree. It
#     remaps source paths out of the native library, which is what lets two
#     builds on different machines come out identical.

AntiFeatures:
  NonFreeNet:
    en-US: The optional Store browses third-party novel websites. Reading your own
      EPUB, PDF and DOCX files works fully offline.
Categories:
  - Ebook Reader
  - Reading
License: MIT
AuthorName: Mostafa Osama
SourceCode: https://github.com/TheMostafaOsamaDev/Riwaq-Reader
IssueTracker: https://github.com/TheMostafaOsamaDev/Riwaq-Reader/issues
Changelog: https://github.com/TheMostafaOsamaDev/Riwaq-Reader/releases

AutoName: Riwaq

RepoType: git
Repo: https://github.com/TheMostafaOsamaDev/Riwaq-Reader.git
Binaries: https://github.com/TheMostafaOsamaDev/Riwaq-Reader/releases/download/v%v/app-universal-release.apk

Builds:
  - versionName: 0.6.0
    versionCode: 6000
    commit: 56e20c5562e62a0f7528902a6e7dcc7082869684
    sudo:
      - apt-get update
      - apt-get install -y build-essential nodejs npm
      - npm install -g pnpm@9
    output: src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release-unsigned.apk
    srclibs:
      - rustup@1.28.2
    prebuild:
      - sed -i '/^org\.gradle\.java\.home=/d' src-tauri/gen/android/gradle.properties
      - sed -i 's/signingConfigs.getByName("debug")/null/' src-tauri/gen/android/app/build.gradle.kts
    build:
      - $$rustup$$/rustup-init.sh -y --profile minimal --default-toolchain 1.97.1
        --target aarch64-linux-android,armv7-linux-androideabi
      - source $HOME/.cargo/env
      - export NDK_HOME=$$NDK$$
      - pnpm install --frozen-lockfile
      - wrapper=$PWD/src-tauri/gen/android/gradle/wrapper
      - (cd "$(mktemp -d)" && touch settings.gradle && gradle wrapper --gradle-version "$(sed -n 's/.*gradle-\(.*\)-bin\.zip/\1/p'
        "$wrapper/gradle-wrapper.properties")" && cp gradle/wrapper/gradle-wrapper.jar
        "$wrapper/")
      - RUSTFLAGS="$(bash scripts/android-rustflags.sh)" pnpm tauri android build
        --apk --target aarch64 armv7
    ndk: 29.0.14206865

AllowedAPKSigningKeys: 83cb81f108b4f2448b20a5f5f714ea22d4a0f6712035a6df9c4bf7f2d10291e2

AutoUpdateMode: Version
UpdateCheckMode: Tags ^v[0-9.]+$
