AutoName: Areada
Summary: A lightweight offline EPUB, TXT, and PDF reader.

Description: |-
  Areada is a minimal offline Android reader focused on lightweight local reading.

  It supports EPUB, TXT, and PDF files, with a clean monochrome interface, local library access, saved reading progress, table of contents navigation, bookmarks, and basic plain-text note support.

  Features include EPUB, TXT, and PDF support, local library access using Android Storage Access Framework, recent documents, saved reading progress, reader settings, EPUB chapter rendering, PDF rendering, bookmarks, table of contents navigation, pinch-to-zoom, and offline-only use.

  Areada has no internet permission, no ads, no analytics, and no tracking.

