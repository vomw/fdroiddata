AutoName: Wormhole

RepoType: git
Repo: https://github.com/UjuiUjuMandan/wormhole

Builds:
  - versionName: 1.1.7
    versionCode: 5451
    commit: e5847a19f88ee3467e80ded94d718589ad547073
    sudo:
      - echo "deb http://deb.debian.org/debian sid main" > /etc/apt/sources.list.d/sid.list
      - apt-get update
      - apt-get install -y rustup clang
      - apt-get install -y -t sid openjdk-17-jdk-headless
      - update-java-alternatives -s java-1.17.0-openjdk-amd64
    output: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
    binary: 
      https://github.com/wormhole-app/wormhole/releases/download/%v/wormhole-android-openSource-arm64-v8a.apk
    srclibs:
      - flutter@stable
    prebuild:
      - export flutterVersion=$(sed -n -E "s/.*flutter:\s([0-9.]+)/\1/p" pubspec.yaml)
      - '[[ $flutterVersion ]]'
      - git -C $$flutter$$ checkout -f $flutterVersion
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter packages pub get
      - sed -i -e 's/usr\/local\/lib\/android\/sdk/opt\/android-sdk/' android/gradle.properties
    scandelete:
      - .pub-cache
    build:
      - export RUST_VERSION=$(sed -n -E 's/channel = "(.*)"/\1/p' rust/rust-toolchain.toml)
      - export CARGO_NDK_VERSION=$(sed -E -n 's/.*CARGO_NDK_VERSION.*"(.*)".*/\1/p'
        .github/workflows/build.yml)
      - rustup default $RUST_VERSION
      - rustup target add aarch64-linux-android
      - cargo install cargo-ndk@$CARGO_NDK_VERSION --locked
      - sed -i -e "s/'stable'/'$RUST_VERSION'/" rust_builder/cargokit/build_tool/lib/src/builder.dart
      - bash scripts/prepare-fdroid-build.sh
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter pub get
      - $$flutter$$/bin/flutter gen-l10n
      - $$flutter$$/bin/flutter build apk --split-per-abi --target-platform="android-arm64"
    ndk: 27.0.12077973

AllowedAPKSigningKeys: 57f6f8e77292e1615de23d43497f007e25685ab154696d31bd103296ed653518

AutoUpdateMode: Version
UpdateCheckMode: Tags
VercodeOperation:
