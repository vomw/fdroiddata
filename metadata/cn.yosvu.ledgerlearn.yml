RepoType: git
Repo: https://github.com/Maicarons/ledgerlearn

Builds:
  - versionName: 0.8.2
    versionCode: 120
    commit: aa649a6d02774589d402cd8c5492db35ed808c39
    srclibs:
      - flutter@stable
    rm:
      - ios
      - linux
      - macos
      - web
      - windows
    prebuild:
      - flutterVersion=$(grep -m1 flutter-version .github/workflows/release.yml | sed -E "s/.*flutter-version:[[:space:]]+'?([^'\"[:space:]]+)'?.*/\1/")
      - '[[ $flutterVersion ]] || exit 1'
      - git -C $$flutter$$ fetch --tags --force origin
      - git -C $$flutter$$ checkout -f $flutterVersion
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get --enforce-lockfile
    scanignore:
      - .flutter/bin/cache
    scandelete:
      - .pub-cache
    build:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter build apk --release --split-per-abi --target-platform=android-arm64
    output: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
