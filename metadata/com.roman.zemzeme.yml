AutoName: Zemzeme
Description: |-
  Zemzeme is a private, serverless messaging app for Android. It supports three
  independent communication methods that can operate simultaneously: offline
  Bluetooth mesh, direct peer-to-peer over the internet (via libp2p + ICE), and
  relay-based messaging via the Nostr protocol.

  All messages are end-to-end encrypted using the Noise Protocol (Noise_NK,
  Curve25519 + ChaCha20-Poly1305). No registration, no phone number, no central
  server required.

  Features:

  * Text messages with formatting and @mention support
  * Voice notes and image/file sharing
  * Read receipts and delivery indicators
  * Password-protected channels
  * Geohash-based public channels (city to country granularity)
  * BLE mesh networking for offline communication
  * P2P connections via libp2p with ICE NAT traversal
  * Nostr relay transport for internet-based messaging
  * Ed25519 signed QR codes for peer identity verification
  * Biometric + PIN app lock

  Zemzeme is a fork of bitchat (v1.7.0), extended with internet-capable
  transport layers.

