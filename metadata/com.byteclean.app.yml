AutoName: byteTrack
Description: |
  An on-device habit and behavior tracker built with a security-by-design
  approach. No internet permission is declared anywhere in the app, so it
  cannot transmit data off the device. Local data is stored in an
  encrypted database (SQLCipher), and deleting a habit permanently removes
  it and its history.

  Originally built as a food tracker, but works for tracking any habit:
  sugar intake, junk food, or general accountability goals.

  * No accounts, no cloud sync, no analytics or crash-reporting SDKs
  * No ads or trackers of any kind
  * Encrypted local-only storage

