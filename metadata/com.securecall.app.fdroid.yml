Builds:
  - versionName: 1.0.24
    versionCode: 45001
    commit: 67efccac721af1237edafa77fc032a056302dfe2
    subdir: client_android/app
    sudo:
      - apt-get update
      - apt-get install -y build-essential rustup
    gradle:
      - fdroid
    output: build/outputs/apk/fdroid/release/app-fdroid-arm64-v8a-release-unsigned.apk
    prebuild:
      - echo "org.gradle.jvmargs=-Xmx2048m" > ../gradle.properties
      - echo "android.useAndroidX=true" >> ../gradle.properties
      - echo "android.enableJetifier=true" >> ../gradle.properties
      - echo "android.enableGlobalSynthetics=true" >> ../gradle.properties
      - export ANDROID_NDK_ROOT=$$NDK$$
      - rustup default 1.82.0
      - rustup target add aarch64-linux-android
      - cargo install cargo-ndk@3.4.0 --locked
      - cd ../../core_crypto && cargo ndk -t arm64-v8a -o ../client_android/app/src/main/jniLibs
        build --release
    scanignore:
      - client_android/build.gradle
    scandelete:
      - client_android/app/src/main/jniLibs/
      - core_crypto/target/
    ndk: 27.0.12077973

