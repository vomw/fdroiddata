AutoName: Bongo Budget
Description: |-
  Bongo Budget is a private, offline-first personal finance manager focused on
  master budget pools, dynamic category quotas, and daily spendable allowances.

  Key Features:
  * Master Overall Budget pool with live available balance calculation
  * Category quotas with pace-aware daily spending allowances
  * Automatic overspending deduction & category rebalancing
  * Dual-mode JSON data backup and restore via Storage Access Framework
  * Pure AMOLED black theme designed for battery conservation
  * 100% offline with zero network permissions, zero tracking, and zero ads

