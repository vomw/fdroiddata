AutoName: Headless DLNA Player

Summary: Headless DLNA/UPnP renderer for LAN media playback.

Description: |-
  A headless Android DLNA/UPnP MediaRenderer (DMR). The app advertises
  itself on the local network via SSDP so that any DLNA controller —
  such as the Home Assistant DLNA DMR integration or Bubble UPnP — can
  push video and audio streams to the device and control playback
  remotely without any on-screen UI.

  The screen shows a plain black surface; all interaction happens
  through the DLNA protocol. Volume and mute are routed through the
  Android AudioManager.

  Compatible with Home Assistant's built-in DLNA DMR integration.
  Supports HTTP and HLS streams as well as common audio and video
  container formats handled by ExoPlayer.

  Note: cleartext HTTP is intentionally permitted because many DLNA
  control points in local networks still use plain HTTP URLs.

