AutoName: PB Schedule Viewer
Summary: App for viewing event schedules for the Roblox group "Pinewood Builders"
Description: |
    This app allows you to view schedules and quickly schedule support/response events for the Roblox group Pinewood Builders.
    It allows you to view schedules from all the subgroups in both calendar and classic list mode with all details, including UNIX timestamp, time in both local and UTC.
    The app was built with permission using the Kronos API rehosted on my domain, however it is being hosted through the use of an API key in the server.
Repo: https://github.com/themetalshard/PBScheduleViewer
RepoType: git
Builds:
  - versionName: 1.2
    versionCode: 1
    commit: v1.2
    subdir: .
    gradle:
      - yes
    output: build/outputs/apk/release/app-release-unsigned.apk
