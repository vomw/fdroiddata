AutoName: Teer Calculator

Summary: Common-number frequency analyzer and winnings estimator
Description: |
  Teer Calculator is a simple, offline-first tool for followers of Juwai,
  Shillong and Khanapara Teer results.

  * Common Number Analyzer: enter previous FR and SR results for up to 30
    days. The app counts how often each house digit and ending digit appeared,
    shows the most frequent numbers, and suggests combinations to watch.
  * Winnings Estimator: enter a stake amount and the counter payout rate to
    estimate possible winnings for Direct, House, Ending and Forecast types.
  * Results: quick links to the latest published results. Links open in the
    phone browser.

  The calculators work fully on the device. The app collects no personal data,
  needs no account, and requests zero Android permissions. Past result
  frequency does not decide future rounds; every round is an independent event.

