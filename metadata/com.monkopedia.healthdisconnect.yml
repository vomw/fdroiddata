AutoName: Health Disconnect

Description: |
  Health Disconnect is an Android app for browsing health data from Health
  Connect, rendering metric charts, and managing multiple chart views.

  Features:
  * View Health Connect data in customizable charts and widgets
  * Create and manage multiple data views
  * Fully offline — no cloud, no tracking
  * Private and ad-free

