Builds:
  - versionName: 0.5.8
    versionCode: 1070
    commit: 7aca4d3d2ff3aa6b218024805208e21b63d6fd48
    output: build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
    binary: 
      https://github.com/likhithpraveenk/storii/releases/download/v%v/storii-v%v-armeabi.apk
    srclibs:
      - flutter@stable
    rm:
      - ios
    prebuild:
      - flutterVersion=$(sed -n -E 
        's/^[[:space:]]*flutter:[[:space:]]+([0-9]+\.[0-9]+\.[0-9]+)/\1/p' 
        pubspec.yaml)
      - '[[ $flutterVersion ]]'
      - git -C $$flutter$$ checkout -f $flutterVersion
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get --enforce-lockfile
      - sed -i -e 's/-Wl,/-Wl,--build-id=none,/' 
        ${PUB_CACHE}/hosted/*/jni-*/src/CMakeLists.txt
    scandelete:
      - .pub-cache
    build:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter build apk --release --split-per-abi 
        --target-platform=android-arm

