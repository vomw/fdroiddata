License: Apache-2.0
AuthorName: The Gandabherunda
SourceCode: https://github.com/TheGandabherunda/OpenJot
IssueTracker: https://github.com/TheGandabherunda/OpenJot/issues
Changelog: https://github.com/TheGandabherunda/OpenJot/releases
RepoType: git
Repo: https://github.com/TheGandabherunda/OpenJot

Builds:
  - versionName: 1.0.0
    versionCode: 1
    commit: v1.0.0
    output: build/app/outputs/flutter-apk/app-release.apk
    srclibs:
      - flutter@stable
    rm:
      - ios
      - linux
      - macos
      - web
      - windows
    prebuild:
      - flutterVersion=$(sed-n-E'/^environment:/,/^dependencies:/{s/^[[:space:]]*flutter:[[:space:]]*["'\'']?[^0-9]*([0-9]+\.[0-9]+\.[0-9]+).*["'\'']?/\1/p}' pubspec.yaml)
      - '[[ $flutterVersion ]] || exit 1'
      - git -C $$flutter$$ checkout -f $flutterVersion
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get
    scanignore:
      - .pub-cache
    build:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter build apk --release --target-platform=android-arm64

AllowedAPKSigningKeys: 2a0e967dfb7bae9dd55daeb645b99feaa9ae5c6306e0e854b4d8b06d2d1bcb0d
AutoUpdateMode: Version
UpdateCheckMode: Tags
UpdateCheckData: pubspec.yaml|version:\s.+\+(\d+)|.|version:\s(.+)\+
CurrentVersion: 1.0.0
CurrentVersionCode: 1
