Categories:
  - Local Media Player
  - Multimedia
License: GPL-3.0-or-later
AuthorName: Siar
AuthorEmail: support@amphi.site
AuthorWebSite: https://github.com/siar1234
WebSite: https://amphi.site
SourceCode: https://github.com/amphi2024/music
IssueTracker: https://github.com/amphi2024/music/issues

AutoName: Music

RepoType: git
Repo: https://github.com/amphi2024/music.git

Builds:
  - versionName: 2.0.0
    versionCode: 3
    commit: 64322db68645d263dde83cccf34cf4b770b7d73d
    output: build/app/outputs/flutter-apk/app-release.apk
    srclibs:
      - flutter@stable
    rm:
      - ios
      - macos
      - linux
      - windows
      - web
      - test
      - snap
      - scripts
    prebuild:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - export PATH=$PUB_CACHE/bin/:$$flutter$$/bin/:$PATH
      - flutterVersion=$(sed -n -E "s/^\s+flutter:\s*([0-9.]+)/\1/p" pubspec.yaml)
      - '[[ $flutterVersion ]]'
      - git -C $$flutter$$ checkout -f $flutterVersion
      - flutter config --no-analytics
      - flutter pub get
      - flutter precache
    scandelete:
      - .pub-cache
    build:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - export PATH=$PUB_CACHE/bin/:$$flutter$$/bin/:$PATH
      - flutter build apk

AutoUpdateMode: Version
UpdateCheckMode: Tags v[\d.]+
UpdateCheckData: pubspec.yaml|version:\s.+\+(\d+)|.|version:\s(.+)\+
CurrentVersion: 2.0.0
CurrentVersionCode: 3
