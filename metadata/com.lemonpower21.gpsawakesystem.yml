Summary: Location-based alarm for commuters using OpenStreetMap.
Description: |-
    An Android application designed to wake you up with a loud alarm when you enter 
    a specific geographic radius. Perfect for commuters who fall asleep on trains 
    or buses. It uses OpenStreetMap (Osmdroid) to ensure maximum privacy and 
    independence from Google Play Services. Features include interactive geofencing, 
    background monitoring via Foreground Service, and battery-efficient GPS updates.

