AutoName: PC HW Monitor
Description: |-
  PC HW Monitor shows your Windows PC's real-time hardware stats
  (CPU, GPU, iGPU, RAM) on your Android phone over local Wi-Fi.

  A companion Windows server reads sensor data via an embedded
  LibreHardwareMonitor library and streams it over WebSocket to the
  Android app, which displays live charts and keeps a 1-hour history.

  No cloud, no account, no internet connection required — everything
  stays on your local network.

  The app is fully localized into multiple languages, including
  English and Turkish.

