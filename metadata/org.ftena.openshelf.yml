Categories:
  - Reading
License: GPL-3.0-only
SourceCode: https://github.com/Swappppy/Openshelf
IssueTracker: https://github.com/Swappppy/Openshelf/issues
Translation: https://hosted.weblate.org/projects/openshelf/

AutoName: Openshelf
Summary: Personal library manager and book tracker
RepoType: git
Repo: https://github.com/Swappppy/Openshelf

Builds:
  - versionName: 1.0.0
    versionCode: 1
    commit: v1.0.0
    subdir: android/app
    output: ../../build/app/outputs/flutter-apk/app-release.apk
    srclibs:
      - flutter@stable
    prebuild:
      - export PATH=$$flutter$$/bin:$$PATH
      - cd ../..
      - flutter pub get
    build:
      - export PATH=$$flutter$$/bin:$$PATH
      - flutter build apk --release --target-platform android-arm64

AutoUpdateMode: Version
UpdateCheckMode: Tags
CurrentVersion: 1.0.0
CurrentVersionCode: 1
