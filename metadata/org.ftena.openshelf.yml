Summary: Gestor de biblioteca personal y rastreador de libros (FOSS).
Description: |-
    Openshelf es un gestor de biblioteca personal gratuito y de código abierto.
    Funciona como un rastreador de lectura completo y una herramienta de archivo de libros.
    Todo permanece en tu dispositivo: no se requiere cuenta y ningún dato sale de tu teléfono.

    Características:
    * Vistas dinámicas (Lista/Cuadrícula).
    * Estado de lectura rastreable.
    * Búsqueda potente y filtrado avanzado.
    * Gestión de categorías, sellos editoriales y colecciones.
    * Escáner híbrido (Código de barras e ISBN mediante OCR).
    * Estadísticas detalladas y widgets personalizables.

RepoType: git
Repo: https://github.com/Swappppy/Openshelf

Builds:
  - versionName: 1.0.0
    versionCode: 1
    commit: v1.0.0
    subdir: android/app
    srclibs:
      - flutter@stable
    prebuild:
      - pushd ../..
      - $$flutter$$ pub get
      - popd
    build:
      - $$flutter$$ build apk --release --target-platform android-arm64
    output: ../../build/app/outputs/flutter-apk/app-release.apk

AutoUpdateMode: Version v%v
