Builds:
  - versionName: 2.5.4
    versionCode: 2050401
    commit: d4cb6cbfa4ad01772e66de4c08a9c88c7c837f26
    output: build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
    binary: 
      https://github.com/wizsk/arabic_lexicons_fdroid_rel/releases/download/v%v/app-armeabi-v7a-release.apk
    srclibs:
      - flutter@3.44.1
    rm:
      - ios
      - linux
      - macos
      - web
      - windows
    prebuild:
      - cd ..
      - mv io.github.wizsk.arabic_lexicons /tmp/build
      - pushd /tmp/build/
      - unzip -o assets/data/db/db.sqlite.zip -d assets/data/db/
      - rm assets/data/db/db.sqlite.zip
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter packages pub get
      - sed -i -e 's/-Wl,/-Wl,--build-id=none,/' ${PUB_CACHE}/hosted/*/jni-*/src/CMakeLists.txt
      - popd
      - mv /tmp/build io.github.wizsk.arabic_lexicons
    scandelete:
      - .pub-cache
    build:
      - cd ..
      - mv io.github.wizsk.arabic_lexicons /tmp/build
      - pushd /tmp/build/
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter build apk --release --split-per-abi --target-platform="android-arm"
        --dart-define=APP_STORE="F-Droid" --dart-define=APP_VERSION="$$VERSION$$"
      - popd
      - mv /tmp/build io.github.wizsk.arabic_lexicons

