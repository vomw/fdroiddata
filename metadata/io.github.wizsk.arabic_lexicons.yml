Builds:
  - versionName: 2.5.3
    versionCode: 2050301
    commit: f0ea47bebcc6403a459a034464bddfafaa3c7c73
    output: build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
    binary: 
      https://github.com/wizsk/arabic_lexicons_fdroid_rel/releases/download/v%v/app-armeabi-v7a-release.apk
    srclibs:
      - flutter@stable
    rm:
      - ios
      - linux
      - macos
      - web
      - windows
    prebuild:
      - cd ..
      - mv io.github.wizsk.arabic_lexicons /tmp/build
      - pushd /tmp/build/
      - unzip -o assets/data/db.sqlite.zip -d assets/data/
      - rm assets/data/db.sqlite.zip
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter packages pub get
      - popd
      - mv /tmp/build io.github.wizsk.arabic_lexicons
    scandelete:
      - .pub-cache
    build:
      - cd ..
      - mv io.github.wizsk.arabic_lexicons /tmp/build
      - pushd /tmp/build/
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter build apk --release --split-per-abi --target-platform="android-arm"
        --dart-define=APP_STORE="F-Droid" --dart-define=APP_VERSION="$$VERSION$$"
      - popd
      - mv /tmp/build io.github.wizsk.arabic_lexicons

