Builds:
  - versionName: 2.4.0
    versionCode: 204001
    commit: v2.4.0
    output: build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
    srclibs:
      - flutter@stable
    rm:
      - ios
      - linux
      - macos
      - web
      - windows
    prebuild:
      - unzip -o assets/data/db.sqlite.zip -d assets/data/
      - rm assets/data/db.sqlite.zip
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter packages pub get
    scandelete:
      - .pub-cache
    build:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter build apk --release --split-per-abi --target-platform="android-arm" --dart-define=APP_STORE="F-Droid"

  - versionName: 2.4.0
