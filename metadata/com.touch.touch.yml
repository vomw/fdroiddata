License: GPL-3.0-or-later
WebSite: https://github.com/E33-a/ThaClick
SourceCode: https://github.com/E33-a/ThaClick
IssueTracker: https://github.com/E33-a/ThaClick/issues

Name: ThaClick
Summary: Auto-Clicker agnóstico, seguro y profesional
Description: |-
  ThaClick es un Auto-Clicker de código abierto desarrollado con Flutter y Kotlin nativo.
  Permite configurar patrones complejos de clics automatizados con una
  exclusiva función de humanización (jitter) para evitar heurísticas de
  detección. Soporta múltiples bucles, guardado de patrones y tiempos de espera.

RepoType: git
Repo: https://github.com/E33-a/ThaClick

Builds:
  - versionName: 1.0.0
    versionCode: 1
    commit: v1.0.0
    sudo: apt-get update && apt-get install -y wget curl git unzip xz-utils zip &&
      wget -q 
      https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/flutter_linux_3.41.2-stable.tar.xz
      && tar -xf flutter_linux_3.41.2-stable.tar.xz -C /opt && chmod -R 777 /opt/flutter
      && ln -s /opt/flutter/bin/flutter /usr/local/bin/flutter
    output: build/app/outputs/flutter-apk/app-release.apk
    build: flutter config --no-analytics && flutter build apk --release

AutoUpdateMode: None
UpdateCheckMode: None
CurrentVersion: 1.0.0
CurrentVersionCode: 1
