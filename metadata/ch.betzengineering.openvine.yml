License: MIT
AuthorName: Michael Betz
AuthorEmail: web@betz-engineering.ch
WebSite: https://www.betz-engineering.ch
SourceCode: https://github.com/michael-betz/OpenVine
IssueTracker: https://github.com/michael-betz/OpenVine/issues

RepoType: git
Repo: https://github.com/michael-betz/OpenVine

Builds:
  - versionName: '1.0'
    versionCode: 1
    commit: v1.0
    subdir: app
    sudo:
      - echo "deb https://deb.debian.org/debian trixie main" > /etc/apt/sources.list.d/trixie.list
      - apt-get update
      - apt-get install -y -t trixie openjdk-21-jdk-headless
      - update-alternatives --auto java
    gradle:
      - yes

AutoUpdateMode: None
UpdateCheckMode: None
