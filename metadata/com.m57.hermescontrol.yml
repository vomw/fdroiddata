Builds:
  - versionName: 1.11.1
    versionCode: 1111
    commit: 8f14aca647dc5a8031e6e07db039b3bdbc3ef8c2
    subdir: app
    gradle:
      - yes
    scandelete:
      - settings.gradle.kts
    build:
      - git checkout -- ../settings.gradle.kts
      - sed -i '/foojay/d' ../settings.gradle.kts
      - sed -i -e '/versionCode =/c\        versionCode = 1111' build.gradle.kts
      - sed -i -e '/versionName =/c\        versionName = "1.11.1"' build.gradle.kts

MaintainerNotes: |-
  VersionCode is derived from the git tag by stripping dots:
  v1.11.1 -> "1.11.1" -> versionCode = 1111.
  When adding a new build entry, run:
    VERSION=$(echo "vX.Y.Z" | sed 's/^v//')
    CODE=$(echo "$VERSION" | tr -d '.' | sed 's/^0*//')
    echo "versionName=$VERSION versionCode=$CODE"

  Then update the sed lines in the build step with those values.

  The foojay-resolver-convention plugin in settings.gradle.kts is
  banned by F-Droid's scanner. scandelete removes the file before
  scanning, then git checkout restores it and sed removes the line.
  This will no longer be needed once the source repo removes it.

  Auto-update is disabled because versionCode and versionName are
  set via -P CLI flags in build.gradle.kts, so F-Droid cannot
  extract them from source. Each new release must add a build entry.

AutoUpdateMode: None
