License: GPL-3.0-or-later
AuthorName: Manuel Jiménez
AuthorEmail: manueljpy@gmail.com
SourceCode: https://github.com/manueljpy/SideDeck
IssueTracker: https://github.com/manueljpy/SideDeck/issues
Changelog: https://github.com/manueljpy/SideDeck/releases

AutoName: SideDeck

RepoType: git
Repo: https://github.com/manueljpy/SideDeck.git

Builds:
  - versionName: 1.0.2
    versionCode: 3
    commit: v1.0.2
    output: build/app/outputs/flutter-apk/app-release.apk
    srclibs:
      - flutter@6b182d2c7585eba26d4edce0f97630effd256c33
    prebuild:
      - echo "fdroid=true" >> android/gradle.properties
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get
    scandelete:
      - .pub-cache
    build:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter build apk --release -Pfdroid=true

AutoUpdateMode: Version
UpdateCheckMode: Tags
UpdateCheckData: pubspec.yaml|version:\s.+\+(\d+)|.|version:\s(.+)\+
CurrentVersion: 1.0.2
CurrentVersionCode: 3
