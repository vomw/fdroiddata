    versionCode: 2
    commit: release2.0.0
    subdir: app
    gradle:
      - yes
    prebuild:
      - export JAVA_HOME=$JAVA17_HOME
    scandelete:
      - .gradle
      - build
    scanignore:
      - .gradle

AutoUpdateMode: Version %v
UpdateCheckMode: Tags
