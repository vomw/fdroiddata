Categories:
  - Development
  - Graphics
License: Apache-2.0
SourceCode: https://github.com/Aarav90-cpu/HydroChroma
IssueTracker: https://github.com

AutoName: HydroChroma
Summary: Liquid-style UI components for Jetpack Compose
Description: |
  HydroChroma is a specialized UI library designed for fluid, organic visual effects
  in Android applications. It leverages modern shaders to provide liquid-glass
  components and smooth physics-based transitions.

RepoType: git
Repo: https://github.com/Aarav90-cpu/HydroChroma

Builds:
  - versionName: '1.0'
    versionCode: 1
    commit: v1.0
    subdir: app
    gradle:
      - yes
    # Ensures the build server uses the correct Java version for Compose
    prebuild:
      - sed -i 's/jcenter()/mavenCentral()/' build.gradle* settings.gradle*
    scandelete:
      - .gradle
    scanignore:
      - .gradle

AutoUpdateMode: Version v%v
UpdateCheckMode: Tags
CurrentVersion: '1.0'
CurrentVersionCode: 1
