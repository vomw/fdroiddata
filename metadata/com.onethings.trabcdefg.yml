License: MIT
SourceCode: https://github.com/onethings/trabcdefg
IssueTracker: https://github.com/onethings/trabcdefg/issues

RepoType: git
Repo: https://github.com/onethings/trabcdefg.git

Builds:
  - versionName: 1.0.0
    versionCode: 1
    commit: 320d999
    subdir: openstreetmap_version
    # 1. 明確指定所需的 Java 版本（Flutter 3.x 建議至少 Java 17）
    java: 17
    srclibs:
      - flutter@3.47.1
    # 2. 避免預設 gradlew 檢查出錯，在 build 流程中確保 gradlew 權限與配置
    build:
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get
      - $$flutter$$/bin/flutter build apk --release
    output: build/app/outputs/flutter-apk/app-release.apk

AutoUpdateMode: None
UpdateCheckMode: None
CurrentVersion: 1.0.0
CurrentVersionCode: 1
