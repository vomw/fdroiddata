License: MIT
Summary: Traccar client with OpenStreetMap support
Description: |-
  A Traccar API client built with Flutter using OpenStreetMap.

SourceCode: https://github.com/onethings/trabcdefg
IssueTracker: https://github.com/onethings/trabcdefg/issues

AutoUpdateMode: None
UpdateCheckMode: None
CurrentVersion: 1.0.0
CurrentVersionCode: 1

Builds:
  - versionName: 1.0.0
    versionCode: 1
    commit: main
    subdir: openstreetmap_version
    build:
      - $$SDK$$/flutter config --no-analytics
      - $$SDK$$/flutter pub get
      - $$SDK$$/flutter build apk --release