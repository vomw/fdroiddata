Categories:
  - Multimedia
  - Music Practice Tool
License: MIT
AuthorName: Eric Blum
SourceCode: https://github.com/Safrone/track-exploder
IssueTracker: https://github.com/Safrone/track-exploder/issues
Changelog: https://github.com/Safrone/track-exploder/blob/HEAD/CHANGELOG.md
Donate: https://ko-fi.com/safrone

RepoType: git
Repo: https://github.com/Safrone/track-exploder.git

Builds:
  - versionName: 1.1.12
    versionCode: 1001012
    commit: v1.1.12
    sudo:
      - apt-get update
      - apt-get install -y build-essential libclang-dev libssl-dev npm pkg-config
        rustup
    output: 
      src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release-unsigned.apk
    prebuild:
      - rustup default 1.97.0
      - rustup target add aarch64-linux-android
      - . "$HOME/.cargo/env"
      - cargo install tauri-cli@2.11.4 --locked
      - export NDK_HOME=$$NDK$$
      - cargo tauri android init
      - cp -rf src-tauri/icons/android/mipmap-* src-tauri/gen/android/app/src/main/res/
      - cp -f src-tauri/icons/android/values/ic_launcher_background.xml src-tauri/gen/android/app/src/main/res/values/
    build:
      - . "$HOME/.cargo/env"
      - export NDK_HOME=$$NDK$$
      - export LIBCLANG_PATH=$(ls -d /usr/lib/llvm-*/lib | tail -1)
      - npm ci
      - cargo tauri android build --apk --target aarch64 --features mp3
    ndk: r27c

AutoUpdateMode: Version
UpdateCheckMode: Tags ^v[\d.]+$
UpdateCheckData: 
  src-tauri/tauri.conf.json|"versionCode":\s*(\d+)|src-tauri/tauri.conf.json|"version":\s*"([\d.]+)"
CurrentVersion: 1.1.12
CurrentVersionCode: 1001012
