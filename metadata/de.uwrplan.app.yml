AuthorName: UWR Planer
WebSite: https://uwr-plan.de
SourceCode: https://git.pabr.de/uwr/uwr_plan_app
IssueTracker: https://git.pabr.de/uwr/uwr_plan_app/-/issues

AutoName: UWR Planer

RepoType: git
Repo: https://git.pabr.de/uwr/uwr_plan_app.git

Builds:
  - versionName: 1.0.6
    versionCode: 100061
    commit: 6b423235f8a55c07debacd45ce30bb3c9d2234f6
    output: build/app/outputs/flutter-apk/app-armeabi-v7a-foss-release.apk
    srclibs:
      - flutter@stable
    rm:
      - ios
      - linux
      - macos
      - web
      - windows
    prebuild:
      - flutterVersion=$(sed -n -E 's|.*image:\s*ghcr\.io/cirruslabs/flutter:(\S+).*|\1|p' .gitlab-ci.yml)
      - '[[ $flutterVersion ]]'
      - git -C $$flutter$$ checkout -f $flutterVersion
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get
    scanignore:
      - .flutter/bin/cache
    scandelete:
      - .flutter
      - .pub-cache
    build:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter build apk --flavor foss --release --split-per-abi --target-platform="android-arm"

