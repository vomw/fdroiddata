Builds:
  - versionName: 1.0.6
    versionCode: 100061
    commit: 6b423235f8a55c07debacd45ce30bb3c9d2234f6
    sudo:
      - apt-get update
      - apt-get install -y curl xz-utils
      - curl -Lo /opt/flutter.tar.xz 
        https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/flutter_linux_3.41.1-stable.tar.xz
      - tar xf /opt/flutter.tar.xz -C /opt
      - rm /opt/flutter.tar.xz
      - chown -R vagrant:vagrant /opt/flutter
    output: build/app/outputs/flutter-apk/app-armeabi-v7a-foss-release.apk
    build:
      - export PATH="$PATH:/opt/flutter/bin"
      - git config --global --add safe.directory /opt/flutter
      - flutter config --no-analytics
      - flutter pub get
      - flutter build apk --flavor foss --release --split-per-abi --target-platform="android-arm"

