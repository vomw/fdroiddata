Categories:
  - Sports & Health
License: MIT
AuthorName: Max Fiedler
SourceCode: https://github.com/LuminaAppsDev/cairn
IssueTracker: https://github.com/LuminaAppsDev/cairn/issues

AutoName: Cairn

RepoType: git
Repo: https://github.com/LuminaAppsDev/cairn.git

Builds:
  - versionName: 0.1.3
    versionCode: 4
    commit: 6aeaf87571d13154c33f027196580e4278861134
    output: build/app/outputs/flutter-apk/app-release.apk
    srclibs:
      - flutter@stable
    rm:
      - ios
    prebuild:
      - flutterVersion=$(sed -n -E "s/.*FLUTTER_VERSION:\s*'?([0-9.]+)'?.*/\1/p" .forgejo/workflows/release.yml
        | head -1)
      - '[ -n "$flutterVersion" ]'
      - git -C $$flutter$$ checkout -f $flutterVersion
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get --enforce-lockfile
    scandelete:
      - .pub-cache
    build:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter build apk --release

AutoUpdateMode: Version
UpdateCheckMode: Tags
UpdateCheckData: pubspec.yaml|version:\s.+\+(\d+)|.|version:\s(.+)\+
CurrentVersion: 0.1.3
CurrentVersionCode: 4
