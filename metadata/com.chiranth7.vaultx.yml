IssueTracker: 
  https://github.com/Chiranth-Janardhan-moger/vaultx-offline-password-manager/issues

AutoName: VaultX

RepoType: git
Repo: https://github.com/Chiranth-Janardhan-moger/vaultx-offline-password-manager

Builds:
  - versionName: 1.3.4
    versionCode: 248
    commit: 1146047e2c76bf51f06b2d7084600293e1c7c621
    subdir: android/app
    sudo:
      - apt-get update
      - apt-get install -y npm
    init:
      - cd ../..
      - npm install
    gradle:
      - yes
    prebuild:
      - cd ../..
      - sed -i -e '1a "expo":{"autolinking":{"android":{"buildFromSource":[".*"]}}},'
        package.json
      - sed -i '/jvmToolchain\|JavaVersion/s/17/21/' node_modules/@react-native/gradle-plugin/*/build.gradle.kts
        node_modules/@react-native/gradle-plugin/react-native-gradle-plugin/src/main/kotlin/com/facebook/react/utils/JdkConfiguratorUtils.kt
      - sed -i '/android {/a\    namespace "com.rnbiometrics"' node_modules/react-native-biometrics/android/build.gradle
      - 'sed -i "/com.android.library/a apply plugin: \"kotlin-android\"" node_modules/react-native-biometrics/android/build.gradle'
      - sed -i '/android {/a\    namespace "org.linusu"' node_modules/react-native-get-random-values/android/build.gradle
      - 'sed -i "/com.android.library/a apply plugin: \"kotlin-android\"" node_modules/react-native-get-random-values/android/build.gradle'
      - sed -i '/android {/a\    namespace "org.reactnative.maskedview"' node_modules/@react-native-masked-view/masked-view/android/build.gradle
      - 'sed -i "/com.android.library/a apply plugin: \"kotlin-android\"" node_modules/@react-native-masked-view/masked-view/android/build.gradle'
      - npx expo prebuild -p android --clean
      - sed -i -e '/signingConfig /d' android/app/build.gradle
    scanignore:
      - node_modules/expo-modules-core/android/ExpoModulesCorePlugin.gradle
      - node_modules/react-native-screens/android/build.gradle
      - node_modules/react-native-view-shot/android/build.gradle
      - node_modules/react-native-safe-area-context/android/build.gradle
      - node_modules/react-native-biometrics/android/build.gradle
    scandelete:
      - node_modules

AutoUpdateMode: Version
UpdateCheckMode: Tags
