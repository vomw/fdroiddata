Changelog: https://github.com/Gris-S/my-osm/releases

AutoName: MY OSM

RepoType: git
Repo: https://github.com/Gris-S/my-osm.git
Binaries: https://github.com/Gris-S/my-osm/releases/download/v%v/MY-OSM-%v.apk

Builds:
  - versionName: 0.1.0-alpha.81
    versionCode: 1000081
    commit: 7a82b9988791afff2353b4b27953ad9c847fcd6b
    subdir: apk/android/app
    sudo:
      - echo "deb https://deb.debian.org/debian forky main" > /etc/apt/sources.list.d/forky.list
      - apt-get update
      - apt-get install -y -t forky npm
    gradle:
      - yes
    prebuild:
      - cd ../../..
      - npm --prefix app ci
      - npm --prefix apk ci
    scanignore:
      - apk/node_modules/@capacitor/cli/assets/capacitor-cordova-android-plugins.tar.gz
    scandelete:
      - app/node_modules/three/examples
      - app/node_modules/source-map/lib/mappings.wasm
      - app/node_modules/long/dist/long.min.js.gz
      - apk/node_modules/@capacitor/cli/assets
    build:
      - cd ../../..
      - OSM_TARGET=apk MYOSM_DIAGNOSTICS=0 npm --prefix app run build
      - cd apk
      - npx cap sync android

