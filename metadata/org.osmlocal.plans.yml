Builds:
  - versionName: 0.1.0-alpha.26
    versionCode: 1000026
    commit: v0.1.0-alpha.26
    subdir: apk/android/app
    sudo:
      - curl -Lo node.tar.xz https://nodejs.org/dist/v26.8.1/node-v26.8.1-linux-x64.tar.xz
      - echo "3e301118d7df53d563b7e96c1617545f26e2f76f9724be668d6cab65c15dda5d  node.tar.xz"
        | sha256sum -c -
      - tar xJf node.tar.xz
      - cp -a node-v26.8.1-linux-x64/. /usr/local/
    gradle:
      - yes
    build:
      - cd ../../..
      - npm --prefix app ci
      - npm --prefix apk ci
      - OSM_TARGET=apk MYOSM_DIAGNOSTICS=0 npm --prefix app run build
      - cd apk && npx cap sync android

