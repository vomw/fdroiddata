Builds:
  - versionName: 2.1.0
    versionCode: 5
    commit: 59d03abe7e5df725bb4a10930cf213fe2e120d4c
    sudo:
      - mkdir -p /tmp/build
      - chown vagrant /tmp/build
    output: build/app/outputs/flutter-apk/app-release.apk
    binary: https://github.com/amphi2024/photos/releases/download/v%v/Photos-%v-Android.apk
    srclibs:
      - flutter@stable
    rm:
      - ios
      - macos
      - linux
      - windows
      - web
      - test
      - snap
      - scripts
    prebuild:
      - flutterVersion=$(sed -n -E "s/^\s+flutter:\s*([0-9.]+)/\1/p" pubspec.yaml)
      - '[[ $flutterVersion ]]'
      - git -C $$flutter$$ checkout -f $flutterVersion
      - mkdir -p /tmp/build
      - cd ..
      - mv com.amphi.photos /tmp/build/amphi-photos
      - pushd /tmp/build/amphi-photos/
      - export PUB_CACHE=$(pwd)/.pub-cache
      - export PATH=$PUB_CACHE/bin/:$$flutter$$/bin/:$PATH
      - flutter config --no-analytics
      - flutter pub get
      - flutter precache
      - popd
      - mv /tmp/build/amphi-photos com.amphi.photos
    scandelete:
      - .pub-cache
    build:
      - mkdir -p /tmp/build
      - cd ..
      - mv com.amphi.photos /tmp/build/amphi-photos
      - pushd /tmp/build/amphi-photos/
      - export PUB_CACHE=$(pwd)/.pub-cache
      - export PATH=$PUB_CACHE/bin/:$$flutter$$/bin/:$PATH
      - flutter build apk
      - popd
      - mv /tmp/build/amphi-photos com.amphi.photos

