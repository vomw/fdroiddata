RepoType: git
Repo: https://github.com/Guiforge/bati.git

Builds:
  - versionName: 1.2.1
    versionCode: 10201
    commit: v1.2.1
    sudo:
      - apt-get update || true
      - apt-get install -y --no-install-recommends curl ca-certificates python3 make
        g++
      - curl -fsSL https://deb.nodesource.com/setup_22.x | bash -
      - apt-get install -y --no-install-recommends nodejs
    init:
      - npm ci
      - rm -rf node_modules/expo-dev-client node_modules/expo-dev-launcher node_modules/expo-dev-menu
        node_modules/expo-dev-menu-interface
      - find node_modules -type d -name local-maven-repo -prune -exec rm -rf {} +
    output: android/app/build/outputs/apk/release/app-release.apk
    scanignore:
      - node_modules
    build:
      - npx expo prebuild --clean --platform android --no-install
      - cd android && ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=armeabi-v7a,arm64-v8a

MaintainerNotes: |-
  Expo / React Native app; android/ is generated by `expo prebuild` and is not in the
  checkout, which is why the build is driven from build: rather than subdir/gradle flags
  (fdroidserver validates subdir before init runs).
  package.json sets expo.autolinking.buildFromSource [".*"], so every Expo module compiles
  from source; init: deletes their bundled prebuilt local-maven-repo AARs, plus the
  expo-dev-* packages (devDependencies, but npm ci installs them and autolinking would
  compile dev tooling into the release).
  scanignore rather than scandelete: scandelete removes the build.gradle of
  react-native-safe-area-context and @react-native-masked-view over a legitimate local
  maven { url } line, and the build then fails with "No variants exist".
  No Firebase and no network code anywhere in the app.

