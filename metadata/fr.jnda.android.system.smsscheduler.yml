AutoName: CHRONOS
Summary: Planifiez l'envoi de vos SMS
Description: |-
  SmsScheduler est une application simple et efficace pour programmer l'envoi
  de messages SMS à une date et une heure précises.

  Fonctionnalités :
  * Programmation de SMS : Choix du destinataire depuis les contacts ou saisie manuelle.
  * Gestion des modèles : Création de messages types pour une insertion rapide.
  * Suivi des statuts : Visualisez si vos messages sont programmés, envoyés ou en échec.
  * Historique : Retrouvez facilement vos messages passés dans un onglet dédié.
  * Confidentialité : Vos données restent locales, aucune connexion Internet n'est requise.

