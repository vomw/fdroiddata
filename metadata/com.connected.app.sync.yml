AutoName: Connected
Description: |-
  Connected is a high-speed, offline, cross-platform app that bridges the gap
  between your devices. It is built with Rust and Jetpack Compose and aims to
  outperform proprietary solutions like AirDrop.

  Features:

  * Cross-platform: transfer files, sync clipboards, make and answer calls,
  send and receive messages, and control media between Android, iOS, Linux,
  Mac and Windows devices.
  * Offline functionality: use it without an internet connection on supported
  Android devices via WiFi Aware, plus local-network discovery when a network
  is available.
  * High speed: powered by the QUIC protocol (the same protocol behind HTTP/3).
  * Zero config: auto-discovery via mDNS and WiFi Aware.
  * Secure: end-to-end encryption for all transfers.
  * Privacy by design: your data never leaves your local link. All
  communication happens directly between your own devices -- no cloud servers
  are involved.

RepoType: git
Repo: https://github.com/paterkleomenis/connected

Builds:
  - versionName: 3.2.4
    versionCode: 30204
    commit: fdroid-3.2.4
    subdir: android
    sudo:
      - apt-get update || true
      - apt-get install -y curl libclang-dev clang gcc libc-dev
      - apt-get install -y pkg-config libssl-dev perl make
      - apt-get install -y python3 build-essential
    gradle:
      - standalone
    prebuild:
      - export PATH="$HOME/.cargo/bin:$PATH"
      - curl -sSf https://sh.rustup.rs -o /tmp/rustup.sh
      - sh /tmp/rustup.sh -y --profile minimal
      - rustup target add aarch64-linux-android armv7-linux-androideabi
      - rustup target add x86_64-linux-android i686-linux-android
      - cargo install cargo-ndk --locked
    scanignore:
      - android/app/src/main/kotlin/uniffi
    scandelete:
      - target
      - android/app/src/main/jniLibs
      - android/build
      - android/.gradle
    build:
      - mkdir -p "$HOME/.gradle/init.d"
      - "cat > \"$HOME/.gradle/init.d/unsigned.gradle\" <<'GRADLE_EOF'\nallprojects
        {\n    afterEvaluate { p ->\n        if (p.plugins.hasPlugin(\"com.android.application\"\
        ) || p.plugins.hasPlugin(\"com.android.library\")) {\n            if (p.android.hasProperty(\"\
        signingConfigs\")) {\n                p.android.signingConfigs.configureEach
        { it.enabled = false }\n            }\n            if (p.android.hasProperty(\"\
        buildTypes\")) {\n                p.android.buildTypes.configureEach { it.signingConfig
        = null }\n            }\n        }\n    }\n}\nGRADLE_EOF\n"
    ndk: r27c

AutoUpdateMode: Version
UpdateCheckMode: Tags
UpdateCheckName: ([0-9.]+)
UpdateCheckData: android/app/build.gradle.kts|versionCode = ([0-9]+)|android/app/build.gradle.kts|versionName
  = "([0-9.]+)"
CurrentVersion: 3.2.4
CurrentVersionCode: 30204
