AutoName: Connected
Description: |-
  Connected is a high-speed, offline, cross-platform app that bridges the gap
  between your devices. It is built with Rust and Jetpack Compose and aims to
  outperform proprietary solutions like AirDrop.

  Features:

  * Cross-platform: transfer files, sync clipboards, make and answer calls,
  send and receive messages, and control media between Android, iOS, Linux,
  Mac and Windows devices.
  * Offline functionality: use it without an internet connection on supported
  Android devices via WiFi Aware, plus local-network discovery when a network
  is available.
  * High speed: powered by the QUIC protocol (the same protocol behind HTTP/3).
  * Zero config: auto-discovery via mDNS and WiFi Aware.
  * Secure: end-to-end encryption for all transfers.
  * Privacy by design: your data never leaves your local link. All
  communication happens directly between your own devices -- no cloud servers
  are involved.

RepoType: git
Repo: https://github.com/paterkleomenis/connected

Builds:
  - versionName: 3.2.4
    versionCode: 30204
    commit: fdroid-3.2.4
    subdir: android
    sudo:
      - apt-get update || true
      - apt-get install -y curl libclang-dev clang gcc libc-dev pkg-config 
        libssl-dev perl make python3 build-essential
    gradle:
      - standalone
    prebuild:
      - export PATH="$HOME/.cargo/bin:$PATH"
      - curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y 
        --default-toolchain stable --profile minimal
      - rustup target add aarch64-linux-android armv7-linux-androideabi 
        x86_64-linux-android i686-linux-android
      - cargo install cargo-ndk --locked
    scanignore:
      - android/app/src/main/kotlin/uniffi
    scandelete:
      - target
      - android/app/src/main/jniLibs
      - android/build
      - android/.gradle
    build:
      - mkdir -p "$HOME/.gradle/init.d"
      - printf 'allprojects { afterEvaluate { p -> if 
        (p.plugins.hasPlugin("com.android.application") || 
        p.plugins.hasPlugin("com.android.library")) { if 
        (p.android.hasProperty("signingConfigs")) { 
        p.android.signingConfigs.configureEach { it.enabled = false } } if 
        (p.android.hasProperty("buildTypes")) { 
        p.android.buildTypes.configureEach { it.signingConfig = null } } } } 
        }\n' > "$HOME/.gradle/init.d/unsigned.gradle"
    ndk: r27c

AutoUpdateMode: Version
UpdateCheckMode: Tags
UpdateCheckName: ([0-9.]+)
UpdateCheckData: android/app/build.gradle.kts|versionCode = 
  ([0-9]+)|android/app/build.gradle.kts|versionName = "([0-9.]+)"
CurrentVersion: 3.2.4
