  - versionName: 3.2.4
    versionCode: 30204
    commit: 8536a3298faf9e6b3e3e6068cb8c3e994b3b7643
    subdir: android/app
    sudo:
      - apt-get update || true
      - apt-get install -y curl libclang-dev clang gcc libc-dev pkg-config libssl-dev
        perl make python3 build-essential rustup
    gradle:
      - standalone
    prebuild:
      - export PATH="$HOME/.cargo/bin:$PATH"
      - rustup default stable
      - rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android
        i686-linux-android
      - cargo install cargo-ndk --locked
    build:
      - mkdir -p "$HOME/.gradle/init.d"
      - "cat > \"$HOME/.gradle/init.d/unsigned.gradle\" <<'GRADLE_EOF'\nallprojects\
        \ {\n    afterEvaluate { p ->\n        if (p.plugins.hasPlugin(\"com.android.application\"\
        ) || p.plugins.hasPlugin(\"com.android.library\")) {\n            if (p.android.hasProperty(\"\
        buildTypes\")) {\n                p.android.buildTypes.configureEach { it.signingConfig\
        \ = null }\n            }\n        }\n    }\n}\nGRADLE_EOF\n"
    ndk: r27c

