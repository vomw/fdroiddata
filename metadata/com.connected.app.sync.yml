Builds:
  - versionName: 3.2.4
    versionCode: 30204
    commit: 8536a3298faf9e6b3e3e6068cb8c3e994b3b7643
    subdir: android/app
    sudo:
      - apt-get update || true
      - apt-get install -y curl libclang-dev clang gcc libc-dev
      - apt-get install -y pkg-config libssl-dev perl make
      - apt-get install -y python3 build-essential
    gradle:
      - standalone
    prebuild:
      - export PATH="$HOME/.cargo/bin:$PATH"
      - curl -sSf https://sh.rustup.rs -o /tmp/rustup.sh
      - sh /tmp/rustup.sh -y --profile minimal
      - rustup target add aarch64-linux-android armv7-linux-androideabi
      - rustup target add x86_64-linux-android i686-linux-android
      - cargo install cargo-ndk --locked
    build:
      - mkdir -p "$HOME/.gradle/init.d"
      - "cat > \"$HOME/.gradle/init.d/unsigned.gradle\" <<'GRADLE_EOF'\nallprojects
        {\n    afterEvaluate { p ->\n        if (p.plugins.hasPlugin(\"com.android.application\"\
        ) || p.plugins.hasPlugin(\"com.android.library\")) {\n            if (p.android.hasProperty(\"\
        buildTypes\")) {\n                p.android.buildTypes.configureEach { it.signingConfig
        = null }\n            }\n        }\n    }\n}\nGRADLE_EOF\n"
    ndk: r27c

AutoUpdateMode: Version
UpdateCheckMode: Tags
UpdateCheckName: ([0-9.]+)
UpdateCheckData: android/app/build.gradle.kts|versionCode = ([0-9]+)|android/app/build.gradle.kts|versionName
  = "([0-9.]+)"
CurrentVersion: 3.2.4
