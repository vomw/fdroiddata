IssueTracker: https://github.com/gitrdm/torrey_bible_app/issues
Changelog: https://github.com/gitrdm/torrey_bible_app/blob/master/CHANGELOG.md

AutoName: Torrey Bible Study

RepoType: git
Repo: https://github.com/gitrdm/torrey_bible_app.git

Builds:
  - versionName: 1.0.0
    versionCode: 1
    commit: v1.0.0
    subdir: android/app
    sudo:
      - apt-get update
      - apt-get install -y openjdk-21-jdk-headless
      - update-java-alternatives --set java-1.21.0-openjdk-amd64
    gradle:
      - yes
    output: build/app/outputs/flutter-apk/app-release.apk
    srclibs:
      - flutter@3.27.1
    prebuild: 
      - echo 'android.useAndroidX=true' >> ../gradle.properties
      - echo 'android.enableJetifier=false' >> ../gradle.properties
    build:
      - export PATH=$$flutter$$/bin:$PATH
      - flutter packages get
      - flutter build apk --release

AutoUpdateMode: Version
UpdateCheckMode: Tags
CurrentVersion: 1.0.0