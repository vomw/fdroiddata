Categories:
  - Productivity
License: GPL-3.0-or-later
AuthorName: Archixonline
WebSite: https://github.com/Archixonline/Trifecta
SourceCode: https://github.com/Archixonline/Trifecta
IssueTracker: https://github.com/Archixonline/Trifecta/issues

AutoName: Trifecta ToDo
Summary: Cross-platform task manager with widgets and optional LAN sync.
Description: |-
  Trifecta ToDo is a free and open-source task manager built with Flutter.

  Features:
  - Tasks, categories, calendar, and timeline views
  - Android home-screen widgets (calendar, list, up next)
  - Optional local network sync between devices

RepoType: git
Repo: https://github.com/Archixonline/Trifecta.git

Builds:
  - versionName: 0.9.1
    versionCode: 1
    commit: v0.9.1
    output: build/app/outputs/flutter-apk/app-release.apk
    srclibs:
      - flutter@stable
    rm:
      - ios
      - linux
      - macos
      - web
      - windows
    prebuild:
      - echo "flutter.sdk=$$flutter$$" > android/local.properties
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get --enforce-lockfile
    scandelete:
      - .pub-cache
    build:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter build apk --release
      - apkDir=build/app/outputs/flutter-apk
      - if [ -f "$apkDir/app-release-unsigned.apk" ]; then cp -f "$apkDir/app-release-unsigned.apk" "$apkDir/app-release.apk"; fi

AutoUpdateMode: Version
UpdateCheckMode: Tags
CurrentVersion: 0.9.1
CurrentVersionCode: 1
