AuthorName: Archixonline
WebSite: https://gitlab.com/archixonline1/Archixonline-project
SourceCode: https://gitlab.com/archixonline1/Archixonline-project
IssueTracker: https://gitlab.com/archixonline1/Archixonline-project/-/issues

AutoName: Trifecta ToDo
Summary: Cross-platform task manager with widgets and optional LAN sync.
Description: |-
  Trifecta ToDo is a free and open-source task manager built with Flutter.

  Features:
  - Tasks, categories, calendar, and timeline views
  - Android home-screen widgets (calendar, list, up next)
  - Optional local network sync between devices

RepoType: git
Repo: https://gitlab.com/archixonline1/Archixonline-project.git

Builds:
  - versionName: '0.9.2'
    versionCode: 1
    commit: v0.9.2
    output: build/app/outputs/flutter-apk/app-release.apk
    srclibs:
      - flutter@stable
    rm:
      - linux
      - windows
    prebuild:
      - echo "flutter.sdk=$$flutter$$" > android/local.properties
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get
    scandelete:
      - .pub-cache
    build:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter build apk --release
      - apkDir=build/app/outputs/flutter-apk
      - if [ -f "$apkDir/app-release-unsigned.apk" ]; then cp -f "$apkDir/app-release-unsigned.apk" "$apkDir/app-release.apk"; fi

AutoUpdateMode: Version
UpdateCheckMode: Tags
CurrentVersion: 0.9.2
CurrentVersionCode: 1
