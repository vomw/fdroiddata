AuthorName: Archixonline
SourceCode: https://gitlab.com/archixonline1/Archixonline-project
IssueTracker: https://gitlab.com/archixonline1/Archixonline-project/-/issues

AutoName: Trifecta ToDo

RepoType: git
Repo: https://gitlab.com/archixonline1/Archixonline-project.git

Builds:
  - versionName: 0.9.2
    versionCode: 11
    commit: 21f4d90ce088e49943f2226ae9d0ce5949b33472
    output: build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
    srclibs:
      - flutter@stable
    rm:
      - linux
      - windows
    prebuild:
      - flutterVersion=$(cat fastlane/metadata/android/flutter-version.txt)
      - '[[ $flutterVersion ]]'
      - git -C $$flutter$$ checkout -f $flutterVersion
      - echo "flutter.sdk=$$flutter$$" > android/local.properties
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get --enforce-lockfile
    scandelete:
      - .pub-cache
    build:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter build apk --release --split-per-abi --target-platform="android-arm"

