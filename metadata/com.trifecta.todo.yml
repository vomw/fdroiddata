    srclibs:
      - flutter@stable
    ndk: 28.2.13676358
    rm:
      - linux
      - windows
    prebuild:
      - original_dir=$(pwd)
      - flutterVersion=$(cat fastlane/metadata/android/flutter-version.txt)
      - '[[ $flutterVersion ]]'
      - git -C $$flutter$$ checkout -f $flutterVersion
      - '[ "/tmp/build/com.trifecta.todo" = "$original_dir" ] || mkdir -p /tmp/build/com.trifecta.todo'
      - '[ "/tmp/build/com.trifecta.todo" = "$original_dir" ] || cp -R . /tmp/build/com.trifecta.todo'
      - cd /tmp/build/com.trifecta.todo && export PUB_CACHE=/tmp/build/com.trifecta.todo/.pub-cache
        && $$flutter$$/bin/flutter config --no-analytics && $$flutter$$/bin/flutter
        pub get --enforce-lockfile
    build:
      - original_dir=$(pwd)
      - cd /tmp/build/com.trifecta.todo && export PUB_CACHE=/tmp/build/com.trifecta.todo/.pub-cache
        && $$flutter$$/bin/flutter build apk --release --split-per-abi --target-platform="android-arm"
