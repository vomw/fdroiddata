        perl python3 python3-libxml2 xsltproc libexpat1-dev libwayland-dev libwayland-bin
        libwayland-egl-backend-dev wayland-protocols libvulkan-dev patchelf libx11-dev
        libx11-xcb-dev libxcb1-dev gcc-aarch64-linux-gnu g++-aarch64-linux-gnu binutils-aarch64-linux-gnu
        libc6-arm64-cross linux-libc-dev-arm64-cross
    gradle:
      - yes
    prebuild:
      - cd "$(git rev-parse --show-toplevel)"
      - printf 'tawcMethods=tawcroot\ntawcGraphics=libhybris,cpu\n' >> gradle.properties
      - cargo install cargo-ndk --version 4.1.2 --locked
      - scripts/ensure-deps.sh termux-app
    ndk: 27.2.12479018

