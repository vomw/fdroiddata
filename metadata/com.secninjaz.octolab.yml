AutoName: OctoLab
Description: |-
  OctoLab is a free and open-source Android client for GitLab. It works with
  gitlab.com as well as self-hosted GitLab instances (Community or Enterprise
  Edition).

  Features:

  * Issues — browse, create, edit, comment, filter, label, assign
  * Merge Requests — view, comment, review diffs, follow CI/CD pipeline status
  * To-dos — view and filter by action type
  * Repository — browse files, README, branches, tags, commits, releases
  * Notifications — push notifications for new to-do items
  * Self-hosted support — works with any GitLab instance (CE or EE)
  * Multi-account — switch between multiple GitLab accounts, self-hosted and
    gitlab.com side by side
  * Dark and light theme
  * Markdown rendering — GFM tables, task lists, code blocks, images

