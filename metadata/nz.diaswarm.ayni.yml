AuthorName: alex-poor
SourceCode: https://github.com/alex-poor/diaswarm
IssueTracker: https://github.com/alex-poor/diaswarm/issues

AutoName: Ayni

RepoType: git
Repo: https://github.com/alex-poor/diaswarm.git

Builds:
  - versionName: 0.1.3
    versionCode: 41
    commit: follower-v0.1.3
    subdir: follower
    sudo:
      - apt-get update
      - apt-get install -y rustup
      - rustup default 1.98.1
      - rustup target add aarch64-linux-android armv7-linux-androideabi
      - cargo install cargo-ndk --locked
    gradle:
      - yes
    output: build/outputs/apk/release/ayni-armeabi-v7a-release-unsigned.apk
    prebuild: echo "sdk.dir=$$SDK$$" > local.properties
    ndk: 29.0.14206865

  - versionName: 0.1.3
    versionCode: 42
    commit: follower-v0.1.3
    subdir: follower
    sudo:
      - apt-get update
      - apt-get install -y rustup
      - rustup default 1.98.1
      - rustup target add aarch64-linux-android armv7-linux-androideabi
      - cargo install cargo-ndk --locked
    gradle:
      - yes
    output: build/outputs/apk/release/ayni-arm64-v8a-release-unsigned.apk
    prebuild: echo "sdk.dir=$$SDK$$" > local.properties
    ndk: 29.0.14206865

AutoUpdateMode: None
