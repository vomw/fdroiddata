AntiFeatures:
  NonFreeNet:
    en-US: Connects to the proprietary Apple Music API to automatically fetch the
      genre of the currently playing track for dynamic EQ switching, and fetches app
      update information from GitHub Gist.
    tr-TR: Dinamik EQ geçişi için çalan parçanın türünü otomatik almak üzere özel
      Apple Music API'sine bağlanır ve GitHub Gist'ten uygulama güncelleme bilgilerini
      çeker.
    az-AZ: Dinamik EQ keçidi üçün hazırda səslənən parçanın janrını avtomatik almaq
      məqsədilə xüsusi Apple Music API-nə bağlanır və GitHub Gist-dən tətbiq yeniləmə
      məlumatlarını çəkir.
