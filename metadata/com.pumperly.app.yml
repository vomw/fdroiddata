AntiFeatures:
  NonFreeNet:
    en-US: Connects to pumperly.com or a self-hosted instance for fuel price data
Categories:
  - Internet
  - Navigation
License: GPL-3.0-only
AuthorName: GeiserX
AuthorWebSite: https://github.com/GeiserX
WebSite: https://pumperly.com
SourceCode: https://github.com/GeiserX/Pumperly-android
IssueTracker: https://github.com/GeiserX/Pumperly-android/issues

AutoName: Pumperly

RepoType: git
Repo: https://github.com/GeiserX/Pumperly-android.git

Builds:
  - versionName: 1.0.0
    versionCode: 10000
    commit: v1.0.0
    subdir: app
    gradle:
      - yes
    gradleprops:
      - VERSION_NAME=1.0.0
      - VERSION_CODE=10000

AutoUpdateMode: Version
UpdateCheckMode: Tags ^v(\d+\.\d+\.\d+)$
VercodeOperation:
  - '%c * 10000 + %c * 100 + %c'
UpdateCheckData: gradle.properties|VERSION_CODE=(\d+)|gradle.properties|VERSION_NAME=(.+)
CurrentVersion: 1.0.0
CurrentVersionCode: 10000
