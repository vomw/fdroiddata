Name: ÖffiSounds
Summary: Podcast player with public broadcasting audio content

Description: |
  ÖffiSounds is a fork of AntennaPod, enhanced with integration of 
  public broadcasting audio content (ARD Sounds). The app is fully 
  open source, ad-free, and privacy-friendly.

  Features:
    • Subscribe and manage podcasts via RSS/Atom  
    • Access audio content from ARD Sounds  
    • Offline playback, episode downloads, queue management  
    • Chapter support, variable playback speed, sleep timer  
    • No trackers, no telemetry, no proprietary dependencies  

