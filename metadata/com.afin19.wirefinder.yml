Summary: Detect electrical wiring in walls using magnetic sensor

Description: |
  Wire Finder is an open-source utility application that uses your Android
  device's built-in magnetometer sensor to detect live electrical wiring
  and cables hidden inside walls.

  This tool helps you safely locate wires before drilling, cutting, or
  making repairs to your walls.

  Features:
  • 🧲 Magnetic sensor detection of electrical wiring
  • 📊 Real-time signal visualization with interactive charts
  • 🔊 Audio feedback with proximity beeper
  • 🎯 Sensor calibration overlay
  • 🌍 Multi-language support (English, Russian, and more)
  • 🎨 Material Design 3 dark theme interface
  • 📱 Jetpack Compose-based native Android UI

  Technical Details:
  • High-sampling-rate magnetometer access for precision detection
  • Offline operation - no internet connection required
  • No tracking, no analytics, no telemetry
  • All data processing happens locally on your device
  • Fully open-source (GPL-3.0 licensed)

  ⚠️ Important Disclaimer:
  This application detects electromagnetic fields from electrical currents.
  It is a utility tool meant to provide general guidance and should NOT be
  relied upon as the sole method for electrical safety. Always follow proper
  electrical safety procedures when working near wires. If you are unsure
  about electrical installations, consult a qualified electrician.

  The developers are not responsible for any damages, injuries, or
  consequences resulting from the use of this application.

