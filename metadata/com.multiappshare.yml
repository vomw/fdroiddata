AutoName: Multi App Share
Description: |-
  Multi App Share is a utility Android application designed to streamline the process of sharing content across multiple applications sequentially.

  Instead of manually sharing a photo, video, link, or text to each platform or messaging app one by one, users can create custom groups and naturally cycle through all of them.

