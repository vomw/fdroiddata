Categories:
  - Sports
License: GPL-3.0-or-later # Cseréld ki a saját licencedre!
SourceCode: https://gitlab.com/Simson_on_the_road/gyorsulas

AutoName: VeloTime
Summary: GPS-alapú sebesség- és gyorsulásmérő
Description: |-
  A VeloTime egy egyszerű, GPS-alapú Android alkalmazás 0-100 km/h
  gyorsulás, sebesség és stopperidők mérésére.

RepoType: git
Repo: https://gitlab.com/Simson_on_the_road/gyorsulas.git

Builds:
  - versionName: 0.1 # A build.gradle-ben szereplő versionName
    versionCode: 1     # A build.gradle-ben szereplő versionCode
    commit: v0.1     # A Git Tag neve, amit a repódban hoztál létre
    subdir: app
    gradle:
      - yes

AutoUpdateMode: Version
UpdateCheckMode: Tags
