RepoType: git
Repo: https://gitlab.com/celebrate_1955/dateprism/dateprism.git

Builds:
  - versionName: 3.3.2
    versionCode: 3030200
    commit: v3.3.2
    subdir: build/dateprism/android/gradle
    sudo:
      - apt-get update
      - apt-get install -y g++ libc-dev make automake libltdl-dev libtool zlib1g-dev
        libffi-dev libssl-dev
    gradle:
      - yes
    srclibs:
      - cpython@v3.13.11
      - briefcase@v0.3.22
      - toga@v0.4.7
      - template@v0.3.22
    build:
      - pushd $$cpython$$
      - ./configure --prefix=$HOME/.local
      - make -j`nproc`
      - make altinstall
      - popd
      - ln -s $HOME/.local/bin/python3.13 $HOME/.local/bin/python3
      - ln -s $HOME/.local/bin/pip3.13 $HOME/.local/bin/pip3
      - export PATH="$HOME/.local/bin:$PATH"
      - python3 --version
      - pushd $$briefcase$$
      - pip3 install --user .
      - popd
      - pushd $$toga$$
      - pip3 install --user ./core ./android
      - popd
      - pushd $$template$$
      - mkdir -p $HOME/.cookiecutters
      - cp -a . $HOME/.cookiecutters/briefcase-android-gradle-template
      - popd
      - cd ../../..
      - briefcase create android --no-input
      - briefcase build android

AutoUpdateMode: None
UpdateCheckMode: None
CurrentVersion: 3.3.2
CurrentVersionCode: 3030200
