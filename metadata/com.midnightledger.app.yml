    versionCode: 3
    commit: 3.0.0
    timeout: 7200
    sudo:
      - apt-get update
      - apt-get install -y nodejs npm
    init:
      - npm install -g bun
      - bun install
    gradle:
      - yes
    preassemble:
      - bun run build
      - npx cap copy android
