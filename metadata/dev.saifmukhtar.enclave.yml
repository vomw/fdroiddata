Repo: https://github.com/saifmukhtar/enclave.git

Builds:
  - versionName: 3.0.0
    versionCode: 4
    commit: a15e69a7ea72419ad58f5f57e948398e78960cf9
    subdir: apps/android/app
    submodules: true
    sudo:
      - apt-get update
      - apt-get install -y rustup clang libclang-dev cmake make protobuf-compiler
    gradle:
      - yes
    prebuild:
      - patch -p1 -d ../../../libsignal-src < ../libsignal.patch
      - rustup default 1.94.1
      - rustup target add aarch64-linux-android armv7-linux-androideabi i686-linux-android x86_64-linux-android
      - 'TOOLCHAIN=$(grep channel ../../../libsignal-src/rust/rust-toolchain.toml | sed ''s/.*"\(.*\)".*/\1/'') && rustup toolchain install "$TOOLCHAIN" && rustup target add --toolchain "$TOOLCHAIN" aarch64-linux-android armv7-linux-androideabi i686-linux-android x86_64-linux-android'
    scandelete:
      - backend
      - libsignal-src/rust/attest/fuzz/seeds/dcap/cds2_test
    ndk: r25c
    gradleprops:
      - fdroid=true

AutoUpdateMode: Version
UpdateCheckMode: Tags
