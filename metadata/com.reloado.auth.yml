AntiFeatures:
  - NonFreeNet
Categories:
  - Security
License: AGPL-3.0-only
AuthorName: Reloado
SourceCode: https://github.com/refda/reloado_auth
IssueTracker: https://github.com/refda/reloado_auth/issues

AutoName: Reloado Auth

RepoType: git
Repo: https://github.com/refda/reloado_auth

Builds:
  - versionName: 1.0.2
    versionCode: 3
    commit: ce8cc96
    output: build/app/outputs/flutter-apk/app-release-arm64-v8a.apk
    srclibs:
      - flutter@stable
    prebuild:
      - flutterVersion=$(sed -n -E "s/.*flutter-version:\ '(.*)'/\1/p" .github/workflows/release.yml)
      - '[[ $flutterVersion ]]'
      - git -C $$flutter$$ checkout -f $flutterVersion
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get
    scandelete:
      - .pub-cache
    build:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter build apk --release --split-per-abi --target-platform=android-arm64

AutoUpdateMode: Version
UpdateCheckMode: Tags
UpdateCheckData: pubspec.yaml|version:\s.+\+(\d+)|.|version:\s(.+)\+
CurrentVersion: 1.0.2
CurrentVersionCode: 3
