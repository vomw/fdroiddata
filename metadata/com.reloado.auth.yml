AntiFeatures:
  NonFreeNet:
    en-US: Optional cloud sync with auth.reloado.com, a proprietary cloud service.
Categories:
  - Password & 2FA
License: AGPL-3.0-only
AuthorName: Reloado
SourceCode: https://github.com/refda/reloado_auth
IssueTracker: https://github.com/refda/reloado_auth/issues

AutoName: Reloado Auth

RepoType: git
Repo: https://github.com/refda/reloado_auth

Builds:
  - versionName: 1.0.2
    versionCode: 32
    commit: 0b491adb62e0c8506b312bb4e2f0bcef9fd959f7
    output: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
    srclibs:
      - flutter@stable
    prebuild:
      - flutterVersion=$(sed -n -E "s/.*flutter-version:\ '(.*)'/\1/p" .github/workflows/release.yml)
      - '[[ $flutterVersion ]]'
      - git -C $$flutter$$ checkout -f $flutterVersion
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get
    scandelete:
      - .pub-cache
    build:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter build apk --release --split-per-abi

AutoUpdateMode: Version
UpdateCheckMode: Tags
CurrentVersion: 1.0.2
CurrentVersionCode: 32
