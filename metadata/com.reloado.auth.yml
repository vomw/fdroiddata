AntiFeatures:
  NonFreeNet:
    en-US: Optional cloud sync with auth.reloado.com, a proprietary cloud service.
Categories:
  - Password & 2FA
License: AGPL-3.0-only
AuthorName: Reloado
SourceCode: https://github.com/refda/reloado_auth
IssueTracker: https://github.com/refda/reloado_auth/issues

AutoName: Reloado Auth

RepoType: git
Repo: https://github.com/refda/reloado_auth

Builds:
  - versionName: 1.0.2
    versionCode: 3
    commit: ee05c7cfc4fa94b2ac975ae87de900744e0c97a1
    output: build/app/outputs/flutter-apk/app-release.apk
    srclibs:
      - flutter@stable
    prebuild:
      - git -C $$flutter$$ checkout -f 3.29.3
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get
    scandelete:
      - .pub-cache
    build:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter build apk --release

AutoUpdateMode: Version
UpdateCheckMode: Tags
UpdateCheckData: pubspec.yaml|version:\s.+\+(\d+)|.|version:\s(.+)\+
CurrentVersion: 1.0.2
CurrentVersionCode: 3
