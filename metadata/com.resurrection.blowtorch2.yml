AutoName: BlowTorch 2
RepoType: git
Repo: https://github.com/Taracair/BlowTorch2.git
Builds:
  - versionName: 2.4.3
    versionCode: 263
    commit: aa17f4a92ad2d46677103b9e37b64ebebb52ecdf
    subdir: BT_Free
    sudo:
      - apt-get update || apt-get update
      - echo 'deb http://deb.debian.org/debian bookworm main' > /etc/apt/sources.list.d/bookworm.list
      - echo 'Package: openjdk-17-jdk-headless' > /etc/apt/preferences.d/bookworm-openjdk17
      - echo 'Pin: release n=bookworm' >> /etc/apt/preferences.d/bookworm-openjdk17
      - echo 'Pin-Priority: 500' >> /etc/apt/preferences.d/bookworm-openjdk17
      - apt-get update
      - apt-get install -y gcc-multilib libc6-dev-i386 make
      - apt-get install -y -t bookworm openjdk-17-jdk-headless
      - update-alternatives --set java /usr/lib/jvm/java-17-openjdk-amd64/bin/java
      - update-alternatives --set javac /usr/lib/jvm/java-17-openjdk-amd64/bin/javac
    gradle:
      - production
    prebuild:
      - sed -i -e '/^org.gradle.java.home=/d' ../gradle.properties
      - echo 'org.gradle.java.home=/usr/lib/jvm/java-17-openjdk-amd64' >> ../gradle.properties
      - echo 'blowtorch.fdroid=true' >> ../gradle.properties
      - sdkmanager "platforms;android-36" "build-tools;36.0.0"
    build:
      - export NDK_HOME=$$NDK$$ ANDROID_HOME=$$SDK$$
      - cd .. && ./build_ndk_libraries.sh
    ndk: r26b
MaintainerNotes: |
  Production flavor only (applicationId com.resurrection.blowtorch2).
  Do not enable btTest. Native LuaJIT is compiled by
  ./build_ndk_libraries.sh into BTLib/libs/ (not in git). Both
  LuaJIT trees are vendored; the script must not hit the network.
  HOST_CC="gcc -m32" needs gcc-multilib. Unsigned release unless
  BT_LOCAL_SIGN=1; F-Droid signs. gradle.properties may still contain
  an Arch java.home; prebuild sed deletes it and writes the Debian path.
  blowtorch.fdroid=true makes the automatic GitHub update check default
  off in this APK; GitHub-signed builds leave it on.

  Debian Trixie (buildserver) has no openjdk-17. Gradle 8.2 cannot run
  on the image JDK 21, so sudo installs openjdk-17 from bookworm,
  pinned so the rest of the image stays Trixie.

  MANAGE_EXTERNAL_STORAGE is opt-in UX for a visible /BlowTorch/
  folder. Connecting works from app storage without the grant.
  Launcher and in-session import/export/backup use SAF or app storage
  without opening the All-files screen first. Overlay and
  ignore-battery are opt-in at use. Foreground service type
  specialUse keeps the MUD TCP session alive with the screen off.
  usesCleartextTraffic is for telnet worlds the user adds.
  See docs/FDROID_README.md.

  F-Droid users should update via F-Droid. versionName lives on the
  production flavor; UpdateCheckData skips the btTest "*-test" name.
AutoUpdateMode: Version
UpdateCheckMode: Tags ^v[0-9.]+$
UpdateCheckData: BT_Free/build.gradle|versionCode\s+(\d+)|.|versionName\s+"([\d.]+)"
