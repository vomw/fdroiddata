AutoName: inout
Summary: One-tap file sharing via browser — one install, everyone uploads & downloads
Description: |-
  inout is a graphical file sharing application that lets you share files
  from your device to any browser on your local network.

  Features:
  * One-tap file sharing via HTTP
  * Upload files from any browser
  * QR code for easy access
  * File transfer log
  * Customizable permissions
  * Multi-language support
  * Material 3 design

RepoType: git
Repo: https://github.com/zocs/inout

Builds:
  - versionName: '0.2.8'
    versionCode: 28
    commit: d73bc8c0dbf0cf271f7e30ef244c9c6e9ff48fa2
    ndk: r27
    output: build/app/outputs/flutter-apk/app-release.apk
    sudo:
      - apt-get update
      - apt-get install -y protobuf-compiler build-essential curl
      - curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
      - /root/.cargo/bin/rustup target add aarch64-linux-android
    init:
      - git clone --depth 1 --branch 3.41.5 https://github.com/flutter/flutter.git .flutter
      - .flutter/bin/flutter precache --android
      - .flutter/bin/flutter config --no-analytics
    prebuild:
      - export PATH="$PWD/.flutter/bin:$PATH"
      - export PUB_CACHE="$PWD/.pub-cache"
      - .flutter/bin/flutter pub get
      - NDK=$(find "$ANDROID_HOME/ndk" -maxdepth 1 -type d | sort -V | tail -1)
      - export ANDROID_NDK_HOME="$NDK"
      - export PATH="$PATH:/root/.cargo/bin"
      - bash scripts/build_dufs.sh android-arm64
    scanignore:
      - .flutter/bin/cache
    scandelete:
      - .flutter
      - .pub-cache
    build:
      - export PATH="$PWD/.flutter/bin:$PATH"
      - export PUB_CACHE="$PWD/.pub-cache"
      - .flutter/bin/flutter build apk --release

