    ndk: r27    subdir: android    sudo:      - apt-get update      - apt-get install -y protobuf-compiler build-essential    init:      - cd ..      - flutterVersion=$(sed -n -E "s/.*flutter-version:\ '(.*)'/\1/p" .github/workflows/build.yml | head -n 1)      - '[[ $flutterVersion ]]'      - git clone --depth 1 --branch ${flutterVersion} https://github.com/flutter/flutter.git      - export PATH="$PWD/flutter/bin:$PWD/flutter/bin/cache/dart-sdk/bin:$PATH"      - flutter precache --android      - flutter config --no-analytics    prebuild:      - export PATH="$PWD/flutter/bin:$PWD/flutter/bin/cache/dart-sdk/bin:$PATH"      # Install Rust      - curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y      - source $HOME/.cargo/env      - rustup target add aarch64-linux-android      # Compile dufs from source      - cd ..      - NDK=$(find "$ANDROID_HOME/ndk" -maxdepth 1 -type d | sort -V | tail -1)      - export ANDROID_NDK_HOME="$NDK"      - bash scripts/build_dufs.sh android-arm64      - cd android    build:      - export PATH="$PWD/flutter/bin:$PWD/flutter/bin/cache/dart-sdk/bin:$PATH"      - cd ..      - flutter build apk --releaseAllowedAPKSigningKeys:  - E4DB9054FF7070E4BEE3387E928E1388FACFEC0526DA10E4510282E9D26AED6AAutoUpdateMode: VersionUpdateCheckMode: TagsCurrentVersion: 0.2.8CurrentVersionCode: 28