AuthorName: Mirage Foundation
WebSite: https://mirage.talk
SourceCode: https://github.com/MirageFoundation/mirage-mobile-app
IssueTracker: https://github.com/MirageFoundation/mirage-mobile-app/issues

RepoType: git
Repo: https://github.com/MirageFoundation/mirage-mobile-app.git

Builds:
  - versionName: 1.0.13
    versionCode: 1013
    commit: 287bf94736a4f188d18d6b52db65219d813a2208
    sudo:
      - sysctl fs.inotify.max_user_watches=524288 || true
      - echo "deb http://deb.debian.org/debian bookworm main" > /etc/apt/sources.list.d/bookworm.list
      - apt-get update
      - apt-get install -y nodejs
      - apt-get install -y -t bookworm openjdk-17-jdk
      - curl -Lo bun.zip https://github.com/oven-sh/bun/releases/download/bun-v1.3.8/bun-linux-x64.zip
      - echo "0322b17f0722da76a64298aad498225aedcbf6df1008a1dee45e16ecb226a3f1  bun.zip"
        | sha256sum -c -
      - unzip bun.zip
      - install -m 0755 bun-linux-x64/bun /usr/local/bin/bun
    init:
      - bun install --frozen-lockfile
      - bun -e 'const fs=require("fs"); const p=require("./package.json"); const 
        exclude=["expo-dev-client","expo-dev-launcher","expo-dev-menu","expo-dev-menu-interface","@sentry/react-native","sentry-react-native","expo-updates","expo-updates-interface","expo-eas-client","expo-notifications"];
        for (const name of 
        ["expo-dev-client","expo-dev-launcher","expo-dev-menu","expo-dev-menu-interface"])
        { delete p.dependencies?.[name]; delete p.devDependencies?.[name]; } p.expo
        ??= {}; p.expo.autolinking ??= {}; p.expo.autolinking.exclude=exclude; p.expo.autolinking.android
        ??= {}; p.expo.autolinking.android.buildFromSource=[".*"]; fs.writeFileSync("package.json",
        JSON.stringify(p,null,2)+"\n");'
      - rm -rf node_modules/expo-dev-client node_modules/expo-dev-launcher node_modules/expo-dev-menu
        node_modules/expo-notifications/android
      - sed -i -e '/reactCompiler/s/true/false/' app.config.ts
    output: android/app/build/outputs/apk/release/*release*.apk
    prebuild: EXPO_NO_GIT_STATUS=1 EXPO_NO_TELEMETRY=1 EXPO_PUBLIC_FDROID=true bun
      x expo prebuild --platform android --clean --no-install
    scanignore:
      - node_modules/expo-modules-autolinking/scripts/android/autolinking_implementation.gradle
      - node_modules/expo-modules-core/android/ExpoModulesCorePlugin.gradle
      - node_modules/react-native/sdks/hermesc/linux64-bin/hermesc
      - node_modules/@react-native-community/netinfo/android/build.gradle
      - node_modules/expo-application/android/build.gradle
      - node_modules/react-native-edge-to-edge/android/build.gradle
      - node_modules/react-native-get-random-values/android/build.gradle
      - node_modules/react-native-haptic-feedback/android/build.gradle
      - node_modules/react-native-keyboard-controller/android/build.gradle
      - node_modules/react-native-pager-view/android/build.gradle
      - node_modules/react-native-safe-area-context/android/build.gradle
      - node_modules/react-native-screens/android/build.gradle
      - node_modules/react-native-svg/android/build.gradle
      - node_modules/react-native-webview/android/build.gradle
    scandelete:
      - node_modules/
      - dist-test/
    build:
      - cd android
      - sed -i -e '/signingConfig /d' app/build.gradle
      - EXPO_PUBLIC_FDROID=true NODE_ENV=production NODE_OPTIONS=--max-old-space-size=1024
        ANDROID_HOME=$$SDK$$ ANDROID_SDK_ROOT=$$SDK$$ JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64
        gradle :app:assembleRelease --no-daemon --max-workers=1 -Dorg.gradle.vfs.watch=false
        -x lintVitalRelease -x lintVitalAnalyzeRelease -x generateReleaseLintVitalReportModel
        -x lintVitalReportRelease

AutoUpdateMode: Version
UpdateCheckMode: Tags
UpdateCheckData: app.config.ts|versionCode:\s(\d+)|.|version:\s"([\d.]+)"
CurrentVersion: 1.0.13
CurrentVersionCode: 1013
