AutoName: GitFlow Mobile
Summary: Manage GitHub repositories and builds from Android.
Description: |-
  Manage GitHub repositories from Android with an interface designed for accessibility and TalkBack.

  Browse, create, and delete repositories; deletion requires typing the repository name. Search repositories, users, organizations, and code. Download APKs from repository releases and request installation through Android. Upload ZIP archives as commits, or start GitHub Actions builds and download the resulting APK and build log.

  A GitHub Personal Access Token and an internet connection are required. The token is stored encrypted on the device and used for actions the user initiates. GitHub is a non-free network service.
AntiFeatures:
  - NonFreeNet
