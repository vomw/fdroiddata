CurrentVersion: '1.0'
CurrentVersionCode: 1
MaintainerNotes: |-
  The app uses GitHub's API and Actions and requires a classic Personal Access Token with repo, workflow, and delete_repo scopes. Repository deletion requires the user to type the repository name.
  The published release is tagged v1.0.0, while Gradle declares versionName 1.0. The proposed build uses the current main commit and static update checks until a future release tag aligns with the app version.
  The Gradle 9.6.1 distribution checksum is pinned in the upstream wrapper properties. Build validation has not yet been run by F-Droid maintainers.