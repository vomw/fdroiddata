AutoName: VOID Launcher

Summary: Minimal text-based launcher with alias support
Description: |-
  A minimal launcher with a dark screen and terminal-style search.
  No icons, no widgets, no animations, no internet, no tracking.
  Tap anywhere to open the search, type the first letters of any app
  and it opens instantly. Supports custom aliases for any installed app.

Builds:
  - versionName: '1.0'
    versionCode: 1
    commit: v1.0
    subdir: app
    gradle:
      - yes

AutoUpdateMode: None
UpdateCheckMode: None
