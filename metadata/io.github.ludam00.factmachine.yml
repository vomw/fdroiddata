AutoName: Fact Machine
Description: |-
  Découvrez un nouveau fait de culture générale chaque jour : sciences, espace,
  histoire, nature, géographie et plus encore. Parcourez librement les faits
  précédents par catégorie, gardez vos favoris, et affichez le fait du jour
  directement sur votre écran d'accueil grâce au widget intégré.

  Aucune donnée personnelle collectée, aucun tracking, aucune revente de
  données. Le contenu est enrichi automatiquement chaque jour.

