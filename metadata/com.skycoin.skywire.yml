Categories:
  - Connectivity
  - Messaging
  - VPN & Proxy
  - Wallet
License: AGPL-3.0-only
AuthorName: Skycoin
WebSite: https://www.skycoin.com
SourceCode: https://github.com/skycoin/skywire
IssueTracker: https://github.com/skycoin/skywire/issues
Changelog: https://github.com/skycoin/skywire/releases

AutoName: Skywire

RepoType: git
Repo: https://github.com/skycoin/skywire.git

Builds:
  - versionName: 0.0.5
    versionCode: 5
    commit: e8a4d78b1e32a81d8ed599e9b0e9d5af2bdaaf11
    subdir: android/app
    sudo:
      - apt-get update
      - apt-get install -y golang-go make curl
      - curl -fsSLo /tmp/tinygo.deb 
        https://github.com/tinygo-org/tinygo/releases/download/v0.42.0/tinygo_0.42.0_amd64.deb
      - echo "2082c4762fea6d5cc4cd1f4a243eaacf07b12f576717d4c6b74828bd163cb563  /tmp/tinygo.deb"
        | sha256sum -c -
      - apt-get install -y /tmp/tinygo.deb
    gradle:
      - yes
    rm:
      - pkg/router/policy/wasm/presets/bundle.wasm
    scanignore:
      - pkg/pty/term.html.gz
    scandelete:
      - pkg/geoip/GeoLite2-City.mmdb.gz
      - pkg/wasmhv/execwasm/blob
      - docs/examples/routing-policies/wasm/*/*.wasm
      - vendor/github.com/blang/semver/package.json
      - vendor/github.com/go-redis/redis/v8/package.json
    build:
      - cd ../..
      - export GOTOOLCHAIN=auto GOPROXY=https://proxy.golang.org,direct GOSUMDB=sum.golang.org
      - make bundle-wasm
      - ANDROID_NDK_HOME=$$NDK$$ make android-mobile-ndk
    ndk: r27c
    gradleprops:
      - skywireFdroid=true

AutoUpdateMode: Version
UpdateCheckMode: Tags ^fdroid-v[0-9]+\.[0-9]+\.[0-9]+$
UpdateCheckData: 
  android/version.properties|(?m)^versionCode=(\d+)$|android/version.properties|(?m)^versionName=(\S+)$
CurrentVersion: 0.0.5
CurrentVersionCode: 5
