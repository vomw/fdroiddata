Builds:
  - versionName: 0.4.0
    versionCode: 13
    commit: 4f619335f4c69c05fbdb3a50ae0d4b6157b671d9
    subdir: app
    gradle:
      - yes
    prebuild:
      - sed -i -e '/^val keystorePropertiesFile = rootProject.file/,/^}$/d' build.gradle.kts
      - sed -i -e '/^    signingConfigs {$/,/^    }$/d' build.gradle.kts
      - sed -i -e '/^            signingConfig = if (keystorePropertiesFile.exists()) {$/,/^            }$/d' build.gradle.kts
      - sed -i -e '/^    splits {$/,/^    }$/d' build.gradle.kts

AutoUpdateMode: Version
UpdateCheckMode: Tags ^v\d+\.\d+\.\d+$
UpdateCheckData: 'app/build.gradle.kts|versionCode\s*=\s*(\d+)|.|versionName\s*=\s*"(.*?)"'
