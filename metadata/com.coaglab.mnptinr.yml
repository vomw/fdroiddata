Summary: MNPT, INR, and DRVVT reports for coagulation laboratories
Description: |-
  Coag Lab Tools helps hematology and coagulation laboratories with routine calculations and reports.

  MNPT & INR:
  * Enter PT for 20 normal individuals (optional APTT)
  * Mean, SD, reference range (mean ± 2SD), CV%
  * ISI set once by admin (password protected)
  * INR = (Patient PT / MNPT) ^ ISI
  * Save studies locally and export PDF reports

  DRVVT / Lupus Anticoagulant:
  * Screen, mix, and confirm ratios with ISTH-style interpretation
  * Configurable ratio cutoffs in Admin
  * Save reports locally and export PDF

  All data stays on your device. No network access, no ads, no tracking.

  This app is a laboratory calculation tool. It does not provide medical advice.

