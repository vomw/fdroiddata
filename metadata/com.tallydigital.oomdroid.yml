    sudo:
      - apt-get update
      - apt-get install -y cmake
    gradle:
      - yes
    ndk: 27.2.12479018

MaintainerNotes: |-
  Native CMake build of the in-repo 1oom engine (src/) plus Android hw/os/audio
  backends. No prebuilt .so files. NDK is pinned in app/build.gradle.kts to
  27.2.12479018 (r27c). Gradle wrapper 9.5.0 has a distributionSha256Sum.

  The APK does not contain Master of Orion LBX files. Users supply a legally
  owned v1.3 set (including V11.LBX) via the SAF folder picker. No storage
  permission is requested. The app is offline (no INTERNET permission).

  Fastlane metadata lives in the app repo. First release is F-Droid-signed.
  Reproducible / developer-signed was attempted (Binaries + AllowedAPKSigningKeys
  against the GitHub APK). Two consecutive F-Droid CI builds of the same commit
  do not produce the same APK digest (native CMake .so / zip), so signature
  copy fails even when unpacked file lists match.

AutoUpdateMode: Version
UpdateCheckMode: Tags
UpdateCheckData: app/build.gradle.kts|appVersionCode = (\d+)|.|appVersionName = "(.+)"
