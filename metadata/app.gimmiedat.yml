AntiFeatures:
  NonFreeNet:
    en-US: Downloads from YouTube, Instagram, TikTok, X and other non-free services.
      Fetches yt-dlp updates from GitHub, but only when you tap update yt-dlp.
Categories:
  - Download
License: GPL-3.0-only
AuthorName: rcrandon
SourceCode: https://github.com/rcrandon/gimmiedat
IssueTracker: https://github.com/rcrandon/gimmiedat/issues
Changelog: https://github.com/rcrandon/gimmiedat/releases

AutoName: Gimmie 'Dat

RepoType: git
Repo: https://github.com/rcrandon/gimmiedat.git

Builds:
  - versionName: 1.0.2
    versionCode: 3
    commit: 9cd52e7670035af24726085080d301dfd1cebf17
    subdir: app
    submodules: true
    sudo:
      - apt-get update
      - apt-get install -y make zip
    gradle:
      - yes
    rm:
      - app/src/main/res/raw/ytdlp
    prebuild:
      - make -C ../external/yt-dlp lazy-extractors yt-dlp
      - mv ../external/yt-dlp/yt-dlp src/main/res/raw/ytdlp
    scanignore:
      - app/src/main/res/raw/ytdlp
    gradleprops:
      - gimmiedat.autoUpdateYtDlp=false
      - gimmiedat.abis=arm64-v8a

AutoUpdateMode: Version
UpdateCheckMode: Tags ^v[0-9.]+$
CurrentVersion: 1.0.2
CurrentVersionCode: 3
