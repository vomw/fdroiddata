AutoName: CassetteCat
Summary: Privacy-first music player for local media and self-hosted streaming
Description: |-
  CassetteCat is a privacy-first, open-source Android music player engineered
  for local media ownership and self-hosted streaming.

  Features:
  * Audio & Playback: Built on AndroidX Media3 (ExoPlayer) with background
    playback, lock screen controls, and system media integration.
  * Hardware DSP & EQ: Parametric equalizer, bass boost, virtualizer, and
    loudness enhancer.
  * Synchronized Lyrics: Real-time karaoke-style lyrics powered by LRCLIB and
    embedded ID3 tags.
  * Self-Hosted Streaming: Connect seamlessly to your own Subsonic (Navidrome,
    Gonic, Airsonic) or Jellyfin music server.
  * Offline Downloads: Cache tracks for offline listening anywhere.
  * Scrobbling: Scrobble your plays to ListenBrainz and Libre.fm.
  * Tactile Dark Design: Clean industrial dark UI, dynamic artwork theming,
    and smooth haptic feedback.
  * Ultra-HD Share Cards: Generate 2160x2700 poster cards for tracks and
    lyrics excerpts.
  * Home Screen Widget: Control playback and view current album art directly
    from your home screen.

  Privacy First:
  * 100% local-first: Zero third-party trackers, zero telemetry, and zero
    Google Play Services dependencies.
  * Hardware-backed encryption via AndroidKeyStore for all streaming server
    credentials.
  * Free and open source licensed under GPL-3.0.

