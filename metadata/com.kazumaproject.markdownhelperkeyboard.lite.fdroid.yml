MaintainerNotes: |
  Build the liteFdroid flavor only.

  The upstream repository contains the llama.cpp submodule for the full edition,
  but this F-Droid package builds the lightweight flavor only and does not use
  the optional zenz or gemma model features.

  This intentionally uses a new package ID for the dedicated F-Droid flavor:
  com.kazumaproject.markdownhelperkeyboard.lite.fdroid

  The existing fdroiddata entry for com.kazumaproject.markdownhelperkeyboard is a
  different package and signing history, so this submission is kept separate.

  Upstream fastlane metadata lives in fastlane/metadata/android/.

  The submission draft builds the existing releaseUnsigned build type and reads
  the APK from app/build/outputs/apk/liteFdroid/releaseUnsigned/.

Builds:
  - versionName: 1.7.24-lite-fdroid
    versionCode: 718
    commit: 6fd6ad0fcc80f7f294ab075e1bef580be4327b02
    output: 
      app/build/outputs/apk/liteFdroid/releaseUnsigned/app-liteFdroid-release-unsigned.apk
    scanignore:
      - app/src/main/assets/*.dat.zip
      - app/src/main/assets/*/*.dat.zip
    build: gradle assembleLiteFdroidReleaseUnsigned

