Builds:
  - versionName: 1.2.3
    versionCode: 10
    commit: e43ceff96120b5a0c7a7156f220db9a260febffd
    submodules: true
    sudo:
      - mkdir -p /home/m
      - chown vagrant /home/m
    output: build/app/outputs/flutter-apk/app-release.apk
    rm:
      - ios
      - linux
      - macos
      - web
      - windows
    prebuild:
      - export repo=/home/m/dev/projects/apps
      - mkdir -p $repo
      - cd ..
      - mv de.swgross.calorimeter $repo/calorimeter
      - pushd $repo/calorimeter
      - export PUB_CACHE=$(pwd)/.pub-cache
      - .flutter/bin/flutter config --no-analytics
      - .flutter/bin/flutter pub get --enforce-lockfile
      - popd
      - mv $repo/calorimeter de.swgross.calorimeter
    scanignore:
      - .flutter/bin/cache
    scandelete:
      - .flutter
      - .pub-cache
    build:
      - export repo=/home/m/dev/projects/apps
      - cd ..
      - mv de.swgross.calorimeter $repo/calorimeter
      - pushd $repo/calorimeter
      - export PUB_CACHE=$(pwd)/.pub-cache
      - .flutter/bin/flutter build apk --release
      - popd
      - mv $repo/calorimeter de.swgross.calorimeter

