Summary: Offline password manager

Description: |
  VaultX is a fully offline, privacy-first password manager.

  • No internet access
  • No cloud sync
  • AES-256 encryption
  • Biometric and PIN authentication
  • Deterministic password generation
  • Secure local backups

  Your passwords never leave your device.
