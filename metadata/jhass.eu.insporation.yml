AutoName: insporation*

RepoType: git
Repo: https://github.com/jhass/insporation

Builds:
  - versionName: 1.3.0
    versionCode: 4581
    commit: 37e53decf7b35cd2482ace544186e9183c9c8f85
    output: build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
    srclibs:
      - flutter@stable
    rm:
      - ios
      - web
    prebuild:
      - flutterVersionPattern=$(sed -n -E "s/.*flutter-version:\ '(.*)'/\1/p" .github/workflows/release.yml
        | head -n1)
      - '[[ $flutterVersionPattern ]]'
      - if [[ "$flutterVersionPattern" == *x* ]]; then flutterVersion=$(git -C $$flutter$$
        tag -l "${flutterVersionPattern//x/*}" --sort=-v:refname | head -n1); else
        flutterVersion="$flutterVersionPattern"; fi
      - '[[ $flutterVersion ]]'
      - git -C $$flutter$$ checkout -f "$flutterVersion"
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get
    scandelete:
      - .pub-cache
    build:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - export BUILD_DATE="$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
      - $$flutter$$/bin/flutter build apk --release --split-per-abi --target-platform="android-arm"
        --android-project-arg=fdroidAbiSplit=true --build-number=$(( $$VERCODE$$ /
        10 )) --dart-define=BUILD_COMMIT=$$COMMIT$$ --dart-define=BUILD_DATE=$BUILD_DATE

