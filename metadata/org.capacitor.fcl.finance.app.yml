# This tells F-Droid HOW to build your app
Builds:
  - versionName: 1.0.1
    versionCode: 1
    commit: v1.0.1
    subdir: src-android/android/app
    sudo:
      - sysctl fs.inotify.max_user_watches=524288 || true
      - echo "deb https://deb.debian.org/debian trixie main" > /etc/apt/sources.list.d/trixie.list
      - apt-get update
      - apt-get install -y -t trixie openjdk-21-jdk-headless
      - update-alternatives --auto java
      - curl -Lo node.tar.gz https://nodejs.org/dist/v22.22.0/node-v22.22.0-linux-x64.tar.gz
      - echo "eb5b031bdd728871c3b9a82655dbfa533bc262c0b6da1d09a86842430cef07d4 node.tar.gz"
        | sha256sum -c -
      - tar xzf node.tar.gz --strip-components=1 -C /usr/local/
    gradle:
      - yes
    output: build/outputs/apk/release/app-release.apk
    scanignore:
      - node_modules/@capacitor/cli/assets/capacitor-cordova-android-plugins.tar.gz
    scandelete:
      - node_modules
    build: yarn install && yarn build:android
    ndk: r21e

# Auto-update new releases (once this is approved)
AutoUpdateMode: Version
UpdateCheckMode: Tags
