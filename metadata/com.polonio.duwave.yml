AutoName: DuWave
Summary: Reproductor de música local dinámico y elegante.
Description: |-
  DuWave es un reproductor de música local de código abierto, diseñado con Jetpack Compose y enfocado en el rendimiento y una experiencia visual inmersiva.
  
  Características principales:
  * Reproducción fluida y soporte optimizado mediante ExoPlayer.
  * Interfaz dinámica que extrae colores de las portadas de tus álbumes usando Palette API.
  * Visualizador de audio y ecualizador visual en tiempo real.
  * Gestión completa de biblioteca: Listas de reproducción, favoritos, álbumes y carpetas locales.

