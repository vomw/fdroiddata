# build verified locally: npm ci at root + gradle in apps/mobile/android -> APK OK
Builds:
  - versionName: 0.1.2
    versionCode: 3
    commit: v0.1.2
    # `subdir` = module Gradle (contient build.gradle, AndroidManifest.xml et le dossier
    # `build/` de sortie). F-Droid y exécute le script `build:` ET y lance `assembleRelease`.
    subdir: apps/mobile/android
    # `gradle: yes` => F-Droid exécute lui-même `assembleRelease` depuis `subdir`
    #   (aucun `./gradlew` à relancer dans `build:` — un seul mécanisme pilote Gradle).
    # Ce n'est PAS un chemin de projet : les autres valeurs sont des « flavours ».
    gradle: yes
    build: |
      # Remonter à la RACINE du monorepo npm workspace pour résoudre gps-shared.
      cd ../../..
      npm ci --ignore-scripts
      cd apps/mobile
      NODE_OPTIONS="--max-old-space-size=4096" npm run prod
      npx cap sync android

