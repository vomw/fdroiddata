Name: SynSound
AutoName: SynSound
Summary: WebView client for the SynSound hosted sound service
Description: |-
  SynSound for Android is a lightweight WebView client for the hosted SynSound web service.
  The current Android APK loads the SynSound web application from the fixed Base44 service endpoint.

  The native Android layer provides the application shell, microphone permission handling,
  WebView integration, file selection and downloads, session persistence, navigation,
  and network/error recovery.

  The repository also contains a native SDK, but the current Android activity does not
  start its monitoring service or native visualization components. Those native SDK
  components are therefore not represented as features of this Android APK.

  The hosted web service is proprietary and network-dependent. No claim is made that
  microphone audio remains on-device when microphone access is granted to the hosted service.

  No ads. No tracking. No analytics SDKs.

