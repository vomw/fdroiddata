AutoName: ArrMatey
Description: |-
  ArrMatey is an all-in-one mobile companion for your home server media stack. Manage your media, indexers, requests, and downloads on the go.

  Features:
  * Combined Dashboard: Centralized overview of all instances, download clients, and requests with customizable cards.
  * Multi-Instance Support: Seamless integration with Sonarr, Radarr, Lidarr, Bookshelf, Listenarr, Prowlarr, and Overseerr / Jellyseerr.
  * Download Client Integration: Monitor and control qBittorrent, Transmission, Deluge, SABnzbd.
  * Library Management: Browse media libraries in list and grid views with sorting and filtering.
  * Interactive Search: Search and filter releases across indexers with one-tap downloads.
  * Calendar & Activity Queue: Track upcoming releases, active downloads, and history events.
  * Stream Monitoring: Keeps tabs on your servers stream activity with Tracearr
  * Advanced Features: Local network switching, custom headers, and encrypted backup & restore.

