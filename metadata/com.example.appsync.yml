License: MIT
WebSite: https://gitlab.com/blueboysin/AppSync
SourceCode: https://gitlab.com/blueboysin/AppSync
IssueTracker: https://gitlab.com/blueboysin/AppSync/-/issues

Name: AppSync
Summary: Peer-to-peer app installer and synced local network application
Description: |-
  AppSync allows you to share installed applications and APKs across devices in your local network using Wi-Fi Direct and mDNS (NSD). You can backup your apps, browse device files, and install APKs seamlessly without an internet connection.
  Features:
  * Fast local file transfer
  * Material UI with Glassmorphism
  * Direct app installation
  * Beautiful icon sharing

RepoType: git
Repo: https://gitlab.com/blueboysin/AppSync.git

Builds:
  - versionName: 1.0
    versionCode: 1
    commit: main
    subdir: app
    gradle:
      - yes

AutoUpdateMode: None
UpdateCheckMode: None
