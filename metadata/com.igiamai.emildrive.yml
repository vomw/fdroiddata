Categories:
  - Emulator
License: GPL-3.0-or-later
AuthorName: igiamai
SourceCode: https://git.launchpad.net/~igiamai/+git/emildrive

AutoName: EmilDrive

RepoType: git
Repo: https://git.launchpad.net/~igiamai/+git/emildrive

Builds:
  - versionName: '1.3'
    versionCode: 1003
    commit: v1.3
    subdir: android/app
    sudo:
      - apt-get update
      - apt-get install -y gcc libc-dev rustup
    gradle:
      - yes
    prebuild:
      - rustup default 1.98.1
      - rustup target add aarch64-linux-android x86_64-linux-android
      - cargo install cargo-ndk --version 4.1.2 --locked
      - sed -i -e '/signingConfig = /d' build.gradle.kts
    build:
      - export PATH=$HOME/.cargo/bin:$PATH ANDROID_NDK_HOME=$$NDK$$
      - cd ../..
      - cargo ndk -t arm64-v8a -t x86_64 -P 26 -o android/app/src/main/jniLibs build
        --release -p emildrive-android
    ndk: 27.2.12479018

AutoUpdateMode: Version
UpdateCheckMode: Tags ^v\d+\.\d+$
VercodeOperation:
  - 1000 + %c
UpdateCheckData: VERSION|\d+\.(\d+)|.|(\d+\.\d+)
CurrentVersion: '1.3'
CurrentVersionCode: 1003
