Categories:
  - Internet
License: GPL-2.0-only
AuthorName: Martin and Paul

AutoName: CheckMK Monitoring

WebSite: https://git.pabr.de/apps/unofficial_checkmk_monitoring
SourceCode: https://git.pabr.de/apps/unofficial_checkmk_monitoring
IssueTracker: https://git.pabr.de/apps/unofficial_checkmk_monitoring/-/issues

RepoType: git
Repo: https://git.pabr.de/apps/unofficial_checkmk_monitoring.git

Builds:
  - versionName: 1.1.1
    versionCode: 21
    commit: v1.1.1
    output: build/app/outputs/flutter-apk/app-release.apk
    srclibs:
      - flutter@stable
    prebuild:
      - git -C $$flutter$$ checkout -f 66dd93f9a27ffe2a9bfc8297506ce066ff51265f
      - rm -f android/key.properties
      - touch android/key.properties
      - rm -f android/local.properties
      - echo "flutter.sdk=$$flutter$$" > android/local.properties
      - v=$(sed -n 's/^version:[[:space:]]*//p' pubspec.yaml | head -n1)
      - vn=${v%%+*}; vc=${v##*+}
      - echo "flutter.versionName=$vn" >> android/local.properties
      - echo "flutter.versionCode=$vc" >> android/local.properties
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get
    scandelete:
      - .pub-cache
    build:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter pub get
      - $$flutter$$/bin/flutter build apk --release

AutoUpdateMode: Version
UpdateCheckMode: Tags v\d+\.\d+\.\d+$
UpdateCheckData: pubspec.yaml|version:\s.+\+(\d+)|.|version:\s(.+)\+
CurrentVersion: 1.1.1
CurrentVersionCode: 21