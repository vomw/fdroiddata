Builds:
  - versionName: 3.0.21
    versionCode: 30021
    commit: 87c22f04c7764b3dfc058f6d07dc6565b326d2d0
    subdir: android/app
    sudo:
      - echo "deb https://deb.debian.org/debian forky main" > /etc/apt/sources.list.d/forky.list
      - apt-get update
      - apt-get install -y -t forky nodejs npm
    init:
      - cd ../..
      - npm ci
      - npm run build
      - npx cap sync android --deployment
    gradle:
      - yes
    scanignore:
      - android/build.gradle
      - node_modules/@capacitor/cli/assets/capacitor-cordova-android-plugins.tar.gz
    scandelete:
      - node_modules

