Categories:
  - Calendar & Agenda
License: GPL-3.0-only
AuthorName: Henrique Couto
AuthorEmail: email+fdroid@henriquecouto.dev
SourceCode: https://github.com/henriquecouto/calendar-sync
IssueTracker: https://github.com/henriquecouto/calendar-sync/issues

AutoName: CalSync

RepoType: git
Repo: https://github.com/henriquecouto/calendar-sync.git

Builds:
  - versionName: 1.0.0
    versionCode: 2
    commit: v1.0.0+2
    output: build/app/outputs/flutter-apk/app-release.apk
    srclibs:
      - flutter@3.44.1
    prebuild:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get
    scandelete:
      - .pub-cache
    build:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter build apk --release

AutoUpdateMode: Version
UpdateCheckMode: Tags ^v[\d.]+[+]?\d*$
UpdateCheckData: pubspec.yaml|version:\s.+\+(\d+)|.|version:\s(.+)\+
CurrentVersion: 1.0.0
CurrentVersionCode: 2
