Builds:
  - versionName: 0.1.0
    versionCode: 1
    commit: affe478584f3687958c7c7dbc08b2bf4bb5144b9
    subdir: app
    output: build/app/outputs/flutter-apk/app-release.apk
    srclibs:
      - flutter@stable
    rm:
      - app/ios
      - app/macos
      - app/linux
      - app/windows
    prebuild:
      - flutterVersion=$(sed -n -E 's/.*FLUTTER_VERSION:.*"([^"]*)".*/\1/p' ../.github/workflows/release.yml)
      - '[[ $flutterVersion ]]'
      - git -C $$flutter$$ checkout -f $flutterVersion
      - export PUB_CACHE="$(pwd)/.pub-cache"
      - $$flutter$$/bin/flutter config --no-analytics --no-cli-animations
      - $$flutter$$/bin/flutter pub get --enforce-lockfile
      - sed -i -e 's/isMinifyEnabled = false/isMinifyEnabled = true/' android/app/build.gradle.kts
    scanignore:
      - packages/notes_core/pubspec.yaml
    scandelete:
      - app/.pub-cache
    build:
      - export PATH="$$flutter$$/bin:$PATH"
      - export PUB_CACHE="$(pwd)/.pub-cache"
      - ../tool/reproducibility/build_release_apk.sh build/app/outputs/flutter-apk/app-release.apk
    ndk: 28.2.13676358

