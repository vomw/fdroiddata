Builds:
  - versionName: 0.5.1
    versionCode: 91
    commit: 8a5830a12a719c3d7c47f2367eea442134ff5761
    subdir: app
    submodules: true
    output: build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
    srclibs:
      - flutter@stable
    rm:
      - app/ios
      - app/macos
      - app/linux
      - app/windows
    prebuild:
      - flutterVersion=$(sed -n -E 's/.*FLUTTER_VERSION:.*"([^"]*)".*/\1/p' ../.github/workflows/release.yml)
      - '[[ $flutterVersion ]]'
      - git -C $$flutter$$ checkout -f $flutterVersion
      - sed -i -e 's|//f ||' android/app/build.gradle.kts
      - export PUB_CACHE="$(pwd)/.pub-cache"
      - $$flutter$$/bin/flutter config --no-analytics --no-cli-animations
      - $$flutter$$/bin/flutter pub get --enforce-lockfile
    scanignore:
      - packages/notes_core/pubspec.yaml
    scandelete:
      - app/.pub-cache
    build:
      - export PATH="$$flutter$$/bin:$PATH"
      - export PUB_CACHE="$(pwd)/.pub-cache"
      - $$flutter$$/bin/flutter build apk --release --split-per-abi --target-platform=android-arm
    ndk: 28.2.13676358

