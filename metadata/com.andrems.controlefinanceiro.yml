AutoName: Controle Financeiro
Description: |-
 Aplicativo de controle financeiro pessoal, completamente local e sem necessidade de conexão com a internet ou nuvem

 Funcionalidades:
 - Cadastro de contas (corrente, poupança, dinheiro)
 - Cadastro de categorias personalizadas com seleção de ícones
 - Registro de transações com data, valor, conta e categoria
 - Resumo com saldo atual, total de receitas e despesas
 - Histórico de transações agrupado por data, com filtro por período

