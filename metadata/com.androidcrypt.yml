Categories:
  - Security
License: MIT
SourceCode: https://github.com/jmccoy600/androidCrypt
IssueTracker: https://github.com/jmccoy600/androidCrypt/issues
Changelog: https://github.com/jmccoy600/androidCrypt/releases

AutoName: androidcrypt

RepoType: git
Repo: https://github.com/jmccoy600/androidCrypt.git

Builds:
  - versionName: 1.0.4
    versionCode: 4
    commit: 1.0.4
    subdir: app
    sudo:
      - apt-get update
      - apt-get install -y openjdk-21-jdk-headless
      - update-java-alternatives -a
      - sdkmanager "cmake;3.22.1"
    gradle:
      - yes
    prebuild:
      - sed -i 's/version = "4.2.3"/version = "3.22.1"/' build.gradle.kts
      - sed -i 's/cmake_minimum_required(VERSION 4.2.3)/cmake_minimum_required(VERSION
        3.22.1)/' src/main/cpp/CMakeLists.txt

AutoUpdateMode: Version
UpdateCheckMode: Tags
CurrentVersion: 1.0.4
CurrentVersionCode: 4
