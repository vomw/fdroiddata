AutoName: SwipeSSH
Summary: Lightweight SSH client with title-bar swipe session switching
Description: |
  SwipeSSH is a lightweight SSH client focused on a smooth multi-session workflow.

  Sessions stay active while you switch between them, and you can quickly move between terminals by swiping on the connection title bar.

  Features:
  * Swipe between multiple SSH sessions on the connection title bar
  * Sessions remain active in the background
  * Store and reuse connection settings
  * Full ANSI terminal support
  * Host key verification

