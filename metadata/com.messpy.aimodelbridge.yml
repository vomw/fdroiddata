    versionCode: 3
    commit: f2813ef
    submodules: true
    gradle:
      - yes
    output: app/build/outputs/apk/release/app-release-unsigned.apk
    ndk: r28c
    prebuild:
      - sed -i '/org.gradle.toolchains.foojay-resolver-convention/d' settings.gradle.kts
      - sed -i 's/jvmToolchain(17)/jvmToolchain(21)/g' app/build.gradle.kts lib/build.gradle.kts
      - sed -i 's/version = "3.28.3"/version = "3.22.1"/' lib/build.gradle.kts
      - sed -i 's/cmake_minimum_required(VERSION 3.28.3)/cmake_minimum_required(VERSION 3.22.1)/' lib/src/main/cpp/CMakeLists.txt
    scanignore:
      - third_party/llama.cpp/docs/development/llama-star/idea-arch.key

