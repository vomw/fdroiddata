Categories:
  - Science & Education
License: MIT
AuthorName: salinashf
AuthorEmail: salinashf@gmail.com
SourceCode: https://gitlab.com/salinashf/calendario-lunar
IssueTracker: https://gitlab.com/salinashf/calendario-lunar/-/issues

RepoType: git
Repo: https://gitlab.com/salinashf/calendario-lunar.git

AutoName: Calendario Lunar
Description: Aplicación sencilla para visualizar las fases lunares y seguir el ciclo lunar.

AutoUpdateMode: Version v%v
UpdateCheckMode: Tags
CurrentVersion: 1.1.0+2
CurrentVersionCode: 2

Builds:
  - versionName: 1.1.0+2
    versionCode: 2
    commit: v1.1.0+2
    subdir: .
    srclibs:
      - flutter@3.24.3
    prebuild:
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get
      # Eliminamos los rm innecesarios ya que 'check source code' está en verde
      # Así es como se ponen si realmente quieres que se queden:
      - rm -f .pub-cache/hosted/pub.dev/archive-3.6.1/web/res/readme.zip
      - rm -f .pub-cache/hosted/pub.dev/analyzer-6.7.0/example/ddd03.exe
    build:
      - export PUB_CACHE=$$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter build apk --release --no-pub
    output: build/app/outputs/flutter-apk/app-release.apk
