Categories:
  - Science & Education
License: MIT
AuthorName: salinashf
AuthorEmail: salinashf@gmail.com
SourceCode: https://gitlab.com/salinashf/calendario-lunar
IssueTracker: https://gitlab.com/salinashf/calendario-lunar/-/issues

AutoName: Calendario Lunar

RepoType: git
Repo: https://gitlab.com/salinashf/calendario-lunar.git

Builds:
  - versionName: v1.1.3
    versionCode: 1
    commit: v1.1.3
    subdir: app
    output: build/app/outputs/flutter-apk/app-release.apk
    srclibs:
      - flutter@3.24.3
    prebuild:
      - rm -rf $(pwd)/.pub-cache
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get
      - rm -f $(pwd)/.pub-cache/hosted/pub.dev/archive-3.6.1/web/res/readme.zip
      - rm -f $(pwd)/.pub-cache/hosted/pub.dev/analyzer-6.7.0/example/ddd03.exe
    scandelete:
      - .pub-cache
    build: $$flutter$$/bin/flutter build apk --release

AutoUpdateMode: None
UpdateCheckMode: None
UpdateCheckData: pubspec.yaml|version:\s.+\+(\d+)|.|version:\s(.+)\+
CurrentVersion: 1.1.3
CurrentVersionCode: 1
