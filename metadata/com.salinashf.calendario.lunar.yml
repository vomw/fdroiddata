Categories:
  - Science & Education
License: MIT
AuthorName: Calendario Lunar Authors
SourceCode: https://gitlab.com/salinashf/calendario-lunar
IssueTracker: https://gitlab.com/salinashf/calendario-lunar/-/issues

RepoType: git
Repo: https://gitlab.com/salinashf/calendario-lunar.git

AutoUpdateMode: Version v%v
UpdateCheckMode: Tags
CurrentVersion: 1.1.0+2
CurrentVersionCode: 2

Builds:
  - versionName: 1.1.0+2
    versionCode: 2
    commit: v1.1.0+2
    subdir: .
    sudo:
      - apt-get update || apt-get update
      - apt-get install -y git wget unzip gdb libstdc++6 libglu1-mesa fonts-droid-fallback lib32stdc++6 python3
    output: build/app/outputs/flutter-apk/app-release.apk
    srclibs:
      - flutter@3.24.3
    prebuild:
      # Elimina cualquier cache previo
      - rm -rf $(pwd)/.pub-cache
      # Define un cache local limpio
      - export PUB_CACHE=$(pwd)/.pub-cache
      # Configuración inicial de Flutter
      - $$flutter$$/bin/flutter config --no-analytics
      # Descarga dependencias desde pubspec.yaml
      - $$flutter$$/bin/flutter pub get
      - rm -f $(pwd)/.pub-cache/hosted/pub.dev/archive-3.6.1/web/res/readme.zip
      - rm -f $(pwd)/.pub-cache/hosted/pub.dev/analyzer-6.7.0/example/ddd03.exe
    build:
      # Compila el APK en modo release
      - $$flutter$$/bin/flutter build apk --release