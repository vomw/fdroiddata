AutoName: There Yet

RepoType: git
Repo: https://codeberg.org/BW20/there-yet

Builds:
  - versionName: 1.0.4
    versionCode: 101
    commit: 22b6210bc6b1924cf122474e271983fb30246d4e
    sudo:
      - apt-get update
      - apt-get install -y clang
    output: build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
    srclibs:
      - flutter@stable
    prebuild:
      - flutterVersion=$(sed -n -E "s/.*flutter-version:\ '(.*)'/\1/p" .github/workflows/release.yml)
      - '[[ $flutterVersion ]]'
      - git -C $$flutter$$ checkout -f $flutterVersion
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get
      - $$flutter$$/bin/dart run build_runner build --delete-conflicting-outputs
      - $$flutter$$/bin/flutter gen-l10n
      - cd .pub-cache/hosted/pub.dev/geolocator_android-*/android
      - sed -i -e '/gms/d' build.gradle
      - cd src/main/java/com/baseflow/geolocator/location
      - rm FusedLocationClient.java
      - sed -i -e '/if (forceAndroidLocationManager) {/,/^  }/c return new LocationManagerClient(context,
        locationOptions);}' -e '/isGooglePlayServicesAvailable/,/^  }/d' -e '/gms/d'
        GeolocationManager.java
    scandelete:
      - .pub-cache
      - .dart_tool
    build:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter build apk --release --split-per-abi --target-platform=android-arm
        --dart-define=STORE=fdroid

