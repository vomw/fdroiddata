      Donate: https://www.donationalerts.com/r/xiaot

      AutoName: HyperHub

      # Repository summary
      # ---------------------------------------------------------------------------
      # HyperHub is also distributed outside F-Droid (closed-source build with
      # analytics/telemetry, published on the developer's own site and Telegram
      # channel). This F-Droid metadata targets the "-foss" fork/repository only,
      # which is confirmed to be free of trackers, ads SDKs, and non-free
      # dependencies. The app talks to the network only to:
      #   - open external links (Telegram channel, developer contact, donation
      #     page) via ACTION_VIEW intents
      #   - fetch a public CSV (device model list) from raw.githubusercontent.com
      #     for the "Predict" feature (no API key, no tracking)
      # No Firebase, Crashlytics, AdMob, or other analytics/ads SDK is present in
      # this repository.
      #
      # NOTE for reviewers: this is not the app's first release — versionCode/
      # versionName already reflect the app's real version history from its
      # closed-source distribution. This is simply the first version whose source
      # is published. Because F-Droid will sign builds with its own key, users who
      # already installed the closed-source build (signed with the developer's
      # own key) will hit a signature mismatch and need to uninstall/reinstall
      # to switch to the F-Droid build.
      # ---------------------------------------------------------------------------

