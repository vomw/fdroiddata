Summary: Background HTTP monitoring with ntfy and SMS triggers
Description: |
  A background monitoring tool for HTTP endpoints. Features include:
  * Background polling with configurable intervals.
  * Trigger probes based on incoming SMS messages with regex filtering.
  * Integration with ntfy for remote triggering and consumer mode.
  * Detailed logging of all probe attempts and network states.
  * Import and Export configurations via JSON.

