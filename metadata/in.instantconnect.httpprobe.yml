AutoName: Backgroud trigger and Probes
Description: |-
  A Background rest probe tool.

  Features include:
  <ul>
  <li>Background polling with configurable intervals.</li>
  <li>Trigger probes based on incoming SMS messages with regex filtering.</li>
  <li>Integration with ntfy for remote triggering and consumer mode.</li>
  <li>Detailed logging of all probe attempts and network states.</li>
  <li>Import and Export configurations via JSON.</li>
  </ul>

