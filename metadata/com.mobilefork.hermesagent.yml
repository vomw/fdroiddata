Name: Hermes Agent Fork
AutoName: Hermes Agent Fork
Description: |-
  Hermes Agent Fork is an independent community fork of Hermes Agent for Android.
  It is not official Nous Research or Teknium software, and it is not affiliated
  with or endorsed by Nous Research.

  This fork keeps the app identity explicit in the Android package name, app
  title, settings disclosure, and top app banner. In-app status badges show both
  ALPHA and FORK so users can see that they are running fork software.

  Features include local-first Android AI chat workflows, optional device tools,
  provider configuration, and optional connections to user-selected remote AI
  services.

