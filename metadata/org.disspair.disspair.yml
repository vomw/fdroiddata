Categories:
  - Security
License: MIT
WebSite: https://github.com/threadpoolx/DissPair
SourceCode: https://github.com/threadpoolx/DissPair
IssueTracker: https://github.com/threadpoolx/DissPair/issues
RepoType: git
Repo: https://github.com/threadpoolx/DissPair

Name: DissPair
Summary: Bluetooth Security Toolkit
Description: |-
  DissPair is a Python-based security auditing tool designed to test Bluetooth Classic and BLE Vulnerability Assessment.

CurrentVersion: '1.72'
CurrentVersionCode: 172

Builds:
  - versionName: '1.72'
    versionCode: 172
    commit: APK
    ndk: r25b
    sudo:
      - apt-get update
      - apt-get install -y python3-pip python3.13-venv zip unzip default-jdk autoconf libtool pkg-config zlib1g-dev libncurses-dev cmake libffi-dev libssl-dev libsqlite3-dev libbz2-dev
      - mkdir -p /opt/android-sdk/tools/bin
      - printf '#!/bin/bash\necho "Installed packages:"\necho "  Path                 | Version | Description"\necho "  -------              | ------- | -------"\necho "  build-tools;34.0.0   | 34.0.0  | Android SDK Build-Tools 34"\necho "  platforms;android-34 | 3       | Android SDK Platform 34"\nexit 0\n' > /opt/android-sdk/tools/bin/sdkmanager
      - chmod +x /opt/android-sdk/tools/bin/sdkmanager
      - chmod -R a+rwX /opt/android-sdk
    build: |-
      yes | sdkmanager "platforms;android-34" "build-tools;34.0.0" || true
      python3 -m venv venv
      . venv/bin/activate
      pip install buildozer Cython wheel setuptools virtualenv
      sed -i 's/^p\[app\]/\[app\]/' buildozer.spec
      sed -i 's/^#* *android.api *=.*/android.api = 34/' buildozer.spec
      sed -i 's/^#* *android.build_tools_version *=.*/android.build_tools_version = 34.0.0/' buildozer.spec
      sed -i 's/^#* *p4a.branch *=.*/p4a.branch = develop/' buildozer.spec
      sed -i '/^\[app\]/a android.sdk_path = /opt/android-sdk' buildozer.spec
      sed -i '/^\[app\]/a android.ndk_path = /opt/android-sdk/ndk/25.1.8937393' buildozer.spec
      sed -i '/^\[app\]/a android.accept_sdk_license = True' buildozer.spec
      sed -i '/^\[app\]/a android.skip_update = True' buildozer.spec
      buildozer android release > build_log.txt 2>&1 || { tail -n 500 build_log.txt; exit 1; }
    output: bin/disspair-1.72-arm64-v8a_armeabi-v7a-release.apk

AutoUpdateMode: None
UpdateCheckMode: Tags
