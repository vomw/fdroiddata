Categories:
  - Security
License: MIT
WebSite: https://github.com/threadpoolx/DissPair
SourceCode: https://github.com/threadpoolx/DissPair
IssueTracker: https://github.com/threadpoolx/DissPair/issues

Name: DissPair
Summary: Bluetooth Security Toolkit
Description: DissPair is a Python-based security auditing tool designed to test Bluetooth
  Classic and BLE Vulnerability Assessment.

RepoType: git
Repo: https://github.com/threadpoolx/DissPair

Builds:
  - versionName: '1.0'
    versionCode: 1
    commit: APK
    sudo:
      - apt-get update
      - apt-get install -y python3-pip python3.13-venv zip unzip default-jdk autoconf
        libtool libtool-bin pkg-config zlib1g-dev libncurses-dev cmake libffi-dev
        libssl-dev libsqlite3-dev libbz2-dev make build-essential automake dos2unix
      - mkdir -p /opt/android-sdk/tools/bin
      - printf '#!/bin/bash\necho "Installed packages:"\necho "  Path                 |
        Version | Description"\necho "  -------              | ------- | -------"\necho
        "  build-tools;34.0.0   | 34.0.0  | Android SDK Build-Tools 34"\necho "  platforms;android-34
        | 3       | Android SDK Platform 34"\nexit 0\n' > /opt/android-sdk/tools/bin/sdkmanager
      - chmod +x /opt/android-sdk/tools/bin/sdkmanager
      - chmod -R a+rwX /opt/android-sdk
    output: bin/disspair-1.0-arm64-v8a_armeabi-v7a-release.apk
    build: "dos2unix buildozer.spec\nyes | sdkmanager \"platforms;android-34\" \"\
      build-tools;34.0.0\" || true\npython3 -m venv venv\n. venv/bin/activate\npip\
      \ install buildozer Cython wheel setuptools virtualenv\nsed -i '/^\\[app\\]/a\
      \ android.sdk_path = /opt/android-sdk' buildozer.spec\nsed -i '/^\\[app\\]/a android.ndk_path\
      \ = /opt/android-sdk/ndk/25.1.8937393' buildozer.spec\nsed -i '/^\\[app\\]/a android.accept_sdk_license\
      \ = True' buildozer.spec\nsed -i '/^\\[app\\]/a android.skip_update = True' buildozer.spec\n\
      buildozer android release > build_log.txt 2>&1 || { tail -n 1000 build_log.txt;\
      \ exit 1; }"
    ndk: r25b

AutoUpdateMode: None
UpdateCheckMode: None
CurrentVersion: '1.0'
CurrentVersionCode: 1
