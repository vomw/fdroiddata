Categories:
  - Security
License: MIT
WebSite: https://github.com/threadpoolx/DissPair
SourceCode: https://github.com/threadpoolx/DissPair
IssueTracker: https://github.com/threadpoolx/DissPair/issues
RepoType: git
Repo: https://github.com/threadpoolx/DissPair

Name: DissPair
Summary: Bluetooth Security Toolkit
Description: |-
  DissPair is a Python-based security auditing tool designed to test Bluetooth Classic and BLE Vulnerability Assessment.

CurrentVersion: '1.0'
CurrentVersionCode: 1

Builds:
  - versionName: '1.0'
    versionCode: 1
    commit: v1.0
    ndk: r25b
    sudo:
      - apt-get update
      - apt-get install -y python3-pip python3.13-venv zip unzip default-jdk autoconf libtool pkg-config zlib1g-dev libncurses-dev cmake libffi-dev libssl-dev libsqlite3-dev libbz2-dev
    build: |-
      python3 -m venv venv
      . venv/bin/activate
      pip install buildozer Cython==0.29.36 wheel setuptools virtualenv
      sed -i 's|^#* *log_level *=.*|log_level = 2|' buildozer.spec
      sed -i 's|^#* *android.sdk_path *=.*|android.sdk_path = /opt/android-sdk|' buildozer.spec
      sed -i "s|^#* *android.ndk_path *=.*|android.ndk_path = $ANDROID_NDK|" buildozer.spec
      sed -i 's|^#* *android.api *=.*|android.api = 34|' buildozer.spec
      sed -i 's|^#* *android.build_tools_version *=.*|android.build_tools_version = 34.0.0|' buildozer.spec
      sed -i 's|^#* *android.accept_sdk_license *=.*|android.accept_sdk_license = True|' buildozer.spec
      sed -i 's|^#* *android.skip_update *=.*|android.skip_update = True|' buildozer.spec
      buildozer android release > build_log.txt 2>&1 || { tail -n 250 build_log.txt; exit 1; }
    output: bin/disspair-1.0-arm64-v8a_armeabi-v7a-release.apk

AutoUpdateMode: None
UpdateCheckMode: Tags
