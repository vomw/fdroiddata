Categories:
  - Security
License: MIT
WebSite: https://github.com/threadpoolx/DissPair
SourceCode: https://github.com/threadpoolx/DissPair
IssueTracker: https://github.com/threadpoolx/DissPair/issues

Name: DissPair
Summary: Bluetooth Security Toolkit
Description: |-
  DissPair is a Python-based security auditing tool designed to test Bluetooth Classic and BLE Vulnerability Assessment.

RepoType: git
Repo: https://github.com/threadpoolx/DissPair

CurrentVersion: '1.0'
CurrentVersionCode: 1

Builds:
  - versionName: '1.0'
    versionCode: 1
    commit: v1.0
    sudo:
      - apt-get update
      - apt-get install -y python3-pip python3.13-venv zip unzip default-jdk autoconf libtool pkg-config zlib1g-dev libncurses-dev cmake libffi-dev libssl-dev patch git libsqlite3-dev
    build: |-
      python3 -m venv venv
      . venv/bin/activate
      pip install buildozer Cython==0.29.36 wheel setuptools
      # Force stable settings and single architecture
      sed -i 's/^#\? \?android.accept_sdk_license.*/android.accept_sdk_license = True/' buildozer.spec
      sed -i 's/^#\? \?android.api.*/android.api = 34/' buildozer.spec
      sed -i 's/^#\? \?android.archs.*/android.archs = arm64-v8a/' buildozer.spec
      sed -i 's/^#\? \?android.ndk_api.*/android.ndk_api = 24/' buildozer.spec
      sed -i 's/^#\? \?log_level.*/log_level = 2/' buildozer.spec
      yes | buildozer android release
    output: bin/*.apk

AutoUpdateMode: Version %v
UpdateCheckMode: Tags
UpdateCheckData: v\d+\.\d+
