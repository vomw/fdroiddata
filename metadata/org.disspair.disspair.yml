Categories:
  - Security
License: MIT
WebSite: https://github.com/threadpoolx/DissPair
SourceCode: https://github.com/threadpoolx/DissPair
IssueTracker: https://github.com/threadpoolx/DissPair/issues
RepoType: git
Repo: https://github.com/threadpoolx/DissPair

Name: DissPair
Summary: Bluetooth Security Toolkit
Description: |-
  DissPair is a Python-based security auditing tool designed to test Bluetooth Classic and BLE Vulnerability Assessment.

Builds:
  - versionName: '1.0'
    versionCode: 1
    commit: v1.0
    sudo:
      - apt-get update
      - apt-get install -y python3-pip openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev
    build: |-
      python3 -m venv venv
      . venv/bin/activate
      pip install buildozer Cython==0.29.36 wheel setuptools
      buildozer android release
    output: bin/disspair-1.0-arm64-v8a_armeabi-v7a-release.apk

AutoUpdateMode: None
UpdateCheckMode: Tags