Categories:
  - Security
License: MIT
WebSite: https://github.com/threadpoolx/DissPair
SourceCode: https://github.com/threadpoolx/DissPair
IssueTracker: https://github.com/threadpoolx/DissPair/issues
RepoType: git
Repo: https://github.com/threadpoolx/DissPair
Name: DissPair
Summary: Bluetooth Security Toolkit
Description: |-
  DissPair is a Python-based security auditing tool designed to test Bluetooth
  Classic and BLE Vulnerability Assessment.
CurrentVersion: '1.0'
CurrentVersionCode: 1

Builds:
  - versionName: '1.0'
    versionCode: 1
    commit: v1.0
    sudo:
      - apt-get update
      - apt-get install -y python3-pip python3-venv zip unzip openjdk-21-jdk autoconf libtool pkg-config zlib1g-dev libncurses-dev cmake libffi-dev libssl-dev
    build: |-
      python3 -m venv venv
      . venv/bin/activate
      pip install buildozer "Cython<3" wheel setuptools

      mkdir -p ~/.buildozer/android/platform/android-sdk/licenses
      printf '\n24333f8a63b6825ea9c5514f83c2829b004d1fee' > ~/.buildozer/android/platform/android-sdk/licenses/android-sdk-license
      printf '\nd975f751698a77b662f1254ddbeed3901e976f5a' > ~/.buildozer/android/platform/android-sdk/licenses/android-sdk-preview-license

      sed -i 's/^#* *android.api *=.*/android.api = 34/' buildozer.spec
      sed -i 's/^#* *android.build_tools_version *=.*/android.build_tools_version = 34.0.0/' buildozer.spec
      sed -i 's/^#* *android.accept_sdk_license *=.*/android.accept_sdk_license = True/' buildozer.spec

      buildozer android release
    output: bin/disspair-1.0-arm64-v8a_armeabi-v7a-release.apk

AutoUpdateMode: None
UpdateCheckMode: Tags
