Categories:
  - Security
License: MIT
WebSite: https://github.com/threadpoolx/DissPair
SourceCode: https://github.com/threadpoolx/DissPair
IssueTracker: https://github.com/threadpoolx/DissPair/issues
RepoType: git
Repo: https://github.com/threadpoolx/DissPair

Name: DissPair
Summary: Bluetooth Security Toolkit
Description: |-
  DissPair is a Python-based security auditing tool designed to test Bluetooth Classic and BLE Vulnerability Assessment.

CurrentVersion: '1.0'
CurrentVersionCode: 1

Builds:
  - versionName: '1.0'
    versionCode: 1
    commit: v1.0
    sudo:
      - apt-get update
      - apt-get install -y python3-pip python3.13-venv zip unzip default-jdk autoconf libtool pkg-config zlib1g-dev libncurses-dev cmake libffi-dev libssl-dev
    build: |-
      python3 -m venv venv
      . venv/bin/activate
      pip install buildozer Cython==0.29.36 wheel setuptools
      echo "android.accept_sdk_license = True" >> buildozer.spec
      echo "android.api = 34" >> buildozer.spec
      echo "android.build_tools_version = 34.0.0" >> buildozer.spec
      echo "android.archs = arm64-v8a" >> buildozer.spec
      yes | buildozer android release
      ls -R bin/
    output: bin/*.apk

AutoUpdateMode: None
UpdateCheckMode: Tags
