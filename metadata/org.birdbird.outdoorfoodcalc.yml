AutoName: Outdoor Food Calculator
Summary: Plan food weight and nutrition for outdoor trips

Description: |-
    Outdoor Food Calculator helps you plan food for hiking, camping, and other outdoor trips.

    Create a trip plan, set the number of days, choose a nutrition profile, and add foods by gram amount. The app calculates calories and nutrition totals so you can compare pack weight against your target intake.

    You can save plans, duplicate or rename them, add notes, and share the results. The app also includes built-in foods and can import packaged food data from Open Food Facts.

