License: AGPL-3.0-or-later
AuthorName: LuckyTheCookie - Lucas THIEBAUT
AuthorWebSite: https://github.com/LuckyTheCookie
WebSite: https://lthb.fr
SourceCode: https://github.com/LuckyTheCookie/FitTrack
IssueTracker: https://github.com/LuckyTheCookie/FitTrack/issues
Changelog: https://github.com/LuckyTheCookie/FitTrack/releases

AutoName: Spix

RepoType: git
Repo: https://github.com/LuckyTheCookie/FitTrack.git

Builds:
  - versionName: 11.1.0
    versionCode: 110100
    commit: d0f58a8bcfff6baf5b1337eded2a57e784e5590a
    sudo:
      - apt-get update
      - apt-get install -y npm
    output: android/app/build/outputs/apk/release/app-release.apk
    prebuild:
      - java -version || true
      - ./scripts/fdroid-prebuild.sh
    scanignore:
      - node_modules/react-native/sdks/hermesc/linux64-bin/hermesc
      - node_modules/@react-native-async-storage/async-storage/android/build.gradle
      - node_modules/react-native-safe-area-context/android/build.gradle
      - node_modules/react-native-svg/android/build.gradle
      - node_modules/react-native-screens/android/build.gradle
    scandelete:
      - node_modules
    build:
      - sed -i '/jvmToolchain/s/17/21/' node_modules/@react-native/gradle-plugin/*/build.gradle.kts
      - sed -i -e 's/JavaVersion.VERSION_17/JavaVersion.VERSION_21/g' -e 's/jvmToolchain(17)/jvmToolchain(21)/g'
        node_modules/@react-native/gradle-plugin/react-native-gradle-plugin/src/main/kotlin/com/facebook/react/utils/JdkConfiguratorUtils.kt
      - cd android
      - gradle assembleRelease
    ndk: r26d

AutoUpdateMode: Version
UpdateCheckMode: Tags
UpdateCheckData: app.json|"versionCode":\s*(\d+)|.|"version":\s*"([^"]+)"
CurrentVersion: 11.1.0
CurrentVersionCode: 110100
