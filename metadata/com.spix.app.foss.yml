AuthorName: LuckyTheCookie - Lucas THIEBAUT
AuthorWebSite: https://github.com/LuckyTheCookie
WebSite: https://lthb.fr
SourceCode: https://github.com/LuckyTheCookie/FitTrack
IssueTracker: https://github.com/LuckyTheCookie/FitTrack/issues
Changelog: https://github.com/LuckyTheCookie/FitTrack/releases

Name: Spix
AutoName: Spix

RepoType: git
Repo: https://github.com/LuckyTheCookie/FitTrack.git

Builds:
  - versionName: 7.7.0
    versionCode: 70700
    commit: dbd1c441ba6b2fd0d22d1adea9a23920cf1e0a43
    sudo:
      - sysctl fs.inotify.max_user_watches=524288 || true
      - curl -Lo node.tar.gz https://nodejs.org/dist/v20.19.5/node-v20.19.5-linux-x64.tar.gz
      - echo "4eba5fbe1fb10753bc06e42f001a91c5cec16798b7764a3e9257adc59af47fe1 node.tar.gz" | sha256sum -c -
      - tar xzf node.tar.gz --strip-components=1 -C /usr/local/
      - npm install -g yarn

    output: android/app/build/outputs/apk/release/app-release.apk

    prebuild:
      - sdkmanager 'cmake;3.22.1'
      - export EXPO_PUBLIC_BUILD_FLAVOR=foss
      
      # 1. Clean (On supprime node_modules pour être sûr, mais pas le lockfile yarn si on veut le respecter)
      - rm -rf node_modules

      # 2. Patch package.json
      - node -e "
        const fs = require('fs');
        const p = 'package.json';
        const pkg = JSON.parse(fs.readFileSync(p, 'utf8'));
        
        if (pkg.dependencies['react-native-vision-camera']) pkg.dependencies['react-native-vision-camera'] = 'github:LuckyTheCookie/react-native-vision-camera-foss';
        
        pkg.dependencies['expo-notifications'] = 'file:./stubs/expo-notifications';
        pkg.dependencies['expo-application'] = 'file:./stubs/expo-application';
        
        if (!pkg.devDependencies) pkg.devDependencies = {};
        pkg.devDependencies['babel-preset-expo'] = '^12.0.0';
        
        const rv = pkg.dependencies['react'] || '18.2.0';
        pkg.dependencies['react-dom'] = rv;
        
        fs.writeFileSync(p, JSON.stringify(pkg, null, 2));
        "
      
      # 3. Create Stubs
      - mkdir -p stubs/expo-notifications stubs/expo-application
      - echo '{"name":"expo-notifications","version":"0.32.16","main":"index.js"}' > stubs/expo-notifications/package.json
      - echo 'export const setNotificationHandler=()=>{};export const scheduleNotificationAsync=async()=>null;' > stubs/expo-notifications/index.js
      - echo '{"name":"expo-application","version":"7.0.8","main":"index.js"}' > stubs/expo-application/package.json
      - echo 'export const applicationId="com.spix.app.foss";' > stubs/expo-application/index.js

      # 4. Configure app.json
      - node -e "
        const fs = require('fs');
        const a = 'app.json';
        const app = JSON.parse(fs.readFileSync(a, 'utf8'));
        app.expo.android.package = 'com.spix.app.foss';
        delete app.expo.android.googleServicesFile;
        if(app.expo.plugins) app.expo.plugins = app.expo.plugins.filter(p => !JSON.stringify(p).includes('expo-notifications'));
        fs.writeFileSync(a, JSON.stringify(app, null, 2));
        "

      # 5. Install (CRITIQUE: c'est ici qu'on installe les dépendances modifiées)
      - yarn install --ignore-engines

      # 6. Expo Prebuild
      - yarn expo prebuild --clean --platform android

      # 7. Patch Native Files
      - echo "reactNative.nodeExecutableAndArgs=/usr/local/bin/node" >> android/gradle.properties
      - echo "newArchEnabled=false" >> android/gradle.properties
      - echo "org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g" >> android/gradle.properties

      # Exclusions Gradle
      - sed -i "/com\.google\.gms:google-services/d" android/build.gradle
      - sed -i "/com\.google\.firebase/d" android/build.gradle
      - |
        cat >> android/build.gradle <<EOF
        allprojects { configurations.all { 
          exclude group: 'com.google.firebase'
          exclude group: 'com.google.android.gms'
          exclude module: 'transport-runtime'
        }}
        EOF

    # On ignore les fichiers binaires au lieu de supprimer tout node_modules
    scanignore:
      - node_modules/react-native/sdks/hermesc
      - node_modules/react-native/React/I18n
      - node_modules/@react-native-async-storage/async-storage/android/build.gradle
      - node_modules/react-native-safe-area-context/android/build.gradle
      - node_modules/react-native-screens/android/build.gradle
      - node_modules/react-native-svg/android/build.gradle
      - node_modules/react-native-vector-icons/android/build.gradle
      - node_modules/expo-modules-autolinking/scripts/android/autolinking_implementation.gradle
      - node_modules/expo-modules-core/android/ExpoModulesCorePlugin.gradle
      # Autoriser les maven repos générés par Expo
      - node_modules/expo-*/local-maven-repo/**/*.aar
      - node_modules/expo-*/local-maven-repo/**/*.jar
      - node_modules/expo-*/local-maven-repo/**/*.pom
      # Autoriser les binaires Hermes et autres DLLs inutiles sous Linux mais présents
      - node_modules/**/*.dll
      - node_modules/**/*.exe
      - node_modules/**/*.node
    scandelete:
      - node_modules
    build:
      - cd android/app
      - gradle assembleRelease
    ndk: r27c

AutoUpdateMode: None
UpdateCheckMode: None
