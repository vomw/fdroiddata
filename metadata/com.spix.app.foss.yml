Builds:
  - versionName: 7.7.0
    versionCode: 70700
    commit: 776a72808c23c752b47eb0d6358214f3f93ee761
    sudo:
      - apt-get update
      - apt-get install -y nodejs npm
      - npm install -g n
      - n 20
      - npm install -g bun
    output: android/app/build/outputs/apk/release/app-release.apk
    prebuild:
      - chmod +x scripts/fdroid-prebuild.sh
      - ./scripts/fdroid-prebuild.sh
    scanignore:
      - node_modules
    build:
      - export PATH=$PATH:/usr/local/bin
      - cd android/app
      - gradle assembleRelease
    ndk: r26d

AutoUpdateMode: None
UpdateCheckMode: None
