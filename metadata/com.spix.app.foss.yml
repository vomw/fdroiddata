Name: Spix
AutoName: Spix

RepoType: git
Repo: https://github.com/LuckyTheCookie/FitTrack.git

Builds:
  - versionName: 7.7.0
    versionCode: 70700
    commit: f4e4b55bdfbc1ab23c75c6f7bea69c9da13ef771
    sudo:
      - sysctl fs.inotify.max_user_watches=524288
      - curl -Lo node.tar.gz https://nodejs.org/download/release/v22.21.1/node-v22.21.1-linux-x64.tar.gz
      - echo "219a152ea859861d75adea578bdec3dce8143853c13c5187f40c40e77b0143b2 node.tar.gz"
        | sha256sum -c -
      - tar xzf node.tar.gz --strip-components=1 -C /usr/local/
      - npm -g install bun
    output: android/app/build/outputs/apk/release/app-release.apk
    prebuild: /scripts/fdroid-prebuild.sh
    scanignore:
      - node_modules
    build:
      - cd android/app
      - gradle assembleRelease
    ndk: r26d

AutoUpdateMode: None
UpdateCheckMode: None
