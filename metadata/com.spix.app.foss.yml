Name: Spix
AutoName: Spix

RepoType: git
Repo: https://github.com/LuckyTheCookie/FitTrack.git

Builds:
  - versionName: 7.7.0
    versionCode: 70700
    commit: 577b436aa8def39935928227850c2450cb75b89a
    sudo:
      - sysctl fs.inotify.max_user_watches=524288 || true
      - curl -Lo node.tar.gz https://nodejs.org/dist/v20.19.5/node-v20.19.5-linux-x64.tar.gz
      - echo "4eba5fbe1fb10753bc06e42f001a91c5cec16798b7764a3e9257adc59af47fe1 node.tar.gz"
        | sha256sum -c -
      - tar xzf node.tar.gz --strip-components=1 -C /usr/local/
    output: android/app/build/outputs/apk/release/app-release.apk
    prebuild: scripts/fdroid-prebuild.sh
    scanignore:
      - node_modules
    build:
      - npm install babel-preset-expo --save-dev --legacy-peer-deps
      - cd android/app
      - gradle assembleRelease
    ndk: r26d

AutoUpdateMode: None
UpdateCheckMode: None
