Categories:
  - Internet
License: MIT
AuthorName: Gilad Tamam
AuthorEmail: giladtamam1@gmail.com
SourceCode: https://gitlab.com/tamamg/zigdash
IssueTracker: https://gitlab.com/tamamg/zigdash/-/issues
Changelog: https://gitlab.com/tamamg/zigdash/-/releases

AutoName: ZigDash

RepoType: git
Repo: https://gitlab.com/tamamg/zigdash.git

Builds:
  - versionName: 1.7.0
    versionCode: 17
    commit: 6b26bf7e88742ee9c4cfe06968cb6491ee2c6f2b
    output: build/app/outputs/flutter-apk/app-release.apk
    srclibs:
      - flutter@stable
    rm:
      - ios
      - web
    prebuild:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - flutterVersion=$(cat .flutter-version)
      - '[[ $flutterVersion ]]'
      - git -C $$flutter$$ checkout -f $flutterVersion
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get --enforce-lockfile
    scandelete:
      - .pub-cache
    build:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter build apk --release --no-tree-shake-icons

AutoUpdateMode: Version
UpdateCheckMode: Tags
UpdateCheckData: pubspec.yaml|version:\s.+\+(\d+)|.|version:\s(.+)\+
CurrentVersion: 1.7.0
CurrentVersionCode: 17
