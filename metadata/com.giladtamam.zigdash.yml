Categories:
  - Internet
License: MIT
AuthorName: Gilad Tamam
AuthorEmail: giladtamam1@gmail.com
SourceCode: https://gitlab.com/tamamg/zigdash
IssueTracker: https://gitlab.com/tamamg/zigdash/-/issues
Changelog: https://gitlab.com/tamamg/zigdash/-/releases

AutoName: ZigDash

RepoType: git
Repo: https://gitlab.com/tamamg/zigdash.git

Builds:
  - versionName: 1.7.0
    versionCode: 17
    commit: v1.7.0
    output: build/app/outputs/flutter-apk/app-release.apk
    srclibs:
      - flutter@3.32.5
    rm:
      - ios
      - web
    prebuild:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get --enforce-lockfile
    scandelete:
      - .pub-cache
    build:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter build apk --release --no-tree-shake-icons

AutoUpdateMode: Version
UpdateCheckMode: Tags
UpdateCheckData: pubspec.yaml|version:\s.+\+(\d+)|.|version:\s(.+)\+
CurrentVersion: 1.7.0
CurrentVersionCode: 17
