Categories:
  - Internet
License: MIT
AuthorName: Gilad Tamam
AuthorEmail: giladtamam1@gmail.com
SourceCode: https://gitlab.com/tamamg/zigdash
IssueTracker: https://gitlab.com/tamamg/zigdash/-/issues
Changelog: https://gitlab.com/tamamg/zigdash/-/releases

AutoName: ZigDash

RepoType: git
Repo: https://gitlab.com/tamamg/zigdash.git

Builds:
  - versionName: 1.7.0
    versionCode: 17
    commit: v1.7.0
    output: build/app/outputs/flutter-apk/app-release.apk
    srclibs:
      - flutter@3.32.5
    prebuild:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - echo "flutter.sdk=$$flutter$$" >> android/local.properties
      - $$flutter$$/bin/flutter config --no-analytics
      - sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;27.0.12077973"
      - $$flutter$$/bin/flutter pub get
    scandelete:
      - .pub-cache
      - web
    build:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter build apk --release --no-tree-shake-icons

AutoUpdateMode: Version %v
UpdateCheckMode: Tags ^v.*$
UpdateCheckData: pubspec.yaml|version:\s*(.+)\+||version:\s*.+\+(\d+)
CurrentVersion: 1.7.0
CurrentVersionCode: 17
