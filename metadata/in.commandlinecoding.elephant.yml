Name: Elephant
AutoName: Elephant
Description: |-
  Elephant is a privacy-first messaging application made with Go and Flutter.
  It supports secure authentication, user discovery, and real-time chat over WebSocket,
  with all communication TLS-protected between client and server.

RepoType: git
Repo: https://github.com/CommandLineCoding/Elephant.git

Builds:
  - versionName: 0.2.0
    versionCode: 1002
    commit: v0.2.5
    subdir: mobile/android
    output: ../build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
    srclibs:
      - flutter@3.44.0
    prebuild:
      - cd ..
      - sed -i '/in_app_update/d' pubspec.yaml
    build:
      - cd ..
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get --enforce-lockfile
      - $$flutter$$/bin/flutter build apk --split-per-abi --target-platform=android-arm
      - rm -rf .pub-cache

