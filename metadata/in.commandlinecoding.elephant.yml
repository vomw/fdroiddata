Categories:
  - Internet
  - Multimedia
  - Security
License: AGPL-3.0-or-later
SourceCode: https://github.com/CommandLineCoding/Elephant
IssueTracker: https://github.com/CommandLineCoding/Elephant/issues

Name: Elephant
AutoName: Elephant
Description: |-
  Elephant is a privacy-first messaging application made with Go and Flutter.
  It supports secure authentication, user discovery, and real-time chat over WebSocket,
  with all communication TLS-protected between client and server.

RepoType: git
Repo: https://github.com/CommandLineCoding/Elephant.git

Builds:
  - versionName: 0.2.0
    versionCode: 2
    commit: v0.2.5
    subdir: mobile/android
    gradle:
      - yes
    output: ../build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
    srclibs:
      - flutter@3.44.0
    prebuild:
      - cd ..
      - sed -i '/in_app_update/d' pubspec.yaml
      - rm -f pubspec.lock
      - $$flutter$$/bin/flutter pub get
    build:
      - cd ..
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get
      - $$flutter$$/bin/flutter build apk --release --no-pub --target-platform=android-arm64

