  - Security
License: AGPL-3.0-or-later
SourceCode: https://github.com/CommandLineCoding/Elephant
IssueTracker: https://github.com/CommandLineCoding/Elephant/issues
Changelog: https://github.com/CommandLineCoding/Elephant/releases

Name: Elephant
AutoName: Elephant
Summary: Privacy-first messaging with secure authentication and real-time chat
Description: |-
  Elephant is a privacy-first messaging app built with Go and Flutter.
  It provides secure authentication, user discovery, and real-time chat
  over WebSocket, with TLS-protected communication.

RepoType: git
Repo: https://github.com/CommandLineCoding/Elephant.git

Builds:
  - versionName: 0.2.0
    versionCode: 2
    commit: v0.2.0
    subdir: mobile
    srclibs:
      - flutter@3.44.0
    prebuild:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get
    build:
      - $$flutter$$/bin/flutter build apk --release --split-per-abi
    output: build/app/outputs/flutter-apk

AutoUpdateMode: None
UpdateCheckMode: None
CurrentVersion: 0.2.0
CurrentVersionCode: 2
