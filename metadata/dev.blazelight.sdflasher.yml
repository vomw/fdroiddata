License: GPL-3.0-only
SourceCode: https://github.com/theblazehen/sd_flasher
IssueTracker: https://github.com/theblazehen/sd_flasher/issues
Changelog: https://github.com/theblazehen/sd_flasher/releases

AutoName: SD Flasher
Description: |-
  Flash disk images to SD cards directly from your Android device.

  Features:
  * Direct block device writing - Flash images directly to SD cards at maximum speed
  * Compressed image support - Handles .img, .img.gz, .img.xz, and .zip files
  * Real-time progress - Live speed, ETA, and progress tracking
  * Fast writes
  * Material You design

  Requires Root access.

RepoType: git
Repo: https://github.com/theblazehen/sd_flasher.git

Builds:
  - versionName: 1.1.0
    versionCode: 2
    commit: v1.1.0
    subdir: app
    sudo:
      - apt-get update || apt-get update
      - apt-get install -y libgl1-mesa-dev
    gradle:
      - yes
    output: build/outputs/apk/release/app-release-unsigned.apk

AutoUpdateMode: Version
UpdateCheckMode: Tags
CurrentVersion: 1.1.0
CurrentVersionCode: 2
