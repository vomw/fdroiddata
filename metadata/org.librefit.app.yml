Builds:
  - versionName: 0.1.1
    versionCode: 10101
    commit: v0.1.1
    subdir: app
    sudo:
      - apt-get update
      - apt-get install -y wget apt-transport-https gnupg
      - mkdir -p /etc/apt/keyrings
      - wget -O - https://packages.adoptium.net/artifactory/api/gpg/key/public | tee
        /etc/apt/keyrings/adoptium.asc
      - echo "deb [signed-by=/etc/apt/keyrings/adoptium.asc] https://packages.adoptium.net/artifactory/deb
        $(awk -F= '/^VERSION_CODENAME/{print$2}' /etc/os-release) main" | tee /etc/apt/sources.list.d/adoptium.list
      - apt-get update
      - apt-get install -y temurin-17-jdk
      - update-alternatives --auto java
    gradle:
      - yes

