Categories:
  - Calendar & Agenda
  - Note
  - Task
  - Writing
License: MIT
AuthorName: Benoît HERVIER
AuthorWebSite: https://rvier.fr
SourceCode: https://github.com/brvier/PlanovaFlutter
IssueTracker: https://github.com/brvier/PlanovaFlutter/issues
Changelog: https://github.com/brvier/PlanovaFlutter/blob/HEAD/CHANGELOG.md

AutoName: Planova

RepoType: git
Repo: https://github.com/brvier/PlanovaFlutter.git

Builds:
  - versionName: 1.4.3
    versionCode: 7
    commit: v1.4.3
    output: build/app/outputs/flutter-apk/app-release.apk
    srclibs:
      - flutter@3.44.6
    rm:
      - ios
      - linux
      - macos
      - test
    prebuild:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get
    scandelete:
      - .pub-cache
    build:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter build apk

AutoUpdateMode: Version
UpdateCheckMode: Tags ^v[0-9.]+$
UpdateCheckData: pubspec.yaml|version:\s.+\+(\d+)|.|version:\s(.+)\+
CurrentVersion: 1.4.3
CurrentVersionCode: 7
