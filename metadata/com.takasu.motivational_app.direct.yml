Changelog: https://github.com/GiovanniDrago/motivationalApp/releases

AutoName: Motivational App

RepoType: git
Repo: https://github.com/GiovanniDrago/motivationalApp.git
Binaries: 
  https://github.com/GiovanniDrago/motivationalApp/releases/download/v%v/motivational-app-direct-v%v+%c.apk

Builds:
  - versionName: 2.0.5
    versionCode: 20005
    commit: 7eebf260cdc8c4f8bada1a191d5b3f745fcb30dc
    output: build/app/outputs/flutter-apk/app-direct-release.apk
    srclibs:
      - flutter@stable
    rm:
      - ios
      - linux
      - macos
      - web
      - windows
    prebuild:
      - "flutterVersion=$(sed -n -E \"s/.*flutter-version: '(.*)'/\\1/p\" .github/workflows/android-release-build.yml)"
      - '[[ $flutterVersion ]]'
      - git -C $$flutter$$ checkout -f $flutterVersion
      - sed -i '/^[[:space:]]*ndkVersion flutter\.ndkVersion$/d' android/app/build.gradle
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get
    scandelete:
      - .pub-cache
    build:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter build apk --release --flavor direct --dart-define=DISTRIBUTION_CHANNEL=direct
        --dart-define=ABOUT_URL=https://github.com/GiovanniDrago/motivationalApp --dart-define=DONATION_URL=https://buymeacoffee.com/_takasu_

AllowedAPKSigningKeys: 410e1066bdb3e97eb266feda014c525ae35cbbca581ba397e875640da73fa0b4

AutoUpdateMode: Version
UpdateCheckMode: Tags ^v[\d.]+$
UpdateCheckData: pubspec.yaml|version:\s.+\+(\d+)|.|version:\s(.+)\+
