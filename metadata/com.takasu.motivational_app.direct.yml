Builds:
  - versionName: 2.0.10
    versionCode: 200101
    commit: f2b26e4e1a1762876a57eb65c3fdcd099894c37d
    output: build/app/outputs/flutter-apk/app-direct-armeabi-v7a-release.apk
    binary: https://github.com/GiovanniDrago/motivationalApp/releases/download/v%v/app-direct-armeabi-v7a-release.apk
    srclibs:
      - flutter@stable
    rm:
      - ios
      - linux
      - macos
      - web
      - windows
    prebuild:
      - "flutterVersion=$(sed -n -E \"s/.*flutter-version: '(.*)'/\\1/p\" .github/workflows/android-release-build.yml)"
      - '[[ $flutterVersion ]]'
      - git -C $$flutter$$ checkout -f $flutterVersion
      - export SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get
    scandelete:
      - .pub-cache
    build:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter build apk --release --flavor direct --split-per-abi
        --target-platform=android-arm --build-name 2.0.10 --build-number 20010
        --dart-define=DISTRIBUTION_CHANNEL=direct --dart-define=ABOUT_URL=https://github.com/GiovanniDrago/motivationalApp
        --dart-define=DONATION_URL=https://buymeacoffee.com/_takasu_

