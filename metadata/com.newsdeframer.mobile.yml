Categories:
  - News
  - Reading
License: MIT
WebSite: https://deframer.github.io
SourceCode: https://github.com/deframer/news-deframer
IssueTracker: https://github.com/deframer/news-deframer/issues
Changelog: https://github.com/deframer/news-deframer/releases

AutoName: News Deframer

RepoType: git
Repo: https://github.com/deframer/news-deframer.git

Builds:
  - versionName: 0.0.8
    versionCode: 1
    commit: 55e6acefc8fd941437da4d8aa219d99aae0d9a0f
    subdir: frontend/mobile/android/app
    sudo:
      - apt-get update
      - apt-get install -y npm
      - npm install -g yarn
    gradle:
      - yes
    srclibs:
      - react-native-async-storage@@react-native-async-storage/async-storage@3.0.1
    prebuild:
      - cd ../..
      - npm install --build-from-source
      - sed -i -e '/jvmToolchain/s/17/21/' node_modules/@react-native/gradle-plugin/*/build.gradle.kts
      - sed -i -e '/JavaVersion/s/17/21/' -e '/jvmToolchain/s/17/21/' 
        node_modules/@react-native/gradle-plugin/react-native-gradle-plugin/src/main/kotlin/com/facebook/react/utils/JdkConfiguratorUtils.kt
      - PKG_DIR=node_modules/@react-native-async-storage/async-storage
      - DEST=$PKG_DIR/android/local_repo/org/asyncstorage/shared_storage/storage-android/1.0.0
      - cp 
        $$react-native-async-storage$$/shared-storage/build/outputs/aar/shared-storage.aar
        $DEST/storage-android-1.0.0.aar
      - perl -0pi -e 's/android \{\n/android {\n    dependenciesInfo {\n        includeInApk
        = false\n        includeInBundle = false\n    }\n/' android/app/build.gradle
    scanignore:
      - frontend/mobile/android/build.gradle
      - frontend/mobile/node_modules/hermes-compiler/hermesc/linux64-bin/hermesc
      - frontend/mobile/node_modules/@react-native-picker/picker/android/build.gradle
      - frontend/mobile/node_modules/react-native-safe-area-context/android/build.gradle
      - frontend/mobile/node_modules/react-native-svg/android/build.gradle
      - frontend/mobile/node_modules/@react-native-async-storage/async-storage/android/local_repo/org/asyncstorage/shared_storage/storage-android/1.0.0/storage-android-1.0.0.aar
    scandelete:
      - frontend/mobile/node_modules
    ndk: r27b

AutoUpdateMode: Version
UpdateCheckMode: Tags
UpdateCheckData: 
  frontend/mobile/android/app/build.gradle|mob.*Code.*"(\d+)"|.|mob.*Name.*"([0-9.]+)"
CurrentVersion: 0.0.8
CurrentVersionCode: 1
