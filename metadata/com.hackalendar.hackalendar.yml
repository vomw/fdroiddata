  - Task
License: MPL-2.0
AuthorName: Cristian Rossi
AuthorEmail: cristian.cmd.r@gmail.com
SourceCode: https://gitlab.com/Rekcah/hackalendar
IssueTracker: https://gitlab.com/Rekcah/hackalendar/-/issues

AutoName: Hackalendar

RepoType: git
Repo: https://gitlab.com/Rekcah/hackalendar.git

Builds:
  - versionName: 0.1.0
    versionCode: 1
    commit: f549716e3ed38e565c8d4e1a4aeb1db76374c503
    output: build/app/outputs/flutter-apk/app-release.apk
    srclibs:
      - flutter@3.47.5
    rm:
      - ios
      - linux
      - macos
      - web
      - windows
    prebuild:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get
    scandelete:
      - .pub-cache
    build:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter build apk

AutoUpdateMode: Version
UpdateCheckMode: Tags
UpdateCheckData: pubspec.yaml|version:\s.+\+(\d+)|.|version:\s(.+)\+
CurrentVersion: 0.1.0
CurrentVersionCode: 1
