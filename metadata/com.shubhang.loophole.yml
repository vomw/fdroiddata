AutoName: Loophole
Summary: One-tap Quick Settings toggle for Developer Options
Description: |-
  Loophole is a one-tap Quick Settings toggle for Android Developer Options.

  If you're an Android developer, Developer Options is basically always on.
  But a lot of banking and fintech apps treat that as a red flag and refuse
  to open while it's enabled. Loophole turns fixing that into one tap from
  the notification shade instead of digging through Settings every time.

  Note: this app requires the WRITE_SECURE_SETTINGS permission, which must
  be granted manually once via adb after install -- see the project README
  for the exact command.

