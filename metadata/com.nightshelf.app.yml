Builds:
  - versionName: 0.1.3-beta
    versionCode: 4
    commit: v0.1.3-beta
    subdir: android/app
    sudo:
      - curl -Lo node.tar.gz https://nodejs.org/dist/v20.18.1/node-v20.18.1-linux-x64.tar.gz
      - echo "259e5a8bf2e15ecece65bd2a47153262eda71c0b2c9700d5e703ce4951572784 node.tar.gz"
        | sha256sum -c -
      - tar xzf node.tar.gz --strip-components=1 -C /usr/local/
    init:
      - cd ../..
      - npm ci
    gradle:
      - yes
    prebuild:
      - cd ../..
      - ./node_modules/.bin/nuxt generate
      - npx cap sync android
    scandelete:
      - node_modules

