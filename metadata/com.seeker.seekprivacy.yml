IssueTracker: https://github.com/duckniii/SeekPrivacy/issues
Summary: Hide private files from apps even if they request full storage access.
Description: |
  Many apps ask for full storage access, even when they don't need it.

  For unimportant apps, we deny the permission and stay safe.
  But for important apps, we sometimes need to allow full storage.

  Once we give "All files access", those apps can see EVERY file, including private files that they don’t need.

  SeekPrivacy hides, locks, and encrypts your private files.
  Even if you grant all-files access, your private files stay invisible, but you can still access them normally.
Build:
  - gradle:
      task: assembleRelease
      variant: release
