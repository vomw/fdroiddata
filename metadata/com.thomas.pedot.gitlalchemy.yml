Categories:
  - Development
License: MIT
AuthorName: Thomas Pedot
SourceCode: https://gitlab.com/thomas.pedot1/gitlalchemy
IssueTracker: https://gitlab.com/thomas.pedot1/gitlalchemy/-/issues

AutoName: Gitlalchemy

RepoType: git
Repo: https://gitlab.com/thomas.pedot1/gitlalchemy.git

Builds:
  - versionName: 1.2.2
    versionCode: 1002002
    commit: 45672f577b6f7362ad54e0de47ceb502db18f4fd
    timeout: 14400
    sudo:
      - apt-get update
      - apt-get install -y build-essential rustup
      - echo "deb https://deb.debian.org/debian forky main" > /etc/apt/sources.list.d/forky.list
      - apt-get update
      - apt-get install -y -t forky npm
      - npm install -g pnpm
    init:
      - rustup default 1.82
      - rustup target add aarch64-linux-android armv7-linux-androideabi i686-linux-android
        x86_64-linux-android
      - cargo install tauri-cli --version "^2.0.0" --locked
      - export PATH="$HOME/.cargo/bin:$PATH"
      - export ANDROID_HOME=$$SDK$$
      - export NDK_HOME=$$NDK$$
      - cd apps/desktop
      - cargo tauri android init
    output: 
      apps/desktop/src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release-unsigned.apk
    prebuild:
      - sed -i '/"packageManager"/d' package.json
      - for dpi in mipmap-mdpi mipmap-hdpi mipmap-xhdpi mipmap-xxhdpi mipmap-xxxhdpi; do cp
        apps/desktop/src-tauri/icons/android/$dpi/ic_launcher.png apps/desktop/src-tauri/gen/android/app/src/main/res/$dpi/ic_launcher.png;
        cp apps/desktop/src-tauri/icons/android/$dpi/ic_launcher_foreground.png apps/desktop/src-tauri/gen/android/app/src/main/res/$dpi/ic_launcher_foreground.png;
        cp apps/desktop/src-tauri/icons/android/$dpi/ic_launcher_round.png apps/desktop/src-tauri/gen/android/app/src/main/res/$dpi/ic_launcher_round.png; done
      - sed -i '/signingConfigs/,/^    }/d' apps/desktop/src-tauri/gen/android/app/build.gradle.kts
      - sed -i '/signingConfig = /d' apps/desktop/src-tauri/gen/android/app/build.gradle.kts
      - sed -i '/buildFeatures/i\    dependenciesInfo {\n        includeInApk = false\n        includeInBundle
        = false\n    }' apps/desktop/src-tauri/gen/android/app/build.gradle.kts
      - echo 'packages:' > pnpm-workspace.yaml
      - echo '  - "apps/*"' >> pnpm-workspace.yaml
      - echo '  - "packages/*"' >> pnpm-workspace.yaml
    build:
      - export PATH="$HOME/.cargo/bin:$PATH"
      - export ANDROID_HOME=$$SDK$$
      - export NDK_HOME=$$NDK$$
      - pnpm install
      - cd apps/desktop
      - cargo tauri android build --apk
    ndk: r26d

AutoUpdateMode: Version
UpdateCheckMode: Tags
UpdateCheckData: version.properties|versionCode=(\d+)|.|versionName=([\d.]+)
CurrentVersion: 1.2.2
CurrentVersionCode: 1002002
