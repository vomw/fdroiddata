Categories:
  - Development
License: MIT
AuthorName: Thomas Pedot
SourceCode: https://gitlab.com/thomas.pedot1/gitlalchemy
IssueTracker: https://gitlab.com/thomas.pedot1/gitlalchemy/-/issues

AutoName: Gitlalchemy

RepoType: git
Repo: https://gitlab.com/thomas.pedot1/gitlalchemy.git

Builds:
  - versionName: 1.2.2
    versionCode: 1002002
    commit: 6629e4cb325db7b17e80382ce6b41c633094cb4f
    timeout: 14400
    sudo:
      - apt-get update
      - apt-get install -y curl ca-certificates gnupg build-essential rustup
      - curl -fsSL https://deb.nodesource.com/setup_22.x | bash -
      - apt-get install -y nodejs
      - npm install -g pnpm
    init:
      - source $HOME/.cargo/env
      - rustup default 1.82
      - rustup target add aarch64-linux-android armv7-linux-androideabi
        i686-linux-android x86_64-linux-android
      - cargo install tauri-cli --version "^2.0.0" --locked
      - export PATH="$HOME/.cargo/bin:$PATH"
      - export ANDROID_HOME=$$SDK$$
      - export NDK_HOME=$$NDK$$
      - cd apps/desktop
      - cargo tauri android init
    output: 
      apps/desktop/src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release-unsigned.apk
    prebuild:
      - sed -i 's|"bun run build"|"npm run build"|g' apps/desktop/src-tauri/tauri.conf.json
      - sed -i '/"packageManager"/d' package.json
      - sed -i '/signingConfigs/,/^    }/d' apps/desktop/src-tauri/gen/android/app/build.gradle.kts
      - sed -i '/signingConfig = /d' apps/desktop/src-tauri/gen/android/app/build.gradle.kts
      - sed -i '/buildFeatures/i\    dependenciesInfo {\n        includeInApk = false\n        includeInBundle = false\n    }' apps/desktop/src-tauri/gen/android/app/build.gradle.kts
      - echo 'packages:' > pnpm-workspace.yaml
      - echo '  - "apps/*"' >> pnpm-workspace.yaml
      - echo '  - "packages/*"' >> pnpm-workspace.yaml
    build:
      - export PATH="$HOME/.cargo/bin:$PATH"
      - export ANDROID_HOME=$$SDK$$
      - export NDK_HOME=$$NDK$$
      - pnpm install
      - cd apps/desktop && cargo tauri android build --apk
    ndk: r26d

AutoUpdateMode: None
UpdateCheckMode: None
CurrentVersion: 1.2.2
CurrentVersionCode: 1002002
