Categories:
  - Sports & Health
License: GPL-3.0-or-later
AuthorName: Julien Graisse
SourceCode: https://framagit.org/merodrem/piqme
IssueTracker: https://framagit.org/merodrem/piqme/-/issues

RepoType: git
Repo: https://framagit.org/merodrem/piqme.git

Builds:
  - versionName: '0.1.0'
    versionCode: 1
    commit: v0.1.0
    subdir: frontend/android/app
    sudo:
      - apt-get update
      - apt-get install -y npm
    init:
      - cd ../..
      - npm ci
    gradle:
      - yes
    prebuild:
      - cd ../..
      - sed -i -e '1a "expo":{"autolinking":{"android":{"buildFromSource":[".*"]}}},' package.json
      - npx expo prebuild -p android --clean
      - sed -i -e '/signingConfig /d' android/app/build.gradle
    scanignore:
      - node_modules/react-native/sdks/hermesc/linux64-bin/hermesc
      - node_modules/expo-modules-core/android/ExpoModulesCorePlugin.gradle
      - node_modules/expo-modules-autolinking/scripts/android/autolinking_implementation.gradle
    scandelete:
      - node_modules

AutoUpdateMode: Version
UpdateCheckMode: Tags
UpdateCheckData: frontend/app.json|"version":\s+"([\d.]+)"|frontend/app.json|"versionCode":\s+(\d+)
CurrentVersion: '0.1.0'
CurrentVersionCode: 1
AntiFeatures:
  - NonFreeNet