IssueTracker: https://github.com/muni-town/roomy/issues

AutoName: Roomy

RepoType: git
Repo: https://github.com/muni-town/roomy

Builds:
  - versionName: 0.1.0-alpha-7
    versionCode: 71
    commit: v0.1.0-alpha-7
    subdir: packages/app/src-tauri/gen/android
    sudo:
      - apt-get update
      - apt-get install -y npm make gcc libc-dev libwebkit2gtk-4.1-dev libappindicator3-dev
        golang-go librsvg2-dev patchelf jq
      - npm -g install pnpm
    output: app/build/outputs/apk/arm/release/app-arm-release-unsigned.apk
    srclibs:
      - rustup@1.27.1
    prebuild:
      - export NDK_HOME=$$NDK$$
      - $$rustup$$/rustup-init.sh -y --default-toolchain 1.88 --target armv7-linux-androideabi
      - source "$HOME/.cargo/env"
      - pnpm install --frozen-lockfile
      - pushd ../../..
      - jq '.bundle.android.versionCode += 1' ./src-tauri/tauri.conf.json > tmp
      - mv tmp ./src-tauri/tauri.conf.json
      - mkdir ./src-tauri/icons
      - pnpm turbo run build-lib
      - pnpm tauri icon -o ./src-tauri/icons ./static/icons/icon-512.png
      - pnpm build:t
      - popd
    scanignore:
      - packages/app/build
      - packages/app/static
    scandelete:
      - packages/app/.svelte-kit
      - node_modules
      - packages/sdk
    build:
      - export NDK_HOME=$$NDK$$
      - source "$HOME/.cargo/env"
      - pnpm tauri android build --apk --split-per-abi -t armv7
    ndk: 27.0.12077973

