Name: Dark Alarm

Summary: Open-source alarm app with customizable wake-up challenges

Description:
  Dark Alarm is an open-source Android alarm application designed to make
  waking up more reliable with customizable alarms and wake-up challenges.

  Features include:
  * Custom alarms and repeat schedules
  * Auto max volume
  * Custom alarm sounds
  * Math Challenge
  * Scan Object Challenge
  * Extreme Mode
  * Vibration settings
  * Alarm restoration after device reboot

