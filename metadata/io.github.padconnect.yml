AutoName: PadConnect
Summary: A tool to connect your Android device to your PC and use it as a gamepad.
Description: |
  PadConnect is a tool that allows you to connect your Android device to your PC and use it as a gamepad. It supports wireless connection, and it is compatible with a wide range of games. With PadConnect, you can enjoy your favorite games on your PC using your Android device as a controller.

