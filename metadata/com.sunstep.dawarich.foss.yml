Builds:
  - versionName: 0.17.0
    versionCode: 4
    commit: v0.17.0
    output: build/app/outputs/flutter-apk/app-foss-release.apk
    srclibs:
      - flutter@3.38.8
    rm:
      - ios
    prebuild:
      - cp pubspec-foss.yaml pubspec.yaml
      - cp pubspec-foss.lock pubspec.lock
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get
      - $$flutter$$/bin/dart run build_runner build --delete-conflicting-outputs
    build: $$flutter$$/bin/flutter build apk --release --flavor foss

AutoUpdateMode: None
UpdateCheckMode: None
