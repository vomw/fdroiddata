RepoType: git
Repo: https://github.com/sunstep/dawarich-android.git

Builds:
  - versionName: 0.19.0
    versionCode: 1091
    commit: 0259566ed28b6c2b1294ff87d4dd3131717ee20a
    output: build/app/outputs/flutter-apk/app-foss-release.apk
    srclibs:
      - flutter@stable
    rm:
      - ios
    prebuild:
      - cp pubspec-foss.yaml pubspec.yaml
      - cp pubspec-foss.lock pubspec.lock
      - flutterVersion=$(cat .flutter-version)
      - "sed -i 's/^version:.*/version: 0.19.0+1091/' pubspec.yaml"
      - '[[ $flutterVersion ]]'
      - git -C $$flutter$$ checkout -f $flutterVersion
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get
      - $$flutter$$/bin/dart run build_runner build --delete-conflicting-outputs
    scandelete:
      - .pub-cache
    build:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter build apk --release --flavor foss --dart-define=cronetHttpNoPlay=true
        --dart-define=geolocatorNoPlay=true

AutoUpdateMode: None
UpdateCheckMode: None
CurrentVersion: 0.19.0
CurrentVersionCode: 1091
