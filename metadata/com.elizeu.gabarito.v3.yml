Name: Leitor de Gabaritos
Summary: Grade hand-filled answer sheets from a photo using OMR, offline
Summary|pt-BR: Leia gabaritos pela câmera e corrija provas automaticamente
Description: |-
  Leitor de Gabaritos uses computer vision (OMR) to read hand-filled
  answer sheets and grade exams automatically — no scanner or special
  filled-box marker needed.

  How it works:
  1. Take a photo of the filled answer sheet or pick one from the gallery.
  2. The app detects the bubble grid automatically.
  3. Compare it with the official answer key and get the grade with
     correct, wrong and blank items.

  Features:
  * Robust OMR reading from camera photos;
  * A-D (4 choices) and A-E (5 choices) sheets, up to 40 questions;
  * Automatic grading against the official answer key stored on the device;
  * Configurable exam score;
  * Question-by-question results;
  * Works fully offline.
Description|pt-BR: |-
  O Leitor de Gabaritos usa visão computacional (OMR) para ler folhas
  de respostas preenchidas à mão e corrigir provas automaticamente,
  sem scanner ou marcador de caixa.

  Como funciona:
  1. Fotografe ou selecione da galeria o gabarito preenchido.
  2. O app detecta a grade de bolhas automaticamente.
  3. Compare com o gabarito oficial e veja a nota com acertos, erros
     e brancos.

  Recursos:
  * Leitura OMR robusta com fotos da câmera;
  * Gabaritos A-D (4 alternativas) e A-E (5 alternativas), até 40 questões;
  * Correção automática contra o gabarito oficial salvo no aparelho;
  * Valor da prova configurável;
  * Resultado questão a questão;
  * Funciona offline.

