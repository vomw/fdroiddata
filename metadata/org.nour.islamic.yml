    srclibs:
      - flutter@559ffa3f75e7402d65a8def9c28389a9b2e6fe42
    rm:
      - windows
    prebuild:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter config --no-analytics
      - sed -i 's/version "9\.0\.1"/version "8.7.3"/' android/settings.gradle.kts
      - sed -i 's/gradle-9\.1\.0-all\.zip/gradle-8.9-all.zip/' android/gradle/wrapper/gradle-wrapper.properties
      - $$flutter$$/bin/flutter pub get
    scandelete:
      - .pub-cache
    build:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter pub get
      - $$flutter$$/bin/flutter build apk --release --no-pub
    ndk: 28.2.13676358

