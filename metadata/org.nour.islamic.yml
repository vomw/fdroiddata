  - versionName: v1.1.0
    versionCode: 8
    commit: a20de43092a46ddb755c3fc3680691c09fb32c52
    output: build/app/outputs/flutter-apk/app-release.apk
    srclibs:
      - flutter@559ffa3f75e7402d65a8def9c28389a9b2e6fe42
    rm:
      - windows
      - android/quran_audio_pack
    prebuild:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter config --no-analytics
      - sed -i '/com\.android\.asset-pack/d' android/settings.gradle.kts
      - sed -i '/quran_audio_pack/d' android/settings.gradle.kts
      - sed -i 's/version "9\.0\.1"/version "8.7.3"/' android/settings.gradle.kts
      - sed -i 's/gradle-9\.1\.0-all\.zip/gradle-8.9-all.zip/' android/gradle/wrapper/gradle-wrapper.properties
      - sed -i '/Play Asset Delivery.*install-time/d' android/app/build.gradle.kts
      - sed -i '/assetPacks/d' android/app/build.gradle.kts
      - sed -i '/Play Asset Delivery runtime/d' android/app/build.gradle.kts
      - sed -i '/asset-delivery/d' android/app/build.gradle.kts
      - sed -i '/namespace = "org.nour.islamic"/a\    dependenciesInfo { includeInApk
        = false }' android/app/build.gradle.kts
      - sed -i '/AssetPackManagerFactory/d' android/app/src/main/kotlin/org/nour/islamic/MainActivity.kt
      - sed -i '/Play Asset Delivery channel/,/^            }$/d' android/app/src/main/kotlin/org/nour/islamic/MainActivity.kt
      - sed -i '/AUDIO_CHANNEL/d' android/app/src/main/kotlin/org/nour/islamic/MainActivity.kt
      - echo 'android.dependenciesInfo.includeInApk=false' >> android/gradle.properties
      - $$flutter$$/bin/flutter pub get
    scandelete:
      - .pub-cache
    build:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter pub get
      - $$flutter$$/bin/flutter build apk --release --no-pub
    ndk: 28.2.13676358

