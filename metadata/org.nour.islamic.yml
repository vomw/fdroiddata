Name: Nour نور
Description: |-
  Nour is a free, open-source Islamic app built with privacy at its core.
  No internet connection required after installation. No analytics, no tracking,
  no ads, no account needed. All data stays on your device.

  **Features**

  * **Mizwala (Prayer times)** — A unique sundial clock displaying the five daily
    prayer times with real sun/moon positions. Supports 16 calculation methods
    (UOIF, Muslim World League, Egypt, Mecca, Turkey, Algeria, Morocco and more).
    Live Qibla compass. Prayer reminders. Post-prayer dhikr card with counter.
    Real lunar phase displayed on the dial.

  * **Quran** — Complete Quran in Uthmani script (ScheherazadeNew font) with all
    114 surahs and ayah markers. Bookmarks and resume-reading feature.

  * **Azkar** — Comprehensive collection from Hisn al-Muslim: morning & evening
    adhkar, post-prayer adhkar and more. Counter for each dhikr. Standalone Tasbih
    screen (33/99/100 targets). Daily morning & evening adhkar notifications.

  * **Hijri Calendar** — Monthly Hijri calendar with Islamic occasions (Ramadan,
    Eid al-Fitr, Eid al-Adha, Mawlid an-Nabi...). Monthly prayer timetable.
    Monthly prayer statistics with per-prayer completion bars.

  **Privacy**

  * 100% offline — no network connection needed after install
  * No analytics, no tracking, no ads
  * No account required
  * All data on your device only
  * Fonts and Quran data bundled — nothing downloaded at runtime

RepoType: git
Repo: https://codeberg.org/WALNOR/Noor_app_prayers_and_more.git

