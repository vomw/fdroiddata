AutoName: OPNsense Manager

RepoType: git
Repo: https://github.com/Etregin/OPNsense_Manager

Builds:
  - versionName: 1.7.0
    versionCode: 121
    commit: 5eba00b1f4660a67dfa45c01df59deeef1746d7b
    output: build/app/outputs/flutter-apk/app-*-release.apk
    srclibs:
      - flutter@stable
    rm:
      - ios
    prebuild:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - sed -i '/org.gradle.java.home/d' android/gradle.properties
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get --enforce-lockfile
      - sed -i '1i import com.android.build.gradle.internal.api.ApkVariantOutputImpl\nandroid.applicationVariants.configureEach { val v = this; v.outputs.forEach { o -> if (o instanceof ApkVariantOutputImpl) { val abi = o.filters.find { it.filterType == "ABI" }?.identifier; val codes = mapOf("armeabi-v7a" to 1, "arm64-v8a" to 2, "x86_64" to 3); if (abi != null && codes.containsKey(abi)) { o.versionCodeOverride = v.versionCode * 10 + codes[abi]!! } } } }' android/app/build.gradle.kts
    scandelete:
      - .pub-cache
    build:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter build apk --release --split-per-abi

AllowedAPKSigningKeys: ca889bba23ca5c486a642ce077bcc5764ebf7194ef9e3cf99fd70c3eecf6a4b2

