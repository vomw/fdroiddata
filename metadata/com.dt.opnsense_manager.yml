Categories:
  - Firewall
License: GPL-3.0-only
AuthorName: Etregin
AuthorWebSite: https://github.com/Etregin
SourceCode: https://github.com/Etregin/OPNsense_Manager
IssueTracker: https://github.com/Etregin/OPNsense_Manager/issues

AutoName: OPNsense Manager

RepoType: git
Repo: https://github.com/Etregin/OPNsense_Manager

Builds:
  - versionName: 1.7.0
    versionCode: 12
    commit: V1.7.0
    sudo:
      - mkdir -p /upstream/path/example
      - chown -R vagrant /upstream/path
      - apt-get update
      - apt-get install -y openjdk-21-jdk-headless
      - update-alternatives --auto java
    output: build/app/outputs/flutter-apk/app-release.apk
    srclibs:
      - flutter@stable
    rm:
      - ios
      - linux
      - macos
      - web
      - windows
    prebuild:
      - export repo=/upstream/path/example/example
      - cd ..
      - mv com.dt.opnsense_manager $repo
      - pushd $repo
      - export PUB_CACHE=$(pwd)/.pub-cache
      - ln -s $$flutter$$ .flutter
      - .flutter/bin/flutter config --no-analytics
      - .flutter/bin/flutter pub get --enforce-lockfile
      - popd
      - mv $repo com.dt.opnsense_manager
    scanignore:
      - .flutter/bin/cache
    scandelete:
      - .flutter
      - .pub-cache
    build:
      - export repo=/upstream/path/example/example
      - cd ..
      - mv com.dt.opnsense_manager $repo
      - pushd $repo
      - export PUB_CACHE=$(pwd)/.pub-cache
      - .flutter/bin/flutter build apk --release --split-per-abi --target-platform="android-arm64"
      - popd
      - mv $repo com.dt.opnsense_manager

AutoUpdateMode: Version
UpdateCheckMode: Tags
UpdateCheckData: pubspec.yaml|version:\s.+\+(\d+)|.|version:\s(.+)\+
CurrentVersion: 1.7.0
CurrentVersionCode: 12
