Categories:
  - Firewall
License: GPL-3.0-only
AuthorName: Etregin
AuthorWebSite: https://github.com/Etregin
SourceCode: https://github.com/Etregin/OPNsense_Manager
IssueTracker: https://github.com/Etregin/OPNsense_Manager/issues

AutoName: OPNsense Manager

RepoType: git
Repo: https://github.com/Etregin/OPNsense_Manager

Builds:
  - versionName: 1.7.0
    versionCode: 12
    commit: 5eba00b1f4660a67dfa45c01df59deeef1746d7b
    sudo:
      - apt-get update
      - apt-get install -y openjdk-21-jdk-headless
      - update-alternatives --auto java
    output: build/app/outputs/flutter-apk/app-release.apk
    srclibs:
      - flutter@stable
    rm:
      - ios
    prebuild:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - sed -i '/org.gradle.java.home/d' android/gradle.properties
      - echo "org.gradle.java.home=/usr/lib/jvm/java-21-openjdk-amd64" >> android/gradle.properties
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get
      - |
        sed -i '/^flutter {$/i\
        import com.android.build.gradle.internal.api.ApkVariantOutputImpl\
        \
        val abiCodes = mapOf("armeabi-v7a" to 1, "arm64-v8a" to 2, "x86_64" to 3)\
        android.applicationVariants.configureEach {\
            val variant = this\
            variant.outputs.forEach { output ->\
                val abiVersionCode = abiCodes[output.filters.find { it.filterType == "ABI" }?.identifier]\
                if (abiVersionCode != null) {\
                    (output as ApkVariantOutputImpl).versionCodeOverride = variant.versionCode * 10 + abiVersionCode\
                }\
            }\
        }\
        ' android/app/build.gradle.kts
    scandelete:
      - .pub-cache
    build:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter build apk

AutoUpdateMode: Version
UpdateCheckMode: Tags
VercodeOperation:
  - 10 * %c + 1
  - 10 * %c + 2
  - 10 * %c + 3
UpdateCheckData: pubspec.yaml|version:\s.+\+(\d+)|.|version:\s(.+)\+
CurrentVersion: 1.7.0
CurrentVersionCode: 12
