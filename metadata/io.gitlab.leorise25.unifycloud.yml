Categories:
  - Cloud Storage & File Sync
  - File Manager
License: GPL-3.0-only
AuthorName: LeoRise
SourceCode: https://gitlab.com/leorise25/unifycloud
IssueTracker: https://gitlab.com/leorise25/unifycloud/-/issues

AutoName: UnifyCloud
Description: |-
  UnifyCloud is a fast, secure, and privacy-respecting multi-cloud storage manager
  and synchronization tool built with Flutter and Rclone.

  Key Features:
  * Multi-Cloud Support: Google Drive, Microsoft OneDrive, Dropbox, Nextcloud/WebDAV, SFTP, Amazon S3, and Local Storage.
  * End-to-End Client-Side Encryption (Crypt): Wrap any cloud with zero-knowledge AES-256 encryption.
  * Dual-Pane / Commander View: Transfer files directly between two clouds on tablets and wide screens.
  * Automated Sync & Backup: Configure scheduled rules to backup your local photos, documents, or directories.
  * App Lock & Biometrics: Protect your credentials with a 6-digit PIN and Biometric authentication.
  * Privacy First: 100% Free and Open Source Software (GPL-3.0), no telemetry, no tracking.

RepoType: git
Repo: https://gitlab.com/leorise25/unifycloud.git

Builds:
  - versionName: 1.0.0
    versionCode: 1
    commit: v1.0.0
    output: build/app/outputs/flutter-apk/app-release.apk
    srclibs:
      - flutter@stable
    prebuild:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get --enforce-lockfile
      - bash scripts/build_go_android.sh
    scanignore:
      - android/app/src/main/jniLibs
    scandelete:
      - .pub-cache
    build:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter build apk --release

AutoUpdateMode: Version
UpdateCheckMode: Tags
UpdateCheckData: pubspec.yaml|version:\s.+\+(\d+)|.|version:\s(.+)\+
CurrentVersion: 1.0.0
CurrentVersionCode: 1
