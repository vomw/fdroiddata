Categories:
  - Cloud Storage & File Sync
  - File Manager
License: GPL-3.0-only
AuthorName: LeoRise
SourceCode: https://gitlab.com/leorise25/unifycloud
IssueTracker: https://gitlab.com/leorise25/unifycloud/-/issues

AutoName: UnifyCloud

RepoType: git
Repo: https://gitlab.com/leorise25/unifycloud.git

Builds:
  - versionName: 1.0.0
    versionCode: 1001
    commit: v1.0.0
    output: build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
    srclibs:
      - flutter@stable
    rm:
      - ios
      - linux
      - macos
      - web
      - windows
    prebuild:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get --enforce-lockfile
      - bash scripts/build_go_android.sh
    scanignore:
      - android/app/src/main/jniLibs
    scandelete:
      - .pub-cache
    build:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter build apk --release --split-per-abi --target-platform=android-arm
        --build-number=1001

  - versionName: 1.0.0
    versionCode: 1002
    commit: v1.0.0
    output: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
    srclibs:
      - flutter@stable
    rm:
      - ios
      - linux
      - macos
      - web
      - windows
    prebuild:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get --enforce-lockfile
      - bash scripts/build_go_android.sh
    scanignore:
      - android/app/src/main/jniLibs
    scandelete:
      - .pub-cache
    build:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter build apk --release --split-per-abi --target-platform=android-arm64
        --build-number=1002

  - versionName: 1.0.0
    versionCode: 1003
    commit: v1.0.0
    output: build/app/outputs/flutter-apk/app-x86_64-release.apk
    srclibs:
      - flutter@stable
    rm:
      - ios
      - linux
      - macos
      - web
      - windows
    prebuild:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get --enforce-lockfile
      - bash scripts/build_go_android.sh
    scanignore:
      - android/app/src/main/jniLibs
    scandelete:
      - .pub-cache
    build:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter build apk --release --split-per-abi --target-platform=android-x64
        --build-number=1003

AutoUpdateMode: Version
UpdateCheckMode: Tags
VercodeOperation:
  - '%c * 1000 + 1'
  - '%c * 1000 + 2'
  - '%c * 1000 + 3'
UpdateCheckData: pubspec.yaml|version:\s.+\+(\d+)|.|version:\s(.+)\+
CurrentVersion: 1.0.0
CurrentVersionCode: 1003
