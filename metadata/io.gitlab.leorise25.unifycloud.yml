AutoName: UnifyCloud
Summary: Multi-cloud storage manager with client-side E2E encryption and auto-sync
Description: |-
  UnifyCloud is a fast, secure, and privacy-respecting multi-cloud storage manager
  and synchronization tool built with Flutter and Rclone.

  Key Features:
  * Multi-Cloud Support: Google Drive, Microsoft OneDrive, Dropbox, Nextcloud/WebDAV, SFTP, Amazon S3, and Local Storage.
  * End-to-End Client-Side Encryption (Crypt): Wrap any cloud with zero-knowledge AES-256 encryption.
  * Dual-Pane / Commander View: Transfer files directly between two clouds on tablets and wide screens.
  * Automated Sync & Backup: Configure scheduled rules to backup your local photos, documents, or directories.
  * App Lock & Biometrics: Protect your credentials with a 6-digit PIN and Biometric authentication.
  * Privacy First: 100% Free and Open Source Software (GPL-3.0), no telemetry, no tracking.

