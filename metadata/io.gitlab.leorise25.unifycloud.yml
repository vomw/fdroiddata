Categories:
  - Cloud Storage & File Sync
  - File Manager
License: GPL-3.0-only
AuthorName: LeoRise
SourceCode: https://gitlab.com/leorise25/unifycloud
IssueTracker: https://gitlab.com/leorise25/unifycloud/-/issues

AutoName: UnifyCloud

RepoType: git
Repo: https://gitlab.com/leorise25/unifycloud.git
Binaries: https://gitlab.com/leorise25/unifycloud/-/releases/v%v/downloads/app-release.apk

Builds:
  - versionName: 1.0.0
    versionCode: 1
    commit: v1.0.0
    output: build/app/outputs/flutter-apk/app-release.apk
    binary: https://gitlab.com/leorise25/unifycloud/-/releases/v1.0.0/downloads/app-release.apk
    srclibs:
      - flutter@stable
    rm:
      - ios
      - linux
      - macos
      - web
      - windows
    prebuild:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get --enforce-lockfile
      - bash scripts/build_go_android.sh
    scanignore:
      - android/app/src/main/jniLibs
    scandelete:
      - .pub-cache
    build:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter build apk --release

