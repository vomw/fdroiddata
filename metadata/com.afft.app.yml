AutoName: AFFT Toolkit
Summary: Analyze, unpack and repack firmware on-device
Description: |
  AFFT Toolkit (Android Firmware Full Toolkit) lets you analyze, unpack and repack ROM firmware directly on your Android device — no PC or Termux required.

  Features:
  - Payload Dumper: unpack and repack payload.bin OTA firmware
  - Super Image: unpack and repack sparse super.img images
  - Filesystem: extract and repack EROFS and ext4 images
  - Boot Family: unpack and repack 7 boot image types, including vendor_boot
  - Firmware Analysis: project-based parsers with validation, health score and recommendations
  - AFFT Manager: built-in file browser with search, copy, move, delete, rename and import
  - Workspace Engine: every firmware task is a project with operation history and metadata

  Everything runs on-device using metadata-only parsing, so even 8-10 GB firmware images are handled quickly. Available in English and Bahasa Indonesia.

