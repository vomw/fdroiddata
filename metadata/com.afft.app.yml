    versionCode: 26080801
    commit: 5df3ccbb99c7a105ac2a0ca2ea2600fe4972a177
    subdir: app
    init: sed -i 's/versionCode = generateVersionCode()/versionCode = 26080801/' build.gradle.kts
    gradle:
      - yes
    prebuild:
      - sed -i '/signingConfigs {/,/^    }/d' build.gradle.kts
      - sed -i '/signingConfig = signingConfigs.getByName("release")/d' build.gradle.kts

MaintainerNotes: |
  The versionCode is date-based (YYMMDDnn) and cannot be parsed by update
  checks, so it is pinned per build via 'init' and AutoUpdateMode is None.
  Upstream now provides the app metadata in fastlane format and the recipe uses
  the full source commit hash instead of a tag.

