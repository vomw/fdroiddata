MaintainerNotes: |
  The versionCode is date-based (YYMMDDnn) and cannot be parsed by update
  checks, so it is pinned per build.
  The app bundles prebuilt native binaries: payload-dumper-go
  (ssut/payload-dumper-go), magiskboot (topjohnwu/Magisk), and AOSP tools
  (lpmake, lpunpack, simg2img, debugfs, make_ext4fs, mkfs.erofs, extract.erofs)
  under app/src/main/jniLibs/arm64-v8a/ plus an asset copy of payload-dumper-go.
  These are scandeleted and downloaded from the upstream GitHub Release via Binaries.
  settings.gradle.kts is cleaned in prebuild to remove conditional local maven mirror.

