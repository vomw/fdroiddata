Builds:
  - versionName: 1.50.2
    versionCode: 711
    commit: 1a4ce71abf328f384d6e87593a4cfef5e17a3573
    subdir: client
    output: build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
    srclibs:
      - flutter@stable
    rm:
      - client/linux
      - client/windows
    prebuild:
      - flutterVersion=$(sed -n -E 's/.*flutter-version:\ "(.*)"/\1/p' ../.github/workflows/ci.yml
        | head -1)
      - '[[ $flutterVersion ]]'
      - git -C $$flutter$$ checkout -f $flutterVersion
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get --enforce-lockfile
    scandelete:
      - client/.pub-cache
    build:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter build apk --release --split-per-abi --target-platform
        android-arm
    ndk: 28.2.13676358

