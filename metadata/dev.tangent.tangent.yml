Categories:
  - Multimedia
  - Writing
License: AGPL-3.0-or-later
AuthorName: GyratingSeaCow
SourceCode: https://github.com/GyratingSeaCow/tangent
IssueTracker: https://github.com/GyratingSeaCow/tangent/issues
Changelog: https://github.com/GyratingSeaCow/tangent/blob/HEAD/CHANGELOG.md
Donate: https://www.paypal.com/ncp/payment/3L6QWSULPF4WS

AutoName: Tangent

RepoType: git
Repo: https://github.com/GyratingSeaCow/tangent

Builds:
  - versionName: 1.48.2
    versionCode: 65
    commit: 4086e3062df76fca23db7c35c9aab749753b875d
    subdir: client
    output: build/app/outputs/flutter-apk/app-release.apk
    srclibs:
      - flutter@stable
    rm:
      - client/linux
      - client/windows
    prebuild:
      - flutterVersion=$(sed -n -E 's/.*flutter-version:\ "(.*)"/\1/p' ../.github/workflows/ci.yml
        | head -1)
      - '[[ $flutterVersion ]]'
      - git -C $$flutter$$ checkout -f $flutterVersion
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get --enforce-lockfile
    scandelete:
      - client/.pub-cache
    build:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter build apk --release

AutoUpdateMode: Version
UpdateCheckMode: Tags ^v[0-9.]+$
UpdateCheckData: client/pubspec.yaml|version:\s.+\+(\d+)|.|version:\s(.+)\+
CurrentVersion: 1.48.2
CurrentVersionCode: 65
