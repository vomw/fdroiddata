Builds:
  - versionName: 1.0.27
    versionCode: 1028
    commit: e37a10e33d04e2dc3daae74e76b09d6d6997e1e2
    output: build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
    binary: https://github.com/brandonp2412/Scrubby/releases/download/%v/app-armeabi-v7a-release.apk
    srclibs:
      - flutter@stable
    sudo:
      - mkdir -p /home/runner/work/Scrubby
      - chown -R vagrant /home/runner
    rm:
      - ios
      - linux
      - web
      - windows
    prebuild:
      - cd ..
      - export repo=/home/runner/work/Scrubby/Scrubby
      - mv app.scrubby.scrubby $repo
      - pushd $repo
      - flutterVersion=$(sed -n -E "s/^[[:space:]]*flutter-version:[[:space:]]*([0-9.]+).*/\1/p" .github/workflows/ci.yml | head -n1)
      - '[[ $flutterVersion ]] || exit 1'
      - git -C $$flutter$$ checkout -f "$flutterVersion"
      - export PUB_CACHE=/home/runner/.pub-cache
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get --enforce-lockfile
      - sed -i 's|target_link_options(jni PRIVATE "-Wl,-z,max-page-size=16384")|target_link_options(jni PRIVATE "-Wl,-z,max-page-size=16384" "$<$<STREQUAL:${CMAKE_ANDROID_ARCH_ABI},arm64-v8a>:-Wl,--build-id=0x968739be302481fb0ff7f3bb1d11e4492d81127c>" "$<$<STREQUAL:${CMAKE_ANDROID_ARCH_ABI},armeabi-v7a>:-Wl,--build-id=0x09753a9caf8e159f2a00eeb687e6d81e3198263a>" "$<$<STREQUAL:${CMAKE_ANDROID_ARCH_ABI},x86_64>:-Wl,--build-id=0x110e98b8efa692ef084a25bde06ce29b10d54f49>")|' "$PUB_CACHE"/hosted/pub.dev/jni-*/src/CMakeLists.txt
      - popd
      - mv $repo app.scrubby.scrubby
    build:
      - cd ..
      - export repo=/home/runner/work/Scrubby/Scrubby
      - mv app.scrubby.scrubby $repo
      - pushd $repo
      - export PUB_CACHE=/home/runner/.pub-cache
      - $$flutter$$/bin/flutter build apk --release --split-per-abi --target-platform="android-arm"
      - popd
      - mv $repo app.scrubby.scrubby
    ndk: r28c
