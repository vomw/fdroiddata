AutoName: BurnPony
Description: |-
  Write a note, set the self-destruct rules, share one link. The note is
  encrypted on-device with AES-256-GCM before upload and decrypts only in
  the recipient's browser; the key travels in the URL fragment, which
  browsers never transmit. The server stores ciphertext it cannot read.
  No accounts, no analytics.

  View limits, expiry from 5 minutes to 30 days (changeable later), an
  optional PBKDF2-stretched passphrase, auto-hide, disclosed read
  receipts (via status polling in this build), device-local labels, QR
  handoff, self-hosting support, and nine languages. The wire format is
  publicly specified with shared cross-implementation test vectors:
  https://burnpony.app/protocol

