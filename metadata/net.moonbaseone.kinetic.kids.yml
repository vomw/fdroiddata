Name: Kinetic Kids
AutoName: Kinetic Kids

RepoType: git
Repo: https://github.com/ingmarstruijs/Kinetic.git

Builds:
  - versionName: 0.4.3
    versionCode: 131
    commit: 93a7a946ff30da330142782511f0b5c65bbe5273
    subdir: apps/kids
    output: build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
    srclibs:
      - flutter@stable
    prebuild:
      - cd ../..
      - flutterVersion=$(tr -d '\r\n' < .flutter-version)
      - '[[ $flutterVersion ]]'
      - git -C $$flutter$$ checkout -f $flutterVersion
      - export PATH="$$flutter$$/bin:$PATH"
      - flutter config --no-analytics
      - flutter --version
      - dart pub global activate melos
      - dart pub global run melos bootstrap
    build:
      - export PATH="$$flutter$$/bin:$PATH"
      - flutter build apk --release --split-per-abi --target-platform=android-arm
        --build-name=$$VERSION$$ --build-number=$$VERCODE$$

