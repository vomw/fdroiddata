AutoName: Account Manager
Description: |-
  A simple, trustworthy, fully offline personal password manager.

  Highlights:

  * Fully offline — no network calls, all data stays on your device
  * AES-256 encryption (SQLCipher) protects everything
  * No ads, no telemetry, no crash reports
  * Free — no purchases, no subscriptions

  Features:

  * Account storage with encrypted IDs, passwords, URLs, notes
  * Biometric unlock (fingerprint/face)
  * Password generator
  * 2FA / TOTP code generation
  * Custom fields, favorites, tags, search
  * Encrypted backup (export/import)
  * Light/Dark theme

  8 languages: English, Japanese, Korean, Traditional Chinese, Spanish,
  French, German, Portuguese.

RepoType: git
Repo: https://github.com/MikeStanton27-proj/account-manager.git

Builds:
  - versionName: 1.0.3
    versionCode: 4
    commit: v1.0.3
    sudo:
      - apt-get update
      - apt-get install -y curl xz-utils
      - curl -L 
        https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/flutter_linux_3.41.9-stable.tar.xz
        | tar xJ -C /opt
      - chown -R vagrant:vagrant /opt/flutter
    output: build/app/outputs/flutter-apk/app-release.apk
    rm:
      - ios/
    build:
      - /opt/flutter/bin/flutter config --no-analytics
      - /opt/flutter/bin/flutter pub get
      - /opt/flutter/bin/flutter build apk --release

AutoUpdateMode: None
UpdateCheckMode: None
CurrentVersion: 1.0.3
