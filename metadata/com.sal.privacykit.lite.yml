AutoName: Privacy Kit Lite
Summary: Manage privacy-related runtime hooks for LSPosed
Description: |-
  Privacy Kit Lite is a small utility for configuring privacy-related runtime hook
  behavior on Android devices.

  It focuses on a limited set of identifier modes, including real values, static
  generated-once values, and custom values.

  Hook functionality requires an LSPosed-compatible framework. The app does not
  request the INTERNET permission.

