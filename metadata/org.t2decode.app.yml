AutoName: T2DECODE

RepoType: git
Repo: https://gitlab.com/tutodecode-org/T2DECODE.git

Builds:
  - versionName: 1.0.2.3
    versionCode: 191
    commit: 82bd5d78f42826c46ba7c97ae6fe062b9d49a742
    binary: https://downloads.sourceforge.net/project/t2decode/v%v/T2DECODE-Android-armeabi-v7a.apk
    output: build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
    srclibs:
      - flutter@stable
    rm:
      - ios
      - linux
      - macos
      - web
      - windows
    prebuild:
      - flutterVersion=$(cat .flutter-version)
      - '[[ $flutterVersion ]]'
      - git -C $$flutter$$ checkout -f $flutterVersion
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get --enforce-lockfile
    scandelete:
      - .pub-cache
    build:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - export FDROID_BUILD=true
      - $$flutter$$/bin/flutter build apk --release --split-per-abi --target-platform="android-arm"
        --no-tree-shake-icons

