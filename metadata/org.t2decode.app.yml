AutoName: T2DECODE

RepoType: git
Repo: https://gitlab.com/tutodecode-org/T2DECODE.git

Builds:
  - versionName: 1.0.2.3
    versionCode: 191
    commit: ef30f193f9a0fd73c48abb8be97ce2ade618a67d
    sudo:
      - mkdir -p /sdks
      - chown vagrant:vagrant /sdks
    output: build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
    binary: 
      https://sourceforge.net/projects/t2decode/files/v%v/app-armeabi-v7a-release.apk/download
    srclibs:
      - flutter@stable
    rm:
      - ios
      - linux
      - macos
      - web
      - windows
    prebuild:
      - flutterVersion="3.44.0"
      - '[[ $flutterVersion ]]'
      - git -C $$flutter$$ checkout -f $flutterVersion
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get --enforce-lockfile
      - unset ANDROID_NDK_HOME
      - unset ANDROID_NDK_ROOT
      - sed -i 's/android {/android {\n    dependenciesInfo {\n        includeInApk = false\n        includeInBundle = false\n    }/' android/app/build.gradle.kts
      - $$flutter$$/bin/flutter build apk --release --split-per-abi || true
      - $$flutter$$/bin/flutter clean
    scandelete:
      - .pub-cache
    build:
      - rm -rf /sdks/flutter
      - mv $$flutter$$ /sdks/flutter
      - ln -s /sdks/flutter $$flutter$$
      - mkdir -p /builds/tutodecode-org/T2DECODE
      - cp -a $PWD/. /builds/tutodecode-org/T2DECODE/
      - cd /builds/tutodecode-org/T2DECODE
      - export PUB_CACHE=$(pwd)/.pub-cache
      - unset ANDROID_NDK_HOME
      - unset ANDROID_NDK_ROOT
      - /sdks/flutter/bin/flutter build apk --release --split-per-abi
      - cd -
      - mkdir -p build/app/outputs/flutter-apk
      - cp 
        /builds/tutodecode-org/T2DECODE/build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
        build/app/outputs/flutter-apk/

