Builds:
  - versionName: 1.0.3
    versionCode: 351
    commit: a324b17fd93797f7971b2096562b18787211111f
    sudo:
      - mkdir -p /builds
      - chown vagrant /builds
    output: build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
    srclibs:
      - flutter@stable
    rm:
      - ios
      - linux
      - macos
      - web
      - windows
    prebuild:
      - flutterVersion="$(cat .flutter-version)"
      - '[[ $flutterVersion ]]'
      - git -C $$flutter$$ checkout -f $flutterVersion
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get --enforce-lockfile
    scandelete:
      - .pub-cache
      - fdroid_data_repo
    build:
      - mkdir -p /builds/tutodecode-org/
      - cd ..
      - export repo=/builds/tutodecode-org/T2DECODE/
      - mv org.t2decode.app $repo
      - pushd $repo
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter build apk --release --split-per-abi --target-platform="android-arm"
      - popd
      - mv $repo org.t2decode.app

