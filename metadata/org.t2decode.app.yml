Builds:
  - versionName: 1.0.2.28
    versionCode: 281
    commit: 2a9be371706ffe3a6fc2efd81d404686440940b6
    output: build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
    srclibs:
      - flutter@stable
    rm:
      - ios
      - linux
      - macos
      - web
      - windows
    prebuild:
      - flutterVersion="$(cat .flutter-version)"
      - '[[ $flutterVersion ]]'
      - git -C $$flutter$$ checkout -f $flutterVersion
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get --enforce-lockfile
    scandelete:
      - .pub-cache
    build:
      - FLUTTER_ABS=$(realpath $$flutter$$)
      - mkdir -p /builds/tutodecode-org/
      - cd ..
      - export repo=/builds/tutodecode-org/T2DECODE/
      - mv org.t2decode.app $repo
      - pushd $repo
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $FLUTTER_ABS/bin/flutter build apk --release --split-per-abi --target-platform="android-arm"
      - popd
      - mv $repo org.t2decode.app

