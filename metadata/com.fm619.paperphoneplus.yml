Builds:
  - versionName: 2.3.0
    versionCode: 23000
    commit: 3096f97d7b1372c9e4a60603b1e764462c964bbf
    subdir: android/app
    sudo:
      - echo "deb https://deb.debian.org/debian forky main" > /etc/apt/sources.list.d/forky.list
      - apt-get update
      - apt-get install -y -t forky npm
    init:
      - cd ../..
      - npm ci --ignore-scripts
    gradle:
      - yes
    prebuild:
      - cd ../..
      - npm run build
      - npx --no-install cap sync android
    scandelete:
      - node_modules

