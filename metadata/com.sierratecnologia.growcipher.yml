Categories:
  - Science & Education
License: MIT
AuthorName: ricardosierra
AuthorWebSite: https://github.com/ricardosierra
SourceCode: https://github.com/ricardosierra/growcipher
IssueTracker: https://github.com/ricardosierra/growcipher/issues

AutoName: GrowCipher
Description: O GrowCipher é um diário de cultivo local e offline-first. Registre
  suas plantas, ciclos e eventos com total privacidade e controle sobre os 
  próprios dados.

RepoType: git
Repo: https://github.com/ricardosierra/growcipher.git

Builds:
  - versionName: 0.1.0
    versionCode: 1
    commit: v0.1.0
    sudo:
      - apt-get update || apt-get update
      - apt-get install -y --no-install-recommends openjdk-17-jdk
    output: build/app/outputs/flutter-apk/app-release.apk
    srclibs:
      - flutter@3.24.0
    rm:
      - ios/
      - macos/
      - windows/
      - linux/
      - web/
    prebuild:
      - export PATH=$$flutter$$/bin/:$PATH
      - flutter pub get
    build:
      - export PATH=$$flutter$$/bin/:$PATH
      - flutter build apk --release

AutoUpdateMode: Version
UpdateCheckMode: Tags
CurrentVersion: 0.1.0
CurrentVersionCode: 1
