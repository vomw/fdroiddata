IssueTracker: https://github.com/ricardosierra/growcipher/issues
Changelog: https://github.com/ricardosierra/growcipher/blob/master/CHANGELOG.md

AutoName: GrowCipher

RepoType: git
Repo: https://github.com/ricardosierra/growcipher.git

Builds:
  - versionName: 0.2.1
    versionCode: 31
    commit: 97754aee40c284579d8323abd8b52c4f25168976
    output: build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
    srclibs:
      - flutter@stable
    rm:
      - ios
      - linux
      - macos
      - web
      - windows
    prebuild:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - export flutterVersion=$(cat .flutter-version)
      - git -C $$flutter$$ checkout -f $flutterVersion
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get --enforce-lockfile
    scandelete:
      - .pub-cache
    build:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter build apk --release --split-per-abi --target-platform=android-arm

  - versionName: 0.2.1
