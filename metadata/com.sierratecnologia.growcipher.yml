  - Science & Education
License: MIT
AuthorName: Ricardo Sierra
SourceCode: https://github.com/ricardosierra/growcipher
IssueTracker: https://github.com/ricardosierra/growcipher/issues
Changelog: https://github.com/ricardosierra/growcipher/blob/master/CHANGELOG.md

AutoName: GrowCipher

RepoType: git
Repo: https://github.com/ricardosierra/growcipher.git

Builds:
  - versionName: 0.2.0
    versionCode: 2
    commit: 1333c589b01899c3d6201da8bf0e56f43102c027
    output: build/app/outputs/flutter-apk/app-release.apk
    srclibs:
      - flutter@3.44.9
    rm:
      - ios
      - macos
      - windows
      - linux
      - web
    prebuild:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get
    scandelete:
      - .pub-cache
    build:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter build apk --release

AutoUpdateMode: Version
UpdateCheckMode: Tags
UpdateCheckData: pubspec.yaml|version:\s.+\+(\d+)|.|version:\s(.+)\+
CurrentVersion: 0.2.0
CurrentVersionCode: 2
