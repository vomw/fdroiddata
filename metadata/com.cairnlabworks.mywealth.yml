Categories:
  - Money
License: MIT
AuthorName: Cairn Labworks
SourceCode: https://github.com/cairn-labworks/Networthy
IssueTracker: https://github.com/cairn-labworks/Networthy/issues

AutoName: Networthy

# Networthy queries two public, key-less third-party web services
# (Yahoo Finance chart API + open.er-api.com FX rates). Those backends are
# not free software, so F-Droid requires the NonFreeNet anti-feature.
# Only ticker symbols / currency codes are transmitted (no personal data).
AntiFeatures:
  - NonFreeNet

RepoType: git
Repo: https://github.com/cairn-labworks/Networthy.git

Builds:
  - versionName: 1.0.0
    versionCode: 1
    commit: v1.0.0
    subdir: app
    gradle:
      - yes

AutoUpdateMode: Version v%v
UpdateCheckMode: Tags
CurrentVersion: 1.0.0
CurrentVersionCode: 1
