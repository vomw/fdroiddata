IssueTracker: https://github.com/papiche/cabine-33/issues

AutoName: ATOM4LOVE — Cabine 33

RepoType: git
Repo: https://github.com/papiche/cabine-33

Builds:
  - versionName: '1.0'
    versionCode: 1
    commit: e0bb97e127caa1e2e37248265dc4b1314ebaea95
    timeout: 10800
    sudo:
      - apt-get update
      - apt-get install -y pkgconf scons g++
    output: atom4love.apk
    srclibs:
      - Godot@4.6.3-stable
    rm:
      - build
    prebuild: sed -i -e '/custom_template\/release/s|""|"$$Godot$$/bin/android_release.apk"|'
      -e '/custom_template\/debug/s|""|"$$Godot$$/bin/android_release.apk"|' -e '/package\/signed/s/true/false/'
      export_presets.cfg
    build:
      - pushd $$Godot$$
      - export ANDROID_NDK_ROOT=$$NDK$$
      - export ANDROID_HOME=$$SDK$$
      - export JAVA_HOME=/usr/lib/jvm/java-21-openjdk-amd64
      - scons -j `nproc` platform=linuxbsd target=editor
      - scons -j `nproc` platform=android target=template_release arch=arm64 generate_apk=yes
      - popd
      - $$Godot$$/bin/godot.linuxbsd.editor.x86_64 --headless --import
      - export GODOT_CFG=$(ls ~/.config/godot/editor_settings-*.tres)
      - sed -i -e "s:\(^.*java_sdk_path\)\s*=.*$:\1 = "$JAVA_HOME":" $GODOT_CFG
      - sed -i -e 's:\(^.*android_sdk_path\)\s*=.*$:\1 = "$$SDK$$":' $GODOT_CFG
      - $$Godot$$/bin/godot.linuxbsd.editor.x86_64 --headless --export-release "Android"
        atom4love.apk
    ndk: 29.0.14206865

AutoUpdateMode: Version
UpdateCheckMode: Tags
UpdateCheckData: export_presets.cfg|version/code=(\d+)|.|version/name="([\d.]+)"
CurrentVersion: '1.0'
CurrentVersionCode: 1
