Categories:
  - Development
  - System
License: MIT
AuthorName: Scarif Labs
SourceCode: https://github.com/scarif-labs/horus
IssueTracker: https://github.com/scarif-labs/horus/issues
Changelog: 
  https://github.com/scarif-labs/horus/tree/HEAD/fastlane/metadata/android/en-US/changelogs

AutoName: Horus

RepoType: git
Repo: https://github.com/scarif-labs/horus.git

Builds:
  - versionName: 1.0.0
    versionCode: 1
    commit: 136b7d6527dbcc92f06ee9a05a16667ade209078
    subdir: android/app
    submodules: true
    sudo:
      - apt-get update
      - apt-get install -y make cmake ninja-build python3 xz-utils g++ libicu-dev
      - curl -Lo /tmp/node.tar.xz https://nodejs.org/dist/v22.23.3/node-v22.23.3-linux-x64.tar.xz
      - echo "df450af89261115ef9f9e3830c3eeb2cc9213b63c720b1af623cb5dcbe2e02de  /tmp/node.tar.xz"
        | sha256sum -c -
      - tar xJf /tmp/node.tar.xz -C /usr/local --strip-components=1
    gradle:
      - yes
    srclibs:
      - hermes@hermes-v250829098.0.16
    prebuild:
      - cd ../..
      - npm ci --no-audit --no-fund
      - rm -rf node_modules/hermes-compiler/hermesc node_modules/fb-dotslash/bin
      - cmake -S $$hermes$$ -B $$hermes$$/build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - cmake --build $$hermes$$/build --target hermesc
      - echo "horus.hermesCommand=$$hermes$$/build/bin/hermesc" >> android/gradle.properties
    scandelete:
      - node_modules
    ndk: 27.1.12297006

AutoUpdateMode: Version
UpdateCheckMode: Tags ^v[0-9.]+$
CurrentVersion: 1.0.0
CurrentVersionCode: 1
