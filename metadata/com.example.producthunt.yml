AutoName: Product Hunt Viewer
Summary: Browse, sort, and filter Product Hunt launches.
Description: |-
  Browse a paginated feed of Product Hunt launches with thumbnails, taglines, topics, makers, votes, and comments.

  Sort by ranking, newest, votes, or featured date. Filter by platform, topic, featured status, date range, Product Hunt URL, or Twitter/X URL.

  A user-provided Product Hunt developer token is required. The app validates and stores the token locally on the device.
