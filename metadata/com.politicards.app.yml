AutoName: Politicards

Summary: Real voting records for all 538 members of Congress
Description: |-
  Politicards presents every member of the United States Congress as a
  trading card — complete with real voting records, bill history, attendance
  scores, and bipartisan ratings sourced directly from official U.S.
  government sources.

  Every card shows attendance rate, how often the legislator crosses party
  lines, party alignment score, bills sponsored and co-sponsored, years in
  office, and their signature legislation.

  All data is sourced from the Library of Congress Congress.gov API, the
  U.S. Senate, and the Office of the Clerk of the U.S. House of
  Representatives. Data is updated daily. No spin. No editorializing.
  Just the facts.

  Politicards collects zero user data, contains no ads, and is completely
  free.

