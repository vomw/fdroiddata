AutoName: Couchy Launcher
Summary: A fast, private one-screen launcher
Description: |
  Couchy is a lightweight, single-screen home launcher for Android TV
  and Google TV. It shows your apps and nothing you didn't ask for.

  No ads. No tracking. No accounts. No background services. Out of the
  box it makes no network requests — the wallpaper defaults to a static
  gradient. Streaming aerial wallpapers from Apple/Amazon CDNs are opt-in.

  - 17 languages
  - Fully D-pad navigable
  - Customizable dock shortcuts and wallpaper
  - FOSS (GPLv3) — no Google Play Services, no proprietary blobs

