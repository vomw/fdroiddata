Summary: Lanzador de aplicaciones inspirado en el Nokia N9 (MeeGo)
Description: |-
    Un launcher ligero y elegante desarrollado con Jetpack Compose. 
    Ofrece la clásica interfaz de tres paneles de MeeGo Harmattan: 
    Feed con clima y notificaciones, rejilla de aplicaciones y switcher.

