AntiFeatures:
  NonFreeNet:
    en-US: "Fauxx intentionally generates synthetic browsing activity against\nthird-party
      network services that are not themselves free/libre:\nGoogle Search, Bing, Yahoo
      Search, and the user's opted-in ad-preference\npages (Google Ads Settings, Facebook
      Ad Preferences) when Layer 2\ntargeting is enabled. This traffic is the core
      feature — the app's\npurpose is to generate noise visible to these non-free
      services.\nNo user credentials are sent except by the user's own opt-in interaction
      with the ad-preference scrapers."
