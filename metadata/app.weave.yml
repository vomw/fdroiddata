    subdir: Android/Source
    sudo:
      - apt-get update
      - apt-get install -y gcc libc-dev
    gradle:
      - yes
    output: app/build/outputs/apk/release/Weave-release.apk
    srclibs:
      - rustup@1.28.2
    prebuild:
      - sdkmanager "platforms;android-36.1" "build-tools;36.1.0"
      - $$rustup$$/rustup-init.sh -y --default-toolchain 1.97.1 --target aarch64-linux-android
        --target x86_64-linux-android
      - source ~/.cargo/env
      - cargo install cargo-ndk@4.1.2 --locked
      - cargo fetch --locked --manifest-path native/veilknit-daemon/Cargo.toml
      - sed -i -e "s|\"cargo\",|\"$(which cargo)\",|" app/build.gradle.kts
    ndk: r28c
    gradleprops:
      - weaveFdroidBuild=true

