AutoName: OrangTask
Description: |-
  OrangTask is a task manager for people who would rather run their own server
  than hand their to-do list to someone else. It is a native client for an
  OrangTask backend, which can be self-hosted with Docker. The whole stack
  (server, web app and this app) is MIT licensed.

  Sign in and everything syncs live over a WebSocket, on every device at once.

  Features include:

  * Lists with icons and colors, plus Today, Upcoming, Overdue, Assigned to me and All smart views
  * Full task editing with due dates, priority, assignees, tags, notes, subtasks and recurring rules
  * Natural-language quick add, sharing, search and offline editing with a durable mutation queue
  * Google Keep import, JSON export, webhooks, personal API keys and an optional PIN lock with encrypted token storage

  The F-Droid build contains no proprietary libraries. In particular, it does
  not include Firebase Cloud Messaging; notifications are fetched while the app
  is running rather than being pushed by Google. Everything else is identical
  to the full build.

  A server is required. This build points to task.oranges.lt, where an account
  can be created, but the repository includes Docker Compose files for hosting
  an independent instance.

