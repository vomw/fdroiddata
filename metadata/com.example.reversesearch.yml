Name: Reverse Search
Summary: Local on-device face clustering and deep web reverse image search.
Description: |-
  Reverse Search is a powerful privacy-first tool that allows you to scan your local 
  device for identical faces using an offline FaceNet AI model. It automatically 
  clusters your gallery by identity without sending your private photos to the cloud.
  
  Features:
  * Local Face Clustering
  * Inverse Face Search (Find all photos excluding a specific person)
  * Deep Web Facial Recognition Integration (Yandex, Google Lens, Bing)
  * Catbox.moe temporary secure uploads for external search

