Builds:
  - versionName: 0.8.6
    versionCode: 78
    commit: v0.8.6
    sudo:
      - apt-get update
      - apt-get install -y wget unzip cmake make
    gradle:
      - yes
    srclibs:
      - sherpa-onnx@v1.13.6
    build:
      - (cd $$sherpa-onnx$$ && ./build-android-arm64-v8a.sh)
      - L=$$sherpa-onnx$$/build-android-arm64-v8a/install/lib
      - mkdir -p app/src/main/jniLibs/arm64-v8a
      - cp -f $L/libsherpa-onnx-jni.so $L/libonnxruntime.so app/src/main/jniLibs/arm64-v8a/
    scanignore:
      - app/src/main/jniLibs/arm64-v8a/libsherpa-onnx-jni.so
      - app/src/main/jniLibs/arm64-v8a/libonnxruntime.so
    ndk: r28c

