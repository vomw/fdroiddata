Builds:
  - versionName: 0.8.6
    versionCode: 78
    commit: v0.8.6
    gradle:
      - '8.7'
    prebuild:
      - export ANDROID_NDK=$$NDK$$ && git clone --depth 1 --branch v1.13.6 
        https://github.com/k2-fsa/sherpa-onnx /tmp/sherpa-onnx && cd 
        /tmp/sherpa-onnx && ./build-android-arm64-v8a.sh
      - cp -f 
        /tmp/sherpa-onnx/build-android-arm64-v8a/install/lib/libsherpa-onnx-jni.so
        app/src/main/jniLibs/arm64-v8a/
      - cp -f 
        /tmp/sherpa-onnx/build-android-arm64-v8a/install/lib/libonnxruntime.so 
        app/src/main/jniLibs/arm64-v8a/
    scanignore:
      - app/src/main/jniLibs/arm64-v8a/libsherpa-onnx-jni.so
      - app/src/main/jniLibs/arm64-v8a/libonnxruntime.so

