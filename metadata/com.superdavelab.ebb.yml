      - $$flutter$$/bin/flutter build apk --release
      - mkdir -p "$SRC/build/app/outputs/flutter-apk"
      - cp build/app/outputs/flutter-apk/app-release.apk "$SRC/build/app/outputs/flutter-apk/"

