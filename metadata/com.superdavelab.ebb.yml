    versionCode: 400
    commit: v0.4.0
    output: build/app/outputs/flutter-apk/app-release.apk
    srclibs:
      - flutter@3.47.5
    build:
      - export SRC="$PWD" PUB_CACHE=/tmp/ebb-build/.pub-cache
      - rm -rf /tmp/ebb-build
      - cp -a "$SRC" /tmp/ebb-build
