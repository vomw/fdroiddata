AuthorName: d-rk
AuthorEmail: dirkwilden@gmail.com
SourceCode: https://github.com/d-rk/open-patience
IssueTracker: https://github.com/d-rk/open-patience/issues

RepoType: git
Repo: https://github.com/d-rk/open-patience.git

Builds:
  - versionName: 1.0.6
    versionCode: 81
    commit: f31979057067f0b4147618d76c9144dfc108654c
    sudo:
      - mkdir -p /home/runner/work/open-patience
      - chown -R vagrant /home/runner
    output: build/app/outputs/flutter-apk/app-armeabi-v7a-production-release.apk
    binary: https://github.com/d-rk/open-patience/releases/download/v%v/app-armeabi-v7a-production-release.apk
    srclibs:
      - flutter@stable
    rm:
      - linux
      - web
      - tools
      - docs
      - test
      - integration_test
    prebuild:
      - export repo=/home/runner/work/open-patience
      - cd ..
      - mv io.github.d_rk.openpatience $repo/open-patience
      - pushd $repo/open-patience
      - flutterVersion=$(sed -n -E "s/^\s+flutter:\ (.*)/\1/p" pubspec.yaml | head
        -1)
      - '[[ $flutterVersion ]]'
      - git -C $$flutter$$ checkout -f $flutterVersion
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get --enforce-lockfile
      - popd
      - mv $repo/open-patience io.github.d_rk.openpatience
    scandelete:
      - .pub-cache
    build:
      - export repo=/home/runner/work/open-patience
      - cd ..
      - mv io.github.d_rk.openpatience $repo/open-patience
      - pushd $repo/open-patience
      - export PUB_CACHE=$(pwd)/.pub-cache
      - export SOURCE_DATE_EPOCH=0
      - $$flutter$$/bin/flutter build apk --release --flavor production --split-per-abi
        --target-platform=android-arm
      - popd
      - mv $repo/open-patience io.github.d_rk.openpatience

