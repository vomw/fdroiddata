AntiFeatures:
  NonFreeNet:
    en-US: ISBN lookup relies on openlibrary.org and publish function relies on GitHub.
Categories:
  - Reading
License: GPL-3.0-or-later
AuthorName: Parallel Line Foundation
SourceCode: https://github.com/PLFIndia/pitak-x
IssueTracker: https://github.com/PLFIndia/pitak-x/issues

AutoName: Pitak

RepoType: git
Repo: https://github.com/PLFIndia/pitak-x.git

Builds:
  - versionName: 1.0.3
    versionCode: 4
    commit: 714af008cb7f009737fd2cea20452ddb460dfe03
    subdir: app
    gradle:
      - yes

  - versionName: 1.1.0
    versionCode: 5
    commit: 1.1.0
    sudo:
      - apt-get update
      - apt-get install -y clang cmake ninja-build pkg-config make perl
      - install -d -m 0775 /opt/rust
      - export RUSTUP_HOME=/opt/rust/rustup CARGO_HOME=/opt/rust/cargo
      - curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain
        stable --profile minimal --no-modify-path
      - /opt/rust/cargo/bin/rustup target add armv7-linux-androideabi aarch64-linux-android
        i686-linux-android x86_64-linux-android
      - chmod -R a+rwX /opt/rust
    output: build/app/outputs/flutter-apk/app-release.apk
    srclibs:
      - flutter@3.41.1
    rm:
      - ios
      - macos
      - windows
      - linux
    build:
      - export RUSTUP_HOME=/opt/rust/rustup CARGO_HOME=/opt/rust/cargo
      - export PATH="/opt/rust/cargo/bin:$PATH"
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get
      - $$flutter$$/bin/flutter build apk --release

AutoUpdateMode: None
UpdateCheckMode: None
CurrentVersion: 1.1.0
CurrentVersionCode: 5
