Categories:
  - Phone & SMS
  - System
License: GPL-3.0-or-later
SourceCode: https://github.com/kitsumed/ShizuCallRecorder
IssueTracker: https://github.com/kitsumed/ShizuCallRecorder/issues
Translation: https://hosted.weblate.org/engage/shizucallrecorder/
Donate: https://github.com/sponsors/kitsumed

RepoType: git
Repo: https://github.com/kitsumed/ShizuCallRecorder.git

Builds:
  - versionName: 1.0.2
    versionCode: 10000002
    commit: v1.0.2
    gradle:
      - yes
    gradleprops:
      - versionName=%v
      - ciBuildNumber=FDroid
      - SKIP_SIGNING=true

AutoUpdateMode: Version
UpdateCheckMode: Tags v(.*)
VercodeOperation:
  - int(%c.split('.')[0]) * 10000000 + int(%c.split('.')[1]) * 10000 + int(%c.split('.')[2])
UpdateCheckData: '|v(\d+)\.(\d+)\.(\d+)||v(\d+\.\d+\.\d+)'
CurrentVersion: 1.0.2
CurrentVersionCode: 10000002
