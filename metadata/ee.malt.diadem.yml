Builds:
  - versionName: '0.8'
    versionCode: 8
    commit: 21a8d539f4d12366f9ac171369b0dce486c47436
    subdir: android/app
    sudo:
      - curl -Lo /tmp/node.tar.gz https://nodejs.org/dist/v22.23.1/node-v22.23.1-linux-x64.tar.gz
      - echo "7a8cb04b4a1df4eaf432125324b81b29a088e73570a23259a8de1c65d07fc129  /tmp/node.tar.gz"
        | sha256sum -c -
      - tar xzf /tmp/node.tar.gz --strip-components=1 -C /usr/local/
      - corepack enable
    init:
      - pushd ../..
      - pnpm install --frozen-lockfile
      - popd
    gradle:
      - yes
    prebuild:
      - pushd ../..
      - bash setup.sh
      - pnpm exec svelte-kit sync
      - BUILD_TARGET=native VITE_NO_GMS=true pnpm exec vite build
      - rm -rf node_modules/@capacitor/geolocation node_modules/.pnpm/@capacitor+geolocation@*
      - pnpm exec cap sync android
      - popd
    scandelete:
      - node_modules

AutoUpdateMode: Version
