Builds:
  - versionName: '0.8'
    versionCode: 8
    commit: 21a8d539f4d12366f9ac171369b0dce486c47436
    subdir: android/app
    sudo:
      - curl -Lo /tmp/node.tar.xz https://nodejs.org/dist/v22.23.1/node-v22.23.1-linux-x64.tar.xz
      - echo "9749e988f437343b7fa832c69ded82a312e41a03116d766797ac14f6f9eee578  /tmp/node.tar.xz"
        | sha256sum -c -
      - tar xJf /tmp/node.tar.xz --strip-components=1 -C /usr/local/
      - corepack enable
    init:
      - pushd ../..
      - pnpm install --frozen-lockfile
      - popd
    gradle:
      - yes
    prebuild:
      - pushd ../..
      - bash setup.sh
      - pnpm exec svelte-kit sync
      - BUILD_TARGET=native VITE_NO_GMS=true pnpm exec vite build
      - rm -rf node_modules/@capacitor/geolocation node_modules/.pnpm/@capacitor+geolocation@*
      - pnpm exec cap sync android
      - popd
    scandelete:
      - node_modules

