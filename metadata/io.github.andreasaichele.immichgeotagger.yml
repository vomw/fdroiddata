License: MIT
AuthorName: Andreas Aichele
AuthorWebSite: https://github.com/andreas-aichele
WebSite: https://github.com/andreas-aichele/immich-geotagger
SourceCode: https://github.com/andreas-aichele/immich-geotagger
IssueTracker: https://github.com/andreas-aichele/immich-geotagger/issues
Changelog: https://github.com/andreas-aichele/immich-geotagger/releases

AutoName: Immich GeoTagger

RepoType: git
Repo: https://github.com/andreas-aichele/immich-geotagger.git

Builds:
  - versionName: 1.0.2
    versionCode: 1000002
    commit: 04b6d77e3f4bbeeb21ac25ebb4302ced523e587c
    output: build/app/outputs/flutter-apk/app-release.apk
    srclibs:
      - flutter@stable
    prebuild:
      - git -C $$flutter$$ checkout -f 3.47.5
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get
    scandelete:
      - .pub-cache
    build:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter build apk --release

AutoUpdateMode: Version
UpdateCheckMode: Tags ^v[0-9]+\.[0-9]+\.[0-9]+$
UpdateCheckData: pubspec.yaml|version:\s.+\+(\d+)|.|version:\s(.+)\+
CurrentVersion: 1.0.2
CurrentVersionCode: 1000002
