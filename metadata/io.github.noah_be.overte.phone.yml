MaintainerNotes: |
  Unofficial Android Phone fork maintained by Noah Frank; not an official Overte release.
  All native dependencies are built from the locked public source closure.
  Acquisition precedes network-isolated compilation; no Conan binaries are used.
  Gradle 8.13 is obtained from its official distribution with its pinned SHA-256.
  F-Droid removes the checked-in wrapper; the build does not require that wrapper.
  scandelete is restricted to unused test data and npm package manifests. The
  referenced JavaScript, icons, licenses and runtime assets remain untouched.
  Requires SDK 36, Build-Tools 35.0.0 and 36.0.0 and SDK CMake 3.31.6, plus the listed NDK.
  Command-line Tools 22.0 supply apkanalyzer for the release APK checks.
  Uses the standard Debian trixie GCC/G++, CMake, Ninja and OpenJDK 21 packages.
  No snapshot, unstable repository, exact Debian package pin or compiler
  alternatives override is required.
  Store text and graphics are imported from android/phone/fastlane in the source.
  subdir selects that directory; script, output and work-directory paths have
  been adjusted equivalently since the VM test, without changing build inputs.
  Uses the maintainer-signed reference APK after reproducible-build verification.
  R8, Node/V8 Release mode and resource/ZIP optimizations from 0.1.1 are retained.
  Version 0.1.2 fixes default/empty microphone selection and native editor-focus
  teardown. Two independent clean local container builds with separate empty
  caches produced byte-identical unsigned APKs (185216979 bytes), SHA-256
  f52b26c1761149972b00b65e3ddad0615489240b70b74310fe3885c607fa0167.
  These were local qualification builds, not official F-Droid infrastructure builds.
  The final clean APK, signed with a local test key and verified after installation,
  passed microphone level, Phone-to-PC voice and mute/unmute checks. Go To text
  entry, keyboard dismissal and Back gestures worked on retries, but one native
  Qt/QML crash occurred. Its cause is unknown and retries do not establish a fix:
  https://github.com/noah-be/overte/issues/933
  Regranting microphone permission through Android Settings requires an app restart.
  Earlier denial/regrant tests used a diagnostic artifact, not this final APK.
  Official F-Droid verification and acceptance remain pending.
  Build timestamps, embedded paths and Scribe date comments are bound to
  deterministic inputs by the isolated submission build instructions.
  Automatic updates use android-phone-release-v<versionName>+<versionCode> tags.
  The earlier android-phone-v0.1.0+1 tag predates the qualified source and is
  excluded from update checks. iOS/Pico tags are also excluded.
  Increase versionCode for each new Android release.
  System package provisioning is inlined here; no app repository script runs as root.
  Conan 2.25.2 is installed in the build user home without sudo.

