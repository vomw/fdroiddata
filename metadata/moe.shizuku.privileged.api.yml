    subdir: manager
    submodules: true
    sudo:
      - echo "deb https://deb.debian.org/debian trixie main" > /etc/apt/sources.list.d/trixie.list
      - apt-get update
      - apt-get install -y -t trixie openjdk-21-jdk-headless
      - update-alternatives --auto java
      - mkdir -p /home/runner
      - chown vagrant /home/runner
    output: build/outputs/apk/release/*.apk
    binary: https://github.com/RikkaApps/Shizuku/releases/download/v13.6.0/shizuku-v13.6.0.r1086.2650830c-release.apk
    prebuild:
      - sed -i -e '/signing.gradle/d' build.gradle
      - gradle clean
    scanignore:
      - shell/src/main/java/rikka/shizuku/shell/ShizukuShellLoader.java
    build:
      - export repo=/home/runner/work/Shizuku
      - mkdir -p $repo
      - cd ../..
      - mv moe.shizuku.privileged.api $repo/Shizuku
      - pushd $repo/Shizuku/manager
      - gradle assembleRelease
      - popd
      - mv $repo/Shizuku moe.shizuku.privileged.api

