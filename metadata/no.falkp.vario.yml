Name: Vario
AutoName: Vario
Description: |
  Aircraft altimeter and variometer instruments for your phone, for aviation enthusiasts. Not for actual use, just for fun!

  Three altitude sources, cycled with the MODE button:

  * GPS - altitude straight from the GPS receiver.
  * MAP - ground (terrain) elevation below your position, from the Open-Meteo elevation API (GLO-90). This is ground elevation, not height above ground.
  * BAR - barometric altitude, computed from the pressure sensor in your phone. The device barometer is read natively at 10 Hz; no mobile browser exposes it to web apps, which is the main reason this app exists as a native build. Sea-level pressure (QNH) is fetched from api.met.no for your position and refreshed every 15 minutes, and can be set by hand instead.

  The altimeter is the classic three-pointer 100s / 1000s / 10 000s layout with a Kollsman window. Tap a dial to zoom in, tap again to zoom out. IMP/MET switches between feet and metres. Long-press MODE or IMP/MET toggles a debug overlay with a pressure strip chart in BAR mode.

  Privacy:

  * No accounts, no analytics, no ads, no crash reporting.
  * Settings are stored on the device only.
  * Nothing is requested until you leave the first-run info screen.
  * Location is used on-device only. Rounded coordinates are sent to api.met.no (QNH) and api.open-meteo.com (terrain elevation); those two services see your IP address as well.
  * Everything except the two QNH/elevation lookups works fully offline, and BAR mode keeps working with a hand-set QNH.

  No Google Play Services, no proprietary libraries, no closed-source SDKs - the APK is built from the source in this repository and is available from F-Droid. Source code is AGPL-3.0-or-later.

