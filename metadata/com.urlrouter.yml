AutoName: URL Router
Summary: Automatically route links to browsers

Description: |-
  URL Router intercepts links opened on Android and routes them
  to the appropriate browser according to user-defined rules.

  Links can be matched using:
  * Hostname
  * Wildcards
  * Prefixes
  * Substrings
  * Regular expressions

  Features:
  * Silent routing with no UI when a rule matches
  * Configurable default browser fallback
  * Customisable browser chooser dialog
  * Import and export of configuration
  * Diagnostics screen for testing rules
  * Support for multiple browsers and apps

  URL Router is designed for users who want fine-grained control
  over how links are opened on their device.

  Dedicated to my son Mihajlo.

  Thanks to Human Made and Altis for making the development of
  this app possible.

