AutoName: ReminDiary
Description: |-
  ReminDiary is an offline daily journal. Write today's entry and save it, and the
  app reveals what you wrote on this same calendar date in previous years.

  Everything stays on your device. There is no account and no sync. Entries export to
  and import from plain CSV, so your writing is never locked in. The only network
  activity the app performs at all is a single opt-in, off-by-default analytics
  toggle in Settings, which reports which screen you're on and nothing else - never
  entry content, dates, or any other personal data. See the full privacy policy at
  https://remindiary.hub13.xyz/privacy/ for exactly what that does and does not send.

  * One entry per calendar date
  * Automatic reveal of past entries on the same date in previous years
  * CSV export and import
  * Light and dark themes, following the system by default
  * A single Android permission (INTERNET), used only by the opt-in analytics toggle

RepoType: git
Repo: https://github.com/grantstephens/ReminDiary.git

Builds:
  - versionName: 1.0.0
    versionCode: 10000999
    commit: v1.0.0
    sudo:
      - curl -Lo /tmp/node.tar.gz https://nodejs.org/dist/v24.16.0/node-v24.16.0-linux-x64.tar.gz
      - echo "2faf6a387e9b62b888e21c54f01249fb27537ffecf1842f29f4c919d0a59a0ff  /tmp/node.tar.gz"
        | sha256sum -c -
      - tar xzf /tmp/node.tar.gz --strip-components=1 -C /usr/local/
    init:
      - export CI=1
      - export EXPO_NO_TELEMETRY=1
      - npm ci
    output: android/app/build/outputs/apk/release/*.apk
    rm:
      - node_modules/@expo/expo-modules-macros-plugin/apple/
      - node_modules/expo-sqlite/ios/
      - node_modules/expo-file-system/prebuilds/
      - node_modules/expo-font/prebuilds/
      - node_modules/expo-modules-core/prebuilds/
      - node_modules/react-native/React/I18n/strings/
      - node_modules/expo-sqlite/web/
      - node_modules/fb-dotslash/bin/
      - node_modules/expo/template.tgz
    prebuild:
      - export CI=1
      - export EXPO_NO_TELEMETRY=1
      - "node -e \"\nconst fs = require('fs');\nconst config = JSON.parse(fs.readFileSync('app.json',
        'utf8'));\nconfig.expo.version = '1.0.0';\nconfig.expo.android.versionCode
        = 10000999;\nfs.writeFileSync('app.json', JSON.stringify(config, null, 2)
        + '\\n');\n\""
      - "node -e \"\nconst fs = require('fs');\nconst pkg = JSON.parse(fs.readFileSync('package.json',
        'utf8'));\npkg.expo = pkg.expo || {};\npkg.expo.autolinking = { android: {
        buildFromSource: ['.*'] } };\nfs.writeFileSync('package.json', JSON.stringify(pkg,
        null, 2) + '\\n');\n\""
      - npx expo prebuild --platform android --no-install
      - sed -i '/jvmToolchain\|JavaVersion/s/17/21/' node_modules/@react-native/gradle-plugin/*/build.gradle.kts
        node_modules/@react-native/gradle-plugin/react-native-gradle-plugin/src/main/kotlin/com/facebook/react/utils/JdkConfiguratorUtils.kt
      - "python3 -c \"\npath = 'android/app/build.gradle'\nwith open(path) as f:\n\
        \    content = f.read()\nanchor = '''            // Caution! In production,
        you need to generate your own keystore file.\n            // see https://reactnative.dev/docs/signed-apk-android.\n\
        \            signingConfig signingConfigs.debug'''\nassert content.count(anchor)
        == 1, 'signingConfig anchor not found verbatim - Expo template may have changed'\n
        stripped = anchor.replace('\\n            signingConfig signingConfigs.debug',
        '')\ncontent = content.replace(anchor, stripped, 1)\nwith open(path, 'w')
        as f:\n    f.write(content)\n\""
      - printf '\norg.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=2g\n' >> android/gradle.properties
    scanignore:
      - node_modules/hermes-compiler/hermesc/linux64-bin/hermesc
      - node_modules/expo-asset/local-maven-repo/
      - node_modules/expo-document-picker/local-maven-repo/
      - node_modules/expo-file-system/local-maven-repo/
      - node_modules/expo-font/local-maven-repo/
      - node_modules/expo/node_modules/@expo/dom-webview/local-maven-repo/
      - node_modules/expo/node_modules/expo-keep-awake/local-maven-repo/
      - node_modules/expo-sharing/local-maven-repo/
      - node_modules/expo-sqlite/local-maven-repo/
      - node_modules/expo-sqlite/android/vec/
      - node_modules/expo-sqlite/android/libsql/
      - node_modules/expo-status-bar/local-maven-repo/
      - node_modules/react-native-screens/android/build.gradle
      - node_modules/react-native-safe-area-context/android/build.gradle
      - node_modules/expo-modules-core/android/ExpoModulesCorePlugin.gradle
      - node_modules/react-native/ReactAndroid/publish.gradle
    scandelete:
      - node_modules/hermes-compiler/hermesc/osx-bin
      - node_modules/hermes-compiler/hermesc/win64-bin
    build:
      - cd android/app
      - gradle assembleRelease

AutoUpdateMode: None
UpdateCheckMode: Static
