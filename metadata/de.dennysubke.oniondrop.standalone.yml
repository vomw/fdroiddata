Builds:
  - versionName: 1.0.0
    versionCode: 10000
    commit: 4c916432d6a23d6cf1e353e41797c411b23a789e
    subdir: android-standalone/app
    submodules: true
    sudo:
      - apt-get update
      - apt-get install -y autoconf automake libtool autopoint gettext pkg-config
        build-essential po4a libzstd-dev
    gradle:
      - yes
    rm:
      - android-standalone/third_party/tor-android/settings.gradle.kts
      - android-standalone/third_party/tor-android/tor-android-binary/build.gradle.kts
      - android-standalone/third_party/tor-android/external/openssl/cloudflare-quiche
      - android-standalone/third_party/tor-android/external/openssl/fuzz/corpora
      - android-standalone/third_party/tor-android/external/openssl/gost-engine
      - android-standalone/third_party/tor-android/external/openssl/pkcs11-provider
      - android-standalone/third_party/tor-android/external/openssl/tlsfuzzer
      - android-standalone/third_party/tor-android/external/openssl/tlslite-ng
      - android-standalone/third_party/tor-android/external/zstd/tests
    prebuild:
      - p=../gradle/wrapper
      - mkdir -p "$p"
      - url=https://services.gradle.org/distributions/gradle-8.11.1-bin.zip
      - echo "distributionUrl=$url" > "$p/gradle-wrapper.properties"
    build:
      - ONIONDROP_OFFLINE=1 bash ../scripts/build-native-tor.sh arm64-v8a x86_64
      - python3 ../scripts/collect-native-licenses.py ../third_party/tor-android
        src/main/assets/licenses/native
    ndk: 28.2.13676358

AutoUpdateMode: Version
