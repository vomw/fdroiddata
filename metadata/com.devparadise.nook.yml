Binaries: 
  https://github.com/prit-007/nook/releases/download/v%v/app-armeabi-v7a-release.apk

Builds:
  - versionName: 0.9.4
    versionCode: 161
    commit: 580c2ff3a555443c0009b9938df210b75f438ef2
    sudo:
      - apt-get update
      - apt-get install -y --no-install-recommends cmake libglu1-mesa libsecret-1-dev
        ninja-build tcl clang make git
      - mkdir -p /__w/nook /opt
      - chown -R vagrant /__w /opt
    output: build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
    binary: 
      https://github.com/prit-007/nook/releases/download/v%v/app-armeabi-v7a-release.apk
    srclibs:
      - flutter@3.44.8
      - sqlcipher@v4.5.7
    rm:
      - ios
      - linux
      - macos
      - web
      - windows
    prebuild:
      - tool/ci/fdroid_flutter_setup.sh $$flutter$$
      - export repo=/__w/nook/nook; cd ..; mv com.devparadise.nook $repo; cd $repo;
        export PUB_CACHE=$(pwd)/.pub-cache; export PATH=/opt/flutter/bin:$PATH; tool/ci/android_prebuild.sh
      - cd ..; mv $repo com.devparadise.nook
    scandelete:
      - .pub-cache
    build:
      - export repo=/__w/nook/nook; cd ..; mv com.devparadise.nook $repo; cd $repo;
        export PUB_CACHE=$(pwd)/.pub-cache; export PATH=/opt/flutter/bin:$PATH; export
        NOOK_OPENSSL_DIR=/opt/openssl-android
      - tool/ci/android_build.sh $$sqlcipher$$ android-arm
      - cd ..; mv $repo com.devparadise.nook
    ndk: 28.2.13676358

