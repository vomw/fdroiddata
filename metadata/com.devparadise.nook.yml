Name: Nook
AutoName: nook

RepoType: git
Repo: https://github.com/prit-007/nook.git

Builds:
  - versionName: 0.8.6
    versionCode: 81
    commit: 7eca9f41c3ff6decd764f9a4f10459a1b15a25f7
    sudo:
      - apt-get update
      - apt-get install -y --no-install-recommends cmake libglu1-mesa libsecret-1-dev
        ninja-build tcl clang make
    output: build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
    srclibs:
      - flutter@stable
      - sqlcipher@v4.5.7
    rm:
      - ios
      - linux
      - macos
      - web
      - windows
    prebuild:
      - flutterVersion=$(sed -n -E "s/.*flutter-version:\ '(.*)'/\1/p" .github/workflows/ci.yml
        | head -1)
      - '[[ $flutterVersion ]]'
      - git -C $$flutter$$ checkout -f $flutterVersion
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get --enforce-lockfile
      - (cd $$sqlcipher$$ && ./configure --enable-tempstore=yes --with-crypto-lib=none
        && make sqlite3.c)
      - $$flutter$$/bin/dart run tool/patch_fdroid_sqlite.dart $$sqlcipher$$
      - $$flutter$$/bin/dart run tool/patch_appflowy_editor.dart
      - $$flutter$$/bin/dart run tool/patch_talker_flutter.dart
      - $$flutter$$/bin/dart run tool/patch_mdns_dart.dart
      - $$flutter$$/bin/dart run build_runner build --delete-conflicting-outputs
    scanignore:
      - .dart_tool
    scandelete:
      - .pub-cache
    build:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter build apk --release --split-per-abi --target-platform=android-arm
        --obfuscate --split-debug-info=build/symbols
    ndk: 28.2.13676358

