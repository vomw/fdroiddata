Name: Nook
AutoName: nook

RepoType: git
Repo: https://github.com/prit-007/nook.git
Binaries: 
  https://github.com/prit-007/nook/releases/download/v%v/app-armeabi-v7a-release.apk

Builds:
  - versionName: 0.8.8
    versionCode: 101
    commit: 196599bc988908840cc9e6721c3c5282ca9abf76
    sudo:
      - apt-get update
      - apt-get install -y --no-install-recommends cmake libglu1-mesa libsecret-1-dev
        ninja-build tcl clang make git
      - mkdir -p /home/runner/work/nook
      - chown -R vagrant /home/runner/work
      - git clone --depth 1 --branch 3.44.8 https://github.com/flutter/flutter.git
        /opt/flutter
      - chown -R vagrant /opt/flutter
      - /opt/flutter/bin/flutter precache --android
    output: build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
    binary: 
      https://github.com/prit-007/nook/releases/download/v%v/app-armeabi-v7a-release.apk
    srclibs:
      - sqlcipher@v4.5.7
    rm:
      - ios
      - linux
      - macos
      - web
      - windows
    prebuild:
      - cd ..
      - mv com.devparadise.nook /home/runner/work/nook/nook
      - pushd /home/runner/work/nook/nook
      - export PUB_CACHE=$(pwd)/.pub-cache
      - export PATH="/opt/flutter/bin:$PATH"
      - flutter config --no-analytics
      - flutter pub get --enforce-lockfile
      - dart run build_runner build --delete-conflicting-outputs
      - sed -i 's/-Wl,-z,max-page-size=16384/-Wl,-z,max-page-size=16384,--build-id=none/'
        $PUB_CACHE/hosted/pub.dev/jni-*/src/CMakeLists.txt
      - popd
      - mv /home/runner/work/nook/nook com.devparadise.nook
    scandelete:
      - .pub-cache
    build:
      - cd ..
      - mv com.devparadise.nook /home/runner/work/nook/nook
      - pushd /home/runner/work/nook/nook
      - export PUB_CACHE=$(pwd)/.pub-cache
      - export PATH="/opt/flutter/bin:$PATH"
      - (cd $$sqlcipher$$ && ./configure --enable-tempstore=yes --with-crypto-lib=none
        && make sqlite3.c)
      - dart run tool/patch_fdroid_sqlite.dart $$sqlcipher$$
      - dart run tool/patch_appflowy_editor.dart
      - dart run tool/patch_talker_flutter.dart
      - dart run tool/patch_mdns_dart.dart
      - export SOURCE_DATE_EPOCH=0
      - flutter build apk --release --split-per-abi --target-platform=android-arm
        --obfuscate --split-debug-info=build/symbols
      - popd
      - mv /home/runner/work/nook/nook com.devparadise.nook
    ndk: 28.2.13676358

