Builds:
  - versionName: 1.1.5
    versionCode: 110050002
    commit: 972840623b638b548baf7a0e9dbd24d657d51e84
    sudo:
      - apt-get update
      - apt-get install -y cmake ninja-build gcc g++
    output: build/app/outputs/flutter-apk/app-arm64-v8a-fdroid-release.apk
    binary:
      https://gitlab.com/api/v4/projects/85441266/packages/generic/kichat/v%v/app-arm64-v8a-fdroid-release.apk
    srclibs:
      - flutter@stable
      - llamadart-native@0ba009799d7b88ea2851cff4c273a41aa7137224
    rm:
      - ios
      - linux
    prebuild:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - flutterVersion=$(sed -n -E "s/.*flutter-version:\ '(.*)'/\1/p" .github/workflows/release.yml)
      - '[[ $flutterVersion ]]'
      - git -C $$flutter$$ checkout -f $flutterVersion
      - $$flutter$$/bin/flutter config --no-analytics
      - "sed -i '/llamadart_native_runtimes:/a\\      llamadart_native_path: native_bundles'
        pubspec.yaml"
      - "grep -q 'llamadart_native_path: native_bundles' pubspec.yaml"
      - $$flutter$$/bin/flutter pub get --enforce-lockfile
      - export ANDROID_NDK_HOME=$$NDK$$
      - git -C $$llamadart-native$$ submodule update --init --recursive --depth 1
      - python3 $$llamadart-native$$/tools/build.py android --abi arm64-v8a
      - mkdir -p native_bundles
      - cp -r $$llamadart-native$$/bin/android/arm64 native_bundles/android-arm64
    scanignore:
      - .pub-cache
      - native_bundles
    build:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter build apk --release --flavor fdroid --split-per-abi
        --target-platform=android-arm64
    ndk: 28.2.13676358

