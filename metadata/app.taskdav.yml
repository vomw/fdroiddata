# F-Droid metadata for TaskDav (applicationId: app.taskdav)
# Submit as: metadata/app.taskdav.yml in https://gitlab.com/fdroid/fdroiddata
# Guide: https://f-droid.org/docs/Submitting_to_F-Droid_Quick_Start_Guide/

Categories:
  - Time
  - Writing
  - Calendar & Agenda
License: GPL-3.0-only
AuthorName: Juan Curti
AuthorWebSite: https://github.com/TechPonzo
WebSite: https://github.com/TechPonzo/TaskDav
SourceCode: https://github.com/TechPonzo/TaskDav
IssueTracker: https://github.com/TechPonzo/TaskDav/issues
Changelog: https://github.com/TechPonzo/TaskDav/releases

AutoName: TaskDav

RepoType: git
Repo: https://github.com/TechPonzo/TaskDav.git

Builds:
  - versionName: "1.0.0"
    versionCode: 1
    commit: v1.0.0
    subdir: app
    sudo:
      - apt-get update
      - apt-get install -y openjdk-17-jdk-headless
      - update-java-alternatives -a
    gradle:
      - yes
    rm:
      - .github
      - docs
      - scripts

MaintainerNotes: |-
  Kotlin + Jetpack Compose + KSP/Room. Needs JDK 17.
  CalDAV client is pulled from JitPack: com.github.bitfireAT:dav4jvm.
  Store listing, changelogs, and phone screenshots are in the app repo under
  fastlane/metadata/android/ for locales en-US, es-ES, and it-IT.
  Demo/seed code is debug-only and not included in release builds.
  Release builds are left unsigned here so fdroidserver can sign them
  (do not pass -PuseDebugKeystore on the F-Droid builder).

AutoUpdateMode: Version
UpdateCheckMode: Tags
CurrentVersion: "1.0.0"
