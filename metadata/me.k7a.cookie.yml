Repo: https://github.com/yendacoder/cookie
Binaries: https://github.com/yendacoder/cookie/releases/download/v%v/cookie.apk

Builds:
  - versionName: 2.0.1
    versionCode: 200010
    commit: v2.0.1
    output: build/app/outputs/flutter-apk/app-release.apk
    srclibs:
      - flutter@3.41.6
    rm:
      - ios
      - linux
      - macos
      - web
      - windows
    prebuild:
      - flutterVersion=$(sed -n -E "s/.*FLUTTER_VERSION:\ '(.*)'/\1/p" .github/workflows/release.yaml)
      - "[[ $flutterVersion ]]"
      - git -C $$flutter$$ checkout -f $flutterVersion

      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter packages pub get
    scandelete:
      - .pub-cache
    build:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter build apk

