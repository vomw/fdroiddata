AutoName: Nexus Command Center
Summary: One Life Score for finance, fitness, study, work and habits

Description: |-
  Nexus Command Center is the hub of the Limecore suite — a personal life
  dashboard that combines five domains (Finance, Fitness, Studies, Work,
  Habits) into a single Life Score. Budgets, accounts, net worth, portfolio
  and market data; workouts from LimeLog and study sessions from StudyDesk;
  a streak-aware habit tracker; configurable Life Profiles and goals.

  Local-first with on-device storage; optional account-gated cloud sync.
  No Google Play Services, no Firebase — Google sign-in is a plain web
  OAuth flow. Third-party market data (Finnhub, CoinGecko, Yahoo, ECB) and
  an optional AI feature are user-initiated HTTPS calls.

