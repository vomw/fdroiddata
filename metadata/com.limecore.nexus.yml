# F-Droid metadata for Nexus Command Center — READY FOR SUBMISSION (2026-06-27).
# FD-1 Fastlane metadata present (6 locales). FD-2 gradle wrapper SHA present.
# FD-3 FOSS audit PASS (no GMS/Firebase). LICENSE MIT in repo root.
Categories:
  - Money
License: MIT
AuthorName: Emil Hongisto (Limekana)
SourceCode: https://github.com/Limekana/nexus-command-center
IssueTracker: https://github.com/Limekana/nexus-command-center/issues

AutoName: Nexus Command Center

RepoType: git
Repo: https://github.com/Limekana/nexus-command-center.git

Builds:
  - versionName: 1.6.1
    versionCode: 23
    commit: 332ae8c5c711277525e96fe385d795544cc1fca7
    subdir: android/app
    sudo:
      - apt-get update
      - apt-get install -y npm
    # subdir is the app module (where the APK lands), but npm + the Capacitor
    # sync must run from the repo root. init/prebuild each start in subdir, so
    # cd up two levels; keep each list's cd in one entry (entries are joined
    # into a single shell, so a repeated cd would over-climb).
    init:
      - cd ../.. && npm ci
    prebuild:
      - cd ../.. && npm run build && npx cap sync android
    # Delete build-time node tooling before the source scanner runs — these
    # ship prebuilt binaries (esbuild, sharp/libvips, template tarballs, jars)
    # that the scanner rejects. None are needed by the Gradle build, which only
    # references @capacitor/android + the plugin packages.
    scandelete:
      - node_modules/@capacitor/cli
      - node_modules/@capacitor/assets
      - node_modules/@trapezedev
      - node_modules/@esbuild
      - node_modules/esbuild
      - node_modules/@img
      - node_modules/sharp
    gradle:
      - yes

AntiFeatures:
  - NonFreeNet   # Supabase sync, Google OAuth, finance APIs, AI Edge Function (all user-initiated HTTPS)

AutoUpdateMode: Version
UpdateCheckMode: Tags
CurrentVersion: 1.6.1
CurrentVersionCode: 23
