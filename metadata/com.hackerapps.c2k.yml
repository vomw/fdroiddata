AutoName: C2K
Summary: Couch to 5K & 10K running trainer
Description: |-
  Free, open-source running trainer for Android. No Google services, no tracking,
  no ads, no internet connection required.

  Voice prompts guide you through each interval using Android's built-in TTS engine —
  "Start running", "Walk for 90 seconds", countdown warnings — with no internet needed.

  The workout timer runs in the background with a lock-screen notification and
  pause/stop controls, keeping your screen free during runs.

  Optional GPS tracks distance and pace, but the app works fine without it.
  Compatible with GrapheneOS and any de-Googled Android device.

  Programs included:

  * Couch to 5K (C25K) — 9 weeks, 3 runs per week
  * Couch to 10K (C210K) — 14 weeks, 3 runs per week
  * One Hour Runner — graduate from C25K to a full hour
  * 5K Improver — build speed after completing C25K

