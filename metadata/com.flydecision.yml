Name: Fly Decision
Summary: Pronóstico y análisis meteorológico para vuelo en parapente.
Description: |-
  Análisis automático del pronóstico de tiempo y orientaciones para despegues de parapente.
  Tabla con lugares de vuelo y predicciones por horas para los próximos días, con evaluación visual por colores según límites de seguridad personalizables. Ayuda para decidir dónde puedes ir a volar en parapente. Incluye mapa de despegues.

RepoType: git
Repo: https://github.com/flydecision/flydecision.git 

Builds:
  - versionName: '2.2' 
    versionCode: 33   
    commit: main       
    subdir: android    
    sudo:
      - apt-get update || true
      - apt-get install -y nodejs npm
    init:
      - npm install
      - npx cap sync android
    gradle:
      - 'yes'

