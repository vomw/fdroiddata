Categories:
  - Sports & Health
  - Weather
License: AGPL-3.0-only
SourceCode: https://github.com/flydecision/flydecision
IssueTracker: https://github.com/flydecision/flydecision/issues

RepoType: git
Repo: https://github.com/flydecision/flydecision.git

Builds:
  - versionName: '2.2.1'
    versionCode: 34
    commit: v2.2
    subdir: android
    sudo:
      - apt-get update || true
      - apt-get install -y curl
      - curl -fsSL https://deb.nodesource.com/setup_22.x | bash -
      - apt-get install -y nodejs
    init:
      # Volvemos a la raíz para instalar y compilar la web antes de entrar a Android
      - cd .. && npm install
      - cd .. && npm run build
      - cd .. && npx cap sync android
    gradle:
      - yes

AutoUpdateMode: Version %v
UpdateCheckMode: Tags
CurrentVersion: '2.2.1'
CurrentVersionCode: 34
