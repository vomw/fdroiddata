License: ISC
AuthorName: Netzwerk Apostolische Geschichte, e.V.
WebSite: https://www.neuapostolisches-gesangbuch.de/
SourceCode: https://gitlab.com/netzwerk-apostolische-geschichte/AppGB1925
IssueTracker: https://gitlab.com/netzwerk-apostolische-geschichte/AppGB1925/-/work_items

AutoName: Neuapostolisches Gesangbuch

RepoType: git
Repo: https://gitlab.com/netzwerk-apostolische-geschichte/AppGB1925.git

Builds:
  - versionName: 1.1.2
    versionCode: 12
    commit: 2524d910e6aa5371c1ae518a136b24131ef05349
    output: build/app/outputs/flutter-apk/app-release.apk
    srclibs:
      - flutter@stable
    rm:
      - ios
      - linux
      - macos
      - web
      - windows
    prebuild:
      - flutterVersion=3.44.6
      - '[[ $flutterVersion ]]'
      - git -C $$flutter$$ checkout -f $flutterVersion
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get --enforce-lockfile
    scandelete:
      - .pub-cache
    build:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter build apk --release

AutoUpdateMode: Version
UpdateCheckMode: Tags
UpdateCheckData: pubspec.yaml|version:\s.+\+(\d+)|.|version:\s(.+)\+
CurrentVersion: 1.1.2
CurrentVersionCode: 12
