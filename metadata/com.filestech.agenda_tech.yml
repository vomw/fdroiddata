RepoType: git
Repo: https://github.com/gitubpatrice/AGENDA-TECH.git

Builds:
  - versionName: 0.5.0
    versionCode: 47
    # Not the v0.5.0 tag itself: the tag predates the fastlane metadata commit, and the
    # store listing is read from this checkout. The app code is byte-identical between the
    # two — the metadata commit touches nothing under app/.
    commit: 80c98fec3f7ec83a8dd6ce4a2371cf8207d95d76
    subdir: app
    gradle:
      - yes
    prebuild:
      # 1-3: drop the release signing config. The keystore is not in the repository, so the
      # build must produce an unsigned APK. The closing braces are anchored rather than
      # matched loosely: both blocks contain nested braces, and a bare `/}/` would end the
      # range at the first inner one, leaving an orphan brace that breaks the Kotlin DSL.
      - sed -i -e '/^val keystoreProps = Properties/,/^}$/d' build.gradle.kts
      - sed -i -e '/^    signingConfigs {$/,/^    }$/d' build.gradle.kts
      - sed -i -e '/if (keystoreProps.isNotEmpty()) signingConfig/d' build.gradle.kts
      # 4: drop the ABI splits. Upstream ships per-ABI APKs, but they all carry the same
      # versionCode, so there would be no way to tell the four build outputs apart. Without
      # the splits the build emits a single app-release-unsigned.apk holding every ABI.
      - sed -i -e '/^    splits {$/,/^    }$/d' build.gradle.kts

AutoUpdateMode: Version
UpdateCheckMode: Tags ^v\d+\.\d+\.\d+$
# versionCode first, then versionName — the order fdroidserver expects.
# The version lives in version.properties rather than in build.gradle.kts: it is the single
# source of truth, deliberately frozen instead of derived from the git history.
UpdateCheckData: version.properties|versionCode=(\d+)|.|versionName=(\d+\.\d+\.\d+)
CurrentVersion: 0.5.0
CurrentVersionCode: 47
