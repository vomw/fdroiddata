Categories:
  - Habit Tracker
  - Role-Playing Game
License: GPL-3.0-only
AuthorName: hellArcom
SourceCode: https://github.com/hellArcom/life_rpg
IssueTracker: https://github.com/hellArcom/life_rpg/issues
Changelog: https://github.com/hellArcom/life_rpg/releases

AutoName: Life RPG

RepoType: git
Repo: https://github.com/hellArcom/life_rpg.git

Builds:
  - versionName: 0.4.0
    versionCode: 1
    commit: <NOUVEAU_HASH>
    output: build/app/outputs/flutter-apk/app-release.apk
    srclibs:
      - flutter@221059e0b6
    rm:
      - ios
      - linux
      - windows
    prebuild:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get --enforce-lockfile
    scanignore:
      - $$flutter$$/bin/cache
    scandelete:
      - .pub-cache
    build:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter build apk --release

AutoUpdateMode: Version
UpdateCheckMode: Tags
UpdateCheckData: pubspec.yaml|version:\s.+\+(\d+)|.|version:\s(.+)\+
CurrentVersion: 0.4.0
CurrentVersionCode: 1