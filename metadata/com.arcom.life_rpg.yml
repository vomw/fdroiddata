  - Role-Playing Game
License: GPL-3.0-only
AuthorName: hellArcom
SourceCode: https://github.com/hellArcom/life_rpg
IssueTracker: https://github.com/hellArcom/life_rpg/issues
Changelog: https://github.com/hellArcom/life_rpg/releases

AutoName: Life RPG

RepoType: git
Repo: https://github.com/hellArcom/life_rpg.git

Builds:
  - versionName: 0.5.0
    versionCode: 11
    commit: 2714c1c35e3a72d7bcf6c8785b0dbc3b890e9a20
    output: build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
    srclibs:
      - flutter@stable
    rm:
      - ios
      - linux
      - windows
    prebuild:
      - flutterVersion=$(sed -n -E "s/.*flutter-version:\ '(.*)'/\1/p" .github/workflows/release.yml)
      - '[[ $flutterVersion ]]'
      - git -C $$flutter$$ checkout -f $flutterVersion
      - $$flutter$$/bin/flutter config --no-analytics
      - echo "configurations.all { exclude group:'com.google.android.play', module:'core' }" >> android/app/build.gradle
      - echo "configurations.all { exclude group:'com.google.android.play', module:'feature-delivery' }" >> android/app/build.gradle
    build:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter pub get --enforce-lockfile
      - $$flutter$$/bin/flutter build apk --release --split-per-abi --target-platform="android-arm"

