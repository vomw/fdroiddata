AutoName: Magnifier
Summary: Use your phone camera as a magnifying glass
Description: |
  Magnifier is a simple open source app that uses the phone camera as a
  magnifying glass.

  Features:
  * Adjust zoom level easily
  * Turn the flashlight on or off
  * Freeze the current image
  * Save the current view

RepoType: git
Repo: https://github.com/itamarc/Magnifier.git

