Categories:
  - Security
  - System
License: AGPL-3.0-or-later
AuthorName: Bernd Fix   >Y<
AuthorEmail: brf@hoi-polloi.org
SourceCode: https://github.com/bfix/kpclientd-android
IssueTracker: https://github.com/bfix/kpclientd-android/issues

AutoName: KP Daemon

RepoType: git
Repo: https://github.com/bfix/kpclientd-android.git

Builds:
  - versionName: 1.0.0
    versionCode: 1000000
    commit: cfad603e79448d83bd49f1e5fa963bae26346486
    subdir: apk
    sudo:
      - apt-get update
      - apt-get install -y golang-1.25-go gcc libc-dev
    gradle:
      - yes
    output: app/build/outputs/apk/release/app-arm64-v8a-release-unsigned.apk
    srclibs:
      - go@go1.26.2
      - katzenpost@v0.0.98
    prebuild:
      - export GOROOT_BOOTSTRAP=/usr/lib/go-1.25
      - pushd $$go$$/src
      - ./make.bash
      - popd
    build:
      - export GOROOT=$$go$$
      - export PATH="$GOROOT/bin:$PATH"
      - export GOOS=android
      - export GOARCH=arm64
      - export 
        CC=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android34-clang
      - export 
        CXX=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android34-clang
      - export CGO_ENABLED=1
      - export TGT=$(pwd)/app/src/main/assets/kpclientd
      - pushd $$katzenpost$$
      - go build -trimpath -o $TGT ./cmd/kpclientd
      - popd
    ndk: r28

AutoUpdateMode: Version
UpdateCheckMode: Tags
UpdateCheckName: ^v?([\d.]+)-fdroid$
UpdateCheckData: 
  apk/app/build.gradle|versionCode\s+(\d+)|apk/app/build.gradle|versionName\s+["']([\d.]+)["']
CurrentVersion: 1.0.0
CurrentVersionCode: 1000000
