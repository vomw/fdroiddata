AutoName: Anchor Chain
Description: |-
  Computes the safe anchor chain length for a sailboat
  using catenary physics. Input boat length, water depth,
  wind speed, chain weight, distance between marks and
  safety factor. Shows the result with a scaled catenary
  plot including the boat, the chain and the marks.

