AutoName: Anchor Chain
Description: |-
  Computes the minimum anchor chain length for a sailboat
  using catenary physics. Input boat length, water depth,
  wind speed, chain weight and safety factor. Shows the
  result with a scaled catenary plot including the boat
  silhouette and chain marks every N metres.

