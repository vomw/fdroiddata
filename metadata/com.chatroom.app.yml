Name: Chat Room
Summary:
  en-US: Real-time messaging client with file sharing (up to 4 GB)
  zh-CN: 即时通讯客户端，支持文件分享（最大 4 GB）
  zh-TW: 即時通訊用戶端，支援檔案分享（最大 4 GB）

Description: |
  Chat Room is an Android client for the Chat Room real-time
  messaging server. It supports text messaging, file sharing (up to
  4 GB), and account management with a configurable server URL.

Features:
  • Real-time text chat via WebSocket (Socket.IO)
  • File upload and download (up to 4 GB)
  • Account registration with invite code + Turnstile verification
  • Password change and account deletion
  • Configurable server URL — use your own self-hosted server
  • "Remember me" for persistent login sessions
  • Material3 design with dark/light theme support

Requirements:
  • This project depends on a server deployed according to https://github.com/44114/room.
  • Android 8.0 (Oreo) or later

