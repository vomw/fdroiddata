Name: Chat Room

Features:
  * Real-time text chat via WebSocket (Socket.IO)
  * File upload and download (up to 4 GB)
  * Account registration with invite code + Turnstile verification
  * Password change and account deletion
  * Configurable server URL — use your own self-hosted server
  * "Remember me" for persistent login sessions
  * Material3 design with dark/light theme support

