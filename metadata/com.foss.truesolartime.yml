Summary: Android Widget for the home screen to display True Solar Time

Description: |-
  An Android Widget for the home screen that displays the True Solar Time (TLT) 
  based on your current longitude and the equation of time. It provides real-time 
  astronomical data, including time deviation and the current daily trend of the 
  Equation of Time (EoT).

