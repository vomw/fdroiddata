Builds:
  - versionName: 1.5.2
    versionCode: 11
    commit: v1.5.2
    subdir: app
    sudo:
      - echo "deb https://deb.debian.org/debian trixie main" > /etc/apt/sources.list.d/trixie.list
      - apt-get update
      - apt-get install -y -t trixie openjdk-21-jdk-headless
      - update-alternatives --auto java
      - yes | /opt/android-sdk/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null
      - /opt/android-sdk/cmdline-tools/latest/bin/sdkmanager --install "platforms;android-37"
      - if [ -d /opt/android-sdk/platforms/android-37.0 ] && [ ! -e /opt/android-sdk/platforms/android-37 ]; then ln -sfn /opt/android-sdk/platforms/android-37.0 /opt/android-sdk/platforms/android-37; fi
    gradle:
      - stable
    output: build/outputs/apk/stable/release/AniSync-v1.5.2-universal-release.apk

AllowedAPKSigningKeys: bdf6c7c1242c1ac45f1bc44c9c7c04fc49c33489dacb11013c4d611a338af9db

MaintainerNotes: |
  App ID: com.anisync.android (stable flavor; the preview flavor has .preview suffix and is not submitted).
  Build notes:
  - Kotlin 2.2.21 / AGP 9.1.0 / Gradle 9.3.1. JDK 21 installed from Debian trixie via sudo.
  - Apollo GraphQL schema is committed at app/src/main/graphql/schema.graphqls; no network at build time.
  - Room schemas are committed under app/schemas.
  - Release builds disable VCS info embedding (vcsInfo.include = false) for reproducibility.
  - F-Droid auto-strips the signingConfig assignment ("Cleaned build.gradle.kts of keysigning configs"); no prebuild needed.
  - SDK Platform 37 is still in preview (installs to /opt/android-sdk/platforms/android-37.0 but AGP/R8 expects "android-37"); sudo: installs the platform eagerly and symlinks android-37 -> android-37.0 so the build can find it.
  - ABI splits produce arm64/armv7/x86/x86_64 APKs plus a universal APK; only the universal is consumed by F-Droid via output:.

