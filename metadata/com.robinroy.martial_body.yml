Categories:
  - Sports & Health
License: GPL-3.0-or-later
AuthorName: Robin Roy
SourceCode: https://github.com/BloodBlinker/martial-body
IssueTracker: https://github.com/BloodBlinker/martial-body/issues

AutoName: Martial Body

RepoType: git
Repo: https://github.com/BloodBlinker/martial-body

Builds:
  - versionName: 1.0.0
    versionCode: 1
    commit: d05074659175170c5fd772c12d1e9b0cc2fb7131
    subdir: martial_body
    output: build/app/outputs/flutter-apk/app-*-release.apk
    srclibs:
      - flutter@stable
    prebuild:
      - flutterVersion=$(sed -n -E "s/.*flutter-version:\ '(.*)'/\1/p" ../.github/workflows/release.yml)
      - '[[ $flutterVersion ]]'
      - git -C $$flutter$$ checkout -f $flutterVersion
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get
    build: $$flutter$$/bin/flutter build apk --release --split-per-abi
    scanignore:
      - martial_body/.pub-cache

AutoUpdateMode: Version
UpdateCheckMode: Tags ^v[\d.]+$
UpdateCheckData: martial_body/pubspec.yaml|version:\s.+\+(\d+)|.|version:\s(.+)\+
CurrentVersion: 1.0.0
CurrentVersionCode: 1
