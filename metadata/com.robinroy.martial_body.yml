Categories:
  - Sports & Health
License: GPL-3.0-or-later
AuthorName: Robin Roy
SourceCode: https://github.com/BloodBlinker/martial-body
IssueTracker: https://github.com/BloodBlinker/martial-body/issues

AutoName: Martial Body

RepoType: git
Repo: https://github.com/BloodBlinker/martial-body

Builds:
  - versionName: 1.0.0
    versionCode: 1
    commit: v1.0
    subdir: martial_body
    output: build/app/outputs/flutter-apk/app-release.apk
    srclibs:
      - flutter@stable
    prebuild:
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get
    build: $$flutter$$/bin/flutter build apk --release
    postbuild: |
      # Post-build: Remove Google Play Core classes that Flutter's engine includes for optional
      # deferred components support. These classes are compiled into Flutter's engine (not a separate
      # dependency) so they can't be excluded at build time. This app doesn't use deferred components,
      # so the classes are unused and R8 can't remove them because FlutterEngine references the manager.
      # We remove them from the DEX file after the build completes.
      if command -v apktool &> /dev/null; then
        mkdir -p /tmp/apk_strip/{decode,build};
        cd /tmp/apk_strip/decode;
        apktool d -f "$APK_PATH" -o . || exit 0;
        rm -rf smali*/com/google/android/play || true;
        apktool b . -o ../app-stripped.apk || exit 0;
        if [ -f ../app-stripped.apk ]; then
          cp ../app-stripped.apk "$APK_PATH";
          echo "Removed Play Core classes from APK";
        fi;
      fi

AutoUpdateMode: Version
UpdateCheckMode: Tags ^v[\d.]+$
UpdateCheckData: martial_body/pubspec.yaml|version:\s.+\+(\d+)|.|version:\s(.+)\+
CurrentVersion: 1.0.0
CurrentVersionCode: 1
