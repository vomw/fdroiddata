Categories:
  - Sports & Health
License: GPL-3.0-or-later
AuthorName: Robin Roy
SourceCode: https://github.com/BloodBlinker/martial-body
IssueTracker: https://github.com/BloodBlinker/martial-body/issues

RepoType: git
Repo: https://github.com/BloodBlinker/martial-body

Builds:
  - versionName: 1.0.0
    versionCode: 1
    commit: v1.0
    subdir: martial_body
    output: build/app/outputs/flutter-apk/app-release.apk
    srclibs:
      - flutter@stable
    prebuild:
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get
    build: $$flutter$$/bin/flutter build apk --release

AutoUpdateMode: Version
UpdateCheckMode: Tags ^v[\d.]+$
UpdateCheckData: martial_body/pubspec.yaml|version:\s.+\+(\d+)|.|version:\s(.+)\+
CurrentVersion: 1.0.0
CurrentVersionCode: 1
